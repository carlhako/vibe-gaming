<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sopwith Enhanced</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:monospace}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#touch-controls{display:none;position:fixed;bottom:0;left:0;right:0;padding:8px;justify-content:space-between;pointer-events:none;z-index:10}
.tc-group{display:flex;gap:6px;pointer-events:all}
.tc-btn{width:58px;height:58px;background:rgba(0,180,180,0.35);color:#55ffff;border:2px solid #55ffff;border-radius:10px;font-size:9px;font-family:monospace;font-weight:bold;touch-action:none;white-space:pre-line;line-height:1.3;text-align:center;cursor:pointer;user-select:none}
.tc-btn:active{background:rgba(0,180,180,0.7)}
.tc-btn.off{background:rgba(180,0,0,0.35);border-color:#ff5555;color:#ff5555}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch-controls">
  <div class="tc-group">
    <button class="tc-btn" id="btn-up">▲\nPITCH\nUP</button>
    <button class="tc-btn" id="btn-dn">▼\nPITCH\nDOWN</button>
    <button class="tc-btn" id="btn-acc">ACCEL\n(X)</button>
    <button class="tc-btn" id="btn-dec">DECEL\n(\\)</button>
  </div>
  <div class="tc-group">
    <button class="tc-btn" id="btn-fire">🔫\nFIRE</button>
    <button class="tc-btn" id="btn-bomb">💣\nBOMB</button>
    <button class="tc-btn" id="btn-enemies">✈️\nPLANES\nON</button>
  </div>
</div>
<script>
// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const W=320,H=200,WORLD_W=8192,GROUND_BASE=155;
const C0='#000000',C1='#55FFFF',C2='#FF55FF',C3='#FFFFFF';

// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=W;canvas.height=H;
function resize(){
  const s=Math.max(1,Math.min(Math.floor(innerWidth/W),Math.floor(innerHeight/H)));
  canvas.style.width=W*s+'px';canvas.style.height=H*s+'px';
}
resize();addEventListener('resize',resize);

// ─── AUDIO ──────────────────────────────────────────────────────────────────
let audioCtx=null,soundOn=true;
let engineOsc=null,engineGain=null;
function initAudio(){
  if(audioCtx)return;
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function beep(freq,dur,type='square',vol=0.1,delay=0){
  if(!soundOn||!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type=type;o.frequency.value=freq;
    const t=audioCtx.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur);
  }catch(e){}
}
function sndGun(){beep(880,0.04,'square',0.07);beep(440,0.03,'square',0.04,0.02);}
function sndBomb(){beep(180,0.08,'sawtooth',0.12);beep(90,0.5,'sawtooth',0.18,0.05);}
function sndExplode(big){
  beep(big?120:200,big?0.6:0.3,'sawtooth',big?0.2:0.12);
  if(big)beep(60,0.8,'sawtooth',0.15,0.1);
}
function sndCrash(){beep(300,0.1,'sawtooth',0.18);beep(150,0.4,'sawtooth',0.14,0.1);}
function sndLand(){beep(220,0.1,'square',0.07);}
function sndPowerUp(){beep(660,0.06,'square',0.08);beep(880,0.06,'square',0.08,0.06);beep(1100,0.08,'square',0.08,0.12);}
function sndWaveClear(){beep(440,0.1,'square',0.12);beep(660,0.1,'square',0.12,0.12);beep(880,0.15,'square',0.14,0.24);}
function startEngine(){
  if(!audioCtx||engineOsc)return;
  try{
    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();
    engineOsc.connect(engineGain);engineGain.connect(audioCtx.destination);
    engineOsc.type='sawtooth';engineOsc.frequency.value=90;engineGain.gain.value=0.03;
    engineOsc.start();
  }catch(e){}
}
function updateEngineSound(throttle,speed){
  if(!engineOsc)return;
  engineGain.gain.value=soundOn?(0.012+throttle*0.028):0;
  engineOsc.frequency.value=50+throttle*75+speed*4;
}

// ─── TERRAIN ────────────────────────────────────────────────────────────────
const terrain=new Float32Array(WORLD_W);
(function genTerrain(){
  // Flat runway near base
  for(let x=0;x<500;x++)terrain[x]=GROUND_BASE;
  for(let x=WORLD_W-500;x<WORLD_W;x++)terrain[x]=GROUND_BASE;

  // Rolling terrain with plateaus
  for(let x=500;x<WORLD_W-500;x++){
    let h=GROUND_BASE;
    h-=18*Math.sin(x/600+0.5);
    h-=12*Math.sin(x/250+1.2);
    h-=7*Math.sin(x/110+2.1);
    h-=4*Math.sin(x/55+3.7);
    h-=20*Math.sin(x/950+0.3);
    // Occasional plateau sections
    const plateau=Math.sin(x/1800)*Math.sin(x/2200);
    if(plateau>0.7)h=GROUND_BASE-18+plateau*6;
    if(h<68)h=68;if(h>GROUND_BASE)h=GROUND_BASE;
    terrain[x]=h;
  }
  // Smooth
  for(let pass=0;pass<4;pass++){
    for(let x=1;x<WORLD_W-1;x++){
      terrain[x]=(terrain[x-1]+terrain[x]*2+terrain[x+1])/4;
    }
  }
  // Flatten friendly base area
  for(let x=0;x<450;x++)terrain[x]=GROUND_BASE;
  for(let x=WORLD_W-450;x<WORLD_W;x++)terrain[x]=GROUND_BASE;
})();
function tY(x){const ix=Math.round(x);if(ix<0)return GROUND_BASE;if(ix>=WORLD_W)return GROUND_BASE;return terrain[ix];}

// ─── GAME STATE ─────────────────────────────────────────────────────────────
let player,bullets,bombs,enemyPlanes,birdFlocks,explosions,buildings,powerUps,clouds;
let camX=0,frameN=0,gameState='title',score=0,lives=3,highScore=0;
let enemiesEnabled=true,autoFireTimer=0,respawnTimer=0,wave=1;
let waveTransitionTimer=0,comboCount=0,comboTimer=0;
let shakeIntensity=0,shakeX=0,shakeY=0;

// ─── PLAYER ─────────────────────────────────────────────────────────────────
function mkPlayer(){
  return{
    x:180,y:GROUND_BASE-25,vx:1.5,vy:0,angle:0,throttle:0.4,speed:1.5,
    onGround:false,alive:true,hp:5,maxHp:5,invulnTimer:0,
    fuel:1000,maxFuel:1000,ammo:200,maxAmmo:200,bombCount:20,maxBombs:20,
    exhaustParticles:[]
  };
}

// ─── BUILDINGS ──────────────────────────────────────────────────────────────
function spawnBuildings(w){
  buildings=[];
  // Friendly hangar
  buildings.push({x:160,y:GROUND_BASE,type:'hangar',friendly:true,alive:true,hp:999});
  // Enemy base hangar
  buildings.push({x:WORLD_W-300,y:GROUND_BASE,type:'hangar',friendly:false,alive:true,hp:3+Math.floor(w/2)});

  const count=6+Math.min(w*2,14);
  const spacing=(WORLD_W-1000)/count;
  const types=['building','building','bunker','building','tower','building','bunker'];
  for(let i=0;i<count;i++){
    const bx=600+i*spacing+(Math.random()-0.5)*spacing*0.6;
    const ty=tY(bx);
    const btype=types[i%types.length];
    const bhp=btype==='bunker'?1+Math.floor(w/3):(btype==='tower'?1+Math.floor(w/4):1+Math.floor(w/5));
    buildings.push({x:bx,y:ty,type:btype,friendly:false,alive:true,hp:Math.max(1,bhp)});
  }
}

// ─── POWER-UPS ──────────────────────────────────────────────────────────────
function spawnPowerUp(x,y){
  const r=Math.random();
  let type='ammo';
  if(r<0.4)type='ammo';
  else if(r<0.8)type='fuel';
  else type='repair';
  powerUps.push({x,y:y-10,type,life:600,vy:-1.5,bob:0});
}

// ─── ENEMIES ────────────────────────────────────────────────────────────────
function spawnEnemy(type){
  if(!enemiesEnabled)return;
  const side=Math.random()<0.5?1:-1;
  const ex=side>0?(4000+Math.random()*3000):(500+Math.random()*2500);
  const ang=side>0?Math.PI:0;
  const isBomber=type==='bomber';
  enemyPlanes.push({
    x:ex,y:50+Math.random()*60,vx:side>0?-1.6:1.6,vy:0,
    angle:ang,speed:isBomber?1.3+Math.random()*0.4:1.8+Math.random()*0.6,
    alive:true,hp:isBomber?3:1,maxHp:isBomber?3:1,
    fireTimer:Math.floor(Math.random()*80+40),aiMode:'patrol',
    patrolDir:side>0?1:-1,patrolY:45+Math.random()*55,
    state:'alive',deathTimer:0,isBomber
  });
}

function spawnWaveEnemies(w){
  if(!enemiesEnabled)return;
  const fighters=2+Math.min(w*2,12);
  const bombers=Math.max(0,Math.floor((w-1)/2));
  for(let i=0;i<fighters;i++)spawnEnemy('fighter');
  for(let i=0;i<bombers;i++)spawnEnemy('bomber');
}

// ─── BIRDS ──────────────────────────────────────────────────────────────────
function initBirds(){
  birdFlocks=[];
  for(let i=0;i<5;i++){
    birdFlocks.push({
      x:1000+i*1400+Math.random()*500,y:35+Math.random()*35,
      scattered:false,alive:true,
      scatterVels:Array.from({length:10},()=>({
        vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*2,
        ox:(Math.random()-0.5)*60,oy:(Math.random()-0.5)*10
      }))
    });
  }
}

// ─── CLOUDS ─────────────────────────────────────────────────────────────────
function initClouds(){
  clouds=[];
  for(let i=0;i<18;i++){
    clouds.push({
      x:Math.random()*WORLD_W,y:10+Math.random()*60,
      w:30+Math.random()*70,h:8+Math.random()*10,
      speed:0.15+Math.random()*0.35
    });
  }
}

// ─── PARTICLES ──────────────────────────────────────────────────────────────
let looseParticles=[];
function addParticles(x,y,count,color,life,spread){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=0.5+Math.random()*spread;
    looseParticles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:8+Math.random()*life,color});
  }
}

// ─── START GAME ─────────────────────────────────────────────────────────────
function startGame(){
  score=0;lives=3;wave=1;comboCount=0;comboTimer=0;
  bullets=[];bombs=[];explosions=[];enemyPlanes=[];powerUps=[];looseParticles=[];
  player=mkPlayer();
  spawnBuildings(wave);
  initBirds();
  initClouds();
  spawnWaveEnemies(wave);
  camX=0;frameN=0;autoFireTimer=0;
  shakeIntensity=0;
  gameState='playing';
  startEngine();
}

// ─── NEXT WAVE ──────────────────────────────────────────────────────────────
function nextWave(){
  wave++;
  spawnBuildings(wave);
  spawnWaveEnemies(wave);
  // Partial resupply
  player.fuel=Math.min(player.maxFuel,player.fuel+300);
  player.ammo=Math.min(player.maxAmmo,player.ammo+80);
  player.bombCount=Math.min(player.maxBombs,player.bombCount+8);
  player.hp=Math.min(player.maxHp,player.hp+1);
  // Bonus
  const bonus=wave*500;
  score+=bonus;
  addParticles(player.x,player.y,20,C3,25,3);
  sndWaveClear();
  gameState='playing';
}

// ─── KEYS ───────────────────────────────────────────────────────────────────
const keys={};
const blockKeys=new Set([' ','b','B',',','.','/','\\',"'",';','x','X','s','S','h','H','r','R','p','P']);
addEventListener('keydown',e=>{
  if(blockKeys.has(e.key))e.preventDefault();
  if(!keys[e.key]){
    if(gameState==='playing'){
      if(e.key===' ')fireGun();
      if(e.key==='b'||e.key==='B')dropBomb();
      if(e.key==='s'||e.key==='S'){soundOn=!soundOn;updateEngineSound(player.throttle,player.speed);}
      if(e.key==='p'||e.key==='P')toggleEnemies();
    }
    if((e.key==='r'||e.key==='R')&&(gameState==='gameover'))startGame();
    if(gameState==='title'){
      if(e.key==='p'||e.key==='P'){toggleEnemies();return;}
      initAudio();startGame();
    }
    if(gameState==='waveComplete'&&waveTransitionTimer<100){
      waveTransitionTimer=0;
    }
  }
  keys[e.key]=true;
});
addEventListener('keyup',e=>{keys[e.key]=false;});

function toggleEnemies(){
  enemiesEnabled=!enemiesEnabled;
  if(!enemiesEnabled){
    enemyPlanes=[];
    bullets=bullets.filter(b=>b.owner!=='enemy');
  }else{
    if(gameState==='playing')spawnWaveEnemies(wave);
  }
  const btn=document.getElementById('btn-enemies');
  if(btn){
    btn.textContent='✈️\nPLANES\n'+(enemiesEnabled?'ON':'OFF');
    if(enemiesEnabled)btn.classList.remove('off');else btn.classList.add('off');
  }
}

// ─── TOUCH ──────────────────────────────────────────────────────────────────
function setupTouch(){
  if(!('ontouchstart'in window))return;
  document.getElementById('touch-controls').style.display='flex';
  function btn(id,key,ondown){
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true;if(ondown)ondown();},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false;},{passive:false});
  }
  btn('btn-up',',');
  btn('btn-dn','.');
  btn('btn-acc','x');
  btn('btn-dec','\\');
  btn('btn-fire',' ',fireGun);
  btn('btn-bomb','b',dropBomb);
  const enemyBtn=document.getElementById('btn-enemies');
  enemyBtn.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(gameState==='playing'||gameState==='title')toggleEnemies();
  },{passive:false});
  canvas.addEventListener('click',()=>{
    if(gameState==='title'){initAudio();startGame();}
  });
}
setupTouch();

// ─── ACTIONS ────────────────────────────────────────────────────────────────
function fireGun(){
  if(!player||!player.alive||player.ammo<=0)return;
  player.ammo--;
  const spd=8;
  bullets.push({
    x:player.x+Math.cos(player.angle)*16,y:player.y+Math.sin(player.angle)*16,
    vx:Math.cos(player.angle)*spd+player.vx*0.5,vy:Math.sin(player.angle)*spd+player.vy*0.5,
    life:55,owner:'player'
  });
  sndGun();
}
function dropBomb(){
  if(!player||!player.alive||player.bombCount<=0)return;
  player.bombCount--;
  bombs.push({x:player.x,y:player.y+6,vx:player.vx,vy:Math.abs(player.vy)*0.3+0.5,life:250});
  sndBomb();
}
function addExplosion(x,y,big){
  explosions.push({x,y,t:0,maxT:big?38:20,big});
  addParticles(x,y,big?16:6,big?C2:C3,big?22:10,big?3:1.5);
  sndExplode(big);
  shakeIntensity=Math.max(shakeIntensity,big?8:3);
}
function damagePlayer(dmg){
  if(!player.alive||player.invulnTimer>0)return;
  player.hp-=dmg;
  player.invulnTimer=90;
  shakeIntensity=Math.max(shakeIntensity,5);
  addParticles(player.x,player.y,8,C2,15,2);
  if(player.hp<=0){
    player.hp=0;
    killPlayer();
  }
}
function killPlayer(){
  if(!player.alive)return;
  player.alive=false;lives--;
  addExplosion(player.x,player.y,true);
  sndCrash();
  gameState='dead';respawnTimer=140;
  comboCount=0;comboTimer=0;
}
function respawnPlayer(){
  const p=mkPlayer();
  player.x=p.x;player.y=p.y;player.vx=p.vx;player.vy=p.vy;
  player.angle=p.angle;player.throttle=p.throttle;player.speed=p.speed;
  player.onGround=p.onGround;player.alive=true;player.fuel=p.fuel;
  player.ammo=p.ammo;player.bombCount=p.bombCount;player.hp=p.hp;
  player.maxHp=p.maxHp;player.invulnTimer=120;
  gameState='playing';
}

// ─── UPDATE ─────────────────────────────────────────────────────────────────
function update(){
  frameN++;
  // Update shake
  if(shakeIntensity>0.1){shakeIntensity*=0.88;shakeX=(Math.random()-0.5)*shakeIntensity;shakeY=(Math.random()-0.5)*shakeIntensity;}
  else{shakeIntensity=0;shakeX=0;shakeY=0;}

  if(gameState==='dead'){
    respawnTimer--;
    updateExplosions();updateLooseParticles();
    if(respawnTimer<=0){
      if(lives>0)respawnPlayer();
      else gameState='gameover';
    }
    return;
  }
  if(gameState==='waveComplete'){
    waveTransitionTimer--;
    updateExplosions();updateLooseParticles();
    if(waveTransitionTimer<=0)nextWave();
    return;
  }
  if(gameState!=='playing')return;

  updatePlayer();
  updateBullets();
  updateBombs();
  updateEnemies();
  updateBirds();
  updateExplosions();
  updatePowerUps();
  updateLooseParticles();
  updateClouds();

  // Combo timer
  if(comboTimer>0){comboTimer--;if(comboTimer<=0)comboCount=0;}

  // Check wave complete
  const enemyBuildingsLeft=buildings.filter(b=>!b.friendly&&b.alive).length;
  if(enemyBuildingsLeft===0&&gameState==='playing'){
    gameState='waveComplete';waveTransitionTimer=150;
    score+=comboCount>0?comboCount*250:0;
  }
}

function updatePlayer(){
  if(!player.alive)return;
  if(player.invulnTimer>0)player.invulnTimer--;
  const p=player;

  // Throttle
  if(keys['x']||keys['X'])p.throttle=Math.min(1,p.throttle+0.018);
  if(keys['\\'])p.throttle=Math.max(0,p.throttle-0.018);

  // Pitch
  const pitchRate=0.048;
  if(keys[','])p.angle-=pitchRate;
  if(keys['.']||keys['/'])p.angle+=pitchRate;
  if(p.angle>Math.PI)p.angle-=Math.PI*2;
  if(p.angle<-Math.PI)p.angle+=Math.PI*2;

  // Thrust
  const thrust=p.throttle*0.13;
  p.vx+=Math.cos(p.angle)*thrust;
  p.vy+=Math.sin(p.angle)*thrust;

  // Gravity
  p.vy+=0.08;

  // Aerodynamic lift - speed-dependent, smoother curve
  const absVx=Math.abs(p.vx);
  let lift=0;
  if(absVx>1.5)lift=(absVx-1.5)*0.025;
  lift=Math.min(lift,0.26);
  p.vy-=lift;

  // Drag
  const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
  p.vx*=0.975;p.vy*=0.975;

  // Speed
  p.speed=spd;

  // Stall
  if(spd<0.6&&!p.onGround)p.vy+=0.22;

  // Ground effect
  const ty=tY(p.x);
  const distAbove=ty-12-p.y;
  if(distAbove>0&&distAbove<20&&!p.onGround){
    p.vy-=0.04*(1-distAbove/20);
  }

  // Move
  p.x+=p.vx;p.y+=p.vy;

  // World bounds
  if(p.x<10){p.x=10;p.vx=Math.abs(p.vx)*0.4;}
  if(p.x>WORLD_W-10){p.x=WORLD_W-10;p.vx=-Math.abs(p.vx)*0.4;}
  if(p.y<5){p.y=5;p.vy=Math.abs(p.vy)*0.3;}

  // Terrain collision
  const groundLevel=ty-12;
  if(p.y>=groundLevel){
    if(p.onGround||(spd<5.5&&Math.abs(p.angle)<0.75&&p.vy<3)){
      p.y=groundLevel;
      if(p.vy>0)p.vy=0;
      p.vx*=0.985;
      if(!p.onGround)sndLand();
      p.onGround=true;
      // Refuel/rearm/repair at base
      if(p.x<450){
        p.fuel=Math.min(p.maxFuel,p.fuel+8);
        p.ammo=Math.min(p.maxAmmo,p.ammo+2);
        p.bombCount=Math.min(p.maxBombs,p.bombCount+0.3);
        if(p.hp<p.maxHp&&frameN%30===0)p.hp=Math.min(p.maxHp,p.hp+1);
      }
    }else{
      p.onGround=false;
      killPlayer();return;
    }
  }else{p.onGround=false;}

  // Fuel
  p.fuel-=p.throttle*0.06;
  if(p.fuel<=0){p.fuel=0;p.throttle=Math.max(0,p.throttle-0.05);}

  // Exhaust particles
  if(p.throttle>0.15&&frameN%3===0){
    const ex=p.x-Math.cos(p.angle)*14;
    const ey=p.y-Math.sin(p.angle)*14;
    looseParticles.push({x:ex,y:ey,vx:-Math.cos(p.angle)*0.5+(Math.random()-0.5)*0.8,vy:-Math.sin(p.angle)*0.5+(Math.random()-0.5)*0.8,life:6+Math.random()*8,color:'#335555'});
  }
  // Smoke if damaged
  if(p.hp<=2&&frameN%4===0){
    looseParticles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2-1,life:10+Math.random()*12,color:C0});
  }

  // Continuous fire
  autoFireTimer--;
  if(keys[' ']&&autoFireTimer<=0){fireGun();autoFireTimer=10;}

  // Camera
  camX=p.x-W/2;
  camX=Math.max(0,Math.min(WORLD_W-W,camX));

  updateEngineSound(p.throttle,p.speed);
}

function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.vy+=0.04;b.life--;
    let remove=false;
    if(b.y>=tY(b.x)){addExplosion(b.x,b.y,false);remove=true;}

    if(!remove&&b.owner==='player'){
      for(const e of enemyPlanes){
        if(e.state!=='alive')continue;
        if(Math.abs(b.x-e.x)<13&&Math.abs(b.y-e.y)<10){
          e.hp--;remove=true;
          addParticles(b.x,b.y,4,C2,8,1.5);
          if(e.hp<=0){killEnemy(e);}
          break;
        }
      }
      if(!remove){
        for(const bl of buildings){
          if(!bl.alive||bl.friendly)continue;
          const bw=bl.type==='hangar'?28:14;
          const bh=bl.type==='hangar'?20:bl.type==='tower'?28:16;
          if(b.x>bl.x-bw&&b.x<bl.x+bw&&b.y>bl.y-bh&&b.y<bl.y+2){
            bl.hp--;remove=true;
            addParticles(b.x,b.y,4,C3,6,1);
            if(bl.hp<=0){destroyBuilding(bl);}
            break;
          }
        }
      }
      if(!remove){
        for(const fk of birdFlocks){
          if(!fk.alive||fk.scattered)continue;
          if(Math.abs(b.x-fk.x)<80&&Math.abs(b.y-fk.y)<12){fk.scattered=true;remove=true;score+=10;break;}
        }
      }
    }

    if(!remove&&b.owner==='enemy'){
      if(player.alive&&player.invulnTimer<=0&&Math.abs(b.x-player.x)<12&&Math.abs(b.y-player.y)<10){
        damagePlayer(1);remove=true;
      }
    }
    if(remove||b.life<=0)bullets.splice(i,1);
  }
}

function updateBombs(){
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];
    b.vx*=0.995;b.vy+=0.18;b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.y>=tY(b.x)||b.life<=0){
      addExplosion(b.x,Math.min(b.y,tY(b.x)),true);
      for(const bl of buildings){
        if(!bl.alive||bl.friendly)continue;
        if(Math.abs(b.x-bl.x)<50){bl.hp-=2;if(bl.hp<=0)destroyBuilding(bl);}
      }
      for(const e of enemyPlanes){
        if(e.state!=='alive')continue;
        const d=Math.sqrt((b.x-e.x)**2+(b.y-e.y)**2);
        if(d<45){e.hp-=2;if(e.hp<=0)killEnemy(e);}
      }
      bombs.splice(i,1);
    }
  }
}

function killEnemy(e){
  e.state='dying';e.deathTimer=35;
  addParticles(e.x,e.y,8,C2,12,2);
  comboCount++;comboTimer=180;
  const pts=(e.isBomber?200:100)*comboCount;
  score+=pts;
}
function destroyBuilding(bl){
  bl.alive=false;
  addExplosion(bl.x,bl.y-10,true);
  comboCount++;comboTimer=180;
  score+=75*comboCount;
  // Chance to spawn power-up
  if(Math.random()<0.4)spawnPowerUp(bl.x,bl.y);
}

function updateEnemies(){
  if(!enemiesEnabled)return;
  // Spawn new enemies periodically
  if(frameN%280===0&&enemyPlanes.filter(e=>e.state==='alive').length<6+wave){
    spawnEnemy(Math.random()<0.3?'bomber':'fighter');
  }

  for(const e of enemyPlanes){
    if(e.state==='dying'){
      e.deathTimer--;
      e.angle+=0.22;
      e.y+=2.5;
      e.x+=e.vx*0.3;
      if(frameN%2===0)looseParticles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2-1,life:8+Math.random()*8,color:C0});
      if(e.deathTimer<=0){
        addExplosion(e.x,e.y,true);
        e.state='dead';
      }
      continue;
    }
    if(e.state!=='alive')continue;

    if(player.alive){
      const dx=player.x-e.x,dy=player.y-e.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const targetAng=Math.atan2(dy,dx);
      let da=targetAng-e.angle;
      while(da>Math.PI)da-=Math.PI*2;
      while(da<-Math.PI)da+=Math.PI*2;

      if(e.isBomber){
        // Bomber: fly straight, bomb occasionally
        if(dist<350&&Math.abs(da)<0.4){
          e.fireTimer--;
          if(e.fireTimer<=0){
            e.fireTimer=90+Math.random()*80;
            bombs.push({x:e.x,y:e.y+6,vx:e.vx,vy:1.5,life:200});
          }
        }
        e.angle+=da*0.015;
      }else{
        // Fighter: engage player
        e.angle+=da*0.03;
        e.fireTimer--;
        if(e.fireTimer<=0&&dist<300&&Math.abs(da)<0.5){
          e.fireTimer=40+Math.random()*50;
          const spd=6;
          bullets.push({
            x:e.x+Math.cos(e.angle)*14,y:e.y+Math.sin(e.angle)*14,
            vx:Math.cos(e.angle)*spd+(Math.random()-0.5)*1.5,vy:Math.sin(e.angle)*spd+(Math.random()-0.5)*1.5,
            life:55,owner:'enemy'
          });
        }
      }
    }

    const thrust=e.isBomber?0.07:0.1;
    e.vx+=Math.cos(e.angle)*thrust;
    e.vy+=Math.sin(e.angle)*thrust;
    e.vy+=0.03;
    const spd=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
    if(spd>e.speed){e.vx=e.vx/spd*e.speed;e.vy=e.vy/spd*e.speed;}
    e.vx*=0.975;e.vy*=0.975;
    e.x+=e.vx;e.y+=e.vy;

    if(e.x<200){e.vx=Math.abs(e.vx)+0.5;e.angle=0;}
    if(e.x>WORLD_W-200){e.vx=-(Math.abs(e.vx)+0.5);e.angle=Math.PI;}
    if(e.y<25){e.vy=Math.abs(e.vy);}
    const ety=tY(e.x)-25;
    if(e.y>ety){e.y=ety;e.vy=-Math.abs(e.vy)*0.4;}

    // Smoke if damaged
    if(e.hp<e.maxHp&&frameN%5===0){
      looseParticles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*1,vy:(Math.random()-0.5)*1-0.5,life:8+Math.random()*6,color:'#333333'});
    }

    // Collision with player
    if(player.alive&&player.invulnTimer<=0&&Math.abs(e.x-player.x)<14&&Math.abs(e.y-player.y)<12){
      damagePlayer(2);
      e.hp--;
      if(e.hp<=0)killEnemy(e);
    }
  }
  // Clean up dead enemies
  enemyPlanes=enemyPlanes.filter(e=>e.state!=='dead');
}

function updateBirds(){
  for(const fk of birdFlocks){
    if(!fk.alive)continue;
    if(!fk.scattered){
      fk.x+=0.7+Math.sin(frameN*0.02)*0.3;
      if(fk.x>WORLD_W-200)fk.x=200;
      if(player.alive&&player.invulnTimer<=0&&Math.abs(player.x-fk.x)<75&&Math.abs(player.y-fk.y)<14){
        fk.scattered=true;damagePlayer(1);
      }
    }else{
      for(const bv of fk.scatterVels){
        bv.ox+=bv.vx;bv.oy+=bv.vy;
        bv.vx+=(Math.random()-0.5)*0.3;bv.vy+=(Math.random()-0.5)*0.3;
      }
    }
  }
}

function updatePowerUps(){
  for(let i=powerUps.length-1;i>=0;i--){
    const pu=powerUps[i];
    pu.life--;pu.bob+=0.06;pu.y+=Math.sin(pu.bob)*0.3;
    if(pu.life<=0){powerUps.splice(i,1);continue;}
    if(player.alive&&Math.abs(player.x-pu.x)<18&&Math.abs(player.y-pu.y)<18){
      if(pu.type==='ammo'){player.ammo=Math.min(player.maxAmmo,player.ammo+50);}
      else if(pu.type==='fuel'){player.fuel=Math.min(player.maxFuel,player.fuel+200);}
      else if(pu.type==='repair'){player.hp=Math.min(player.maxHp,player.hp+2);}
      sndPowerUp();
      addParticles(pu.x,pu.y,10,C1,15,2);
      powerUps.splice(i,1);
    }
  }
}

function updateExplosions(){
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].t++;
    if(explosions[i].t>=explosions[i].maxT)explosions.splice(i,1);
  }
}

function updateLooseParticles(){
  for(let i=looseParticles.length-1;i>=0;i--){
    const lp=looseParticles[i];
    lp.x+=lp.vx;lp.y+=lp.vy;lp.life--;
    if(lp.life<=0)looseParticles.splice(i,1);
  }
}

function updateClouds(){
  for(const cl of clouds){
    cl.x+=cl.speed;
    if(cl.x>WORLD_W+200)cl.x=-200;
    if(cl.x<-200)cl.x=WORLD_W+200;
  }
}

// ─── DRAW ───────────────────────────────────────────────────────────────────
function px(wx){return wx-camX;}

function drawPlane(sx,sy,angle,color1,color2,propSpin,showWheels){
  ctx.save();ctx.translate(sx,sy);ctx.rotate(angle);
  // Fuselage
  ctx.fillStyle=color1;ctx.fillRect(-13,-4,26,8);
  // Wings
  ctx.fillRect(-10,-12,20,7);ctx.fillRect(-8,5,16,6);
  // Struts
  ctx.fillStyle=color2;ctx.fillRect(-5,-5,2,10);ctx.fillRect(3,-5,2,10);
  // Tail
  ctx.fillStyle=color1;ctx.fillRect(-15,-9,5,5);ctx.fillRect(-15,4,5,5);
  // Cockpit
  ctx.fillStyle=color2;ctx.fillRect(2,-5,5,10);
  ctx.fillStyle=C0;ctx.fillRect(3,-3,3,6);
  // Engine
  ctx.fillStyle=color2;ctx.beginPath();ctx.arc(13,0,4,0,Math.PI*2);ctx.fill();
  // Propeller
  ctx.fillStyle=color2;ctx.save();ctx.translate(16,0);ctx.rotate(propSpin);
  ctx.fillRect(-1,-9,2,18);ctx.fillRect(-3,-1,6,2);ctx.restore();
  // Wheels
  if(showWheels){
    ctx.fillStyle=color2;ctx.fillRect(-6,11,2,5);ctx.fillRect(2,11,2,5);
    ctx.fillRect(-8,16,5,2);ctx.fillRect(0,16,5,2);
  }
  ctx.restore();
}

function drawBuilding(bl){
  const sx=px(bl.x),sy=bl.y;
  if(sx<-50||sx>W+50)return;
  const fc=bl.friendly?C1:C2;
  const ac=bl.friendly?C3:C3;
  if(bl.type==='hangar'){
    ctx.fillStyle=fc;ctx.fillRect(sx-22,sy-16,44,16);
    ctx.beginPath();ctx.arc(sx,sy-16,22,-Math.PI,0);ctx.fill();
    ctx.fillStyle=C0;ctx.fillRect(sx-8,sy-12,16,12);
    ctx.fillStyle=ac;ctx.fillRect(sx-9,sy-13,1,13);ctx.fillRect(sx+8,sy-13,1,13);
  }else if(bl.type==='bunker'){
    ctx.fillStyle=fc;ctx.fillRect(sx-12,sy-10,24,10);
    ctx.beginPath();ctx.moveTo(sx-12,sy-10);ctx.lineTo(sx-6,sy-16);
    ctx.lineTo(sx+6,sy-16);ctx.lineTo(sx+12,sy-10);ctx.fill();
    ctx.fillStyle=ac;ctx.fillRect(sx+4,sy-20,8,3);
    ctx.fillStyle=C0;ctx.fillRect(sx-8,sy-8,6,5);
  }else if(bl.type==='tower'){
    ctx.fillStyle=fc;ctx.fillRect(sx-5,sy-28,10,28);
    ctx.fillRect(sx-9,sy-32,18,6);
    ctx.fillStyle=ac;
    for(let r=0;r<3;r++)ctx.fillRect(sx-3,sy-26+r*8,6,4);
  }else{
    const bh=14+((bl.x*7|0)%10);
    ctx.fillStyle=fc;ctx.fillRect(sx-9,sy-bh,18,bh);
    ctx.fillStyle=C0;
    for(let r=0;r<2;r++)for(let c=0;c<2;c++)ctx.fillRect(sx-7+c*9,sy-bh+3+r*6,4,4);
    ctx.fillStyle=ac;ctx.fillRect(sx-9,sy-bh,18,2);
  }
}

function drawTerrain(){
  ctx.fillStyle=C1;ctx.beginPath();
  for(let x=0;x<=W;x++){
    const wx=Math.floor(x+camX);
    const h=wx<WORLD_W?terrain[wx]:GROUND_BASE;
    if(x===0)ctx.moveTo(x,h);else ctx.lineTo(x,h);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // Top edge line
  ctx.strokeStyle=C3;ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x++){
    const wx=Math.floor(x+camX);
    const h=wx<WORLD_W?terrain[wx]:GROUND_BASE;
    if(x===0)ctx.moveTo(x,h);else ctx.lineTo(x,h);
  }
  ctx.stroke();
  // Grass tufts
  ctx.fillStyle='#226622';
  for(let x=0;x<W;x+=12){
    const wx=Math.floor(x+camX);
    if(wx<WORLD_W){
      const h=terrain[wx];
      ctx.fillRect(x+(frameN*0.3+x*7)%12-1,h-3,2,4);
    }
  }
}

function drawSky(){
  ctx.fillStyle='#001122';ctx.fillRect(0,0,W,H);
  // Stars (dim)
  ctx.fillStyle='#113344';
  for(let i=0;i<25;i++){const sx=((i*197+camX*0.01)|0+W)%W;ctx.fillRect(sx,5+(i*67)%70,1,1);}
  // Clouds
  for(const cl of clouds){
    const sx=px(cl.x);
    if(sx<-cl.w||sx>W+cl.w)continue;
    ctx.fillStyle='#224444';
    ctx.fillRect(sx,cl.y,cl.w,cl.h);
    ctx.fillRect(sx+cl.w*0.15,cl.y-3,cl.w*0.7,cl.h+3);
  }
}

function drawBirds(){
  ctx.strokeStyle=C3;ctx.lineWidth=1;
  for(const fk of birdFlocks){
    if(!fk.alive)continue;
    const sx=px(fk.x);
    if(!fk.scattered){
      if(sx<-120||sx>W+120)continue;
      for(let i=-5;i<=4;i++){
        const bx=sx+i*12+Math.sin(frameN*0.08+i)*3;
        const by=fk.y+Math.sin(frameN*0.1+i*0.7)*4;
        const flap=Math.sin(frameN*0.2+i*0.5)*3;
        ctx.beginPath();ctx.moveTo(bx-5,by+flap);ctx.lineTo(bx,by);ctx.lineTo(bx+5,by+flap);ctx.stroke();
      }
    }else{
      ctx.fillStyle=C2;
      for(const bv of fk.scatterVels){
        const bx2=sx+bv.ox,by2=fk.y+bv.oy;
        if(bx2>-5&&bx2<W+5)ctx.fillRect(bx2,by2,2,2);
      }
    }
  }
}

function drawExplosions(){
  for(const exp of explosions){
    const sx=px(exp.x);
    if(sx<-50||sx>W+50)continue;
    const prog=exp.t/exp.maxT;
    const r=(exp.big?26:12)*prog;
    // Outer ring
    ctx.fillStyle=prog<0.2?C3:(prog<0.5?C2:C0);
    ctx.beginPath();ctx.arc(sx,exp.y,r,0,Math.PI*2);ctx.fill();
    // Inner bright
    if(prog<0.4){
      ctx.fillStyle=C3;ctx.beginPath();ctx.arc(sx,exp.y,r*0.5,0,Math.PI*2);ctx.fill();
    }
    // Shockwave ring
    if(exp.big&&prog<0.6){
      ctx.strokeStyle=prog<0.3?C3:C2;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(sx,exp.y,r*1.6,0,Math.PI*2);ctx.stroke();
    }
  }
}

function drawBullets(){
  for(const b of bullets){
    const sx=px(b.x);if(sx<-4||sx>W+4)continue;
    ctx.fillStyle=b.owner==='player'?C3:C2;
    ctx.fillRect(sx-2,b.y-2,4,4);
  }
}

function drawBombs(){
  for(const b of bombs){
    const sx=px(b.x);if(sx<-6||sx>W+6)continue;
    ctx.fillStyle=C3;ctx.fillRect(sx-3,b.y-4,6,8);
    ctx.beginPath();ctx.arc(sx,b.y-4,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=C2;ctx.fillRect(sx-1,b.y+4,2,3);
  }
}

function drawPowerUps(){
  for(const pu of powerUps){
    const sx=px(pu.x);if(sx<-10||sx>W+10)continue;
    const sparkle=Math.sin(frameN*0.12+pu.x)*2;
    if(pu.type==='ammo'){
      ctx.fillStyle=C3;ctx.fillRect(sx-4,pu.y-5,8,10);
      ctx.fillStyle=C1;ctx.fillRect(sx-2,pu.y-2,4,4);
      // sparkle
      ctx.fillStyle=C3;ctx.fillRect(sx+sparkle,pu.y-8+sparkle,2,2);
    }else if(pu.type==='fuel'){
      ctx.fillStyle=C1;ctx.fillRect(sx-4,pu.y-5,8,10);
      ctx.fillStyle=C3;ctx.fillRect(sx-1,pu.y-2,2,6);
      ctx.fillStyle=C3;ctx.fillRect(sx+sparkle,pu.y-7+sparkle,2,2);
    }else{
      ctx.fillStyle=C2;ctx.fillRect(sx-4,pu.y-5,8,10);
      ctx.fillStyle=C3;ctx.fillRect(sx-2,pu.y-3,4,1);ctx.fillRect(sx,pu.y-4,1,3);
      ctx.fillStyle=C3;ctx.fillRect(sx+sparkle,pu.y-7+sparkle,2,2);
    }
    // Glow
    ctx.fillStyle='rgba(255,255,255,'+(0.15+Math.sin(frameN*0.1)*0.1)+')';
    ctx.beginPath();ctx.arc(sx,pu.y-1,8,0,Math.PI*2);ctx.fill();
  }
}

function drawLooseParticles(){
  for(const lp of looseParticles){
    const sx=px(lp.x);if(sx<-2||sx>W+2)continue;
    const alpha=lp.life/20;
    ctx.fillStyle=lp.color;
    ctx.fillRect(sx,Math.round(lp.y),1.5,1.5);
  }
}

function drawHUD(){
  ctx.font='7px monospace';

  // Top bar background
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,36);

  // Score
  ctx.fillStyle=C3;ctx.fillText('SCORE '+score.toString().padStart(6,'0'),2,8);

  // Wave
  ctx.fillStyle=C1;ctx.fillText('WAVE '+wave,110,8);

  // HP hearts
  ctx.fillStyle=C2;
  let heartsStr='';
  for(let i=0;i<player.maxHp;i++)heartsStr+=i<player.hp?'♥':'♡';
  ctx.fillText(heartsStr,166,8);

  // Lives
  ctx.fillStyle=C1;ctx.fillText('LIVES '+lives,240,8);

  // Combo
  if(comboCount>1){
    const alpha=Math.min(1,comboTimer/40);
    ctx.fillStyle='rgba(255,255,85,'+alpha+')';
    ctx.fillText('COMBO x'+comboCount,265,8);
  }

  // Fuel bar
  const fuelPct=player.fuel/player.maxFuel;
  ctx.fillStyle='#003333';ctx.fillRect(2,14,64,5);
  ctx.fillStyle=fuelPct>0.25?C1:C2;ctx.fillRect(2,14,Math.round(64*fuelPct),5);
  ctx.fillStyle=C3;ctx.fillText('FUEL',68,19);

  // Ammo bar
  const ammoPct=player.ammo/player.maxAmmo;
  ctx.fillStyle='#003333';ctx.fillRect(2,21,64,5);
  ctx.fillStyle=C1;ctx.fillRect(2,21,Math.round(64*ammoPct),5);
  ctx.fillStyle=C3;ctx.fillText('AMMO',68,26);

  // Bombs
  ctx.fillStyle=C3;ctx.fillText('BOMBS '+Math.floor(player.bombCount),2,33);

  // Targets remaining
  const enemyLeft=buildings.filter(b=>!b.friendly&&b.alive).length;
  ctx.fillStyle=C2;ctx.fillText('TARGETS '+enemyLeft,130,26);

  // Throttle
  ctx.fillStyle=C3;ctx.fillText('THR '+(player.throttle*100|0)+'%',130,33);

  // Enemy toggle
  ctx.fillStyle=enemiesEnabled?C1:C2;
  ctx.fillText('PLANES '+(enemiesEnabled?'ON':'OFF'),180,33);

  // Speed / ground status
  if(player.onGround){
    ctx.fillStyle=C3;
    ctx.fillText('SPD '+player.speed.toFixed(1)+(player.speed>=4?'▲LIFT':' TAXI'),240,26);
  }

  // Controls bottom
  ctx.fillStyle=C1;ctx.fillText(',▲ .=▼ X=THR \\=DEC SPC=FIRE B=BOMB P=PLN S=SND',2,H-3);
  if(!soundOn){ctx.fillStyle=C2;ctx.fillText('[MUTE]',W-40,18);}

  // Minimap
  const mmW=72,mmH=12,mmX=W-mmW-2,mmY=H-26;
  ctx.fillStyle=C0;ctx.fillRect(mmX,mmY,mmW,mmH);
  for(let mx=0;mx<mmW;mx++){
    const wx=(mx/mmW)*WORLD_W;
    const ty2=tY(wx);
    const mh=Math.round((1-ty2/H)*mmH);
    ctx.fillStyle=C1;ctx.fillRect(mmX+mx,mmY+mmH-mh,1,mh);
  }
  for(const bl of buildings){
    if(!bl.friendly&&bl.alive){
      const mx=mmX+Math.round((bl.x/WORLD_W)*mmW);
      ctx.fillStyle=C2;ctx.fillRect(mx-1,mmY,2,mmH);
    }
  }
  if(enemiesEnabled){
    for(const e of enemyPlanes){
      if(e.state!=='alive')continue;
      const mx=mmX+Math.round((e.x/WORLD_W)*mmW);
      ctx.fillStyle=C2;ctx.fillRect(mx-1,mmY+2,2,mmH-4);
    }
  }
  // Power-ups on minimap
  for(const pu of powerUps){
    const mx=mmX+Math.round((pu.x/WORLD_W)*mmW);
    ctx.fillStyle=pu.type==='repair'?C2:C1;ctx.fillRect(mx,mmY+mmH-3,1,2);
  }
  const ppx=mmX+Math.round((player.x/WORLD_W)*mmW);
  ctx.fillStyle=C3;ctx.fillRect(ppx-1,mmY,3,mmH);
  ctx.strokeStyle=C3;ctx.lineWidth=1;ctx.strokeRect(mmX,mmY,mmW,mmH);

  // Invulnerability indicator
  if(player.invulnTimer>0&&player.alive&&Math.floor(player.invulnTimer/4)%2===0){
    ctx.fillStyle=C3;ctx.fillText('⚡I-FRAMES⚡',W/2-25,18);
  }
}

// ─── SCENES ─────────────────────────────────────────────────────────────────
function drawTitle(){
  ctx.fillStyle='#001122';ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='#113344';
  for(let i=0;i<40;i++)ctx.fillRect((i*137)%W,(i*53)%100,1,1);

  // Title
  ctx.fillStyle=C1;ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText('SOPWITH',W/2,42);
  ctx.font='9px monospace';ctx.fillStyle=C2;
  ctx.fillText('CAMEL FLYING ACE',W/2,56);

  // Demo planes
  drawPlane(W/2+45,82,0.12,C1,C3,frameN*0.3,false);
  drawPlane(W/2-45,92,-0.08,C2,C3,frameN*0.35,false);

  // Controls
  ctx.fillStyle=C3;ctx.font='7px monospace';
  ctx.fillText('─── CONTROLS ───',W/2,108);
  ctx.fillStyle=C1;
  const ctrls=[
    ', = PITCH UP        . = PITCH DOWN',
    'X = ACCELERATE      \\ = DECELERATE',
    'SPACE = FIRE GUNS    B = DROP BOMB',
    'P = TOGGLE PLANES    S = TOGGLE SOUND',
    'TAKEOFF: FULL THROTTLE + PITCH UP'
  ];
  for(let i=0;i<ctrls.length;i++){
    ctx.fillStyle=i===4?C2:C1;
    ctx.fillText(ctrls[i],W/2,118+i*9);
  }
  ctx.fillStyle=enemiesEnabled?C1:C2;
  ctx.fillText('PLANES: '+(enemiesEnabled?'ON (P to toggle)':'OFF (P to toggle)'),W/2,166);
  ctx.fillStyle=C3;
  if(Math.floor(frameN/25)%2===0)ctx.fillText('PRESS ANY KEY TO FLY!',W/2,180);

  // High score
  if(highScore>0){
    ctx.fillStyle=C1;ctx.fillText('BEST SCORE: '+highScore,W/2,190);
  }
  ctx.textAlign='left';
}

function drawGame(){
  ctx.save();
  if(shakeIntensity>0.1){ctx.translate(shakeX,shakeY);}

  drawSky();
  drawTerrain();

  for(const bl of buildings){if(bl.alive)drawBuilding(bl);}

  drawBirds();
  drawBullets();
  drawBombs();
  drawPowerUps();
  drawLooseParticles();

  // Enemy planes
  for(const e of enemyPlanes){
    if(e.state==='dead')continue;
    const sx=px(e.x);if(sx<-30||sx>W+30)continue;
    const col=e.isBomber?C2:C2;
    drawPlane(sx,e.y,e.angle,col,C3,frameN*0.35,e.state==='alive'&&Math.abs(e.angle)<0.4);
    // Smoke trail for dying
    if(e.state==='dying'){
      ctx.fillStyle='#555555';
      for(let j=0;j<3;j++)ctx.fillRect(sx+(Math.random()-0.5)*10,e.y+(Math.random()-0.5)*8,2,2);
    }
  }

  // Player
  if(player.alive){
    const invulnFlash=player.invulnTimer>0&&Math.floor(player.invulnTimer/4)%2===0;
    if(!invulnFlash){
      drawPlane(px(player.x),player.y,player.angle,C1,C3,frameN*0.4,Math.abs(player.angle)<0.5);
    }else{
      // Semi-transparent during invulnerability
      ctx.globalAlpha=0.45;
      drawPlane(px(player.x),player.y,player.angle,C1,C3,frameN*0.4,Math.abs(player.angle)<0.5);
      ctx.globalAlpha=1;
    }
  }

  drawExplosions();
  ctx.restore();

  // HUD drawn without shake
  drawHUD();

  // Overlays
  if(gameState==='dead'&&lives>0){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(75,72,170,50);
    ctx.fillStyle=C2;ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText('PLANE DOWN!',W/2,92);
    ctx.fillStyle=C3;ctx.font='7px monospace';
    ctx.fillText('RESPAWNING... LIVES: '+lives,W/2,107);
    ctx.fillText('WAVE: '+wave+'  SCORE: '+score,W/2,116);
    ctx.textAlign='left';
  }
  if(gameState==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(45,60,230,80);
    ctx.fillStyle=C2;ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,88);
    ctx.fillStyle=C3;ctx.font='8px monospace';
    ctx.fillText('WAVE '+wave+'  SCORE: '+score,W/2,104);
    ctx.fillText('BEST: '+highScore,W/2,116);
    ctx.fillText('PRESS R TO FLY AGAIN',W/2,130);
    ctx.textAlign='left';
  }
  if(gameState==='waveComplete'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(50,55,220,90);
    ctx.fillStyle=C1;ctx.font='14px monospace';ctx.textAlign='center';
    ctx.fillText('WAVE '+wave+' CLEAR!',W/2,82);
    ctx.fillStyle=C3;ctx.font='8px monospace';
    ctx.fillText('BONUS: +'+(wave*500)+'  SCORE: '+score,W/2,98);
    ctx.fillText('WAVE '+(wave+1)+' INCOMING...',W/2,114);
    ctx.fillText('TARGETS TOUGHER!',W/2,128);
    ctx.textAlign='left';
  }

  // Stall warning
  if(player.alive&&!player.onGround&&player.speed<0.7&&gameState==='playing'){
    ctx.fillStyle='rgba(255,0,0,'+(0.5+Math.sin(frameN*0.3)*0.5)+')';
    ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText('⚠ STALL ⚠',W/2,H-40);
    ctx.textAlign='left';
  }
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop(){
  if(gameState==='title'){
    frameN++;
    drawTitle();
  }else{
    update();
    drawGame();
    // Track high score
    if(score>highScore)highScore=score;
  }
  requestAnimationFrame(loop);
}

// Initialize
bullets=[];bombs=[];enemyPlanes=[];birdFlocks=[];explosions=[];powerUps=[];looseParticles=[];
player=mkPlayer();spawnBuildings(1);initBirds();initClouds();
score=0;lives=3;wave=1;gameState='title';
loop();
</script>
</body>
