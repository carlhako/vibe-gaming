<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkhold Arena - Wave RPG</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #1a1a2e;
            --gold: #c9a23b;
            --text: #c8c8d4;
            --accent: #7b3fa3;
            --danger: #a03030;
            --heal: #3a7b3f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #2a2a3a;
            box-shadow: 0 0 40px rgba(100, 40, 160, 0.3), 0 0 80px rgba(0, 0, 0, 0.6);
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="game" tabindex="0"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');

            // === CANVAS SETUP ===
            const W = 960;
            const H = 640;
            canvas.width = W;
            canvas.height = H;
            ctx.imageSmoothingEnabled = false;

            function ensureFocus(e) {
                if (document.activeElement !== canvas) {
                    canvas.focus({ preventScroll: true });
                }
            }
            canvas.focus({ preventScroll: true });

            // === CONSTANTS ===
            const TILE = 40;
            const MAP_COLS = 35;
            const MAP_ROWS = 28;
            const WORLD_W = MAP_COLS * TILE;
            const WORLD_H = MAP_ROWS * TILE;
            const PLAYER_SPEED = 180;
            const PLAYER_SIZE = 16;
            const TOKEN_MAGNET_RANGE = 60;
            const INVULN_TIME = 0.6;
            const SWING_DURATION = 0.16;
            const MAX_MINIONS = 14;
            const MINION_AGGRO_RANGE = 320;
            const ENEMY_AGGRO_RANGE = 340;
            const MINION_DISENGAGE_DIST = 240;
            const MINION_LIFETIME = 15;
            const STUCK_CHECK_INTERVAL = 0.5;
            const STUCK_DIST_THRESHOLD = 10;
            const WALL_DESTROY_TOKEN_CHANCE = 0.25;
            const BONE_SHARD_COUNT = 8;
            const BONE_SHARD_SPEED = 260;
            const BONE_SHARD_LIFE = 0.45;
            const WITCH_AGGRO_RANGE = 420;
            const WITCH_SUMMON_COOLDOWN = 2.6;
            const WITCH_MAX_DEVILS = 5;
            const WITCH_PREFERRED_DIST = 260;

            // === GAME STATE ===
            let gameState = 'CHARACTER_SELECT';
            let wave = 1;
            let tokens = 0;
            let waveClearTimer = 0;
            let gameOverTimer = 0;
            let screenShake = 0;
            let shakeX = 0;
            let shakeY = 0;

            // === CHARACTER DATA ===
            const characters = {
                sorcerer: {
                    name: 'Sorcerer',
                    color: '#8b3fb5',
                    robeColor: '#5c1d8a',
                    skinColor: '#e8c9a0',
                    desc: 'Hurls fireballs & summons skeletal minions. A master of dark arts.',
                    primary: {
                        name: 'Fireball',
                        damage: 22,
                        cooldown: 0.85,
                        speed: 300,
                        range: 450,
                        color: '#ff6622',
                        size: 6,
                        isRanged: true,
                        arcAngle: 0,
                    },
                    secondary: {
                        name: 'Summon Skeleton',
                        cooldown: 5.0,
                        isRanged: false,
                        isSummon: true,
                        minionHealth: 30,
                        minionDamage: 7,
                        minionSpeed: 110,
                        minionSize: 12,
                        minionColor: '#e8dcc8',
                        minionAttackRange: 22,
                        minionAttackCooldown: 0.9,
                        specialName: 'Extra Skeletons',
                        specialDesc: '+1 skeleton summoned per level',
                        aoeName: 'Bone Archers',
                        aoeDesc: 'Spawn 1 long-range archer per level',
                    },
                },
                wizard: {
                    name: 'Wizard',
                    color: '#3b7fcf',
                    robeColor: '#1a4a7a',
                    skinColor: '#f0dbb8',
                    desc: 'Quick wand strikes & piercing magic bolts. High attack speed.',
                    primary: {
                        name: 'Wand Strike',
                        damage: 13,
                        cooldown: 0.35,
                        range: 38,
                        arcAngle: 0.7,
                        color: '#7cb8f0',
                        isRanged: false,
                    },
                    secondary: {
                        name: 'Magic Bolt',
                        damage: 22,
                        cooldown: 1.0,
                        speed: 420,
                        range: 550,
                        color: '#44ccff',
                        size: 5,
                        isRanged: true,
                        isSummon: false,
                        specialName: 'Piercing Bolts',
                        specialDesc: 'Bolts pass through enemies',
                        aoeName: 'Chain Lightning',
                        aoeDesc: 'Bolts bounce to nearby foes',
                    },
                },
                knight: {
                    name: 'Knight',
                    color: '#b0b8c0',
                    robeColor: '#5a5d62',
                    skinColor: '#e0c8a8',
                    desc: 'Sword & heavy swing. Durable melee powerhouse.',
                    primary: {
                        name: 'Sword Slash',
                        damage: 24,
                        cooldown: 0.5,
                        range: 48,
                        arcAngle: 0.9,
                        color: '#d0d8e0',
                        isRanged: false,
                    },
                    secondary: {
                        name: 'Heavy Swing',
                        damage: 50,
                        cooldown: 2.0,
                        range: 58,
                        arcAngle: 1.3,
                        color: '#ffe080',
                        isRanged: false,
                        isSummon: false,
                        specialName: 'Shockwave',
                        specialDesc: 'Swing sends out a ground shockwave',
                        aoeName: 'Execute',
                        aoeDesc: 'Bonus damage vs low-HP enemies',
                    },
                },
            };

            let selectedCharacter = 'sorcerer';
            let playerUpgrades = {};
            let player = null;
            let enemies = [];
            let projectiles = [];
            let particles = [];
            let droppedTokens = [];
            let damageNumbers = [];
            let minions = [];
            let boneShards = [];

            // === MAP ===
            let mapTiles = [];

            function generateMap() {
                mapTiles = [];
                for (let y = 0; y < MAP_ROWS; y++) {
                    mapTiles[y] = [];
                    for (let x = 0; x < MAP_COLS; x++) {
                        mapTiles[y][x] = 0;
                    }
                }
                for (let x = 0; x < MAP_COLS; x++) {
                    mapTiles[0][x] = 2;
                    mapTiles[MAP_ROWS - 1][x] = 2;
                }
                for (let y = 0; y < MAP_ROWS; y++) {
                    mapTiles[y][0] = 2;
                    mapTiles[y][MAP_COLS - 1] = 2;
                }
                const rng = mulberry32(wave * 137 + 42);
                const numClusters = 10 + Math.floor(rng() * 8);
                for (let c = 0; c < numClusters; c++) {
                    const cx = 3 + Math.floor(rng() * (MAP_COLS - 6));
                    const cy = 3 + Math.floor(rng() * (MAP_ROWS - 6));
                    const size = 2 + Math.floor(rng() * 4);
                    for (let dy = -size; dy <= size; dy++) {
                        for (let dx = -size; dx <= size; dx++) {
                            if (Math.abs(dx) + Math.abs(dy) <= size + rng() * 1.5) {
                                const tx = cx + dx;
                                const ty = cy + dy;
                                if (tx > 0 && tx < MAP_COLS - 1 && ty > 0 && ty < MAP_ROWS - 1) {
                                    if (rng() < 0.65) mapTiles[ty][tx] = 2;
                                }
                            }
                        }
                    }
                }
                const pcx = Math.floor(MAP_COLS / 2);
                const pcy = Math.floor(MAP_ROWS / 2);
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const tx = pcx + dx;
                        const ty = pcy + dy;
                        if (tx >= 0 && tx < MAP_COLS && ty >= 0 && ty < MAP_ROWS) {
                            mapTiles[ty][tx] = 0;
                        }
                    }
                }
                ensureMapConnectivity();
            }

            function ensureMapConnectivity() {
                const startTX = Math.floor(MAP_COLS / 2);
                const startTY = Math.floor(MAP_ROWS / 2);
                const visited = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(false));
                const queue = [{ x: startTX, y: startTY }];
                visited[startTY][startTX] = true;
                while (queue.length > 0) {
                    const { x, y } = queue.shift();
                    for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                        const nx = x + dx,
                            ny = y + dy;
                        if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS &&
                            !visited[ny][nx] && mapTiles[ny][nx] === 0) {
                            visited[ny][nx] = true;
                            queue.push({ x: nx, y: ny });
                        }
                    }
                }
                const unreachable = [];
                for (let y = 0; y < MAP_ROWS; y++) {
                    for (let x = 0; x < MAP_COLS; x++) {
                        if (mapTiles[y][x] === 0 && !visited[y][x]) {
                            unreachable.push({ x, y });
                        }
                    }
                }
                if (unreachable.length === 0) return;
                const regionId = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(-1));
                let nextRegion = 0;
                for (const tile of unreachable) {
                    if (regionId[tile.y][tile.x] !== -1) continue;
                    const region = nextRegion++;
                    const rQueue = [tile];
                    regionId[tile.y][tile.x] = region;
                    while (rQueue.length > 0) {
                        const { x, y } = rQueue.shift();
                        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                            const nx = x + dx,
                                ny = y + dy;
                            if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS &&
                                mapTiles[ny][nx] === 0 && regionId[ny][nx] === -1) {
                                regionId[ny][nx] = region;
                                rQueue.push({ x: nx, y: ny });
                            }
                        }
                    }
                }
                for (let r = 0; r < nextRegion; r++) {
                    let bestDist = Infinity;
                    let bestWallX = -1,
                        bestWallY = -1;
                    for (let y = 1; y < MAP_ROWS - 1; y++) {
                        for (let x = 1; x < MAP_COLS - 1; x++) {
                            if (mapTiles[y][x] === 0) continue;
                            let bordersReachable = false;
                            let bordersRegion = false;
                            for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                                const nx = x + dx,
                                    ny = y + dy;
                                if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS) {
                                    if (mapTiles[ny][nx] === 0 && visited[ny][nx]) bordersReachable = true;
                                    if (regionId[ny][nx] === r) bordersRegion = true;
                                }
                            }
                            if (bordersReachable && bordersRegion) {
                                const dist = Math.abs(x - startTX) + Math.abs(y - startTY);
                                if (dist < bestDist) {
                                    bestDist = dist;
                                    bestWallX = x;
                                    bestWallY = y;
                                }
                            }
                        }
                    }
                    if (bestWallX >= 0) {
                        mapTiles[bestWallY][bestWallX] = 0;
                        visited[bestWallY][bestWallX] = true;
                        const fq = [{ x: bestWallX, y: bestWallY }];
                        while (fq.length > 0) {
                            const { x, y } = fq.shift();
                            for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                                const nx = x + dx,
                                    ny = y + dy;
                                if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS &&
                                    !visited[ny][nx] && mapTiles[ny][nx] === 0) {
                                    visited[ny][nx] = true;
                                    fq.push({ x: nx, y: ny });
                                }
                            }
                        }
                    }
                }
            }

            function mulberry32(a) {
                return function() {
                    a |= 0;
                    a = a + 0x6D2B79F5 | 0;
                    let t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            function isWall(wx, wy) {
                const tx = Math.floor(wx / TILE);
                const ty = Math.floor(wy / TILE);
                if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) return true;
                return mapTiles[ty][tx] >= 1;
            }

            function isWallCircle(cx, cy, r) {
                const steps = 8;
                for (let i = 0; i < steps; i++) {
                    const a = (i / steps) * Math.PI * 2;
                    if (isWall(cx + Math.cos(a) * r, cy + Math.sin(a) * r)) return true;
                }
                return false;
            }

            // === WALL DESTRUCTION ===

            function getWallTileAt(x, y) {
                const tx = Math.floor(x / TILE);
                const ty = Math.floor(y / TILE);
                const checks = [
                    { x: tx, y: ty },
                    { x: tx + 1, y: ty },
                    { x: tx - 1, y: ty },
                    { x: tx, y: ty + 1 },
                    { x: tx, y: ty - 1 },
                ];
                for (const c of checks) {
                    if (c.x >= 0 && c.x < MAP_COLS && c.y >= 0 && c.y < MAP_ROWS && mapTiles[c.y][c.x] >= 1) {
                        return { tx: c.x, ty: c.y };
                    }
                }
                return null;
            }

            function damageWallTile(tx, ty, angle) {
                if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) return;
                if (mapTiles[ty][tx] === 0) return;

                const cx = tx * TILE + TILE / 2;
                const cy = ty * TILE + TILE / 2;

                if (mapTiles[ty][tx] === 2) {
                    mapTiles[ty][tx] = 1;
                    spawnParticles(cx, cy, 6, '#bbbbcc', 50, 0.3);
                    spawnDamageNumber(cx, cy, 1, '#cccccc');
                } else if (mapTiles[ty][tx] === 1) {
                    mapTiles[ty][tx] = 0;
                    spawnParticles(cx, cy, 16, '#ddcc88', 130, 0.55);
                    spawnParticles(cx, cy, 8, '#998866', 90, 0.4);
                    screenShake = Math.max(screenShake, 3);
                    spawnDamageNumber(cx, cy, 0, '#ffe080');

                    if (Math.random() < WALL_DESTROY_TOKEN_CHANCE) {
                        droppedTokens.push({
                            x: cx + (Math.random() - 0.5) * 16,
                            y: cy + (Math.random() - 0.5) * 16,
                            life: 15,
                            maxLife: 15,
                            collected: false,
                            flyingToPlayer: false,
                            flyStartX: 0,
                            flyStartY: 0,
                            flyProgress: 0,
                        });
                    }
                }
            }

            function damageWallsInMeleeArc(px, py, angle, range, halfArc) {
                const wallCheckRange = range + TILE * 0.65;
                const tileMinX = Math.floor((px - wallCheckRange) / TILE);
                const tileMaxX = Math.floor((px + wallCheckRange) / TILE);
                const tileMinY = Math.floor((py - wallCheckRange) / TILE);
                const tileMaxY = Math.floor((py + wallCheckRange) / TILE);
                for (let wy = tileMinY; wy <= tileMaxY; wy++) {
                    for (let wx = tileMinX; wx <= tileMaxX; wx++) {
                        if (wx < 0 || wx >= MAP_COLS || wy < 0 || wy >= MAP_ROWS) continue;
                        if (mapTiles[wy][wx] === 0) continue;
                        const wcx = wx * TILE + TILE / 2;
                        const wcy = wy * TILE + TILE / 2;
                        const dx = wcx - px;
                        const dy = wcy - py;
                        const dist = Math.hypot(dx, dy);
                        if (dist < wallCheckRange) {
                            const angleToTile = Math.atan2(dy, dx);
                            let diff = angleToTile - angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            if (Math.abs(diff) <= halfArc) {
                                damageWallTile(wx, wy, angle);
                            }
                        }
                    }
                }
            }

            // === PATHFINDING / STEERING ===

            function hasLineOfSight(x1, y1, x2, y2) {
                const dist = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.max(1, Math.ceil(dist / (TILE * 0.35)));
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = x1 + (x2 - x1) * t;
                    const y = y1 + (y2 - y1) * t;
                    if (isWall(x, y)) return false;
                }
                return true;
            }

            function getSteeringDirection(entX, entY, targetX, targetY, entSize, isStuck) {
                const dx = targetX - entX;
                const dy = targetY - entY;
                const dist = Math.hypot(dx, dy);

                if (dist < 0.5) return { dx: 0, dy: 0 };

                const baseAngle = Math.atan2(dy, dx);

                if (hasLineOfSight(entX, entY, targetX, targetY)) {
                    return { dx: Math.cos(baseAngle), dy: Math.sin(baseAngle) };
                }

                const searchSpread = isStuck ? Math.PI * 0.92 : Math.PI * 0.68;
                const numRays = isStuck ? 13 : 9;
                let bestAngle = baseAngle;
                let bestScore = -Infinity;

                for (let i = 0; i < numRays; i++) {
                    const offset = (i / (numRays - 1) - 0.5) * searchSpread;
                    const angle = baseAngle + offset;
                    const rayDist = TILE * 1.3;
                    const rx = entX + Math.cos(angle) * rayDist;
                    const ry = entY + Math.sin(angle) * rayDist;

                    if (isWallCircle(rx, ry, entSize * 0.7)) continue;

                    const midDist = TILE * 0.55;
                    const midX = entX + Math.cos(angle) * midDist;
                    const midY = entY + Math.sin(angle) * midDist;
                    if (isWallCircle(midX, midY, entSize * 0.45)) continue;

                    const newDx = targetX - rx;
                    const newDy = targetY - ry;
                    const newDist = Math.hypot(newDx, newDy);
                    const anglePenalty = Math.abs(offset) * 35;
                    const score = -newDist - anglePenalty;

                    if (score > bestScore) {
                        bestScore = score;
                        bestAngle = angle;
                    }
                }

                if (bestScore === -Infinity) {
                    return { dx: Math.cos(baseAngle), dy: Math.sin(baseAngle) };
                }

                return { dx: Math.cos(bestAngle), dy: Math.sin(bestAngle) };
            }

            // === EDGE SPAWNING ===
            function getEdgeSpawnPosition() {
                const edge = Math.floor(Math.random() * 4);
                const margin = TILE * 2.5;
                let x, y;
                switch (edge) {
                    case 0:
                        x = margin + Math.random() * (WORLD_W - margin * 2);
                        y = margin;
                        break;
                    case 1:
                        x = margin + Math.random() * (WORLD_W - margin * 2);
                        y = WORLD_H - margin;
                        break;
                    case 2:
                        x = margin;
                        y = margin + Math.random() * (WORLD_H - margin * 2);
                        break;
                    case 3:
                    default:
                        x = WORLD_W - margin;
                        y = margin + Math.random() * (WORLD_H - margin * 2);
                        break;
                }
                return { x, y };
            }

            // === INIT UPGRADES ===
            function initUpgrades() {
                playerUpgrades = {
                    prim_dmg: 0,
                    prim_spd: 0,
                    prim_rng: 0,
                    prim_spec: 0,
                    sec_dmg: 0,
                    sec_spd: 0,
                    sec_special: 0,
                    sec_aoe: 0,
                    minigun: 0,
                    minion_minigun: 0,
                };
            }

            function hasMinigun() {
                return selectedCharacter === 'sorcerer' && (playerUpgrades['minigun'] || 0) >= 1;
            }

            function hasMinionMinigun() {
                return selectedCharacter === 'sorcerer' && (playerUpgrades['minion_minigun'] || 0) >= 1;
            }

            function getUpgradeCost(upgradeId) {
                const level = playerUpgrades[upgradeId] || 0;
                const baseCosts = {
                    prim_dmg: [3, 6, 10, 15, 22],
                    prim_spd: [3, 6, 10, 15],
                    prim_rng: [4, 8, 14, 20],
                    prim_spec: [8, 14, 22],
                    sec_dmg: [4, 7, 12, 18, 25],
                    sec_spd: [4, 8, 14, 22],
                    sec_special: [8, 15, 25],
                    sec_aoe: [10, 18, 28],
                    minigun: [50],
                    minion_minigun: [200],
                };
                const costs = baseCosts[upgradeId] || [3, 6, 10, 15];
                if (level >= costs.length) return Infinity;
                return costs[level];
            }

            function getUpgradeMaxLevel(upgradeId) {
                const maxes = {
                    prim_dmg: 5,
                    prim_spd: 4,
                    prim_rng: 4,
                    prim_spec: 3,
                    sec_dmg: 5,
                    sec_spd: 4,
                    sec_special: 3,
                    sec_aoe: 3,
                    minigun: 1,
                    minion_minigun: 1,
                };
                return maxes[upgradeId] || 3;
            }

            function canBuyUpgrade(upgradeId) {
                const level = playerUpgrades[upgradeId] || 0;
                if (level >= getUpgradeMaxLevel(upgradeId)) return false;
                if (tokens < getUpgradeCost(upgradeId)) return false;
                if (upgradeId === 'prim_spec' && (playerUpgrades['prim_dmg'] || 0) < 2) return false;
                if (upgradeId === 'sec_special' && (playerUpgrades['sec_dmg'] || 0) < 2) return false;
                if (upgradeId === 'sec_aoe' && (playerUpgrades['sec_spd'] || 0) < 2) return false;
                if (upgradeId === 'minigun' && (playerUpgrades['prim_spec'] || 0) < 2) return false;
                if (upgradeId === 'minion_minigun' && (playerUpgrades['minigun'] || 0) < 1) return false;
                return true;
            }

            function getPlayerStat(base, upgradeId, perLevel) {
                return base * (1 + (playerUpgrades[upgradeId] || 0) * perLevel);
            }

            // === PLAYER ===
            function createPlayer() {
                const cx = Math.floor(MAP_COLS / 2) * TILE + TILE / 2;
                const cy = Math.floor(MAP_ROWS / 2) * TILE + TILE / 2;
                return {
                    x: cx,
                    y: cy,
                    vx: 0,
                    vy: 0,
                    angle: 0,
                    health: 100,
                    maxHealth: 100,
                    primaryCooldown: 0,
                    secondaryCooldown: 0,
                    invulnTimer: 0,
                    alive: true,
                    attackFlash: 0,
                    secondaryFlash: 0,
                    attackSwingTimer: 0,
                    attackSwingArc: 0,
                    minigunSpin: 0,
                    minigunMuzzleFlash: 0,
                };
            }

            function getPrimaryDamage() {
                if (hasMinigun()) {
                    return getPlayerStat(10, 'prim_dmg', 0.22);
                }
                return getPlayerStat(characters[selectedCharacter].primary.damage, 'prim_dmg', 0.25);
            }

            function getPrimaryCooldown() {
                if (hasMinigun()) {
                    return 0.1;
                }
                return getPlayerStat(characters[selectedCharacter].primary.cooldown, 'prim_spd', -0.18);
            }

            function getPrimaryRange() {
                if (hasMinigun()) {
                    return 380;
                }
                return getPlayerStat(characters[selectedCharacter].primary.range, 'prim_rng', 0.22);
            }

            function getPrimarySpecLevel() {
                return playerUpgrades['prim_spec'] || 0;
            }

            function getPrimarySpecChance() {
                return getPrimarySpecLevel() * 0.15;
            }

            function getSecondaryDamage() {
                return getPlayerStat(characters[selectedCharacter].secondary.damage || 10, 'sec_dmg', 0.28);
            }

            function getSecondaryCooldown() {
                return getPlayerStat(characters[selectedCharacter].secondary.cooldown, 'sec_spd', -0.18);
            }

            function getSecondarySpecialLevel() {
                return playerUpgrades['sec_special'] || 0;
            }

            function getSecondaryAoeLevel() {
                return playerUpgrades['sec_aoe'] || 0;
            }

            function getMinionHealth() {

            function spawnEnemy(typeKey, minDistFromPlayer, startX, startY) {
                const type = enemyTypes[typeKey];
                let ex, ey;

                if (startX !== undefined && startY !== undefined) {
                    ex = startX;
                    ey = startY;
                } else {
                    let attempts = 0;
                    do {
                        ex = TILE * 1.5 + Math.random() * (WORLD_W - TILE * 3);
                        ey = TILE * 1.5 + Math.random() * (WORLD_H - TILE * 3);
                        attempts++;
                    } while (
                        attempts < 60 &&
                        (isWallCircle(ex, ey, type.size + 4) ||
                            (player && Math.hypot(ex - player.x, ey - player.y) < minDistFromPlayer))
                    );
                }
                const hpMult = 1 + (wave - 1) * 0.35;
                const dmgMult = 1 + (wave - 1) * 0.22;

                const enemy = {
                    x: ex,
                    y: ey,
                    type: typeKey,
                    health: Math.floor(type.baseHP * hpMult),
                    maxHealth: Math.floor(type.baseHP * hpMult),
                    damage: Math.floor(type.baseDamage * dmgMult),
                    speed: type.speed * (1 + (wave - 1) * 0.06),
                    size: type.size,
                    color: type.color,
                    tokenDrop: type.tokenDrop,
                    stunTimer: 0,
                    knockbackX: 0,
                    knockbackY: 0,
                    hitFlash: 0,
                    aggroed: false,
                    idleAngle: Math.random() * Math.PI * 2,
                    idleTimer: 0,
                    stuckCheckTimer: 0,
                    lastStuckX: ex,
                    lastStuckY: ey,
                    isStuck: false,
                };

                // Witch-specific properties
                if (typeKey === 'witch') {
                    enemy.summonCooldown = 0.8;
                    enemy.summonCooldownMax = WITCH_SUMMON_COOLDOWN;
                    enemy.maxDevils = WITCH_MAX_DEVILS;
                    enemy.devilsAlive = 0;
                    enemy.witchAggroRange = WITCH_AGGRO_RANGE;
                }

                return enemy;
            }

            function spawnWave() {
                enemies = [];
                projectiles = [];
                particles = [];
                droppedTokens = [];
                damageNumbers = [];
                minions = [];
                boneShards = [];
                const minDist = 250;
                const spawnCounts = getWaveSpawns();
                for (const [typeKey, count] of Object.entries(spawnCounts)) {
                    for (let i = 0; i < count; i++) {
                        if (typeKey === 'witch') {
                            const edgePos = getEdgeSpawnPosition();
                            enemies.push(spawnEnemy(typeKey, 0, edgePos.x, edgePos.y));
                        } else {
                            enemies.push(spawnEnemy(typeKey, minDist));
                        }
                    }
                }
            }

            function getWaveSpawns() {
                const counts = { skeleton: 0, ghost: 0, demon: 0, brute: 0, witch: 0 };
                counts.skeleton = 4 + Math.floor(wave * 1.6);
                if (wave >= 2) counts.ghost = 1 + Math.floor((wave - 1) * 1.2);
                if (wave >= 4) counts.demon = Math.floor((wave - 3) * 0.9);
                if (wave >= 7) counts.brute = Math.floor((wave - 6) * 0.7);
                if (wave >= 5) {
                    if (wave >= 10) counts.witch = 3;
                    else if (wave >= 7) counts.witch = 2;
                    else counts.witch = 1;
                }
                const total = Object.values(counts).reduce((a, b) => a + b, 0);
                if (total > 35) {
                    const scale = 35 / total;
                    for (const k of Object.keys(counts)) counts[k] = Math.floor(counts[k] * scale);
                }
                return counts;
            }

                const scaleY = H / rect.height;

                mouseY = (e.clientY - rect.top) * scaleY;
            });

                e.preventDefault();
                ensureFocus(e);

                    mouseClicked.right = true; }

            window.addEventListener('keydown', (e) => {

                    if (gameState === 'WAVE_CLEAR') {
                        gameState = 'SHOP';

                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                ensureFocus(e);
                const rect = canvas.getBoundingClientRect();

                const scaleY = H / rect.height;
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
                mouseY = (e.touches[0].clientY - rect.top) * scaleY;

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                ensureFocus(e);

                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;

            // === CAMERA ===
            let camera = { x: 0, y: 0 };

            function updateCamera(dt) {
                if (!player) return;
                const targetX = player.x - W / 2;
                const targetY = player.y - H / 2;
                const lerpFactor = 1 - Math.exp(-8 * dt);
                camera.x += (targetX - camera.x) * lerpFactor;
                camera.y += (targetY - camera.y) * lerpFactor;
                camera.x = Math.max(0, Math.min(WORLD_W - W, camera.x));
                camera.y = Math.max(0, Math.min(WORLD_H - H, camera.y));
                if (WORLD_W <= W) camera.x = (WORLD_W - W) / 2;
                if (WORLD_H <= H) camera.y = (WORLD_H - H) / 2;
            }

            function screenX(wx) { return wx - camera.x; }

            function screenY(wy) { return wy - camera.y; }

            function updateMouseWorld() {
                mouseWorldX = mouseX + camera.x;
                mouseWorldY = mouseY + camera.y;
            }

            // === COLLISION ===
            function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
                const closestX = Math.max(rx, Math.min(cx, rx + rw));
                const closestY = Math.max(ry, Math.min(cy, ry + rh));
                const dx = cx - closestX;
                const dy = cy - closestY;
                return (dx * dx + dy * dy) < (cr * cr);
            }

            function resolveWallCollision(entity, radius) {
                const tileMinX = Math.floor((entity.x - radius) / TILE);
                const tileMaxX = Math.floor((entity.x + radius) / TILE);
                const tileMinY = Math.floor((entity.y - radius) / TILE);
                const tileMaxY = Math.floor((entity.y + radius) / TILE);
                for (let ty = tileMinY; ty <= tileMaxY; ty++) {
                    for (let tx = tileMinX; tx <= tileMaxX; tx++) {
                        if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) continue;
                        if (mapTiles[ty][tx] === 0) continue;
                        const wx = tx * TILE;
                        const wy = ty * TILE;
                        if (rectCircleCollision(wx, wy, TILE, TILE, entity.x, entity.y, radius)) {
                            const cx2 = wx + TILE / 2;
                            const cy2 = wy + TILE / 2;
                            const dx2 = entity.x - cx2;
                            const dy2 = entity.y - cy2;
                            const dist = Math.hypot(dx2, dy2);
                            if (dist < 0.001) continue;
                            const overlap = radius + TILE * 0.707 - dist;
                            if (overlap > 0) {
                                const nx = dx2 / dist;
                                const ny = dy2 / dist;
                                entity.x += nx * overlap;
                                entity.y += ny * overlap;
                            }
                        }
                    }
                }
                entity.x = Math.max(radius, Math.min(WORLD_W - radius, entity.x));
                entity.y = Math.max(radius, Math.min(WORLD_H - radius, entity.y));
            }

            // === GAME LOGIC ===
            function startGame() {
                initUpgrades();
                generateMap();
                player = createPlayer();
                wave = 1;
                tokens = 0;
                enemies = [];
                projectiles = [];
                particles = [];
                droppedTokens = [];
                damageNumbers = [];
                minions = [];
                boneShards = [];
                camera = { x: player.x - W / 2, y: player.y - H / 2 };
                updateCamera(0.016);
                spawnWave();
                gameState = 'PLAYING';
                screenShake = 0;
                canvas.focus({ preventScroll: true });
            }

            function restartGame() {
                gameState = 'CHARACTER_SELECT';
                wave = 1;
                tokens = 0;
                player = null;
                enemies = [];
                projectiles = [];
                particles = [];
                droppedTokens = [];
                damageNumbers = [];
                minions = [];

            function damagePlayer(amount) {
                if (!player || !player.alive) return;
                if (player.invulnTimer > 0) return;
                player.health -= amount;
                player.invulnTimer = INVULN_TIME;
                screenShake = Math.max(screenShake, 4);
                spawnParticles(player.x, player.y, 6, '#ff4444', 80, 0.3);
                spawnDamageNumber(player.x, player.y, amount, '#ff4444');
                if (player.health <= 0) {
                    player.health = 0;
                    player.alive = false;
                    spawnParticles(player.x, player.y, 25, '#ff2222', 150, 0.7);
                    gameState = 'GAME_OVER';
                    gameOverTimer = 1.5;
                }
            }

            function playerPrimaryAttack() {
                if (!player || !player.alive || player.primaryCooldown > 0) return;
                const ch = characters[selectedCharacter];

                if (ch.primary.isRanged) {
                    player.primaryCooldown = getPrimaryCooldown();
                    player.attackFlash = 0.08;
                    const dmg = getPrimaryDamage();
                    const range = getPrimaryRange();
                    const specLvl = getPrimarySpecLevel();
                    const homing = hasMinigun() ? specLvl * 0.06 : specLvl * 0.05;

                    let projSpeed = ch.primary.speed;
                    let projSize = ch.primary.size;
                    let projColor = ch.primary.color;
                    let fireAngle = player.angle;

                    if (hasMinigun()) {
                        projSpeed = 520;
                        projSize = 4;
                        projColor = '#ff8833';
                        fireAngle = player.angle + (Math.random() - 0.5) * 0.07;
                        player.minigunMuzzleFlash = 0.06;
                        screenShake = Math.max(screenShake, 0.6);
                    }

                    const proj = spawnProjectile(
                        player.x + Math.cos(player.angle) * 20,
                        player.y + Math.sin(player.angle) * 20,
                        fireAngle, projSpeed, dmg, projColor, projSize,
                        true, 0, homing, 0, 'player'
                    );
                    proj.rangeRemaining = range;
                    projectiles.push(proj);

                    if (hasMinigun()) {
                        spawnParticles(proj.x, proj.y, 2, projColor, 30, 0.15);
                    } else {
                        spawnParticles(proj.x, proj.y, 5, ch.primary.color, 40, 0.25);
                    }
                    return;
                }

                player.primaryCooldown = getPrimaryCooldown();
                const range = getPrimaryRange();
                const dmg = getPrimaryDamage();
                const arc = ch.primary.arcAngle;
                const halfArc = arc / 2;
                player.attackFlash = 0.12;
                player.attackSwingTimer = SWING_DURATION;
                player.attackSwingArc = arc;
                spawnParticles(player.x + Math.cos(player.angle) * range * 0.5, player.y + Math.sin(player.angle) *
                    range * 0.5, 5, ch.primary.color, 60, 0.2);
                let hitAny = false;
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const dx = enemy.x - player.x;
                    const dy = enemy.y - player.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < range + enemy.size) {
                        const angleToEnemy = Math.atan2(dy, dx);
                        let diff = angleToEnemy - player.angle;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        if (Math.abs(diff) <= halfArc) {
                            hitAny = true;
                            damageEnemy(enemy, dmg, player.angle);
                            if (Math.random() < getPrimarySpecChance()) {
                                enemy.stunTimer = 0.6;
                                spawnParticles(enemy.x, enemy.y, 4, '#ffff88', 40, 0.3);
                            }
                        }
                    }
                }
                if (hitAny) {
                    screenShake = Math.max(screenShake, 1.5);
                }
                damageWallsInMeleeArc(player.x, player.y, player.angle, range, halfArc);
            }

            function playerSecondaryAttack() {
                if (!player || !player.alive || player.secondaryCooldown > 0) return;
                const ch = characters[selectedCharacter];
                player.secondaryCooldown = getSecondaryCooldown();
                player.secondaryFlash = 0.15;

                if (ch.secondary.isSummon) {
                    const specLvl = getSecondarySpecialLevel();
                    const aoeLvl = getSecondaryAoeLevel();

                    if (hasMinionMinigun()) {
                        const totalCount = (2 + specLvl) + aoeLvl;
                        const aliveCount = minions.filter(m => m.health > 0).length;
                        const spawnCount = Math.min(totalCount, MAX_MINIONS - aliveCount);

                        for (let i = 0; i < spawnCount; i++) {
                            const offsetAngle = player.angle + Math.PI + (i - (spawnCount - 1) / 2) * 0.45;
                            const sx = player.x + Math.cos(offsetAngle) * 30;
                            const sy = player.y + Math.sin(offsetAngle) * 30;
                            if (!isWallCircle(sx, sy, 8)) {
                                minions.push(spawnMinigunSkeleton(sx, sy));
                                spawnParticles(sx, sy, 6, '#ff9944', 55, 0.4);
                            } else {
                                minions.push(spawnMinigunSkeleton(player.x, player.y));
                                spawnParticles(player.x, player.y, 6, '#ff9944', 55, 0.4);
                            }
                        }
                        spawnParticles(player.x, player.y, 14, '#ff7733', 70, 0.55);
                        screenShake = Math.max(screenShake, 2);
                        return;
                    }

                    const skeletonCount = 2 + specLvl;

                    const aliveCount = minions.filter(m => m.health > 0).length;
                    const spawnSkeletons = Math.min(skeletonCount, MAX_MINIONS - aliveCount);

                    for (let i = 0; i < spawnSkeletons; i++) {
                        const offsetAngle = player.angle + Math.PI + (i - (spawnSkeletons - 1) / 2) * 0.5;
                        const sx = player.x + Math.cos(offsetAngle) * 28;
                        const sy = player.y + Math.sin(offsetAngle) * 28;
                        if (!isWallCircle(sx, sy, 8)) {
                            minions.push(spawnMinion(sx, sy));
                            spawnParticles(sx, sy, 6, '#c8e0d0', 50, 0.4);
                        } else {
                            minions.push(spawnMinion(player.x, player.y));
                            spawnParticles(player.x, player.y, 6, '#c8e0d0', 50, 0.4);
                        }
                    }

                    const aliveAfterSkeletons = minions.filter(m => m.health > 0).length;
                    const spawnArchersCount = Math.min(aoeLvl, MAX_MINIONS - aliveAfterSkeletons);

                    for (let i = 0; i < spawnArchersCount; i++) {
                        const offsetAngle = player.angle + Math.PI + (i - (spawnArchersCount - 1) / 2) * 0.7 + 0.3;
                        const ax = player.x + Math.cos(offsetAngle) * 34;
                        const ay = player.y + Math.sin(offsetAngle) * 34;
                        if (!isWallCircle(ax, ay, 8)) {
                            minions.push(spawnArcher(ax, ay));
                            spawnParticles(ax, ay, 6, '#ffe0a0', 45, 0.35);
                        } else {
                            minions.push(spawnArcher(player.x, player.y));
                            spawnParticles(player.x, player.y, 6, '#ffe0a0', 45, 0.35);
                        }
                    }

                    spawnParticles(player.x, player.y, 12, '#8b9f8b', 60, 0.5);
                    return;
                }

                const dmg = getSecondaryDamage();
                const specLvl = getSecondarySpecialLevel();
                const aoeLvl = getSecondaryAoeLevel();

                if (ch.secondary.isRanged) {
                    const speed = ch.secondary.speed;
                    const aoeRadius = aoeLvl * 38;
                    const proj = spawnProjectile(
                        player.x + Math.cos(player.angle) * 18,
                        player.y + Math.sin(player.angle) * 18,
                        player.angle, speed, dmg, ch.secondary.color, ch.secondary.size,
                        true, (selectedCharacter === 'wizard' ? specLvl : 0), 0, aoeRadius, 'player'
                    );
                    projectiles.push(proj);
                    spawnParticles(proj.x, proj.y, 5, ch.secondary.color, 40, 0.25);
                } else {
                    const range2 = getPlayerStat(ch.secondary.range, 'sec_spd', -0.04);
                    const arc = ch.secondary.arcAngle;
                    const halfArc = arc / 2;
                    player.attackSwingTimer = SWING_DURATION * 1.3;
                    player.attackSwingArc = arc;
                    spawnParticles(player.x, player.y, 8, '#ffe080', 100, 0.3);
                    let hitAny = false;
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const dx = enemy.x - player.x;
                        const dy = enemy.y - player.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < range2 + enemy.size) {
                            const angleToEnemy = Math.atan2(dy, dx);
                            let diff = angleToEnemy - player.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            if (Math.abs(diff) <= halfArc) {
                                hitAny = true;
                                let finalDmg = dmg;
                                if (aoeLvl > 0 && enemy.health / enemy.maxHealth < 0.3) {
                                    finalDmg *= (1 + aoeLvl * 0.4);
                                }
                                damageEnemy(enemy, finalDmg, player.angle);
                                enemy.knockbackX += Math.cos(player.angle) * 80;
                                enemy.knockbackY += Math.sin(player.angle) * 80;
                            }
                        }
                    }
                    if (hitAny) screenShake = Math.max(screenShake, 3);
                    damageWallsInMeleeArc(player.x, player.y, player.angle, range2, halfArc);
                    if (specLvl > 0) {
                        const shockProj = spawnProjectile(
                            player.x + Math.cos(player.angle) * 10,
                            player.y + Math.sin(player.angle) * 10,
                            player.angle, 200, dmg * 0.7, '#ffe8a0', 14,
                            true, 0, 0, specLvl * 30, 'player'
                        );
                        shockProj.rangeRemaining = 180 + specLvl * 50;
                        projectiles.push(shockProj);
                    }
                }
            }

            function damageEnemy(enemy, amount, angle) {
                enemy.health -= amount;
                enemy.hitFlash = 0.08;
                enemy.knockbackX += Math.cos(angle) * 30;
                enemy.knockbackY += Math.sin(angle) * 30;
                spawnDamageNumber(enemy.x, enemy.y, amount, '#ffffff');
                spawnParticles(enemy.x, enemy.y, 3, enemy.color, 50, 0.2);
                enemy.aggroed = true;
                if (enemy.health <= 0) {
                    killEnemy(enemy);
                }
            }

            function killEnemy(enemy) {
                enemy.health = 0;
                spawnParticles(enemy.x, enemy.y, 12, enemy.color, 120, 0.5);

                // Handle witch reference for devils
                if (enemy.witchRef && typeof enemy.witchRef.devilsAlive === 'number') {
                    enemy.witchRef.devilsAlive = Math.max(0, enemy.witchRef.devilsAlive - 1);
                }

                // Special death effects for witch
                if (enemy.type === 'witch') {
                    spawnParticles(enemy.x, enemy.y, 20, '#9933cc', 160, 0.7);
                    spawnParticles(enemy.x, enemy.y, 14, '#ff44aa', 120, 0.55);
                    screenShake = Math.max(screenShake, 5);
                }

                const drops = enemy.tokenDrop;
                for (let i = 0; i < drops; i++) {
                    droppedTokens.push({
                        x: enemy.x + (Math.random() - 0.5) * 20,
                        y: enemy.y + (Math.random() - 0.5) * 20,
                        life: 12,
                        maxLife: 12,
                        collected: false,
                        flyingToPlayer: false,
                        flyStartX: 0,
                        flyStartY: 0,
                        flyProgress: 0,
                    });
                }
            }

            function killMinionByTimeout(minion) {
                minion.health = 0;
                spawnParticles(minion.x, minion.y, 14, '#e8dcc8', 140, 0.55);
                spawnParticles(minion.x, minion.y, 8, '#bba890', 100, 0.45);
                screenShake = Math.max(screenShake, 2.5);

                const blastRadius = TILE * 1.3;
                const tileMinX = Math.floor((minion.x - blastRadius) / TILE);
                const tileMaxX = Math.floor((minion.x + blastRadius) / TILE);
                const tileMinY = Math.floor((minion.y - blastRadius) / TILE);
                const tileMaxY = Math.floor((minion.y + blastRadius) / TILE);
                for (let wy = tileMinY; wy <= tileMaxY; wy++) {
                    for (let wx = tileMinX; wx <= tileMaxX; wx++) {
                        if (wx < 0 || wx >= MAP_COLS || wy < 0 || wy >= MAP_ROWS) continue;
                        if (mapTiles[wy][wx] === 0) continue;
                        const wcx = wx * TILE + TILE / 2;
                        const wcy = wy * TILE + TILE / 2;
                        const wdist = Math.hypot(wcx - minion.x, wcy - minion.y);
                        if (wdist < blastRadius) {
                            damageWallTile(wx, wy, Math.atan2(wcy - minion.y, wcx - minion.x));
                        }
                    }
                }

                for (let i = 0; i < BONE_SHARD_COUNT; i++) {
                    const a = (i / BONE_SHARD_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
                    const speed = BONE_SHARD_SPEED * (0.7 + Math.random() * 0.6);
                    boneShards.push({
                        x: minion.x,
                        y: minion.y,
                        vx: Math.cos(a) * speed,
                        vy: Math.sin(a) * speed,
                        damage: minion.damage * 0.75,
                        life: BONE_SHARD_LIFE,
                        maxLife: BONE_SHARD_LIFE,
                        hitEnemies: new Set(),
                    });
                }
            }

            function collectToken(token) {
                token.collected = true;
                tokens++;
                spawnParticles(token.x, token.y, 4, '#ffcc00', 30, 0.3);
            }

            function startTokenFlyToPlayer() {
                if (!player || !player.alive) return;
                for (const token of droppedTokens) {
                    if (!token.collected && !token.flyingToPlayer) {
                        token.flyingToPlayer = true;
                        token.flyStartX = token.x;
                        token.flyStartY = token.y;
                        token.flyProgress = 0;
                        token.flyTargetX = player.x;
                        token.flyTargetY = player.y;
                    }
                }
            }

            function update(dt) {
                if (gameState === 'CHARACTER_SELECT' || gameState === 'SHOP') {
                    updateMouseWorld();
                    return;
                }
                if (gameState === 'GAME_OVER') {
                    gameOverTimer -= dt;
                    if (gameOverTimer <= 0 && mouseClicked.left) {
                        restartGame();
                    }
                    updateMouseWorld();
                    updateParticles(dt);
                    updateDamageNumbers(dt);
                    updateDroppedTokens(dt);
                    updateBoneShards(dt);
                    return;
                }
                if (gameState === 'WAVE_CLEAR') {
                    waveClearTimer -= dt;
                    updateParticles(dt);
                    updateDamageNumbers(dt);
                    updateDroppedTokens(dt);
                    updateMinions(dt);
                    updateBoneShards(dt);
                    if (waveClearTimer <= 0) {
                        gameState = 'SHOP';
                    }
                    updateMouseWorld();
                    return;
                }

                const dtClamped = Math.min(dt, 0.1);

                updateMouseWorld();
                updatePlayer(dtClamped);
                updateEnemies(dtClamped);
                updateMinions(dtClamped);
                updateProjectiles(dtClamped);
                updateParticles(dtClamped);
                updateDamageNumbers(dtClamped);
                updateDroppedTokens(dtClamped);
                updateBoneShards(dtClamped);
                updateCamera(dtClamped);

                if (screenShake > 0) {
                    screenShake = Math.max(0, screenShake - dt * 8);
                    shakeX = (Math.random() - 0.5) * screenShake * 2;
                    shakeY = (Math.random() - 0.5) * screenShake * 2;
                } else {
                    shakeX = 0;
                    shakeY = 0;
                }

                if (enemies.length > 0 && enemies.every(e => e.health <= 0)) {
                    enemies = [];
                    startTokenFlyToPlayer();
                    gameState = 'WAVE_CLEAR';
                    waveClearTimer = 0.8;
                }

                mouseClicked.left = false;
                mouseClicked.right = false;
            }

            function updateStuckDetection(entity, dt) {
                entity.stuckCheckTimer += dt;
                if (entity.stuckCheckTimer >= STUCK_CHECK_INTERVAL) {
                    entity.stuckCheckTimer = 0;
                    const moved = Math.hypot(entity.x - entity.lastStuckX, entity.y - entity.lastStuckY);
                    entity.isStuck = moved < STUCK_DIST_THRESHOLD;
                    entity.lastStuckX = entity.x;
                    entity.lastStuckY = entity.y;
                }
            }

            function updatePlayer(dt) {
                if (!player || !player.alive) return;
                let mx = 0,
                    my = 0;
                if (keys['w'] || keys['arrowup']) my -= 1;
                if (keys['s'] || keys['arrowdown']) my += 1;
                if (keys['a'] || keys['arrowleft']) mx -= 1;
                if (keys['d'] || keys['arrowright']) mx += 1;
                if (mx !== 0 || my !== 0) {
                    const len = Math.hypot(mx, my);
                    mx /= len;
                    my /= len;
                }
                player.x += mx * PLAYER_SPEED * dt;
                player.y += my * PLAYER_SPEED * dt;
                resolveWallCollision(player, PLAYER_SIZE);

                player.angle = Math.atan2(mouseWorldY - player.y, mouseWorldX - player.x);

                if (player.primaryCooldown > 0) player.primaryCooldown -= dt;
                if (player.secondaryCooldown > 0) player.secondaryCooldown -= dt;
                if (player.invulnTimer > 0) player.invulnTimer -= dt;
                if (player.attackFlash > 0) player.attackFlash -= dt;
                if (player.secondaryFlash > 0) player.secondaryFlash -= dt;
                if (player.attackSwingTimer > 0) player.attackSwingTimer -= dt;
                if (player.minigunMuzzleFlash > 0) player.minigunMuzzleFlash -= dt;

                if (hasMinigun() && player.alive) {
                    const spinRate = mouseDown.left ? 22 : 4;
                    player.minigunSpin += spinRate * dt;
                }

                if (mouseDown.left && player.primaryCooldown <= 0) {
                    playerPrimaryAttack();
                }
                if (mouseDown.right && player.secondaryCooldown <= 0) {
                    playerSecondaryAttack();
                }
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;

                    // Witch-specific aggro range
                    const aggroRange = enemy.type === 'witch' ? (enemy.witchAggroRange || WITCH_AGGRO_RANGE) : ENEMY_AGGRO_RANGE;

                    if (!enemy.aggroed && player && player.alive) {
                        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        if (distToPlayer < aggroRange) {
                            enemy.aggroed = true;
                        }
                    }

                    if (enemy.stunTimer > 0) {
                        enemy.stunTimer -= dt;
                        enemy.knockbackX *= 0.85;
                        enemy.knockbackY *= 0.85;
                        enemy.x += enemy.knockbackX * dt;
                        enemy.y += enemy.knockbackY * dt;
                        resolveWallCollision(enemy, enemy.size);
                        continue;
                    }
                    if (enemy.hitFlash > 0) enemy.hitFlash -= dt;

                    if (Math.abs(enemy.knockbackX) > 0.5 || Math.abs(enemy.knockbackY) > 0.5) {
                        enemy.x += enemy.knockbackX * dt;
                        enemy.y += enemy.knockbackY * dt;
                        enemy.knockbackX *= Math.exp(-10 * dt);
                        enemy.knockbackY *= Math.exp(-10 * dt);
                        resolveWallCollision(enemy, enemy.size);
                    }

                    // === WITCH SPECIAL BEHAVIOR ===
                    if (enemy.type === 'witch' && enemy.aggroed && player && player.alive) {
                        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);

                        // Summon devils
                        enemy.summonCooldown -= dt;
                        if (enemy.summonCooldown <= 0 && (enemy.devilsAlive || 0) < enemy.maxDevils) {
                            enemy.summonCooldown = enemy.summonCooldownMax;
                            const spawnAngle = Math.random() * Math.PI * 2;
                            const spawnDist = enemy.size + 20;
                            const dx = enemy.x + Math.cos(spawnAngle) * spawnDist;
                            const dy = enemy.y + Math.sin(spawnAngle) * spawnDist;
                            if (!isWallCircle(dx, dy, 6)) {
                                const devil = spawnEnemy('devil', 0, dx, dy);
                                devil.witchRef = enemy;
                                devil.aggroed = true;
                                enemies.push(devil);
                                enemy.devilsAlive = (enemy.devilsAlive || 0) + 1;
                                spawnParticles(dx, dy, 14, '#ff3311', 80, 0.5);
                                spawnParticles(dx, dy, 8, '#ffaa22', 60, 0.35);
                                spawnDamageNumber(dx, dy, 0, '#ff6644');
                            }
                        }

                        // Movement: maintain preferred distance
                        if (distToPlayer < WITCH_PREFERRED_DIST * 0.7 && distToPlayer > 0.01) {
                            const awayX = enemy.x - player.x;
                            const awayY = enemy.y - player.y;
                            const awayDist = Math.hypot(awayX, awayY);
                            enemy.x += (awayX / awayDist) * enemy.speed * 0.85 * dt;
                            enemy.y += (awayY / awayDist) * enemy.speed * 0.85 * dt;
                            resolveWallCollision(enemy, enemy.size);
                        } else if (distToPlayer > WITCH_PREFERRED_DIST * 1.6) {
                            updateStuckDetection(enemy, dt);
                            const steering = getSteeringDirection(enemy.x, enemy.y, player.x, player.y, enemy.size, enemy.isStuck);
                            enemy.x += steering.dx * enemy.speed * 0.7 * dt;
                            enemy.y += steering.dy * enemy.speed * 0.7 * dt;
                            resolveWallCollision(enemy, enemy.size);
                        } else {
                            // In sweet spot — slight strafe
                            updateStuckDetection(enemy, dt);
                            const strafeAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x) + Math.PI / 2;
                            const strafeDir = Math.sin(enemy.idleTimer * 1.3) > 0 ? 1 : -1;
                            enemy.idleTimer += dt * 1.3;
                            enemy.x += Math.cos(strafeAngle) * strafeDir * enemy.speed * 0.3 * dt;
                            enemy.y += Math.sin(strafeAngle) * strafeDir * enemy.speed * 0.3 * dt;
                            resolveWallCollision(enemy, enemy.size);
                        }

                        // Skip normal movement for witch
                    } else if (enemy.aggroed && player && player.alive) {
                        // === NORMAL ENEMY BEHAVIOR ===
                        let targetObj = { x: player.x, y: player.y, size: PLAYER_SIZE, type: 'player' };
                        let closestDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);

                        for (const minion of minions) {
                            if (minion.health <= 0) continue;
                            const md = Math.hypot(minion.x - enemy.x, minion.y - enemy.y);
                            if (md < closestDist) {
                                closestDist = md;
                                targetObj = { x: minion.x, y: minion.y, size: minion.size, type: 'minion', ref: minion };
                            }
                        }

                        const tdx = targetObj.x - enemy.x;
                        const tdy = targetObj.y - enemy.y;
                        const tdist = Math.hypot(tdx, tdy);

                        if (tdist > 0.5) {
                            updateStuckDetection(enemy, dt);
                            const steering = getSteeringDirection(
                                enemy.x, enemy.y, targetObj.x, targetObj.y,
                                enemy.size, enemy.isStuck
                            );
                            enemy.x += steering.dx * enemy.speed * dt;
                            enemy.y += steering.dy * enemy.speed * dt;
                            resolveWallCollision(enemy, enemy.size);
                        }

                        const contactDist = targetObj.size + enemy.size;
                        if (tdist < contactDist) {
                            if (targetObj.type === 'player' && player.invulnTimer <= 0) {
                                damagePlayer(enemy.damage);
                                const pushX = (player.x - enemy.x) / (tdist + 0.01);
                                const pushY = (player.y - enemy.y) / (tdist + 0.01);
                                enemy.knockbackX -= pushX * 100;
                                enemy.knockbackY -= pushY * 100;
                            } else if (targetObj.type === 'minion' && targetObj.ref.damageCooldown <= 0) {
                                const tMinion = targetObj.ref;
                                tMinion.health -= enemy.damage;
                                tMinion.damageCooldown = 0.5;
                                tMinion.hitFlash = 0.08;
                                spawnParticles(tMinion.x, tMinion.y, 3, '#ffaa88', 40, 0.2);
                                const pushMX = (tMinion.x - enemy.x) / (tdist + 0.01);
                                const pushMY = (tMinion.y - enemy.y) / (tdist + 0.01);
                                tMinion.knockbackX += pushMX * 60;
                                tMinion.knockbackY += pushMY * 60;
                                if (tMinion.health <= 0) {
                                    spawnParticles(tMinion.x, tMinion.y, 8, '#ddccbb', 80, 0.4);
                                }
                            }
                        }
                    } else if (!enemy.aggroed) {
                        enemy.idleTimer -= dt;
                        if (enemy.idleTimer <= 0) {
                            enemy.idleAngle += (Math.random() - 0.5) * 1.2;
                            enemy.idleTimer = 1.0 + Math.random() * 2.0;
                        }
                        const idleSpeed = enemy.speed * 0.3;
                        enemy.x += Math.cos(enemy.idleAngle) * idleSpeed * dt;
                        enemy.y += Math.sin(enemy.idleAngle) * idleSpeed * dt;
                        resolveWallCollision(enemy, enemy.size);
                    }

                    // Push away from other enemies
                    for (const other of enemies) {
                        if (other === enemy || other.health <= 0) continue;
                        const edx = enemy.x - other.x;
                        const edy = enemy.y - other.y;
                        const edist = Math.hypot(edx, edy);
                        const minDist = enemy.size + other.size;
                        if (edist < minDist && edist > 0.01) {
                            const sep = (minDist - edist) * 0.3;
                            enemy.x += (edx / edist) * sep;
                            enemy.y += (edy / edist) * sep;
                        }
                    }
                }
                enemies = enemies.filter(e => e.health > 0 || e.hitFlash > -0.5);
            }

            function updateMinions(dt) {
                for (const minion of minions) {
                    if (minion.health <= 0) continue;

                    minion.lifetime -= dt;
                    if (minion.lifetime <= 0) {
                        killMinionByTimeout(minion);
                        continue;
                    }

                    minion.isMoving = false;

                    if (minion.hitFlash > 0) minion.hitFlash -= dt;
                    if (minion.damageCooldown > 0) minion.damageCooldown -= dt;
                    if (minion.attackCooldown > 0) minion.attackCooldown -= dt;
                    if (minion.minigunMuzzleFlash > 0) minion.minigunMuzzleFlash -= dt;

                    if (minion.minionType === 'minigun') {
                        minion.minigunSpin += 18 * dt;
                    }

                    if (Math.abs(minion.knockbackX) > 0.3 || Math.abs(minion.knockbackY) > 0.3) {
                        minion.x += minion.knockbackX * dt;
                        minion.y += minion.knockbackY * dt;
                        minion.knockbackX *= Math.exp(-8 * dt);
                        minion.knockbackY *= Math.exp(-8 * dt);
                        resolveWallCollision(minion, minion.size);
                    }

                    const distToPlayer = player && player.alive
                        ? Math.hypot(player.x - minion.x, player.y - minion.y)
                        : Infinity;

                    let nearestEnemy = null;
                    let nearestDist = Infinity;
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const d = Math.hypot(enemy.x - minion.x, enemy.y - minion.y);
                        if (d < nearestDist) {
                            nearestDist = d;
                            nearestEnemy = enemy;
                        }
                    }

                    const shouldFollowPlayer = distToPlayer > MINION_DISENGAGE_DIST;

                    if (nearestEnemy && nearestDist < MINION_AGGRO_RANGE && !shouldFollowPlayer) {
                        const dx = nearestEnemy.x - minion.x;
                        const dy = nearestEnemy.y - minion.y;
                        const dist = Math.hypot(dx, dy);

                        updateStuckDetection(minion, dt);

                        if (minion.isRanged && dist < minion.rangedRange && dist > minion.attackRange) {
                            if (minion.attackCooldown <= 0) {
                                minion.attackCooldown = minion.rangedCooldownMax;
                                minion.angle = Math.atan2(dy, dx);

                                const isMinigun = minion.minionType === 'minigun';
                                const projColor = isMinigun ? '#ff8833' : (minion.minionType === 'archer' ? '#ffe8b0' : '#e8e0c8');
                                const projSize = isMinigun ? 3 : (minion.minionType === 'archer' ? 4 : 3);
                                const homingStr = isMinigun ? 0.05 : 0;

                                const bproj = spawnProjectile(
                                    minion.x + Math.cos(minion.angle) * (minion.size + 2),
                                    minion.y + Math.sin(minion.angle) * (minion.size + 2),
                                    minion.angle, minion.rangedSpeed, minion.damage,
                                    projColor, projSize, true, 0, homingStr, 0, 'minion'
                                );
                                bproj.rangeRemaining = minion.rangedRange;
                                projectiles.push(bproj);

                                if (isMinigun) {
                                    minion.minigunMuzzleFlash = 0.06;
                                    spawnParticles(
                                        minion.x + Math.cos(minion.angle) * (minion.size + 8),
                                        minion.y + Math.sin(minion.angle) * (minion.size + 8),
                                        2, '#ff8833', 30, 0.12
                                    );
                                }
                            }
                            if (dist > minion.rangedRange * 0.7) {
                                const steering = getSteeringDirection(
                                    minion.x, minion.y, nearestEnemy.x, nearestEnemy.y,
                                    minion.size, minion.isStuck
                                );
                                minion.x += steering.dx * minion.speed * dt;
                                minion.y += steering.dy * minion.speed * dt;
                                minion.isMoving = true;
                                minion.angle = Math.atan2(dx, dy);
                                resolveWallCollision(minion, minion.size);
                            }
                        } else if (dist > minion.attackRange) {
                            const steering = getSteeringDirection(
                                minion.x, minion.y, nearestEnemy.x, nearestEnemy.y,
                                minion.size, minion.isStuck
                            );
                            minion.x += steering.dx * minion.speed * dt;
                            minion.y += steering.dy * minion.speed * dt;
                            minion.isMoving = true;
                            minion.angle = Math.atan2(dx, dy);
                            resolveWallCollision(minion, minion.size);
                        } else if (minion.attackCooldown <= 0) {
                            minion.attackCooldown = minion.attackCooldownMax;
                            minion.angle = Math.atan2(dx, dy);
                            damageEnemy(nearestEnemy, minion.damage, minion.angle);
                            spawnParticles(
                                nearestEnemy.x - Math.cos(minion.angle) * nearestEnemy.size * 0.5,
                                nearestEnemy.y - Math.sin(minion.angle) * nearestEnemy.size * 0.5,
                                3, '#ffffff', 30, 0.15
                            );
                        }
                    } else if (player && player.alive) {
                        const dx = player.x - minion.x;
                        const dy = player.y - minion.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 45) {
                            updateStuckDetection(minion, dt);
                            const steering = getSteeringDirection(
                                minion.x, minion.y, player.x, player.y,
                                minion.size, minion.isStuck
                            );
                            minion.x += steering.dx * minion.speed * 0.75 * dt;
                            minion.y += steering.dy * minion.speed * 0.75 * dt;
                            minion.isMoving = true;
                            minion.angle = Math.atan2(dx, dy);
                            resolveWallCollision(minion, minion.size);
                        }
                    }

                    if (minion.isMoving) {
                        minion.walkTimer += dt * 8;
                    }

                    for (const other of minions) {
                        if (other === minion || other.health <= 0) continue;
                        const mdx = minion.x - other.x;
                        const mdy = minion.y - other.y;
                        const mdist = Math.hypot(mdx, mdy);
                        const minSep = minion.size + other.size;
                        if (mdist < minSep && mdist > 0.01) {
                            const sep = (minSep - mdist) * 0.25;
                            minion.x += (mdx / mdist) * sep;
                            minion.y += (mdy / mdist) * sep;
                        }
                    }
                }
                minions = minions.filter(m => m.health > 0);
            }

            function updateProjectiles(dt) {
                for (const proj of projectiles) {
                    if (!proj.alive) continue;
                    if (proj.homingStrength > 0 && proj.isRanged) {
                        let closestEnemy = null;
                        let closestDist = 200;
                        for (const enemy of enemies) {
                            if (enemy.health <= 0) continue;
                            const d = Math.hypot(enemy.x - proj.x, enemy.y - proj.y);
                            if (d < closestDist) {
                                closestDist = d;
                                closestEnemy = enemy;
                            }
                        }
                        if (closestEnemy) {
                            const targetAngle = Math.atan2(closestEnemy.y - proj.y, closestEnemy.x - proj.x);
                            let diff = targetAngle - proj.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            proj.angle += diff * Math.min(1, proj.homingStrength * 8 * dt);
                            proj.vx = Math.cos(proj.angle) * proj.speed;
                            proj.vy = Math.sin(proj.angle) * proj.speed;
                        }
                    }

                    proj.x += proj.vx * dt;
                    proj.y += proj.vy * dt;
                    proj.rangeRemaining -= proj.speed * dt;
                    proj.trail.push({ x: proj.x, y: proj.y, life: 0.15 });
                    if (proj.trail.length > 12) proj.trail.shift();

                    if (isWallCircle(proj.x, proj.y, proj.size)) {
                        if (proj.owner === 'player' || proj.owner === 'minion') {
                            const wallTile = getWallTileAt(proj.x, proj.y);
                            if (wallTile) {
                                damageWallTile(wallTile.tx, wallTile.ty, proj.angle);
                            }
                        }
                        if (proj.aoeRadius > 0) {
                            applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.8, proj.color);
                        }
                        spawnParticles(proj.x, proj.y, 6, proj.color, 80, 0.25);
                        proj.alive = false;
                        continue;
                    }

                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const ed = Math.hypot(enemy.x - proj.x, enemy.y - proj.y);
                        if (ed < proj.size + enemy.size) {
                            damageEnemy(enemy, proj.damage, proj.angle);
