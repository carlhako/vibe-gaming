<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - 1978</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-height: 100vh;
            max-width: 100vw;
            aspect-ratio: 3 / 4;
            cursor: none;
        }
        #touch-controls {
            display: none;
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }
        @media (pointer: coarse) {
            #touch-controls {
                display: flex;
                justify-content: space-between;
                padding: 0 20px;
            }
            canvas {
                cursor: default;
            }
        }
        .touch-btn {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: rgba(51, 255, 51, 0.15);
            border: 2px solid rgba(51, 255, 51, 0.4);
            color: #3f3;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        .touch-btn:active {
            background: rgba(51, 255, 51, 0.35);
        }
        #touch-fire {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 20px;
            background: rgba(255, 51, 51, 0.15);
            border-color: rgba(255, 51, 51, 0.5);
            color: #f33;
        }
        #touch-fire:active {
            background: rgba(255, 51, 51, 0.4);
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="touch-controls">
        <button class="touch-btn" id="touch-left">◀</button>
        <button class="touch-btn" id="touch-fire">FIRE</button>
        <button class="touch-btn" id="touch-right">▶</button>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');

            const GAME_W = 480;
            const GAME_H = 640;
            canvas.width = GAME_W;
            canvas.height = GAME_H;

            function resize() {
                const maxH = window.innerHeight;
                const maxW = window.innerWidth;
                const scale = Math.min(maxW / GAME_W, maxH / GAME_H);
                canvas.style.width = (GAME_W * scale) + 'px';
                canvas.style.height = (GAME_H * scale) + 'px';
            }
            window.addEventListener('resize', resize);
            resize();

            const COLOR_GREEN = '#33ff33';
            const COLOR_GREEN_DIM = '#1a8c1a';
            const COLOR_GREEN_BRIGHT = '#66ff66';
            const COLOR_BLACK = '#000000';
            const COLOR_RED = '#ff3333';
            const COLOR_WHITE = '#ffffff';

            const INVADER_COLS = 11;
            const INVADER_ROWS = 5;
            const PIXEL = 2;
            const COL_SPACING = 30;
            const ROW_SPACING = 26;

            const INVADER_SPRITES = [
                [
                    [
                        '   XX XX   ',
                        ' XXXXXXXXX ',
                        'XXXXXXXXXXX',
                        'XX XXXXX XX',
                        'XXXXXXXXXXX',
                        '  XXX XXX  ',
                        '   X   X   ',
                        '    XXX    ',
                    ],
                    [
                        '   XX XX   ',
                        ' XXXXXXXXX ',
                        'XXXXXXXXXXX',
                        'XX XXXXX XX',
                        'XXXXXXXXXXX',
                        '   X X X   ',
                        '  X     X  ',
                        ' X       X ',
                    ],
                ],
                [
                    [
                        ' X       X ',
                        ' XXX   XXX ',
                        ' XXXXXXXXX ',
                        'XXXXXXXXXXX',
                        'XXXXXXXXXXX',
                        ' X XXX XXX ',
                        ' X       X ',
                        '   XX XX   ',
                    ],
                    [
                        ' X       X ',
                        ' XXX   XXX ',
                        ' XXXXXXXXX ',
                        'XXXXXXXXXXX',
                        'XXXXXXXXXXX',
                        ' X XXX XXX ',
                        '  X     X  ',
                        ' X       X ',
                    ],
                ],
                [
                    [
                        '   XXXXX   ',
                        '  XXXXXXX  ',
                        ' XXXXXXXXX ',
                        'XX XXXXX XX',
                        ' XXXXXXXXX ',
                        '   XX XX   ',
                        '  X     X  ',
                        ' X       X ',
                    ],
                    [
                        '   XXXXX   ',
                        '  XXXXXXX  ',
                        ' XXXXXXXXX ',
                        'XX XXXXX XX',
                        ' XXXXXXXXX ',
                        '  XX   XX  ',
                        ' X       X ',
                        'X         X',
                    ],
                ],
            ];

            const ROW_TYPES = [2, 1, 1, 0, 0];
            const ROW_SCORES = [30, 20, 20, 10, 10];

            const PLAYER_SPRITE = [
                '      ##      ',
                '     ####     ',
                '    ######    ',
                '   ########   ',
                '  ##########  ',
                ' ############ ',
                '     ####     ',
                '     ####     ',
            ];

            const UFO_SPRITE = [
                '    ######    ',
                '   ########   ',
                '  ##########  ',
                ' ############ ',
                '##  ######  ##',
                '  ##      ##  ',
            ];

            const BUNKER_SHAPE = [
                '......####......',
                '.....######.....',
                '....########....',
                '...##########...',
                '..############..',
                '.##############.',
                '################',
                '################',
                '.##############.',
                '..############..',
            ];

            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        audioCtx = null;
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playBeep(freq, duration, vol = 0.08, type = 'square') {
                if (!audioCtx) return;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + duration);
            }

            function playNoise(duration, vol = 0.06) {
                if (!audioCtx) return;
                const t = audioCtx.currentTime;
                const bufferSize = Math.floor(audioCtx.sampleRate * duration);
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, t);
                filter.Q.setValueAtTime(0.8, t);
                src.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                src.start(t);
                src.stop(t + duration);
            }

            function playShoot() {
                playBeep(600, 0.06, 0.07, 'square');
                setTimeout(() => playBeep(400, 0.04, 0.04, 'square'), 20);
            }

            function playInvaderHit() {
                playNoise(0.15, 0.08);
            }

            function playPlayerHit() {
                playNoise(0.4, 0.12);
                playBeep(80, 0.35, 0.1, 'sawtooth');
            }

            function playUfoHum() {
                if (!audioCtx) return null;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, t);
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(6, t);
                lfoGain.gain.setValueAtTime(80, t);
                gain.gain.setValueAtTime(0.04, t);
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                lfo.start(t);
                return {
                    osc,
                    lfo,
                    gain,
                    stop() {
                        const now = audioCtx.currentTime;
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.stop(now + 0.15);
                        lfo.stop(now + 0.15);
                    },
                };
            }

            let ufoSound = null;
            let marchNoteIdx = 0;
            let marchTimer = 0;
            const MARCH_NOTES = [220, 196, 174, 146];

            function playMarchNote() {
                if (!audioCtx) return;
                const freq = MARCH_NOTES[marchNoteIdx];
                playBeep(freq, 0.08, 0.03, 'square');
                marchNoteIdx = (marchNoteIdx + 1) % 4;
            }

            let game = {};

            function initGame() {
                const grid = [];
                for (let row = 0; row < INVADER_ROWS; row++) {
                    grid[row] = [];
                    for (let col = 0; col < INVADER_COLS; col++) {
                        grid[row][col] = {
                            alive: true,
                            type: ROW_TYPES[row],
                            score: ROW_SCORES[row],
                            animFrame: 0,
                        };
                    }
                }
                game = {
                    grid: grid,
                    groupX: 60,
                    groupY: 70,
                    groupDir: 1,
                    groupSpeed: 0.6,
                    dropAmount: 16,
                    moveAccum: 0,
                    animTimer: 0,
                    animInterval: 0.5,
                    jitterTime: 0,
                    playerX: GAME_W / 2 - 10,
                    playerY: 590,
                    playerWidth: 24,
                    playerHeight: 16,
                    playerSpeed: 5,
                    playerBullet: null,
                    lives: 3,
                    score: 0,
                    highScore: 0,
                    bombs: [],
                    bombTimer: 0,
                    bombInterval: 1.2,
                    ufo: null,
                    ufoTimer: 0,
                    ufoInterval: 25,
                    bunkers: [],
                    gameOver: false,
                    gameOverTimer: 0,
                    paused: false,
                    wave: 1,
                    totalInvaders: INVADER_COLS * INVADER_ROWS,
                    aliveInvaders: INVADER_COLS * INVADER_ROWS,
                    shakeTimer: 0,
                    shakeAmount: 0,
                };
                initBunkers();
                if (ufoSound) { ufoSound.stop();
                    ufoSound = null; }
                marchNoteIdx = 0;
                marchTimer = 0;
            }

            function initBunkers() {
                game.bunkers = [];
                const bunkerW = BUNKER_SHAPE[0].length;
                const bunkerH = BUNKER_SHAPE.length;
                const cellSize = 3;
                const positions = [
                    GAME_W * 0.11 - (bunkerW * cellSize) / 2,
                    GAME_W * 0.31 - (bunkerW * cellSize) / 2,
                    GAME_W * 0.56 - (bunkerW * cellSize) / 2,
                    GAME_W * 0.76 - (bunkerW * cellSize) / 2,
                ];
                const bunkerY = 495;
                for (let b = 0; b < 4; b++) {
                    const cells = [];
                    for (let row = 0; row < bunkerH; row++) {
                        cells[row] = [];
                        for (let col = 0; col < bunkerW; col++) {
                            cells[row][col] = BUNKER_SHAPE[row][col] === '#';
                        }
                    }
                    game.bunkers.push({
                        x: positions[b],
                        y: bunkerY,
                        cellSize: cellSize,
                        cols: bunkerW,
                        rows: bunkerH,
                        cells: cells,
                    });
                }
            }

            function getAliveInvaders() {
                const alive = [];
                for (let row = 0; row < INVADER_ROWS; row++) {
                    for (let col = 0; col < INVADER_COLS; col++) {
                        if (game.grid[row][col].alive) {
                            alive.push({ row, col, type: game.grid[row][col].type });
                        }
                    }
                }
                return alive;
            }

            function getLeftmostCol(alive) {
                let min = INVADER_COLS;
                for (const inv of alive) {
                    if (inv.col < min) min = inv.col;
                }
                return min === INVADER_COLS ? 0 : min;
            }

            function getRightmostCol(alive) {
                let max = -1;
                for (const inv of alive) {
                    if (inv.col > max) max = inv.col;
                }
                return max;
            }

            function getBottommostPerCol(alive) {
                const bottom = new Map();
                for (const inv of alive) {
                    if (!bottom.has(inv.col) || inv.row > bottom.get(inv.col).row) {
                        bottom.set(inv.col, inv);
                    }
                }
                return bottom;
            }

            function getInvaderPos(row, col) {
                const sx = game.groupX + col * COL_SPACING;
                const sy = game.groupY + row * ROW_SPACING;
                const jitter = Math.sin(game.jitterTime * 3.5 + col * 0.7) * 1.2;
                return { x: sx, y: sy + jitter };
            }

            function getInvaderSpriteBounds(row, col) {
                const pos = getInvaderPos(row, col);
                const sprite = INVADER_SPRITES[game.grid[row][col].type][0];
                const w = sprite[0].length * PIXEL;
                const h = sprite.length * PIXEL;
                return { x: pos.x, y: pos.y, w, h };
            }

            function firePlayerBullet() {
                if (game.playerBullet !== null) return;
                if (game.gameOver) return;
                game.playerBullet = {
                    x: game.playerX + game.playerWidth / 2 - 1.5,
                    y: game.playerY - 10,
                    w: 3,
                    h: 12,
                    speed: 9,
                };
                playShoot();
            }

            function spawnBomb(invaderCol, invaderRow) {
                const pos = getInvaderPos(invaderRow, invaderCol);
                const sprite = INVADER_SPRITES[game.grid[invaderRow][invaderCol].type][0];
                const invW = sprite[0].length * PIXEL;
                const invH = sprite.length * PIXEL;
                game.bombs.push({
                    x: pos.x + invW / 2 - 2,
                    y: pos.y + invH,
                    w: 4,
                    h: 12,
                    speed: 3.5 + Math.random() * 2,
                    zigzagPhase: Math.random() * Math.PI * 2,
                });
            }

            function spawnUfo() {
                if (game.ufo !== null) return;
                const fromLeft = Math.random() < 0.5;
                const ufoW = UFO_SPRITE[0].length * PIXEL;
                const ufoH = UFO_SPRITE.length * PIXEL;
                game.ufo = {
                    x: fromLeft ? -ufoW : GAME_W,
                    y: 32,
                    w: ufoW,
                    h: ufoH,
                    speed: 2.2,
                    dir: fromLeft ? 1 : -1,
                    bonus: [50, 100, 150, 300][Math.floor(Math.random() * 4)],
                };
                if (ufoSound) ufoSound.stop();
                ufoSound = playUfoHum();
            }

            function update(dt) {
                if (game.gameOver) {
                    game.gameOverTimer += dt;
                    if (game.shakeTimer > 0) game.shakeTimer -= dt;
                    return;
                }
                if (game.paused) return;

                const alive = getAliveInvaders();
                game.aliveInvaders = alive.length;

                if (alive.length === 0) {
                    startNewWave();
                    return;
                }

                const leftCol = getLeftmostCol(alive);
                const rightCol = getRightmostCol(alive);
                const leftPos = getInvaderPos(0, leftCol);
                const rightPos = getInvaderPos(0, rightCol);
                const spriteW = INVADER_SPRITES[0][0][0].length * PIXEL;
                const leftEdge = leftPos.x;
                const rightEdge = rightPos.x + spriteW;
                const margin = 25;

                if ((game.groupDir > 0 && rightEdge >= GAME_W - margin) ||
                    (game.groupDir < 0 && leftEdge <= margin)) {
                    game.groupDir *= -1;
                    game.groupY += game.dropAmount;
                    game.groupX += game.groupDir * game.groupSpeed * 8;
                }

                const speedMult = 1 + (1 - alive.length / game.totalInvaders) * 3.5;
                const currentSpeed = game.groupSpeed * speedMult;
                game.moveAccum += currentSpeed * dt * 60;
                const steps = Math.floor(game.moveAccum);
                game.moveAccum -= steps;
                game.groupX += game.groupDir * steps;

                if (steps > 0) {
                    marchTimer += dt * 60;
                    const marchInterval = Math.max(2, 18 - speedMult * 4);
                    if (marchTimer >= marchInterval) {
                        marchTimer -= marchInterval;
                        playMarchNote();
                    }
                }

                game.animTimer += dt;
                if (game.animTimer >= game.animInterval / speedMult) {
                    game.animTimer = 0;
                    for (let row = 0; row < INVADER_ROWS; row++) {
                        for (let col = 0; col < INVADER_COLS; col++) {
                            if (game.grid[row][col].alive) {
                                game.grid[row][col].animFrame =
                                    1 - game.grid[row][col].animFrame;
                            }
                        }
                    }
                }

                game.jitterTime += dt;

                const playerStep = game.playerSpeed * dt * 60;
                if (inputState.left) game.playerX -= playerStep;
                if (inputState.right) game.playerX += playerStep;
                game.playerX = Math.max(5, Math.min(GAME_W - game.playerWidth - 5, game.playerX));

                if (game.playerBullet) {
                    game.playerBullet.y -= game.playerBullet.speed * dt * 60;
                    if (game.playerBullet.y < -20) {
                        game.playerBullet = null;
                    }
                }

                game.bombTimer += dt;
                const bombFreq = Math.max(0.15, game.bombInterval - (1 - alive.length / game.totalInvaders) *
                    0.9);
                if (game.bombTimer >= bombFreq && alive.length > 0) {
                    game.bombTimer = 0;
                    const bottomPerCol = getBottommostPerCol(alive);
                    const cols = Array.from(bottomPerCol.keys());
                    if (cols.length > 0) {
                        const chosenCol = cols[Math.floor(Math.random() * cols.length)];
                        const inv = bottomPerCol.get(chosenCol);
                        spawnBomb(inv.col, inv.row);
                    }
                }

                for (let i = game.bombs.length - 1; i >= 0; i--) {
                    const bomb = game.bombs[i];
                    bomb.y += bomb.speed * dt * 60;
                    bomb.zigzagPhase += dt * 14;
                    if (bomb.y > GAME_H + 10) {
                        game.bombs.splice(i, 1);
                    }
                }

                game.ufoTimer += dt;
                if (game.ufo === null && game.ufoTimer >= game.ufoInterval + Math.random() * 10) {
                    game.ufoTimer = 0;
                    spawnUfo();
                }

                if (game.ufo) {
                    game.ufo.x += game.ufo.speed * game.ufo.dir * dt * 60;
                    if ((game.ufo.dir > 0 && game.ufo.x > GAME_W + 10) ||
                        (game.ufo.dir < 0 && game.ufo.x < -game.ufo.w - 10)) {
                        if (ufoSound) { ufoSound.stop();
                            ufoSound = null; }
                        game.ufo = null;
                        game.ufoTimer = 0;
                    }
                }

                checkCollisions();

                const lowestInvaderY = getLowestInvaderY(alive);
                if (lowestInvaderY + ROW_SPACING >= game.playerY - 10) {
                    loseLife();
                }

                if (game.lives <= 0) {
                    endGame();
                }

                if (game.shakeTimer > 0) game.shakeTimer -= dt;
            }

            function getLowestInvaderY(alive) {
                let maxY = 0;
                for (const inv of alive) {
                    const pos = getInvaderPos(inv.row, inv.col);
                    if (pos.y > maxY) maxY = pos.y;
                }
                return maxY;
            }

            function checkCollisions() {
                if (game.playerBullet) {
                    const pb = game.playerBullet;
                    const bx = pb.x;
                    const by = pb.y;
                    const bw = pb.w;
                    const bh = pb.h;

                    const alive = getAliveInvaders();
                    let hitInvader = false;
                    for (const inv of alive) {
                        const bounds = getInvaderSpriteBounds(inv.row, inv.col);
                        if (bx < bounds.x + bounds.w && bx + bw > bounds.x &&
                            by < bounds.y + bounds.h && by + bh > bounds.y) {
                            game.grid[inv.row][inv.col].alive = false;
                            game.score += inv.type === 2 ? 30 : inv.type === 1 ? 20 : 10;
                            if (game.score > game.highScore) game.highScore = game.score;
                            game.playerBullet = null;
                            hitInvader = true;
                            playInvaderHit();
                            break;
                        }
                    }
                    if (hitInvader) return;
                }

                if (game.playerBullet && game.ufo) {
                    const pb = game.playerBullet;
                    const u = game.ufo;
                    if (pb.x < u.x + u.w && pb.x + pb.w > u.x &&
                        pb.y < u.y + u.h && pb.y + pb.h > u.y) {
                        game.score += u.bonus;
                        if (game.score > game.highScore) game.highScore = game.score;
                        game.playerBullet = null;
                        if (ufoSound) { ufoSound.stop();
                            ufoSound = null; }
                        game.ufo = null;
                        game.ufoTimer = 0;
                        playInvaderHit();
                        game.shakeTimer = 0.15;
                        game.shakeAmount = 3;
                        return;
                    }
                }

                if (game.playerBullet) {
                    const pb = game.playerBullet;
                    for (const bunker of game.bunkers) {
                        if (damageBunker(bunker, pb.x + pb.w / 2, pb.y)) {
                            game.playerBullet = null;
                            break;
                        }
                    }
                }

                for (let bi = game.bombs.length - 1; bi >= 0; bi--) {
                    const bomb = game.bombs[bi];
                    const bx = bomb.x + (Math.sin(bomb.zigzagPhase) * 3);
                    const by = bomb.y;
                    const bw = bomb.w;
                    const bh = bomb.h;

                    let bombRemoved = false;

                    for (const bunker of game.bunkers) {
                        if (damageBunker(bunker, bx + bw / 2, by + bh / 2)) {
                            game.bombs.splice(bi, 1);
                            bombRemoved = true;
                            break;
                        }
                    }
                    if (bombRemoved) continue;

                    if (bx < game.playerX + game.playerWidth &&
                        bx + bw > game.playerX &&
                        by < game.playerY + game.playerHeight &&
                        by + bh > game.playerY) {
                        game.bombs.splice(bi, 1);
                        loseLife();
                    }
                }
            }

            function damageBunker(bunker, hitX, hitY) {
                const relX = hitX - bunker.x;
                const relY = hitY - bunker.y;
                const col = Math.floor(relX / bunker.cellSize);
                const row = Math.floor(relY / bunker.cellSize);
                let damaged = false;
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        const r = row + dr;
                        const c = col + dc;
                        if (r >= 0 && r < bunker.rows && c >= 0 && c < bunker.cols) {
                            if (bunker.cells[r][c]) {
                                if (Math.abs(dr) + Math.abs(dc) <= 3) {
                                    bunker.cells[r][c] = false;
                                    damaged = true;
                                }
                            }
                        }
                    }
                }
                return damaged;
            }

            function loseLife() {
                game.lives--;
                game.playerBullet = null;
                game.bombs = [];
                game.playerX = GAME_W / 2 - game.playerWidth / 2;
                playPlayerHit();
                game.shakeTimer = 0.4;
                game.shakeAmount = 6;
                if (game.lives <= 0) {
                    endGame();
                }
            }

            function endGame() {
                game.gameOver = true;
                game.gameOverTimer = 0;
                if (ufoSound) { ufoSound.stop();
                    ufoSound = null; }
                game.ufo = null;
                game.bombs = [];
                game.playerBullet = null;
                playPlayerHit();
            }

            function startNewWave() {
                game.wave++;
                game.groupX = 60;
                game.groupY = 70;
                game.groupDir = 1;
                game.groupSpeed = 0.6 + (game.wave - 1) * 0.2;
                game.moveAccum = 0;
                game.animTimer = 0;
                game.bombTimer = 0;
                game.bombInterval = Math.max(0.3, 1.2 - (game.wave - 1) * 0.15);
                game.playerBullet = null;
                game.bombs = [];
                if (ufoSound) { ufoSound.stop();
                    ufoSound = null; }
                game.ufo = null;
                game.ufoTimer = 0;
                game.ufoInterval = Math.max(12, 25 - (game.wave - 1) * 2);
                for (let row = 0; row < INVADER_ROWS; row++) {
                    for (let col = 0; col < INVADER_COLS; col++) {
                        game.grid[row][col].alive = true;
                        game.grid[row][col].animFrame = 0;
                    }
                }
                game.totalInvaders = INVADER_COLS * INVADER_ROWS;
                game.aliveInvaders = game.totalInvaders;
                initBunkers();
                marchNoteIdx = 0;
                marchTimer = 0;
            }

            function drawSprite(ctx, sprite, x, y, pixelSize, color) {
                ctx.fillStyle = color;
                for (let row = 0; row < sprite.length; row++) {
                    for (let col = 0; col < sprite[row].length; col++) {
                        if (sprite[row][col] === '#') {
                            ctx.fillRect(
                                Math.floor(x + col * pixelSize),
                                Math.floor(y + row * pixelSize),
                                pixelSize,
                                pixelSize
                            );
                        }
                    }
                }
            }

            function drawBomb(ctx, bomb) {
                const zigX = Math.sin(bomb.zigzagPhase) * 3;
                const cx = bomb.x + zigX;
                const cy = bomb.y;
                ctx.fillStyle = COLOR_GREEN;
                ctx.fillRect(cx, cy, 2, 3);
                ctx.fillRect(cx - 2, cy + 3, 6, 2);
                ctx.fillRect(cx, cy + 5, 2, 3);
                ctx.fillRect(cx - 2, cy + 8, 6, 2);
                ctx.fillRect(cx, cy + 10, 2, 3);
            }

            function drawBunker(ctx, bunker) {
                for (let row = 0; row < bunker.rows; row++) {
                    for (let col = 0; col < bunker.cols; col++) {
                        if (bunker.cells[row][col]) {
                            ctx.fillStyle = COLOR_GREEN;
                            ctx.fillRect(
                                Math.floor(bunker.x + col * bunker.cellSize),
                                Math.floor(bunker.y + row * bunker.cellSize),
                                bunker.cellSize,
                                bunker.cellSize
                            );
                        }
                    }
                }
            }

            function render() {
                let shakeX = 0;
                let shakeY = 0;
                if (game.shakeTimer > 0 && game.shakeAmount > 0) {
                    const intensity = game.shakeAmount * (game.shakeTimer / 0.4);
                    shakeX = (Math.random() - 0.5) * intensity * 2;
                    shakeY = (Math.random() - 0.5) * intensity * 2;
                }

                ctx.fillStyle = COLOR_BLACK;
                ctx.fillRect(0, 0, GAME_W, GAME_H);

                ctx.save();
                ctx.translate(shakeX, shakeY);

                ctx.fillStyle = COLOR_GREEN;
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText('SCORE<' + (game.wave) + '>', 20, 22);
                ctx.textAlign = 'right';
                ctx.fillText('HI-SCORE', GAME_W - 20, 22);

                ctx.fillStyle = COLOR_WHITE;
                ctx.font = 'bold 20px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText(game.score.toString().padStart(5, '0'), 20, 46);
                ctx.textAlign = 'right';
                ctx.fillText(game.highScore.toString().padStart(5, '0'), GAME_W - 20, 46);

                ctx.fillStyle = COLOR_GREEN_DIM;
                ctx.fillRect(0, 54, GAME_W, 2);

                for (const bunker of game.bunkers) {
                    drawBunker(ctx, bunker);
                }

                const alive = getAliveInvaders();
                for (const inv of alive) {
                    const pos = getInvaderPos(inv.row, inv.col);
                    const type = game.grid[inv.row][inv.col].type;
                    const frame = game.grid[inv.row][inv.col].animFrame;
                    const sprite = INVADER_SPRITES[type][frame];
                    drawSprite(ctx, sprite, pos.x, pos.y, PIXEL, COLOR_GREEN);
                }

                if (game.ufo) {
                    drawSprite(ctx, UFO_SPRITE, game.ufo.x, game.ufo.y, PIXEL, COLOR_RED);
                    if (game.ufo.bonus === 300) {
                        ctx.fillStyle = COLOR_RED;
                        ctx.font = '10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('300', game.ufo.x + game.ufo.w / 2, game.ufo.y + game.ufo.h + 14);
                    }
                }

                for (const bomb of game.bombs) {
                    drawBomb(ctx, bomb);
                }

                if (game.playerBullet) {
                    ctx.fillStyle = COLOR_GREEN_BRIGHT;
                    const bx = game.playerBullet.x;
                    const by = game.playerBullet.y;
                    ctx.fillRect(bx, by, game.playerBullet.w, game.playerBullet.h);
                    ctx.fillStyle = COLOR_WHITE;
                    ctx.fillRect(bx + 0.5, by - 2, 2, 4);
                }

                drawSprite(ctx, PLAYER_SPRITE, game.playerX, game.playerY, PIXEL,
                    game.shakeTimer > 0 && game.shakeTimer > 0.2 ? COLOR_RED : COLOR_GREEN_BRIGHT);

                ctx.fillStyle = COLOR_GREEN_DIM;
                ctx.fillRect(0, GAME_H - 25, GAME_W, 2);

                ctx.fillStyle = COLOR_GREEN;
                ctx.font = '14px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText('LIVES: ' + game.lives, 20, GAME_H - 10);

                ctx.textAlign = 'right';
                ctx.fillText('WAVE: ' + game.wave, GAME_W - 20, GAME_H - 10);

                ctx.restore();

                if (game.gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, GAME_W, GAME_H);
                    ctx.fillStyle = COLOR_RED;
                    ctx.font = 'bold 40px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', GAME_W / 2, GAME_H / 2 - 30);
                    ctx.fillStyle = COLOR_GREEN;
                    ctx.font = 'bold 18px "Courier New", monospace';
                    ctx.fillText('SCORE: ' + game.score, GAME_W / 2, GAME_H / 2 + 20);
                    if (game.gameOverTimer > 1.0) {
                        const alpha = 0.5 + 0.5 * Math.sin(game.gameOverTimer * 4);
                        ctx.fillStyle = `rgba(51,255,51,${alpha})`;
                        ctx.font = 'bold 16px "Courier New", monospace';
                        ctx.fillText('PRESS SPACE OR TAP TO RESTART', GAME_W / 2, GAME_H / 2 + 55);
                    }
                }
            }

            const inputState = { left: false, right: false, fire: false, firePressed: false };

            function handleKeyDown(e) {
                initAudio();
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputState.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputState.right = true;
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    if (game.gameOver && game.gameOverTimer > 1.0) {
                        restartGame();
                        return;
                    }
                    if (!inputState.fire) {
                        inputState.firePressed = true;
                    }
                    inputState.fire = true;
                }
                if (e.key === 'Enter' && game.gameOver && game.gameOverTimer > 1.0) {
                    restartGame();
                }
            }

            function handleKeyUp(e) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputState.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputState.right = false;
                if (e.key === ' ' || e.key === 'Spacebar') {
                    inputState.fire = false;
                }
            }

            function restartGame() {
                if (ufoSound) { ufoSound.stop();
                    ufoSound = null; }
                initGame();
            }

            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            canvas.addEventListener('click', (e) => {
                initAudio();
                if (game.gameOver && game.gameOverTimer > 1.0) {
                    restartGame();
                    return;
                }
                inputState.firePressed = true;
                inputState.fire = true;
                setTimeout(() => { inputState.fire = false; }, 100);
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (game.gameOver && game.gameOverTimer > 1.0) {
                    restartGame();
                    return;
                }
                inputState.firePressed = true;
                inputState.fire = true;
                setTimeout(() => { inputState.fire = false; }, 100);
            });

            const touchLeft = document.getElementById('touch-left');
            const touchRight = document.getElementById('touch-right');
            const touchFire = document.getElementById('touch-fire');

            if (touchLeft) {
                touchLeft.addEventListener('touchstart', (e) => { e.preventDefault();
                    initAudio();
                    inputState.left = true; });
                touchLeft.addEventListener('touchend', (e) => { e.preventDefault();
                    inputState.left = false; });
                touchLeft.addEventListener('touchcancel', () => { inputState.left = false; });
                touchLeft.addEventListener('mousedown', (e) => { e.preventDefault();
                    initAudio();
                    inputState.left = true; });
                touchLeft.addEventListener('mouseup', () => { inputState.left = false; });
                touchLeft.addEventListener('mouseleave', () => { inputState.left = false; });
            }
            if (touchRight) {
                touchRight.addEventListener('touchstart', (e) => { e.preventDefault();
                    initAudio();
                    inputState.right = true; });
                touchRight.addEventListener('touchend', (e) => { e.preventDefault();
                    inputState.right = false; });
                touchRight.addEventListener('touchcancel', () => { inputState.right = false; });
                touchRight.addEventListener('mousedown', (e) => { e.preventDefault();
                    initAudio();
                    inputState.right = true; });
                touchRight.addEventListener('mouseup', () => { inputState.right = false; });
                touchRight.addEventListener('mouseleave', () => { inputState.right = false; });
            }
            if (touchFire) {
                touchFire.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initAudio();
                    if (game.gameOver && game.gameOverTimer > 1.0) { restartGame(); return; }
                    inputState.firePressed = true;
                    inputState.fire = true;
                });
                touchFire.addEventListener('touchend', (e) => { e.preventDefault();
                    inputState.fire = false; });
                touchFire.addEventListener('touchcancel', () => { inputState.fire = false; });
                touchFire.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    initAudio();
                    if (game.gameOver && game.gameOverTimer > 1.0) { restartGame(); return; }
                    inputState.firePressed = true;
                    inputState.fire = true;
                });
                touchFire.addEventListener('mouseup', () => { inputState.fire = false; });
                touchFire.addEventListener('mouseleave', () => { inputState.fire = false; });
            }

            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.1) dt = 0.1;

                if (inputState.firePressed && !game.gameOver) {
                    inputState.firePressed = false;
                    firePlayerBullet();
                }
                if (inputState.fire && !game.gameOver && game.playerBullet === null) {
                    firePlayerBullet();
                }

                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }

            initGame();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);

            console.log('🚀 SPACE INVADERS 1978 — Ready');
            console.log('Controls: Arrow Keys / A,D to move, Space to fire');
            console.log('Destroy all invaders to advance to the next wave!');
        })();
    </script>
</body>
</html>
