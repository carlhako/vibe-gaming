<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Maze Defense</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background: #0b0e17;
        color: #c8d6e5;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        user-select: none;
    }
    #game-container {
        display: flex;
        gap: 18px;
        padding: 20px;
        background: #141b2b;
        border-radius: 18px;
        box-shadow: 0 0 40px rgba(0, 180, 255, 0.15);
        border: 1px solid #243447;
        flex-wrap: wrap;
        justify-content: center;
        position: relative;
        align-items: flex-start;
    }
    #canvas-wrap {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
        border: 2px solid #1e2d3d;
    }
    canvas {
        display: block;
        background: #1a2332;
        cursor: crosshair;
    }
    #side-panel {
        width: 240px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 14px;
    }
    #difficulty-badge {
        text-align: center;
        padding: 6px 10px;
        background: #101826;
        border-radius: 8px;
        border: 1px solid #1e2d3d;
        font-weight: 600;
        font-size: 13px;
        display: none;
    }
    #difficulty-badge.easy { color: #2ecc71; border-color: #1a5a3a; }
    #difficulty-badge.medium { color: #f1c40f; border-color: #5a4a1a; }
    #difficulty-badge.hard { color: #e74c3c; border-color: #5a1a1a; }
    #stats {
        background: #101826;
        border-radius: 10px;
        padding: 12px 14px;
        border: 1px solid #1e2d3d;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 8px;
    }
    #stats span {
        font-weight: 600;
    }
    .stat-val {
        color: #f0f4ff;
    }
    #money-val {
        color: #f1c40f;
    }
    #lives-val {
        color: #e74c3c;
    }
    #wave-val {
        color: #5dade2;
    }
    .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #5f7a9a;
        margin: 6px 0 4px;
    }
    #tower-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
    }
    .tower-btn {
        background: #101826;
        border: 1px solid #1e2d3d;
        border-radius: 8px;
        padding: 8px 4px;
        color: #c8d6e5;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
        line-height: 1.2;
    }
    .tower-btn:hover {
        background: #1a2a40;
        border-color: #3a5a7a;
    }
    .tower-btn.selected {
        border-color: #5dade2;
        background: #0d2137;
        box-shadow: 0 0 10px rgba(93, 173, 226, 0.25);
    }
    .tower-btn .cost {
        font-size: 10px;
        color: #f1c40f;
        font-weight: 400;
    }
    .tower-btn .tname {
        font-size: 12px;
    }
    .tower-btn.disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    #action-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    #action-bar button {
        flex: 1;
        min-width: 60px;
        background: #101826;
        border: 1px solid #1e2d3d;
        border-radius: 8px;
        padding: 10px 6px;
        color: #c8d6e5;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
    }
    #action-bar button:hover {
        background: #1a2a40;
        border-color: #3a5a7a;
    }
    #action-bar button.primary {
        background: #1a5a3a;
        border-color: #2a8a5a;
        color: #a0f0c0;
    }
    #action-bar button.primary:hover {
        background: #206a44;
    }
    #action-bar button.danger {
        background: #5a1a1a;
        border-color: #8a2a2a;
        color: #f0a0a0;
    }
    #action-bar button.danger:hover {
        background: #6a2020;
    }
    #action-bar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    #info-box {
        background: #101826;
        border-radius: 10px;
        padding: 10px 12px;
        border: 1px solid #1e2d3d;
        min-height: 70px;
        font-size: 13px;
        line-height: 1.4;
        color: #9ab0cc;
    }
    #info-box .highlight {
        color: #f0f4ff;
        font-weight: 600;
    }
    #upgrade-btn {
        display: none;
        margin-top: 6px;
        width: 100%;
        background: #2a4a3a;
        border: 1px solid #3a7a5a;
        border-radius: 8px;
        padding: 8px 6px;
        color: #a0f0c0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
    }
    #upgrade-btn:hover {
        background: #3a5a4a;
    }
    #upgrade-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    #target-btns {
        display: none;
        gap: 4px;
        margin-top: 4px;
        flex-wrap: wrap;
    }
    #target-btns button {
        flex: 1;
        min-width: 40px;
        background: #101826;
        border: 1px solid #1e2d3d;
        border-radius: 6px;
        padding: 5px 4px;
        color: #c8d6e5;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
    }
    #target-btns button:hover {
        background: #1a2a40;
        border-color: #3a5a7a;
    }
    #target-btns button.active {
        border-color: #5dade2;
        background: #0d2137;
    }
    #delete-btn {
        display: none;
        margin-top: 4px;
        width: 100%;
        background: #5a1a1a;
        border: 1px solid #8a2a2a;
        border-radius: 8px;
        padding: 8px 6px;
        color: #f0a0a0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
    }
    #delete-btn:hover {
        background: #6a2020;
    }
    #pause-btn {
        background: #2a2a3a;
        border-color: #4a4a6a;
    }
    #pause-btn:hover {
        background: #3a3a4a;
    }
    #speed-btn {
        background: #2a2a3a;
        border-color: #4a4a6a;
    }
    #speed-btn:hover {
        background: #3a3a4a;
    }
    #game-over-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 12px;
        z-index: 10;
    }
    #game-over-overlay.show {
        display: flex;
    }
    #game-over-overlay h1 {
        font-size: 42px;
        margin-bottom: 8px;
        text-shadow: 0 0 30px rgba(231, 76, 60, 0.5);
    }
    #game-over-overlay .sub {
        font-size: 20px;
        color: #9ab0cc;
        margin-bottom: 20px;
    }
    #game-over-overlay button {
        padding: 12px 40px;
        font-size: 18px;
        background: #1a5a3a;
        border: 2px solid #2a8a5a;
        border-radius: 12px;
        color: #f0f4ff;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
    }
    #game-over-overlay button:hover {
        background: #206a44;
        transform: scale(1.05);
    }
    #difficulty-overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 8, 15, 0.93);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 18px;
        z-index: 20;
        gap: 12px;
    }
    #difficulty-overlay.show {
        display: flex;
    }
    #difficulty-overlay h1 {
        font-size: 36px;
        color: #5dade2;
        text-shadow: 0 0 25px rgba(93, 173, 226, 0.4);
        margin-bottom: 4px;
    }
    #difficulty-overlay .subtitle {
        font-size: 16px;
        color: #9ab0cc;
        margin-bottom: 8px;
    }
    #difficulty-buttons {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .diff-btn {
        padding: 16px 22px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid;
        color: #f0f4ff;
        min-width: 130px;
        background: transparent;
        text-align: center;
        line-height: 1.35;
        font-family: inherit;
    }
    .diff-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 0 18px rgba(255,255,255,0.1);
    }
    .diff-btn.easy-btn {
        background: #1a3a2a;
        border-color: #2a8a5a;
    }
    .diff-btn.easy-btn:hover {
        background: #1f4a34;
        box-shadow: 0 0 20px rgba(46, 204, 113, 0.25);
    }
    .diff-btn.med-btn {
        background: #3a2e1a;
        border-color: #8a7a2a;
    }
    .diff-btn.med-btn:hover {
        background: #4a3a1f;
        box-shadow: 0 0 20px rgba(241, 196, 15, 0.25);
    }
    .diff-btn.hard-btn {
        background: #3a1a1a;
        border-color: #8a2a2a;
    }
    .diff-btn.hard-btn:hover {
        background: #4a1f1f;
        box-shadow: 0 0 20px rgba(231, 76, 60, 0.25);
    }
    .diff-btn .detail {
        font-size: 11px;
        font-weight: 400;
        opacity: 0.85;
        margin-top: 2px;
        color: #c8d6e5;
    }
    /* ── Seed UI ─────────────────────────────────────── */
    #seed-section-overlay {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(16, 24, 38, 0.85);
        border: 1px solid #2a3a4a;
        border-radius: 10px;
        padding: 8px 14px;
        margin-bottom: 2px;
    }
    #seed-section-overlay label {
        font-size: 13px;
        font-weight: 600;
        color: #8aa0c0;
        white-space: nowrap;
    }
    #seed-input-overlay {
        background: #0b0e17;
        border: 1px solid #2a3a4a;
        border-radius: 6px;
        padding: 7px 10px;
        color: #f0f4ff;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        width: 100px;
        text-align: center;
        letter-spacing: 1px;
        outline: none;
        transition: border-color 0.15s;
    }
    #seed-input-overlay:focus {
        border-color: #5dade2;
        box-shadow: 0 0 8px rgba(93, 173, 226, 0.2);
    }
    #seed-input-overlay.invalid {
        border-color: #e74c3c;
        box-shadow: 0 0 8px rgba(231, 76, 60, 0.3);
    }
    .seed-btn {
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
        border: 1px solid #2a3a4a;
        color: #c8d6e5;
        background: #101826;
        font-family: inherit;
        white-space: nowrap;
    }
    .seed-btn:hover {
        background: #1a2a40;
        border-color: #3a5a7a;
    }
    .seed-btn.load-btn {
        background: #1a3a2a;
        border-color: #2a6a4a;
        color: #a0f0c0;
    }
    .seed-btn.load-btn:hover {
        background: #1f4a34;
    }
    .seed-btn.rand-btn {
        font-size: 16px;
        padding: 7px 10px;
    }
    #seed-error-overlay {
        font-size: 11px;
        color: #e74c3c;
        text-align: center;
        min-height: 16px;
        line-height: 16px;
        margin-top: -4px;
        margin-bottom: 2px;
    }
    #seed-display-panel {
        background: #101826;
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid #1e2d3d;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
    }
    #seed-display-panel .seed-label {
        color: #5f7a9a;
        font-weight: 600;
        white-space: nowrap;
    }
    #seed-display-panel .seed-value {
        color: #f0f4ff;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 1px;
        flex: 1;
        text-align: center;
    }
    #seed-copy-btn {
        background: #101826;
        border: 1px solid #2a3a4a;
        border-radius: 5px;
        padding: 4px 8px;
        color: #8aa0c0;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
        white-space: nowrap;
    }
    #seed-copy-btn:hover {
        background: #1a2a40;
        border-color: #3a5a7a;
        color: #c8d6e5;
    }
    #seed-copy-btn.copied {
        color: #2ecc71;
        border-color: #2a8a5a;
        background: #1a3a2a;
    }
    .tooltip {
        position: relative;
    }
    @media (max-width: 700px) {
        #game-container {
            flex-direction: column;
            align-items: center;
            padding: 12px;
            gap: 12px;
        }
        #side-panel {
            width: 100%;
            max-width: 616px;
        }
        #tower-buttons {
            grid-template-columns: repeat(6, 1fr);
        }
        #difficulty-overlay h1 {
            font-size: 26px;
        }
        #difficulty-buttons {
            gap: 8px;
        }
        .diff-btn {
            padding: 12px 16px;
            font-size: 13px;
            min-width: 100px;
        }
        #seed-section-overlay {
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 6px 10px;
        }
        #seed-input-overlay {
            width: 80px;
            font-size: 12px;
        }
    }
    @media (max-width: 480px) {
        #tower-buttons {
            grid-template-columns: repeat(3, 1fr);
        }
        #stats {
            font-size: 12px;
        }
        #difficulty-buttons {
            flex-direction: column;
            gap: 6px;
        }
        .diff-btn {
            min-width: auto;
            width: 100%;
        }
    }
</style>
</head>
<body>
<div id="game-container">
    <div id="canvas-wrap">
        <canvas id="gameCanvas" width="616" height="616"></canvas>
        <div id="game-over-overlay">
            <h1 style="color:#e74c3c;">GAME OVER</h1>
            <div class="sub" id="final-wave">Wave 0</div>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    <div id="difficulty-overlay" class="show">
        <h1>🏰 Tower Maze Defense</h1>
        <div class="subtitle">Select Difficulty</div>
        <div id="seed-section-overlay">
            <label for="seed-input-overlay">🗺 Seed:</label>
            <input type="text" id="seed-input-overlay" maxlength="8" autocomplete="off" spellcheck="false">
            <button class="seed-btn load-btn" id="seed-load-overlay">Load</button>
            <button class="seed-btn rand-btn" id="seed-random-overlay" title="Random seed">🎲</button>
        </div>
        <div id="seed-error-overlay"></div>
        <div id="difficulty-buttons">
            <button class="diff-btn easy-btn">🟢 Easy<div class="detail">Standard enemies</div></button>
            <button class="diff-btn med-btn">🟡 Medium<div class="detail">Enemies 1.2× HP</div></button>
            <button class="diff-btn hard-btn">🔴 Hard<div class="detail">Enemies 1.4× HP<br>20% less income</div></button>
        </div>
    </div>
    <div id="side-panel">
        <div id="difficulty-badge">
            🛡️ <span id="difficulty-label">Easy</span>
        </div>
        <div id="stats">
            <span>💰 <span class="stat-val" id="money-val">120</span></span>
            <span>❤️ <span class="stat-val" id="lives-val">10</span></span>
            <span>🌊 <span class="stat-val" id="wave-val">0</span></span>
            <span>⚔️ <span class="stat-val" id="kill-val">0</span></span>
            <span>🏗️ <span class="stat-val" id="tower-count-val">0</span></span>
        </div>
        <div id="seed-display-panel" style="display:none;">
            <span class="seed-label">🗺 Seed</span>
            <span class="seed-value" id="seed-display-text"></span>
            <button id="seed-copy-btn" title="Copy seed to clipboard">📋 Copy</button>
        </div>
        <div class="section-title">⟐ Towers</div>
        <div id="tower-buttons">
            <button class="tower-btn" data-type="arrow"><span class="tname">🏹 Arrow</span><br><span class="cost">$65</span></button>
            <button class="tower-btn" data-type="cannon"><span class="tname">💥 Cannon</span><br><span class="cost">$130</span></button>
            <button class="tower-btn" data-type="ice"><span class="tname">❄️ Ice</span><br><span class="cost">$95</span></button>
            <button class="tower-btn" data-type="sniper"><span class="tname">🎯 Sniper</span><br><span class="cost">$190</span></button>
            <button class="tower-btn" data-type="tesla"><span class="tname">⚡ Tesla</span><br><span class="cost">$260</span></button>
            <button class="tower-btn" data-type="mint"><span class="tname">💰 Mint</span><br><span class="cost">$500</span></button>
        </div>
        <div id="action-bar">
            <button id="wave-btn" class="primary">▶ Wave</button>
            <button id="new-map-btn">🗺 New Map</button>
            <button id="pause-btn">⏸ Pause</button>
            <button id="speed-btn">⏩ 1x</button>
        </div>
        <div class="section-title">⟐ Info</div>
        <div id="info-box">
            <div>Select a tower to place it on the grid.</div>
        </div>
        <div id="upgrade-btn">⬆ Upgrade (??)</div>
        <div id="target-btns">
            <button data-mode="nearest">🎯 Nearest</button>
            <button data-mode="first">🚩 First</button>
            <button data-mode="last">🏁 Last</button>
            <button data-mode="random">🎲 Random</button>
        </div>
        <div id="delete-btn">🗑 Delete Tower (50% refund)</div>
    </div>
</div>
<script>
(function() {
    'use strict';

    // ─── Constants ──────────────────────────────────────────────────────
    const SIZE = 22;
    const CELL = 28;
    const CANVAS = CELL * SIZE;

    // ─── Canvas ─────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS;
    canvas.height = CANVAS;

    // ─── DOM refs ───────────────────────────────────────────────────────
    const moneyEl = document.getElementById('money-val');
    const livesEl = document.getElementById('lives-val');
    const waveEl = document.getElementById('wave-val');
    const killEl = document.getElementById('kill-val');
    const towerCountEl = document.getElementById('tower-count-val');
    const infoBox = document.getElementById('info-box');
    const upgradeBtn = document.getElementById('upgrade-btn');
    const targetBtns = document.getElementById('target-btns');
    const deleteBtn = document.getElementById('delete-btn');
    const waveBtn = document.getElementById('wave-btn');
    const newMapBtn = document.getElementById('new-map-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const speedBtn = document.getElementById('speed-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const finalWaveEl = document.getElementById('final-wave');
    const difficultyOverlay = document.getElementById('difficulty-overlay');
    const difficultyBadge = document.getElementById('difficulty-badge');
    const difficultyLabel = document.getElementById('difficulty-label');
    const diffBtns = document.querySelectorAll('.diff-btn');

    // Seed UI
    const seedInputOverlay = document.getElementById('seed-input-overlay');
    const seedLoadOverlay = document.getElementById('seed-load-overlay');
    const seedRandomOverlay = document.getElementById('seed-random-overlay');
    const seedErrorOverlay = document.getElementById('seed-error-overlay');
    const seedDisplayPanel = document.getElementById('seed-display-panel');
    const seedDisplayText = document.getElementById('seed-display-text');
    const seedCopyBtn = document.getElementById('seed-copy-btn');

    // ─── Seeded PRNG ────────────────────────────────────────────────────
    function mulberry32(a) {
        return function() {
            a |= 0;
            a = a + 0x6D2B79F5 | 0;
            var t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function generateRandomSeed() {
        return Math.floor(Math.random() * 4294967296);
    }

    function seedToHex(seed) {
        return (seed >>> 0).toString(16).padStart(8, '0');
    }

    function hexToSeed(hex) {
        const parsed = parseInt(hex, 16);
        if (isNaN(parsed)) return null;
        return parsed >>> 0;
    }

    function isValidHexFormat(hex) {
        return /^[0-9a-fA-F]{1,8}$/.test(hex) && hex.trim().length > 0;
    }

    // ─── Tower Definitions ──────────────────────────────────────────────
    const TOWER_TYPES = {
        arrow: {
            name: 'Arrow',
            emoji: '🏹',
            levels: [
                { cost: 65, damage: 10, range: 3.0, fireRate: 1.8, color: '#5dade2' },
                { cost: 65, damage: 18, range: 3.2, fireRate: 2.0, color: '#2e86de' },
                { cost: 95, damage: 26, range: 3.8, fireRate: 2.2, color: '#1b4f72' }
            ]
        },
        cannon: {
            name: 'Cannon',
            emoji: '💥',

    // ─── Enhanced Path Generation (seeded) ─────────────────────────────
    function generatePath(prng) {
        const rand = prng || Math.random;
        const size = SIZE;
        const path = [];
        const visited = new Set();

        const amplitude = Math.floor(size * (0.42 + rand() * 0.15));
        const centerY = size / 2;
        const freq1 = 0.6 + rand() * 0.9;
        const freq2 = 2.0 + rand() * 1.5;
        const phase1 = rand() * Math.PI * 2;
        const phase2 = rand() * Math.PI * 2;

        const rawTargets = new Array(size);
        for (let x = 0; x < size; x++) {
            const t = x / (size - 1);
            const wave1 = Math.sin(t * Math.PI * 2 * freq1 + phase1) * amplitude;
            const wave2 = Math.sin(t * Math.PI * 2 * freq2 + phase2) * (amplitude * 0.5);
            const noise = (rand() - 0.5) * 2.2;
            rawTargets[x] = centerY + wave1 + wave2 + noise;
        }

        const smoothed = new Array(size);
        for (let x = 0; x < size; x++) {
            let sum = rawTargets[x];
            let count = 1;
            if (x > 0) { sum += rawTargets[x - 1]; count++; }
            if (x < size - 1) { sum += rawTargets[x + 1]; count++; }
            smoothed[x] = sum / count;
        }

        for (let x = 0; x < size; x++) {
            smoothed[x] = Math.max(1.5, Math.min(size - 2.5, smoothed[x]));
        }

        let startY = Math.round(smoothed[0]);
        startY = Math.max(1, Math.min(size - 2, startY));
        const start = [0, startY];
        path.push(start);
        visited.add('0,' + startY);

        let prevY = startY;
        for (let x = 1; x < size; x++) {
            const targetY = Math.round(smoothed[x]);
            const clampedTarget = Math.max(1, Math.min(size - 2, targetY));

            let curY = prevY;
            while (curY !== clampedTarget) {
                const dy = curY < clampedTarget ? 1 : -1;
                curY += dy;
                const key = (x - 1) + ',' + curY;
                if (!visited.has(key)) {
                    path.push([x - 1, curY]);
                    visited.add(key);
                } else {
                    break;
                }
            }

            const rightKey = x + ',' + curY;
            if (!visited.has(rightKey)) {
                path.push([x, curY]);
                visited.add(rightKey);
            } else {
                let found = false;
                for (let offset = 1; offset <= 5; offset++) {
                    for (const sign of [1, -1]) {
                        const tryY = curY + offset * sign;
                        if (tryY >= 1 && tryY < size - 1) {
                            const tryKey = x + ',' + tryY;
                            if (!visited.has(tryKey)) {
                                path.push([x, tryY]);
                                visited.add(tryKey);
                                found = true;
                                break;
                            }
                        }
                    }
                    if (found) break;
                }
                if (!found) {
                    const fallbackY = Math.min(Math.max(1, curY), size - 2);
                    const fallbackKey = x + ',' + fallbackY;
                    if (!visited.has(fallbackKey)) {
                        path.push([x, fallbackY]);
                        visited.add(fallbackKey);
                    }
                }
            }
            prevY = path[path.length - 1][1];
        }

        const end = path[path.length - 1];
        if (end[0] < size - 1) {
            let curX = end[0];
            let curY = end[1];
            while (curX < size - 1) {
                curX++;
                const key = curX + ',' + curY;
                if (!visited.has(key)) {
                    path.push([curX, curY]);
                    visited.add(key);
                }
            }
        }

        const buildable = Array.from({ length: size }, () => Array(size).fill(true));
        const pathSet = new Set(path.map(p => p[0] + ',' + p[1]));
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (pathSet.has(c + ',' + r)) {
                    buildable[r][c] = false;
                }
            }
        }

        const pathStart = path[0];
        const pathEnd = path[path.length - 1];
        const buildableCount = buildable.flat().filter(Boolean).length;

        return { path, buildable, start: pathStart, end: pathEnd, buildableCount };
    }

    // ─── Path validation ────────────────────────────────────────────────
    function validatePathData(data) {
        if (!data || !data.path || data.path.length === 0) {
            return { valid: false, reason: 'Generated path is empty.' };
        }
        const p = data.path;
        // Must start at x=0
        if (p[0][0] !== 0) {
            return { valid: false, reason: 'Path does not start at left edge.' };
        }
        // Must end at x=SIZE-1
        if (p[p.length - 1][0] !== SIZE - 1) {
            return { valid: false, reason: 'Path does not reach right edge.' };
        }
        // Must be contiguous (each step adjacent to previous)
        for (let i = 1; i < p.length; i++) {
            const dx = Math.abs(p[i][0] - p[i - 1][0]);
            const dy = Math.abs(p[i][1] - p[i - 1][1]);
            if (!((dx === 1 && dy === 0) || (dx === 0 && dy === 1))) {
                return { valid: false, reason: 'Path is not contiguous at step ' + i + '.' };
            }
        }
        // Check bounds for all cells
        for (const cell of p) {
            if (cell[0] < 0 || cell[0] >= SIZE || cell[1] < 0 || cell[1] >= SIZE) {
                return { valid: false, reason: 'Path cell out of bounds.' };
            }
        }
        // Must have enough buildable cells
        if (data.buildableCount < MIN_BUILDABLE_CELLS) {
            return { valid: false, reason: 'Not enough buildable cells (' + data.buildableCount + '). Need at least ' + MIN_BUILDABLE_CELLS + '.' };
        }
        return { valid: true, reason: '' };
    }

    // ─── Seed loading ───────────────────────────────────────────────────
    function tryLoadSeed(hexStr, isPreGame) {
        const trimmed = hexStr.trim().toLowerCase();
        if (!isValidHexFormat(trimmed)) {
            showSeedError('Invalid seed — use 1–8 hex digits (0-9, a-f).');
            return false;
        }
        const seed = hexToSeed(trimmed);
        if (seed === null) {
            showSeedError('Could not parse seed value.');
            return false;
        }

        // Test-generate the path
        const prng = mulberry32(seed);
        const data = generatePath(prng);
        const validation = validatePathData(data);
        if (!validation.valid) {
            showSeedError('Bad seed: ' + validation.reason);
            return false;
        }

        // Seed is valid
        clearSeedError();

        if (isPreGame || !game) {
            pendingSeed = seed;
            seedInputOverlay.value = seedToHex(seed);
            seedInputOverlay.classList.remove('invalid');
            return true;
        }

        // In-game: apply the seed (only if no progress)
        if (game.wave > 0 || game.waveActive) {
            showSeedError('Cannot change seed while a wave is in progress.');
            return false;
        }

        game.seed = seed;
        game.path = data.path;
        game.buildable = data.buildable;
        game.pathStart = data.start;
        game.pathEnd = data.end;
        game.towers = [];
        game.enemies = [];
        game.projectiles = [];
        game.particles = [];
        game.stunEffects = [];
        game.waveEnemyQueue = [];
        game.waveTimer = 0;
        game.waveCooldown = 0;
        deselectTowerType();
        game.selectedTower = null;
        updateSeedDisplay();
        updateUI();
        showInfo(null);
        render();
        return true;
    }

    function showSeedError(msg) {
        seedErrorOverlay.textContent = msg;
        seedInputOverlay.classList.add('invalid');
    }

    function clearSeedError() {
        seedErrorOverlay.textContent = '';
        seedInputOverlay.classList.remove('invalid');

        if (!game || !game.difficulty) {
            seedDisplayPanel.style.display = 'none';
