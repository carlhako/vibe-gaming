        clearSeedError();
        seedInputOverlay.classList.remove('invalid');
    }

    // ─── Wave Generation ───────────────────────────────────────────────
    function generateWave(waveNum) {
        const enemies = [];
        const baseCount = 7 + waveNum * 3;
        const count = Math.min(baseCount, 55);

        let types = ['normal'];
        if (waveNum >= 3) types.push('fast');
        if (waveNum >= 5) types.push('heavy');
        const hasBoss = waveNum >= 6;

        const hpWaveMultiplier = Math.pow(1.04, waveNum);
        const diffSetting = game.difficulty ? DIFFICULTY_SETTINGS[game.difficulty] : DIFFICULTY_SETTINGS['easy'];
        const difficultyHpMult = diffSetting.hpMult;

        for (let i = 0; i < count; i++) {
            let type;
            const r = Math.random();
            if (hasBoss && i === count - 1) {
                type = 'boss';
            } else if (waveNum >= 5 && r < 0.18) {
                type = 'heavy';
            } else if (waveNum >= 3 && r < 0.35) {
                type = 'fast';
            } else {
                type = 'normal';
            }

            const baseHp = 22 + waveNum * 11;
            const def = ENEMY_TYPES[type];
            const hp = Math.round(baseHp * def.hpMult * hpWaveMultiplier * difficultyHpMult);
            const speedMult = 1.0 + waveNum * 0.01;
            const speed = def.speed * speedMult * (0.95 + Math.random() * 0.1);
            enemies.push({
                type: type,
                hp: hp,
                maxHp: hp,
                speed: speed,
                reward: def.reward + Math.floor(waveNum / 3),
                color: def.color,
                size: def.size,
                name: def.name,
                slowTimer: 0,
                slowFactor: 1.0
            });
        }
        if (hasBoss) {
            const boss = enemies.pop();
            for (let i = enemies.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [enemies[i], enemies[j]] = [enemies[j], enemies[i]];
            }
            enemies.push(boss);
        } else {
            for (let i = enemies.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [enemies[i], enemies[j]] = [enemies[j], enemies[i]];
            }
        }
        const spawnInterval = Math.max(0.25, 1.15 - waveNum * 0.02);
        const queue = enemies.map((e, i) => ({
            enemy: e,
            spawnTime: i * spawnInterval
        }));
        return queue;
    }

    // ─── Tower Factory ─────────────────────────────────────────────────
    function createTower(type, col, row) {
        const defs = TOWER_TYPES[type];
        if (!defs) return null;
        const level0 = defs.levels[0];
        const tower = {
            id: game.towerIdCounter++,
            type: type,
            col: col,
            row: row,
            level: 0,
            damage: level0.damage || 0,
            range: level0.range || 0,
            fireRate: level0.fireRate || 0,
            color: level0.color,
            splash: level0.splash || 0,
            slow: level0.slow || 0,
            chain: level0.chain || 1,
            income: level0.income || 0,
            cooldown: 0,
            angle: 0,
            target: null,
            fireTimer: 0,
            targetMode: 'first',
            totalCost: level0.cost,
            stunTimer: 0
        };
        return tower;
    }

    function upgradeTower(tower) {
        const defs = TOWER_TYPES[tower.type];
        if (!defs) return false;
        const nextLevel = tower.level + 1;
        if (nextLevel >= defs.levels.length) return false;
        const lvl = defs.levels[nextLevel];
        const cost = lvl.cost;
        if (game.money < cost) return false;
        game.money -= cost;
        tower.level = nextLevel;
        tower.damage = lvl.damage || tower.damage;
        tower.range = lvl.range || tower.range;
        tower.fireRate = lvl.fireRate || tower.fireRate;
        tower.color = lvl.color;
        tower.splash = lvl.splash || 0;
        tower.slow = lvl.slow || 0;
        tower.chain = lvl.chain || 1;
        tower.income = lvl.income || 0;
        tower.totalCost += cost;
        updateUI();
        showInfo(tower);
        return true;
    }

    function deleteTower(tower) {
        const refund = Math.floor(tower.totalCost * 0.5);
        game.money += refund;
        const idx = game.towers.indexOf(tower);
        if (idx !== -1) game.towers.splice(idx, 1);
        if (game.selectedTower === tower) {
            game.selectedTower = null;
            showInfo(null);
        }
        updateUI();
        render();
    }

    // ─── Enemy creation ────────────────────────────────────────────────
    function spawnEnemy(waveEnemy) {
        const e = waveEnemy.enemy;
        const start = game.pathStart;
        const enemy = {
            id: game.enemyIdCounter++,
            type: e.type,
            hp: e.hp,
            maxHp: e.maxHp,
            speed: e.speed,
            reward: e.reward,
            color: e.color,
            size: e.size,
            name: e.name,
            slowTimer: 0,
            slowFactor: 1.0,
            pathIndex: 0,
            x: start[0] * CELL + CELL / 2,
            y: start[1] * CELL + CELL / 2,
            alive: true,
            reachedEnd: false
        };
        if (enemy.type === 'boss') {
            enemy.stunCooldown = 10;
            enemy.stunCooldownMax = 10;
            enemy.spawnCooldown = 15;
            enemy.spawnCooldownMax = 15;
        }
        game.enemies.push(enemy);
    }

    function spawnMinionAt(bossEnemy) {
        const spawnTypes = ['normal', 'fast', 'heavy'];
        const randomType = spawnTypes[Math.floor(Math.random() * spawnTypes.length)];
        const def = ENEMY_TYPES[randomType];
        const waveNum = game.wave;
        const hpWaveMultiplier = Math.pow(1.04, waveNum);
        const diffSetting = game.difficulty ? DIFFICULTY_SETTINGS[game.difficulty] : DIFFICULTY_SETTINGS['easy'];
        const difficultyHpMult = diffSetting.hpMult;
        const baseHp = 22 + waveNum * 11;
        const hp = Math.round(baseHp * def.hpMult * hpWaveMultiplier * difficultyHpMult);
        const speedMult = 1.0 + waveNum * 0.01;
        const speed = def.speed * speedMult * (0.95 + Math.random() * 0.1);

        const spawned = {
            id: game.enemyIdCounter++,
            type: randomType,
            hp: hp,
            maxHp: hp,
            speed: speed,
            reward: def.reward + Math.floor(waveNum / 3),
            color: def.color,
            size: def.size,
            name: def.name,
            slowTimer: 0,
            slowFactor: 1.0,
            pathIndex: bossEnemy.pathIndex,
            x: bossEnemy.x,
            y: bossEnemy.y,
            alive: true,
            reachedEnd: false
        };
        game.enemies.push(spawned);
    }

    // ─── Game Logic ────────────────────────────────────────────────────
    function startWave() {
        if (game.gameOver) return;
        if (!game.difficulty) return;
        if (game.waveActive) return;
        if (game.waveCooldown > 0) return;
        game.wave++;
        const queue = generateWave(game.wave);
        game.waveEnemyQueue = queue;
        game.waveTimer = 0;
        game.waveActive = true;
        waveBtn.textContent = '⚔️ Fighting';
        waveBtn.style.opacity = '0.6';
        waveBtn.disabled = true;
        newMapBtn.style.display = 'none';
        updateUI();
    }

    function checkWaveComplete() {
        if (!game.waveActive) return;
        if (game.waveEnemyQueue.length > 0) return;
        if (game.enemies.length > 0) return;

        game.waveActive = false;
        waveBtn.textContent = '▶ Wave';
        waveBtn.style.opacity = '1';
        waveBtn.disabled = false;
        game.waveCooldown = 0.5;
        const bonus = 15 + game.wave * 2;
        addMoney(bonus);

        for (const tower of game.towers) {
            if (tower.type === 'mint' && tower.income > 0) {
                addMoney(tower.income);
            }
        }

        updateUI();
    }

    function updateStats(dt) {
        if (game.gameOver) return;
        if (game.paused) return;
        if (!game.difficulty) return;

        const dtScaled = dt * game.speed;
        game.animTime += dtScaled;

        if (game.waveActive && game.waveEnemyQueue.length > 0) {
            game.waveTimer += dtScaled;
            while (game.waveEnemyQueue.length > 0 && game.waveTimer >= game.waveEnemyQueue[0].spawnTime) {
                const we = game.waveEnemyQueue.shift();
                spawnEnemy(we);
            }
        }

        const path = game.path;
        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            if (!e.alive) continue;

            if (e.slowTimer > 0) {
                e.slowTimer -= dtScaled;
                if (e.slowTimer < 0) { e.slowTimer = 0; e.slowFactor = 1.0; }
            }

            const speed = e.speed * e.slowFactor * CELL * 1.2;
            const targetIdx = e.pathIndex + 1;
            if (targetIdx >= path.length) {
                e.alive = false;
                e.reachedEnd = true;
                game.lives--;
                if (game.lives <= 0) {
                    game.lives = 0;
                    gameOver();
                }
                updateUI();
                continue;
            }

            const target = path[targetIdx];
            const tx = target[0] * CELL + CELL / 2;
            const ty = target[1] * CELL + CELL / 2;
            const dx = tx - e.x;
            const dy = ty - e.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 1) {
                e.x = tx;
                e.y = ty;
                e.pathIndex = targetIdx;
            } else {
                const move = Math.min(speed * dtScaled, dist);
                e.x += (dx / dist) * move;
                e.y += (dy / dist) * move;
            }
        }

        for (let i = game.enemies.length - 1; i >= 0; i--) {
            if (!game.enemies[i].alive) {
                if (!game.enemies[i].reachedEnd) {
                    addMoney(game.enemies[i].reward);
                    game.kills++;
                    spawnParticles(game.enemies[i].x, game.enemies[i].y, '#f1c40f', 5);
                }
                game.enemies.splice(i, 1);
            }
        }
        updateUI();
        checkWaveComplete();

        if (game.waveCooldown > 0) {
            game.waveCooldown -= dtScaled;
            if (game.waveCooldown < 0) game.waveCooldown = 0;
        }

        for (let i = 0; i < game.enemies.length; i++) {
            const enemy = game.enemies[i];
            if (!enemy.alive) continue;
            if (enemy.type !== 'boss') continue;

            if (enemy.stunCooldown !== undefined) {
                enemy.stunCooldown -= dtScaled;
                if (enemy.stunCooldown <= 0) {
                    let closestTower = null;
                    let closestDist = Infinity;
                    for (const tower of game.towers) {
                        const tcx = tower.col * CELL + CELL / 2;
                        const tcy = tower.row * CELL + CELL / 2;
                        const dx = tcx - enemy.x;
                        const dy = tcy - enemy.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestTower = tower;
                        }
                    }
                    if (closestTower) {
                        closestTower.stunTimer = 2.5;
                        const tcx = closestTower.col * CELL + CELL / 2;
                        const tcy = closestTower.row * CELL + CELL / 2;
                        game.stunEffects.push({
                            x1: enemy.x, y1: enemy.y,
                            x2: tcx, y2: tcy,
                            life: 0.4, maxLife: 0.4
                        });
                        spawnParticles(enemy.x, enemy.y, '#9b59b6', 12);
                        spawnParticles(tcx, tcy, '#c39bdb', 15);
                    }
                    enemy.stunCooldown = enemy.stunCooldownMax;
                }
            }

            if (enemy.spawnCooldown !== undefined) {
                enemy.spawnCooldown -= dtScaled;
                if (enemy.spawnCooldown <= 0) {
                    spawnMinionAt(enemy);
                    spawnParticles(enemy.x, enemy.y, '#e74c3c', 20);
                    enemy.spawnCooldown = enemy.spawnCooldownMax;
                }
            }
        }

        for (const tower of game.towers) {
            if (tower.stunTimer > 0) {
                tower.stunTimer -= dtScaled;
            }

            if (tower.type === 'mint') continue;
            if (tower.stunTimer > 0) continue;

            tower.cooldown -= dtScaled;

            const range = tower.range * CELL;
            const cx = tower.col * CELL + CELL / 2;
            const cy = tower.row * CELL + CELL / 2;

            const inRange = [];
            for (const enemy of game.enemies) {
                if (!enemy.alive) continue;
                const dx = enemy.x - cx;
                const dy = enemy.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist <= range) {
                    inRange.push({ enemy, dist });
                }
            }

            let bestEnemy = null;
            if (inRange.length > 0) {
                switch (tower.targetMode) {
                    case 'nearest':
                        inRange.sort((a, b) => a.dist - b.dist);
                        bestEnemy = inRange[0].enemy;
                        break;
                    case 'first': {
                        let best = null;
                        let bestProgress = -1;
                        for (const item of inRange) {
                            if (item.enemy.pathIndex > bestProgress) {
                                bestProgress = item.enemy.pathIndex;
                                best = item.enemy;
                            }
                        }
                        bestEnemy = best;
                        break;
                    }
                    case 'last': {
                        let best = null;
                        let bestProgress = Infinity;
                        for (const item of inRange) {
                            if (item.enemy.pathIndex < bestProgress) {
                                bestProgress = item.enemy.pathIndex;
                                best = item.enemy;
                            }
                        }
                        bestEnemy = best;
                        break;
                    }
                    case 'random':
                        bestEnemy = inRange[Math.floor(Math.random() * inRange.length)].enemy;
                        break;
                }
            }

            tower.target = bestEnemy;

            if (bestEnemy && tower.cooldown <= 0) {
                const dx = bestEnemy.x - cx;
                const dy = bestEnemy.y - cy;
                tower.angle = Math.atan2(dy, dx);

                const proj = {
                    x: cx,
                    y: cy,
                    target: bestEnemy,
                    targetId: bestEnemy.id,
                    speed: 350 + Math.random() * 50,
                    damage: tower.damage,
                    splash: tower.splash,
                    slow: tower.slow,
                    chain: tower.chain,
                    towerType: tower.type,
                    color: tower.color,
                    alive: true,
                    radius: tower.type === 'cannon' ? 5 : 3
                };
                game.projectiles.push(proj);

                tower.cooldown = 1.0 / tower.fireRate;
                spawnParticles(proj.x, proj.y, '#ffffff', 2);
            } else if (bestEnemy) {
                const dx = bestEnemy.x - cx;
                const dy = bestEnemy.y - cy;
                tower.angle = Math.atan2(dy, dx);
            }
        }

        for (let i = game.projectiles.length - 1; i >= 0; i--) {
            const p = game.projectiles[i];
            if (!p.alive) { game.projectiles.splice(i, 1); continue; }

            let target = null;
            if (p.target && p.target.alive) {
                target = p.target;
            } else {
                target = game.enemies.find(e => e.id === p.targetId && e.alive);
            }

            if (!target) {
                p.alive = false;
                game.projectiles.splice(i, 1);
                continue;
            }

            const dx = target.x - p.x;
            const dy = target.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 8) {
                p.alive = false;
                applyDamage(p, target);
                game.projectiles.splice(i, 1);
            } else {
                const move = Math.min(p.speed * dtScaled, dist);
                p.x += (dx / dist) * move;
                p.y += (dy / dist) * move;
            }
        }

        for (let i = game.particles.length - 1; i >= 0; i--) {
            const p = game.particles[i];
            p.life -= dtScaled;
            p.x += p.vx * dtScaled;
            p.y += p.vy * dtScaled;
            p.vy += 80 * dtScaled;
            p.size *= (1 - dtScaled * 2);
            if (p.life <= 0 || p.size < 0.5) {
                game.particles.splice(i, 1);
            }
        }

        for (let i = game.stunEffects.length - 1; i >= 0; i--) {
            game.stunEffects[i].life -= dtScaled;
            if (game.stunEffects[i].life <= 0) {
                game.stunEffects.splice(i, 1);
            }
        }
    }

    function applyDamage(proj, target) {
        const damage = proj.damage;
        target.hp -= damage;

        if (proj.slow > 0) {
            target.slowFactor = 1.0 - proj.slow;
            target.slowTimer = 1.5;
        }

        if (proj.splash > 0) {
            const splashRange = proj.splash * CELL;
            for (const enemy of game.enemies) {
                if (enemy === target || !enemy.alive) continue;
                const dx = enemy.x - target.x;
                const dy = enemy.y - target.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist <= splashRange) {
                    const falloff = 1 - (dist / splashRange) * 0.5;
                    enemy.hp -= damage * falloff * 0.6;
                    if (proj.slow > 0) {
                        enemy.slowFactor = 1.0 - proj.slow * 0.7;
                        enemy.slowTimer = 1.0;
                    }
                }
            }
            spawnParticles(target.x, target.y, '#e67e22', 12);
        }

        if (proj.chain > 1) {
            let chainTargets = [target];
            let currentTarget = target;
            for (let c = 1; c < proj.chain; c++) {
                let nearest = null;
                let nearestDist = Infinity;
                for (const enemy of game.enemies) {
                    if (!enemy.alive || chainTargets.includes(enemy)) continue;
                    const dx = enemy.x - currentTarget.x;
                    const dy = enemy.y - currentTarget.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= CELL * 3 && dist < nearestDist) {
                        nearestDist = dist;
                        nearest = enemy;
                    }
                }
                if (!nearest) break;
                nearest.hp -= damage * (1 - c * 0.15);
                chainTargets.push(nearest);
                currentTarget = nearest;
                spawnParticles(nearest.x, nearest.y, '#a569bd', 6);
                game.projectiles.push({
                    x: currentTarget.x,
                    y: currentTarget.y,
                    target: { x: nearest.x, y: nearest.y },
                    alive: false,
                    life: 0.15,
                    isChain: true,
                    chainColor: '#a569bd'
                });
            }
            spawnParticles(target.x, target.y, '#a569bd', 10);
        }

        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            if (e.alive && e.hp <= 0) {
                e.alive = false;
                e.reachedEnd = false;
                spawnParticles(e.x, e.y, e.color, 8);
            }
        }

        spawnParticles(target.x, target.y, '#f39c12', 4);
    }

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 30 + Math.random() * 80;
            game.particles.push({
                x: x + (Math.random() - 0.5) * 4,
                y: y + (Math.random() - 0.5) * 4,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 20,
                size: 2 + Math.random() * 3,
                life: 0.4 + Math.random() * 0.6,
                color: color
            });
        }
    }

    // ─── Game Over ─────────────────────────────────────────────────────
    function gameOver() {
        game.gameOver = true;
        game.paused = true;
        waveBtn.disabled = true;
        finalWaveEl.textContent = 'Survived to Wave ' + game.wave + ' · Kills: ' + game.kills;
        gameOverOverlay.classList.add('show');
    }

    function restartGame() {
        gameOverOverlay.classList.remove('show');
        game = createGame();
        pendingSeed = generateRandomSeed();
        game.seed = pendingSeed;
        const prng = mulberry32(game.seed);
        const mapData = generatePath(prng);
        game.path = mapData.path;
        game.buildable = mapData.buildable;
        game.pathStart = mapData.start;
        game.pathEnd = mapData.end;
        game.selectedTowerType = null;
        game.selectedTower = null;
        waveBtn.disabled = false;
        newMapBtn.style.display = '';
        speedBtn.textContent = '⏩ 1x';
        game.speedIndex = 0;
        game.speed = 1;
        game.difficulty = null;
        updateUI();
        showInfo(null);
        waveBtn.textContent = '▶ Wave';
        waveBtn.style.opacity = '1';
        deselectTowerType();
        difficultyBadge.style.display = 'none';
        difficultyOverlay.classList.add('show');
        gameOverOverlay.classList.remove('show');
        seedDisplayPanel.style.display = 'none';
        refreshOverlaySeed();
        render();
    }

    function applyDifficulty(diff) {
        if (!game) return;
        game.difficulty = diff;
        const setting = DIFFICULTY_SETTINGS[diff];
        difficultyLabel.textContent = setting.label;
        difficultyBadge.className = setting.badgeClass;
        difficultyBadge.style.display = 'block';
        difficultyOverlay.classList.remove('show');
        updateSeedDisplay();
        updateUI();
        render();
    }

    function regenerateMap(newSeed) {
        if (!game || !game.difficulty) return;
        const diff = game.difficulty;
        const seed = newSeed !== undefined ? newSeed : generateRandomSeed();
        game.seed = seed;
        const prng = mulberry32(seed);
        const mapData = generatePath(prng);
        // Validate — fallback to Math.random if somehow invalid
        const validation = validatePathData(mapData);
        if (!validation.valid) {
            // Fallback: use Math.random
            const fallbackData = generatePath(null);
            game.path = fallbackData.path;
            game.buildable = fallbackData.buildable;
            game.pathStart = fallbackData.start;
            game.pathEnd = fallbackData.end;
            game.seed = generateRandomSeed();
        } else {
            game.path = mapData.path;
            game.buildable = mapData.buildable;
            game.pathStart = mapData.start;
            game.pathEnd = mapData.end;
        }
        game.towers = [];
        game.enemies = [];
        game.projectiles = [];
        game.particles = [];
        game.stunEffects = [];
        game.waveEnemyQueue = [];
        game.waveTimer = 0;
        game.waveCooldown = 0;
        game.difficulty = diff;
        deselectTowerType();
        game.selectedTower = null;
        updateSeedDisplay();
        updateUI();
        showInfo(null);
        render();
    }

    // ─── Rendering ─────────────────────────────────────────────────────
    function render() {
        if (!game) return;
        ctx.clearRect(0, 0, CANVAS, CANVAS);

        const buildable = game.buildable;
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const x = c * CELL;
                const y = r * CELL;
                if (buildable && buildable[r] && buildable[r][c]) {
                    ctx.fillStyle = '#1a2f3f';
                    ctx.fillRect(x, y, CELL, CELL);
                    ctx.strokeStyle = '#1e3348';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, CELL, CELL);
                } else {
                    const isPath = game.path && game.path.some(p => p[0] === c && p[1] === r);
                    if (isPath) {
                        ctx.fillStyle = '#2a3a4a';
                        ctx.fillRect(x, y, CELL, CELL);
                        ctx.strokeStyle = '#3a4a5a';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x, y, CELL, CELL);
                    } else {
                        ctx.fillStyle = '#162030';
                        ctx.fillRect(x, y, CELL, CELL);
                        ctx.strokeStyle = '#1a2a3a';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x, y, CELL, CELL);
                    }
                }
            }
        }

        if (game.pathStart) {
            ctx.fillStyle = 'rgba(46, 204, 113, 0.25)';
            ctx.fillRect(game.pathStart[0] * CELL, game.pathStart[1] * CELL, CELL, CELL);
            ctx.fillStyle = '#2ecc71';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('▶', game.pathStart[0] * CELL + CELL / 2, game.pathStart[1] * CELL + CELL / 2);
        }
        if (game.pathEnd) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
            ctx.fillRect(game.pathEnd[0] * CELL, game.pathEnd[1] * CELL, CELL, CELL);
            ctx.fillStyle = '#e74c3c';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('■', game.pathEnd[0] * CELL + CELL / 2, game.pathEnd[1] * CELL + CELL / 2);
        }

        for (const se of game.stunEffects) {
            const alpha = se.life / se.maxLife;
            ctx.strokeStyle = 'rgba(200, 140, 220, ' + alpha + ')';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'rgba(180, 100, 220, ' + alpha + ')';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(se.x1, se.y1);
            const midX = (se.x1 + se.x2) / 2 + (Math.random() - 0.5) * 30;
            const midY = (se.y1 + se.y2) / 2 + (Math.random() - 0.5) * 30;
            ctx.lineTo(midX, midY);
            ctx.lineTo(se.x2, se.y2);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255, 220, 255, ' + (alpha * 1.2) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(se.x1, se.y1);
            ctx.lineTo(midX, midY);
            ctx.lineTo(se.x2, se.y2);
            ctx.stroke();
        }

        for (const tower of game.towers) {
            const cx = tower.col * CELL + CELL / 2;
            const cy = tower.row * CELL + CELL / 2;
            const radius = CELL * 0.38;

            if (tower === game.selectedTower) {
                ctx.beginPath();
                ctx.arc(cx, cy, tower.range * CELL || CELL * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            if (tower.stunTimer > 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
                const stunAlpha = 0.25 + Math.sin(game.animTime * 8) * 0.15;
                ctx.fillStyle = 'rgba(155, 89, 182, ' + stunAlpha + ')';
                ctx.fill();
                ctx.strokeStyle = 'rgba(200, 150, 220, ' + (stunAlpha + 0.3) + ')';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#d4a0e8';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                const iconBob = Math.sin(game.animTime * 10) * 1.5;
                ctx.fillText('⚡', cx, cy - radius - 5 + iconBob);
            }

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(tower.angle);

            const stunDim = tower.stunTimer > 0 ? 0.5 : 1;
            ctx.globalAlpha = stunDim;

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = tower.color;
            ctx.shadowColor = tower.color;
            ctx.shadowBlur = tower.stunTimer > 0 ? 2 : 8;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fill();
            if (tower.type !== 'mint') {
                ctx.fillStyle = '#c8d6e5';
                ctx.fillRect(0, -2, radius * 1.1, 4);
            }
            ctx.restore();
            ctx.globalAlpha = 1;

            if (tower.level > 0) {
                ctx.fillStyle = '#f1c40f';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('★'.repeat(tower.level + 1), cx, cy - radius - 2);
            }

            const defs = TOWER_TYPES[tower.type];
            if (defs) {
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (tower.stunTimer > 0) ctx.globalAlpha = 0.5;
                ctx.fillText(defs.emoji, cx, cy);
                ctx.globalAlpha = 1;
            }
        }

        for (const enemy of game.enemies) {
            if (!enemy.alive) continue;
            const r = enemy.size;

            if (enemy.type === 'boss') {
                const auraRadius = r + 5 + Math.sin(game.animTime * 3) * 2;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, auraRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(155, 89, 182, 0.35)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, r, 0, Math.PI * 2);
            ctx.fillStyle = enemy.color;
            ctx.shadowColor = enemy.color;
            ctx.shadowBlur = enemy.type === 'boss' ? 12 : 6;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (enemy.type === 'boss') {
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('👑', enemy.x, enemy.y - r - 3);
            }

            const barW = r * 2.4;
            const barH = 3;
            const barX = enemy.x - barW / 2;
            const barY = enemy.y - r - (enemy.type === 'boss' ? 10 : 5);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(barX, barY, barW, barH);
            const hpRatio = enemy.hp / enemy.maxHp;
            ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f1c40f' : '#e74c3c';
            ctx.fillRect(barX, barY, barW * hpRatio, barH);

            if (enemy.slowFactor < 0.9) {
                ctx.fillStyle = 'rgba(133,193,233,0.4)';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, r + 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (const p of game.projectiles) {
            if (p.isChain) {
                if (p.target) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.target.x, p.target.y);
                    ctx.strokeStyle = p.chainColor || '#a569bd';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = p.chainColor || '#a569bd';
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                continue;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color || '#f1c40f';
            ctx.shadowColor = p.color || '#f1c40f';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (const p of game.particles) {
            const alpha = Math.min(1, p.life * 2);
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // ─── UI Updates ────────────────────────────────────────────────────
    function updateUpgradeBtnState() {
        const tower = game.selectedTower;
        if (!tower) return;
        const defs = TOWER_TYPES[tower.type];
        if (!defs) return;
        const nextLevel = tower.level + 1;
        if (nextLevel >= defs.levels.length) {
            upgradeBtn.disabled = true;
            upgradeBtn.style.opacity = '0.5';
            upgradeBtn.textContent = '⭐ Max Level';
            return;
        }
        const cost = defs.levels[nextLevel].cost;
        const canAfford = game.money >= cost;
        upgradeBtn.disabled = !canAfford;
        upgradeBtn.style.opacity = canAfford ? '1' : '0.4';
        upgradeBtn.textContent = '⬆ Upgrade to Lv.' + (tower.level + 2) + ' ($' + cost + ')';
    }

    function updateUI() {
        moneyEl.textContent = Math.floor(game.money);
        livesEl.textContent = game.lives;
        waveEl.textContent = game.wave;
        killEl.textContent = game.kills;
        towerCountEl.textContent = game.towers.length;

        document.querySelectorAll('.tower-btn').forEach(btn => {
            const type = btn.dataset.type;
            const defs = TOWER_TYPES[type];
            if (defs && defs.levels[0]) {
                const cost = defs.levels[0].cost;
                const canAfford = game.money >= cost;
                btn.classList.toggle('disabled', !canAfford);
            }
        });

        updateUpgradeBtnState();
    }

    function showInfo(tower) {
        targetBtns.style.display = 'none';
        deleteBtn.style.display = 'none';

        if (!tower) {
            infoBox.innerHTML = '<div>Select a tower to place it on the grid. Towers auto-attack enemies in range.</div>';
            upgradeBtn.style.display = 'none';
            return;
        }
        const defs = TOWER_TYPES[tower.type];
        if (!defs) return;
        const lvl = defs.levels[tower.level];
        const nextLvl = tower.level + 1 < defs.levels.length ? defs.levels[tower.level + 1] : null;

        if (tower.type === 'mint') {
            let html = '<div class="highlight">' + defs.emoji + ' ' + defs.name + ' Tower (Lv.' + (tower.level + 1) + ')</div>';
            html += '<div>💰 Income: $' + tower.income + ' per wave</div>';
            if (game.difficulty === 'hard') {
                html += '<div style="color:#e74c3c;font-size:11px;">⚠ Hard mode: 20% income penalty</div>';
            }
            if (tower.stunTimer > 0) {
                html += '<div style="color:#c39bdb;font-weight:600;">⚡ Stunned: ' + tower.stunTimer.toFixed(1) + 's remaining</div>';
            }
            infoBox.innerHTML = html;

            targetBtns.style.display = 'none';
            deleteBtn.style.display = 'block';
            deleteBtn.onclick = function() { deleteTower(tower); };

            if (nextLvl) {
                upgradeBtn.style.display = 'block';
                const cost = nextLvl.cost;
                const canAfford = game.money >= cost;
                upgradeBtn.disabled = !canAfford;
                upgradeBtn.textContent = '⬆ Upgrade to Lv.' + (tower.level + 2) + ' ($' + cost + ')';
                upgradeBtn.style.opacity = canAfford ? '1' : '0.4';
                game.selectedTower = tower;
                upgradeBtn.onclick = function() {
                    if (upgradeTower(tower)) { showInfo(tower); render(); } else { showInfo(tower); }
                };
            } else {
                upgradeBtn.style.display = 'block';
                upgradeBtn.disabled = true;
                upgradeBtn.textContent = '⭐ Max Level';
                upgradeBtn.style.opacity = '0.5';
                game.selectedTower = tower;
                upgradeBtn.onclick = null;
            }
            return;
        }

        const modeLabels = { nearest: 'Nearest 🎯', first: 'First 🚩', last: 'Last 🏁', random: 'Random 🎲' };
        let html = '<div class="highlight">' + defs.emoji + ' ' + defs.name + ' Tower (Lv.' + (tower.level + 1) + ')</div>';
        if (tower.stunTimer > 0) {
            html += '<div style="color:#c39bdb;font-weight:600;">⚡ STUNNED — ' + tower.stunTimer.toFixed(1) + 's remaining</div>';
        }
        html += '<div>DMG: ' + lvl.damage + '  Range: ' + lvl.range + '  Rate: ' + lvl.fireRate.toFixed(1) + '/s</div>';
        html += '<div>Target: ' + (modeLabels[tower.targetMode] || 'First') + '</div>';
        if (lvl.splash) html += '<div>Splash: ' + lvl.splash + '</div>';
        if (lvl.slow) html += '<div>Slow: ' + Math.round(lvl.slow * 100) + '%</div>';
        if (lvl.chain) html += '<div>Chain: ' + lvl.chain + '</div>';

        infoBox.innerHTML = html;

        targetBtns.style.display = 'flex';
        targetBtns.querySelectorAll('button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === tower.targetMode);
        });

        deleteBtn.style.display = 'block';
        deleteBtn.onclick = function() { deleteTower(tower); };

        if (nextLvl) {
            upgradeBtn.style.display = 'block';
            const cost = nextLvl.cost;
            const canAfford = game.money >= cost;
            upgradeBtn.disabled = !canAfford;
            upgradeBtn.textContent = '⬆ Upgrade to Lv.' + (tower.level + 2) + ' ($' + cost + ')';
            upgradeBtn.style.opacity = canAfford ? '1' : '0.4';
            game.selectedTower = tower;
            upgradeBtn.onclick = function() {
                if (upgradeTower(tower)) { showInfo(tower); render(); } else { showInfo(tower); }
            };
        } else {
            upgradeBtn.style.display = 'block';
            upgradeBtn.disabled = true;
            upgradeBtn.textContent = '⭐ Max Level';
            upgradeBtn.style.opacity = '0.5';
            game.selectedTower = tower;
            upgradeBtn.onclick = null;
        }
    }

    // ─── Input ─────────────────────────────────────────────────────────
    let mouseGrid = { col: -1, row: -1 };
    let previewValid = false;

    function getGridPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        const col = Math.floor(x / CELL);
        const row = Math.floor(y / CELL);
        return { col, row, valid: col >= 0 && col < SIZE && row >= 0 && row < SIZE };
    }

    canvas.addEventListener('mousemove', function(e) {
        if (!game || !game.difficulty) return;
        const pos = getGridPos(e);
        mouseGrid = pos;
        if (game.gameOver) return;
        if (game.selectedTowerType && pos.valid) {
            const canPlace = game.buildable[pos.row] && game.buildable[pos.row][pos.col];
            const occupied = game.towers.some(t => t.col === pos.col && t.row === pos.row);
            previewValid = canPlace && !occupied;
            render();
            const cx = pos.col * CELL + CELL / 2;
            const cy = pos.row * CELL + CELL / 2;
            ctx.fillStyle = previewValid ? 'rgba(46, 204, 113, 0.25)' : 'rgba(231, 76, 60, 0.25)';
            ctx.fillRect(pos.col * CELL, pos.row * CELL, CELL, CELL);
            if (previewValid) {
                ctx.strokeStyle = 'rgba(46, 204, 113, 0.6)';
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(pos.col * CELL, pos.row * CELL, CELL, CELL);
                ctx.setLineDash([]);
                const defs = TOWER_TYPES[game.selectedTowerType];
                if (defs && defs.levels[0].range) {
                    const range = defs.levels[0].range * CELL;
                    ctx.beginPath();
                    ctx.arc(cx, cy, range, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }
    });

    canvas.addEventListener('click', function(e) {
        if (!game || !game.difficulty) return;
        if (game.gameOver) return;
        const pos = getGridPos(e);
        if (!pos.valid) return;

        const clickedTower = game.towers.find(t => t.col === pos.col && t.row === pos.row);
        if (clickedTower) {
            deselectTowerType();
            showInfo(clickedTower);
            render();
            return;
        }

        if (!game.selectedTowerType) return;

        const canPlace = game.buildable[pos.row] && game.buildable[pos.row][pos.col];
        const occupied = game.towers.some(t => t.col === pos.col && t.row === pos.row);
        if (!canPlace || occupied) return;

        const defs = TOWER_TYPES[game.selectedTowerType];
        const cost = defs.levels[0].cost;
        if (game.money < cost) return;

        game.money -= cost;
        const tower = createTower(game.selectedTowerType, pos.col, pos.row);
        game.towers.push(tower);
        deselectTowerType();
        showInfo(tower);
        updateUI();
        render();
    });

    canvas.addEventListener('mouseleave', function() {
        mouseGrid.valid = false;
        render();
    });

    document.querySelectorAll('.tower-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (!game || !game.difficulty) return;
            if (game.gameOver) return;
            const type = this.dataset.type;
            const defs = TOWER_TYPES[type];
            if (!defs) return;
            const cost = defs.levels[0].cost;
            if (game.money < cost) return;

            if (game.selectedTowerType === type) {
                deselectTowerType();
                showInfo(null);
            } else {
                deselectTowerType();
                game.selectedTowerType = type;
                this.classList.add('selected');
                game.selectedTower = null;
                upgradeBtn.style.display = 'none';
                targetBtns.style.display = 'none';
                deleteBtn.style.display = 'none';
                const lvl0 = defs.levels[0];
                let extra = '';
                if (lvl0.income) {
                    extra = '<div>💰 Income: $' + lvl0.income + ' per wave</div>';
                    if (game.difficulty === 'hard') {
                        extra += '<div style="color:#e74c3c;font-size:11px;">⚠ Hard mode: 20% income penalty</div>';
                    }
                } else {
                    extra = '<div>DMG: ' + lvl0.damage + '  Range: ' + lvl0.range + '</div>';
                }
                infoBox.innerHTML = '<div class="highlight">' + defs.emoji + ' ' + defs.name + ' Tower</div>' +
                    '<div>Cost: <span style="color:#f1c40f;">$' + cost + '</span></div>' +
                    extra +
                    '<div>Click on an empty grid cell to place.</div>';
            }
            render();
        });
    });

    targetBtns.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            if (!game || !game.difficulty) return;
            if (!game.selectedTower) return;
            const mode = this.dataset.mode;
            game.selectedTower.targetMode = mode;
            showInfo(game.selectedTower);
            render();
        });
    });

    waveBtn.addEventListener('click', startWave);

    newMapBtn.addEventListener('click', function() {
        if (!game || !game.difficulty) return;
        if (!game.waveActive && game.wave === 0 && !game.gameOver) {
            regenerateMap(generateRandomSeed());
        }
    });

    pauseBtn.addEventListener('click', function() {
        if (!game || !game.difficulty) return;
        if (game.gameOver) return;
        game.paused = !game.paused;
        this.textContent = game.paused ? '▶ Play' : '⏸ Pause';
    });

    speedBtn.addEventListener('click', function() {
        if (!game || !game.difficulty) return;
        if (game.gameOver) return;
        game.speedIndex = (game.speedIndex + 1) % SPEED_PRESETS.length;
        game.speed = SPEED_PRESETS[game.speedIndex];
        this.textContent = SPEED_LABELS[game.speedIndex];
    });

    restartBtn.addEventListener('click', restartGame);

    // ─── Seed UI handlers ───────────────────────────────────────────────
    seedLoadOverlay.addEventListener('click', function() {
        const hexStr = seedInputOverlay.value.trim();
        if (!hexStr) {
            showSeedError('Enter a seed value.');
            return;
        }
        tryLoadSeed(hexStr, true);
    });

    seedRandomOverlay.addEventListener('click', function() {
        pendingSeed = generateRandomSeed();
        refreshOverlaySeed();
    });

    seedInputOverlay.addEventListener('input', function() {
        clearSeedError();
        seedInputOverlay.classList.remove('invalid');
    });

    seedInputOverlay.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const hexStr = seedInputOverlay.value.trim();
            if (!hexStr) {
                showSeedError('Enter a seed value.');
                return;
            }
            tryLoadSeed(hexStr, true);
        }
    });

    seedCopyBtn.addEventListener('click', function() {
        if (!game || !game.seed) return;
        const hex = seedToHex(game.seed);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(hex).then(function() {
                seedCopyBtn.textContent = '✓ Copied';
                seedCopyBtn.classList.add('copied');
                setTimeout(function() {
                    seedCopyBtn.textContent = '📋 Copy';
                    seedCopyBtn.classList.remove('copied');
                }, 1500);
            }).catch(function() {
                fallbackCopy(hex);
            });
        } else {
            fallbackCopy(hex);
        }
    });

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
        seedCopyBtn.textContent = '✓ Copied';
        seedCopyBtn.classList.add('copied');
        setTimeout(function() {
            seedCopyBtn.textContent = '📋 Copy';
            seedCopyBtn.classList.remove('copied');
        }, 1500);
    }

    // ─── Difficulty selection ───────────────────────────────────────────
    diffBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            let diff;
            if (this.classList.contains('easy-btn')) diff = 'easy';
            else if (this.classList.contains('med-btn')) diff = 'medium';
            else if (this.classList.contains('hard-btn')) diff = 'hard';
            else return;

            if (!game) {
                game = createGame();
                game.seed = pendingSeed;
                const prng = mulberry32(pendingSeed);
                const mapData = generatePath(prng);
                const validation = validatePathData(mapData);
                if (!validation.valid) {
                    // Fallback
                    const fb = generatePath(null);
                    game.path = fb.path;
                    game.buildable = fb.buildable;
                    game.pathStart = fb.start;
                    game.pathEnd = fb.end;
                    game.seed = generateRandomSeed();
                    pendingSeed = game.seed;
                } else {
                    game.path = mapData.path;
                    game.buildable = mapData.buildable;
                    game.pathStart = mapData.start;
                    game.pathEnd = mapData.end;
                }
            }
            applyDifficulty(diff);
        });
    });

    // ─── Game Loop ─────────────────────────────────────────────────────
    let lastTime = 0;

    function gameLoop(timestamp) {
        if (!game) {
            ctx.fillStyle = '#1a2332';
            ctx.fillRect(0, 0, CANVAS, CANVAS);
            requestAnimationFrame(gameLoop);
            return;
        }

        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        if (!game.gameOver) {
            updateStats(dt);
        }
        render();

        requestAnimationFrame(gameLoop);
    }

    // ─── Init ──────────────────────────────────────────────────────────
    function init() {
        difficultyOverlay.classList.add('show');
        gameOverOverlay.classList.remove('show');
        difficultyBadge.style.display = 'none';
        seedDisplayPanel.style.display = 'none';
        refreshOverlaySeed();

        ctx.fillStyle = '#1a2332';
        ctx.fillRect(0, 0, CANVAS, CANVAS);

        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    init();

})();
</script>
</body>
</html>
