                        '#5a5a78', '#9a9ab8', '#e8e840', '#9a9ab8', '#9a9ab8', '#e8e840', '#9a9ab8', '#5a5a78',
                        '#5a5a78', '#9a9ab8', '#9a9ab8', '#4a4a68', '#9a9ab8', '#9a9ab8', '#9a9ab8', '#5a5a78',
                        'transparent', '#5a5a78', '#7a7a98', '#9a9ab8', '#9a9ab8', '#7a7a98', '#5a5a78', 'transparent',
                        'transparent', '#5a5a78', '#7a7a98', '#c0c0d8', '#c0c0d8', '#7a7a98', '#5a5a78', 'transparent',
                        'transparent', 'transparent', '#4a4a68', '#5a5a78', '#5a5a78', '#4a4a68', 'transparent', 'transparent',
                        'transparent', 'transparent', '#4a4a68', 'transparent', 'transparent', '#4a4a68', 'transparent', 'transparent',
                    ];
                    drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, body, s);
                }
            }

            function drawBush(ctx, x, y) {
                const s = 4;
                const w = 6;
                const h = 5;
                const body = [
                    'transparent', '#206020', '#308030', '#308030', '#206020', 'transparent',
                    '#206020', '#40a040', '#50b050', '#50b050', '#40a040', '#206020',
                    '#308030', '#50b050', '#ffffff', '#ffffff', '#50b050', '#308030',
                    '#206020', '#40a040', '#308030', '#308030', '#40a040', '#206020',
                    'transparent', '#206020', '#206020', '#206020', '#206020', 'transparent',
                ];
                drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, body, s);
                ctx.fillStyle = '#000';
                ctx.fillRect(Math.floor(x - 4), Math.floor(y - h * s + 4 * s), 2, 2);
                ctx.fillRect(Math.floor(x + 4), Math.floor(y - h * s + 4 * s), 2, 2);
            }

            function drawSmallBush(ctx, x, y) {
                const s = 2;
                const w = 4;
                const h = 3;
                const body = [
                    'transparent', '#308030', '#308030', 'transparent',
                    '#308030', '#50b050', '#50b050', '#308030',
                    '#206020', '#308030', '#308030', '#206020',
                ];
                drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, body, s);
            }

            function drawTorchPart(ctx, x, y, t) {
                const s = 2;
                const glow = 0.5 + 0.5 * Math.sin(t * 3);
                ctx.fillStyle = `rgba(255,180,40,${0.6+glow*0.4})`;
                ctx.fillRect(Math.floor(x - 4), Math.floor(y - 4), 8, 8);
                ctx.fillStyle = '#ffaa20';
                ctx.fillRect(Math.floor(x - 2), Math.floor(y - 5), 4, 10);
                ctx.fillStyle = '#ffdd60';
                ctx.fillRect(Math.floor(x - 1), Math.floor(y - 6), 2, 3);
            }

            function drawSapphireTorch(ctx, x, y, t) {
                const s = 2;
                const glow = 0.5 + 0.5 * Math.sin(t * 3.5);
                ctx.fillStyle = `rgba(60,160,255,${0.6+glow*0.4})`;
                ctx.fillRect(Math.floor(x - 4), Math.floor(y - 4), 8, 8);
                ctx.fillStyle = '#3399ee';
                ctx.fillRect(Math.floor(x - 2), Math.floor(y - 5), 4, 10);
                ctx.fillStyle = '#88ccff';
                ctx.fillRect(Math.floor(x - 1), Math.floor(y - 6), 2, 3);
            }

            function drawBigTorch(ctx, x, y, t, lit) {
                if (lit) {
                    const glow = 0.5 + 0.5 * Math.sin(t * 3);
                    ctx.fillStyle = `rgba(255,150,20,${0.5+glow*0.35})`;
                    ctx.beginPath();
                    ctx.arc(x, y - 4, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#886644';
                    ctx.fillRect(Math.floor(x - 5), Math.floor(y - 12), 10, 28);
                    ctx.fillStyle = '#aa8855';
                    ctx.fillRect(Math.floor(x - 4), Math.floor(y - 12), 8, 26);
                    ctx.fillStyle = '#ffcc40';
                    ctx.fillRect(Math.floor(x - 3), Math.floor(y - 18), 6, 10);
                    ctx.fillStyle = '#ffee80';
                    ctx.fillRect(Math.floor(x - 2), Math.floor(y - 22), 4, 8);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(Math.floor(x - 1), Math.floor(y - 25), 2, 5);
                } else {
                    ctx.fillStyle = 'rgba(255,150,20,0.2)';
                    ctx.beginPath();
                    ctx.arc(x, y - 4, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#886644';
                    ctx.fillRect(Math.floor(x - 5), Math.floor(y - 12), 10, 28);
                    ctx.fillStyle = '#aa8855';
                    ctx.fillRect(Math.floor(x - 4), Math.floor(y - 12), 8, 26);
                    ctx.fillStyle = '#776644';
                    ctx.fillRect(Math.floor(x - 3), Math.floor(y - 14), 6, 4);
                    ctx.fillStyle = '#998866';
                    ctx.fillRect(Math.floor(x - 2), Math.floor(y - 16), 4, 3);
                }
            }

            function drawMiniTorch(ctx, x, y, t, facing) {
                const tx = facing > 0 ? Math.floor(x + 3) : Math.floor(x - 10);
                const ty = Math.floor(y - 16);
                const flicker = Math.sin(t * 22 + x * 0.3) * 1.5;
                ctx.fillStyle = 'rgba(255,150,20,0.5)';
                ctx.fillRect(tx - 2, ty + Math.floor(flicker) - 2, 8, 9);
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(tx, ty + Math.floor(flicker), 4, 6);
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(tx + 1, ty - 1 + Math.floor(flicker), 2, 4);
                ctx.fillStyle = '#ffff88';
                ctx.fillRect(tx + 1, ty - 3 + Math.floor(flicker), 2, 3);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(tx + 2, ty - 4 + Math.floor(flicker), 1, 2);
            }

            function drawShieldOrbit(ctx, x, y, t) {
                const orbitAngle = t * 3.5;
                const orbitRadius = 18;
                const sx = x + Math.cos(orbitAngle) * orbitRadius;
                const sy = y + Math.sin(orbitAngle) * orbitRadius;
                ctx.fillStyle = 'rgba(100,180,255,0.55)';
                ctx.fillRect(Math.floor(sx - 6), Math.floor(sy - 8), 12, 16);
                ctx.fillStyle = 'rgba(140,210,255,0.65)';
                ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 10), 8, 18);
                ctx.fillStyle = 'rgba(200,240,255,0.8)';
                ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 12), 4, 6);
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 14), 2, 4);
                // Glow ring
                ctx.strokeStyle = `rgba(100,180,255,${0.35+0.2*Math.sin(t*5)})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y - 8, orbitRadius + 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 1;
            }

            function drawTree(ctx, x, y, t) {
                const sway = Math.sin(t * 0.8 + x * 0.05) * 1;
                ctx.fillStyle = '#3d2817';
                ctx.fillRect(Math.floor(x - 2 + sway), Math.floor(y - 4), 4, 16);
                ctx.fillStyle = '#1a5c1a';
                ctx.beginPath();
                ctx.arc(x + sway, y - 6, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1f6e1f';
                ctx.beginPath();
                ctx.arc(x + sway - 2, y - 9, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#248024';
                ctx.beginPath();
                ctx.arc(x + sway + 2, y - 8, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // ── Render ──────────────────────────────────
            function render(time) {
                const t = time / 1000;
                offCtx.clearRect(0, 0, VW, VH);
                const cam = getCamera();
                const shakeX = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity * 6 : 0;
                const shakeY = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity * 6 : 0;
                const cx = cam.x + shakeX;
                const cy = cam.y + shakeY;

                // Ground
                offCtx.fillStyle = '#1a2a10';
                offCtx.fillRect(0, 0, VW, VH);
                const startTX = Math.floor(cx / TILE);
                const startTY = Math.floor(cy / TILE);
                const endTX = Math.ceil((cx + VW) / TILE);
                const endTY = Math.ceil((cy + VH) / TILE);
                for (let ty = startTY; ty <= endTY; ty++) {
                    for (let tx = startTX; tx <= endTX; tx++) {
                        if (tx < 0 || ty < 0 || tx >= mapW || ty >= mapH) continue;
                        const sx = tx * TILE - cx;
                        const sy = ty * TILE - cy;
                        const grassShade = ((tx + ty) % 2 === 0) ? '#1f3015' : '#1a2a10';
                        offCtx.fillStyle = grassShade;
                        offCtx.fillRect(Math.floor(sx), Math.floor(sy), TILE, TILE);
                        if ((tx + ty * 7) % 13 === 0) {
                            offCtx.fillStyle = '#253818';
                            offCtx.fillRect(Math.floor(sx + 5), Math.floor(sy + 5), 3, 3);
                        }
                    }
                }

                // Trees
                for (const tree of trees) {
                    const sx = tree.tx * TILE + TILE / 2 - cx;
                    const sy = tree.ty * TILE + TILE / 2 - cy;
                    if (sx > -TILE && sx < VW + TILE && sy > -TILE && sy < VH + TILE) {
                        drawTree(offCtx, sx, sy, t);
                    }
                }

                // Small bushes (traps)
                for (const m of monsters) {
                    if (m.type === 'bush' && m.placedBushes) {
                        for (const pb of m.placedBushes) {
                            const sx = pb.x - cx;
                            const sy = pb.y - cy;
                            if (sx > -20 && sx < VW + 20 && sy > -20 && sy < VH + 20) {
                                drawSmallBush(offCtx, sx, sy);
                            }
                        }
                    }
                }

                // Torch parts
                for (const tp of torchParts) {
                    if (tp.collected) continue;
                    const sx = tp.x - cx;
                    const sy = tp.y - cy;
                    if (sx > -10 && sx < VW + 10 && sy > -10 && sy < VH + 10) {
                        drawTorchPart(offCtx, sx, sy, t);
                    }
                }

                // Sapphire torches
                for (const sp of sapphireParts) {
                    if (sp.collected) continue;
                    const sx = sp.x - cx;
                    const sy = sp.y - cy;
                    if (sx > -10 && sx < VW + 10 && sy > -10 && sy < VH + 10) {
                        drawSapphireTorch(offCtx, sx, sy, t);
                    }
                }

                // Big torch
                if (bigTorchActive) {
                    const sx = bigTorchX - cx;
                    const sy = bigTorchY - cy;
                    drawBigTorch(offCtx, sx, sy, t, bigTorchLit);
                    if (!bigTorchLit) {
                        offCtx.fillStyle = '#ffdd80';
                        offCtx.font = '5px "Press Start 2P"';
                        offCtx.textAlign = 'center';
                        const bob = Math.sin(t * 3) * 2;
                        offCtx.fillText('PRESS E', Math.floor(sx), Math.floor(sy - 26 + bob));
                    }
                }

                // Monsters
                for (const m of monsters) {
                    const sx = m.x - cx;
                    const sy = m.y - cy;
                    if (sx > -60 && sx < VW + 60 && sy > -60 && sy < VH + 60) {
                        const facing = m.facing || 0;
                        if (m.type === 'giraffe') drawGiraffe(offCtx, sx, sy, m.animFrame, facing);
                        if (m.type === 'bird') drawBird(offCtx, sx, sy, m.animFrame, facing);
                        if (m.type === 'frog') drawFrog(offCtx, sx, sy, m.animFrame, m.airborne);
                        if (m.type === 'lion') drawLion(offCtx, sx, sy, m.animFrame, facing);
                        if (m.type === 'wolf') drawWolf(offCtx, sx, sy, m.animFrame, m.state);
                        if (m.type === 'bush') drawBush(offCtx, sx, sy);

                        // Stunned indicator
                        if (m.stunnedTimer > 0) {
                            offCtx.fillStyle = '#88ccff';
                            offCtx.font = '5px "Press Start 2P"';
                            offCtx.textAlign = 'center';
                            offCtx.fillText('STUN', Math.floor(sx), Math.floor(sy - 40));
                        }

                        // Telegraph indicator for lion
                        if (m.type === 'lion' && m.telegraphTimer > 0) {
                            offCtx.fillStyle = 'rgba(255,60,60,0.6)';
                            offCtx.fillRect(Math.floor(sx - 16), Math.floor(sy - 36), 32, 6);
                            offCtx.fillStyle = '#ff0000';
                            const barW = (m.telegraphTimer / 0.3) * 28;
                            offCtx.fillRect(Math.floor(sx - 14), Math.floor(sy - 34), Math.floor(barW), 3);
                        }

                        // Shockwave
                        if (m.type === 'frog' && m.shockwave) {
                            const sw = m.shockwave;
                            offCtx.strokeStyle = `rgba(200,255,200,${1-sw.progress})`;
                            offCtx.lineWidth = 4;
                            offCtx.beginPath();
                            offCtx.arc(sx, sy, sw.radius, 0, Math.PI * 2);
                            offCtx.stroke();
                            offCtx.lineWidth = 1;
                        }

                        // Frog sucking indicator
                        if (m.type === 'frog' && m.sucking) {
                            offCtx.fillStyle = 'rgba(255,255,200,0.3)';
                            offCtx.beginPath();
                            offCtx.arc(sx, sy, 80, 0, Math.PI * 2);
                            offCtx.fill();
                            offCtx.fillStyle = '#000';
                            offCtx.fillRect(Math.floor(sx - 9), Math.floor(sy - 24), 18, 18);
                            offCtx.fillStyle = '#ff4040';
                            offCtx.fillRect(Math.floor(sx - 6), Math.floor(sy - 21), 12, 12);
                        }
                    }
                }

                // Player
                const psx = player.x - cx;
                const psy = player.y - cy;
                const playerYOffset = jetPackActive ? -12 : 0;
                const screenPX = psx;
                const screenPY = psy + playerYOffset;

                if (upgrades.buggy) {
                    drawBuggy(offCtx, screenPX, screenPY, player.animFrame, player.facing);
                } else if (onTree) {
                    const treeHere = isTreeAt(Math.floor(player.x / TILE), Math.floor(player.y / TILE));
                    const ty = treeHere ? treeHere.ty * TILE + TILE / 2 - cy : screenPY;
                    const tx = treeHere ? treeHere.tx * TILE + TILE / 2 - cx : screenPX;
                    drawZebra(offCtx, tx, ty - 12, player.animFrame, player.facing);
                    drawMiniTorch(offCtx, tx, ty - 12, t, player.facing);
                } else {
                    drawZebra(offCtx, screenPX, screenPY, player.animFrame, player.facing);
                    drawMiniTorch(offCtx, screenPX, screenPY, t, player.facing);
                }

                // Jet pack flames
                if (jetPackActive) {
                    const flameX = screenPX;
                    const flameY = screenPY + 16;
                    for (let i = 0; i < 3; i++) {
                        const fx = flameX + (Math.random() - 0.5) * 10;
                        const fy = flameY + Math.random() * 8;
                        const fs = 1 + Math.random() * 4;
                        offCtx.fillStyle = `rgba(255,${140+Math.random()*80},20,${0.6+Math.random()*0.4})`;
                        offCtx.fillRect(Math.floor(fx), Math.floor(fy), Math.floor(fs), Math.floor(fs * 1.5));
                    }
                }

                // Shield orbit
                if (upgrades.shield && shieldReady && !onTree) {
                    drawShieldOrbit(offCtx, screenPX, screenPY, t);
                }

                // Player status indicators
                if (player.stunned) {
                    offCtx.fillStyle = '#ffff00';
                    offCtx.font = '6px "Press Start 2P"';
                    offCtx.textAlign = 'center';
                    offCtx.fillText('STUN', Math.floor(screenPX), Math.floor(screenPY - 20));
                }
                if (isDashing) {
                    offCtx.fillStyle = '#ff8800';
                    offCtx.font = '5px "Press Start 2P"';
                    offCtx.textAlign = 'center';
                    offCtx.fillText('DASH', Math.floor(screenPX), Math.floor(screenPY - 20));
                }
                if (invulnerableTimer > 0) {
                    offCtx.fillStyle = 'rgba(100,180,255,0.7)';
                    offCtx.beginPath();
                    offCtx.arc(screenPX, screenPY - 4, 14, 0, Math.PI * 2);
                    offCtx.fill();
                }

                // ── Darkness Overlay ──────────────────
                const darkCanvas = document.createElement('canvas');
                darkCanvas.width = VW;
                darkCanvas.height = VH;
                const darkCtx = darkCanvas.getContext('2d');

                darkCtx.fillStyle = 'rgba(5,8,3,0.94)';
                darkCtx.fillRect(0, 0, VW, VH);

                function cutLight(dctx, lx, ly, radius, alpha) {
                    const grad = dctx.createRadialGradient(lx, ly, 0, lx, ly, radius);
                    grad.addColorStop(0, `rgba(0,0,0,${alpha})`);
                    grad.addColorStop(0.3, `rgba(0,0,0,${alpha * 0.75})`);
                    grad.addColorStop(0.6, `rgba(0,0,0,${alpha * 0.35})`);
                    grad.addColorStop(0.85, `rgba(0,0,0,${alpha * 0.08})`);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    dctx.fillStyle = grad;
                    dctx.globalCompositeOperation = 'destination-out';
                    dctx.fillRect(lx - radius, ly - radius, radius * 2, radius * 2);
                    dctx.globalCompositeOperation = 'source-over';
                }

                const playerLightRadius = upgrades.brighterTorch ? 78 * 1.3 : 78;
                cutLight(darkCtx, psx, psy, playerLightRadius, 0.94);

                for (const tp of torchParts) {
                    if (tp.collected) continue;
                    const sx = tp.x - cx;
                    const sy = tp.y - cy;
                    if (sx > -20 && sx < VW + 20 && sy > -20 && sy < VH + 20) {
                        cutLight(darkCtx, sx, sy, 28, 0.7);
                    }
                }

                for (const sp of sapphireParts) {
                    if (sp.collected) continue;
                    const sx = sp.x - cx;
                    const sy = sp.y - cy;
                    if (sx > -20 && sx < VW + 20 && sy > -20 && sy < VH + 20) {
                        cutLight(darkCtx, sx, sy, 24, 0.6);
                    }
                }

                if (bigTorchActive && bigTorchLit) {
                    const sx = bigTorchX - cx;
                    const sy = bigTorchY - cy;
                    cutLight(darkCtx, sx, sy, 80, 0.92);
                } else if (bigTorchActive && !bigTorchLit) {
                    const sx = bigTorchX - cx;
                    const sy = bigTorchY - cy;
                    cutLight(darkCtx, sx, sy, 30, 0.5);
                }

                offCtx.drawImage(darkCanvas, 0, 0);

                // HUD
                offCtx.fillStyle = '#ffdd80';
                offCtx.font = '5px "Press Start 2P"';
                offCtx.textAlign = 'left';
                offCtx.fillText(`ROUND ${round}`, 4, 10);
                offCtx.fillText(`PARTS: ${torchPartsCollected}/${torchPartsNeeded}`, 4, 18);
                offCtx.fillStyle = '#88ccff';
                offCtx.fillText(`SAPPH: ${sapphireCount}`, 4, 26);
                offCtx.textAlign = 'right';
                offCtx.fillText(`SCORE: ${score}`, VW - 4, 10);

                // Ability cooldowns HUD
                if (dashCooldown > 0) {
                    offCtx.fillStyle = '#ff8800';
                    offCtx.fillText(`DASH: ${dashCooldown.toFixed(1)}`, VW - 4, 18);
                } else {
                    offCtx.fillStyle = '#ff8800';
                    offCtx.fillText('DASH: READY', VW - 4, 18);
                }
                if (upgrades.jetPack) {
                    if (jetPackCooldown > 0) {
                        offCtx.fillStyle = '#ffaa00';
                        offCtx.fillText(`JET: ${jetPackCooldown.toFixed(1)}`, VW - 4, 26);
                    } else if (!jetPackActive) {
                        offCtx.fillStyle = '#ffaa00';
                        offCtx.fillText('JET: READY', VW - 4, 26);
                    }
                }
                if (upgrades.shield && !shieldReady) {
                    offCtx.fillStyle = '#88ccff';
                    offCtx.fillText(`SHLD: ${shieldRechargeTimer.toFixed(1)}`, VW - 4, upgrades.jetPack ? 34 : 26);
                }

                // Tree prompt
                if (!onTree && treeCooldown <= 0) {
                    const ptx = Math.floor(player.x / TILE);
                    const pty = Math.floor(player.y / TILE);
                    let nearTree = false;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            if (isTreeAt(ptx + dx, pty + dy)) { nearTree = true; break; }
                        }
                        if (nearTree) break;
                    }
                    if (nearTree) {
                        offCtx.fillStyle = '#ffffff';
                        offCtx.font = '4px "Press Start 2P"';
                        offCtx.textAlign = 'center';
                        offCtx.fillText('Q:CLIMB', Math.floor(psx), Math.floor(psy - 18));
                    }
                }
                if (onTree) {
                    offCtx.fillStyle = '#ffffff';
                    offCtx.font = '4px "Press Start 2P"';
                    offCtx.textAlign = 'center';
                    offCtx.fillText('Q:DOWN', Math.floor(psx), Math.floor(psy - 22));
                }

                // Big torch interaction prompt
                if (bigTorchActive && !bigTorchLit && dist(player, { x: bigTorchX, y: bigTorchY }) < TILE * 2.5 && !
                    onTree) {
                    offCtx.fillStyle = '#ffdd80';
                    offCtx.font = '5px "Press Start 2P"';
                    offCtx.textAlign = 'center';
                    const btx = bigTorchX - cx;
                    const bty = bigTorchY - cy;
                    offCtx.fillText('PRESS E TO', Math.floor(btx), Math.floor(bty - 30));
                    offCtx.fillText('LIGHT TORCH', Math.floor(btx), Math.floor(bty - 24));
                }

                // Scale to display
                displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
                displayCtx.imageSmoothingEnabled = false;
                const scale = Math.min(displayCanvas.width / VW, displayCanvas.height / VH);
                const drawW = VW * scale;
                const drawH = VH * scale;
                const drawX = (displayCanvas.width - drawW) / 2;
                const drawY = (displayCanvas.height - drawH) / 2;
                displayCtx.fillStyle = '#000';
                displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
                displayCtx.drawImage(offCanvas, drawX, drawY, drawW, drawH);

                // Monster selection overlay
                if (gameState === 'monsterSelect') {
                    displayCtx.fillStyle = 'rgba(0,0,0,0.75)';
                    displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
                    displayCtx.fillStyle = '#ffcc40';
                    displayCtx.font = `${Math.floor(scale*5.5)}px "Press Start 2P"`;
                    displayCtx.textAlign = 'center';
                    displayCtx.fillText('CHOOSE A MONSTER', displayCanvas.width / 2, drawY + scale * 25);
                    displayCtx.fillText('TO UNLEASH', displayCanvas.width / 2, drawY + scale * 34);

                    const cardW = scale * 70;
                    const cardH = scale * 80;
                    const gap = scale * 8;
                    const totalW = 2 * cardW + gap;
                    const totalH = 2 * cardH + gap;
                    const startX = (displayCanvas.width - totalW) / 2;
                    const startY = drawY + scale * 45;

                    for (let i = 0; i < selectionOptions.length; i++) {
                        const col = i % 2;
                        const row = Math.floor(i / 2);
                        const cx2 = startX + col * (cardW + gap);
                        const cy2 = startY + row * (cardH + gap);

                        displayCtx.fillStyle = '#2a1a08';
                        displayCtx.fillRect(cx2, cy2, cardW, cardH);
                        displayCtx.fillStyle = '#5a3a18';
                        displayCtx.fillRect(cx2 + 2, cy2 + 2, cardW - 4, cardH - 4);
                        displayCtx.fillStyle = '#3a2a10';
                        displayCtx.fillRect(cx2 + 4, cy2 + 4, cardW - 8, cardH - 8);

                        const opt = selectionOptions[i];
                        displayCtx.fillStyle = opt.iconColor;
                        displayCtx.fillRect(cx2 + cardW / 2 - scale * 10, cy2 + scale * 12, scale * 20, scale *
                            20);
                        displayCtx.fillStyle = '#fff';
                        displayCtx.font = `${Math.floor(scale*4)}px "Press Start 2P"`;
                        displayCtx.textAlign = 'center';
                        displayCtx.fillText(opt.name, cx2 + cardW / 2, cy2 + scale * 44);
                        displayCtx.fillStyle = '#ccc';
                        displayCtx.font = `${Math.floor(scale*3)}px "Press Start 2P"`;
                        displayCtx.fillText(opt.desc, cx2 + cardW / 2, cy2 + scale * 56);
                    }
                }

                // Upgrade selection overlay
                if (gameState === 'upgradeSelect') {
                    displayCtx.fillStyle = 'rgba(0,0,0,0.78)';
                    displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
                    displayCtx.fillStyle = '#88ccff';
                    displayCtx.font = `${Math.floor(scale*5.5)}px "Press Start 2P"`;
                    displayCtx.textAlign = 'center';
                    displayCtx.fillText('CHOOSE UPGRADE', displayCanvas.width / 2, drawY + scale * 20);
                    displayCtx.fillStyle = '#ffdd80';
                    displayCtx.font = `${Math.floor(scale*4)}px "Press Start 2P"`;
                    displayCtx.fillText(`SAPPHIRES: ${sapphireCount}`, displayCanvas.width / 2, drawY + scale * 30);

                    const cardW = scale * 90;
                    const cardH = scale * 100;
                    const gap = scale * 10;
                    const totalW = upgradeOptions.length * cardW + (upgradeOptions.length - 1) * gap;
                    const startX = (displayCanvas.width - totalW) / 2;
                    const startY = drawY + scale * 42;

                    for (let i = 0; i < upgradeOptions.length; i++) {
                        const cx2 = startX + i * (cardW + gap);
                        const cy2 = startY;
                        const opt = upgradeOptions[i];
                        const canAfford = sapphireCount >= opt.cost;

                        displayCtx.fillStyle = canAfford ? '#1a2a30' : '#2a1a1a';
                        displayCtx.fillRect(cx2, cy2, cardW, cardH);
                        displayCtx.fillStyle = canAfford ? '#2a4a50' : '#4a2a2a';
                        displayCtx.fillRect(cx2 + 2, cy2 + 2, cardW - 4, cardH - 4);
                        displayCtx.fillStyle = canAfford ? '#1a3a40' : '#3a1a1a';
                        displayCtx.fillRect(cx2 + 4, cy2 + 4, cardW - 8, cardH - 8);

                        displayCtx.fillStyle = opt.iconColor;
                        displayCtx.fillRect(cx2 + cardW / 2 - scale * 12, cy2 + scale * 10, scale * 24, scale * 24);
                        displayCtx.fillStyle = '#fff';
                        displayCtx.font = `${Math.floor(scale*3.5)}px "Press Start 2P"`;
                        displayCtx.textAlign = 'center';
                        displayCtx.fillText(opt.name, cx2 + cardW / 2, cy2 + scale * 46);
                        displayCtx.fillStyle = '#ccc';
                        displayCtx.font = `${Math.floor(scale*2.8)}px "Press Start 2P"`;
                        displayCtx.fillText(opt.desc, cx2 + cardW / 2, cy2 + scale * 56);
                        displayCtx.fillStyle = canAfford ? '#ffdd80' : '#ff6666';
                        displayCtx.font = `${Math.floor(scale*3.5)}px "Press Start 2P"`;
                        displayCtx.fillText(`COST: ${opt.cost}`, cx2 + cardW / 2, cy2 + scale * 72);
                        if (!canAfford) {
                            displayCtx.fillStyle = '#ff4444';
                            displayCtx.font = `${Math.floor(scale*2.5)}px "Press Start 2P"`;
                            displayCtx.fillText('TOO EXPENSIVE', cx2 + cardW / 2, cy2 + scale * 82);
                        }
                    }

                    // Skip button
                    const skipY = startY + cardH + scale * 8;
                    displayCtx.fillStyle = 'rgba(255,255,255,0.15)';
                    displayCtx.fillRect(displayCanvas.width / 2 - scale * 40, skipY, scale * 80, scale * 16);
                    displayCtx.fillStyle = '#ffffff';
                    displayCtx.font = `${Math.floor(scale*3.5)}px "Press Start 2P"`;
                    displayCtx.fillText('SKIP', displayCanvas.width / 2, skipY + scale * 11);
                }

                // Game Over overlay
                if (gameState === 'gameOver') {
                    displayCtx.fillStyle = 'rgba(0,0,0,0.8)';
                    displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
                    displayCtx.fillStyle = '#ff4444';
                    displayCtx.font = `${Math.floor(scale*7)}px "Press Start 2P"`;
                    displayCtx.textAlign = 'center';
                    displayCtx.fillText('GAME OVER', displayCanvas.width / 2, displayCanvas.height / 2 - scale * 20);
                    displayCtx.fillStyle = '#ffdd80';
                    displayCtx.font = `${Math.floor(scale*5)}px "Press Start 2P"`;
                    displayCtx.fillText(deathMessage, displayCanvas.width / 2, displayCanvas.height / 2 + scale * 10);
                    displayCtx.fillText(`ROUND ${round}`, displayCanvas.width / 2, displayCanvas.height / 2 + scale *
                        25);
                    displayCtx.fillText(`SCORE: ${score}`, displayCanvas.width / 2, displayCanvas.height / 2 + scale *
                            38);
                    displayCtx.fillText(`SAPPHIRES: ${sapphireCount}`, displayCanvas.width / 2, displayCanvas.height /
                        2 + scale * 50);
                    displayCtx.fillStyle = '#fff';
                    displayCtx.font = `${Math.floor(scale*4)}px "Press Start 2P"`;
                    const alpha2 = 0.5 + 0.5 * Math.sin(time / 400);
                    displayCtx.fillStyle = `rgba(255,255,255,${alpha2})`;
                    displayCtx.fillText('CLICK TO RESTART', displayCanvas.width / 2, displayCanvas.height / 2 + scale *
                        68);
                }

                // Mobile D-pad hint
                if (touchActive || ('ontouchstart' in window)) {
                    const dpadCX = drawX + scale * 30;
                    const dpadCY = drawY + drawH - scale * 35;
                    displayCtx.fillStyle = 'rgba(255,255,255,0.2)';
                    displayCtx.beginPath();
                    displayCtx.arc(dpadCX, dpadCY, scale * 22, 0, Math.PI * 2);
                    displayCtx.fill();
                    displayCtx.fillStyle = 'rgba(255,255,255,0.4)';
                    displayCtx.beginPath();
                    displayCtx.arc(dpadCX + touchDir.x * scale * 10, dpadCY + touchDir.y * scale * 10, scale * 8, 0, Math
                        .PI * 2);
                    displayCtx.fill();
                }
            }

            // ── Update ──────────────────────────────────
            function update(dt) {
                if (gameState !== 'playing') return;
                if (gameOverTimer > 0) { gameOverTimer -= dt; if (gameOverTimer <= 0) { gameState = 'gameOver'; } return; }

                const realDt = Math.min(dt, 0.1);

                if (shakeTimer > 0) shakeTimer -= realDt;
                if (treeCooldown > 0) treeCooldown -= realDt;

                // Cooldowns
                if (dashCooldown > 0) dashCooldown -= realDt;
                if (jetPackCooldown > 0 && upgrades.jetPack) jetPackCooldown -= realDt;
                if (invulnerableTimer > 0) invulnerableTimer -= realDt;
                if (!shieldReady && upgrades.shield) {
                    shieldRechargeTimer -= realDt;
                    if (shieldRechargeTimer <= 0) {
                        shieldReady = true;
                        shieldRechargeTimer = 0;
                    }
                }

                // Stun
                if (player.stunned) {
                    player.stunnedTimer -= realDt;
                    if (player.stunnedTimer <= 0) {
                        player.stunned = false;
                        player.stunnedTimer = 0;
                    }
                }

                // Dash update
                if (isDashing) {
                    dashTimer -= realDt;
                    const dashSpeed = player.speed * 6;
                    player.x += dashDir.x * dashSpeed * realDt;
                    player.y += dashDir.y * dashSpeed * realDt;
                    player.x = Math.max(TILE / 2, Math.min(mapW * TILE - TILE / 2, player.x));
                    player.y = Math.max(TILE / 2, Math.min(mapH * TILE - TILE / 2, player.y));
                    if (dashTimer <= 0) {
                        isDashing = false;
                        dashTimer = 0;
                    }
                }

                // Jet pack update
                if (jetPackActive) {
                    jetPackTimer -= realDt;
                    if (jetPackTimer <= 0) {
                        jetPackActive = false;
                        jetPackTimer = 0;
                    }
                }

                // Suck mechanic
                if (player.beingSucked && player.suckTarget && !onTree && !jetPackActive && !isDashing) {
                    player.suckTimer -= realDt;
                    if (player.suckTimer <= 0 || !player.suckTarget.sucking) {
                        player.beingSucked = false;
                        player.suckTarget = null;
                    } else {
                        const dx = player.suckTarget.x - player.x;
                        const dy = player.suckTarget.y - player.y;
                        const d = Math.sqrt(dx * dx + dy * dy) || 1;
                        const suckSpeed = 90;
                        player.x += (dx / d) * suckSpeed * realDt;
                        player.y += (dy / d) * suckSpeed * realDt;
                        if (d < 8) {
                            // Frog spits player out — stun, no kill
                            player.stunned = true;
                            player.stunnedTimer = 2.0;
                            player.beingSucked = false;
                            player.suckTarget.sucking = false;
                            player.suckTarget.suckTimer = 0;
                            const pushAngle = Math.atan2(dy, dx);
                            player.x = player.suckTarget.x + Math.cos(pushAngle) * 60;
                            player.y = player.suckTarget.y + Math.sin(pushAngle) * 60;
                            player.x = Math.max(TILE / 2, Math.min(mapW * TILE - TILE / 2, player.x));
                            player.y = Math.max(TILE / 2, Math.min(mapH * TILE - TILE / 2, player.y));
                            shakeTimer = 0.3;
                            shakeIntensity = 0.7;
                        }
                    }
                }

                // Player movement
                if (!player.stunned && !player.beingSucked && !isDashing) {
                    let speedMult = 1.0;
                    if (upgrades.fakeWings && !upgrades.buggy) speedMult *= 1.15;
                    if (upgrades.buggy) speedMult *= 5.0;
                    if (jetPackActive) speedMult *= 1.5;
                    if (!onTree && !jetPackActive) {
                        for (const m of monsters) {
                            if (m.type === 'bird' && dist(player, m) < 55) {
                                speedMult *= 0.6;
                                break;
                            }
                        }
                    }
                    const input = getInputDir();
                    let moveX = input.x * player.speed * speedMult * realDt;
                    let moveY = input.y * player.speed * speedMult * realDt;

                    if (moveX !== 0 || moveY !== 0) {
                        player.animTimer += realDt;
                        if (player.animTimer > 0.15) { player.animTimer = 0;
                            player.animFrame = 1 - player.animFrame; }
                        if (input.x !== 0) player.facing = input.x > 0 ? 1 : -1;
                    } else {
                        player.animFrame = 0;
                        player.animTimer = 0;
                    }

                    let newX = player.x + moveX;
                    let newY = player.y + moveY;
                    newX = Math.max(TILE / 2, Math.min(mapW * TILE - TILE / 2, newX));
                    newY = Math.max(TILE / 2, Math.min(mapH * TILE - TILE / 2, newY));
                    player.x = newX;
                    player.y = newY;
                } else if (player.stunned && !isDashing) {
                    player.animFrame = 0;
                }

                // ── Interaction handling ────────
                const interactNow = getInteractionPressed();
                const dashNow = getDashPressed();
                const jetNow = getJetPackPressed();
                const treeInteractNow = getTreeInteractionPressed();

                // Dash
                if (dashNow && !prevDash && !isDashing && dashCooldown <= 0 && !player.stunned && !player.beingSucked) {
                    const input = getInputDir();
                    if (input.x !== 0 || input.y !== 0) {
                        dashDir = { x: input.x, y: input.y };
                    } else {
                        dashDir = { x: player.facing || 1, y: 0 };
                    }
                    const len = Math.sqrt(dashDir.x * dashDir.x + dashDir.y * dashDir.y);
                    dashDir.x /= len;
                    dashDir.y /= len;
                    isDashing = true;
                    dashTimer = 0.15;
                    dashCooldown = 10;
                    shakeTimer = 0.1;
                    shakeIntensity = 0.4;
                }

                // Jet pack
                if (jetNow && !prevJet && upgrades.jetPack && !jetPackActive && jetPackCooldown <= 0 && !player.stunned &&
                    !player.beingSucked && !isDashing) {
                    jetPackActive = true;
                    jetPackTimer = 3.0;
                    jetPackCooldown = 15;
                    if (onTree) {
                        onTree = false;
                        treeCooldown = 0.3;
                    }
                    player.beingSucked = false;
                    player.suckTarget = null;
                }

                // Big torch lighting — E key
                if (interactNow && !prevInteract && bigTorchActive && !bigTorchLit &&
                    dist(player, { x: bigTorchX, y: bigTorchY }) < TILE * 2.5 && !onTree && !player.stunned &&
                    !isDashing) {
                    bigTorchLit = true;
                    for (const m of monsters) {
                        if (m.type === 'wolf' && m.state === 'sleeping') {
                            m.state = 'lurking';
                            m.speed = player.speed;
                        }
                    }
                    openMonsterSelection();
                    prevInteract = interactNow;
                    prevDash = dashNow;
                    prevJet = jetNow;
                    prevTreeInteract = treeInteractNow;
                    return;
                }

                // Tree interaction — Q key
                if (treeInteractNow && !prevTreeInteract && treeCooldown <= 0 && !player.stunned && !isDashing && !
                    jetPackActive) {
                    if (onTree) {
                        onTree = false;
                        treeCooldown = 0.3;
                    } else {
                        const ptx = Math.floor(player.x / TILE);
                        const pty = Math.floor(player.y / TILE);
                        let foundTree = false;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (isTreeAt(ptx + dx, pty + dy)) {
                                    player.x = (ptx + dx) * TILE + TILE / 2;
                                    player.y = (pty + dy) * TILE + TILE / 2;
                                    foundTree = true;
                                    break;
                                }
                            }
                            if (foundTree) break;
                        }
                        if (foundTree) {
                            onTree = true;
                            treeCooldown = 0.3;
                            player.beingSucked = false;
                            player.suckTarget = null;
                            player.stunned = false;
                        }
                    }
                }
                prevInteract = interactNow;
                prevDash = dashNow;
                prevJet = jetNow;
                prevTreeInteract = treeInteractNow;

                // Collect torch parts
                if (!onTree && !jetPackActive) {
                    for (const tp of torchParts) {
                        if (tp.collected) continue;
                        if (dist(player, tp) < TILE * 0.8) {
                            tp.collected = true;
                            torchPartsCollected++;
                            score += 10;
                        }
                    }
                    // Collect sapphire torches
                    for (const sp of sapphireParts) {
                        if (sp.collected) continue;
                        if (dist(player, sp) < TILE * 0.8) {
                            sp.collected = true;
                            sapphireCount++;
                            score += 5;
                        }
                    }
                }

                // Activate big torch and spawn sapphire torches
                if (torchPartsCollected >= torchPartsNeeded && !bigTorchActive) {
                    bigTorchActive = true;
                    bigTorchLit = false;
                    // Spawn sapphire torches
                    const numSapphire = 5 + round * 2;
                    for (let i = 0; i < numSapphire; i++) {
                        let pos;
                        let ok = false;
                        let tries = 0;
                        while (!ok && tries < 200) {
                            pos = randomMapPos(3);
                            const pt = posToTile(pos);
                            if (isTreeAt(pt.tx, pt.ty)) { tries++; continue; }
                            if (dist(pos, player) < TILE * 3) { tries++; continue; }
                            if (dist(pos, { x: bigTorchX, y: bigTorchY }) < TILE * 2) { tries++; continue; }
                            let tooClose = false;
                            for (const sp of sapphireParts) {
                                if (dist(pos, sp) < TILE * 2) { tooClose = true; break; }
                            }
                            if (tooClose) { tries++; continue; }
                            ok = true;
                        }
                        if (ok) sapphireParts.push({ x: pos.x, y: pos.y, collected: false, glow: 0 });
                    }
                }

                // Check small bush traps
                if (!onTree && !player.stunned && !jetPackActive && !isDashing && invulnerableTimer <= 0) {
                    for (const m of monsters) {
                        if (m.type === 'bush' && m.placedBushes) {
                            for (const pb of m.placedBushes) {
                                if (dist(player, pb) < TILE * 1.4) {
                                    player.stunned = true;
                                    player.stunnedTimer = 2.3;
                                    player.beingSucked = false;
                                    player.suckTarget = null;
                                    m.placedBushes = m.placedBushes.filter(b => b !== pb);
                                    break;
                                }
                            }
                        }
                    }
                }

                // Update monsters
                const cam = getCamera();
                for (const m of monsters) {
                    updateMonster(m, realDt, cam);
                }

                // Check monster collisions
                if (!player.stunned && gameOverTimer <= 0 && invulnerableTimer <= 0 && !isDashing && !jetPackActive) {
                    for (const m of monsters) {
                        if (m.stunnedTimer > 0) continue;
                        if (m.type === 'bird') continue;
                        if (m.type === 'bush') continue;
                        if (m.type === 'frog' && m.airborne) continue;
                        if (m.type === 'wolf' && m.state === 'sleeping') continue;
                        if (m.type === 'frog' && m.sucking) continue;

                        if (m.type === 'giraffe' && m.state === 'chasing') {
                            const d = dist(player, m);
                            if (d < 25) {
                                handlePlayerHit(m, 'Caught by Giraffe!');
                                return;
                            }
                            continue;
                        }

                        if (onTree) continue;

                        const d = dist(player, m);
                        const hitDist = m.type === 'frog' ? 30 : m.type === 'giraffe' ? 25 : m.type === 'lion' ? 25 :
                            m.type === 'wolf' ? 25 : 20;
                        if (d < hitDist) {
                            if (m.type === 'lion' && m.state === 'dashing') {
                                handlePlayerHit(m, 'Pounced by Lion!');
                                return;
                            }
                            if (m.type === 'giraffe') { handlePlayerHit(m, 'Caught by Giraffe!'); return; }
                            if (m.type === 'wolf' && m.state === 'chasing') { handlePlayerHit(m, 'Caught by Wolf!'); return; }
                            if (m.type === 'wolf' && m.state === 'lurking' && m.alerted) { handlePlayerHit(m,
                                    'Caught by Wolf!'); return; }
                        }
                    }
                }
            }

            function handlePlayerHit(m, msg) {
                if (upgrades.shield && shieldReady) {
                    // Shield absorbs hit
                    shieldReady = false;
                    shieldRechargeTimer = 20;
                    invulnerableTimer = 2;
                    m.stunnedTimer = 5;
                    // Clear monster states
                    if (m.type === 'frog') {
                        m.airborne = false;
                        m.sucking = false;
                        m.shockwave = null;
                    }
                    if (m.type === 'lion') {
                        m.state = 'lurking';
                        m.dashVector = null;
                        m.telegraphTimer = 0;
                    }
                    shakeTimer = 0.15;
                    shakeIntensity = 0.5;
                } else {
                    killPlayer(msg);
                }
            }

            function killPlayer(msg) {
                deathMessage = msg;
                gameOverTimer = 0.6;
                shakeTimer = 0.5;
                shakeIntensity = 1;
                player.stunned = true;
                player.stunnedTimer = 1;
                isDashing = false;
                jetPackActive = false;
            }

            function openMonsterSelection() {
                const shuffled = [...allMonsterDefs].sort(() => Math.random() - 0.5);
                const picks = shuffled.slice(0, Math.min(4, shuffled.length));
                selectionOptions = picks.map(d => ({ id: d.id, name: d.name, desc: d.desc, iconColor: d.iconColor }));
                if (selectionOptions.length === 0) {
                    selectionOptions = allMonsterDefs.slice(0, 4).map(d => ({ id: d.id, name: d.name, desc: d.desc,
                        iconColor: d.iconColor }));
                }
                gameState = 'monsterSelect';
            }

            function openUpgradeSelection() {
                const available = upgradeDefs.filter(d => !upgrades[d.id]);
                if (available.length === 0) {
                    initRound();
                    return;
                }
                const shuffled = [...available].sort(() => Math.random() - 0.5);
                upgradeOptions = shuffled.slice(0, Math.min(3, shuffled.length));
                gameState = 'upgradeSelect';
            }

            function selectMonster(index) {
                if (index < 0 || index >= selectionOptions.length) return;
                const chosen = selectionOptions[index];
                spawnMonster(chosen.id);
                round++;
                score += 25;
                openUpgradeSelection();
            }

            function selectUpgrade(index) {
                if (index >= 0 && index < upgradeOptions.length) {
                    const chosen = upgradeOptions[index];
                    if (sapphireCount >= chosen.cost) {
                        sapphireCount -= chosen.cost;
                        upgrades[chosen.id] = true;
                    }
                }
                initRound();
            }

            function updateMonster(m, dt, cam) {
                // Stunned
                if (m.stunnedTimer > 0) {
                    m.stunnedTimer -= dt;
                    if (m.type === 'frog') {
                        m.airborne = false;
                        m.sucking = false;
                        m.shockwave = null;
                    }
                    if (m.type === 'lion') {
                        m.state = 'lurking';
                        m.dashVector = null;
                        m.telegraphTimer = 0;
                    }
                    return;
                }

                m.animTimer += dt;
                if (m.animTimer > 0.2) { m.animTimer = 0;
                    m.animFrame = 1 - m.animFrame; }
                const dToPlayer = dist(m, player);
                const onScreen = isOnScreen(m.x, m.y, cam);
                const playerInvuln = invulnerableTimer > 0 || isDashing || jetPackActive;

                if (m.type === 'giraffe') {
                    if (m.state === 'lurking') {
                        if (dToPlayer < m.detectionRange && !onTree && !playerInvuln) {
                            m.state = 'chasing';
                            m.alerted = true;
                        } else {
                            m.wanderTimer -= dt;
                            if (m.wanderTimer <= 0) {
                                m.wanderAngle += (Math.random() - 0.5) * 1.5;
                                m.wanderTimer = 1 + Math.random() * 2;
                            }
                            const ws = m.speed * 0.5;
                            const wx = Math.cos(m.wanderAngle) * ws * dt;
                            const wy = Math.sin(m.wanderAngle) * ws * dt;
                            moveMonster(m, wx, wy);
                        }
                    }
                    if (m.state === 'chasing') {
                        if (dToPlayer > m.detectionRange * 1.6 || onTree || playerInvuln) {
                            m.state = 'lurking';
                            m.alerted = false;
                        } else {
                            const dx = player.x - m.x;
                            const dy = player.y - m.y;
                            const d = Math.sqrt(dx * dx + dy * dy) || 1;
                            m.facing = dx > 0 ? 1 : -1;
                            const mx = (dx / d) * m.speed * dt;
                            const my = (dy / d) * m.speed * dt;
                            moveMonster(m, mx, my);
                        }
                    }
                }

                if (m.type === 'bird') {
                    m.wanderTimer -= dt;
                    if (m.wanderTimer <= 0) {
                        m.wanderAngle += (Math.random() - 0.5) * 2;
                        m.wanderTimer = 1.5 + Math.random() * 3;
                    }
                    const ws = m.speed;
                    const wx = Math.cos(m.wanderAngle) * ws * dt;
                    const wy = Math.sin(m.wanderAngle) * ws * dt;
                    moveMonster(m, wx, wy);
                    m.facing = wx > 0 ? 1 : wx < 0 ? -1 : m.facing;
                }

                if (m.type === 'frog') {
                    if (!m.airborne && !m.sucking) {
                        m.bounceTimer -= dt;
                        if (m.bounceTimer <= 0) {
                            const angle = Math.random() * Math.PI * 2;
                            const bdist = 40 + Math.random() * 70;
                            m.bounceFromX = m.x;
                            m.bounceFromY = m.y;
                            m.bounceToX = m.x + Math.cos(angle) * bdist;
                            m.bounceToY = m.y + Math.sin(angle) * bdist;
                            m.bounceToX = Math.max(TILE, Math.min(mapW * TILE - TILE, m.bounceToX));
                            m.bounceToY = Math.max(TILE, Math.min(mapH * TILE - TILE, m.bounceToY));
                            m.airborne = true;
                            m.airProgress = 0;
                            m.bounceTimer = 0;
                        }
                    }
                    if (m.airborne) {
                        m.airProgress += dt / 0.5;
                        if (m.airProgress >= 1) {
                            m.x = m.bounceToX;
                            m.y = m.bounceToY;
                            m.landX = m.x;
                            m.landY = m.y;
                            m.airborne = false;
                            m.bounceTimer = 2 + Math.random() * 4;
                            if (!onTree && !jetPackActive && !isDashing && invulnerableTimer <= 0 && dist(player, m) <
                                35) {
                                handlePlayerHit(m, 'Crushed by Frog!');
                                return;
                            }
                            m.shockwave = { radius: 0, progress: 0, maxRadius: 90 };
                            shakeTimer = 0.2;
                            shakeIntensity = 0.5;
                        } else {
                            const t2 = m.airProgress;
                            m.x = m.bounceFromX + (m.bounceToX - m.bounceFromX) * t2;
                            m.y = m.bounceFromY + (m.bounceToY - m.bounceFromY) * t2 - Math.sin(t2 * Math.PI) * 35;
                        }
                    }
                    if (m.shockwave) {
                        m.shockwave.radius += 80 * dt;
                        m.shockwave.progress = m.shockwave.radius / m.shockwave.maxRadius;
                        if (m.shockwave.radius >= m.shockwave.maxRadius) {
                            m.shockwave = null;
                        } else if (!onTree && !m.sucking && !jetPackActive && !isDashing && invulnerableTimer <= 0) {
                            const dSw = dist(player, m);
                            if (dSw < m.shockwave.radius && dSw > 5) {
                                m.sucking = true;
                                m.suckTimer = 1.8;
                                player.beingSucked = true;
                                player.suckTarget = m;
                                player.suckTimer = 1.8;
                                player.stunned = false;
                            }
                        }
                    }
                    if (m.sucking) {
                        m.suckTimer -= dt;
                        if (m.suckTimer <= 0) {
                            m.sucking = false;
                            if (player.beingSucked && player.suckTarget === m) {
                                player.beingSucked = false;
                                player.suckTarget = null;
                            }
                        }
                    }
                }

                if (m.type === 'lion') {
                    if (m.state === 'lurking') {
                        m.dashCooldown -= dt;
                        if (dToPlayer < m.detectionRange && !onTree && !playerInvuln && m.dashCooldown <= 0) {
                            m.state = 'telegraphing';
                            m.telegraphTimer = 0.3;
                            const dx = player.x - m.x;
                            const dy = player.y - m.y;
                            const d = Math.sqrt(dx * dx + dy * dy) || 1;
                            m.dashVector = { x: dx / d, y: dy / d };
                            m.facing = m.dashVector.x > 0 ? 1 : -1;
                        } else {
                            m.wanderTimer -= dt;
                            if (m.wanderTimer <= 0) {
                                m.wanderAngle += (Math.random() - 0.5) * 1.5;
                                m.wanderTimer = 1 + Math.random() * 2;
                            }
                            const ws = m.speed;
                            const wx = Math.cos(m.wanderAngle) * ws * dt;
                            const wy = Math.sin(m.wanderAngle) * ws * dt;
                            moveMonster(m, wx, wy);
                        }
                    }
                    if (m.state === 'telegraphing') {
                        m.telegraphTimer -= dt;
                        if (m.telegraphTimer <= 0) {
                            m.state = 'dashing';
                            m.dashTimer = 0.25;
                        }
                    }
                    if (m.state === 'dashing') {
                        m.dashTimer -= dt;
                        if (m.dashTimer <= 0) {
                            m.state = 'lurking';
                            m.dashCooldown = 3 + Math.random() * 5;
                            m.dashVector = null;
                        } else if (m.dashVector) {
                            const dashSpeed = 280;
                            const mx = m.dashVector.x * dashSpeed * dt;
                            const my = m.dashVector.y * dashSpeed * dt;
                            moveMonster(m, mx, my);
                        }
                    }
                }

                if (m.type === 'wolf') {
                    if (m.state === 'sleeping') {
                        if (bigTorchActive) {
                            m.state = 'lurking';
                            m.speed = player.speed;
                        }
                    }
                    if (m.state === 'lurking') {
                        if (dToPlayer < m.detectionRange && !onTree && !playerInvuln) {
                            m.state = 'chasing';
                            m.alerted = true;
                            m.speed = player.speed * 2;
                        } else {
                            m.wanderTimer -= dt;
                            if (m.wanderTimer <= 0) {
                                m.wanderAngle += (Math.random() - 0.5) * 1.5;
                                m.wanderTimer = 1 + Math.random() * 2;
                            }
                            const ws = m.speed * 0.5;
                            const wx = Math.cos(m.wanderAngle) * ws * dt;
                            const wy = Math.sin(m.wanderAngle) * ws * dt;
                            moveMonster(m, wx, wy);
                        }
                    }
                    if (m.state === 'chasing') {
                        if (onTree || dToPlayer > m.detectionRange * 2 || playerInvuln) {
                            m.state = 'lurking';
                            m.alerted = false;
                            m.speed = player.speed;
                        } else {
                            const dx = player.x - m.x;
                            const dy = player.y - m.y;
                            const d = Math.sqrt(dx * dx + dy * dy) || 1;
                            m.facing = dx > 0 ? 1 : -1;
                            const mx = (dx / d) * m.speed * dt;
                            const my = (dy / d) * m.speed * dt;
                            moveMonster(m, mx, my);
                        }
                    }
                }

                if (m.type === 'bush') {
                    if (onScreen) {} else {
                        m.moveTimer -= dt;
                        if (m.moveTimer <= 0) {
                            m.moveTimer = 30 + Math.random() * 20;
                            const newPos = randomMapPos(3);
                            m.x = newPos.x;
                            m.y = newPos.y;
                            const sb = { x: m.x + (Math.random() - 0.5) * TILE * 3, y: m.y + (Math.random() - 0.5) *
                                    TILE * 3 };
                            if (sb.x > TILE && sb.x < mapW * TILE - TILE && sb.y > TILE && sb.y < mapH * TILE - TILE) {
                                m.placedBushes.push(sb);
                                if (m.placedBushes.length > 6) m.placedBushes.shift();
                            }
                        }
                    }
                }

                m.x = Math.max(TILE / 2, Math.min(mapW * TILE - TILE / 2, m.x));
                m.y = Math.max(TILE / 2, Math.min(mapH * TILE - TILE / 2, m.y));
            }

            function moveMonster(m, dx, dy) {
                m.x = m.x + dx;
                m.y = m.y + dy;
            }

            // ── Handle Clicks ──────────────────────────
            function handleClick() {
                if (gameState === 'gameOver' && gameOverTimer <= 0) {
                    startGame();
                    return;
                }
                if (gameState === 'monsterSelect') {
                    handleMonsterSelectClick();
                    return;
                }
                if (gameState === 'upgradeSelect') {
                    handleUpgradeSelectClick();
                    return;
                }
            }

            function handleMonsterSelectClick() {
                const scale = Math.min(displayCanvas.width / VW, displayCanvas.height / VH);
                const drawW = VW * scale;
                const drawH = VH * scale;
                const drawY = (displayCanvas.height - drawH) / 2;

                const cardW = scale * 70;
                const cardH = scale * 80;
                const gap = scale * 8;
                const totalW = 2 * cardW + gap;
                const startX = (displayCanvas.width - totalW) / 2;
                const startY = drawY + scale * 45;

                const mx = mouseX / VW * displayCanvas.width;
                const my = mouseY / VH * displayCanvas.height;

                for (let i = 0; i < selectionOptions.length; i++) {
                    const col = i % 2;
                    const row = Math.floor(i / 2);
                    const cx2 = startX + col * (cardW + gap);
                    const cy2 = startY + row * (cardH + gap);
                    if (mx >= cx2 && mx <= cx2 + cardW && my >= cy2 && my <= cy2 + cardH) {
                        selectMonster(i);
                        return;
                    }
                }
            }

            function handleUpgradeSelectClick() {
                const scale = Math.min(displayCanvas.width / VW, displayCanvas.height / VH);
                const drawW = VW * scale;
                const drawH = VH * scale;
                const drawY = (displayCanvas.height - drawH) / 2;

                const cardW = scale * 90;
                const cardH = scale * 100;
                const gap = scale * 10;
                const totalW = upgradeOptions.length * cardW + (upgradeOptions.length - 1) * gap;
                const startX = (displayCanvas.width - totalW) / 2;
                const startY = drawY + scale * 42;

                const mx = mouseX / VW * displayCanvas.width;
                const my = mouseY / VH * displayCanvas.height;

                // Check skip button
                const skipY = startY + cardH + scale * 8;
                const skipX = displayCanvas.width / 2 - scale * 40;
                const skipW = scale * 80;
                const skipH = scale * 16;
                if (mx >= skipX && mx <= skipX + skipW && my >= skipY && my <= skipY + skipH) {
                    selectUpgrade(-1);
                    return;
                }

                // Check upgrade cards
                for (let i = 0; i < upgradeOptions.length; i++) {
                    const cx2 = startX + i * (cardW + gap);
                    const cy2 = startY;
                    if (mx >= cx2 && mx <= cx2 + cardW && my >= cy2 && my <= cy2 + cardH) {
                        if (sapphireCount >= upgradeOptions[i].cost) {
                            selectUpgrade(i);
                        }
                        return;
                    }
                }

                // Clicked outside everything = skip
                selectUpgrade(-1);
            }

            // ── Resize ──────────────────────────────────
            function resize() {
                displayCanvas.width = window.innerWidth;
                displayCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // ── Game Loop ──────────────────────────────
            let lastTime = performance.now();

            function gameLoop(time) {
                const dt = (time - lastTime) / 1000;
                lastTime = time;

                if (mouseClicked) {
                    handleClick();
                    mouseClicked = false;
                }

                if (gameState === 'playing') {
                    update(dt);
                }

                if (gameOverTimer <= 0 && gameState === 'playing' && deathMessage) {
                    gameState = 'gameOver';
                }

                render(time);
                requestAnimationFrame(gameLoop);
            }

            // ── Start ──────────────────────────────────
            startGame();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);

            console.log('🐺 Safari Torchlight v8 ready!');
            console.log('WASD/Arrows: Move | Q: Climb tree | E: Light big torch | Shift: Dash | Space: Jet Pack');
            console.log('Collect torch parts → Sapphire torches spawn → Light torch → Pick monster → Buy upgrades!');
        })();
    </script>
