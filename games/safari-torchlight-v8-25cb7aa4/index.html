<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Torchlight - Roguelike</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a05;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            font-family: 'Press Start 2P', monospace;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="game"></canvas>
    </div>
    <script>
        (function() {
            const displayCanvas = document.getElementById('game');
            const displayCtx = displayCanvas.getContext('2d');

            const VW = 320;
            const VH = 240;
            const TILE = 16;

            const offCanvas = document.createElement('canvas');
            offCanvas.width = VW;
            offCanvas.height = VH;
            const offCtx = offCanvas.getContext('2d');
            offCtx.imageSmoothingEnabled = false;

            // ── Game State ────────────────────────────
            let gameState = 'playing';
            let round = 1;
            let mapW, mapH;
            let torchPartsNeeded, torchPartsCollected;
            let bigTorchActive = false;
            let bigTorchLit = false;
            let bigTorchX, bigTorchY;
            let trees = [];
            let torchParts = [];
            let monsters = [];
            let selectionOptions = [];
            let upgradeOptions = [];
            let score = 0;
            let deathMessage = '';
            let stunTimer = 0;
            let onTree = false;
            let treeCooldown = 0;
            let gameOverTimer = 0;
            let shakeTimer = 0;
            let shakeIntensity = 0;

            // ── Sapphire / Upgrades ──────────────────
            let sapphireCount = 0;
            let sapphireParts = [];

            const upgrades = {
                brighterTorch: false,
                jetPack: false,
                shield: false,
                fakeWings: false,
                buggy: false,
            };

            const upgradeDefs = [
                { id: 'brighterTorch', name: 'Brighter Torch', desc: '1.3x light radius', cost: 3,
                iconColor: '#ffcc40' },
                { id: 'jetPack', name: 'Jet Pack', desc: 'Fly 3s, avoid hits', cost: 75, iconColor: '#ff8800' },
                { id: 'shield', name: 'Shield', desc: 'Absorbs one hit', cost: 60, iconColor: '#88ccff' },
                { id: 'fakeWings', name: 'Fake Wings', desc: '1.15x speed', cost: 25, iconColor: '#ffffff' },
                { id: 'buggy', name: 'Buggy', desc: '5x speed, new look', cost: 1000, iconColor: '#ff4444' },
            ];

            // ── Player ability state ──────────────────
            let dashCooldown = 0;
            let dashTimer = 0;
            let isDashing = false;
            let dashDir = { x: 0, y: 0 };
            let jetPackActive = false;
            let jetPackTimer = 0;
            let jetPackCooldown = 0;
            let invulnerableTimer = 0;
            let shieldReady = true;
            let shieldRechargeTimer = 0;

            const allMonsterDefs = [
                { id: 'giraffe', name: 'Giraffe', desc: 'Lurks then chases', iconColor: '#e8b830' },
                { id: 'bird', name: 'Bird', desc: 'Slows you nearby', iconColor: '#60b0e0' },
                { id: 'frog', name: 'Frog', desc: 'Bounces & shockwaves', iconColor: '#50c050' },
                { id: 'lion', name: 'Lion', desc: 'Pounces after delay', iconColor: '#d09030' },
                { id: 'wolf', name: 'Wolf', desc: 'Sleeps till parts done', iconColor: '#8088a0' },
                { id: 'bush', name: 'Bush', desc: 'Moves off-screen', iconColor: '#308030' },
            ];

            // ── Input ──────────────────────────────────
            const keys = {};
            let mouseX = 0,
                mouseY = 0;
            let mouseClicked = false;
            let touchActive = false;
            let touchDir = { x: 0, y: 0 };
            let touchId = null;

            function getInputDir() {
                let dx = 0,
                    dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
                if (touchActive) { dx += touchDir.x;
                    dy += touchDir.y; }
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len > 1) { dx /= len;
                    dy /= len; }
                return { x: dx, y: dy };
            }

            function getInteractionPressed() { return keys['KeyE']; }

            function getDashPressed() { return keys['ShiftLeft'] || keys['ShiftRight']; }

            function getJetPackPressed() { return keys['Space']; }

            function getTreeInteractionPressed() { return keys['KeyQ']; }
            let prevInteract = false;
            let prevDash = false;
            let prevJet = false;
            let prevTreeInteract = false;

            window.addEventListener('keydown', e => { keys[e.code] = true;
                e.preventDefault(); });
            window.addEventListener('keyup', e => { keys[e.code] = false;
                e.preventDefault(); });
            window.addEventListener('mousemove', e => {
                const rect = displayCanvas.getBoundingClientRect();
                const scaleX = VW / rect.width;
                const scaleY = VH / rect.height;
                mouseX = (e.clientX - rect.left) * scaleX;
                mouseY = (e.clientY - rect.top) * scaleY;
            });
            window.addEventListener('click', e => {
                mouseClicked = true;
                const rect = displayCanvas.getBoundingClientRect();
                const scaleX = VW / rect.width;
                const scaleY = VH / rect.height;
                mouseX = (e.clientX - rect.left) * scaleX;
                mouseY = (e.clientY - rect.top) * scaleY;
            });
            window.addEventListener('touchstart', e => {
                e.preventDefault();
                if (e.touches.length === 1) {
                    touchId = e.touches[0].identifier;
                    touchActive = true;
                    const rect = displayCanvas.getBoundingClientRect();
                    const sx = VW / rect.width;
                    const sy = VH / rect.height;
                    mouseX = (e.touches[0].clientX - rect.left) * sx;
                    mouseY = (e.touches[0].clientY - rect.top) * sy;
                    mouseClicked = true;
                    updateTouchDir(e.touches[0], rect, sx, sy);
                }
            }, { passive: false });
            window.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === touchId) {
                        const rect = displayCanvas.getBoundingClientRect();
                        const sx = VW / rect.width;
                        const sy = VH / rect.height;
                        mouseX = (e.touches[i].clientX - rect.left) * sx;
                        mouseY = (e.touches[i].clientY - rect.top) * sy;
                        updateTouchDir(e.touches[i], rect, sx, sy);
                        break;
                    }
                }
            }, { passive: false });
            window.addEventListener('touchend', e => {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === touchId) return;
                }
                touchActive = false;
                touchDir = { x: 0, y: 0 };
                touchId = null;
            });

            function updateTouchDir(touch, rect, sx, sy) {
                const tx = (touch.clientX - rect.left) * sx;
                const ty = (touch.clientY - rect.top) * sy;
                const cx = VW / 2;
                const cy = VH * 0.7;
                const dx = tx - cx;
                const dy = ty - cy;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 20) { touchDir = { x: 0, y: 0 }; return; }
                touchDir = { x: dx / len, y: dy / len };
            }

            // ── Player ─────────────────────────────────
            const player = {
                x: 0,
                y: 0,
                speed: 55,
                animTimer: 0,
                animFrame: 0,
                facing: 0,
                stunned: false,
                stunnedTimer: 0,
                beingSucked: false,
                suckTarget: null,
                suckTimer: 0,
            };

            function resetPlayer() {
                player.x = TILE * 2 + Math.random() * (mapW * TILE - TILE * 4);
                player.y = TILE * 2 + Math.random() * (mapH * TILE - TILE * 4);
                player.stunned = false;
                player.stunnedTimer = 0;
                player.beingSucked = false;
                player.suckTarget = null;
                player.suckTimer = 0;
                player.animTimer = 0;
                player.animFrame = 0;
                onTree = false;
                treeCooldown = 0;
                isDashing = false;
                dashTimer = 0;
                jetPackActive = false;
                jetPackTimer = 0;
                invulnerableTimer = 0;
            }

            // ── Helper Functions ──────────────────────
            function dist(a, b) { return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2); }

            function tileAt(wx, wy) {
                const tx = Math.floor(wx / TILE);
                const ty = Math.floor(wy / TILE);
                if (tx < 0 || ty < 0 || tx >= mapW || ty >= mapH) return 'wall';
                for (const t of trees) { if (t.tx === tx && t.ty === ty) return 'tree'; }
                return 'grass';
            }

            function isTreeAt(tx, ty) {
                for (const t of trees) { if (t.tx === tx && t.ty === ty) return t; }
                return null;
            }

            function randomMapPos(margin) {
                const m = margin || 2;
                return {
                    x: (m + Math.random() * (mapW - m * 2)) * TILE,
                    y: (m + Math.random() * (mapH - m * 2)) * TILE,
                    tx: 0,
                    ty: 0
                };
            }

            function posToTile(p) { return { tx: Math.floor(p.x / TILE), ty: Math.floor(p.y / TILE) }; }

            function randomNearTree() {
                const t = trees[Math.floor(Math.random() * trees.length)];
                return { x: (t.tx + 0.5) * TILE, y: (t.ty + 0.5) * TILE };
            }

            // ── Map Generation ────────────────────────
            function generateMap() {
                mapW = 28 + round * 4;
                mapH = 20 + round * 3;
                torchPartsNeeded = 3 + round;
                torchPartsCollected = 0;
                bigTorchActive = false;
                bigTorchLit = false;
                bigTorchX = Math.floor(mapW / 2) * TILE + TILE / 2;
                bigTorchY = Math.floor(mapH / 2) * TILE + TILE / 2;
                trees = [];
                torchParts = [];
                sapphireParts = [];
                const numTrees = Math.floor(mapW * mapH / 42);
                const attempts = numTrees * 8;
                for (let i = 0; i < attempts && trees.length < numTrees; i++) {
                    const tx = 2 + Math.floor(Math.random() * (mapW - 4));
                    const ty = 2 + Math.floor(Math.random() * (mapH - 4));
                    if (isTreeAt(tx, ty)) continue;
                    const cx = Math.floor(mapW / 2);
                    const cy = Math.floor(mapH / 2);
                    if (Math.abs(tx - cx) < 2 && Math.abs(ty - cy) < 2) continue;
                    let tooClose = false;
                    for (const t of trees) {
                        if (Math.abs(t.tx - tx) < 2 && Math.abs(t.ty - ty) < 2) { tooClose = true; break; }
                    }
                    if (!tooClose) trees.push({ tx, ty });
                }
                resetPlayer();
                for (let i = 0; i < torchPartsNeeded; i++) {
                    let pos;
                    let ok = false;
                    let tries = 0;
                    while (!ok && tries < 200) {
                        pos = randomMapPos(3);
                        const pt = posToTile(pos);
                        if (isTreeAt(pt.tx, pt.ty)) { tries++; continue; }
                        if (dist(pos, player) < TILE * 5) { tries++; continue; }
                        if (dist(pos, { x: bigTorchX, y: bigTorchY }) < TILE * 3) { tries++; continue; }
                        ok = true;
                    }
                    if (ok) torchParts.push({ x: pos.x, y: pos.y, collected: false, glow: 0 });
                }
                for (const m of monsters) {
                    if (m.type === 'wolf' && m.state === 'sleeping') {
                        const p = randomMapPos(3);
                        m.x = p.x;
                        m.y = p.y;
                    }
                }
            }

            function resetAllMonsters() {
                for (const m of monsters) {
                    m.state = m.type === 'wolf' ? 'sleeping' : (m.type === 'bush' ? 'hidden' : 'lurking');
                    m.cooldown = 0;
                    m.alerted = false;
                    m.dashDir = null;
                    m.stunnedTimer = 0;
                    const p = randomMapPos(3);
                    m.x = p.x;
                    m.y = p.y;
                    if (m.type === 'bush') {
                        m.placedBushes = [];
                        m.moveTimer = 10 + Math.random() * 20;
                    }
                    if (m.type === 'bird') { m.wanderAngle = Math.random() * Math.PI * 2;
                        m.wanderTimer = 0; }
                    if (m.type === 'frog') {
                        m.bounceTimer = 1 + Math.random() * 3;
                        m.airborne = false;
                        m.shockwave = null;
                        m.sucking = false;
                        m.suckTimer = 0;
                        m.landX = m.x;
                        m.landY = m.y;
                    }
                    if (m.type === 'lion') { m.dashCooldown = 1 + Math.random() * 3;
                        m.telegraphTimer = 0;
                        m.dashVector = null; }
                    if (m.type === 'giraffe') { m.wanderAngle = Math.random() * Math.PI * 2;
                        m.wanderTimer = 0; }
                    if (m.type === 'wolf') {
                        m.speed = player.speed;
                        m.detectionRange = 140;
                        m.alerted = false;
                        m.wanderAngle = Math.random() * Math.PI * 2;
                        m.wanderTimer = 0;
                    }
                }
            }

            function spawnMonster(typeId) {
                const def = allMonsterDefs.find(d => d.id === typeId);
                if (!def) return;
                const m = {
                    type: typeId,
                    name: def.name,
                    x: 0,
                    y: 0,
                    state: typeId === 'wolf' ? 'sleeping' : (typeId === 'bush' ? 'hidden' : 'lurking'),
                    cooldown: 0,
                    alerted: false,
                    animTimer: 0,
                    animFrame: 0,
                    facing: 0,
                    wanderAngle: Math.random() * Math.PI * 2,
                    wanderTimer: 0,
                    speed: 0,
                    detectionRange: 0,
                    dashDir: null,
                    dashCooldown: 0,
                    telegraphTimer: 0,
                    dashVector: null,
                    bounceTimer: 1 + Math.random() * 3,
                    airborne: false,
                    airProgress: 0,
                    bounceFromX: 0,
                    bounceFromY: 0,
                    bounceToX: 0,
                    bounceToY: 0,
                    shockwave: null,
                    sucking: false,
                    suckTimer: 0,
                    landX: 0,
                    landY: 0,
                    moveTimer: 10 + Math.random() * 20,
                    placedBushes: [],
                    lastBushPlace: 0,
                    stunnedTimer: 0,
                };
                const p = randomMapPos(3);
                m.x = p.x;
                m.y = p.y;
                m.landX = m.x;
                m.landY = m.y;
                if (typeId === 'wolf') { m.detectionRange = 140;
                    m.speed = player.speed; }
                if (typeId === 'giraffe') { m.detectionRange = 130;
                    m.speed = player.speed * 0.85; }
                if (typeId === 'bird') { m.speed = 25;
                    m.detectionRange = 0; }
                if (typeId === 'frog') { m.speed = 0;
                    m.detectionRange = 0;
                    m.bounceTimer = 1 + Math.random() * 3;
                    m.landX = m.x;
                    m.landY = m.y; }
                if (typeId === 'lion') { m.detectionRange = 120;
                    m.speed = 30;
                    m.dashCooldown = 2 + Math.random() * 4; }
                if (typeId === 'bush') { m.speed = 0;
                    m.moveTimer = 15 + Math.random() * 25;
                    m.lastBushPlace = 0; }
                monsters.push(m);
            }

            // ── Initialize Round ──────────────────────
            function initRound() {
                generateMap();
                resetAllMonsters();
                player.stunned = false;
                player.stunnedTimer = 0;
                player.beingSucked = false;
                player.suckTarget = null;
                onTree = false;
                treeCooldown = 0;
                isDashing = false;
                dashTimer = 0;
                jetPackActive = false;
                jetPackTimer = 0;
                invulnerableTimer = 0;
                gameState = 'playing';
                bigTorchActive = false;
                bigTorchLit = false;
                deathMessage = '';
                gameOverTimer = 0;
            }

            function startGame() {
                round = 1;
                score = 0;
                monsters = [];
                deathMessage = '';
                gameOverTimer = 0;
                sapphireCount = 0;
                upgrades.brighterTorch = false;
                upgrades.jetPack = false;
                upgrades.shield = false;
                upgrades.fakeWings = false;
                upgrades.buggy = false;
                dashCooldown = 0;
                dashTimer = 0;
                isDashing = false;
                jetPackActive = false;
                jetPackTimer = 0;
                jetPackCooldown = 0;
                invulnerableTimer = 0;
                shieldReady = true;
                shieldRechargeTimer = 0;
                initRound();
            }

            // ── Camera ────────────────────────────────
            function getCamera() {
                let cx = player.x - VW / 2;
                let cy = player.y - VH / 2;
                cx = Math.max(0, Math.min(cx, mapW * TILE - VW));
                cy = Math.max(0, Math.min(cy, mapH * TILE - VH));
                if (mapW * TILE <= VW) cx = -(VW - mapW * TILE) / 2;
                if (mapH * TILE <= VH) cy = -(VH - mapH * TILE) / 2;
                return { x: cx, y: cy };
            }

            function worldToScreen(wx, wy, cam) {
                return { x: wx - cam.x, y: wy - cam.y };
            }

            function isOnScreen(wx, wy, cam) {
                const s = worldToScreen(wx, wy, cam);
                return s.x >= -TILE && s.y >= -TILE && s.x <= VW + TILE && s.y <= VH + TILE;
            }

            // ── Drawing Functions ──────────────────────
            function drawPixelChar(ctx, x, y, w, h, pixels, scale) {
                const s = scale || 1;
                for (let py = 0; py < h; py++) {
                    for (let px = 0; px < w; px++) {
                        const color = pixels[py * w + px];
                        if (color && color !== 'transparent') {
                            ctx.fillStyle = color;
                            ctx.fillRect(Math.floor(x + px * s), Math.floor(y + py * s), s, s);
                        }
                    }
                }
            }

            function drawZebra(ctx, x, y, frame, facing) {
                const s = 2;
                const w = 5;
                const h = 8;
                const body = [
                    'transparent', '#ffffff', '#ffffff', '#ffffff', 'transparent',
                    '#ffffff', '#000000', '#ffffff', '#000000', '#ffffff',
                    '#ffffff', '#ffffff', '#000000', '#ffffff', '#ffffff',
                    '#ffffff', '#000000', '#ffffff', '#000000', '#ffffff',
                    '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff',
                    'transparent', '#ffffff', '#ffffff', '#ffffff', 'transparent',
                    'transparent', '#000000', 'transparent', '#000000', 'transparent',
                    'transparent', '#000000', 'transparent', '#000000', 'transparent',
                ];
                const legOffset = frame === 0 ? 0 : 1;
                const pixels = [...body];
                if (legOffset > 0 && frame === 1) {
                    pixels[30] = 'transparent';
                    pixels[31] = '#000000';
                    pixels[32] = '#000000';
                    pixels[33] = 'transparent';
                    pixels[34] = 'transparent';
                    pixels[35] = 'transparent';
                    pixels[36] = '#000000';
                    pixels[37] = '#000000';
                    pixels[38] = 'transparent';
                    pixels[39] = 'transparent';
                }
                drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, pixels, s);
                if (facing < 0) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(Math.floor(x + 4), Math.floor(y - h * s + 2), 1, 2);
                } else if (facing > 0) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(Math.floor(x - 5), Math.floor(y - h * s + 2), 1, 2);
                }
            }

            function drawBuggy(ctx, x, y, frame, facing) {
                const s = 4;
                // Wheels
                ctx.fillStyle = '#222222';
                ctx.beginPath();
                ctx.arc(Math.floor(x - 14), Math.floor(y - 4), 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(Math.floor(x + 14), Math.floor(y - 4), 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#555555';
                ctx.beginPath();
                ctx.arc(Math.floor(x - 14), Math.floor(y - 4), 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(Math.floor(x + 14), Math.floor(y - 4), 3, 0, Math.PI * 2);
                ctx.fill();
                // Body
                ctx.fillStyle = '#cc3333';
                ctx.fillRect(Math.floor(x - 20), Math.floor(y - 22), 40, 18);
                ctx.fillStyle = '#aa2222';
                ctx.fillRect(Math.floor(x - 18), Math.floor(y - 24), 36, 4);
                // Roll cage
                ctx.fillStyle = '#888888';
                ctx.fillRect(Math.floor(x - 8), Math.floor(y - 34), 16, 12);
                ctx.fillStyle = '#666666';
                ctx.fillRect(Math.floor(x - 6), Math.floor(y - 36), 12, 4);
                // Zebra head
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(Math.floor(x - 5), Math.floor(y - 40), 10, 9);
                ctx.fillStyle = '#000000';
                ctx.fillRect(Math.floor(x - 3), Math.floor(y - 38), 3, 3);
                ctx.fillRect(Math.floor(x + 1), Math.floor(y - 38), 3, 3);
                // Snout
                ctx.fillStyle = '#000000';
                ctx.fillRect(Math.floor(x + (facing >= 0 ? 3 : -7)), Math.floor(y - 33), 3, 2);
                // Eye
                ctx.fillStyle = '#000000';
                ctx.fillRect(Math.floor(x + (facing >= 0 ? 2 : -3)), Math.floor(y - 39), 1, 1);
                // Exhaust
                ctx.fillStyle = '#777777';
                ctx.fillRect(Math.floor(x + 18), Math.floor(y - 20), 4, 6);
                ctx.fillStyle = '#999999';
                ctx.fillRect(Math.floor(x + 19), Math.floor(y - 22), 2, 3);
            }

            function drawGiraffe(ctx, x, y, frame, facing) {
                const s = 2;
                const w = 6;
                const h = 14;
                const body = [
                    'transparent', 'transparent', '#e8b830', '#e8b830', 'transparent', 'transparent',
                    'transparent', 'transparent', '#e8b830', '#e8b830', 'transparent', 'transparent',
                    'transparent', '#e8b830', '#d09020', '#d09020', '#e8b830', 'transparent',
                    'transparent', '#e8b830', '#d09020', '#d09020', '#e8b830', 'transparent',
                    '#e8b830', '#e8b830', '#e8b830', '#e8b830', '#e8b830', '#e8b830',
                    '#e8b830', '#c08020', '#e8b830', '#e8b830', '#c08020', '#e8b830',
                    '#e8b830', '#e8b830', '#e8b830', '#e8b830', '#e8b830', '#e8b830',
                    '#e8b830', '#e8b830', '#e8b830', '#e8b830', '#e8b830', '#e8b830',
                    'transparent', '#e8b830', '#e8b830', '#e8b830', '#e8b830', 'transparent',
                    'transparent', '#e8b830', '#e8b830', '#e8b830', '#e8b830', 'transparent',
                    'transparent', '#c08020', 'transparent', 'transparent', '#c08020', 'transparent',
                    'transparent', '#c08020', 'transparent', 'transparent', '#c08020', 'transparent',
                    'transparent', '#c08020', 'transparent', 'transparent', '#c08020', 'transparent',
                    'transparent', '#c08020', 'transparent', 'transparent', '#c08020', 'transparent',
                ];
                const off = frame === 0 ? 0 : 1;
                const pxs = [...body];
                if (off > 0) {
                    for (let i = 11 * w; i < 14 * w; i++) {
                        if (pxs[i] === '#c08020' && i % 2 === 0) pxs[i] = 'transparent';
                    }
                }
                drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, pxs, s);
            }

            function drawBird(ctx, x, y, frame, facing) {
                const s = 6;
                const w = 5;
                const h = 5;
                const body = [
                    'transparent', '#60b0e0', '#60b0e0', '#60b0e0', 'transparent',
                    '#60b0e0', '#80d0ff', '#80d0ff', '#80d0ff', '#60b0e0',
                    '#60b0e0', '#80d0ff', '#ffffff', '#80d0ff', '#60b0e0',
                    'transparent', '#f0a040', '#f0a040', 'transparent', 'transparent',
                    'transparent', '#e08030', '#e08030', 'transparent', 'transparent',
                ];
                const pxs = [...body];
                if (frame === 1) { pxs[1] = '#80d0ff';
                    pxs[3] = '#80d0ff'; } else { pxs[1] = '#60b0e0';
                    pxs[3] = '#60b0e0'; }
                drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, pxs, s);
                ctx.fillStyle = '#000';
                ctx.fillRect(Math.floor(x - 3), Math.floor(y - h * s + 9), 2, 2);
                ctx.fillRect(Math.floor(x + 3), Math.floor(y - h * s + 9), 2, 2);
            }

            function drawFrog(ctx, x, y, frame, airborne) {
                const s = 6;
                const w = 8;
                const h = 7;
                const scaleY = airborne ? 0.6 : 1.0;
                const body = [
                    'transparent', '#309030', '#50c050', '#50c050', '#50c050', '#50c050', '#309030',
                    'transparent',
                    '#309030', '#50c050', '#70e070', '#70e070', '#70e070', '#70e070', '#50c050', '#309030',
                    '#309030', '#50c050', '#ffffff', '#70e070', '#70e070', '#ffffff', '#50c050', '#309030',
                    '#309030', '#50c050', '#50c050', '#50c050', '#50c050', '#50c050', '#50c050', '#309030',
                    '#309030', '#50c050', '#50c050', '#50c050', '#50c050', '#50c050', '#50c050', '#309030',
                    'transparent', '#309030', '#309030', 'transparent', 'transparent', '#309030', '#309030',
                    'transparent',
                    'transparent', '#206020', '#206020', 'transparent', 'transparent', '#206020', '#206020',
                    'transparent',
                ];
                const cy = y - h * s * scaleY;
                drawPixelChar(ctx, x - w * s / 2, cy, w, h, body, s);
                ctx.fillStyle = '#000';
                const eyeY = cy + 2 * s;
                ctx.fillRect(Math.floor(x - 6), Math.floor(eyeY), 3, 3);
                ctx.fillRect(Math.floor(x + 9), Math.floor(eyeY), 3, 3);
            }

            function drawLion(ctx, x, y, frame, facing) {
                const s = 6;
                const w = 7;
                const h = 7;
                const body = [
                    'transparent', '#d09030', '#d09030', '#d09030', '#d09030', '#d09030', 'transparent',
                    '#d09030', '#f0c040', '#f0c040', '#f0c040', '#f0c040', '#f0c040', '#d09030',
                    '#d09030', '#f0c040', '#e0a030', '#e0a030', '#e0a030', '#f0c040', '#d09030',
                    '#d09030', '#e0a030', '#e0a030', '#fff8e0', '#e0a030', '#e0a030', '#d09030',
                    'transparent', '#d09030', '#e0a030', '#e0a030', '#e0a030', '#d09030', 'transparent',
                    'transparent', '#d09030', 'transparent', '#d09030', 'transparent', '#d09030',
                    'transparent',
                    'transparent', '#b07020', 'transparent', 'transparent', 'transparent', '#b07020',
                    'transparent',
                ];
                drawPixelChar(ctx, x - w * s / 2, y - h * s, w, h, body, s);
                ctx.fillStyle = '#000';
                ctx.fillRect(Math.floor(x - 6), Math.floor(y - h * s + 9), 3, 3);
                ctx.fillRect(Math.floor(x + 6), Math.floor(y - h * s + 9), 3, 3);
            }

            function drawWolf(ctx, x, y, frame, state) {
                const s = 6;
                const w = 8;
                const h = 8;
                if (state === 'sleeping') {
                    const body = [
                        'transparent', 'transparent', '#6a6a82', '#6a6a82', '#6a6a82', '#6a6a82', 'transparent', 'transparent',
                        'transparent', '#6a6a82', '#8a8aa2', '#8a8aa2', '#8a8aa2', '#8a8aa2', '#6a6a82', 'transparent',
                        '#6a6a82', '#8a8aa2', '#a8a8c0', '#a8a8c0', '#a8a8c0', '#a8a8c0', '#8a8aa2', '#6a6a82',
                        '#6a6a82', '#8a8aa2', '#a8a8c0', '#c8c8e0', '#c8c8e0', '#a8a8c0', '#8a8aa2', '#6a6a82',
                        'transparent', '#6a6a82', '#8a8aa2', '#a8a8c0', '#a8a8c0', '#8a8aa2', '#6a6a82', 'transparent',
                        'transparent', 'transparent', '#5a5a72', '#6a6a82', '#6a6a82', '#5a5a72', 'transparent', 'transparent',
                        'transparent', 'transparent', '#5a5a72', '#5a5a72', '#5a5a72', '#5a5a72', 'transparent', 'transparent',
                        'transparent', 'transparent', 'transparent', '#4a4a62', '#4a4a62', 'transparent', 'transparent', 'transparent',
                    ];

                } else {
                    const body = [
                        'transparent', '#5a5a78', 'transparent', 'transparent', 'transparent', 'transparent', '#5a5a78', 'transparent',
