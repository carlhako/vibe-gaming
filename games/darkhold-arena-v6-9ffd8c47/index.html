                    const swingStartAngle = player.angle - halfArc;
                    const swingEndAngle = player.angle + halfArc;
                    const swingAngle = swingStartAngle + swingProgress * player.attackSwingArc;
                    const arcAlpha = Math.max(0, (1 - swingProgress) * 0.55);
                    ctx.strokeStyle = `rgba(255,245,200,${arcAlpha})`;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(px, py, size * 1.35, swingStartAngle, swingAngle);
                    ctx.stroke();
                    const glowAlpha = Math.max(0, (1 - swingProgress) * 0.25);
                    ctx.strokeStyle = `rgba(255,255,220,${glowAlpha})`;
                    ctx.lineWidth = 9;
                    ctx.beginPath();
                    ctx.arc(px, py, size * 1.35, swingStartAngle, swingAngle);
                    ctx.stroke();
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#f0e8d0';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    const weaponLen = size * 1.5;
                    ctx.lineTo(px + Math.cos(swingAngle) * weaponLen, py + Math.sin(swingAngle) * weaponLen);
                    ctx.stroke();
                    const tipX = px + Math.cos(swingAngle) * weaponLen;
                    const tipY = py + Math.sin(swingAngle) * weaponLen;
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#fff8e0';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    const lineCount = 3;
                    for (let i = 0; i < lineCount; i++) {
                        const lx = tipX - Math.cos(swingAngle) * (4 + i * 5) +
                            Math.cos(swingAngle + Math.PI / 2) * (i - 1) * 3;
                        const ly = tipY - Math.sin(swingAngle) * (4 + i * 5) +
                            Math.sin(swingAngle + Math.PI / 2) * (i - 1) * 3;
                        const la = (1 - swingProgress) * 0.7 * (1 - i / lineCount);
                        ctx.strokeStyle = `rgba(255,255,240,${la})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(lx - Math.cos(swingAngle) * 10, ly - Math.sin(swingAngle) * 10);
                        ctx.stroke();
                    }
                } else {
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#d0c8b8';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + Math.cos(player.angle) * size * 1.3, py + Math.sin(player.angle) * size * 1.3);
                    ctx.stroke();
                    const tipX = px + Math.cos(player.angle) * size * 1.3;
                    const tipY = py + Math.sin(player.angle) * size * 1.3;
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#f0e8d0';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                const eyeX = Math.cos(player.angle) * 3;
                const eyeY = Math.sin(player.angle) * 3;
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(px + eyeX, py - size * 0.5, 2, 0, Math.PI * 2);
                ctx.fill();

                if (player.health < player.maxHealth) {
                    const barW = 28;
                    const barH = 4;
                    const barY = py - size - 10;
                    ctx.fillStyle = '#300000';
                    ctx.fillRect(px - barW / 2, barY, barW, barH);
                    ctx.fillStyle = '#cc2222';
                    ctx.fillRect(px - barW / 2, barY, barW * (player.health / player.maxHealth), barH);
                }
            }

            function drawMinion(minion, mx, my) {
                const s = minion.size;
                const flashColor = minion.hitFlash > 0 ? '#ffffff' : minion.color;
                const isMoving = minion.isMoving;
                const walkPhase = minion.walkTimer || 0;

                // Subtle bobbing when walking
                const bobY = isMoving ? Math.sin(walkPhase * 2) * 1.5 : 0;
                const bodyY = my - s * 0.08 + bobY;

                // === SHADOW ===
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(mx, my + s * 0.65, s * 0.7, s * 0.22, 0, 0, Math.PI * 2);
                ctx.fill();

                // === LEGS (walking animation) ===
                const hipY = bodyY + s * 0.3;
                const legLen = s * 0.55;
                const kneeY = hipY + legLen * 0.5;
                const footY = hipY + legLen;

                // Left leg (swings opposite to right)
                const lPhase = walkPhase;
                const lKneeX = mx - s * 0.15 + Math.sin(lPhase) * s * 0.35;
                const lFootX = lKneeX + Math.sin(lPhase) * s * 0.25;

                ctx.strokeStyle = flashColor;
                ctx.lineWidth = 2.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(mx - s * 0.2, hipY);
                ctx.lineTo(lKneeX, kneeY);
                ctx.lineTo(lFootX, footY);
                ctx.stroke();
                // Foot
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(lFootX, footY, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Right leg (opposite phase)
                const rPhase = walkPhase + Math.PI;
                const rKneeX = mx + s * 0.15 + Math.sin(rPhase) * s * 0.35;
                const rFootX = rKneeX + Math.sin(rPhase) * s * 0.25;

                ctx.strokeStyle = flashColor;
                ctx.beginPath();
                ctx.moveTo(mx + s * 0.2, hipY);
                ctx.lineTo(rKneeX, kneeY);
                ctx.lineTo(rFootX, footY);
                ctx.stroke();
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(rFootX, footY, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // === PELVIS ===
                ctx.fillStyle = '#d8ccb4';
                ctx.beginPath();
                ctx.ellipse(mx, hipY, s * 0.28, s * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();

                // === SPINE ===
                const spineTop = bodyY - s * 0.35;
                ctx.strokeStyle = '#ddd0c0';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(mx, hipY - s * 0.05);
                ctx.lineTo(mx, spineTop);
                ctx.stroke();
                // Small vertebrae dots along spine
                for (let v = 0; v < 4; v++) {
                    const vy = hipY - s * 0.08 - v * s * 0.1;
                    ctx.fillStyle = '#ddd0c0';
                    ctx.beginPath();
                    ctx.arc(mx, vy, 1.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // === RIBCAGE ===
                const ribTop = spineTop + s * 0.08;
                const ribBottom = hipY - s * 0.2;
                ctx.strokeStyle = '#d4c8b0';
                ctx.lineWidth = 2;
                for (let r = 0; r < 4; r++) {
                    const ry = ribTop + r * (ribBottom - ribTop) / 3;
                    const ribWidth = s * 0.3 + r * s * 0.03;
                    ctx.beginPath();
                    ctx.moveTo(mx - ribWidth, ry);
                    ctx.quadraticCurveTo(mx, ry - s * 0.06, mx + ribWidth, ry);
                    ctx.stroke();
                }

                // === ARMS (animated, opposite to legs) ===
                const shoulderY = spineTop + s * 0.02;
                const upperArmLen = s * 0.35;
                const forearmLen = s * 0.3;

                // Left arm
                const laPhase = walkPhase + Math.PI; // opposite to left leg
                const lShoulderX = mx - s * 0.35;
                const lElbowX = lShoulderX + Math.sin(laPhase) * s * 0.22;
                const lElbowY = shoulderY + upperArmLen * 0.65;
                const lHandX = lElbowX + Math.sin(laPhase) * s * 0.18;
                const lHandY = lElbowY + forearmLen * 0.75;

                ctx.strokeStyle = flashColor;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(lShoulderX, shoulderY);
                ctx.lineTo(lElbowX, lElbowY);
                ctx.lineTo(lHandX, lHandY);
                ctx.stroke();
                // Tiny hand
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(lHandX, lHandY, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Right arm
                const raPhase = walkPhase; // opposite to right leg (which is walkPhase+PI)
                const rShoulderX = mx + s * 0.35;
                const rElbowX = rShoulderX + Math.sin(raPhase) * s * 0.22;
                const rElbowY = shoulderY + upperArmLen * 0.65;
                const rHandX = rElbowX + Math.sin(raPhase) * s * 0.18;
                const rHandY = rElbowY + forearmLen * 0.75;

                ctx.strokeStyle = flashColor;
                ctx.beginPath();
                ctx.moveTo(rShoulderX, shoulderY);
                ctx.lineTo(rElbowX, rElbowY);
                ctx.lineTo(rHandX, rHandY);
                ctx.stroke();
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(rHandX, rHandY, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // === SKULL ===
                const headY = spineTop - s * 0.22;
                const skullR = s * 0.32;

                // Cranium
                ctx.fillStyle = '#f5efe0';
                ctx.beginPath();
                ctx.arc(mx, headY, skullR, 0, Math.PI * 2);
                ctx.fill();

                // Jaw
                ctx.fillStyle = '#ede4d4';
                ctx.beginPath();
                ctx.moveTo(mx - skullR * 0.65, headY + skullR * 0.25);
                ctx.lineTo(mx + skullR * 0.65, headY + skullR * 0.25);
                ctx.lineTo(mx + skullR * 0.45, headY + skullR * 0.75);
                ctx.lineTo(mx - skullR * 0.45, headY + skullR * 0.75);
                ctx.closePath();
                ctx.fill();

                // Cheekbone definition
                ctx.fillStyle = '#f0e8d8';
                ctx.beginPath();
                ctx.arc(mx - skullR * 0.5, headY + skullR * 0.15, skullR * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(mx + skullR * 0.5, headY + skullR * 0.15, skullR * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // Cranium top re-fill over cheekbones
                ctx.fillStyle = '#f5efe0';
                ctx.beginPath();
                ctx.arc(mx, headY, skullR, 0, Math.PI * 2);
                ctx.fill();

                // Eye sockets - deep dark holes
                ctx.fillStyle = '#0d0d0d';
                ctx.beginPath();
                ctx.ellipse(mx - skullR * 0.32, headY - skullR * 0.08, skullR * 0.25, skullR * 0.28, 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(mx + skullR * 0.32, headY - skullR * 0.08, skullR * 0.25, skullR * 0.28, -0.15, 0, Math.PI * 2);
                ctx.fill();

                // Tiny red eye glow deep inside
                ctx.fillStyle = 'rgba(200,40,40,0.55)';
                ctx.beginPath();
                ctx.arc(mx - skullR * 0.32, headY - skullR * 0.08, skullR * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(mx + skullR * 0.32, headY - skullR * 0.08, skullR * 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Nasal cavity
                ctx.fillStyle = '#0d0d0d';
                ctx.beginPath();
                ctx.moveTo(mx, headY + skullR * 0.02);
                ctx.lineTo(mx - skullR * 0.16, headY + skullR * 0.28);
                ctx.lineTo(mx + skullR * 0.16, headY + skullR * 0.28);
                ctx.closePath();
                ctx.fill();

                // Teeth line in jaw
                ctx.fillStyle = '#e8dcc8';
                for (let t = -2; t <= 2; t++) {
                    ctx.fillRect(mx + t * 3.2 - 1.5, headY + skullR * 0.38, 3, 3.5);
                }

                // === WEAPON (small sword) ===
                const weaponAngle = minion.angle || 0;
                const weaponStartX = mx + Math.cos(weaponAngle) * s * 0.25;
                const weaponStartY = bodyY + Math.sin(weaponAngle) * s * 0.25;
                const weaponEndX = mx + Math.cos(weaponAngle) * s * 1.15;
                const weaponEndY = bodyY + Math.sin(weaponAngle) * s * 1.15;

                ctx.strokeStyle = '#c8c0b0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(weaponStartX, weaponStartY);
                ctx.lineTo(weaponEndX, weaponEndY);
                ctx.stroke();
                // Blade tip
                ctx.fillStyle = '#ddd8d0';
                ctx.beginPath();
                ctx.arc(weaponEndX, weaponEndY, 2.5, 0, Math.PI * 2);
                ctx.fill();
                // Crossguard
                const crossX = weaponStartX + Math.cos(weaponAngle) * s * 0.08;
                const crossY = weaponStartY + Math.sin(weaponAngle) * s * 0.08;
                ctx.strokeStyle = '#b0a890';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(crossX + Math.cos(weaponAngle + Math.PI / 2) * s * 0.15,
                    crossY + Math.sin(weaponAngle + Math.PI / 2) * s * 0.15);
                ctx.lineTo(crossX - Math.cos(weaponAngle + Math.PI / 2) * s * 0.15,
                    crossY - Math.sin(weaponAngle + Math.PI / 2) * s * 0.15);
                ctx.stroke();

                // === ALLY INDICATOR (soft blue aura) ===
                ctx.fillStyle = 'rgba(80,140,220,0.18)';
                ctx.beginPath();
                ctx.arc(mx, my, s * 0.85, 0, Math.PI * 2);
                ctx.fill();

                // === HEALTH BAR ===
                if (minion.health < minion.maxHealth) {
                    const barW = s * 1.9;
                    const barH = 2.5;
                    const barY = my - s * 0.95;
                    ctx.fillStyle = '#200000';
                    ctx.fillRect(mx - barW / 2, barY, barW, barH);
                    ctx.fillStyle = '#7799cc';
                    ctx.fillRect(mx - barW / 2, barY, barW * (minion.health / minion.maxHealth), barH);
                }

                // === RANGED INDICATOR (small bow nock) ===
                if (minion.isRanged) {
                    const bowX = mx + Math.cos(minion.angle || 0) * s * 0.7;
                    const bowY = my + Math.sin(minion.angle || 0) * s * 0.7;
                    ctx.fillStyle = 'rgba(255,255,180,0.55)';
                    ctx.beginPath();
                    ctx.arc(bowX, bowY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawEnemy(enemy, ex, ey) {
                const s = enemy.size;
                const flashColor = enemy.hitFlash > 0 ? '#ffffff' : enemy.color;
                const stunInd = enemy.stunTimer > 0;

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(ex, ey + s * 0.5, s * 0.8, s * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                if (enemy.type === 'skeleton') {
                    ctx.fillStyle = flashColor;
                    ctx.fillRect(ex - s * 0.4, ey - s * 0.7, s * 0.8, s * 1.2);
                    ctx.fillStyle = '#f0e8d8';
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.75, s * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(ex - 3, ey - s * 0.78, 2, 0, Math.PI * 2);
                    ctx.arc(ex + 3, ey - s * 0.78, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'ghost') {
                    ctx.fillStyle = flashColor;
                    ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    ctx.arc(ex, ey, s * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.4, s * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ddeeff';
                    ctx.beginPath();
                    ctx.arc(ex - 2, ey - s * 0.3, 2.5, 0, Math.PI * 2);
                    ctx.arc(ex + 2, ey - s * 0.3, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'demon') {
                    ctx.fillStyle = flashColor;
                    ctx.fillRect(ex - s * 0.5, ey - s * 0.5, s, s * 1.1);
                    ctx.fillStyle = '#ff6644';
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.55, s * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#331111';
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.25, ey - s * 0.7);
                    ctx.lineTo(ex - s * 0.4, ey - s * 1.1);
                    ctx.lineTo(ex - s * 0.05, ey - s * 0.55);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.25, ey - s * 0.7);
                    ctx.lineTo(ex + s * 0.4, ey - s * 1.1);
                    ctx.lineTo(ex + s * 0.05, ey - s * 0.55);
                    ctx.fill();
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.arc(ex - 3, ey - s * 0.5, 2, 0, Math.PI * 2);
                    ctx.arc(ex + 3, ey - s * 0.5, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'brute') {
                    ctx.fillStyle = flashColor;
                    ctx.fillRect(ex - s * 0.55, ey - s * 0.5, s * 1.1, s * 1.2);
                    ctx.fillStyle = '#554433';
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.55, s * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#aa2200';
                    ctx.beginPath();
                    ctx.arc(ex - 4, ey - s * 0.5, 2.5, 0, Math.PI * 2);
                    ctx.arc(ex + 4, ey - s * 0.5, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (stunInd) {
                    ctx.fillStyle = '#ffff88';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('✦', ex, ey - s - 6);
                }

                // Draw "idle" indicator for non-aggroed enemies
                if (!enemy.aggroed) {
                    ctx.fillStyle = 'rgba(150,150,200,0.6)';
                    ctx.font = '8px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('…', ex, ey - s - 7);
                }

                const barW = s * 2;
                const barH = 3;
                const barY = ey - s - 4;
                ctx.fillStyle = '#200000';
                ctx.fillRect(ex - barW / 2, barY, barW, barH);
                ctx.fillStyle = '#dd3333';
                ctx.fillRect(ex - barW / 2, barY, barW * (enemy.health / enemy.maxHealth), barH);
            }

            function renderHUD() {
                if (!player) return;
                const hbX = 20;
                const hbY = 20;
                const hbW = 220;
                const hbH = 18;
                ctx.fillStyle = '#1a0a0a';
                ctx.fillRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4);
                ctx.fillStyle = '#3a1010';
                ctx.fillRect(hbX, hbY, hbW, hbH);
                const hpRatio = player.health / player.maxHealth;
                const hpColor = hpRatio > 0.5 ? '#cc3333' : hpRatio > 0.25 ? '#dd6622' : '#ee1111';
                ctx.fillStyle = hpColor;
                ctx.fillRect(hbX, hbY, hbW * hpRatio, hbH);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`HP: ${Math.ceil(player.health)}/${player.maxHealth}`, hbX + hbW / 2, hbY + 13);

                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`WAVE ${wave}`, W - 20, 28);
                ctx.fillText(`✦ ${tokens}`, W - 20, 48);

                // Minion count for sorcerer
                if (selectedCharacter === 'sorcerer') {
                    const aliveMinions = minions.filter(m => m.health > 0).length;
                    ctx.fillStyle = '#8899bb';
                    ctx.fillText(`☠ ${aliveMinions}`, W - 20, 68);
                }

                const cdY = H - 40;
                ctx.fillStyle = '#222';
                ctx.fillRect(W - 120, cdY, 100, 14);
                ctx.fillStyle = player.primaryCooldown > 0 ? '#664422' : '#88aa44';
                const primCdRatio = player.primaryCooldown > 0 ? 1 - (player.primaryCooldown / getPrimaryCooldown()) : 1;
                ctx.fillRect(W - 120, cdY, 100 * primCdRatio, 14);
                ctx.fillStyle = '#ccc';
                ctx.font = '9px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('PRIMARY [LMB]', W - 70, cdY + 11);

                ctx.fillStyle = '#222';
                ctx.fillRect(W - 120, cdY + 18, 100, 14);
                ctx.fillStyle = player.secondaryCooldown > 0 ? '#664422' : '#aa6644';
                const secCdRatio = player.secondaryCooldown > 0 ? 1 - (player.secondaryCooldown /
                    getSecondaryCooldown()) : 1;
                ctx.fillRect(W - 120, cdY + 18, 100 * secCdRatio, 14);
                ctx.fillStyle = '#ccc';
                ctx.fillText('SECONDARY [RMB]', W - 70, cdY + 29);

                const aliveEnemies = enemies.filter(e => e.health > 0).length;
                ctx.fillStyle = '#999';
                ctx.textAlign = 'left';
                ctx.fillText(`Enemies: ${aliveEnemies}`, 20, H - 20);
            }

            function renderWaveClear() {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 28px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`WAVE ${wave} CLEAR!`, W / 2, H / 2 - 20);
                ctx.fillStyle = '#ddd';
                ctx.font = '16px "Courier New", monospace';
                ctx.fillText('Tokens are flying to you!', W / 2, H / 2 + 15);
                ctx.fillText('Press SPACE or ENTER to enter the shop', W / 2, H / 2 + 45);
            }

            function renderShop() {
                ctx.fillStyle = 'rgba(8,8,16,0.92)';
                ctx.fillRect(0, 0, W, H);

                const ch = characters[selectedCharacter];

                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`⚒ SHOP — After Wave ${wave}`, W / 2, 35);

                ctx.fillStyle = '#ddd';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText(`Tokens: ✦ ${tokens}    |    Character: ${ch.name}`, W / 2, 58);

                const cardW = 200;
                const cardH = 90;
                const gapX = 20;
                const gapY = 15;
                const startX = 30;
                const startY = 80;

                let primSpecLabel, primSpecDesc;
                if (selectedCharacter === 'sorcerer') {
                    primSpecLabel = 'Homing Flames';
                    primSpecDesc = 'Fireballs curve toward enemies';
                } else if (selectedCharacter === 'wizard') {
                    primSpecLabel = 'Mana Leech';
                    primSpecDesc = 'Heal on primary hit';
                } else {
                    primSpecLabel = 'Bleeding Edge';
                    primSpecDesc = 'Bleed DoT on hit';
                }

                const upgrades = [
                    { id: 'prim_dmg', label: `${ch.primary.name} DMG`, desc: '+25% damage/level',
                        icon: '⚔' },
                    { id: 'prim_spd', label: `${ch.primary.name} SPD`, desc: '-18% cooldown/level',
                        icon: '⏱' },
                    { id: 'prim_rng', label: `${ch.primary.name} RNG`, desc: '+22% reach/level',
                        icon: '↔' },
                    { id: 'prim_spec', label: primSpecLabel, desc: primSpecDesc,
                        icon: '✦', prereq: 'prim_dmg' },
                    { id: 'sec_dmg', label: ch.secondary.isSummon ? 'Skeleton Power' : `${ch.secondary.name} DMG`,
                        desc: ch.secondary.isSummon ? '+Skeleton HP & damage' : '+28% damage/level',
                        icon: '💥' },
                    { id: 'sec_spd', label: ch.secondary.isSummon ? 'Rapid Summon' : `${ch.secondary.name} SPD`,
                        desc: '-18% cooldown/level',
                        icon: '⏱' },
                    { id: 'sec_special', label: ch.secondary.specialName, desc: ch.secondary.specialDesc,
                        icon: '★', prereq: 'sec_dmg' },
                    { id: 'sec_aoe', label: ch.secondary.aoeName, desc: ch.secondary.aoeDesc,
                        icon: '⬡', prereq: 'sec_spd' },
                ];

                const shopButtons = [];

                for (let i = 0; i < upgrades.length; i++) {
                    const col = i % 4;
                    const row = Math.floor(i / 4);
                    const cx2 = startX + col * (cardW + gapX);
                    const cy2 = startY + row * (cardH + gapY);

                    const upg = upgrades[i];
                    const level = playerUpgrades[upg.id] || 0;
                    const maxLevel = getUpgradeMaxLevel(upg.id);
                    const cost = getUpgradeCost(upg.id);
                    const canBuy = canBuyUpgrade(upg.id);
                    const isMaxed = level >= maxLevel;
                    const prereqMet = !upg.prereq || (playerUpgrades[upg.prereq] || 0) >= 2;

                    ctx.fillStyle = isMaxed ? '#1a1a1a' : canBuy ? '#1a1a2e' : '#151520';
                    ctx.strokeStyle = isMaxed ? '#444' : canBuy ? '#c9a23b' : '#333';
                    ctx.lineWidth = 2;
                    ctx.fillRect(cx2, cy2, cardW, cardH);
                    ctx.strokeRect(cx2, cy2, cardW, cardH);

                    ctx.fillStyle = '#fff';
                    ctx.font = '20px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(upg.icon, cx2 + 8, cy2 + 28);

                    ctx.fillStyle = isMaxed ? '#666' : '#eee';
                    ctx.font = 'bold 12px "Courier New", monospace';
                    ctx.fillText(upg.label, cx2 + 36, cy2 + 22);

                    ctx.fillStyle = '#aaa';
                    ctx.font = '10px "Courier New", monospace';
                    ctx.fillText(`Lv ${level}/${maxLevel}`, cx2 + 36, cy2 + 38);

                    ctx.fillStyle = '#999';
                    ctx.font = '9px "Courier New", monospace';
                    ctx.fillText(upg.desc, cx2 + 8, cy2 + 56);

                    const btnX = cx2 + cardW - 80;
                    const btnY = cy2 + cardH - 28;
                    const btnW = 72;
                    const btnH = 22;

                    if (isMaxed) {
                        ctx.fillStyle = '#333';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#888';
                        ctx.font = '10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('MAXED', btnX + btnW / 2, btnY + 15);
                    } else if (!prereqMet) {
                        ctx.fillStyle = '#332211';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#996633';
                        ctx.font = '9px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('REQ Lv2', btnX + btnW / 2, btnY + 11);
                        ctx.fillText(`${upg.prereq}`, btnX + btnW / 2, btnY + 21);
                    } else if (!canBuy) {
                        ctx.fillStyle = '#331111';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#cc4444';
                        ctx.font = '10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(`✦${cost}`, btnX + btnW / 2, btnY + 15);
                    } else {
                        ctx.fillStyle = '#2a3a1a';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#aadd66';
                        ctx.font = 'bold 10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(`✦${cost} BUY`, btnX + btnW / 2, btnY + 15);
                        shopButtons.push({
                            x: btnX,
                            y: btnY,
                            w: btnW,
                            h: btnH,
                            id: upg.id,
                        });
                    }
                    ctx.textAlign = 'start';
                }

                // Next Wave button
                const nwX = W / 2 - 90;
                const nwY = H - 55;
                const nwW = 180;
                const nwH = 36;
                ctx.fillStyle = '#2a3a2a';
                ctx.strokeStyle = '#5a8a3a';
                ctx.lineWidth = 2;
                ctx.fillRect(nwX, nwY, nwW, nwH);
                ctx.strokeRect(nwX, nwY, nwW, nwH);
                ctx.fillStyle = '#ccffaa';
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('▶ NEXT WAVE ▶', W / 2, nwY + 25);
                ctx.textAlign = 'start';
                shopButtons.push({ x: nwX, y: nwY, w: nwW, h: nwH, id: 'next_wave' });

                window._shopButtons = shopButtons;
            }

            function renderCharacterSelect() {
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('DARKHOLD ARENA', W / 2, 55);
                ctx.fillStyle = '#888';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('Choose Your Champion', W / 2, 80);

                const charKeys = ['sorcerer', 'wizard', 'knight'];
                const cardW = 240;
                const cardH = 320;
                const totalW = cardW * 3 + 60;
                const startX2 = (W - totalW) / 2;
                const cardY = 110;

                const selectButtons = [];

                for (let i = 0; i < charKeys.length; i++) {
                    const key = charKeys[i];
                    const ch = characters[key];
                    const cx3 = startX2 + i * (cardW + 30);

                    ctx.fillStyle = '#12121e';
                    ctx.strokeStyle = selectedCharacter === key ? '#c9a23b' : '#333';
                    ctx.lineWidth = selectedCharacter === key ? 3 : 1;
                    ctx.fillRect(cx3, cardY, cardW, cardH);
                    ctx.strokeRect(cx3, cardY, cardW, cardH);

                    const previewX = cx3 + cardW / 2;
                    const previewY = cardY + 70;
                    ctx.fillStyle = ch.robeColor;
                    ctx.fillRect(previewX - 18, previewY - 10, 36, 30);
                    ctx.fillStyle = ch.skinColor;
                    ctx.beginPath();
                    ctx.arc(previewX, previewY - 16, 13, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = ch.color;
                    if (key === 'knight') {
                        ctx.fillRect(previewX - 12, previewY - 32, 24, 13);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(previewX, previewY - 38);
                        ctx.lineTo(previewX - 14, previewY - 16);
                        ctx.lineTo(previewX + 14, previewY - 16);
                        ctx.closePath();
                        ctx.fill();
                    }
                    // Draw appropriate weapon
                    if (key === 'sorcerer') {
                        ctx.fillStyle = '#ff8844';
                        ctx.beginPath();
                        ctx.arc(previewX + 20, previewY - 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,120,40,0.35)';
                        ctx.beginPath();
                        ctx.arc(previewX + 20, previewY - 5, 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.strokeStyle = '#d0c8b8';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(previewX, previewY);
                        ctx.lineTo(previewX + 20, previewY - 5);
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 18px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(ch.name, cx3 + cardW / 2, cardY + 120);

                    ctx.fillStyle = '#aaa';
                    ctx.font = '11px "Courier New", monospace';
                    const words = ch.desc.split(' ');
                    let line = '';
                    let lineY = cardY + 145;
                    for (const word of words) {
                        if ((line + ' ' + word).length > 30) {
                            ctx.fillText(line.trim(), cx3 + cardW / 2, lineY);
                            lineY += 16;
                            line = word;
                        } else {
                            line += ' ' + word;
                        }
                    }
                    ctx.fillText(line.trim(), cx3 + cardW / 2, lineY);

                    const statY = lineY + 25;
                    ctx.fillStyle = '#ccc';
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.fillText('PRIMARY', cx3 + cardW / 2, statY);
                    ctx.fillStyle = '#bbb';
                    ctx.font = '10px "Courier New", monospace';
                    ctx.fillText(`${ch.primary.name}: ${ch.primary.damage} dmg`, cx3 + cardW / 2, statY + 16);
                    ctx.fillText(
                        ch.primary.isRanged ? 'Ranged projectile' : 'Melee swing',
                        cx3 + cardW / 2, statY + 30
                    );

                    ctx.fillStyle = '#ccc';
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.fillText('SECONDARY', cx3 + cardW / 2, statY + 52);
                    ctx.fillStyle = '#bbb';
                    ctx.font = '10px "Courier New", monospace';
                    if (ch.secondary.isSummon) {
                        ctx.fillText(`${ch.secondary.name}: summons 2 helpers`, cx3 + cardW / 2, statY + 68);
                        ctx.fillText(`Speed: fast (110) | Cooldown: ${ch.secondary.cooldown}s`, cx3 + cardW / 2,
                            statY + 82);
                    } else if (ch.secondary.isRanged) {
                        ctx.fillText(`${ch.secondary.name}: ${ch.secondary.damage} dmg`, cx3 + cardW / 2, statY + 68);
                        ctx.fillText(`Ranged | Cooldown: ${ch.secondary.cooldown}s`, cx3 + cardW / 2, statY + 82);
                    } else {
                        ctx.fillText(`${ch.secondary.name}: ${ch.secondary.damage} dmg`, cx3 + cardW / 2, statY + 68);
                        ctx.fillText(`Melee AoE | Cooldown: ${ch.secondary.cooldown}s`, cx3 + cardW / 2, statY + 82);
                    }

                    const btnX2 = cx3 + cardW / 2 - 60;
                    const btnY2 = cardY + cardH - 45;
                    ctx.fillStyle = key === selectedCharacter ? '#4a6a2a' : '#2a3a1a';
                    ctx.strokeStyle = key === selectedCharacter ? '#aadd66' : '#555';
                    ctx.lineWidth = 2;
                    ctx.fillRect(btnX2, btnY2, 120, 32);
                    ctx.strokeRect(btnX2, btnY2, 120, 32);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 13px "Courier New", monospace';
                    ctx.fillText(key === selectedCharacter ? '✓ SELECTED' : 'SELECT', cx3 + cardW / 2, btnY2 + 22);

                    selectButtons.push({ x: btnX2, y: btnY2, w: 120, h: 32, key });
                }

                const startBtnX2 = W / 2 - 100;
                const startBtnY2 = cardY + cardH + 25;
                ctx.fillStyle = '#c9a23b';
                ctx.fillRect(startBtnX2, startBtnY2, 200, 44);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 18px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('⚔  ENTER THE ARENA  ⚔', W / 2, startBtnY2 + 30);
                ctx.textAlign = 'start';

                selectButtons.push({ x: startBtnX2, y: startBtnY2, w: 200, h: 44, key: 'start' });
                window._selectButtons = selectButtons;

                ctx.fillStyle = '#666';
                ctx.font = '11px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('WASD/Arrows: Move | Mouse: Aim | LMB: Primary | RMB: Secondary', W / 2, startBtnY2 + 65);
                ctx.textAlign = 'start';
            }

            function renderGameOver() {
                ctx.fillStyle = 'rgba(10,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#cc2222';
                ctx.font = 'bold 36px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('YOU HAVE FALLEN', W / 2, H / 2 - 30);
                ctx.fillStyle = '#ddd';
                ctx.font = '18px "Courier New", monospace';
                ctx.fillText(`Reached Wave ${wave}`, W / 2, H / 2 + 15);
                ctx.fillText(`Tokens collected: ✦ ${tokens}`, W / 2, H / 2 + 40);
                ctx.fillStyle = '#c9a23b';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('Click anywhere to return to character select', W / 2, H / 2 + 75);
                ctx.textAlign = 'start';
            }

            // === EVENT HANDLING ===
            canvas.addEventListener('click', (e) => {
                ensureFocus(e);
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                const cx = (e.clientX - rect.left) * scaleX;
                const cy = (e.clientY - rect.top) * scaleY;

                if (gameState === 'CHARACTER_SELECT' && window._selectButtons) {
                    for (const btn of window._selectButtons) {
                        if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
                            if (btn.key === 'start') {
                                startGame();
                            } else {
                                selectedCharacter = btn.key;
                            }
                            return;
                        }
                    }
                }

                if (gameState === 'SHOP' && window._shopButtons) {
                    for (const btn of window._shopButtons) {
                        if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
                            if (btn.id === 'next_wave') {
                                wave++;
                                generateMap();
                                player.x = Math.floor(MAP_COLS / 2) * TILE + TILE / 2;
                                player.y = Math.floor(MAP_ROWS / 2) * TILE + TILE / 2;
                                player.health = Math.min(player.maxHealth, player.health + 25);
                                player.alive = true;
                                player.invulnTimer = 1.0;
                                player.primaryCooldown = 0;
                                player.secondaryCooldown = 0;
                                minions = [];
                                spawnWave();
                                gameState = 'PLAYING';
                                camera.x = player.x - W / 2;
                                camera.y = player.y - H / 2;
                                canvas.focus({ preventScroll: true });
                            } else if (canBuyUpgrade(btn.id)) {
                                const cost = getUpgradeCost(btn.id);
                                tokens -= cost;
                                playerUpgrades[btn.id] = (playerUpgrades[btn.id] || 0) + 1;
                                if (player) player.health = Math.min(player.maxHealth, player.health + 10);
                            }
                            return;
                        }
                    }
                }

                if (gameState === 'GAME_OVER' && gameOverTimer <= 0) {
                    restartGame();
                }
            });

            // === GAME LOOP ===
            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.2) dt = 0.2;
                if (dt <= 0) dt = 0.016;
                lastTime = timestamp;

                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }

            // === INIT ===
            initUpgrades();
            generateMap();
            camera = { x: WORLD_W / 2 - W / 2, y: WORLD_H / 2 - H / 2 };
            updateMouseWorld();
            updateCamera(0.016);
            requestAnimationFrame(gameLoop);

            console.log('Darkhold Arena ready. Choose your champion!');
            console.log('Sorcerer: Fireball primary + Summon Skeletons secondary (fast, walking skeletons!)');
            console.log('Controls: WASD/Arrows move, Mouse aim, LMB primary, RMB secondary');
            console.log('Enemies will stop and fight your skeletons — skeletons disengage when you move far away.');
        })();
    </script>
</body>
</html>
