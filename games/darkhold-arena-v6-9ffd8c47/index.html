<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkhold Arena - Wave RPG</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #1a1a2e;
            --gold: #c9a23b;
            --text: #c8c8d4;
            --accent: #7b3fa3;
            --danger: #a03030;
            --heal: #3a7b3f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #2a2a3a;
            box-shadow: 0 0 40px rgba(100, 40, 160, 0.3), 0 0 80px rgba(0, 0, 0, 0.6);
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="game" tabindex="0"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');

            // === CANVAS SETUP ===
            const W = 960;
            const H = 640;
            canvas.width = W;
            canvas.height = H;
            ctx.imageSmoothingEnabled = false;

            function ensureFocus(e) {
                if (document.activeElement !== canvas) {
                    canvas.focus({ preventScroll: true });
                }
            }
            canvas.focus({ preventScroll: true });

            // === CONSTANTS ===
            const TILE = 40;
            const MAP_COLS = 35;
            const MAP_ROWS = 28;
            const WORLD_W = MAP_COLS * TILE;
            const WORLD_H = MAP_ROWS * TILE;
            const PLAYER_SPEED = 180;
            const PLAYER_SIZE = 16;
            const TOKEN_MAGNET_RANGE = 60;
            const INVULN_TIME = 0.6;
            const SWING_DURATION = 0.16;
            const MAX_MINIONS = 8;
            const MINION_AGGRO_RANGE = 320;
            const ENEMY_AGGRO_RANGE = 340;
            const MINION_DISENGAGE_DIST = 240; // 1/4 screen width — minions break off & follow player

            // === GAME STATE ===
            let gameState = 'CHARACTER_SELECT';
            let wave = 1;
            let tokens = 0;
            let waveClearTimer = 0;
            let gameOverTimer = 0;
            let screenShake = 0;
            let shakeX = 0;
            let shakeY = 0;

            // === CHARACTER DATA ===
            const characters = {
                sorcerer: {
                    name: 'Sorcerer',
                    color: '#8b3fb5',
                    robeColor: '#5c1d8a',
                    skinColor: '#e8c9a0',
                    desc: 'Hurls fireballs & summons skeletal minions. A master of dark arts.',
                    primary: {
                        name: 'Fireball',
                        damage: 22,
                        cooldown: 0.85,
                        speed: 300,
                        range: 450,
                        color: '#ff6622',
                        size: 6,
                        isRanged: true,
                        arcAngle: 0,
                    },
                    secondary: {
                        name: 'Summon Skeleton',
                        cooldown: 5.0,
                        isRanged: false,
                        isSummon: true,
                        minionHealth: 30,
                        minionDamage: 7,
                        minionSpeed: 110,
                        minionSize: 12,
                        minionColor: '#e8dcc8',
                        minionAttackRange: 22,
                        minionAttackCooldown: 0.9,
                        specialName: 'Twin Summon',
                        specialDesc: 'Summon two skeletons at once',
                        aoeName: 'Bone Archers',
                        aoeDesc: 'Skeletons gain ranged attacks',
                    },
                },
                wizard: {
                    name: 'Wizard',
                    color: '#3b7fcf',
                    robeColor: '#1a4a7a',
                    skinColor: '#f0dbb8',
                    desc: 'Quick wand strikes & piercing magic bolts. High attack speed.',
                    primary: {
                        name: 'Wand Strike',
                        damage: 13,
                        cooldown: 0.35,
                        range: 38,
                        arcAngle: 0.7,
                        color: '#7cb8f0',
                        isRanged: false,
                    },
                    secondary: {
                        name: 'Magic Bolt',
                        damage: 22,
                        cooldown: 1.0,
                        speed: 420,
                        range: 550,
                        color: '#44ccff',
                        size: 5,
                        isRanged: true,
                        isSummon: false,
                        specialName: 'Piercing Bolts',
                        specialDesc: 'Bolts pass through enemies',
                        aoeName: 'Chain Lightning',
                        aoeDesc: 'Bolts bounce to nearby foes',
                    },
                },
                knight: {
                    name: 'Knight',
                    color: '#b0b8c0',
                    robeColor: '#5a5d62',
                    skinColor: '#e0c8a8',
                    desc: 'Sword & heavy swing. Durable melee powerhouse.',
                    primary: {
                        name: 'Sword Slash',
                        damage: 24,
                        cooldown: 0.5,
                        range: 48,
                        arcAngle: 0.9,
                        color: '#d0d8e0',
                        isRanged: false,
                    },
                    secondary: {
                        name: 'Heavy Swing',
                        damage: 50,
                        cooldown: 2.0,
                        range: 58,
                        arcAngle: 1.3,
                        color: '#ffe080',
                        isRanged: false,
                        isSummon: false,
                        specialName: 'Shockwave',
                        specialDesc: 'Swing sends out a ground shockwave',
                        aoeName: 'Execute',
                        aoeDesc: 'Bonus damage vs low-HP enemies',
                    },
                },
            };

            let selectedCharacter = 'sorcerer';
            let playerUpgrades = {};
            let player = null;
            let enemies = [];
            let projectiles = [];
            let particles = [];
            let droppedTokens = [];
            let damageNumbers = [];
            let minions = [];

            // === MAP ===
            let mapTiles = [];

            function generateMap() {
                mapTiles = [];
                for (let y = 0; y < MAP_ROWS; y++) {
                    mapTiles[y] = [];
                    for (let x = 0; x < MAP_COLS; x++) {
                        mapTiles[y][x] = 0;
                    }
                }
                for (let x = 0; x < MAP_COLS; x++) {
                    mapTiles[0][x] = 1;
                    mapTiles[MAP_ROWS - 1][x] = 1;
                }
                for (let y = 0; y < MAP_ROWS; y++) {
                    mapTiles[y][0] = 1;
                    mapTiles[y][MAP_COLS - 1] = 1;
                }
                const rng = mulberry32(wave * 137 + 42);
                const numClusters = 10 + Math.floor(rng() * 8);
                for (let c = 0; c < numClusters; c++) {
                    const cx = 3 + Math.floor(rng() * (MAP_COLS - 6));
                    const cy = 3 + Math.floor(rng() * (MAP_ROWS - 6));
                    const size = 2 + Math.floor(rng() * 4);
                    for (let dy = -size; dy <= size; dy++) {
                        for (let dx = -size; dx <= size; dx++) {
                            if (Math.abs(dx) + Math.abs(dy) <= size + rng() * 1.5) {
                                const tx = cx + dx;
                                const ty = cy + dy;
                                if (tx > 0 && tx < MAP_COLS - 1 && ty > 0 && ty < MAP_ROWS - 1) {
                                    if (rng() < 0.65) mapTiles[ty][tx] = 1;
                                }
                            }
                        }
                    }
                }
                const pcx = Math.floor(MAP_COLS / 2);
                const pcy = Math.floor(MAP_ROWS / 2);
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const tx = pcx + dx;
                        const ty = pcy + dy;
                        if (tx >= 0 && tx < MAP_COLS && ty >= 0 && ty < MAP_ROWS) {
                            mapTiles[ty][tx] = 0;
                        }
                    }
                }
                ensureMapConnectivity();
            }

            function ensureMapConnectivity() {
                const startTX = Math.floor(MAP_COLS / 2);
                const startTY = Math.floor(MAP_ROWS / 2);
                const visited = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(false));
                const queue = [{ x: startTX, y: startTY }];
                visited[startTY][startTX] = true;
                while (queue.length > 0) {
                    const { x, y } = queue.shift();
                    for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                        const nx = x + dx,
                            ny = y + dy;
                        if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS &&
                            !visited[ny][nx] && mapTiles[ny][nx] === 0) {
                            visited[ny][nx] = true;
                            queue.push({ x: nx, y: ny });
                        }
                    }
                }
                const unreachable = [];
                for (let y = 0; y < MAP_ROWS; y++) {
                    for (let x = 0; x < MAP_COLS; x++) {
                        if (mapTiles[y][x] === 0 && !visited[y][x]) {
                            unreachable.push({ x, y });
                        }
                    }
                }
                if (unreachable.length === 0) return;
                const regionId = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(-1));
                let nextRegion = 0;
                for (const tile of unreachable) {
                    if (regionId[tile.y][tile.x] !== -1) continue;
                    const region = nextRegion++;
                    const rQueue = [tile];
                    regionId[tile.y][tile.x] = region;
                    while (rQueue.length > 0) {
                        const { x, y } = rQueue.shift();
                        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                            const nx = x + dx,
                                ny = y + dy;
                            if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS &&
                                mapTiles[ny][nx] === 0 && regionId[ny][nx] === -1) {
                                regionId[ny][nx] = region;
                                rQueue.push({ x: nx, y: ny });
                            }
                        }
                    }
                }
                for (let r = 0; r < nextRegion; r++) {
                    let bestDist = Infinity;
                    let bestWallX = -1,
                        bestWallY = -1;
                    for (let y = 1; y < MAP_ROWS - 1; y++) {
                        for (let x = 1; x < MAP_COLS - 1; x++) {
                            if (mapTiles[y][x] !== 1) continue;
                            let bordersReachable = false;
                            let bordersRegion = false;
                            for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                                const nx = x + dx,
                                    ny = y + dy;
                                if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS) {
                                    if (mapTiles[ny][nx] === 0 && visited[ny][nx]) bordersReachable = true;
                                    if (regionId[ny][nx] === r) bordersRegion = true;
                                }
                            }
                            if (bordersReachable && bordersRegion) {
                                const dist = Math.abs(x - startTX) + Math.abs(y - startTY);
                                if (dist < bestDist) {
                                    bestDist = dist;
                                    bestWallX = x;
                                    bestWallY = y;
                                }
                            }
                        }
                    }
                    if (bestWallX >= 0) {
                        mapTiles[bestWallY][bestWallX] = 0;
                        visited[bestWallY][bestWallX] = true;
                        const fq = [{ x: bestWallX, y: bestWallY }];
                        while (fq.length > 0) {
                            const { x, y } = fq.shift();
                            for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                                const nx = x + dx,
                                    ny = y + dy;
                                if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS &&
                                    !visited[ny][nx] && mapTiles[ny][nx] === 0) {
                                    visited[ny][nx] = true;
                                    fq.push({ x: nx, y: ny });
                                }
                            }
                        }
                    }
                }
            }

            function mulberry32(a) {
                return function() {
                    a |= 0;
                    a = a + 0x6D2B79F5 | 0;
                    let t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            function isWall(wx, wy) {
                const tx = Math.floor(wx / TILE);
                const ty = Math.floor(wy / TILE);
                if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) return true;
                return mapTiles[ty][tx] === 1;
            }

            function isWallCircle(cx, cy, r) {
                const steps = 8;
                for (let i = 0; i < steps; i++) {
                    const a = (i / steps) * Math.PI * 2;
                    if (isWall(cx + Math.cos(a) * r, cy + Math.sin(a) * r)) return true;
                }
                return false;
            }

            // === INIT UPGRADES ===
            function initUpgrades() {
                playerUpgrades = {
                    prim_dmg: 0,
                    prim_spd: 0,
                    prim_rng: 0,
                    prim_spec: 0,
                    sec_dmg: 0,
                    sec_spd: 0,
                    sec_special: 0,
                    sec_aoe: 0,
                };
            }

            function getUpgradeCost(upgradeId) {
                const level = playerUpgrades[upgradeId] || 0;
                const baseCosts = {
                    prim_dmg: [3, 6, 10, 15, 22],
                    prim_spd: [3, 6, 10, 15],
                    prim_rng: [4, 8, 14, 20],
                    prim_spec: [8, 14, 22],
                    sec_dmg: [4, 7, 12, 18, 25],
                    sec_spd: [4, 8, 14, 22],
                    sec_special: [8, 15, 25],
                    sec_aoe: [10, 18, 28],
                };
                const costs = baseCosts[upgradeId] || [3, 6, 10, 15];
                if (level >= costs.length) return Infinity;
                return costs[level];
            }

            function getUpgradeMaxLevel(upgradeId) {
                const maxes = {
                    prim_dmg: 5,
                    prim_spd: 4,
                    prim_rng: 4,
                    prim_spec: 3,
                    sec_dmg: 5,
                    sec_spd: 4,
                    sec_special: 3,
                    sec_aoe: 3,
                };
                return maxes[upgradeId] || 3;
            }

            function canBuyUpgrade(upgradeId) {
                const level = playerUpgrades[upgradeId] || 0;
                if (level >= getUpgradeMaxLevel(upgradeId)) return false;
                if (tokens < getUpgradeCost(upgradeId)) return false;
                if (upgradeId === 'prim_spec' && (playerUpgrades['prim_dmg'] || 0) < 2) return false;
                if (upgradeId === 'sec_special' && (playerUpgrades['sec_dmg'] || 0) < 2) return false;
                if (upgradeId === 'sec_aoe' && (playerUpgrades['sec_spd'] || 0) < 2) return false;
                return true;
            }

            function getPlayerStat(base, upgradeId, perLevel) {
                return base * (1 + (playerUpgrades[upgradeId] || 0) * perLevel);
            }

            // === PLAYER ===
            function createPlayer() {
                const cx = Math.floor(MAP_COLS / 2) * TILE + TILE / 2;
                const cy = Math.floor(MAP_ROWS / 2) * TILE + TILE / 2;
                return {
                    x: cx,
                    y: cy,
                    vx: 0,
                    vy: 0,
                    angle: 0,
                    health: 100,
                    maxHealth: 100,
                    primaryCooldown: 0,
                    secondaryCooldown: 0,
                    invulnTimer: 0,
                    alive: true,
                    attackFlash: 0,
                    secondaryFlash: 0,
                    attackSwingTimer: 0,
                    attackSwingArc: 0,
                };
            }

            function getPrimaryDamage() {
                return getPlayerStat(characters[selectedCharacter].primary.damage, 'prim_dmg', 0.25);
            }

            function getPrimaryCooldown() {
                return getPlayerStat(characters[selectedCharacter].primary.cooldown, 'prim_spd', -0.18);
            }

            function getPrimaryRange() {
                return getPlayerStat(characters[selectedCharacter].primary.range, 'prim_rng', 0.22);
            }

            function getPrimarySpecLevel() {
                return playerUpgrades['prim_spec'] || 0;
            }

            function getPrimarySpecChance() {
                return getPrimarySpecLevel() * 0.15;
            }

            function getSecondaryDamage() {
                return getPlayerStat(characters[selectedCharacter].secondary.damage || 10, 'sec_dmg', 0.28);
            }

            function getSecondaryCooldown() {
                return getPlayerStat(characters[selectedCharacter].secondary.cooldown, 'sec_spd', -0.18);
            }

            function getSecondarySpecialLevel() {
                return playerUpgrades['sec_special'] || 0;
            }

            function getSecondaryAoeLevel() {
                return playerUpgrades['sec_aoe'] || 0;
            }

            function getMinionHealth() {
                const ch = characters[selectedCharacter].secondary;
                return Math.floor((ch.minionHealth || 30) * (1 + (playerUpgrades['sec_dmg'] || 0) * 0.3));
            }

            function getMinionDamage() {
                const ch = characters[selectedCharacter].secondary;
                return Math.floor((ch.minionDamage || 7) * (1 + (playerUpgrades['sec_dmg'] || 0) * 0.25));
            }

            // === ENEMY TYPES ===
            const enemyTypes = {
                skeleton: {
                    name: 'Skeleton',
                    baseHP: 35,
                    baseDamage: 8,
                    speed: 70,
                    size: 13,
                    color: '#e8e0d0',
                    xpValue: 1,
                    tokenDrop: 1,
                },
                ghost: {
                    name: 'Wraith',
                    baseHP: 25,
                    baseDamage: 14,
                    speed: 100,
                    size: 11,
                    color: '#8899cc',
                    xpValue: 2,
                    tokenDrop: 2,
                },
                demon: {
                    name: 'Demon',
                    baseHP: 70,
                    baseDamage: 18,
                    speed: 55,
                    size: 16,
                    color: '#cc3333',
                    xpValue: 3,
                    tokenDrop: 3,
                },
                brute: {
                    name: 'Brute',
                    baseHP: 100,
                    baseDamage: 22,
                    speed: 40,
                    size: 19,
                    color: '#664422',
                    xpValue: 4,
                    tokenDrop: 3,
                },
            };

            function spawnEnemy(typeKey, minDistFromPlayer) {
                const type = enemyTypes[typeKey];
                let ex, ey;
                let attempts = 0;
                do {
                    ex = TILE * 1.5 + Math.random() * (WORLD_W - TILE * 3);
                    ey = TILE * 1.5 + Math.random() * (WORLD_H - TILE * 3);
                    attempts++;
                } while (
                    attempts < 60 &&
                    (isWallCircle(ex, ey, type.size + 4) ||
                        (player && Math.hypot(ex - player.x, ey - player.y) < minDistFromPlayer))
                );
                const hpMult = 1 + (wave - 1) * 0.35;
                const dmgMult = 1 + (wave - 1) * 0.22;
                return {
                    x: ex,
                    y: ey,
                    type: typeKey,
                    health: Math.floor(type.baseHP * hpMult),
                    maxHealth: Math.floor(type.baseHP * hpMult),
                    damage: Math.floor(type.baseDamage * dmgMult),
                    speed: type.speed * (1 + (wave - 1) * 0.06),
                    size: type.size,
                    color: type.color,
                    tokenDrop: type.tokenDrop,
                    stunTimer: 0,
                    knockbackX: 0,
                    knockbackY: 0,
                    hitFlash: 0,
                    aggroed: false,
                    idleAngle: Math.random() * Math.PI * 2,
                    idleTimer: 0,
                };
            }

            function spawnWave() {
                enemies = [];
                projectiles = [];
                particles = [];
                droppedTokens = [];
                damageNumbers = [];
                minions = [];
                const minDist = 250;
                const spawnCounts = getWaveSpawns();
                for (const [typeKey, count] of Object.entries(spawnCounts)) {
                    for (let i = 0; i < count; i++) {
                        enemies.push(spawnEnemy(typeKey, minDist));
                    }
                }
            }

            function getWaveSpawns() {
                const counts = { skeleton: 0, ghost: 0, demon: 0, brute: 0 };
                counts.skeleton = 4 + Math.floor(wave * 1.6);
                if (wave >= 2) counts.ghost = 1 + Math.floor((wave - 1) * 1.2);
                if (wave >= 4) counts.demon = Math.floor((wave - 3) * 0.9);
                if (wave >= 7) counts.brute = Math.floor((wave - 6) * 0.7);
                const total = Object.values(counts).reduce((a, b) => a + b, 0);
                if (total > 35) {
                    const scale = 35 / total;
                    for (const k of Object.keys(counts)) counts[k] = Math.floor(counts[k] * scale);
                }
                return counts;
            }

            // === PROJECTILES ===
            function spawnProjectile(x, y, angle, speed, damage, color, size, isRanged, pierceCount, homingStrength,
                aoeRadius, owner) {
                return {
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    angle,
                    speed,
                    damage,
                    color,
                    size,
                    isRanged,
                    rangeRemaining: isRanged ? (characters[selectedCharacter].primary.range || 500) : 999,
                    pierceCount: pierceCount || 0,
                    homingStrength: homingStrength || 0,
                    aoeRadius: aoeRadius || 0,
                    owner: owner || 'player',
                    alive: true,
                    trail: [],
                };
            }

            // === PARTICLES ===
            function spawnParticles(x, y, count, color, speed, life) {
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const s = speed * (0.4 + Math.random() * 0.6);
                    particles.push({
                        x,
                        y,
                        vx: Math.cos(a) * s,
                        vy: Math.sin(a) * s,
                        life,
                        maxLife: life,
                        color,
                        size: 1.5 + Math.random() * 3.5,
                    });
                }
            }

            function spawnDamageNumber(x, y, amount, color) {
                damageNumbers.push({
                    x: x + (Math.random() - 0.5) * 16,
                    y: y - 8,
                    text: Math.round(amount).toString(),
                    life: 0.8,
                    maxLife: 0.8,
                    color,
                });
            }

            // === INPUT ===
            const keys = {};
            let mouseX = W / 2;
            let mouseY = H / 2;
            let mouseWorldX = 0;
            let mouseWorldY = 0;
            let mouseDown = { left: false, right: false };
            let mouseClicked = { left: false, right: false };

            canvas.addEventListener('mousemove', (e) => {
                ensureFocus(e);
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                mouseX = (e.clientX - rect.left) * scaleX;
                mouseY = (e.clientY - rect.top) * scaleY;
            });

            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                ensureFocus(e);
                if (e.button === 0) { mouseDown.left = true;
                    mouseClicked.left = true; }
                if (e.button === 2) { mouseDown.right = true;
                    mouseClicked.right = true; }
            });

            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0) mouseDown.left = false;
                if (e.button === 2) mouseDown.right = false;
            });

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === ' ' || e.key === 'Enter') {
                    if (gameState === 'WAVE_CLEAR') {
                        gameState = 'SHOP';
                        waveClearTimer = 0;
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                ensureFocus(e);
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
                mouseY = (e.touches[0].clientY - rect.top) * scaleY;
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                ensureFocus(e);
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
                mouseY = (e.touches[0].clientY - rect.top) * scaleY;
                mouseDown.left = true;
                mouseClicked.left = true;
            });
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                mouseDown.left = false;
            });

            // === CAMERA ===
            let camera = { x: 0, y: 0 };

            function updateCamera(dt) {
                if (!player) return;
                const targetX = player.x - W / 2;
                const targetY = player.y - H / 2;
                const lerpFactor = 1 - Math.exp(-8 * dt);
                camera.x += (targetX - camera.x) * lerpFactor;
                camera.y += (targetY - camera.y) * lerpFactor;
                camera.x = Math.max(0, Math.min(WORLD_W - W, camera.x));
                camera.y = Math.max(0, Math.min(WORLD_H - H, camera.y));
                if (WORLD_W <= W) camera.x = (WORLD_W - W) / 2;
                if (WORLD_H <= H) camera.y = (WORLD_H - H) / 2;
            }

            function screenX(wx) { return wx - camera.x; }

            function screenY(wy) { return wy - camera.y; }

            function updateMouseWorld() {
                mouseWorldX = mouseX + camera.x;
                mouseWorldY = mouseY + camera.y;
            }

            // === COLLISION ===
            function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
                const closestX = Math.max(rx, Math.min(cx, rx + rw));
                const closestY = Math.max(ry, Math.min(cy, ry + rh));
                const dx = cx - closestX;
                const dy = cy - closestY;
                return (dx * dx + dy * dy) < (cr * cr);
            }

            function resolveWallCollision(entity, radius) {
                const tileMinX = Math.floor((entity.x - radius) / TILE);
                const tileMaxX = Math.floor((entity.x + radius) / TILE);
                const tileMinY = Math.floor((entity.y - radius) / TILE);
                const tileMaxY = Math.floor((entity.y + radius) / TILE);
                for (let ty = tileMinY; ty <= tileMaxY; ty++) {
                    for (let tx = tileMinX; tx <= tileMaxX; tx++) {
                        if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) continue;
                        if (mapTiles[ty][tx] !== 1) continue;
                        const wx = tx * TILE;
                        const wy = ty * TILE;
                        if (rectCircleCollision(wx, wy, TILE, TILE, entity.x, entity.y, radius)) {
                            const cx2 = wx + TILE / 2;
                            const cy2 = wy + TILE / 2;
                            const dx2 = entity.x - cx2;
                            const dy2 = entity.y - cy2;
                            const dist = Math.hypot(dx2, dy2);
                            if (dist < 0.001) continue;
                            const overlap = radius + TILE * 0.707 - dist;
                            if (overlap > 0) {
                                const nx = dx2 / dist;
                                const ny = dy2 / dist;
                                entity.x += nx * overlap;
                                entity.y += ny * overlap;
                            }
                        }
                    }
                }
                entity.x = Math.max(radius, Math.min(WORLD_W - radius, entity.x));
                entity.y = Math.max(radius, Math.min(WORLD_H - radius, entity.y));
            }

            // === GAME LOGIC ===
            function startGame() {
                initUpgrades();
                generateMap();
                player = createPlayer();
                wave = 1;
                tokens = 0;
                enemies = [];
                projectiles = [];
                particles = [];
                droppedTokens = [];
                damageNumbers = [];
                minions = [];
                camera = { x: player.x - W / 2, y: player.y - H / 2 };
                updateCamera(0.016);
                spawnWave();
                gameState = 'PLAYING';
                screenShake = 0;
                canvas.focus({ preventScroll: true });
            }

            function restartGame() {
                gameState = 'CHARACTER_SELECT';
                wave = 1;
                tokens = 0;
                player = null;
                enemies = [];
                projectiles = [];
                particles = [];
                droppedTokens = [];
                damageNumbers = [];
                minions = [];
                screenShake = 0;
            }

            function damagePlayer(amount) {
                if (!player || !player.alive) return;
                if (player.invulnTimer > 0) return;
                player.health -= amount;
                player.invulnTimer = INVULN_TIME;
                screenShake = Math.max(screenShake, 4);
                spawnParticles(player.x, player.y, 6, '#ff4444', 80, 0.3);
                spawnDamageNumber(player.x, player.y, amount, '#ff4444');
                if (player.health <= 0) {
                    player.health = 0;
                    player.alive = false;
                    spawnParticles(player.x, player.y, 25, '#ff2222', 150, 0.7);
                    gameState = 'GAME_OVER';
                    gameOverTimer = 1.5;
                }
            }

            function playerPrimaryAttack() {
                if (!player || !player.alive || player.primaryCooldown > 0) return;
                const ch = characters[selectedCharacter];

                if (ch.primary.isRanged) {
                    // Ranged primary (Sorcerer fireball)
                    player.primaryCooldown = getPrimaryCooldown();
                    player.attackFlash = 0.12;
                    const dmg = getPrimaryDamage();
                    const range = getPrimaryRange();
                    const specLvl = getPrimarySpecLevel();
                    const homing = specLvl * 0.05;
                    const proj = spawnProjectile(
                        player.x + Math.cos(player.angle) * 16,
                        player.y + Math.sin(player.angle) * 16,
                        player.angle, ch.primary.speed, dmg, ch.primary.color, ch.primary.size,
                        true, 0, homing, 0, 'player'
                    );
                    proj.rangeRemaining = range;
                    projectiles.push(proj);
                    spawnParticles(proj.x, proj.y, 5, ch.primary.color, 40, 0.25);
                    return;
                }

                // Melee primary (Wizard, Knight)
                player.primaryCooldown = getPrimaryCooldown();
                const range = getPrimaryRange();
                const dmg = getPrimaryDamage();
                const arc = ch.primary.arcAngle;
                const halfArc = arc / 2;
                player.attackFlash = 0.12;
                player.attackSwingTimer = SWING_DURATION;
                player.attackSwingArc = arc;
                spawnParticles(player.x + Math.cos(player.angle) * range * 0.5, player.y + Math.sin(player.angle) *
                    range * 0.5, 5, ch.primary.color, 60, 0.2);
                let hitAny = false;
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const dx = enemy.x - player.x;
                    const dy = enemy.y - player.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < range + enemy.size) {
                        const angleToEnemy = Math.atan2(dy, dx);
                        let diff = angleToEnemy - player.angle;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        if (Math.abs(diff) <= halfArc) {
                            hitAny = true;
                            damageEnemy(enemy, dmg, player.angle);
                            if (Math.random() < getPrimarySpecChance()) {
                                enemy.stunTimer = 0.6;
                                spawnParticles(enemy.x, enemy.y, 4, '#ffff88', 40, 0.3);
                            }
                        }
                    }
                }
                if (hitAny) {
                    screenShake = Math.max(screenShake, 1.5);
                }
            }

            function spawnMinion(x, y) {
                const ch = characters[selectedCharacter].secondary;
                const aoeLvl = getSecondaryAoeLevel();
                return {
                    x: x,
                    y: y,
                    health: getMinionHealth(),
                    maxHealth: getMinionHealth(),
                    damage: getMinionDamage(),
                    speed: ch.minionSpeed || 110,
                    size: ch.minionSize || 12,
                    color: ch.minionColor || '#e8dcc8',
                    attackRange: (ch.minionAttackRange || 22),
                    attackCooldown: 0,
                    attackCooldownMax: (ch.minionAttackCooldown || 0.9),
                    isRanged: aoeLvl > 0,
                    rangedRange: 180 + aoeLvl * 30,
                    rangedSpeed: 200,
                    rangedCooldownMax: 1.5,
                    angle: Math.random() * Math.PI * 2,
                    hitFlash: 0,
                    knockbackX: 0,
                    knockbackY: 0,
                    damageCooldown: 0,
                    walkTimer: Math.random() * Math.PI * 2,
                    isMoving: false,
                };
            }

            function playerSecondaryAttack() {
                if (!player || !player.alive || player.secondaryCooldown > 0) return;
                const ch = characters[selectedCharacter];
                player.secondaryCooldown = getSecondaryCooldown();
                player.secondaryFlash = 0.15;

                if (ch.secondary.isSummon) {
                    // Summon skeleton(s) — base is 2, increased by spec level
                    const specLvl = getSecondarySpecialLevel();
                    const count = 2 + specLvl;
                    const aliveCount = minions.filter(m => m.health > 0).length;
                    const spawnCount = Math.min(count, MAX_MINIONS - aliveCount);
                    for (let i = 0; i < spawnCount; i++) {
                        const offsetAngle = player.angle + Math.PI + (i - (spawnCount - 1) / 2) * 0.5;
                        const sx = player.x + Math.cos(offsetAngle) * 28;
                        const sy = player.y + Math.sin(offsetAngle) * 28;
                        if (!isWallCircle(sx, sy, 8)) {
                            minions.push(spawnMinion(sx, sy));
                            spawnParticles(sx, sy, 6, '#c8e0d0', 50, 0.4);
                        } else {
                            minions.push(spawnMinion(player.x, player.y));
                            spawnParticles(player.x, player.y, 6, '#c8e0d0', 50, 0.4);
                        }
                    }
                    spawnParticles(player.x, player.y, 10, '#8b9f8b', 60, 0.5);
                    return;
                }

                const dmg = getSecondaryDamage();
                const specLvl = getSecondarySpecialLevel();
                const aoeLvl = getSecondaryAoeLevel();

                if (ch.secondary.isRanged) {
                    // Ranged secondary (Wizard)
                    const speed = ch.secondary.speed;
                    const homing = 0;
                    const aoeRadius = aoeLvl * 38;
                    const proj = spawnProjectile(
                        player.x + Math.cos(player.angle) * 18,
                        player.y + Math.sin(player.angle) * 18,
                        player.angle, speed, dmg, ch.secondary.color, ch.secondary.size,
                        true, (selectedCharacter === 'wizard' ? specLvl : 0), homing, aoeRadius, 'player'
                    );
                    projectiles.push(proj);
                    spawnParticles(proj.x, proj.y, 5, ch.secondary.color, 40, 0.25);
                } else {
                    // Knight heavy swing - melee AoE
                    const range2 = getPlayerStat(ch.secondary.range, 'sec_spd', -0.04);
                    const arc = ch.secondary.arcAngle;
                    const halfArc = arc / 2;
                    player.attackSwingTimer = SWING_DURATION * 1.3;
                    player.attackSwingArc = arc;
                    spawnParticles(player.x, player.y, 8, '#ffe080', 100, 0.3);
                    let hitAny = false;
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const dx = enemy.x - player.x;
                        const dy = enemy.y - player.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < range2 + enemy.size) {
                            const angleToEnemy = Math.atan2(dy, dx);
                            let diff = angleToEnemy - player.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            if (Math.abs(diff) <= halfArc) {
                                hitAny = true;
                                let finalDmg = dmg;
                                if (aoeLvl > 0 && enemy.health / enemy.maxHealth < 0.3) {
                                    finalDmg *= (1 + aoeLvl * 0.4);
                                }
                                damageEnemy(enemy, finalDmg, player.angle);
                                enemy.knockbackX += Math.cos(player.angle) * 80;
                                enemy.knockbackY += Math.sin(player.angle) * 80;
                            }
                        }
                    }
                    if (hitAny) screenShake = Math.max(screenShake, 3);
                    if (specLvl > 0) {
                        const shockProj = spawnProjectile(
                            player.x + Math.cos(player.angle) * 10,
                            player.y + Math.sin(player.angle) * 10,
                            player.angle, 200, dmg * 0.7, '#ffe8a0', 14,
                            true, 0, 0, specLvl * 30, 'player'
                        );
                        shockProj.rangeRemaining = 180 + specLvl * 50;
                        projectiles.push(shockProj);
                    }
                }
            }

            function damageEnemy(enemy, amount, angle) {
                enemy.health -= amount;
                enemy.hitFlash = 0.08;
                enemy.knockbackX += Math.cos(angle) * 30;
                enemy.knockbackY += Math.sin(angle) * 30;
                spawnDamageNumber(enemy.x, enemy.y, amount, '#ffffff');
                spawnParticles(enemy.x, enemy.y, 3, enemy.color, 50, 0.2);
                // Being hit also aggroes the enemy
                enemy.aggroed = true;
                if (enemy.health <= 0) {
                    killEnemy(enemy);
                }
            }

            function killEnemy(enemy) {
                enemy.health = 0;
                spawnParticles(enemy.x, enemy.y, 12, enemy.color, 120, 0.5);
                const drops = enemy.tokenDrop;
                for (let i = 0; i < drops; i++) {
                    droppedTokens.push({
                        x: enemy.x + (Math.random() - 0.5) * 20,
                        y: enemy.y + (Math.random() - 0.5) * 20,
                        life: 12,
                        maxLife: 12,
                        collected: false,
                        flyingToPlayer: false,
                        flyStartX: 0,
                        flyStartY: 0,
                        flyProgress: 0,
                    });
                }
            }

            function collectToken(token) {
                token.collected = true;
                tokens++;
                spawnParticles(token.x, token.y, 4, '#ffcc00', 30, 0.3);
            }

            function startTokenFlyToPlayer() {
                if (!player || !player.alive) return;
                for (const token of droppedTokens) {
                    if (!token.collected && !token.flyingToPlayer) {
                        token.flyingToPlayer = true;
                        token.flyStartX = token.x;
                        token.flyStartY = token.y;
                        token.flyProgress = 0;
                        token.flyTargetX = player.x;
                        token.flyTargetY = player.y;
                    }
                }
            }

            function update(dt) {
                if (gameState === 'CHARACTER_SELECT' || gameState === 'SHOP') {
                    updateMouseWorld();
                    return;
                }
                if (gameState === 'GAME_OVER') {
                    gameOverTimer -= dt;
                    if (gameOverTimer <= 0 && mouseClicked.left) {
                        restartGame();
                    }
                    updateMouseWorld();
                    updateParticles(dt);
                    updateDamageNumbers(dt);
                    updateDroppedTokens(dt);
                    return;
                }
                if (gameState === 'WAVE_CLEAR') {
                    waveClearTimer -= dt;
                    updateParticles(dt);
                    updateDamageNumbers(dt);
                    updateDroppedTokens(dt);
                    updateMinions(dt);
                    if (waveClearTimer <= 0) {
                        gameState = 'SHOP';
                    }
                    updateMouseWorld();
                    return;
                }

                const dtClamped = Math.min(dt, 0.1);

                updateMouseWorld();
                updatePlayer(dtClamped);
                updateEnemies(dtClamped);
                updateMinions(dtClamped);
                updateProjectiles(dtClamped);
                updateParticles(dtClamped);
                updateDamageNumbers(dtClamped);
                updateDroppedTokens(dtClamped);
                updateCamera(dtClamped);

                if (screenShake > 0) {
                    screenShake = Math.max(0, screenShake - dt * 8);
                    shakeX = (Math.random() - 0.5) * screenShake * 2;
                    shakeY = (Math.random() - 0.5) * screenShake * 2;
                } else {
                    shakeX = 0;
                    shakeY = 0;
                }

                if (enemies.length > 0 && enemies.every(e => e.health <= 0)) {
                    enemies = [];
                    startTokenFlyToPlayer();
                    gameState = 'WAVE_CLEAR';
                    waveClearTimer = 0.8;
                }

                mouseClicked.left = false;
                mouseClicked.right = false;
            }

            function updatePlayer(dt) {
                if (!player || !player.alive) return;
                let mx = 0,
                    my = 0;
                if (keys['w'] || keys['arrowup']) my -= 1;
                if (keys['s'] || keys['arrowdown']) my += 1;
                if (keys['a'] || keys['arrowleft']) mx -= 1;
                if (keys['d'] || keys['arrowright']) mx += 1;
                if (mx !== 0 || my !== 0) {
                    const len = Math.hypot(mx, my);
                    mx /= len;
                    my /= len;
                }
                player.x += mx * PLAYER_SPEED * dt;
                player.y += my * PLAYER_SPEED * dt;
                resolveWallCollision(player, PLAYER_SIZE);

                player.angle = Math.atan2(mouseWorldY - player.y, mouseWorldX - player.x);

                if (player.primaryCooldown > 0) player.primaryCooldown -= dt;
                if (player.secondaryCooldown > 0) player.secondaryCooldown -= dt;
                if (player.invulnTimer > 0) player.invulnTimer -= dt;
                if (player.attackFlash > 0) player.attackFlash -= dt;
                if (player.secondaryFlash > 0) player.secondaryFlash -= dt;
                if (player.attackSwingTimer > 0) player.attackSwingTimer -= dt;

                if (mouseDown.left && player.primaryCooldown <= 0) {
                    playerPrimaryAttack();
                }
                if (mouseDown.right && player.secondaryCooldown <= 0) {
                    playerSecondaryAttack();
                }
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;

                    // Check aggro: if player is within ENEMY_AGGRO_RANGE, enemy becomes aggroed
                    if (!enemy.aggroed && player && player.alive) {
                        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        if (distToPlayer < ENEMY_AGGRO_RANGE) {
                            enemy.aggroed = true;
                        }
                    }

                    if (enemy.stunTimer > 0) {
                        enemy.stunTimer -= dt;
                        enemy.knockbackX *= 0.85;
                        enemy.knockbackY *= 0.85;
                        enemy.x += enemy.knockbackX * dt;
                        enemy.y += enemy.knockbackY * dt;
                        resolveWallCollision(enemy, enemy.size);
                        continue;
                    }
                    if (enemy.hitFlash > 0) enemy.hitFlash -= dt;

                    if (Math.abs(enemy.knockbackX) > 0.5 || Math.abs(enemy.knockbackY) > 0.5) {
                        enemy.x += enemy.knockbackX * dt;
                        enemy.y += enemy.knockbackY * dt;
                        enemy.knockbackX *= Math.exp(-10 * dt);
                        enemy.knockbackY *= Math.exp(-10 * dt);
                        resolveWallCollision(enemy, enemy.size);
                    }

                    if (enemy.aggroed && player && player.alive) {
                        // Find closest valid target: player or any alive minion
                        let targetObj = { x: player.x, y: player.y, size: PLAYER_SIZE, type: 'player' };
                        let closestDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);

                        for (const minion of minions) {
                            if (minion.health <= 0) continue;
                            const md = Math.hypot(minion.x - enemy.x, minion.y - enemy.y);
                            if (md < closestDist) {
                                closestDist = md;
                                targetObj = { x: minion.x, y: minion.y, size: minion.size, type: 'minion', ref: minion };
                            }
                        }

                        // Move toward the chosen target
                        const dx = targetObj.x - enemy.x;
                        const dy = targetObj.y - enemy.y;
                        const dist = Math.hypot(dx, dy);

                        if (dist > 0.5) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            enemy.x += nx * enemy.speed * dt;
                            enemy.y += ny * enemy.speed * dt;
                            resolveWallCollision(enemy, enemy.size);
                        }

                        // Attack if close enough to target
                        const contactDist = targetObj.size + enemy.size;
                        if (dist < contactDist) {
                            if (targetObj.type === 'player' && player.invulnTimer <= 0) {
                                damagePlayer(enemy.damage);
                                const pushX = (player.x - enemy.x) / (dist + 0.01);
                                const pushY = (player.y - enemy.y) / (dist + 0.01);
                                enemy.knockbackX -= pushX * 100;
                                enemy.knockbackY -= pushY * 100;
                            } else if (targetObj.type === 'minion' && targetObj.ref.damageCooldown <= 0) {
                                const tMinion = targetObj.ref;
                                tMinion.health -= enemy.damage;
                                tMinion.damageCooldown = 0.5;
                                tMinion.hitFlash = 0.08;
                                spawnParticles(tMinion.x, tMinion.y, 3, '#ffaa88', 40, 0.2);
                                const pushMX = (tMinion.x - enemy.x) / (dist + 0.01);
                                const pushMY = (tMinion.y - enemy.y) / (dist + 0.01);
                                tMinion.knockbackX += pushMX * 60;
                                tMinion.knockbackY += pushMY * 60;
                                if (tMinion.health <= 0) {
                                    spawnParticles(tMinion.x, tMinion.y, 8, '#ddccbb', 80, 0.4);
                                }
                            }
                        }
                    } else if (!enemy.aggroed) {
                        // Idle wandering when not aggroed
                        enemy.idleTimer -= dt;
                        if (enemy.idleTimer <= 0) {
                            enemy.idleAngle += (Math.random() - 0.5) * 1.2;
                            enemy.idleTimer = 1.0 + Math.random() * 2.0;
                        }
                        const idleSpeed = enemy.speed * 0.3;
                        enemy.x += Math.cos(enemy.idleAngle) * idleSpeed * dt;
                        enemy.y += Math.sin(enemy.idleAngle) * idleSpeed * dt;
                        resolveWallCollision(enemy, enemy.size);
                    }

                    // Separate enemies from each other
                    for (const other of enemies) {
                        if (other === enemy || other.health <= 0) continue;
                        const edx = enemy.x - other.x;
                        const edy = enemy.y - other.y;
                        const edist = Math.hypot(edx, edy);
                        const minDist = enemy.size + other.size;
                        if (edist < minDist && edist > 0.01) {
                            const sep = (minDist - edist) * 0.3;
                            enemy.x += (edx / edist) * sep;
                            enemy.y += (edy / edist) * sep;
                        }
                    }
                }
                enemies = enemies.filter(e => e.health > 0 || e.hitFlash > -0.5);
            }

            function updateMinions(dt) {
                for (const minion of minions) {
                    if (minion.health <= 0) continue;

                    // Reset movement flag each frame
                    minion.isMoving = false;

                    if (minion.hitFlash > 0) minion.hitFlash -= dt;
                    if (minion.damageCooldown > 0) minion.damageCooldown -= dt;
                    if (minion.attackCooldown > 0) minion.attackCooldown -= dt;

                    if (Math.abs(minion.knockbackX) > 0.3 || Math.abs(minion.knockbackY) > 0.3) {
                        minion.x += minion.knockbackX * dt;
                        minion.y += minion.knockbackY * dt;
                        minion.knockbackX *= Math.exp(-8 * dt);
                        minion.knockbackY *= Math.exp(-8 * dt);
                        resolveWallCollision(minion, minion.size);
                    }

                    // Distance from player to this minion
                    const distToPlayer = player && player.alive
                        ? Math.hypot(player.x - minion.x, player.y - minion.y)
                        : Infinity;

                    // Find nearest enemy within aggro range
                    let nearestEnemy = null;
                    let nearestDist = Infinity;
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const d = Math.hypot(enemy.x - minion.x, enemy.y - minion.y);
                        if (d < nearestDist) {
                            nearestDist = d;
                            nearestEnemy = enemy;
                        }
                    }

                    // Should the minion disengage?  If player is >1/4 screen away, follow player instead.
                    const shouldFollowPlayer = distToPlayer > MINION_DISENGAGE_DIST;

                    // Only engage enemies within MINION_AGGRO_RANGE AND player is close enough
                    if (nearestEnemy && nearestDist < MINION_AGGRO_RANGE && !shouldFollowPlayer) {
                        const dx = nearestEnemy.x - minion.x;
                        const dy = nearestEnemy.y - minion.y;
                        const dist = Math.hypot(dx, dy);

                        if (minion.isRanged && dist < minion.rangedRange && dist > minion.attackRange) {
                            // Ranged attack
                            if (minion.attackCooldown <= 0) {
                                minion.attackCooldown = minion.rangedCooldownMax;
                                minion.angle = Math.atan2(dy, dx);
                                const bproj = spawnProjectile(
                                    minion.x + Math.cos(minion.angle) * (minion.size + 2),
                                    minion.y + Math.sin(minion.angle) * (minion.size + 2),
                                    minion.angle, minion.rangedSpeed, minion.damage,
                                    '#e8e0c8', 3, true, 0, 0, 0, 'minion'
                                );
                                bproj.rangeRemaining = minion.rangedRange;
                                projectiles.push(bproj);
                            }
                            // Stay at ranged distance
                            if (dist > minion.rangedRange * 0.7) {
                                const nx = dx / (dist + 0.01);
                                const ny = dy / (dist + 0.01);
                                minion.x += nx * minion.speed * dt;
                                minion.y += ny * minion.speed * dt;
                                minion.isMoving = true;
                                minion.angle = Math.atan2(dy, dx);
                                resolveWallCollision(minion, minion.size);
                            }
                        } else if (dist > minion.attackRange) {
                            // Move toward enemy
                            const nx = dx / (dist + 0.01);
                            const ny = dy / (dist + 0.01);
                            minion.x += nx * minion.speed * dt;
                            minion.y += ny * minion.speed * dt;
                            minion.isMoving = true;
                            minion.angle = Math.atan2(dy, dx);
                            resolveWallCollision(minion, minion.size);
                        } else if (minion.attackCooldown <= 0) {
                            // Melee attack
                            minion.attackCooldown = minion.attackCooldownMax;
                            minion.angle = Math.atan2(dy, dx);
                            damageEnemy(nearestEnemy, minion.damage, minion.angle);
                            spawnParticles(
                                nearestEnemy.x - Math.cos(minion.angle) * nearestEnemy.size * 0.5,
                                nearestEnemy.y - Math.sin(minion.angle) * nearestEnemy.size * 0.5,
                                3, '#ffffff', 30, 0.15
                            );
                        }
                    } else if (player && player.alive) {
                        // No enemies within aggro range, or player too far — follow the player
                        const dx = player.x - minion.x;
                        const dy = player.y - minion.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 45) {
                            const nx = dx / (dist + 0.01);
                            const ny = dy / (dist + 0.01);
                            minion.x += nx * minion.speed * 0.75 * dt;
                            minion.y += ny * minion.speed * 0.75 * dt;
                            minion.isMoving = true;
                            minion.angle = Math.atan2(dy, dx);
                            resolveWallCollision(minion, minion.size);
                        }
                    }

                    // Advance walk animation timer when moving
                    if (minion.isMoving) {
                        minion.walkTimer += dt * 8;
                    }

                    // Separate minions from each other
                    for (const other of minions) {
                        if (other === minion || other.health <= 0) continue;
                        const mdx = minion.x - other.x;
                        const mdy = minion.y - other.y;
                        const mdist = Math.hypot(mdx, mdy);
                        const minSep = minion.size + other.size;
                        if (mdist < minSep && mdist > 0.01) {
                            const sep = (minSep - mdist) * 0.25;
                            minion.x += (mdx / mdist) * sep;
                            minion.y += (mdy / mdist) * sep;
                        }
                    }
                }
                minions = minions.filter(m => m.health > 0);
            }

            function updateProjectiles(dt) {
                for (const proj of projectiles) {
                    if (!proj.alive) continue;
                    if (proj.homingStrength > 0 && proj.isRanged) {
                        let closestEnemy = null;
                        let closestDist = 200;
                        for (const enemy of enemies) {
                            if (enemy.health <= 0) continue;
                            const d = Math.hypot(enemy.x - proj.x, enemy.y - proj.y);
                            if (d < closestDist) {
                                closestDist = d;
                                closestEnemy = enemy;
                            }
                        }
                        if (closestEnemy) {
                            const targetAngle = Math.atan2(closestEnemy.y - proj.y, closestEnemy.x - proj.x);
                            let diff = targetAngle - proj.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            proj.angle += diff * Math.min(1, proj.homingStrength * 8 * dt);
                            proj.vx = Math.cos(proj.angle) * proj.speed;
                            proj.vy = Math.sin(proj.angle) * proj.speed;
                        }
                    }

                    proj.x += proj.vx * dt;
                    proj.y += proj.vy * dt;
                    proj.rangeRemaining -= proj.speed * dt;
                    proj.trail.push({ x: proj.x, y: proj.y, life: 0.15 });
                    if (proj.trail.length > 12) proj.trail.shift();

                    if (isWallCircle(proj.x, proj.y, proj.size)) {
                        if (proj.aoeRadius > 0) {
                            applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.8, proj.color);
                        }
                        spawnParticles(proj.x, proj.y, 6, proj.color, 80, 0.25);
                        proj.alive = false;
                        continue;
                    }

                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const ed = Math.hypot(enemy.x - proj.x, enemy.y - proj.y);
                        if (ed < proj.size + enemy.size) {
                            damageEnemy(enemy, proj.damage, proj.angle);
                            if (proj.aoeRadius > 0) {
                                applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.7, proj.color);
                            }
                            if (proj.pierceCount > 0) {
                                proj.pierceCount--;
                                spawnParticles(proj.x, proj.y, 3, proj.color, 50, 0.2);
                            } else {
                                proj.alive = false;
                                spawnParticles(proj.x, proj.y, 5, proj.color, 70, 0.25);
                                break;
                            }
                        }
                    }
                    if (proj.rangeRemaining <= 0 && proj.isRanged) {
                        if (proj.aoeRadius > 0 && proj.alive) {
                            applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.8, proj.color);
                        }
                        proj.alive = false;
                        spawnParticles(proj.x, proj.y, 4, proj.color, 40, 0.2);
                    }
                }
                projectiles = projectiles.filter(p => p.alive);
            }

            function applyAoE(x, y, radius, damage, color) {
                spawnParticles(x, y, 12, color, 100, 0.4);
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const ed = Math.hypot(enemy.x - x, enemy.y - y);
                    if (ed < radius + enemy.size) {
                        damageEnemy(enemy, damage, Math.atan2(enemy.y - y, enemy.x - x));
                    }
                }
                screenShake = Math.max(screenShake, 2);
            }

            function updateParticles(dt) {
                for (const p of particles) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                }
                particles = particles.filter(p => p.life > 0);
            }

            function updateDamageNumbers(dt) {
                for (const dn of damageNumbers) {
                    dn.y -= 40 * dt;
                    dn.life -= dt;
                }
                damageNumbers = damageNumbers.filter(dn => dn.life > 0);
            }

            function updateDroppedTokens(dt) {
                for (const token of droppedTokens) {
                    if (token.collected) continue;
                    if (token.flyingToPlayer && player && player.alive) {
                        // Animate flying toward player with a nice arc
                        token.flyProgress += dt * 2.2;
                        if (token.flyProgress >= 1) {
                            collectToken(token);
                        } else {
                            const t = token.flyProgress;
                            // Ease-in-out with slight arc
                            const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                            token.x = token.flyStartX + (player.x - token.flyStartX) * easeT;
                            token.y = token.flyStartY + (player.y - token.flyStartY) * easeT;
                            // Spawn occasional trail particles
                            if (Math.random() < 0.4) {
                                particles.push({
                                    x: token.x,
                                    y: token.y,
                                    vx: (Math.random() - 0.5) * 15,
                                    vy: (Math.random() - 0.5) * 15,
                                    life: 0.2,
                                    maxLife: 0.2,
                                    color: '#ffcc44',
                                    size: 1.5 + Math.random() * 2,
                                });
                            }
                        }
                        continue;
                    }
                    token.life -= dt;
                    // Magnet to player
                    if (player && player.alive && !token.flyingToPlayer) {
                        const dx = player.x - token.x;
                        const dy = player.y - token.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < TOKEN_MAGNET_RANGE) {
                            const spd = 200;
                            token.x += (dx / (dist + 0.01)) * spd * dt;
                            token.y += (dy / (dist + 0.01)) * spd * dt;
                        }
                        if (dist < PLAYER_SIZE + 10) {
                            collectToken(token);
                        }
                    }
                }
                droppedTokens = droppedTokens.filter(t => t.life > 0 && !t.collected);
            }

            // === RENDER ===
            function render() {
                ctx.clearRect(0, 0, W, H);

                if (gameState === 'CHARACTER_SELECT') {
                    renderCharacterSelect();
                    return;
                }

                const sx = shakeX;
                const sy = shakeY;
                ctx.save();
                ctx.translate(sx, sy);

                const startTX = Math.floor(camera.x / TILE);
                const startTY = Math.floor(camera.y / TILE);
                const endTX = Math.ceil((camera.x + W) / TILE);
                const endTY = Math.ceil((camera.y + H) / TILE);
                for (let ty = startTY; ty <= endTY; ty++) {
                    for (let tx = startTX; tx <= endTX; tx++) {
                        if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) {
                            ctx.fillStyle = '#0a0a10';
                            ctx.fillRect(tx * TILE - camera.x, ty * TILE - camera.y, TILE, TILE);
                            continue;
                        }
                        const shade = ((tx + ty) % 2 === 0) ? '#1a1a24' : '#161620';
                        ctx.fillStyle = shade;
                        const sx2 = tx * TILE - camera.x;
                        const sy2 = ty * TILE - camera.y;
                        ctx.fillRect(sx2, sy2, TILE, TILE);
                        ctx.strokeStyle = '#1f1f2c';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(sx2, sy2, TILE, TILE);
                        if (mapTiles[ty][tx] === 1) {
                            drawWall(sx2, sy2);
                        }
                    }
                }

                // Draw dropped tokens
                for (const token of droppedTokens) {
                    if (token.collected) continue;
                    const tsx = screenX(token.x);
                    const tsy = screenY(token.y);
                    const pulse = 1 + Math.sin(token.life * 6) * 0.2;
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.arc(tsx, tsy, 5 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff8c0';
                    ctx.beginPath();
                    ctx.arc(tsx, tsy, 2.5 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,200,40,0.25)';
                    ctx.beginPath();
                    ctx.arc(tsx, tsy, 9 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw projectiles
                for (const proj of projectiles) {
                    if (!proj.alive) continue;
                    for (let i = 0; i < proj.trail.length; i++) {
                        const t = proj.trail[i];
                        const alpha = (i / proj.trail.length) * 0.5;
                        const tsx2 = screenX(t.x);
                        const tsy2 = screenY(t.y);
                        if (proj.color.startsWith('#')) {
                            const r = parseInt(proj.color.slice(1, 3), 16);
                            const g = parseInt(proj.color.slice(3, 5), 16);
                            const b = parseInt(proj.color.slice(5, 7), 16);
                            ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                        } else {
                            ctx.fillStyle = proj.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
                        }
                        ctx.beginPath();
                        ctx.arc(tsx2, tsy2, proj.size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const psx = screenX(proj.x);
                    const psy = screenY(proj.y);
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(psx, psy, proj.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(psx, psy, proj.size * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw minions
                for (const minion of minions) {
                    if (minion.health <= 0) continue;
                    const msx = screenX(minion.x);
                    const msy = screenY(minion.y);
                    if (msx < -30 || msx > W + 30 || msy < -30 || msy > H + 30) continue;
                    drawMinion(minion, msx, msy);
                }

                // Draw enemies
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const esx = screenX(enemy.x);
                    const esy = screenY(enemy.y);
                    if (esx < -30 || esx > W + 30 || esy < -30 || esy > H + 30) continue;
                    drawEnemy(enemy, esx, esy);
                }

                // Draw player
                if (player && player.alive) {
                    const psx = screenX(player.x);
                    const psy = screenY(player.y);
                    drawPlayer(psx, psy);
                }

                // Draw damage numbers
                for (const dn of damageNumbers) {
                    const dnx = screenX(dn.x);
                    const dny = screenY(dn.y);
                    const alpha = Math.min(1, dn.life / dn.maxLife);
                    ctx.fillStyle = dn.color;
                    ctx.globalAlpha = alpha;
                    ctx.font = 'bold 13px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(dn.text, dnx, dny);
                    ctx.globalAlpha = 1;
                }

                // Draw particles
                for (const p of particles) {
                    const psx2 = screenX(p.x);
                    const psy2 = screenY(p.y);
                    const alpha = Math.min(1, p.life / p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(psx2 - p.size / 2, psy2 - p.size / 2, p.size, p.size);
                }
                ctx.globalAlpha = 1;

                ctx.restore();

                renderHUD();

                if (gameState === 'WAVE_CLEAR') renderWaveClear();
                if (gameState === 'SHOP') renderShop();
                if (gameState === 'GAME_OVER') renderGameOver();
            }

            function drawWall(sx, sy) {
                ctx.fillStyle = '#2a2a36';
                ctx.fillRect(sx, sy, TILE, TILE);
                ctx.fillStyle = '#333340';
                ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
                ctx.strokeStyle = '#22222e';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
                ctx.beginPath();
                ctx.moveTo(sx, sy + TILE / 2);
                ctx.lineTo(sx + TILE, sy + TILE / 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx + TILE / 2, sy);
                ctx.lineTo(sx + TILE / 2, sy + TILE / 2);
                ctx.stroke();
                ctx.fillStyle = '#3d3d4d';
                ctx.fillRect(sx + 3, sy + 3, TILE - 6, 3);
                ctx.fillRect(sx + 3, sy + 3, 3, TILE - 6);
            }

            function drawPlayer(px, py) {
                const ch = characters[selectedCharacter];
                const size = PLAYER_SIZE;
                ctx.fillStyle = 'rgba(180,160,220,0.15)';
                ctx.beginPath();
                ctx.arc(px, py, size + 8, 0, Math.PI * 2);
                ctx.fill();

                const bodyColor = player.attackFlash > 0 ? '#ffffff' :
                    player.secondaryFlash > 0 ? '#ffe8c0' : ch.robeColor;
                const invulnBlink = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 20) % 2 === 0;

                ctx.fillStyle = invulnBlink ? '#ffffff' : bodyColor;
                ctx.fillRect(px - size * 0.5, py - size * 0.3, size, size * 0.85);

                ctx.fillStyle = invulnBlink ? '#ffffff' : ch.skinColor;
                ctx.beginPath();
                ctx.arc(px, py - size * 0.5, size * 0.38, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = invulnBlink ? '#ffffff' : ch.color;
                if (selectedCharacter === 'knight') {
                    ctx.fillRect(px - size * 0.35, py - size * 0.95, size * 0.7, size * 0.4);
                    ctx.fillRect(px - size * 0.2, py - size * 1.15, size * 0.4, size * 0.25);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(px, py - size * 1.15);
                    ctx.lineTo(px - size * 0.4, py - size * 0.5);
                    ctx.lineTo(px + size * 0.4, py - size * 0.5);
                    ctx.closePath();
                    ctx.fill();
                }

                // For sorcerer, draw staff/glowing hand for ranged attacks
                if (selectedCharacter === 'sorcerer') {
                    const tipX = px + Math.cos(player.angle) * size * 1.2;
                    const tipY = py + Math.sin(player.angle) * size * 1.2;
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#b57edc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                    const glowPulse = 1 + Math.sin(Date.now() / 200) * 0.25;
                    ctx.fillStyle = 'rgba(255,120,40,0.5)';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 4.5 * glowPulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff8844';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (player.attackSwingTimer > 0) {
                    const swingProgress = 1 - (player.attackSwingTimer / SWING_DURATION);
                    const halfArc = player.attackSwingArc / 2;
