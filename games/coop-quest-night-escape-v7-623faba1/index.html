<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coop Quest: Night Escape (v5)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #04040d;
  overflow: hidden;
  font-family: 'Courier New', 'Lucida Console', monospace;
  color: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  user-select: none;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  border: 3px solid #2a2438;
  background: #06061a;
  box-shadow: 0 0 40px rgba(80, 60, 140, 0.5);
  cursor: crosshair;
}
#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  font-size: 12px;
  text-shadow: 2px 2px 0 #000;
  pointer-events: none;
  z-index: 10;
  line-height: 1.45;
  background: rgba(0,0,0,0.55);
  padding: 8px 12px;
  border: 1px solid #444;
  max-width: 240px;
}
#hint {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  text-shadow: 2px 2px 0 #000;
  pointer-events: none;
  z-index: 10;
  color: #aaa;
  text-align: center;
  background: rgba(0,0,0,0.5);
  padding: 5px 14px;
  border: 1px solid #333;
}
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="hud"></div>
<div id="hint">WASD / Arrow keys = move • E = interact / climb / escape • F = ability • Right-click (Spot) = aim Black Hole</div>
<script>
"use strict";

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = canvas.width;
const H = canvas.height;

// ============================================================
// GLOBAL STATE
// ============================================================
let state = 'menu';
let character = null;
let now = 0;
let lastT = performance.now();
let gameTime = 0;
let message = '';
let messageTimer = 0;
let endingType = null;
let cutsceneStep = 0;
let cutsceneT = 0;
let endingTimer = 0;
let particles = [];
let climbAnim = null;
let cutsceneView = 'shed';
let cutsceneAnimT = 0;
let fenceWobble = 0;

// ============================================================
// PLAYER
// ============================================================
const PLAYER_SPEED = 175;
const player = {
  x: 75, y: 300,
  vx: 0, vy: 0,
  facing: 1,
  walkPhase: 0,
  onShed: false,
  onGardenBed: false,
  inCoop: true,
  inPool: false,
  height: 0
};

// ============================================================
// COOPER
// ============================================================
const COOPER_LURK_SPEED = PLAYER_SPEED * 0.85;
const COOPER_CHASE_SPEED = PLAYER_SPEED * 0.85;
const cooper = {
  x: 760, y: 340,
  vx: 0, vy: 0,
  facing: -1,
  walkPhase: 0,
  state: 'lurking',
  stunTimer: 0,
  noChaseTimer: 0,
  visionRange: 210,
  wanderAngle: 0,
  wanderTimer: 0,
  lastSeenX: 0,
  lastSeenY: 0,
  tailWag: 0
};

// ============================================================
// ABILITIES
// ============================================================
const abilities = {
  terry: {
    name: 'FLIGHT',
    active: false,
    duration: 2.6,
    timer: 0,
    cooldown: 0,
    maxCD: 15,
    ready: true
  },
  spot: {
    name: 'BLACK HOLE',
    active: false,
    duration: 1.5,
    timer: 0,
    cooldown: 0,
    maxCD: 37,
    x: 0, y: 0,
    animT: 0,
    noChaseTimer: 0
  },
  charlet: {
    name: 'MULLET FORM',
    active: false,
    duration: 4,
    timer: 0,
    cooldown: 0,
    maxCD: 34,
    poolEntryX: 0,
    poolEntryY: 0,
    splashT: 0
  }
};

// ============================================================
// MAP OBJECTS
// ============================================================
const map = {
  coop:          { x: 10,  y: 195, w: 130, h: 210 },
  coopFloorY:    395,
  coopHole:      { x: 130, y: 290, w: 30,  h: 38 },

  trees: [
    { x: 235, y: 200, r: 28 },
    { x: 470, y: 285, r: 28 }
  ],

  pool:          { x: 305, y: 420, w: 180, h: 135 },
  poolFence:     { x: 300, y: 410, w: 190, h: 8 },

  gardenBeds: [
    { x: 175, y: 475, w: 90, h: 45, climbable: false },
    { x: 505, y: 430, w: 95, h: 50, climbable: true }
  ],

  bananaTrees: [
    { x: 565, y: 155 },
    { x: 605, y: 178 },
    { x: 645, y: 155 },
    { x: 685, y: 178 },
    { x: 725, y: 155 }
  ],

  shed:          { x: 620, y: 315, w: 150, h: 165 }
};

// ============================================================
// INPUT
// ============================================================
const keys = {};
const justPressed = {};
let mouseX = W / 2, mouseY = H / 2;

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) justPressed[k] = true;
  keys[k] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function getCanvasMouse(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  return {
    x: Math.max(0, Math.min(W, (e.clientX - rect.left) * sx)),
    y: Math.max(0, Math.min(H, (e.clientY - rect.top) * sy))
  };
}

canvas.addEventListener('mousemove', e => {
  const m = getCanvasMouse(e);
  mouseX = m.x; mouseY = m.y;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
  const m = getCanvasMouse(e);
  mouseX = m.x; mouseY = m.y;
  if (e.button === 0) {
    if (state === 'menu') handleMenuClick(m.x, m.y);
    else if (state === 'ending') {
      if (endingTimer > 0.4) resetGame();
    }
  } else if (e.button === 2) {
    if (state === 'backyard' || state === 'shedTop') {
      if (character === 'spot' && !abilities.spot.active && abilities.spot.cooldown <= 0) {
        spawnBlackHole(m.x, m.y);
      }
    }
  }
});

// ============================================================
// MENU / CHARACTERS
// ============================================================
const chars = [
  {
    id: 'terry',
    name: 'TERRY',
    color: '#ff7722',
    body: '#ffffff',
    body2: '#ffd9b3',
    head: '#ff7a1f',
    desc: ['Orange & white rooster', 'ABILITY: FLIGHT', 'Soar over fences', '1.3x speed • 15s cooldown']
  },
  {
    id: 'spot',
    name: 'SPOT',
    color: '#eaeaea',
    body: '#ffffff',
    body2: '#ffffff',
    head: '#f0e0d0',
    desc: ['White hen with black spots', 'ABILITY: BLACK HOLE', 'Right-click to suck', 'monsters in • 37s cooldown']
  },
  {
    id: 'charlet',
    name: 'CHARLET',
    color: '#a3623a',
    body: '#7a4a22',
    body2: '#5a3818',
    head: '#4a2810',
    desc: ['Mature brown hen', 'ABILITY: MULLET FORM', 'Become a fish ANY-', 'WHERE • 34s cooldown']
  }
];

function handleMenuClick(mx, my) {
  const cardW = 210, cardH = 300, gap = 30;
  const totalW = cardW * 3 + gap * 2;
  const startX = (W - totalW) / 2;
  const startY = 230;
  for (let i = 0; i < 3; i++) {
    const cx = startX + i * (cardW + gap);
    if (mx >= cx && mx <= cx + cardW && my >= startY && my <= startY + cardH) {
      startGame(chars[i].id);
      return;
    }
  }
}

function startGame(charId) {
  character = charId;
  state = 'coop';
  player.x = 75;
  player.y = 310;
  player.facing = 1;
  player.onShed = false;
  player.onGardenBed = false;
  player.inCoop = true;
  player.inPool = false;
  player.height = 0;
  cooper.x = 760;
  cooper.y = 340;
  cooper.state = 'lurking';
  cooper.noChaseTimer = 0;
  cooper.stunTimer = 0;
  cooper.wanderAngle = Math.PI;
  cooper.wanderTimer = 0;
  cooper.tailWag = 0;
  for (const k in abilities) {
    abilities[k].active = false;
    abilities[k].timer = 0;
    abilities[k].cooldown = 0;
  }
  gameTime = 0;
  particles = [];
  climbAnim = null;
  showMessage('You are in the nesting box. Go down through the hole to the coop floor.', 4);
}

function resetGame() {
  state = 'menu';
  character = null;
  endingType = null;
  cutsceneStep = 0;
  cutsceneT = 0;
  cutsceneView = 'shed';
  cutsceneAnimT = 0;
  endingTimer = 0;
  message = '';
  messageTimer = 0;
  climbAnim = null;
}

function showMessage(msg, dur) {
  message = msg;
  messageTimer = dur || 2.5;
}

// ============================================================
// ABILITY HELPERS
// ============================================================
function spawnBlackHole(x, y) {
  x = Math.max(155, Math.min(W - 15, x));
  y = Math.max(110, Math.min(H - 25, y));
  abilities.spot.x = x;
  abilities.spot.y = y;
  abilities.spot.active = true;
  abilities.spot.timer = abilities.spot.duration;
  abilities.spot.animT = 0;
  showMessage('BLACK HOLE!', 1);
}

function activateAbility() {
  if (character === 'terry') {
    if (!abilities.terry.active && abilities.terry.cooldown <= 0) {
      abilities.terry.active = true;
      abilities.terry.timer = abilities.terry.duration;
      showMessage('FLIGHT! You soar above the danger!', 1.4);
      addParticle(player.x, player.y, '#ffaa66', 8);
    }
  } else if (character === 'spot') {
    if (!abilities.spot.active && abilities.spot.cooldown <= 0) {
      spawnBlackHole(player.x, player.y);
    }
  } else if (character === 'charlet') {
    if (!abilities.charlet.active && abilities.charlet.cooldown <= 0) {
      abilities.charlet.active = true;
      abilities.charlet.timer = abilities.charlet.duration;
      abilities.charlet.splashT = 0.3;
      player.inPool = pointInRect(player.x, player.y, map.pool);
      for (let i = 0; i < 16; i++) {
        addParticle(player.x, player.y - 5, '#aaeeff', 0.9);
      }
      for (let i = 0; i < 10; i++) {
        addParticle(player.x, player.y, '#66ccff', 0.7);
      }
      if (player.inPool) {
        showMessage('MULLET FORM! You dart through the water!', 1.4);
      } else {
        showMessage('MULLET FORM! You become a slippery mullet!', 1.4);
      }
    }
  }
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function addParticle(x, y, color, life) {
  particles.push({
    x, y, vx: (Math.random() - 0.5) * 60,
    vy: -Math.random() * 60 - 10,
    color, life: life || 0.6, max: life || 0.6
  });
}

// ============================================================
// SHED-CLIMB ANIMATION
// ============================================================
function startClimbAnimation() {
  player.facing = 1;
  climbAnim = {
    fromX: player.x,
    fromY: player.y,
    toX: map.shed.x + 30,
    toY: map.shed.y - 4,
    timer: 0,
    duration: 0.6
  };
  state = 'climbing';
  showMessage('Climbing the shed wall...', 0.6);
  addParticle(player.x, player.y, '#8a6a30', 0.35);
}

function updateClimbing(dt) {
  for (const k in abilities) {
    if (abilities[k].cooldown > 0) abilities[k].cooldown -= dt;
  }
  if (abilities.charlet.active) {
    if (Math.random() < dt * 8) {
      addParticle(player.x + (Math.random() - 0.5) * 14,
                  player.y - 4, '#aaeeff', 0.6);
    }
  }

  if (!climbAnim) {
    state = 'shedTop';
    return;
  }

  climbAnim.timer += dt;
  const t = Math.min(1, climbAnim.timer / climbAnim.duration);
  const e = 1 - Math.pow(1 - t, 3);
  player.x = climbAnim.fromX + (climbAnim.toX - climbAnim.fromX) * e;
  player.y = climbAnim.fromY + (climbAnim.toY - climbAnim.fromY) * e;

  player.walkPhase += dt * 16;

  if (Math.random() < dt * 16) {
    addParticle(player.x + (Math.random() - 0.5) * 8,
                player.y + (Math.random() - 0.5) * 8,
                Math.random() < 0.5 ? '#8a6a30' : '#a0823a', 0.45);
  }
  if (Math.random() < dt * 4) {
    addParticle(player.x - 4 * player.facing + (Math.random() - 0.5) * 4,
                player.y - 4 + (Math.random() - 0.5) * 4,
                '#ffe8c8', 0.4);
  }

  if (t >= 1) {
    player.x = climbAnim.toX;
    player.y = climbAnim.toY;
    player.onShed = true;
    player.onGardenBed = false;
    state = 'shedTop';
    climbAnim = null;
    showMessage('You climbed onto the shed roof! You\'re safe from Cooper!', 3);
    for (let i = 0; i < 10; i++) {
      addParticle(player.x + (Math.random() - 0.5) * 10,
                  player.y + 4, '#ffcc66', 0.55);
    }
  }
}

// ============================================================
// CUTSCENE
// ============================================================
const cutsceneLines = {
  bad: [
    'You launch yourself off the shed roof!',
    'You soar over the fence and into the neighbor\'s yard...',
    'The new yard stretches out before you — a house, a porch, garden gnomes...',
    'A small dog bursts from the porch! It\'s RUBY,',
    'the fierce brown French Bulldog!',
    'She lunges through the air and catches you in her jaws!',
    'You have been eaten...',
    'BAD ENDING'
  ],
  goodish: [
    'You launch yourself off the shed roof!',
    'You soar over the fence and into the neighbor\'s yard...',
    'The new yard stretches out before you — porch lights, flowers, a tidy garden...',
    'A small dog bursts out! Ruby the French Bulldog!',
    'She snaps at you and grabs your tail feathers!',
    'RIP! Your beautiful tail feathers are torn off!',
    'A neighbor rushes out shouting, scaring Ruby away.',
    'You are rescued, but you\'ve lost your tail feathers...',
    'GOODISH ENDING'
  ],
  good: [
    'You launch yourself off the shed roof!',
    'You soar over the fence and into the neighbor\'s yard...',
    'The new yard stretches out before you — porch lights, flowers, a tidy garden...',
    'Ruby the French Bulldog spots you and gives chase!',
    'You flap your wings with all your might!',
    'You soar back over the fence, narrowly escaping!',
    'Your tail feathers are safe. You live to cluck another day!',
    'GOOD ENDING'
  ]
};

function startCutscene() {
  state = 'cutscene';
  cutsceneStep = 0;
  cutsceneT = 0.6;
  cutsceneView = 'shed';
  cutsceneAnimT = 0;
  fenceWobble = 0;
  const r = Math.random();
  if (r < 0.50) endingType = 'bad';
  else if (r < 0.75) endingType = 'goodish';
  else endingType = 'good';
  endingTimer = 0;
  for (let i = 0; i < 14; i++) addParticle(player.x, player.y, '#ffcc66', 1);
}

function advanceCutsceneLine() {
  const lines = cutsceneLines[endingType];
  if (cutsceneStep < lines.length) {
    showMessage(lines[cutsceneStep], 2.6);
    cutsceneT = 2.6;
    if (cutsceneStep === 2) cutsceneView = 'overFence';
    if (cutsceneStep === 3) {
      cutsceneView = 'neighborYard';
      cutsceneAnimT = 0;
    }
    cutsceneStep++;
  } else {
    state = 'ending';
    endingTimer = 0;
    message = '';
  }
}

// ============================================================
// MAIN UPDATE
// ============================================================
function update(dt) {
  gameTime += dt;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 80 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (messageTimer > 0) {
    messageTimer -= dt;
    if (messageTimer <= 0) message = '';
  }

  if (state === 'coop') updateCoop(dt);
  else if (state === 'backyard') updateBackyard(dt);
  else if (state === 'shedTop') updateShedTop(dt);
  else if (state === 'climbing') updateClimbing(dt);
  else if (state === 'cutscene') updateCutscene(dt);
  else if (state === 'ending') {
    endingTimer += dt;
  }

  for (const k in justPressed) justPressed[k] = false;
}

function readMove() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 && dy !== 0) {
    const m = Math.hypot(dx, dy);
    dx /= m; dy /= m;
  }
  if (dx > 0) player.facing = 1;
  else if (dx < 0) player.facing = -1;
  return { dx, dy };
}

function updateCoop(dt) {
  const { dx, dy } = readMove();
  if (dx !== 0 || dy !== 0) player.walkPhase += dt * 7;

  const speed = PLAYER_SPEED * 0.95;
  let nx = player.x + dx * speed * dt;
  let ny = player.y + dy * speed * dt;

  if (nx < 28) nx = 28;
  if (nx > 132) nx = 132;
  if (ny < 210) ny = 210;
  if (ny > 388) ny = 388;

  player.x = nx;
  player.y = ny;

  if (player.x > 128 && player.y > 285 && player.y < 335) {
    state = 'backyard';
    player.x = 165;
    player.y = 305;
    player.inCoop = false;
    cooper.x = 760;
    cooper.y = 340;
    cooper.state = 'lurking';
    cooper.noChaseTimer = 1.0;
    showMessage('Cooper the brindle dog is lurking outside! Reach the shed roof and escape!', 4);
  }
}

function updateBackyard(dt) {
  updateAbilities(dt);

  const { dx, dy } = readMove();

  let speed = PLAYER_SPEED;
  if (abilities.terry.active) speed *= 1.3;
  if (abilities.charlet.active) speed *= 0.9;

  if (dx !== 0 || dy !== 0) player.walkPhase += dt * 8;

  let nx = player.x + dx * speed * dt;
  let ny = player.y + dy * speed * dt;

  nx = clamp(nx, 20, W - 20);
  ny = clamp(ny, 80, H - 30);

  if (abilities.charlet.active) {
    player.x = nx;
    player.y = ny;
  } else {
    nx = resolveCollisionX(nx, ny);
    ny = resolveCollisionY(nx, ny);
    player.x = nx;
    player.y = ny;
  }

  for (const k in abilities) {
    if (abilities[k].cooldown > 0) abilities[k].cooldown -= dt;
  }

  updateCooper(dt);

  if (cooper.state === 'chasing') {
    const dist = Math.hypot(player.x - cooper.x, player.y - cooper.y);
    const flyingOver = abilities.terry.active;
    const swimming = abilities.charlet.active;
    if (dist < 22 && !flyingOver && !swimming) {
      showMessage('Cooper caught you! You scramble back into the coop...', 2.5);
      state = 'coop';
      player.x = 75;
      player.y = 310;
      player.inCoop = true;
      cooper.x = 760;
      cooper.y = 340;
      cooper.state = 'lurking';
      cooper.noChaseTimer = 2;
      cooper.stunTimer = 0;
    }
  }

  if (justPressed['e'] || justPressed['enter'] || justPressed[' ']) {
    justPressed['e'] = false;
    justPressed['enter'] = false;
    justPressed[' '] = false;
    if (!abilities.charlet.active) {
      handleInteraction();
    }
  }

  if (justPressed['f']) {
    justPressed['f'] = false;
    activateAbility();
  }

  if (player.onShed) state = 'shedTop';
}

function updateAbilities(dt) {
  if (abilities.terry.active) {
    abilities.terry.timer -= dt;
    player.height = Math.sin((abilities.terry.duration - abilities.terry.timer) / abilities.terry.duration * Math.PI) * 40;
    if (abilities.terry.timer <= 0) {
      abilities.terry.active = false;
      abilities.terry.cooldown = abilities.terry.maxCD;
      player.height = 0;
      showMessage('Flight ended. 15s cooldown.', 1.4);
    }
  }

  if (abilities.spot.active) {
    abilities.spot.timer -= dt;
    abilities.spot.animT += dt;
    abilities.spot.noChaseTimer = abilities.spot.timer;

    if (cooper.state !== 'stunned') {
      const dx = abilities.spot.x - cooper.x;
      const dy = abilities.spot.y - cooper.y;
      const d = Math.hypot(dx, dy);
      if (d < 110) {
        cooper.state = 'stunned';
        cooper.stunTimer = abilities.spot.timer;
      }
    }
    if (cooper.state === 'stunned' && abilities.spot.active) {
      const dx = abilities.spot.x - cooper.x;
      const dy = abilities.spot.y - cooper.y;
      const d = Math.max(0.1, Math.hypot(dx, dy));
      const pull = 220 * dt;
      cooper.x += (dx / d) * Math.min(pull, d);
      cooper.y += (dy / d) * Math.min(pull, d);
      cooper.stunTimer = abilities.spot.timer;
    }

    if (abilities.spot.timer <= 0) {
      abilities.spot.active = false;
      abilities.spot.cooldown = abilities.spot.maxCD;
      cooper.state = 'lurking';
      cooper.noChaseTimer = 3.5;
      showMessage('Black hole collapses. 37s cooldown. Cooper is disoriented!', 2);
    }
  }

  if (abilities.charlet.active) {
    abilities.charlet.timer -= dt;
    if (abilities.charlet.splashT > 0) abilities.charlet.splashT -= dt;

    if (Math.random() < dt * 8) {
      addParticle(player.x + (Math.random() - 0.5) * 14,
                  player.y - 4, '#aaeeff', 0.6);
    }
    if (Math.random() < dt * 5) {
      addParticle(player.x + (Math.random() - 0.5) * 18,
                  player.y + (Math.random() - 0.5) * 10,
                  Math.random() < 0.5 ? '#66ccff' : '#ffffff', 0.5);
    }

    if (abilities.charlet.timer <= 0) {
      abilities.charlet.active = false;
      abilities.charlet.cooldown = abilities.charlet.maxCD;
      player.inPool = false;
      player.x = clamp(player.x, 30, W - 30);
      player.y = clamp(player.y, 90, H - 30);
      for (let i = 0; i < 18; i++) {
        addParticle(player.x, player.y, '#aaeeff', 0.7);
      }
      const d = Math.hypot(player.x - cooper.x, player.y - cooper.y);
      if (d < 90) {
        cooper.state = 'stunned';
        cooper.stunTimer = 3;
        cooper.noChaseTimer = 3 + 3.5;
        showMessage('MULLET CHOMP! Cooper is stunned!', 1.5);
        for (let i = 0; i < 10; i++) addParticle(cooper.x, cooper.y, '#ff6644', 0.5);
      } else {
        showMessage('Mullet form ended. 34s cooldown.', 1.3);
      }
    }
  }

  if (cooper.state === 'stunned' && !abilities.spot.active) {
    cooper.stunTimer -= dt;
    if (cooper.stunTimer <= 0) {
      cooper.state = 'lurking';
    }
  }

  if (cooper.noChaseTimer > 0) cooper.noChaseTimer -= dt;
}

function updateCooper(dt) {
  cooper.walkPhase += dt * 5;
  cooper.tailWag += dt * (cooper.state === 'chasing' ? 14 : 7);

  if (cooper.state === 'stunned') return;

  const dist = Math.hypot(player.x - cooper.x, player.y - cooper.y);

  let effectiveRange = cooper.visionRange;
  if (abilities.terry.active) effectiveRange = 90;
  if (abilities.charlet.active) effectiveRange = 40;

  const playerVisible = dist < effectiveRange && cooper.noChaseTimer <= 0;

  if (playerVisible) {
    cooper.state = 'chasing';
    cooper.lastSeenX = player.x;
    cooper.lastSeenY = player.y;
  } else if (cooper.state === 'chasing') {
    if (Math.hypot(cooper.lastSeenX - cooper.x, cooper.lastSeenY - cooper.y) < 15) {
      cooper.state = 'lurking';
    }
  }

  let speed, tx, ty;
  if (cooper.state === 'chasing') {
    speed = COOPER_CHASE_SPEED;
    tx = player.x;
    ty = player.y;
  } else {
    speed = COOPER_LURK_SPEED;
    cooper.wanderTimer -= dt;
    if (cooper.wanderTimer <= 0) {
      cooper.wanderAngle = Math.random() * Math.PI * 2;
      cooper.wanderTimer = 1.5 + Math.random() * 2.5;
    }
    tx = cooper.x + Math.cos(cooper.wanderAngle) * 200;
    ty = cooper.y + Math.sin(cooper.wanderAngle) * 200;
  }

  const ang = Math.atan2(ty - cooper.y, tx - cooper.x);
  cooper.vx = Math.cos(ang) * speed;
  cooper.vy = Math.sin(ang) * speed;
  cooper.facing = cooper.vx >= 0 ? 1 : -1;

  let nx = cooper.x + cooper.vx * dt;
  let ny = cooper.y + cooper.vy * dt;

  nx = clamp(nx, 160, W - 20);
  ny = clamp(ny, 100, H - 25);

  for (const t of map.trees) {
    const dx = nx - t.x, dy = ny - t.y;
    if (Math.hypot(dx, dy) < t.r + 8) {
      const a = Math.atan2(dy, dx);
      nx = t.x + Math.cos(a) * (t.r + 8);
      ny = t.y + Math.sin(a) * (t.r + 8);
    }
  }
  for (const bt of map.bananaTrees) {
    const dx = nx - bt.x, dy = ny - bt.y;
    if (Math.hypot(dx, dy) < 18) {
      const a = Math.atan2(dy, dx);
      nx = bt.x + Math.cos(a) * 18;
      ny = bt.y + Math.sin(a) * 18;
    }
  }
  if (!abilities.spot.active) {
    if (pointInRect(nx, ny, map.pool)) {
      const dx = nx - (map.pool.x + map.pool.w / 2);
      const dy = ny - (map.pool.y + map.pool.h / 2);
      const a = Math.atan2(dy, dx);
      nx = map.pool.x + map.pool.w / 2 + Math.cos(a) * (map.pool.w / 2 + 10);
      ny = map.pool.y + map.pool.h / 2 + Math.sin(a) * (map.pool.h / 2 + 10);
    }
  }
  for (const gb of map.gardenBeds) {
    if (nx > gb.x && nx < gb.x + gb.w && ny > gb.y && ny < gb.y + gb.h) {
      if (cooper.x < gb.x) nx = gb.x - 2;
      else if (cooper.x > gb.x + gb.w) nx = gb.x + gb.w + 2;
      else if (cooper.y < gb.y) ny = gb.y - 2;
      else ny = gb.y + gb.h + 2;
    }
  }
  if (nx > map.shed.x && nx < map.shed.x + map.shed.w &&
      ny > map.shed.y && ny < map.shed.y + map.shed.h) {
    if (cooper.x < map.shed.x) nx = map.shed.x - 2;
    else if (cooper.x > map.shed.x + map.shed.w) nx = map.shed.x + map.shed.w + 2;
    else if (cooper.y < map.shed.y) ny = map.shed.y - 2;
    else ny = map.shed.y + map.shed.h + 2;
  }

  cooper.x = nx;
  cooper.y = ny;
}

function handleInteraction() {
  if (player.onShed) return;
  if (abilities.charlet.active) return;

  const gb = map.gardenBeds[1];
  if (!player.onGardenBed && !player.onShed) {
    if (player.x > gb.x - 20 && player.x < gb.x + gb.w + 20 &&
        player.y > gb.y - 20 && player.y < gb.y + gb.h + 40) {
      player.x = gb.x + gb.w / 2;
      player.y = gb.y - 6;
      player.onGardenBed = true;
      showMessage('You climb onto the raised garden bed!', 2);
      addParticle(player.x, player.y + 5, '#a0522d', 0.5);
      return;
    }
  }

  if (player.onGardenBed && !player.onShed) {
    if (player.x > map.shed.x - 25 && player.x < map.shed.x + 30) {
      startClimbAnimation();
      return;
    }
  }
}

function updateShedTop(dt) {
  const { dx, dy } = readMove();
  if (dx !== 0 || dy !== 0) player.walkPhase += dt * 8;

  const speed = PLAYER_SPEED;
  let nx = player.x + dx * speed * dt;
  let ny = player.y + dy * speed * dt;

  nx = clamp(nx, map.shed.x + 4, map.shed.x + map.shed.w - 4);
  ny = clamp(ny, map.shed.y - 22, map.shed.y - 2);
  player.x = nx;
  player.y = ny;

  if (justPressed['e'] || justPressed['enter'] || justPressed[' ']) {
    justPressed['e'] = false;
    justPressed['enter'] = false;
    justPressed[' '] = false;
    startCutscene();
  }
}

function updateCutscene(dt) {
  cutsceneT -= dt;
  cutsceneAnimT += dt;
  if (cutsceneT <= 0) advanceCutsceneLine();
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function resolveCollisionX(x, y) {
  for (const t of map.trees) {
    if (x > t.x - t.r && x < t.x + t.r && y > t.y - t.r && y < t.y + t.r) {
      if (player.x < t.x - t.r) x = t.x - t.r - 1;
      else if (player.x > t.x + t.r) x = t.x + t.r + 1;
    }
  }
  for (const bt of map.bananaTrees) {
    if (x > bt.x - 16 && x < bt.x + 16 && y > bt.y - 16 && y < bt.y + 16) {
      if (player.x < bt.x) x = bt.x - 17;
      else x = bt.x + 17;
    }
  }
  for (const gb of map.gardenBeds) {
    if (x > gb.x && x < gb.x + gb.w && y > gb.y - 4 && y < gb.y + gb.h) {
      if (player.x < gb.x) x = gb.x - 1;
      else x = gb.x + gb.w + 1;
    }
  }
  if (!player.onShed) {
    if (x > map.shed.x && x < map.shed.x + map.shed.w &&
        y > map.shed.y + 8 && y < map.shed.y + map.shed.h) {
      if (player.x < map.shed.x) x = map.shed.x - 1;
      else x = map.shed.x + map.shed.w + 1;
    }
  }
  if (x > map.pool.x && x < map.pool.x + map.pool.w &&
      y > map.pool.y && y < map.pool.y + map.pool.h) {
    if (player.x < map.pool.x) x = map.pool.x - 1;
    else if (player.x > map.pool.x + map.pool.w) x = map.pool.x + map.pool.w + 1;
    else if (player.y < map.pool.y) y = map.pool.y - 1;
    else y = map.pool.y + map.pool.h + 1;
  }
  return x;
}

function resolveCollisionY(x, y) {
  for (const t of map.trees) {
    if (x > t.x - t.r && x < t.x + t.r && y > t.y - t.r && y < t.y + t.r) {
      if (player.y < t.y) y = t.y - t.r - 1;
      else y = t.y + t.r + 1;
    }
  }
  for (const bt of map.bananaTrees) {
    if (x > bt.x - 16 && x < bt.x + 16 && y > bt.y - 16 && y < bt.y + 16) {
      if (player.y < bt.y) y = bt.y - 17;
      else y = bt.y + 17;
    }
  }
  for (const gb of map.gardenBeds) {
    if (x > gb.x && x < gb.x + gb.w && y > gb.y && y < gb.y + gb.h) {
      if (player.y < gb.y) y = gb.y - 1;
      else y = gb.y + gb.h + 1;
    }
  }
  if (!player.onShed) {
    if (x > map.shed.x && x < map.shed.x + map.shed.w &&
        y > map.shed.y && y < map.shed.y + map.shed.h) {
      if (player.y < map.shed.y) y = map.shed.y - 1;
      else y = map.shed.y + map.shed.h + 1;
    }
  }
  if (x > map.pool.x && x < map.pool.x + map.pool.w &&
      y > map.pool.y && y < map.pool.y + map.pool.h) {
    if (player.y < map.pool.y) y = map.pool.y - 1;
    else y = map.pool.y + map.pool.h + 1;
  }
  return y;
}

// ============================================================
// RENDERING
// ============================================================
function render() {
  ctx.fillStyle = '#06061a';
  ctx.fillRect(0, 0, W, H);

  if (state === 'menu') renderMenu();
  else if (state === 'coop') renderCoop();
  else if (state === 'backyard' || state === 'climbing') renderBackyard();
  else if (state === 'shedTop') renderBackyard();
  else if (state === 'cutscene') renderCutscene();
  else if (state === 'ending') renderEnding();

  renderParticles();
  renderHUD();
  if (message) renderMessage();
}

function renderParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 3, 3);
  }
  ctx.globalAlpha = 1;
}

// ---- NIGHT SKY ----
function drawNightSky() {
  const grd = ctx.createLinearGradient(0, 0, 0, 140);
  grd.addColorStop(0, '#020210');
  grd.addColorStop(0.5, '#06062a');
  grd.addColorStop(1, '#0e0e36');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, 140);

  // Stars (twinkling with multiple sizes)
  for (let i = 0; i < 90; i++) {
    const x = (i * 173 + 11) % W;
    const y = ((i * 67) % 110) + 4;
    const t = Math.sin(gameTime * 1.6 + i * 0.7);
    if (t > 0.5) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, 2, 2);
      if (i % 5 === 0) {
        // Star burst
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(x - 1, y, 1, 1);
        ctx.fillRect(x + 2, y, 1, 1);
        ctx.fillRect(x, y - 1, 2, 1);
        ctx.fillRect(x, y + 2, 2, 1);
      }
    } else if (t > 0) {
      ctx.fillStyle = '#dddddd';
      ctx.fillRect(x, y, 1, 1);
    } else {
      ctx.fillStyle = '#777';
      ctx.fillRect(x, y, 1, 1);
    }
  }

  // Moon (much more detailed with craters and shading)
  const mx = W - 100, my = 30;
  // Outer glow
  const glow = ctx.createRadialGradient(mx + 16, my + 16, 6, mx + 16, my + 16, 50);
  glow.addColorStop(0, 'rgba(255, 245, 200, 0.25)');
  glow.addColorStop(1, 'rgba(255, 245, 200, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(mx - 40, my - 40, 110, 110);
  // Moon body
  ctx.fillStyle = '#e8e6d4';
  ctx.fillRect(mx, my, 32, 32);
  // Highlight side
  ctx.fillStyle = '#fff5dc';
  ctx.fillRect(mx, my, 16, 32);
  // Shadow side
  ctx.fillStyle = '#bdb99e';
  ctx.fillRect(mx + 24, my, 8, 32);
  ctx.fillRect(mx + 16, my + 8, 16, 24);
  // Craters
  ctx.fillStyle = '#cecbb6';
  ctx.fillRect(mx + 6, my + 6, 5, 5);
  ctx.fillRect(mx + 4, my + 8, 3, 3);
  ctx.fillRect(mx + 16, my + 14, 4, 4);
  ctx.fillRect(mx + 8, my + 20, 6, 4);
  ctx.fillRect(mx + 22, my + 22, 4, 3);
  // Tiny crater dots
  ctx.fillStyle = '#b8b59a';
  ctx.fillRect(mx + 20, my + 6, 2, 2);
  ctx.fillRect(mx + 12, my + 16, 2, 2);
  ctx.fillRect(mx + 26, my + 14, 2, 2);

  // Distant clouds (subtle)
  ctx.fillStyle = 'rgba(40, 40, 80, 0.3)';
  for (let i = 0; i < 3; i++) {
    const cx = ((i * 270 + gameTime * 4) % (W + 100)) - 50;
    const cy = 40 + i * 18;
    ctx.fillRect(cx, cy, 60, 4);
    ctx.fillRect(cx + 8, cy - 2, 44, 3);
  }
}

function drawNeighborSky() {
  const grd = ctx.createLinearGradient(0, 0, 0, 220);
  grd.addColorStop(0, '#0a0420');
  grd.addColorStop(0.5, '#1a1438');
  grd.addColorStop(1, '#3a1848');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, 220);

  for (let i = 0; i < 110; i++) {
    const x = (i * 191 + 7) % W;
    const y = ((i * 53) % 160) + 4;
    const t = Math.sin(gameTime * 1.8 + i * 0.9);
    if (t > 0.4) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, 2, 2);
    } else if (t > 0) {
      ctx.fillStyle = '#e0e0ff';
      ctx.fillRect(x, y, 1, 1);
    } else {
      ctx.fillStyle = '#888';
      ctx.fillRect(x, y, 1, 1);
    }
  }

  // Crescent moon (different from home yard)
  const mx = 130, my = 38;
  ctx.fillStyle = '#e8e6d4';
  ctx.fillRect(mx, my, 26, 26);
  ctx.fillStyle = '#3a1848';
  ctx.beginPath();
  ctx.arc(mx + 18, my + 13, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#cecbb6';
  ctx.fillRect(mx + 4, my + 8, 3, 3);
  ctx.fillRect(mx + 8, my + 16, 4, 3);
}

function drawGround() {
  // Multi-layer grass for depth
  ctx.fillStyle = '#102a08';
  ctx.fillRect(0, 100, W, H);

  // Mid-grass
  ctx.fillStyle = '#1a3a10';
  for (let x = 0; x < W; x += 6) {
    for (let y = 110; y < H; y += 10) {
      const o = ((x * 13 + y * 7) % 17);
      if (o < 6) {
        ctx.fillRect(x + (o % 4), y + (o % 3), 2, 3);
        // grass blade highlights
        if (o === 0) {
          ctx.fillStyle = '#2a5a18';
          ctx.fillRect(x, y, 1, 2);
          ctx.fillStyle = '#1a3a10';
        }
      }
    }
  }
  // Dark patches
  ctx.fillStyle = '#0a1a05';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137 + 31) % W;
    const y = 130 + ((i * 53) % (H - 150));
    ctx.fillRect(x, y, 5, 3);
    ctx.fillRect(x + 6, y + 2, 3, 2);
  }
  // Little dirt path
  ctx.fillStyle = '#5a4220';
  ctx.fillRect(0, 555, W, 18);
  ctx.fillStyle = '#7a5a30';
  ctx.fillRect(0, 555, W, 2);
  ctx.fillStyle = '#3a2810';
  for (let x = 0; x < W; x += 12) {
    ctx.fillRect(x, 565, 4, 2);
  }
}

function drawNeighborGround() {
  ctx.fillStyle = '#0e2a18';
  ctx.fillRect(0, 200, W, H - 200);

  ctx.fillStyle = '#1a4228';
  for (let x = 0; x < W; x += 5) {
    for (let y = 215; y < H; y += 10) {
      const o = ((x * 11 + y * 5) % 13);
      if (o < 5) ctx.fillRect(x + (o % 3), y + (o % 3), 2, 3);
    }
  }
  ctx.fillStyle = '#08201a';
  for (let i = 0; i < 30; i++) {
    const x = (i * 113 + 51) % W;
    const y = 230 + ((i * 47) % (H - 250));
    ctx.fillRect(x, y, 4, 3);
  }
  // Stone path tiles (better)
  ctx.fillStyle = '#3a4a5a';
  for (let i = 0; i < 6; i++) {
    const x = 80 + i * 130;
    const y = 340 + (i % 2) * 18;
    ctx.fillRect(x, y, 28, 16);
    ctx.fillStyle = '#5a6a7a';
    ctx.fillRect(x, y, 28, 2);
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(x + 2, y + 4, 24, 10);
    ctx.fillStyle = '#1a2a3a';
    ctx.fillRect(x + 4, y + 6, 20, 6);
    ctx.fillStyle = '#3a4a5a';
  }
}

// ---- MENU ----
function renderMenu() {
  drawNightSky();
  ctx.fillStyle = '#0a1a05';
  ctx.fillRect(0, 100, W, H - 100);

  // Title with glow effect
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 204, 102, 0.3)';
  ctx.font = 'bold 56px Courier New';
  ctx.fillText('COOP QUEST', W / 2 + 2, 92);
  ctx.fillStyle = '#ffcc66';
  ctx.font = 'bold 52px Courier New';
  ctx.fillText('COOP QUEST', W / 2, 90);

  ctx.fillStyle = '#aaaacc';
  ctx.font = '18px Courier New';
  ctx.fillText('A Nighttime Chicken Escape', W / 2, 118);

  ctx.fillStyle = '#888';
  ctx.font = '13px Courier New';
  ctx.fillText('Click a chicken to start your story', W / 2, 175);

  // Cards
  const cardW = 210, cardH = 300, gap = 30;
  const totalW = cardW * 3 + gap * 2;
  const startX = (W - totalW) / 2;
  const startY = 210;

  for (let i = 0; i < 3; i++) {
    const ch = chars[i];
    const cx = startX + i * (cardW + gap);
    const cy = startY;

    // Card shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(cx + 4, cy + 4, cardW, cardH);

    // Card bg with gradient
    const cardGrad = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
    cardGrad.addColorStop(0, '#1c1c38');
    cardGrad.addColorStop(1, '#0e0e22');
    ctx.fillStyle = cardGrad;
    ctx.fillRect(cx, cy, cardW, cardH);

    // Border (thicker for more presence)
    ctx.fillStyle = ch.color;
    ctx.fillRect(cx, cy, cardW, 5);
    ctx.fillRect(cx, cy + cardH - 5, cardW, 5);
    ctx.fillRect(cx, cy, 5, cardH);
    ctx.fillRect(cx + cardW - 5, cy, 5, cardH);
    // Inner border highlight
    ctx.fillStyle = ch.color + '88';
    ctx.fillRect(cx + 5, cy + 5, cardW - 10, 2);
    ctx.fillRect(cx + 5, cy + cardH - 7, cardW - 10, 2);

    // Name
    ctx.fillStyle = ch.color;
    ctx.font = 'bold 28px Courier New';
    ctx.fillText(ch.name, cx + cardW / 2, cy + 38);
    // Name underline
    ctx.fillStyle = ch.color + '66';
    ctx.fillRect(cx + 30, cy + 44, cardW - 60, 1);

    // Portrait (bigger, with platform shadow)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(cx + cardW / 2 - 30, cy + 160, 60, 6);
    drawChickenScaled(cx + cardW / 2, cy + 130, ch.id, 1, 2.4);

    // Description
    ctx.font = '12px Courier New';
    for (let j = 0; j < ch.desc.length; j++) {
      ctx.fillStyle = j === 0 ? '#fff' : (j === 1 ? ch.color : '#bbb');
      ctx.fillText(ch.desc[j], cx + cardW / 2, cy + 210 + j * 18);
    }

    // "Click to play" at bottom
    const pulse = 0.7 + 0.3 * Math.abs(Math.sin(gameTime * 2.5));
    ctx.fillStyle = `rgba(204, 204, 204, ${pulse})`;
    ctx.font = '11px Courier New';
    ctx.fillText('[ CLICK TO PLAY ]', cx + cardW / 2, cy + cardH - 14);
  }

  // Game info
  ctx.fillStyle = '#888';
  ctx.font = '12px Courier New';
  ctx.fillText('Escape the backyard • Avoid Cooper • Climb the shed • Fly to the neighbor\'s yard', W / 2, 540);
  ctx.fillText('Three possible endings await...', W / 2, 560);
}

// ---- COOP ----

  drawNightSky();

  // Coop interior (wood, dim)
  ctx.fillStyle = '#3a2818';
  ctx.fillRect(map.coop.x, map.coop.y, map.coop.w, map.coop.h);

  // Wood grain detail
  ctx.fillStyle = '#2a1808';
  for (let y = map.coop.y + 8; y < map.coopFloorY; y += 18) {
    ctx.fillRect(map.coop.x, y, map.coop.w, 2);
  }
  // vertical grain
  ctx.fillStyle = '#4a3220';
  for (let x = map.coop.x + 12; x < map.coop.x + map.coop.w; x += 24) {
    ctx.fillRect(x, map.coop.y + 4, 1, map.coop.h - 10);

  ctx.fillStyle = '#4a3220';
  ctx.fillRect(map.coop.x, map.coopFloorY - 6, map.coop.w, map.coop.h - (map.coopFloorY - map.coop.y - 6));
  // Floor planks
  ctx.fillStyle = '#3a2010';
  for (let x = map.coop.x; x < map.coop.x + map.coop.w; x += 18) {
    ctx.fillRect(x, map.coopFloorY - 6, 1, map.coop.h - (map.coopFloorY - map.coop.y - 6));
  }
  // Hay/straw on floor
  ctx.fillStyle = '#c8a850';
  for (let i = 0; i < 25; i++) {
    const hx = map.coop.x + 5 + (i * 7) % (map.coop.w - 10);
    const hy = map.coopFloorY + 5 + ((i * 13) % 25);
    ctx.fillRect(hx, hy, 3, 1);
    ctx.fillRect(hx + 2, hy + 2, 2, 1);
  }

  // Window
  ctx.fillStyle = '#0a1a30';
  ctx.fillRect(45, 215, 50, 35);
  ctx.fillStyle = '#152545';
  ctx.fillRect(47, 217, 46, 31);
  // Cross frame
  ctx.fillStyle = '#3a2818';
  ctx.fillRect(45, 230, 50, 3);
  ctx.fillRect(68, 215, 3, 35);
  // Stars through window
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(55, 222, 2, 2);
  ctx.fillRect(75, 232, 2, 2);
  ctx.fillRect(85, 240, 2, 2);
  ctx.fillRect(60, 238, 1, 1);
  ctx.fillStyle = '#aaccff';

// ---- BACKYARD ----
function renderBackyard() {
  drawNightSky();
  drawGround();

  for (const bt of map.bananaTrees) drawBananaTree(bt.x, bt.y);
  for (const t of map.trees) drawTree(t.x, t.y, t.r);
  drawPool();
  for (const gb of map.gardenBeds) drawGardenBed(gb.x, gb.y, gb.w, gb.h);
  drawShed();

  const visible = !(cooper.state === 'stunned' && Math.floor(gameTime * 9) % 2 === 0);
  if (visible) drawCooper(cooper.x, cooper.y);

  if (cooper.state === 'chasing') {
    ctx.save();
    ctx.strokeStyle = `rgba(255, 80, 80, ${0.18 + 0.08 * Math.sin(gameTime * 6)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cooper.x, cooper.y, cooper.visionRange, 0, Math.PI * 2);
    ctx.stroke();
    // Pulsing inner ring
    ctx.strokeStyle = `rgba(255, 100, 100, ${0.08 + 0.05 * Math.sin(gameTime * 8)})`;
    ctx.beginPath();
    ctx.arc(cooper.x, cooper.y, cooper.visionRange * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  if (cooper.state === 'stunned') {
    ctx.save();
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    const wob = Math.sin(gameTime * 8) * 4;
    ctx.fillText('★', cooper.x - 14 + wob, cooper.y - 22);
    ctx.fillText('★', cooper.x + 14 - wob, cooper.y - 26);
    ctx.fillText('★', cooper.x, cooper.y - 32);
    ctx.fillText('?', cooper.x - 18, cooper.y - 14);
    ctx.fillText('?', cooper.x + 18, cooper.y - 14);
    ctx.restore();
  }

  if (abilities.charlet.active) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(gameTime * 5);
    ctx.strokeStyle = '#66ccff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#66ccff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawMullet(player.x, player.y);
  } else {
    drawChicken(player.x, player.y, character, player.facing, 1, player.height);
  }

  if (abilities.spot.active) {
    drawBlackHole(abilities.spot.x, abilities.spot.y, abilities.spot.animT);
  }

  if (state === 'backyard') drawInteractHint();

  if (character === 'spot' && !abilities.spot.active && abilities.spot.cooldown <= 0 &&
      (state === 'backyard' || state === 'shedTop' || state === 'climbing')) {
    ctx.strokeStyle = 'rgba(204, 102, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(204, 102, 255, 0.5)';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('R-CLICK', mouseX, mouseY - 22);
  }
}

function drawInteractHint() {
  let prompt = null;

  if (state === 'shedTop') {
    prompt = '[E] FLY OVER THE FENCE →';
  } else if (state === 'climbing') {
    prompt = '↑ CLIMBING ↑';
  } else if (!player.onShed && !player.onGardenBed && !abilities.charlet.active) {
    const gb = map.gardenBeds[1];
    if (player.x > gb.x - 30 && player.x < gb.x + gb.w + 30 &&
        player.y > gb.y - 30 && player.y < gb.y + gb.h + 50) {
      prompt = '[E] CLIMB GARDEN BED';
    }
  } else if (player.onGardenBed && !player.onShed) {
    if (player.x > map.shed.x - 30 && player.x < map.shed.x + 35) {
      prompt = '[E] CLIMB SHED ROOF';
    }
  }

  if (prompt) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(W / 2 - 140, 30, 280, 30);
    ctx.fillStyle = '#ffcc66';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(prompt, W / 2, 50);
  }
}

function drawTree(x, y, r) {

  ctx.fillRect(x - r + 8, y + r + 2, r * 2 - 8, 3);

  // Trunk (layered for shading)
  ctx.fillStyle = '#2a1808';
  ctx.fillRect(x - 6, y - 4, 12, 24);
  ctx.fillStyle = '#3a2810';
  ctx.fillRect(x - 5, y - 2, 10, 22);
  ctx.fillStyle = '#4a3818';
  ctx.fillRect(x - 3, y - 2, 4, 22);
  ctx.fillStyle = '#5a4828';
  ctx.fillRect(x - 3, y, 1, 20);
  // Bark texture
  ctx.fillStyle = '#2a1808';
  ctx.fillRect(x - 2, y + 4, 1, 4);
  ctx.fillRect(x + 2, y + 10, 1, 6);
  ctx.fillRect(x - 1, y + 14, 1, 3);

  // Canopy layers (back to front for depth)
  ctx.fillStyle = '#050a02';
  ctx.fillRect(x - r - 2, y - r - 2, r * 2 + 4, r + 2);
  ctx.fillStyle = '#0a2008';
  ctx.fillRect(x - r, y - r, r * 2, r);
  ctx.fillStyle = '#143818';
  ctx.fillRect(x - r + 4, y - r + 4, r * 2 - 8, r - 6);
  ctx.fillStyle = '#1f4a25';
  ctx.fillRect(x - r + 8, y - r + 10, r * 2 - 16, r - 14);
  ctx.fillStyle = '#2a5a30';
  ctx.fillRect(x - r + 12, y - r + 6, r * 2 - 24, r - 18);
  ctx.fillStyle = '#3a6a40';
  ctx.fillRect(x - 10, y - r + 4, 12, 8);
  // Little moon-lit highlights
  ctx.fillStyle = '#5a8a50';
  ctx.fillRect(x - r + 16, y - r + 2, 3, 3);
  ctx.fillRect(x + r - 18, y - 4, 3, 3);

  ctx.fillStyle = '#1a4020';
  ctx.fillRect(x - 14, y - 8, 5, 4);
  ctx.fillRect(x + 10, y - 10, 4, 3);

  ctx.fillStyle = '#2a5028';

}

function drawPool() {
  // Pool deck (more detail)
  ctx.fillStyle = '#5a4838';
  ctx.fillRect(map.pool.x - 14, map.pool.y - 14, map.pool.w + 28, map.pool.h + 28);
  ctx.fillStyle = '#7a6848';
  ctx.fillRect(map.pool.x - 14, map.pool.y - 14, map.pool.w + 28, 4);
  ctx.fillStyle = '#3a2818';
  for (let x = map.pool.x - 14; x < map.pool.x + map.pool.w + 14; x += 14) {
    ctx.fillRect(x, map.pool.y - 14, 1, map.pool.h + 28);
  }

  // fence
  ctx.fillStyle = '#3a2810';
  ctx.fillRect(map.poolFence.x, map.poolFence.y, map.poolFence.w, map.poolFence.h);
  // fence posts
  ctx.fillStyle = '#5a4028';
  for (let x = map.poolFence.x; x <= map.poolFence.x + map.poolFence.w; x += 16) {
    ctx.fillRect(x, map.poolFence.y - 6, 4, 16);
    ctx.fillStyle = '#7a5028';
    ctx.fillRect(x, map.poolFence.y - 6, 4, 2);
    ctx.fillStyle = '#5a4028';
  }
  // top rail
  ctx.fillStyle = '#6a5038';
  ctx.fillRect(map.poolFence.x, map.poolFence.y - 2, map.poolFence.w, 3);
  ctx.fillStyle = '#4a3018';
  ctx.fillRect(map.poolFence.x, map.poolFence.y + map.poolFence.h - 1, map.poolFence.w, 2);

  // Pool tile edge
  ctx.fillStyle = '#aa8858';
  ctx.fillRect(map.pool.x - 4, map.pool.y - 4, map.pool.w + 8, 4);
  ctx.fillRect(map.pool.x - 4, map.pool.y + map.pool.h, map.pool.w + 8, 4);
  ctx.fillRect(map.pool.x - 4, map.pool.y - 4, 4, map.pool.h + 8);
  ctx.fillRect(map.pool.x + map.pool.w, map.pool.y - 4, 4, map.pool.h + 8);

  // water (gradient)
  const waterGrad = ctx.createLinearGradient(map.pool.x, map.pool.y, map.pool.x, map.pool.y + map.pool.h);
  waterGrad.addColorStop(0, '#1a3858');
  waterGrad.addColorStop(0.5, '#0e2848');
  waterGrad.addColorStop(1, '#081830');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(map.pool.x, map.pool.y, map.pool.w, map.pool.h);

  // ripples (animated, more detail)
  ctx.fillStyle = '#3a5878';
  for (let i = 0; i < 5; i++) {
    const rx = map.pool.x + 12 + ((i * 35 + gameTime * 18) % (map.pool.w - 24));
    const ry = map.pool.y + 20 + i * 26;
    ctx.fillRect(rx, ry, 22, 2);
    ctx.fillStyle = '#5a7898';
    ctx.fillRect(rx + 2, ry - 1, 18, 1);
    ctx.fillStyle = '#3a5878';
  }
  ctx.fillStyle = '#6a98b8';
  for (let i = 0; i < 4; i++) {
    const rx = map.pool.x + 30 + ((i * 50 + gameTime * 10) % (map.pool.w - 50));
    const ry = map.pool.y + 35 + i * 28;
    ctx.fillRect(rx, ry, 12, 1);
  }
  // Caustic highlights
  ctx.fillStyle = 'rgba(150, 200, 255, 0.3)';
  for (let i = 0; i < 6; i++) {
    const cx = map.pool.x + 20 + ((i * 31 + gameTime * 25) % (map.pool.w - 30));
    const cy = map.pool.y + 15 + ((i * 23 + gameTime * 18) % (map.pool.h - 30));
    ctx.fillRect(cx, cy, 3, 1);
  }

  // Pool ladder
  ctx.fillStyle = '#888';
  ctx.fillRect(map.pool.x + 10, map.pool.y + 10, 2, 20);
  ctx.fillRect(map.pool.x + 18, map.pool.y + 10, 2, 20);
  ctx.fillStyle = '#aaa';
  for (let y = map.pool.y + 12; y < map.pool.y + 30; y += 4) {
    ctx.fillRect(map.pool.x + 10, y, 10, 1);
  }

  // Pool float (ring)
  ctx.save();
  const floatX = map.pool.x + map.pool.w - 30;
  const floatY = map.pool.y + map.pool.h - 30;
  const floatBob = Math.sin(gameTime * 1.5) * 2;
  ctx.fillStyle = '#dd4444';
  ctx.fillRect(floatX - 6, floatY - 2 + floatBob, 12, 4);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(floatX - 6, floatY - 1 + floatBob, 12, 2);
  ctx.fillStyle = '#aa2222';
  ctx.fillRect(floatX - 6, floatY + 1 + floatBob, 12, 1);
  ctx.restore();

  // "POOL" sign
  ctx.fillStyle = '#3a2810';
  ctx.fillRect(map.pool.x + map.pool.w / 2 - 22, map.pool.y - 32, 44, 16);
  ctx.fillStyle = '#5a3818';
  ctx.fillRect(map.pool.x + map.pool.w / 2 - 22, map.pool.y - 32, 44, 2);
  ctx.fillStyle = '#aaccff';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('POOL', map.pool.x + map.pool.w / 2, map.pool.y - 20);
}

function drawChickenScaled(cx, cy, charId, facing, scale) {

// ===== IMPROVED CHICKEN SPRITE =====
function drawChickenInternal(charId, facing) {
  let bodyMain, bodyLight, bodyDark, bodyShadow;
  let headCol, headLight, headDark;
  let combCol, combLight, combDark;
  let beakCol, beakLight, beakDark;
  let legCol, legDark;
  let tailCol, tailAccent, tailDark;
  let wingCol;

  if (charId === 'terry') {
    bodyMain = '#ffffff';
    bodyLight = '#fff8ec';
    bodyDark = '#d8d0c0';
    bodyShadow = '#a8a090';
    headCol = '#ff8838';
    headLight = '#ffaa66';
    headDark = '#cc5010';
    combCol = '#dd2222';
    combLight = '#ff4444';
    combDark = '#aa0000';
    beakCol = '#ffcc00';
    beakLight = '#ffdd44';
    beakDark = '#aa6611';
    legCol = '#ffcc00';
    legDark = '#aa6611';
    tailCol = '#ffffff';
    tailAccent = '#ff8838';
    tailDark = '#c8b8a8';
    wingCol = '#f0e8d8';
  } else if (charId === 'spot') {
    bodyMain = '#f8f4f0';
    bodyLight = '#ffffff';
    bodyDark = '#d8d0c8';
    bodyShadow = '#a8a098';
    headCol = '#f0e0d0';
    headLight = '#fff8e8';
    headDark = '#c8b8a8';
    combCol = '#dd2222';
    combLight = '#ff4444';
    combDark = '#aa0000';
    beakCol = '#ffcc00';
    beakLight = '#ffdd44';
    beakDark = '#aa6611';
    legCol = '#ffcc00';
    legDark = '#aa6611';
    tailCol = '#f0e8e0';
    tailAccent = '#1a1a1a';
    tailDark = '#b8b0a8';
    wingCol = '#ece4dc';
  } else {
    // Charlet - mature brown hen
    bodyMain = '#8a5a30';
    bodyLight = '#a87040';
    bodyDark = '#5a3818';
    bodyShadow = '#3a2008';
    headCol = '#5a3818';
    headLight = '#7a5028';
    headDark = '#3a2008';
    combCol = '#cc1111';
    combLight = '#ee3333';
    combDark = '#8a0000';
    beakCol = '#dd9933';
    beakLight = '#eeaa55';
    beakDark = '#885511';
    legCol = '#cc8833';
    legDark = '#774411';
    tailCol = '#3a2008';
    tailAccent = '#5a3818';
    tailDark = '#1a0e04';
    wingCol = '#6a4020';
  }

  const dir = facing;
  const breath = Math.sin(gameTime * 3) * 0.5;
  const wf = Math.floor(player.walkPhase) % 2;
  const tailWag = Math.sin(gameTime * 6) * 2;

  // TAIL FEATHERS (back layer) - multiple layered feathers
  ctx.fillStyle = tailDark;
  if (dir > 0) {
    ctx.fillRect(-22, -2, 6, 10);
    ctx.fillRect(-20, -8, 8, 18);
  } else {
    ctx.fillRect(16, -2, 6, 10);
    ctx.fillRect(12, -8, 8, 18);
  }
  ctx.fillStyle = tailCol;
  if (dir > 0) {
    // Long elegant sickle feathers (Terry has dramatic tail)
    ctx.fillRect(-20, -4 + tailWag * 0.3, 6, 12);
    ctx.fillRect(-16, -7 + tailWag * 0.3, 5, 16);
    ctx.fillRect(-12, -8 + tailWag * 0.3, 5, 14);
    ctx.fillRect(-19, 6 + tailWag * 0.3, 4, 4);
  } else {
    ctx.fillRect(14, -4 - tailWag * 0.3, 6, 12);
    ctx.fillRect(11, -7 - tailWag * 0.3, 5, 16);
    ctx.fillRect(7, -8 - tailWag * 0.3, 5, 14);
    ctx.fillRect(15, 6 - tailWag * 0.3, 4, 4);
  }
  // Tail accent color (Terry: orange tips; Spot: dark; Charlet: darker brown)
  ctx.fillStyle = tailAccent;
  if (dir > 0) {
    if (charId === 'terry') {
      ctx.fillRect(-20, 4, 5, 3);
      ctx.fillRect(-16, 5, 4, 3);
      ctx.fillRect(-12, 4, 4, 3);
    }
  } else {
    if (charId === 'terry') {
      ctx.fillRect(15, 4, 5, 3);
      ctx.fillRect(12, 5, 4, 3);
      ctx.fillRect(8, 4, 4, 3);
    }
  }

  // BODY (with depth shading)
  ctx.fillStyle = bodyShadow;
  ctx.fillRect(-12, 4, 24, 8);
  ctx.fillStyle = bodyDark;
  ctx.fillRect(-12, 0, 24, 14);
  ctx.fillStyle = bodyMain;
  ctx.fillRect(-12, -4, 24, 14);
  ctx.fillStyle = bodyLight;
  ctx.fillRect(-12, -4, 24, 4);

  // Orange chest (Terry) or characteristic marking for others
  if (charId === 'terry') {
    ctx.fillStyle = '#cc5010';
    ctx.fillRect(2, -2, 10, 8);
    ctx.fillStyle = '#ff8838';
    ctx.fillRect(2, -2, 10, 6);
    ctx.fillStyle = '#ffaa66';
    ctx.fillRect(2, -2, 10, 2);
  } else if (charId === 'charlet') {
    // Lighter brown chest
    ctx.fillStyle = '#a87040';
    ctx.fillRect(2, -2, 10, 8);
    ctx.fillStyle = '#c08850';
    ctx.fillRect(2, -2, 10, 2);
  }

  // WING (folded, layered)
  ctx.fillStyle = bodyDark;
  if (dir > 0) {
    ctx.fillRect(-10, -2, 10, 10);
  } else {
    ctx.fillRect(0, -2, 10, 10);
  }
  ctx.fillStyle = wingCol;
  if (dir > 0) {
    ctx.fillRect(-10, -2, 10, 8);
    ctx.fillStyle = bodyLight;
    ctx.fillRect(-10, -2, 10, 2);
    // Wing feather lines
    ctx.fillStyle = bodyDark;
    ctx.fillRect(-8, 0, 1, 5);
    ctx.fillRect(-5, 0, 1, 5);
    ctx.fillRect(-2, 0, 1, 5);
  } else {
    ctx.fillRect(0, -2, 10, 8);
    ctx.fillStyle = bodyLight;
    ctx.fillRect(0, -2, 10, 2);
    ctx.fillStyle = bodyDark;
    ctx.fillRect(3, 0, 1, 5);
    ctx.fillRect(6, 0, 1, 5);
    ctx.fillRect(9, 0, 1, 5);
  }

  // HEAD (with shading)
  ctx.fillStyle = headDark;
  if (dir > 0) {
    ctx.fillRect(2, -10, 12, 12);
  } else {
    ctx.fillRect(-14, -10, 12, 12);
  }
  ctx.fillStyle = headCol;
  if (dir > 0) {
    ctx.fillRect(2, -14, 12, 12);
  } else {
    ctx.fillRect(-14, -14, 12, 12);
  }
  ctx.fillStyle = headLight;
  if (dir > 0) {

    ctx.fillRect(-12, -21, 7, 4);
    ctx.fillRect(-11, -24, 4, 3);

    ctx.fillRect(6, -21, 2, 1);
    ctx.fillRect(8, -24, 2, 1);
  } else {
    ctx.fillRect(-7, -17, 3, 1);
    ctx.fillRect(-8, -21, 2, 1);
    ctx.fillRect(-9, -24, 2, 1);

  // BEAK (two-tone with shading)
  ctx.fillStyle = beakDark;
  if (dir > 0) {
    ctx.fillRect(14, -9, 7, 4);
  } else {

  if (dir > 0) {
    ctx.fillRect(14, -11, 7, 4);
  } else {
    ctx.fillRect(-21, -11, 7, 4);
  }

  if (dir > 0) {
    ctx.fillRect(14, -11, 7, 1);
  } else {
    ctx.fillRect(-21, -11, 7, 1);
  }
  // Beak split line
  ctx.fillStyle = beakDark;
  if (dir > 0) {
    ctx.fillRect(14, -8, 7, 1);
  } else {
    ctx.fillRect(-21, -8, 7, 1);
  }

  // EYE (with iris and highlight)
  ctx.fillStyle = '#fff';
  if (dir > 0) {
    ctx.fillRect(7, -12, 5, 5);
  } else {
    ctx.fillRect(-12, -12, 5, 5);
  }
  ctx.fillStyle = '#ffaa00';
  if (dir > 0) {
    ctx.fillRect(8, -11, 3, 4);
  } else {
    ctx.fillRect(-11, -11, 3, 4);
  }
  ctx.fillStyle = '#000';
  if (dir > 0) {
    ctx.fillRect(9, -10, 2, 3);
  } else {
    ctx.fillRect(-11, -10, 2, 3);
  }
  // Eye highlight
  ctx.fillStyle = '#fff';
  if (dir > 0) {
    ctx.fillRect(10, -10, 1, 1);
  } else {
    ctx.fillRect(-10, -10, 1, 1);
  }
  // Eye outline
  ctx.fillStyle = '#000';
  if (dir > 0) {
    ctx.fillRect(7, -12, 5, 1);
    ctx.fillRect(7, -8, 5, 1);
  } else {
    ctx.fillRect(-12, -12, 5, 1);
    ctx.fillRect(-12, -8, 5, 1);
  }

  // WATTLE (two lobes with shading)
  ctx.fillStyle = combDark;
  if (dir > 0) {
    ctx.fillRect(8, -2, 5, 6);
    ctx.fillRect(10, 3, 3, 3);
  } else {
    ctx.fillRect(-13, -2, 5, 6);
    ctx.fillRect(-13, 3, 3, 3);
  }
  ctx.fillStyle = combCol;
  if (dir > 0) {
    ctx.fillRect(8, -2, 5, 4);
    ctx.fillRect(10, 3, 3, 2);
  } else {
    ctx.fillRect(-13, -2, 5, 4);
    ctx.fillRect(-13, 3, 3, 2);
  }
  ctx.fillStyle = combLight;
  if (dir > 0) {
    ctx.fillRect(8, -2, 2, 1);
  } else {
    ctx.fillRect(-11, -2, 2, 1);
  }

  // SPOTS (only Spot)
  if (charId === 'spot') {
    ctx.fillStyle = '#1a1a1a';
    // Random spot pattern
    ctx.fillRect(-7, 1, 4, 4);
    ctx.fillRect(1, 3, 3, 3);
    ctx.fillRect(-3, 5, 3, 3);
    ctx.fillRect(5, 0, 3, 3);
    ctx.fillRect(-2, -2, 2, 2);
    ctx.fillRect(7, 5, 2, 2);
    ctx.fillRect(-9, 6, 2, 2);

      ctx.fillRect(-13, -8, 2, 2);

  // LEGS (with detail and 3-toed feet)

  } else {
    ctx.fillRect(-2, 7, 3, 10);
    ctx.fillRect(5, 7, 3, 10);

  // Highlight on legs
  ctx.fillStyle = legCol === '#ffcc00' ? '#ffdd44' : '#eeaa55';
  if (wf === 0) {
    ctx.fillRect(-4, 7, 1, 8);
    ctx.fillRect(7, 7, 1, 8);
  } else {
    ctx.fillRect(-2, 7, 1, 8);
    ctx.fillRect(5, 7, 1, 8);
  }

  // FEET (3-toed chicken feet)
  ctx.fillStyle = legDark;
  if (wf === 0) {
    // Back foot
    ctx.fillRect(-6, 17, 7, 2);
    ctx.fillRect(-7, 18, 1, 1);
    ctx.fillRect(-3, 18, 1, 1);
    ctx.fillRect(0, 18, 1, 1);
    // Front foot
    ctx.fillRect(5, 17, 7, 2);
    ctx.fillRect(5, 18, 1, 1);
    ctx.fillRect(8, 18, 1, 1);
    ctx.fillRect(11, 18, 1, 1);
  } else {
    ctx.fillRect(-4, 17, 7, 2);
    ctx.fillRect(-4, 18, 1, 1);
    ctx.fillRect(-1, 18, 1, 1);
    ctx.fillRect(2, 18, 1, 1);
    ctx.fillRect(3, 17, 7, 2);
    ctx.fillRect(3, 18, 1, 1);
    ctx.fillRect(6, 18, 1, 1);
    ctx.fillRect(9, 18, 1, 1);
  }
}

function drawChicken(x, y, charId, facing, scale, height) {

// ===== IMPROVED MULLET FISH =====
function drawMullet(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  const wiggle = Math.sin(gameTime * 12) * 1.5;
  const finFlap = Math.sin(gameTime * 8) * 2;

  // shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.fillRect(-14, 12, 28, 2);

  // tail fin (forked, layered)
  ctx.fillStyle = '#3a4a5a';
  ctx.fillRect(-22 + wiggle, -10, 4, 20);
  ctx.fillRect(-25 + wiggle, -12, 3, 24);
  ctx.fillRect(-25 + wiggle, -10, 3, 2);
  ctx.fillRect(-25 + wiggle, 8, 3, 2);
  ctx.fillStyle = '#5a6a7a';
  ctx.fillRect(-22 + wiggle, -8, 4, 16);
  ctx.fillStyle = '#7a8a9a';
  ctx.fillRect(-22 + wiggle, -8, 4, 2);

  // body (streamlined, layered)
  ctx.fillStyle = '#4a5a6a';
  ctx.fillRect(-18 + wiggle, -8, 32, 16);
  ctx.fillStyle = '#6a7a8a';
  ctx.fillRect(-16 + wiggle, -7, 28, 14);
  ctx.fillStyle = '#8a9aaa';
  ctx.fillRect(-14 + wiggle, -6, 24, 12);
  ctx.fillStyle = '#aabbcc';
  ctx.fillRect(-12 + wiggle, -4, 20, 8);

  // belly highlight (lighter underside)
  ctx.fillStyle = '#cce0ee';
  ctx.fillRect(-10 + wiggle, 3, 18, 3);

  // Scale pattern (more detailed)
  ctx.fillStyle = '#5a6a7a';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(-12 + wiggle + i * 5, -2, 1, 5);
    ctx.fillRect(-12 + wiggle + i * 5, 3, 1, 1);
  }
  ctx.fillStyle = '#aabbcc';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(-11 + wiggle + i * 5, -3, 1, 1);
  }

  // Dorsal fin (top, animated)
  ctx.fillStyle = '#5a6a7a';
  ctx.fillRect(-8 + wiggle, -12 + finFlap * 0.3, 10, 5);
  ctx.fillStyle = '#7a8a9a';
  ctx.fillRect(-8 + wiggle, -12 + finFlap * 0.3, 10, 2);
  ctx.fillStyle = '#9aabbb';
  ctx.fillRect(-7 + wiggle, -11 + finFlap * 0.3, 8, 1);

  // Pectoral fin (side, animated)
  ctx.fillStyle = '#5a6a7a';
  ctx.fillRect(0 + wiggle, 4 + Math.sin(gameTime * 10) * 1, 6, 4);
  ctx.fillStyle = '#7a8a9a';
  ctx.fillRect(0 + wiggle, 4 + Math.sin(gameTime * 10) * 1, 6, 1);

  // Ventral fin (bottom)
  ctx.fillStyle = '#5a6a7a';
  ctx.fillRect(-6 + wiggle, 7, 6, 3);
  ctx.fillStyle = '#7a8a9a';
  ctx.fillRect(-6 + wiggle, 7, 6, 1);

  // Lateral line
  ctx.fillStyle = '#3a4a5a';
  ctx.fillRect(-12 + wiggle, 1, 22, 1);

  // Eye
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(8 + wiggle, -4, 5, 5);
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(9 + wiggle, -3, 3, 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(10 + wiggle, -2, 2, 2);
  // Eye highlight
  ctx.fillStyle = '#fff';
  ctx.fillRect(11 + wiggle, -2, 1, 1);

  // Mouth
  ctx.fillStyle = '#000';
  ctx.fillRect(13 + wiggle, 2, 6, 3);
  ctx.fillStyle = '#dd3333';
  ctx.fillRect(14 + wiggle, 3, 4, 1);
  // Gill
  ctx.fillStyle = '#3a4a5a';
  ctx.fillRect(4 + wiggle, -4, 1, 8);

  // Bubbles
  ctx.fillStyle = '#aaeeff';
  ctx.globalAlpha = 0.8;
  for (let i = 0; i < 4; i++) {
    const bx = -16 + ((i * 7 + gameTime * 35) % 30);
    const by = -12 - ((gameTime * 14 + i * 5) % 14);
    ctx.fillRect(bx + wiggle, by, 2, 2);
    if (i % 2 === 0) ctx.fillRect(bx + wiggle + 3, by - 2, 1, 1);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ===== IMPROVED COOPER (THE BRINDLE DOG) =====
function drawCooper(x, y) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));

  const wf = Math.floor(cooper.walkPhase) % 2;
  const isChasing = cooper.state === 'chasing';

    ctx.fillRect(21, -9, 2, 3);
  } else {

    ctx.fillRect(-22, -9, 2, 3);

  ctx.fillStyle = '#000';

    ctx.fillRect(20, -3, 4, 4);

    ctx.fillRect(-24, -3, 4, 4);

  ctx.restore();
}

// ===== IMPROVED BLACK HOLE EFFECT =====
function drawBlackHole(x, y, animT) {
  ctx.save();
  ctx.translate(x, y);

  const r = 44 + Math.sin(animT * 8) * 4;

  // Distortion rings (multiple layers)
  for (let i = 4; i >= 0; i--) {
    const ringR = r + 14 + i * 8;
    ctx.strokeStyle = `rgba(${170 - i * 20}, ${i * 10}, ${255 - i * 30}, ${0.4 - i * 0.07})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, ringR, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Spiral particles (more dynamic)
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2 + animT * 6;
    const layer = Math.floor(i / 4);
    const d = r + 12 + layer * 10 - (animT * 50 % 35);
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d;
    const size = layer === 0 ? 2 : (layer === 1 ? 3 : 2);
    ctx.fillStyle = layer === 0 ? '#aa00ff' : (layer === 1 ? '#cc66ff' : '#dd88ff');
    ctx.fillRect(px, py, size, size);
    // Inner trail
    const a2 = a - 0.2;
    const d2 = d + 3;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(Math.cos(a2) * d2, Math.sin(a2) * d2, size - 1, size - 1);
    ctx.globalAlpha = 1;
  }

  // Glow halo
  const glow = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r + 30);
  glow.addColorStop(0, 'rgba(170, 0, 255, 0.5)');
  glow.addColorStop(1, 'rgba(170, 0, 255, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, r + 30, 0, Math.PI * 2);
  ctx.fill();

  // Event horizon
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Purple ring (rotating)
  ctx.save();
  ctx.rotate(animT * 3);
  ctx.strokeStyle = '#aa00ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r - 2, 0, Math.PI * 2);
  ctx.stroke();
  // Inner highlight
  ctx.strokeStyle = '#cc66ff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, r - 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Hot center (purple core)
  ctx.fillStyle = '#220044';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Bright center
  ctx.fillStyle = '#660088';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2);
  ctx.fill();

  // Singularity point
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ============================================================
// CUTSCENE RENDERING
// ============================================================
function renderCutscene() {
  if (cutsceneView === 'shed') {
    renderCutsceneShed();
  } else if (cutsceneView === 'overFence') {
    renderCutsceneOverFence();
  } else if (cutsceneView === 'neighborYard') {
    renderCutsceneNeighborYard();
  }
}

function renderCutsceneShed() {
  drawNightSky();
  drawGround();

  for (const bt of map.bananaTrees) drawBananaTree(bt.x, bt.y);
  for (const t of map.trees) drawTree(t.x, t.y, t.r);
  drawPool();
  for (const gb of map.gardenBeds) drawGardenBed(gb.x, gb.y, gb.w, gb.h);
  drawShed();

  drawCooper(map.shed.x - 60, map.shed.y + 90);

  const t = Math.min(cutsceneAnimT / 1.8, 1);
  const px = map.shed.x + 30;
  const heightArc = Math.sin(t * Math.PI) * 60;
  const py = map.shed.y - 4 - heightArc;
  const drift = t * 40;
  drawChicken(px + drift, py, character, 1, 1.2, 0);

  if (Math.random() < 0.6) {
    addParticle(px + drift - 14 + (Math.random() - 0.5) * 6,
                py + (Math.random() - 0.5) * 8, '#ffe8c8', 0.5);
  }
  ctx.save();
  ctx.globalAlpha = 0.4 + 0.2 * Math.sin(cutsceneAnimT * 6);
  ctx.fillStyle = '#ffcc66';
  ctx.beginPath();
  ctx.arc(px + drift, py - 6, 24, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillRect(0, H - 30, W, 30);

  ctx.fillStyle = '#ffcc66';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('— HOME BACKYARD —', W / 2, 22);
}

function renderCutsceneOverFence() {
  drawNightSky();
  ctx.fillStyle = '#102a08';
  ctx.fillRect(0, 380, W, H - 380);
  ctx.fillStyle = '#1a3a10';
  for (let x = 0; x < W; x += 8) {
    for (let y = 400; y < H; y += 14) {
      const o = ((x * 13 + y * 7) % 17);
      if (o < 5) ctx.fillRect(x + (o % 4), y + (o % 3), 2, 2);
    }
  }

  fenceWobble += 0.04;
  const fenceShake = Math.sin(fenceWobble) * 2;
  ctx.fillStyle = '#3a2810';
  ctx.fillRect(0, 360, W, 50);
  for (let x = 0; x < W; x += 16) {
    ctx.fillStyle = '#4a3818';
    ctx.fillRect(x + fenceShake, 350, 10, 70);
    ctx.fillStyle = '#3a2810';
    ctx.fillRect(x + 10 + fenceShake, 350, 2, 70);
  }
  ctx.fillStyle = '#5a4028';
  ctx.fillRect(0, 348 + fenceShake, W, 6);
  ctx.fillRect(0, 420 + fenceShake, W, 6);
  ctx.fillStyle = '#4a3818';
  for (let x = 4; x < W; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x + fenceShake, 358);
    ctx.lineTo(x + 5 + fenceShake, 348);
    ctx.lineTo(x + 10 + fenceShake, 358);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(20, 420, 130, 28);
  ctx.fillStyle = '#ffcc66';
  ctx.fillRect(22, 422, 126, 24);
  ctx.fillStyle = '#3a2010';
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('HOME YARD ←', 85, 440);

  ctx.fillStyle = '#000';
  ctx.fillRect(W - 220, 420, 200, 28);
  ctx.fillStyle = '#88ddff';
  ctx.fillRect(W - 218, 422, 196, 24);
  ctx.fillStyle = '#1a3050';
  ctx.font = 'bold 13px Courier New';
  ctx.fillText('→ NEIGHBOR\'S YARD', W - 120, 440);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const y = 180 + i * 18;
    const len = 40 + i * 8;
    ctx.beginPath();
    ctx.moveTo(100 + (cutsceneAnimT * 600 + i * 60) % (W - 100), y);
    ctx.lineTo(100 + (cutsceneAnimT * 600 + i * 60) % (W - 100) + len, y);
    ctx.stroke();
  }

  const ft = Math.min(cutsceneAnimT / 2.5, 1);
  const fx = 120 + ft * (W - 240);
  const fy = 230 + Math.sin(ft * Math.PI) * -60;
  const flap = 1.0 + Math.abs(Math.sin(cutsceneAnimT * 18)) * 0.15;
  drawChickenScaled(fx, fy, character, 1, 1.4 * flap);

  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#ffeecc';
  for (let i = 0; i < 4; i++) {
    const bx = fx - 20 - i * 8;
    const by = fy + (Math.sin(cutsceneAnimT * 12 + i) * 6);
    ctx.fillRect(bx, by, 4 - i, 4 - i);
  }
  ctx.restore();

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillRect(0, H - 30, W, 30);

  ctx.fillStyle = '#ffeecc';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('— FLYING OVER THE FENCE —', W / 2, 22);
}

function renderCutsceneNeighborYard() {
  drawNeighborSky();
  drawNeighborGround();

  drawNeighborHouse(40, 100);

  ctx.save();
  ctx.globalAlpha = 0.25 + 0.05 * Math.sin(cutsceneAnimT * 3);
  ctx.fillStyle = '#ffcc66';
  ctx.beginPath();
  ctx.arc(180, 280, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#ffcc66';
  ctx.fillRect(50, 160, 80, 60);
  ctx.fillRect(230, 160, 80, 60);
  ctx.restore();

  drawGardenGnome(330, 470);
  drawGardenGnome(380, 478);
  drawGardenGnome(430, 470);

  const flowerCols = ['#ff6688', '#ffaa44', '#cc66ff', '#ffee66', '#ff6688', '#88ddff'];
  for (let i = 0; i < flowerCols.length; i++) {
    drawFlower(310 + i * 14, 498, flowerCols[i]);
  }

  drawBush(540, 450);
  drawBush(700, 460);
  drawBush(580, 478);

  drawMailbox(720, 410);
  drawSprinkler(480, 470);
  drawWelcomeMat(118, 432);

  drawNeighborFence();

  let rubyX = 200;
  let rubyY = 360;
  let rubyScale = 1.0;
  let rubyFacing = -1;
  if (endingType === 'bad') {
    if (cutsceneStep >= 3) rubyFacing = 1;
    if (cutsceneStep >= 3) { rubyX = 300; rubyY = 320; rubyScale = 1.15; }
    if (cutsceneStep >= 4) { rubyX = 420; rubyY = 280; rubyScale = 1.3; }
    if (cutsceneStep >= 5) { rubyX = 480; rubyY = 270; rubyScale = 1.4; }
  } else if (endingType === 'goodish') {
    if (cutsceneStep >= 4) { rubyX = 360; rubyY = 340; rubyScale = 1.1; rubyFacing = 1; }
    if (cutsceneStep >= 5) { rubyX = 420; rubyY = 350; rubyScale = 1.05; rubyFacing = 1; }
  } else {
    if (cutsceneStep >= 4) { rubyX = 300; rubyY = 350; rubyScale = 1.1; rubyFacing = 1; }
    if (cutsceneStep >= 5) { rubyX = 240; rubyY = 380; rubyScale = 1.0; rubyFacing = -1; }
  }
  const hop = Math.abs(Math.sin(cutsceneAnimT * 6)) * 6;
  drawRubyScaled(rubyX, rubyY - hop, rubyScale, rubyFacing);

  let cx, cy, facing, cscale = 1.2;
  facing = endingType === 'good' ? -1 : 1;
  if (endingType === 'bad') {
    cx = 460 + cutsceneAnimT * 20;
    cy = 250 - Math.sin(cutsceneAnimT * 3) * 4;
  } else if (endingType === 'goodish') {
    cx = 540;
    cy = 340;
  } else {
    cx = 500 + cutsceneAnimT * 10;
    cy = 200 - Math.abs(Math.sin(cutsceneAnimT * 2)) * 12;
  }
  const flapP = 1.0 + Math.abs(Math.sin(cutsceneAnimT * 16)) * 0.18;
  drawChickenScaled(cx, cy, character, facing, cscale * flapP);

  for (let i = 0; i < 2; i++) {
    if (Math.random() < 0.4) {
      addParticle(160 + Math.random() * 80, 270 + Math.random() * 30, '#ffcc66', 0.6);
    }
  }

  if (endingType === 'bad') {
    ctx.fillStyle = 'rgba(60, 0, 0, 0.30)';
    ctx.fillRect(0, 0, W, H);
  } else if (endingType === 'goodish') {
    ctx.fillStyle = 'rgba(120, 80, 0, 0.18)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = 'rgba(0, 60, 120, 0.18)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillRect(0, H - 30, W, 30);

  ctx.fillStyle = '#88ddff';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('— NEIGHBOR\'S YARD —', W / 2, 22);
}

// ===== IMPROVED RUBY (FRENCH BULLDOG) =====
function drawRubyScaled(x, y, scale, facing) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  ctx.scale(scale, scale);
  if (facing < 0) ctx.scale(-1, 1);
  drawRubyInternal();
  ctx.restore();
}

// ---- ENDING ----
function renderEnding() {
  ctx.fillStyle = '#02020a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.25;
  drawNeighborSky();
  drawNeighborGround();
  drawNeighborHouse(40, 100);
  ctx.restore();

  if (endingType === 'bad') {
    ctx.fillStyle = 'rgba(60, 0, 0, 0.55)';
  } else if (endingType === 'goodish') {
    ctx.fillStyle = 'rgba(120, 100, 0, 0.35)';
  } else {
    ctx.fillStyle = 'rgba(0, 60, 120, 0.4)';
  }
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 60; i++) {
    const x = (i * 173 + 11) % W;
    const y = ((i * 67) % (H - 200)) + 4;
    ctx.fillStyle = i % 3 === 0 ? '#fff' : '#888';
    ctx.fillRect(x, y, 1, 1);
  }

  const cx = W / 2, cy = 200;
  if (endingType === 'bad') {
    drawRubyScaled(cx, cy + 20, 1.0, 1);
    drawChickenScaled(cx - 8, cy + 22, character, 1, 0.7);
  } else if (endingType === 'goodish') {
    drawChickenScaled(cx, cy, character, -1, 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(cx + 30, cy - 4, 14, 16);
    drawNeighbor();
  } else {
    drawChickenScaled(cx, cy, character, -1, 2);
  }

  ctx.textAlign = 'center';
  const titleCol = endingType === 'bad' ? '#ff4444' :
                   (endingType === 'goodish' ? '#ffcc66' : '#66ff88');

  ctx.fillStyle = '#000';
  ctx.font = 'bold 64px Courier New';
  ctx.fillText(endingType === 'bad' ? 'BAD ENDING' :
               (endingType === 'goodish' ? 'GOODISH ENDING' : 'GOOD ENDING'),
               W / 2 + 3, 363);
  ctx.fillStyle = titleCol;
  ctx.fillText(endingType === 'bad' ? 'BAD ENDING' :
               (endingType === 'goodish' ? 'GOODISH ENDING' : 'GOOD ENDING'),
               W / 2, 360);

  ctx.fillStyle = '#fff';
  ctx.font = '17px Courier New';
  const desc = endingType === 'bad' ?
    'Ruby the French Bulldog catches you\nin her jaws. You have been eaten!\n\nThe night is silent... forever.' :
    (endingType === 'goodish' ?
      'Ruby snaps your tail feathers off,\nbut the neighbor rushes out and saves you.\n\nYou limp home, featherless but alive.' :
      'You flap wildly and soar back over the fence!\nRuby barks futilely below.\n\nYour tail feathers are intact. You live to cluck again!');
  const lines = desc.split('\n');
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], W / 2, 410 + i * 24);
  }

  ctx.fillStyle = '#aaa';
  ctx.font = '14px Courier New';
  ctx.fillText('Character: ' + character.toUpperCase() +
               '   |   Time: ' + gameTime.toFixed(1) + 's',
               W / 2, 540);

  if (endingTimer > 0.5) {
    const pulse = 0.7 + 0.3 * Math.abs(Math.sin(gameTime * 3));
    ctx.fillStyle = `rgba(255, 204, 102, ${pulse})`;
    ctx.font = 'bold 20px Courier New';
    ctx.fillText('Click anywhere to play again', W / 2, 575);
  }
}

function drawNeighbor() {
  const x = W / 2 + 80, y = 200;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#2244aa';
  ctx.fillRect(-8, 0, 16, 18);
  ctx.fillStyle = '#3355bb';
  ctx.fillRect(-8, 0, 16, 2);
  ctx.fillStyle = '#1a3388';
  ctx.fillRect(-8, 16, 16, 2);
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(-6, -10, 12, 10);
  ctx.fillStyle = '#ffd8b0';
  ctx.fillRect(-6, -10, 12, 2);
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(-7, -12, 14, 4);
  ctx.fillStyle = '#5a3818';
  ctx.fillRect(-7, -12, 14, 1);
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(8, -2, 4, 12);
  ctx.fillStyle = '#2244aa';
  ctx.fillRect(8, 4, 4, 6);
  // face
  ctx.fillStyle = '#000';
  ctx.fillRect(-3, -7, 2, 2);
  ctx.fillRect(1, -7, 2, 2);
  // mouth
  ctx.fillStyle = '#cc6644';
  ctx.fillRect(-2, -3, 4, 1);
  ctx.restore();
}

// ---- HUD ----
function renderHUD() {
  const el = document.getElementById('hud');
  if (state === 'menu') {
    el.innerHTML = '<b style="color:#ffcc66">COOP QUEST</b><br>Pick your chicken';
    return;
  }
  if (state === 'cutscene') {
    let loc = '';
    if (cutsceneView === 'shed') loc = 'HOME BACKYARD';
    else if (cutsceneView === 'overFence') loc = 'OVER THE FENCE';
    else if (cutsceneView === 'neighborYard') loc = 'NEIGHBOR\'S YARD';
    el.innerHTML = '<b style="color:#ffcc66">CUTSCENE</b><br>Location: <span style="color:#88ddff">' + loc + '</span>';
    return;
  }
  if (state === 'ending') {
    el.innerHTML = '';
    return;
  }
  let html = '<b>' + character.toUpperCase() + '</b><br>';
  if (character === 'terry') {
    const a = abilities.terry;
    if (a.active) html += '<span style="color:#ff9933">FLIGHTING</span><br>';
    else if (a.cooldown > 0) html += 'Flight: <span style="color:#aaa">' + a.cooldown.toFixed(1) + 's</span><br>';
    else html += 'Flight: <span style="color:#66ff88">READY</span> [F]<br>';
  }
  if (character === 'spot') {
    const a = abilities.spot;
    if (a.active) html += '<span style="color:#cc66ff">BLACK HOLE ACTIVE</span><br>';
    else if (a.cooldown > 0) html += 'Black Hole: <span style="color:#aaa">' + a.cooldown.toFixed(1) + 's</span><br>';
    else html += 'Black Hole: <span style="color:#66ff88">READY</span> [F] or [R-Click]<br>';
  }
  if (character === 'charlet') {
    const a = abilities.charlet;
    if (a.active) html += '<span style="color:#66ccff">SWIMMING AS MULLET</span> ' + a.timer.toFixed(1) + 's<br>';
    else if (a.cooldown > 0) html += 'Mullet: <span style="color:#aaa">' + a.cooldown.toFixed(1) + 's</span><br>';
    else html += 'Mullet: <span style="color:#66ff88">READY</span> [F] anywhere!<br>';
  }
  if (state === 'shedTop') {
    html += '<br><span style="color:#ffcc66">★ ON SHED ROOF ★<br>You are safe!<br>Press E to escape!</span>';
  } else if (state === 'climbing') {
    html += '<br><span style="color:#ffcc66">↑ CLIMBING THE SHED ↑</span>';
  } else if (state === 'coop') {
    html += '<br><span style="color:#aaa">In the chicken coop</span>';
  } else {
    if (cooper.state === 'chasing') {
      html += '<br><span style="color:#ff5555">⚠ COOPER IS CHASING!</span>';
    } else if (cooper.state === 'stunned') {
      html += '<br><span style="color:#ffff66">Cooper is stunned!</span>';
    } else {
      html += '<br><span style="color:#aaa">Cooper is lurking...</span>';
    }
  }
  el.innerHTML = html;
}

function renderMessage() {
  const maxChars = 60;
  const words = message.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).length > maxChars) {
      if (cur) lines.push(cur.trim());
      cur = w;
    } else {
      cur += ' ' + w;
    }
  }
  if (cur) lines.push(cur.trim());

  const boxH = lines.length * 18 + 20;
  const boxY = H - boxH - 60;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillRect(30, boxY, W - 60, boxH);
  ctx.strokeStyle = '#ffcc66';
  ctx.lineWidth = 2;
  ctx.strokeRect(32, boxY + 2, W - 64, boxH - 4);

  ctx.fillStyle = '#ffcc66';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], W / 2, boxY + 22 + i * 18);
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function loop(t) {
  const elapsed = Math.min(0.06, (t - lastT) / 1000);
  lastT = t;
  now = t;
  update(elapsed);
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(t => { lastT = t; loop(t); });

</script>
