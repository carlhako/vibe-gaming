            function drawEnemy(enemy, ex, ey) {
                const s = enemy.size;
                const flashColor = enemy.hitFlash > 0 ? '#ffffff' : enemy.color;
                const stunInd = enemy.stunTimer > 0;

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(ex, ey + s * 0.5, s * 0.8, s * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                if (enemy.type === 'witch') {
                    const robeColor = enemy.hitFlash > 0 ? '#ffffff' : '#3d1f5c';
                    const hatColor = enemy.hitFlash > 0 ? '#ffffff' : '#2a1040';
                    const skinColor = enemy.hitFlash > 0 ? '#ffffff' : '#c8e0b0';
                    const glowPulse = 1 + Math.sin(Date.now() / 500) * 0.2;
                    ctx.fillStyle = 'rgba(120,40,200,' + (0.15 * glowPulse) + ')';
                    ctx.beginPath();
                    ctx.arc(ex, ey, s * 1.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = robeColor;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.5, ey + s * 0.2);
                    ctx.lineTo(ex + s * 0.5, ey + s * 0.2);
                    ctx.lineTo(ex + s * 0.35, ey + s * 0.8);
                    ctx.lineTo(ex - s * 0.35, ey + s * 0.8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = robeColor;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.4, ey - s * 0.1);
                    ctx.lineTo(ex - s * 0.7, ey + s * 0.25);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.4, ey - s * 0.1);
                    ctx.lineTo(ex + s * 0.7, ey + s * 0.25);
                    ctx.stroke();
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.35, s * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = hatColor;
                    ctx.beginPath();
                    ctx.moveTo(ex, ey - s * 1.25);
                    ctx.lineTo(ex - s * 0.4, ey - s * 0.45);
                    ctx.lineTo(ex + s * 0.4, ey - s * 0.45);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = hatColor;
                    ctx.fillRect(ex - s * 0.55, ey - s * 0.5, s * 1.1, s * 0.12);
                    ctx.fillStyle = '#9944cc';
                    ctx.fillRect(ex - s * 0.42, ey - s * 0.52, s * 0.84, s * 0.07);
                    const eyeGlow = 0.7 + Math.sin(Date.now() / 300) * 0.3;
                    ctx.fillStyle = 'rgba(255,200,50,' + eyeGlow + ')';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.1, ey - s * 0.38, s * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.1, ey - s * 0.38, s * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.1, ey - s * 0.38, s * 0.04, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.1, ey - s * 0.38, s * 0.04, 0, Math.PI * 2);
                    ctx.fill();
                    const staffAngle = -0.7;
                    ctx.strokeStyle = '#886644';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.5, ey + s * 0.4);
                    ctx.lineTo(ex + s * 0.5 + Math.cos(staffAngle) * s * 1.1,
                        ey + s * 0.4 + Math.sin(staffAngle) * s * 1.1);
                    ctx.stroke();
                    const orbX = ex + s * 0.5 + Math.cos(staffAngle) * s * 1.1;
                    const orbY = ey + s * 0.4 + Math.sin(staffAngle) * s * 1.1;
                    ctx.fillStyle = 'rgba(200,80,255,' + (0.5 + Math.sin(Date.now() / 250) * 0.3) + ')';
                    ctx.beginPath();
                    ctx.arc(orbX, orbY, s * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,200,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(orbX, orbY, s * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'devil') {
                    const devilRed = enemy.hitFlash > 0 ? '#ffffff' : '#cc2211';
                    const devilDark = enemy.hitFlash > 0 ? '#ffffff' : '#881100';
                    ctx.fillStyle = devilRed;
                    ctx.beginPath();
                    ctx.ellipse(ex, ey + s * 0.1, s * 0.5, s * 0.55, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = devilRed;
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.35, s * 0.38, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = devilDark;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.15, ey - s * 0.6);
                    ctx.lineTo(ex - s * 0.35, ey - s * 1.0);
                    ctx.lineTo(ex - s * 0.05, ey - s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.15, ey - s * 0.6);
                    ctx.lineTo(ex + s * 0.35, ey - s * 1.0);
                    ctx.lineTo(ex + s * 0.05, ey - s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.12, ey - s * 0.38, s * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.12, ey - s * 0.38, s * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.12, ey - s * 0.38, s * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.12, ey - s * 0.38, s * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = devilDark;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.3, ey - s * 0.1);
                    ctx.quadraticCurveTo(ex - s * 0.9, ey - s * 0.5, ex - s * 0.5, ey - s * 0.05);
                    ctx.quadraticCurveTo(ex - s * 0.75, ey - s * 0.3, ex - s * 0.3, ey - s * 0.1);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.3, ey - s * 0.1);
                    ctx.quadraticCurveTo(ex + s * 0.9, ey - s * 0.5, ex + s * 0.5, ey - s * 0.05);
                    ctx.quadraticCurveTo(ex + s * 0.75, ey - s * 0.3, ex + s * 0.3, ey - s * 0.1);
                    ctx.fill();
                    ctx.strokeStyle = devilRed;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(ex, ey + s * 0.45);
                    ctx.quadraticCurveTo(ex + s * 0.4, ey + s * 0.7, ex + s * 0.5, ey + s * 0.4);
                    ctx.stroke();
                    ctx.fillStyle = devilRed;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.5, ey + s * 0.4);
                    ctx.lineTo(ex + s * 0.65, ey + s * 0.25);
                    ctx.lineTo(ex + s * 0.5, ey + s * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = devilDark;
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.2, ey + s * 0.5, s * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.2, ey + s * 0.5, s * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'skeleton') {
                    const boneColor = flashColor;
                    const skullColor = '#f5efe0';
                    const eyeGlow = 0.6 + Math.sin(Date.now() / 400) * 0.3;
                    const idleSway = Math.sin((enemy.idleTimer || 0) * 0.8) * 0.03;

                    const hipY = ey - s * 0.18;
                    const lFootX = ex - s * 0.28;
                    const lFootY = ey + s * 0.5;
                    const rFootX = ex + s * 0.28;
                    const rFootY = ey + s * 0.5;
                    const lKneeX = ex - s * 0.16 + idleSway * s;
                    const lKneeY = ey + s * 0.12;
                    const rKneeX = ex + s * 0.16 - idleSway * s;
                    const rKneeY = ey + s * 0.12;

                    ctx.strokeStyle = boneColor;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.17, hipY);
                    ctx.lineTo(lKneeX, lKneeY);
                    ctx.lineTo(lFootX, lFootY);
                    ctx.stroke();
                    ctx.fillStyle = boneColor;
                    ctx.beginPath();
                    ctx.arc(lFootX, lFootY, 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = boneColor;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.17, hipY);
                    ctx.lineTo(rKneeX, rKneeY);
                    ctx.lineTo(rFootX, rFootY);
                    ctx.stroke();
                    ctx.fillStyle = boneColor;
                    ctx.beginPath();
                    ctx.arc(rFootX, rFootY, 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#d8ccb4';
                    ctx.beginPath();
                    ctx.ellipse(ex, hipY, s * 0.27, s * 0.09, 0, 0, Math.PI * 2);
                    ctx.fill();

                    const spineTop = ey - s * 0.63;
                    ctx.strokeStyle = '#ddd0c0';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(ex, hipY - s * 0.05);
                    ctx.lineTo(ex, spineTop);
                    ctx.stroke();
                    for (let v = 0; v < 4; v++) {
                        const vy = hipY - s * 0.07 - v * s * 0.11;
                        ctx.fillStyle = '#ddd0c0';
                        ctx.beginPath();
                        ctx.arc(ex, vy, 1.3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    const ribTop = spineTop + s * 0.1;
                    const ribBottom = hipY - s * 0.22;
                    ctx.strokeStyle = '#d4c8b0';
                    ctx.lineWidth = 2;
                    for (let r = 0; r < 4; r++) {
                        const ry = ribTop + r * (ribBottom - ribTop) / 3;
                        const ribWidth = s * 0.3 + r * s * 0.03;
                        ctx.beginPath();
                        ctx.moveTo(ex - ribWidth, ry);
                        ctx.quadraticCurveTo(ex, ry - s * 0.06, ex + ribWidth, ry);
                        ctx.stroke();
                    }

                    const shoulderY = spineTop + s * 0.04;
                    const lShoulderX = ex - s * 0.38;
                    const lElbowX = ex - s * 0.48 + idleSway * s * 0.6;
                    const lElbowY = shoulderY + s * 0.32;
                    const lHandX = ex - s * 0.42 + idleSway * s * 0.8;
                    const lHandY = lElbowY + s * 0.28;
                    ctx.strokeStyle = boneColor;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(lShoulderX, shoulderY);
                    ctx.lineTo(lElbowX, lElbowY);
                    ctx.lineTo(lHandX, lHandY);
                    ctx.stroke();
                    ctx.fillStyle = boneColor;
                    ctx.beginPath();
                    ctx.arc(lHandX, lHandY, 2, 0, Math.PI * 2);
                    ctx.fill();

                    const rShoulderX = ex + s * 0.38;
                    const rElbowX = ex + s * 0.48 - idleSway * s * 0.6;
                    const rElbowY = shoulderY + s * 0.32;
                    const rHandX = ex + s * 0.42 - idleSway * s * 0.8;
                    const rHandY = rElbowY + s * 0.28;
                    ctx.strokeStyle = boneColor;
                    ctx.beginPath();
                    ctx.moveTo(rShoulderX, shoulderY);
                    ctx.lineTo(rElbowX, rElbowY);
                    ctx.lineTo(rHandX, rHandY);
                    ctx.stroke();
                    ctx.fillStyle = boneColor;
                    ctx.beginPath();
                    ctx.arc(rHandX, rHandY, 2, 0, Math.PI * 2);
                    ctx.fill();

                    const headY = spineTop - s * 0.23;
                    const skullR = s * 0.33;
                    ctx.fillStyle = '#ede4d4';
                    ctx.beginPath();
                    ctx.moveTo(ex - skullR * 0.62, headY + skullR * 0.22);
                    ctx.lineTo(ex + skullR * 0.62, headY + skullR * 0.22);
                    ctx.lineTo(ex + skullR * 0.42, headY + skullR * 0.72);
                    ctx.lineTo(ex - skullR * 0.42, headY + skullR * 0.72);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#f0e8d8';
                    ctx.beginPath();
                    ctx.arc(ex - skullR * 0.48, headY + skullR * 0.13, skullR * 0.33, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + skullR * 0.48, headY + skullR * 0.13, skullR * 0.33, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = skullColor;
                    ctx.beginPath();
                    ctx.arc(ex, headY, skullR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0d0d0d';
                    ctx.beginPath();
                    ctx.ellipse(ex - skullR * 0.3, headY - skullR * 0.07, skullR * 0.24, skullR * 0.27, 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(ex + skullR * 0.3, headY - skullR * 0.07, skullR * 0.24, skullR * 0.27, -0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(220,30,30,' + eyeGlow + ')';
                    ctx.beginPath();
                    ctx.arc(ex - skullR * 0.3, headY - skullR * 0.07, skullR * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + skullR * 0.3, headY - skullR * 0.07, skullR * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0d0d0d';
                    ctx.beginPath();
                    ctx.moveTo(ex, headY + skullR * 0.02);
                    ctx.lineTo(ex - skullR * 0.15, headY + skullR * 0.26);
                    ctx.lineTo(ex + skullR * 0.15, headY + skullR * 0.26);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#e8dcc8';
                    for (let t = -2; t <= 2; t++) {
                        ctx.fillRect(ex + t * 3.2 - 1.5, headY + skullR * 0.36, 3, 3.5);
                    }
                } else if (enemy.type === 'ghost') {
                    ctx.fillStyle = flashColor;
                    ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    ctx.arc(ex, ey, s * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex, ey - s * 0.4, s * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ddeeff';
                    ctx.beginPath();
                    ctx.arc(ex - 2, ey - s * 0.3, 2.5, 0, Math.PI * 2);
                    ctx.arc(ex + 2, ey - s * 0.3, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'demon') {
                    const demonBody = flashColor;
                    const demonDark = enemy.hitFlash > 0 ? '#ffffff' : '#551010';
                    const eyeGlow = 0.7 + Math.sin(Date.now() / 300) * 0.3;

                    ctx.fillStyle = demonBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.42, ey - s * 0.25);
                    ctx.quadraticCurveTo(ex - s * 0.4, ey - s * 0.55, ex - s * 0.05, ey - s * 0.55);
                    ctx.lineTo(ex + s * 0.05, ey - s * 0.55);
                    ctx.quadraticCurveTo(ex + s * 0.4, ey - s * 0.55, ex + s * 0.42, ey - s * 0.25);
                    ctx.lineTo(ex + s * 0.5, ey + s * 0.5);
                    ctx.lineTo(ex - s * 0.5, ey + s * 0.5);
                    ctx.closePath();
                    ctx.fill();

                    if (!enemy.hitFlash) {
                        ctx.fillStyle = 'rgba(255,50,20,0.25)';
                        ctx.beginPath();
                        ctx.ellipse(ex - s * 0.1, ey - s * 0.05, s * 0.13, s * 0.18, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(ex + s * 0.1, ey - s * 0.05, s * 0.13, s * 0.18, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = demonDark;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(ex, ey - s * 0.25);
                        ctx.lineTo(ex, ey + s * 0.2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(ex - s * 0.12, ey - s * 0.15);
                        ctx.quadraticCurveTo(ex, ey + s * 0.02, ex + s * 0.12, ey - s * 0.15);
                        ctx.stroke();
                    }

                    ctx.fillStyle = demonBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.18, ey + s * 0.32);
                    ctx.lineTo(ex - s * 0.32, ey + s * 0.68);
                    ctx.lineTo(ex - s * 0.12, ey + s * 0.68);
                    ctx.lineTo(ex - s * 0.04, ey + s * 0.32);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = demonDark;
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.22, ey + s * 0.68, s * 0.11, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = demonBody;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.18, ey + s * 0.32);
                    ctx.lineTo(ex + s * 0.32, ey + s * 0.68);
                    ctx.lineTo(ex + s * 0.12, ey + s * 0.68);
                    ctx.lineTo(ex + s * 0.04, ey + s * 0.32);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = demonDark;
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.22, ey + s * 0.68, s * 0.11, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = demonBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.38, ey - s * 0.18);
                    ctx.lineTo(ex - s * 0.55, ey + s * 0.08);
                    ctx.lineTo(ex - s * 0.45, ey + s * 0.22);
                    ctx.lineTo(ex - s * 0.28, ey + s * 0.05);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = demonDark;
                    for (let c = 0; c < 3; c++) {
                        ctx.beginPath();
                        const clawX = ex - s * 0.5 + c * s * 0.07;
                        const clawY = ey + s * 0.18;
                        ctx.moveTo(clawX, clawY);
                        ctx.lineTo(clawX - s * 0.04, clawY + s * 0.13);
                        ctx.lineTo(clawX + s * 0.04, clawY + s * 0.13);
                        ctx.closePath();
                        ctx.fill();
                    }

                    ctx.fillStyle = demonBody;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.38, ey - s * 0.18);
                    ctx.lineTo(ex + s * 0.55, ey + s * 0.08);
                    ctx.lineTo(ex + s * 0.45, ey + s * 0.22);
                    ctx.lineTo(ex + s * 0.28, ey + s * 0.05);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = demonDark;
                    for (let c = 0; c < 3; c++) {
                        ctx.beginPath();
                        const clawX = ex + s * 0.43 + c * s * 0.07;
                        const clawY = ey + s * 0.18;
                        ctx.moveTo(clawX, clawY);
                        ctx.lineTo(clawX - s * 0.04, clawY + s * 0.13);
                        ctx.lineTo(clawX + s * 0.04, clawY + s * 0.13);
                        ctx.closePath();
                        ctx.fill();
                    }

                    const headY = ey - s * 0.52;
                    ctx.fillStyle = demonBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.26, headY + s * 0.05);
                    ctx.lineTo(ex - s * 0.22, headY - s * 0.32);
                    ctx.lineTo(ex + s * 0.22, headY - s * 0.32);
                    ctx.lineTo(ex + s * 0.26, headY + s * 0.05);
                    ctx.lineTo(ex + s * 0.18, headY + s * 0.18);
                    ctx.lineTo(ex - s * 0.18, headY + s * 0.18);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = demonDark;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.17, headY - s * 0.26);
                    ctx.quadraticCurveTo(ex - s * 0.36, headY - s * 0.62, ex - s * 0.12, headY - s * 0.7);
                    ctx.quadraticCurveTo(ex - s * 0.04, headY - s * 0.45, ex - s * 0.07, headY - s * 0.22);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.17, headY - s * 0.26);
                    ctx.quadraticCurveTo(ex + s * 0.36, headY - s * 0.62, ex + s * 0.12, headY - s * 0.7);
                    ctx.quadraticCurveTo(ex + s * 0.04, headY - s * 0.45, ex + s * 0.07, headY - s * 0.22);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,200,20,' + eyeGlow + ')';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.09, headY - s * 0.03, s * 0.07, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.09, headY - s * 0.03, s * 0.07, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.09, headY - s * 0.03, s * 0.035, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.09, headY - s * 0.03, s * 0.035, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#1a0000';
                    ctx.beginPath();
                    ctx.arc(ex, headY + s * 0.08, s * 0.1, 0, Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#f5efe0';
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.07, headY + s * 0.08);
                    ctx.lineTo(ex - s * 0.04, headY + s * 0.18);
                    ctx.lineTo(ex - s * 0.01, headY + s * 0.08);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.07, headY + s * 0.08);
                    ctx.lineTo(ex + s * 0.04, headY + s * 0.18);
                    ctx.lineTo(ex + s * 0.01, headY + s * 0.08);
                    ctx.closePath();
                    ctx.fill();
                } else if (enemy.type === 'brute') {
                    const bruteBody = flashColor;
                    const bruteDark = enemy.hitFlash > 0 ? '#ffffff' : '#2a1a0a';
                    const bruteLight = enemy.hitFlash > 0 ? '#ffffff' : '#554433';
                    const eyeGlow = 0.65 + Math.sin(Date.now() / 500) * 0.25;

                    ctx.fillStyle = bruteBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.58, ey - s * 0.2);
                    ctx.quadraticCurveTo(ex - s * 0.52, ey - s * 0.52, ex - s * 0.08, ey - s * 0.56);
                    ctx.lineTo(ex + s * 0.08, ey - s * 0.56);
                    ctx.quadraticCurveTo(ex + s * 0.52, ey - s * 0.52, ex + s * 0.58, ey - s * 0.2);
                    ctx.lineTo(ex + s * 0.48, ey + s * 0.48);
                    ctx.lineTo(ex - s * 0.48, ey + s * 0.48);
                    ctx.closePath();
                    ctx.fill();

                    if (!enemy.hitFlash) {
                        ctx.strokeStyle = bruteDark;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(ex, ey - s * 0.28);
                        ctx.lineTo(ex, ey + s * 0.18);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(ex - s * 0.14, ey - s * 0.18);
                        ctx.quadraticCurveTo(ex, ey - s * 0.02, ex + s * 0.14, ey - s * 0.18);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(ex - s * 0.14, ey + s * 0.05);
                        ctx.quadraticCurveTo(ex, ey + s * 0.18, ex + s * 0.14, ey + s * 0.05);
                        ctx.stroke();
                    }

                    ctx.fillStyle = bruteBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.28, ey + s * 0.32);
                    ctx.lineTo(ex - s * 0.38, ey + s * 0.66);
                    ctx.lineTo(ex - s * 0.13, ey + s * 0.66);
                    ctx.lineTo(ex - s * 0.08, ey + s * 0.32);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = bruteDark;
                    ctx.beginPath();
                    ctx.ellipse(ex - s * 0.25, ey + s * 0.66, s * 0.14, s * 0.07, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = bruteBody;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.28, ey + s * 0.32);
                    ctx.lineTo(ex + s * 0.38, ey + s * 0.66);
                    ctx.lineTo(ex + s * 0.13, ey + s * 0.66);
                    ctx.lineTo(ex + s * 0.08, ey + s * 0.32);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = bruteDark;
                    ctx.beginPath();
                    ctx.ellipse(ex + s * 0.25, ey + s * 0.66, s * 0.14, s * 0.07, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = bruteBody;
                    ctx.beginPath();
                    ctx.moveTo(ex - s * 0.48, ey - s * 0.32);
                    ctx.lineTo(ex - s * 0.62, ey + s * 0.06);
                    ctx.lineTo(ex - s * 0.48, ey + s * 0.24);
                    ctx.lineTo(ex - s * 0.33, ey - s * 0.05);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = bruteDark;
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.53, ey + s * 0.2, s * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                    if (!enemy.hitFlash) {
                        ctx.fillStyle = bruteLight;
                        ctx.beginPath();
                        ctx.arc(ex - s * 0.56, ey + s * 0.17, s * 0.035, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex - s * 0.5, ey + s * 0.17, s * 0.035, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = bruteBody;
                    ctx.beginPath();
                    ctx.moveTo(ex + s * 0.48, ey - s * 0.32);
                    ctx.lineTo(ex + s * 0.62, ey + s * 0.06);
                    ctx.lineTo(ex + s * 0.48, ey + s * 0.24);
                    ctx.lineTo(ex + s * 0.33, ey - s * 0.05);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = bruteDark;
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.53, ey + s * 0.2, s * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                    if (!enemy.hitFlash) {
                        ctx.fillStyle = bruteLight;
                        ctx.beginPath();
                        ctx.arc(ex + s * 0.56, ey + s * 0.17, s * 0.035, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex + s * 0.5, ey + s * 0.17, s * 0.035, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    const headY = ey - s * 0.6;
                    ctx.fillStyle = bruteBody;
                    ctx.beginPath();
                    ctx.ellipse(ex, headY + s * 0.04, s * 0.23, s * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = bruteDark;
                    ctx.beginPath();
                    ctx.ellipse(ex, headY - s * 0.04, s * 0.26, s * 0.09, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,120,20,' + eyeGlow + ')';
                    ctx.beginPath();
                    ctx.arc(ex - s * 0.07, headY + s * 0.01, s * 0.055, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + s * 0.07, headY + s * 0.01, s * 0.055, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#110000';
                    ctx.beginPath();
                    ctx.arc(ex, headY + s * 0.12, s * 0.1, 0, Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#ddd8c8';
                    for (let tp = 0; tp < 4; tp++) {
                        const tx = ex + (tp - 1.5) * s * 0.04;
                        ctx.fillRect(tx - s * 0.015, headY + s * 0.12, s * 0.03, s * (0.04 + (tp % 2) * 0.03));
                    }

                    if (!enemy.hitFlash) {
                        ctx.fillStyle = bruteDark;
                        for (let sp = 0; sp < 3; sp++) {
                            const spikeX = ex - s * 0.35 + sp * s * 0.35;
                            ctx.beginPath();
                            ctx.moveTo(spikeX, ey - s * 0.46);
                            ctx.lineTo(spikeX - s * 0.035, ey - s * 0.56);
                            ctx.lineTo(spikeX + s * 0.035, ey - s * 0.51);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                }

                if (stunInd) {
                    ctx.fillStyle = '#ffff88';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('\u2726', ex, ey - s - 6);
                }

                if (!enemy.aggroed && enemy.type !== 'witch') {
                    ctx.fillStyle = 'rgba(150,150,200,0.6)';
                    ctx.font = '8px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('\u2026', ex, ey - s - 7);
                }

                if (!enemy.aggroed && enemy.type === 'witch') {
                    ctx.fillStyle = 'rgba(200,150,255,0.7)';
                    ctx.font = '9px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('\u263d', ex, ey - s - 8);
                }

                const barW = s * 2;
                const barH = 3;
                const barY = ey - s - 4;
                ctx.fillStyle = '#200000';
                ctx.fillRect(ex - barW / 2, barY, barW, barH);
                const barColor = enemy.type === 'witch' ? '#bb44dd' :
                    enemy.type === 'devil' ? '#ee4422' : '#dd3333';
                ctx.fillStyle = barColor;
                ctx.fillRect(ex - barW / 2, barY, barW * (enemy.health / enemy.maxHealth), barH);

                if (enemy.type === 'witch' && enemy.aggroed) {
                    const devilsAlive = enemy.devilsAlive || 0;
                    ctx.fillStyle = '#ff6644';
                    ctx.font = '8px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('\ud83d\udc7f' + devilsAlive + '/' + enemy.maxDevils, ex, ey - s - 14);
                }
            }

            function renderHUD() {
                if (!player) return;
                const hbX = 20;
                const hbY = 20;
                const hbW = 220;
                const hbH = 18;
                ctx.fillStyle = '#1a0a0a';
                ctx.fillRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4);
                ctx.fillStyle = '#3a1010';
                ctx.fillRect(hbX, hbY, hbW, hbH);
                const hpRatio = player.health / player.maxHealth;
                const hpColor = hpRatio > 0.5 ? '#cc3333' : hpRatio > 0.25 ? '#dd6622' : '#ee1111';
                ctx.fillStyle = hpColor;
                ctx.fillRect(hbX, hbY, hbW * hpRatio, hbH);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('HP: ' + Math.ceil(player.health) + '/' + player.maxHealth, hbX + hbW / 2, hbY + 13);

                ctx.fillStyle = '#c9a23b';

                const vitBonus = getVitalityBonus();
                if (vitBonus > 0) {
                    ctx.fillStyle = '#ff8877';
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.fillText('\u2764 +' + vitBonus + ' HP', W - 20, 64);
                }

                if (selectedCharacter === 'sorcerer') {
                    const aliveMinions = minions.filter(m => m.health > 0).length;
                    const archerCount = minions.filter(m => m.health > 0 && m.minionType === 'archer').length;
                    const minigunCount = minions.filter(m => m.health > 0 && m.minionType === 'minigun').length;
                    const railgunCount = minions.filter(m => m.health > 0 && m.minionType === 'railgun').length;

                    const vitYOffset = vitBonus > 0 ? 20 : 0;
                    let minionText = '\u2620 ' + aliveMinions;

                        minionText += ' (' + railgunCount + '\u26a1)';

                            minionText += ' (' + minigunCount + '\ud83d\udd2b)';
                        }
                    } else if (hasMinionMinigun() && minigunCount > 0) {
                        minionText += ' (' + minigunCount + '\ud83d\udd2b)';
                    } else {
                        if (archerCount > 0) minionText += ' (' + archerCount + '\ud83c\udff9)';
                    }
                    ctx.fillStyle = hasMinionRailgun() ? '#6699ff' : (hasMinionMinigun() ? '#ff8844' : '#8899bb');
                    ctx.fillText(minionText, W - 20, 68 + vitYOffset);

                    let railgunLine = 86 + vitYOffset;
                    if (hasRailgun()) {
                        const activeMark = player.activeWeapon === 'railgun' ? ' \u25c0' : '';
                        const brightness = player.activeWeapon === 'railgun' ? '#ffffff' : '#4488aa';
                        ctx.fillStyle = brightness;
                        ctx.font = 'bold 12px "Courier New", monospace';
                        ctx.fillText('\u26a1 RAILGUN' + activeMark, W - 20, railgunLine);
                        railgunLine += 16;
                    }
                    if (hasMinigun()) {
                        const activeMark = player.activeWeapon === 'minigun' ? ' \u25c0' : '';
                        const brightness = player.activeWeapon === 'minigun' ? '#ffffff' : '#aa7744';
                        ctx.fillStyle = brightness;
                        ctx.font = 'bold 12px "Courier New", monospace';
                        ctx.fillText('\ud83d\udd2b MINIGUN' + activeMark, W - 20, railgunLine);
                        railgunLine += 16;
                    }
                    if (hasMinionMinigun()) {
                        ctx.fillStyle = '#ff9944';
                        ctx.font = 'bold 11px "Courier New", monospace';
                        ctx.fillText('\ud83d\udc80 MINIGUNS', W - 20, railgunLine);
                        railgunLine += 16;
                    }
                    if (hasMinionRailgun()) {
                        ctx.fillStyle = '#6699ff';
                        ctx.font = 'bold 11px "Courier New", monospace';
                        ctx.fillText('\ud83d\udc80 RAILGUNS', W - 20, railgunLine);
                        railgunLine += 16;
                    }
                }

                const witchCount = enemies.filter(e => e.health > 0 && e.type === 'witch').length;
                if (witchCount > 0) {
                    ctx.fillStyle = '#bb44dd';
                    ctx.font = 'bold 12px "Courier New", monospace';
                    ctx.textAlign = 'right';
                    const vitYOff = vitBonus > 0 ? 20 : 0;
                    let witchLineY = 68 + vitYOff;
                    if (selectedCharacter === 'sorcerer') {
                        witchLineY = 86 + vitYOff;
                        if (hasRailgun()) witchLineY += 16;
                        if (hasMinigun()) witchLineY += 16;
                        if (hasMinionMinigun()) witchLineY += 16;
                        if (hasMinionRailgun()) witchLineY += 16;
                    }
                    ctx.fillText('\ud83e\uddd9 ' + witchCount, W - 20, witchLineY);
                }

                if (selectedCharacter === 'sorcerer' && (hasMinigun() || hasRailgun())) {
                    const barX = 20;
                    const barY = H - 56;
                    const btnW = 130;
                    const btnH = 30;
                    const gap = 10;

                    if (hasMinigun()) {
                        const btnX = barX;
                        const isActive = player.activeWeapon === 'minigun';
                        ctx.fillStyle = isActive ? '#2a1808' : '#140c04';
                        ctx.fillRect(btnX, barY, btnW, btnH);
                        ctx.strokeStyle = isActive ? '#ff8833' : '#553311';
                        ctx.lineWidth = isActive ? 3 : 1.5;
                        ctx.strokeRect(btnX, barY, btnW, btnH);
                        if (isActive) {
                            ctx.fillStyle = 'rgba(255,136,51,0.12)';
                            ctx.fillRect(btnX - 1, barY - 1, btnW + 2, btnH + 2);
                        }
                        ctx.fillStyle = isActive ? '#ffcc88' : '#885533';
                        ctx.font = 'bold 12px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('[1]', btnX + 20, barY + 20);
                        ctx.fillStyle = isActive ? '#ffaa55' : '#664422';
                        ctx.fillText('\ud83d\udd2b MINIGUN', btnX + btnW / 2 + 12, barY + 20);
                    }

                    if (hasRailgun()) {
                        const btnX = hasMinigun() ? barX + btnW + gap : barX;
                        const isActive = player.activeWeapon === 'railgun';
                        ctx.fillStyle = isActive ? '#0a1a28' : '#060c14';
                        ctx.fillRect(btnX, barY, btnW, btnH);
                        ctx.strokeStyle = isActive ? '#44aaff' : '#223344';
                        ctx.lineWidth = isActive ? 3 : 1.5;
                        ctx.strokeRect(btnX, barY, btnW, btnH);
                        if (isActive) {
                            ctx.fillStyle = 'rgba(68,170,255,0.12)';
                            ctx.fillRect(btnX - 1, barY - 1, btnW + 2, btnH + 2);
                        }
                        ctx.fillStyle = isActive ? '#aaddff' : '#334466';
                        ctx.font = 'bold 12px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('[2]', btnX + 20, barY + 20);
                        ctx.fillStyle = isActive ? '#88ccff' : '#334455';
                        ctx.fillText('\u26a1 RAILGUN', btnX + btnW / 2 + 12, barY + 20);
                    }
                    ctx.textAlign = 'start';
                }

                const cdY = H - 56;
                ctx.fillStyle = '#222';
                ctx.fillRect(W - 120, cdY, 100, 14);
                let primCdMax;
                if (hasRailgun() && player.activeWeapon === 'railgun') primCdMax = 2.0;
                else if (hasMinigun() && player.activeWeapon === 'minigun') primCdMax = 0.1;
                else primCdMax = getPrimaryCooldown();
                const primCdRatio = player.primaryCooldown > 0 ? 1 - (player.primaryCooldown / primCdMax) : 1;
                const primFilling = player.primaryCooldown > 0 ? '#664422' : '#88aa44';
                ctx.fillStyle = primFilling;
                ctx.fillRect(W - 120, cdY, 100 * Math.max(0, primCdRatio), 14);
                ctx.fillStyle = '#ccc';
                ctx.font = '9px "Courier New", monospace';
                ctx.textAlign = 'center';
                let primLabel = 'PRIMARY [LMB]';
                if (hasRailgun() && player.activeWeapon === 'railgun') primLabel = 'RAILGUN [HOLD LMB]';
                else if (hasMinigun() && player.activeWeapon === 'minigun') primLabel = 'MINIGUN [LMB]';
                ctx.fillText(primLabel, W - 70, cdY + 11);

                ctx.fillStyle = '#222';
                ctx.fillRect(W - 120, cdY + 18, 100, 14);
                ctx.fillStyle = player.secondaryCooldown > 0 ? '#664422' : '#aa6644';
                const secCdRatio = player.secondaryCooldown > 0 ? 1 - (player.secondaryCooldown /
                    getSecondaryCooldown()) : 1;
                ctx.fillRect(W - 120, cdY + 18, 100 * secCdRatio, 14);
                ctx.fillStyle = '#ccc';
                ctx.fillText('SECONDARY [RMB]', W - 70, cdY + 29);

                ctx.fillStyle = '#222';
                ctx.fillRect(W - 120, cdY + 36, 100, 14);
                const dashCdRatio = player.dashCooldown > 0 ? 1 - (player.dashCooldown / DASH_COOLDOWN) : 1;
                ctx.fillStyle = player.dashCooldown > 0 ? '#334466' : '#5588cc';
                ctx.fillRect(W - 120, cdY + 36, 100 * Math.max(0, dashCdRatio), 14);
                ctx.fillStyle = '#ccc';
                ctx.fillText('DASH [SPACE/Q]', W - 70, cdY + 47);

                const aliveEnemies = enemies.filter(e => e.health > 0).length;
                ctx.fillStyle = '#999';
                ctx.textAlign = 'left';
                ctx.fillText('Enemies: ' + aliveEnemies, 20, H - 20);

                ctx.fillStyle = 'rgba(0,0,0,0.6)';

                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 28px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('WAVE ' + wave + ' CLEAR!', W / 2, H / 2 - 20);
                ctx.fillStyle = '#ddd';
                ctx.font = '16px "Courier New", monospace';
                ctx.fillText('Tokens are flying to you!', W / 2, H / 2 + 15);

            function renderShop() {
                ctx.fillStyle = 'rgba(8,8,16,0.92)';
                ctx.fillRect(0, 0, W, H);

                const ch = characters[selectedCharacter];

                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('\u2692 SHOP \u2014 After Wave ' + wave, W / 2, 35);

                const vitBonus = getVitalityBonus();
                const vitLabel = vitBonus > 0 ? ' (+' + vitBonus + ')' : '';
                ctx.fillStyle = '#ddd';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('Tokens: \u2726 ' + tokens + '    |    Character: ' + ch.name + '    |    HP: ' + player.maxHealth + vitLabel, W / 2, 58);

                const cardW = 200;
                const cardH = 90;
                const gapX = 20;
                const gapY = 15;
                const startX = 30;
                const startY = 80;

                let primSpecLabel, primSpecDesc;
                if (selectedCharacter === 'sorcerer') {
                    primSpecLabel = 'Homing Flames';
                    primSpecDesc = 'Fireballs curve to foes';
                } else if (selectedCharacter === 'wizard') {
                    primSpecLabel = 'Mana Leech';
                    primSpecDesc = 'Heal on primary hit';
                } else {
                    primSpecLabel = 'Bleeding Edge';
                    primSpecDesc = 'Bleed DoT on hit';
                }

                const upgrades = [
                    { id: 'prim_dmg', label: ch.primary.name + ' DMG', desc: '+25% damage/level', icon: '\u2694' },
                    { id: 'prim_spd', label: ch.primary.name + ' SPD', desc: '-18% cooldown/level', icon: '\u23f1' },
                    { id: 'prim_rng', label: ch.primary.name + ' RNG', desc: '+22% reach/level', icon: '\u2194' },
                    { id: 'prim_spec', label: primSpecLabel, desc: primSpecDesc, icon: '\u2726', prereq: 'prim_dmg' },
                    { id: 'sec_dmg', label: ch.secondary.isSummon ? 'Skeleton Power' : ch.secondary.name + ' DMG',
                        desc: ch.secondary.isSummon ? '+HP & damage/level' : '+28% damage/level', icon: '\ud83d\udca5' },
                    { id: 'sec_spd', label: ch.secondary.isSummon ? 'Rapid Summon' : ch.secondary.name + ' SPD',
                        desc: '-18% cooldown/level', icon: '\u23f1' },
                    { id: 'sec_special', label: ch.secondary.specialName, desc: ch.secondary.specialDesc, icon: '\u2605', prereq: 'sec_dmg' },
                    { id: 'sec_aoe', label: ch.secondary.aoeName, desc: ch.secondary.aoeDesc, icon: '\u2b21', prereq: 'sec_spd' },
                    { id: 'vit', label: 'Vitality', desc: '', icon: '\u2764', isVit: true },
                ];

                if (selectedCharacter === 'sorcerer') {
                    upgrades.push({
                        id: 'skel_spd',
                        label: 'Skeleton Speed',
                        desc: 'Move: 110\u2192180\u2192250 / level',
                        icon: '\ud83d\udca8',
                    });
                    upgrades.push({
                        id: 'minigun',
                        label: 'Fireball Minigun',
                        desc: 'Rapid-fire homing shots',
                        icon: '\ud83d\udd2b',
                        prereq: 'prim_spec',
                        prereqLevel: 2,
                        isMajor: true,
                    });
                    upgrades.push({
                        id: 'railgun',
                        label: 'Arcane Railgun',
                        desc: 'Charge beam, pierces all',
                        icon: '\u26a1',
                        prereq: 'prim_dmg',
                        prereqLevel: 5,
                        isMajor: true,
                    });
                    if (hasMinigun()) {
                        upgrades.push({
                            id: 'minion_minigun',
                            label: 'Skeleton Miniguns',
                            desc: 'Summons get miniguns!',
                            icon: '\ud83d\udc80',
                            isMajor: true,
                        });
                    }
                    if (hasRailgun()) {
                        upgrades.push({
                            id: 'minion_railgun',
                            label: 'Skeleton Railguns',
                            desc: 'Summons charge & fire railguns!',
                            icon: '\ud83d\udc80\u26a1',
                            isMajor: true,
                            isUltra: true,
                        });
                    }
                }

                const shopButtons = [];

                for (let i = 0; i < upgrades.length; i++) {
                    const col = i % 4;
                    const row = Math.floor(i / 4);
                    const cx2 = startX + col * (cardW + gapX);
                    const cy2 = startY + row * (cardH + gapY);

                    const upg = upgrades[i];
                    const level = playerUpgrades[upg.id] || 0;
                    const maxLevel = getUpgradeMaxLevel(upg.id);
                    const cost = getUpgradeCost(upg.id);
                    const canBuy = canBuyUpgrade(upg.id);
                    const isMaxed = level >= maxLevel;
                    const prereqLevel = upg.prereqLevel || 2;
                    const prereqMet = !upg.prereq || (playerUpgrades[upg.prereq] || 0) >= prereqLevel;
                    const isMajor = upg.isMajor || false;
                    const isUltra = upg.isUltra || false;
                    const isVit = upg.isVit || false;

                    if (isUltra) {
                        const pulse = 1 + Math.sin(Date.now() / 350 + i) * 0.15;
                        ctx.fillStyle = isMaxed ? '#1a1218' : canBuy ? 'rgba(20,10,40,' + (0.55 * pulse) + ')' : '#12101a';
                        ctx.strokeStyle = isMaxed ? '#332244' : canBuy ? 'rgba(100,60,220,' + (0.9 * pulse) + ')' : '#221133';
                        ctx.lineWidth = 3;
                        ctx.fillRect(cx2 - 2, cy2 - 2, cardW + 4, cardH + 4);
                    } else if (isMajor) {
                        const pulse = 1 + Math.sin(Date.now() / 500 + i) * 0.12;
                        ctx.fillStyle = isMaxed ? '#1a1212' : canBuy ? 'rgba(40,10,10,' + (0.5 * pulse) + ')' : '#151212';
                        ctx.strokeStyle = isMaxed ? '#552222' : canBuy ? 'rgba(220,50,50,' + (0.8 * pulse) + ')' : '#442222';
                        ctx.lineWidth = 3;
                        ctx.fillRect(cx2 - 1, cy2 - 1, cardW + 2, cardH + 2);
                    }

                    ctx.fillStyle = isMaxed ? '#1a1a1a' : canBuy ? '#1a1a2e' : '#151520';

                    if (isVit) {
                        ctx.strokeStyle = isMaxed ? '#442222' : canBuy ? '#cc6655' : '#332222';
                        ctx.lineWidth = isMaxed ? 2 : (canBuy ? 3 : 2);
                    } else if (isMajor || isUltra) {
                        ctx.strokeStyle = isUltra ? '#5533aa' : '#c9a23b';
                        ctx.lineWidth = isUltra ? 2 : 2;
                    } else {
                        ctx.strokeStyle = isMaxed ? '#444' : canBuy ? '#c9a23b' : '#333';
                        ctx.lineWidth = 2;
                    }

                    ctx.fillRect(cx2, cy2, cardW, cardH);
                    ctx.strokeRect(cx2, cy2, cardW, cardH);

                    ctx.fillStyle = '#fff';
                    ctx.font = '20px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(upg.icon, cx2 + 8, cy2 + 28);

                    ctx.fillStyle = isMaxed ? '#666' : (isVit ? '#ffaa99' : (isUltra ? '#ccbbff' : (isMajor ? '#ffaaaa' : '#eee')));
                    ctx.font = 'bold 12px "Courier New", monospace';
                    ctx.fillText(upg.label, cx2 + 36, cy2 + 22);

                    ctx.fillStyle = '#aaa';
                    ctx.font = '10px "Courier New", monospace';
                    ctx.fillText('Lv ' + level + '/' + maxLevel, cx2 + 36, cy2 + 38);

                    let descText = upg.desc;
                    if (isVit) {
                        const vitBonuses = [0, 10, 20, 40];
                        const nextLevel = Math.min(level + 1, maxLevel);
                        const nextBonus = vitBonuses[nextLevel] * wave;
                        const curBonus = vitBonuses[level] * wave;
                        if (isMaxed) {
                            descText = '+' + curBonus + ' HP (\u00d7Wave ' + wave + ')';
                        } else {
                            descText = '+' + nextBonus + ' HP at Wave ' + wave;
                        }
                    }
                    ctx.fillStyle = '#999';
                    ctx.font = '9px "Courier New", monospace';
                    ctx.fillText(descText, cx2 + 8, cy2 + 56);

                    const btnX = cx2 + cardW - 80;
                    const btnY = cy2 + cardH - 28;
                    const btnW = 72;
                    const btnH = 22;

                    if (isMaxed) {
                        ctx.fillStyle = '#333';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.strokeStyle = isVit ? '#663333' : (isUltra ? '#443366' : (isMajor ? '#663333' : '#444'));
                        ctx.lineWidth = 1;
                        ctx.strokeRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#888';
                        ctx.font = '10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('MAXED', btnX + btnW / 2, btnY + 15);
                    } else if (!prereqMet) {
                        ctx.fillStyle = '#332211';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#996633';
                        ctx.font = '9px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('REQ Lv' + prereqLevel, btnX + btnW / 2, btnY + 11);
                        ctx.fillText(upg.prereq, btnX + btnW / 2, btnY + 21);
                    } else if (!canBuy) {
                        ctx.fillStyle = '#331111';
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = '#cc4444';
                        ctx.font = '10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('\u2726' + cost, btnX + btnW / 2, btnY + 15);
                    } else {
                        ctx.fillStyle = isVit ? '#3a1a1a' : (isUltra ? '#2a1a3a' : (isMajor ? '#3a1a1a' : '#2a3a1a'));
                        ctx.fillRect(btnX, btnY, btnW, btnH);
                        ctx.fillStyle = isVit ? '#ff8877' : (isUltra ? '#bb99ff' : (isMajor ? '#ff8866' : '#aadd66'));
                        ctx.font = 'bold 10px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('\u2726' + cost + ' BUY', btnX + btnW / 2, btnY + 15);
                        shopButtons.push({
                            x: btnX,
                            y: btnY,
                            w: btnW,
                            h: btnH,
                            id: upg.id,
                        });
                    }
                    ctx.textAlign = 'start';
                }

                const nwX = W / 2 - 90;
                const nwY = H - 55;
                const nwW = 180;
                const nwH = 36;
                ctx.fillStyle = '#2a3a2a';
                ctx.strokeStyle = '#5a8a3a';
                ctx.lineWidth = 2;
                ctx.fillRect(nwX, nwY, nwW, nwH);
                ctx.strokeRect(nwX, nwY, nwW, nwH);
                ctx.fillStyle = '#ccffaa';
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('\u25b6 NEXT WAVE \u25b6', W / 2, nwY + 25);
                ctx.textAlign = 'start';
                shopButtons.push({ x: nwX, y: nwY, w: nwW, h: nwH, id: 'next_wave' });

                window._shopButtons = shopButtons;
            }

            function renderCharacterSelect() {
                ctx.fillStyle = '#0a0a14';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#c9a23b';
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('DARKHOLD ARENA', W / 2, 55);
                ctx.fillStyle = '#888';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('Choose Your Champion', W / 2, 80);

                const charKeys = ['sorcerer', 'wizard', 'knight'];
                const cardW = 240;
                const cardH = 320;
                const totalW = cardW * 3 + 60;
                const startX2 = (W - totalW) / 2;
                const cardY = 110;

                const selectButtons = [];

                for (let i = 0; i < charKeys.length; i++) {
                    const key = charKeys[i];
                    const ch = characters[key];
                    const cx3 = startX2 + i * (cardW + 30);
                    const isAvailable = ch.available !== false;

                    ctx.fillStyle = isAvailable ? '#12121e' : '#0e0e14';
                    ctx.strokeStyle = isAvailable ? (selectedCharacter === key ? '#c9a23b' : '#333') : '#222';
                    ctx.lineWidth = selectedCharacter === key && isAvailable ? 3 : 1;
                    ctx.fillRect(cx3, cardY, cardW, cardH);
                    ctx.strokeRect(cx3, cardY, cardW, cardH);

                    if (!isAvailable) {
                        ctx.fillStyle = 'rgba(0,0,0,0.45)';
                        ctx.fillRect(cx3, cardY, cardW, cardH);
                    }

                    const previewX = cx3 + cardW / 2;
                    const previewY = cardY + 70;
                    ctx.fillStyle = isAvailable ? ch.robeColor : '#3a3a40';
                    ctx.fillRect(previewX - 18, previewY - 10, 36, 30);
                    ctx.fillStyle = isAvailable ? ch.skinColor : '#888880';
                    ctx.beginPath();
                    ctx.arc(previewX, previewY - 16, 13, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = isAvailable ? ch.color : '#555555';
                    if (key === 'knight') {
                        ctx.fillRect(previewX - 12, previewY - 32, 24, 13);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(previewX, previewY - 38);
                        ctx.lineTo(previewX - 14, previewY - 16);
                        ctx.lineTo(previewX + 14, previewY - 16);
                        ctx.closePath();
                        ctx.fill();
                    }
                    if (key === 'sorcerer') {
                        ctx.fillStyle = '#ff8844';
                        ctx.beginPath();
                        ctx.arc(previewX + 20, previewY - 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,120,40,0.35)';
                        ctx.beginPath();
                        ctx.arc(previewX + 20, previewY - 5, 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.strokeStyle = isAvailable ? '#d0c8b8' : '#555';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(previewX, previewY);
                        ctx.lineTo(previewX + 20, previewY - 5);
                        ctx.stroke();
                    }

                    ctx.fillStyle = isAvailable ? '#fff' : '#666';
                    ctx.font = 'bold 18px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(ch.name, cx3 + cardW / 2, cardY + 120);

                    ctx.fillStyle = isAvailable ? '#aaa' : '#555';
                    ctx.font = '11px "Courier New", monospace';
                    const words = ch.desc.split(' ');
                    let line = '';
                    let lineY = cardY + 145;
                    for (const word of words) {
                        if ((line + ' ' + word).length > 30) {
                            ctx.fillText(line.trim(), cx3 + cardW / 2, lineY);
                            lineY += 16;
                            line = word;
                        } else {
                            line += ' ' + word;
                        }
                    }
                    ctx.fillText(line.trim(), cx3 + cardW / 2, lineY);

                    const statY = lineY + 25;
                    ctx.fillStyle = isAvailable ? '#ccc' : '#555';
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.fillText('PRIMARY', cx3 + cardW / 2, statY);
                    ctx.fillStyle = isAvailable ? '#bbb' : '#555';
                    ctx.font = '10px "Courier New", monospace';
                    ctx.fillText(ch.primary.name + ': ' + ch.primary.damage + ' dmg', cx3 + cardW / 2, statY + 16);
                    ctx.fillText(
                        ch.primary.isRanged ? 'Ranged projectile' : 'Melee swing',
                        cx3 + cardW / 2, statY + 30
                    );

                    ctx.fillStyle = isAvailable ? '#ccc' : '#555';
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.fillText('SECONDARY', cx3 + cardW / 2, statY + 52);
                    ctx.fillStyle = isAvailable ? '#bbb' : '#555';
                    ctx.font = '10px "Courier New", monospace';
                    if (ch.secondary.isSummon) {
                        ctx.fillText(ch.secondary.name + ': summons skeletons', cx3 + cardW / 2, statY + 68);
                        ctx.fillText('15s lifespan | Cooldown: ' + ch.secondary.cooldown + 's', cx3 + cardW / 2,
                            statY + 82);
                    } else if (ch.secondary.isRanged) {
                        ctx.fillText(ch.secondary.name + ': ' + ch.secondary.damage + ' dmg', cx3 + cardW / 2, statY + 68);
                        ctx.fillText('Ranged | Cooldown: ' + ch.secondary.cooldown + 's', cx3 + cardW / 2, statY + 82);
                    } else {
                        ctx.fillText(ch.secondary.name + ': ' + ch.secondary.damage + ' dmg', cx3 + cardW / 2, statY + 68);
                        ctx.fillText('Melee AoE | Cooldown: ' + ch.secondary.cooldown + 's', cx3 + cardW / 2, statY + 82);
                    }

                    if (!isAvailable) {
                        ctx.fillStyle = 'rgba(0,0,0,0.55)';
                        ctx.fillRect(cx3 + 10, cardY + 115, cardW - 20, 90);
                        ctx.fillStyle = '#cc4444';
                        ctx.font = 'bold 14px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('NOT CURRENTLY', cx3 + cardW / 2, cardY + 148);
                        ctx.fillText('AVAILABLE', cx3 + cardW / 2, cardY + 166);
                    }

                    const btnX2 = cx3 + cardW / 2 - 60;
                    const btnY2 = cardY + cardH - 45;
                    if (isAvailable) {
                        ctx.fillStyle = key === selectedCharacter ? '#4a6a2a' : '#2a3a1a';
                        ctx.strokeStyle = key === selectedCharacter ? '#aadd66' : '#555';
                        ctx.lineWidth = 2;
                        ctx.fillRect(btnX2, btnY2, 120, 32);
                        ctx.strokeRect(btnX2, btnY2, 120, 32);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 13px "Courier New", monospace';
                        ctx.fillText(key === selectedCharacter ? '\u2713 SELECTED' : 'SELECT', cx3 + cardW / 2, btnY2 + 22);
                    } else {
                        ctx.fillStyle = '#1a1a1a';
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 1;
                        ctx.fillRect(btnX2, btnY2, 120, 32);
                        ctx.strokeRect(btnX2, btnY2, 120, 32);
                        ctx.fillStyle = '#555';
                        ctx.font = 'bold 13px "Courier New", monospace';
                        ctx.fillText('UNAVAILABLE', cx3 + cardW / 2, btnY2 + 22);
                    }

                    if (isAvailable) {
                        selectButtons.push({ x: btnX2, y: btnY2, w: 120, h: 32, key });
                    }
                }

                const startBtnX2 = W / 2 - 100;
                const startBtnY2 = cardY + cardH + 25;
                ctx.fillStyle = '#c9a23b';
                ctx.fillRect(startBtnX2, startBtnY2, 200, 44);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 18px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('\u2694  ENTER THE ARENA  \u2694', W / 2, startBtnY2 + 30);
                ctx.textAlign = 'start';

                selectButtons.push({ x: startBtnX2, y: startBtnY2, w: 200, h: 44, key: 'start' });
                window._selectButtons = selectButtons;

                ctx.fillStyle = '#666';
                ctx.font = '11px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('WASD/Arrows: Move | Mouse: Aim | LMB: Primary | RMB: Secondary | SPACE/Q: Dash', W / 2, startBtnY2 + 65);
                ctx.fillText('1/2: Swap weapons (Sorcerer) | Walls are destructible', W / 2, startBtnY2 + 82);
                ctx.textAlign = 'start';
            }

            function renderGameOver() {
                ctx.fillStyle = 'rgba(10,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#cc2222';
                ctx.font = 'bold 36px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('YOU HAVE FALLEN', W / 2, H / 2 - 30);
                ctx.fillStyle = '#ddd';
                ctx.font = '18px "Courier New", monospace';
                ctx.fillText('Reached Wave ' + wave, W / 2, H / 2 + 15);
                ctx.fillText('Tokens collected: \u2726 ' + tokens, W / 2, H / 2 + 40);
                ctx.fillStyle = '#c9a23b';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('Click anywhere to return to character select', W / 2, H / 2 + 75);
                ctx.textAlign = 'start';
            }

            // === EVENT HANDLING ===
            canvas.addEventListener('click', (e) => {
                ensureFocus(e);
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                const cx = (e.clientX - rect.left) * scaleX;
                const cy = (e.clientY - rect.top) * scaleY;

                if (gameState === 'CHARACTER_SELECT' && window._selectButtons) {
                    for (const btn of window._selectButtons) {
                        if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
                            if (btn.key === 'start') {
                                startGame();
                            } else if (characters[btn.key] && characters[btn.key].available !== false) {
                                selectedCharacter = btn.key;
                            }
                            return;
                        }
                    }
                }

                if (gameState === 'SHOP' && window._shopButtons) {
                    for (const btn of window._shopButtons) {
                        if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
                            if (btn.id === 'next_wave') {
                                wave++;
                                generateMap();
                                player.x = Math.floor(MAP_COLS / 2) * TILE + TILE / 2;
                                player.y = Math.floor(MAP_ROWS / 2) * TILE + TILE / 2;
                                player.maxHealth = BASE_MAX_HP + getVitalityBonus();
                                player.health = Math.min(player.maxHealth, player.health + 25);
                                player.alive = true;
                                player.invulnTimer = 1.0;
                                player.primaryCooldown = 0;
                                player.secondaryCooldown = 0;
                                player.dashCooldown = 0;
                                player.railgunCharge = 0;
                                player.railgunCharging = false;
                                player.isDashing = false;
                                player.dashTimer = 0;
                                player.knockbackX = 0;
                                player.knockbackY = 0;
                                minions = [];
                                boneShards = [];
                                beamEffects = [];
                                spawnWave();
                                gameState = 'PLAYING';
                                camera.x = player.x - W / 2;
                                camera.y = player.y - H / 2;
                                canvas.focus({ preventScroll: true });
                            } else if (canBuyUpgrade(btn.id)) {
                                const cost = getUpgradeCost(btn.id);
                                tokens -= cost;
                                playerUpgrades[btn.id] = (playerUpgrades[btn.id] || 0) + 1;
                                if (btn.id === 'minigun') {
                                    if (!hasRailgun() || player.activeWeapon !== 'railgun') {
                                        player.activeWeapon = 'minigun';
                                    }
                                    player.primaryCooldown = 0;
                                }
                                if (btn.id === 'railgun') {
                                    player.activeWeapon = 'railgun';
                                    player.primaryCooldown = 0;
                                    player.railgunCharge = 0;
                                    player.railgunCharging = false;
                                }
                                if (btn.id === 'vit') {
                                    const oldMax = player.maxHealth;
                                    player.maxHealth = BASE_MAX_HP + getVitalityBonus();
                                    const hpGain = player.maxHealth - oldMax;
                                    player.health = Math.min(player.maxHealth, player.health + hpGain + 5);
                                } else {
                                    if (player) player.health = Math.min(player.maxHealth, player.health + 10);
                                }
                            }
                            return;
                        }
                    }
                }

                if (gameState === 'PLAYING' && player && player.alive && selectedCharacter === 'sorcerer') {
                    const barX = 20;
                    const barY = H - 56;
                    const btnW = 130;
                    const btnH = 30;
                    const gap = 10;
                    if (hasMinigun()) {
                        const btnX = barX;
                        if (cx >= btnX && cx <= btnX + btnW && cy >= barY && cy <= barY + btnH) {
                            performWeaponSwap('minigun');
                            return;
                        }
                    }
                    if (hasRailgun()) {
                        const btnX = hasMinigun() ? barX + btnW + gap : barX;
                        if (cx >= btnX && cx <= btnX + btnW && cy >= barY && cy <= barY + btnH) {
                            performWeaponSwap('railgun');
                            return;
                        }
                    }
                }

                if (gameState === 'GAME_OVER' && gameOverTimer <= 0) {
                    restartGame();
                }
            });

            // === GAME LOOP ===
            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.2) dt = 0.2;
                if (dt <= 0) dt = 0.016;
                lastTime = timestamp;

                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }

            // === INIT ===
            initUpgrades();
            generateMap();
            camera = { x: WORLD_W / 2 - W / 2, y: WORLD_H / 2 - H / 2 };
            updateMouseWorld();
            updateCamera(0.016);
            requestAnimationFrame(gameLoop);

            console.log('Darkhold Arena v32 ready. Choose your champion!');
        })();
    </script>
