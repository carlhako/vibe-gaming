                            if (player.railgunCharge >= 1.0 && Math.random() < 0.35) {
                                const tipX2 = player.x + Math.cos(player.angle) * 28;
                                const tipY2 = player.y + Math.sin(player.angle) * 28;
                                particles.push({
                                    x: tipX2 + (Math.random() - 0.5) * 18,
                                    y: tipY2 + (Math.random() - 0.5) * 18,
                                    vx: (Math.random() - 0.5) * 60,
                                    vy: (Math.random() - 0.5) * 60,
                                    life: 0.25,
                                    maxLife: 0.25,
                                    color: '#ffffff',
                                    size: 2 + Math.random() * 3,
                                });
                            }
                        } else {
                            if (player.railgunCharge >= RAILGUN_MIN_CHARGE_TO_FIRE) {
                                player.attackFlash = 0.15;
                                fireRailgunShot(player.railgunCharge);
                            }
                            player.railgunCharging = false;
                            player.railgunCharge = 0;
                        }
                    }
                } else if (mouseDown.left && player.primaryCooldown <= 0) {
                    playerPrimaryAttack();
                }

                if (mouseDown.right && player.secondaryCooldown <= 0) {
                    playerSecondaryAttack();
                }
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const aggroRange = enemy.type === 'witch' ? (enemy.witchAggroRange || WITCH_AGGRO_RANGE) : ENEMY_AGGRO_RANGE;
                    if (!enemy.aggroed && player && player.alive) {
                        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        if (distToPlayer < aggroRange) {
                            enemy.aggroed = true;
                        }
                    }
                    if (enemy.stunTimer > 0) {
                        enemy.stunTimer -= dt;
                        enemy.knockbackX *= 0.85;
                        enemy.knockbackY *= 0.85;
                        enemy.x += enemy.knockbackX * dt;
                        enemy.y += enemy.knockbackY * dt;
                        resolveWallCollision(enemy, enemy.size);
                        continue;
                    }
                    if (enemy.hitFlash > 0) enemy.hitFlash -= dt;
                    if (Math.abs(enemy.knockbackX) > 0.5 || Math.abs(enemy.knockbackY) > 0.5) {
                        enemy.x += enemy.knockbackX * dt;
                        enemy.y += enemy.knockbackY * dt;
                        enemy.knockbackX *= Math.exp(-10 * dt);
                        enemy.knockbackY *= Math.exp(-10 * dt);
                        resolveWallCollision(enemy, enemy.size);
                    }
                    if (enemy.type === 'witch' && enemy.aggroed && player && player.alive) {
                        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        enemy.summonCooldown -= dt;
                        if (enemy.summonCooldown <= 0 &&
                            distToPlayer <= WITCH_SUMMON_RANGE &&
                            (enemy.devilsAlive || 0) < enemy.maxDevils) {
                            enemy.summonCooldown = enemy.summonCooldownMax;
                            const spawnAngle = Math.random() * Math.PI * 2;
                            const spawnDist = enemy.size + 20;
                            const dx = enemy.x + Math.cos(spawnAngle) * spawnDist;
                            const dy = enemy.y + Math.sin(spawnAngle) * spawnDist;
                            if (!isWallCircle(dx, dy, 6)) {
                                const devil = spawnEnemy('devil', 0, dx, dy);
                                devil.witchRef = enemy;
                                devil.aggroed = true;
                                enemies.push(devil);
                                enemy.devilsAlive = (enemy.devilsAlive || 0) + 1;
                                spawnParticles(dx, dy, 14, '#ff3311', 80, 0.5);
                                spawnParticles(dx, dy, 8, '#ffaa22', 60, 0.35);
                                spawnDamageNumber(dx, dy, 0, '#ff6644');
                            }
                        }
                        if (distToPlayer < WITCH_PREFERRED_DIST * 0.7 && distToPlayer > 0.01) {
                            const awayX = enemy.x - player.x;
                            const awayY = enemy.y - player.y;
                            const awayDist = Math.hypot(awayX, awayY);
                            enemy.x += (awayX / awayDist) * enemy.speed * 0.85 * dt;
                            enemy.y += (awayY / awayDist) * enemy.speed * 0.85 * dt;
                            resolveWallCollision(enemy, enemy.size);
                        } else if (distToPlayer > WITCH_PREFERRED_DIST * 1.6) {
                            updateStuckDetection(enemy, dt);
                            const steering = getSteeringDirection(enemy.x, enemy.y, player.x, player.y, enemy.size, enemy.isStuck);
                            enemy.x += steering.dx * enemy.speed * 0.7 * dt;
                            enemy.y += steering.dy * enemy.speed * 0.7 * dt;
                            resolveWallCollision(enemy, enemy.size);
                        } else {
                            updateStuckDetection(enemy, dt);
                            const strafeAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x) + Math.PI / 2;
                            const strafeDir = Math.sin(enemy.idleTimer * 1.3) > 0 ? 1 : -1;
                            enemy.idleTimer += dt * 1.3;
                            enemy.x += Math.cos(strafeAngle) * strafeDir * enemy.speed * 0.3 * dt;
                            enemy.y += Math.sin(strafeAngle) * strafeDir * enemy.speed * 0.3 * dt;
                            resolveWallCollision(enemy, enemy.size);
                        }
                    } else if (enemy.aggroed && player && player.alive) {
                        let targetObj = { x: player.x, y: player.y, size: PLAYER_SIZE, type: 'player' };
                        let closestDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        for (const minion of minions) {
                            if (minion.health <= 0) continue;
                            const md = Math.hypot(minion.x - enemy.x, minion.y - enemy.y);
                            if (md < closestDist) {
                                closestDist = md;
                                targetObj = { x: minion.x, y: minion.y, size: minion.size, type: 'minion', ref: minion };
                            }
                        }
                        const tdx = targetObj.x - enemy.x;
                        const tdy = targetObj.y - enemy.y;
                        const tdist = Math.hypot(tdx, tdy);
                        if (tdist > 0.5) {
                            updateStuckDetection(enemy, dt);
                            const steering = getSteeringDirection(
                                enemy.x, enemy.y, targetObj.x, targetObj.y,
                                enemy.size, enemy.isStuck
                            );
                            enemy.x += steering.dx * enemy.speed * dt;
                            enemy.y += steering.dy * enemy.speed * dt;
                            resolveWallCollision(enemy, enemy.size);
                        }
                        const contactDist = targetObj.size + enemy.size;
                        if (tdist < contactDist) {
                            if (targetObj.type === 'player' && player.invulnTimer <= 0) {
                                const knockAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                                damagePlayer(enemy.damage, knockAngle);
                                const pushX = (player.x - enemy.x) / (tdist + 0.01);
                                const pushY = (player.y - enemy.y) / (tdist + 0.01);
                                enemy.knockbackX -= pushX * 100;
                                enemy.knockbackY -= pushY * 100;
                            } else if (targetObj.type === 'minion' && targetObj.ref.damageCooldown <= 0) {
                                const tMinion = targetObj.ref;
                                tMinion.health -= enemy.damage;
                                tMinion.damageCooldown = 0.5;
                                tMinion.hitFlash = 0.08;
                                spawnParticles(tMinion.x, tMinion.y, 3, '#ffaa88', 40, 0.2);
                                const pushMX = (tMinion.x - enemy.x) / (tdist + 0.01);
                                const pushMY = (tMinion.y - enemy.y) / (tdist + 0.01);
                                tMinion.knockbackX += pushMX * 60;
                                tMinion.knockbackY += pushMY * 60;
                                if (tMinion.health <= 0) {
                                    spawnParticles(tMinion.x, tMinion.y, 8, '#ddccbb', 80, 0.4);
                                }
                            }
                        }
                    } else if (!enemy.aggroed) {
                        enemy.idleTimer -= dt;
                        if (enemy.idleTimer <= 0) {
                            enemy.idleAngle += (Math.random() - 0.5) * 1.2;
                            enemy.idleTimer = 1.0 + Math.random() * 2.0;
                        }
                        const idleSpeed = enemy.speed * 0.3;
                        enemy.x += Math.cos(enemy.idleAngle) * idleSpeed * dt;
                        enemy.y += Math.sin(enemy.idleAngle) * idleSpeed * dt;
                        resolveWallCollision(enemy, enemy.size);
                    }
                    for (const other of enemies) {
                        if (other === enemy || other.health <= 0) continue;
                        const edx = enemy.x - other.x;
                        const edy = enemy.y - other.y;
                        const edist = Math.hypot(edx, edy);
                        const minDist = enemy.size + other.size;
                        if (edist < minDist && edist > 0.01) {
                            const sep = (minDist - edist) * 0.3;
                            enemy.x += (edx / edist) * sep;
                            enemy.y += (edy / edist) * sep;
                        }
                    }
                }
                enemies = enemies.filter(e => e.health > 0 || e.hitFlash > -0.5);
            }

            function updateMinions(dt) {
                for (const minion of minions) {
                    if (minion.health <= 0) continue;
                    minion.lifetime -= dt;
                    if (minion.lifetime <= 0) {
                        killMinionByTimeout(minion);
                        continue;
                    }
                    minion.isMoving = false;
                    if (minion.hitFlash > 0) minion.hitFlash -= dt;
                    if (minion.damageCooldown > 0) minion.damageCooldown -= dt;
                    if (minion.attackCooldown > 0) minion.attackCooldown -= dt;
                    if (minion.minigunMuzzleFlash > 0) minion.minigunMuzzleFlash -= dt;
                    if (minion.minionType === 'minigun') {
                        minion.minigunSpin += 18 * dt;
                    }
                    if (Math.abs(minion.knockbackX) > 0.3 || Math.abs(minion.knockbackY) > 0.3) {
                        minion.x += minion.knockbackX * dt;
                        minion.y += minion.knockbackY * dt;
                        minion.knockbackX *= Math.exp(-8 * dt);
                        minion.knockbackY *= Math.exp(-8 * dt);
                        resolveWallCollision(minion, minion.size);
                    }
                    const distToPlayer = player && player.alive
                        ? Math.hypot(player.x - minion.x, player.y - minion.y)
                        : Infinity;
                    let nearestEnemy = null;
                    let nearestDist = Infinity;
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const d = Math.hypot(enemy.x - minion.x, enemy.y - minion.y);
                        if (d < nearestDist) {
                            nearestDist = d;
                            nearestEnemy = enemy;
                        }
                    }
                    const shouldFollowPlayer = distToPlayer > MINION_DISENGAGE_DIST;

                    // Speed multiplier while charging railgun
                    const isRailgun = minion.minionType === 'railgun';
                    const chargingSpeedMult = (isRailgun && minion.railgunCharging) ? 0.35 : 1.0;

                    if (nearestEnemy && nearestDist < MINION_AGGRO_RANGE && !shouldFollowPlayer) {
                        const dx = nearestEnemy.x - minion.x;
                        const dy = nearestEnemy.y - minion.y;
                        const dist = Math.hypot(dx, dy);
                        updateStuckDetection(minion, dt);
                        if (minion.isRanged && dist < minion.rangedRange && dist > minion.attackRange) {
                            if (minion.attackCooldown <= 0) {
                                const isMinigun = minion.minionType === 'minigun';
                                if (isRailgun) {
                                    // Start charging instead of firing immediately
                                    if (!minion.railgunCharging) {
                                        minion.railgunCharging = true;
                                        minion.railgunCharge = 0;
                                        minion.attackCooldown = minion.rangedCooldownMax;
                                        minion.angle = Math.atan2(dy, dx);
                                    }
                                } else {
                                    minion.attackCooldown = minion.rangedCooldownMax;
                                    minion.angle = Math.atan2(dy, dx);
                                    const projColor = isMinigun ? '#ff8833' : (minion.minionType === 'archer' ? '#ffe8b0' : '#e8e0c8');
                                    const projSize = isMinigun ? 3 : (minion.minionType === 'archer' ? 4 : 3);
                                    const homingStr = isMinigun ? 0.05 : 0;
                                    const bproj = spawnProjectile(
                                        minion.x + Math.cos(minion.angle) * (minion.size + 2),
                                        minion.y + Math.sin(minion.angle) * (minion.size + 2),
                                        minion.angle, minion.rangedSpeed, minion.damage,
                                        projColor, projSize, true, 0, homingStr, 0, 'minion'
                                    );
                                    bproj.rangeRemaining = minion.rangedRange;
                                    projectiles.push(bproj);
                                    if (isMinigun) {
                                        minion.minigunMuzzleFlash = 0.06;
                                        spawnParticles(
                                            minion.x + Math.cos(minion.angle) * (minion.size + 8),
                                            minion.y + Math.sin(minion.angle) * (minion.size + 8),
                                            2, '#ff8833', 30, 0.12
                                        );
                                    }
                                }
                            }
                            if (dist > minion.rangedRange * 0.7) {
                                const steering = getSteeringDirection(
                                    minion.x, minion.y, nearestEnemy.x, nearestEnemy.y,
                                    minion.size, minion.isStuck
                                );
                                minion.x += steering.dx * minion.speed * chargingSpeedMult * dt;
                                minion.y += steering.dy * minion.speed * chargingSpeedMult * dt;
                                minion.isMoving = true;
                                minion.angle = Math.atan2(dx, dy);
                                resolveWallCollision(minion, minion.size);
                            }
                        } else if (dist > minion.attackRange) {
                            const steering = getSteeringDirection(
                                minion.x, minion.y, nearestEnemy.x, nearestEnemy.y,
                                minion.size, minion.isStuck
                            );
                            minion.x += steering.dx * minion.speed * chargingSpeedMult * dt;
                            minion.y += steering.dy * minion.speed * chargingSpeedMult * dt;
                            minion.isMoving = true;
                            minion.angle = Math.atan2(dx, dy);
                            resolveWallCollision(minion, minion.size);
                        } else if (minion.attackCooldown <= 0) {
                            minion.attackCooldown = minion.attackCooldownMax;
                            minion.angle = Math.atan2(dx, dy);
                            damageEnemy(nearestEnemy, minion.damage, minion.angle);
                            spawnParticles(
                                nearestEnemy.x - Math.cos(minion.angle) * nearestEnemy.size * 0.5,
                                nearestEnemy.y - Math.sin(minion.angle) * nearestEnemy.size * 0.5,
                                3, '#ffffff', 30, 0.15
                            );
                        }
                    } else if (player && player.alive) {
                        const dx = player.x - minion.x;
                        const dy = player.y - minion.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 45) {
                            updateStuckDetection(minion, dt);
                            const steering = getSteeringDirection(
                                minion.x, minion.y, player.x, player.y,
                                minion.size, minion.isStuck
                            );
                            minion.x += steering.dx * minion.speed * 0.75 * chargingSpeedMult * dt;
                            minion.y += steering.dy * minion.speed * 0.75 * chargingSpeedMult * dt;
                            minion.isMoving = true;
                            minion.angle = Math.atan2(dx, dy);
                            resolveWallCollision(minion, minion.size);
                        }
                    }

                    // === RAILGUN CHARGING HANDLER ===
                    if (isRailgun && minion.railgunCharging) {
                        // Find current best target
                        let chargeTarget = null;
                        let chargeTargetDist = Infinity;
                        for (const enemy of enemies) {
                            if (enemy.health <= 0) continue;
                            const d = Math.hypot(enemy.x - minion.x, enemy.y - minion.y);
                            if (d < chargeTargetDist) {
                                chargeTargetDist = d;
                                chargeTarget = enemy;
                            }
                        }

                        if (!chargeTarget || chargeTargetDist > minion.rangedRange * 1.35) {
                            // Target lost or too far - cancel charge
                            minion.railgunCharging = false;
                            minion.railgunCharge = 0;
                        } else {
                            // Track target
                            const tdx = chargeTarget.x - minion.x;
                            const tdy = chargeTarget.y - minion.y;
                            minion.angle = Math.atan2(tdy, tdx);

                            minion.railgunCharge += dt / MINION_RAILGUN_CHARGE_TIME;

                            // Charge particles
                            if (Math.random() < 0.5) {
                                const tipX = minion.x + Math.cos(minion.angle) * (minion.size + 8);
                                const tipY = minion.y + Math.sin(minion.angle) * (minion.size + 8);
                                const orbitAngle = minion.angle + Math.random() * Math.PI * 2;
                                const orbitDist = 4 + minion.railgunCharge * 9;
                                particles.push({
                                    x: tipX + Math.cos(orbitAngle) * orbitDist,
                                    y: tipY + Math.sin(orbitAngle) * orbitDist,
                                    vx: (Math.random() - 0.5) * 30,
                                    vy: (Math.random() - 0.5) * 30,
                                    life: 0.3,
                                    maxLife: 0.3,
                                    color: minion.railgunCharge > 0.65 ? '#aaccff' : '#6699ff',
                                    size: 1 + Math.random() * 2.5,
                                });
                            }

                            if (minion.railgunCharge >= 1.0) {
                                // Fire at full charge!
                                fireMinionRailgunShot(minion, chargeTarget.x, chargeTarget.y);
                                minion.minigunMuzzleFlash = 0.06;
                                minion.railgunCharging = false;
                                minion.railgunCharge = 0;
                                minion.attackCooldown = minion.rangedCooldownMax;
                            }
                        }
                    }

                    if (minion.isMoving) {
                        minion.walkTimer += dt * 8 * (minion.speed / 110);
                    }
                    for (const other of minions) {
                        if (other === minion || other.health <= 0) continue;
                        const mdx = minion.x - other.x;
                        const mdy = minion.y - other.y;
                        const mdist = Math.hypot(mdx, mdy);
                        const minSep = minion.size + other.size;
                        if (mdist < minSep && mdist > 0.01) {
                            const sep = (minSep - mdist) * 0.25;
                            minion.x += (mdx / mdist) * sep;
                            minion.y += (mdy / mdist) * sep;
                        }
                    }
                }
                minions = minions.filter(m => m.health > 0);
            }

            function updateProjectiles(dt) {
                for (const proj of projectiles) {
                    if (!proj.alive) continue;
                    if (proj.homingStrength > 0 && proj.isRanged) {
                        let closestEnemy = null;
                        let closestDist = 200;
                        for (const enemy of enemies) {
                            if (enemy.health <= 0) continue;
                            const d = Math.hypot(enemy.x - proj.x, enemy.y - proj.y);
                            if (d < closestDist) {
                                closestDist = d;
                                closestEnemy = enemy;
                            }
                        }
                        if (closestEnemy) {
                            const targetAngle = Math.atan2(closestEnemy.y - proj.y, closestEnemy.x - proj.x);
                            let diff = targetAngle - proj.angle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            proj.angle += diff * Math.min(1, proj.homingStrength * 8 * dt);
                            proj.vx = Math.cos(proj.angle) * proj.speed;
                            proj.vy = Math.sin(proj.angle) * proj.speed;
                        }
                    }
                    proj.x += proj.vx * dt;
                    proj.y += proj.vy * dt;
                    proj.rangeRemaining -= proj.speed * dt;
                    proj.trail.push({ x: proj.x, y: proj.y, life: 0.15 });
                    if (proj.trail.length > 12) proj.trail.shift();
                    if (isWallCircle(proj.x, proj.y, proj.size)) {
                        if (proj.owner === 'player' || proj.owner === 'minion') {
                            const wallTile = getWallTileAt(proj.x, proj.y);
                            if (wallTile) {
                                damageWallTile(wallTile.tx, wallTile.ty, proj.angle);
                            }
                        }
                        if (proj.aoeRadius > 0) {
                            applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.8, proj.color);
                        }
                        spawnParticles(proj.x, proj.y, 6, proj.color, 80, 0.25);
                        proj.alive = false;
                        continue;
                    }
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        const ed = Math.hypot(enemy.x - proj.x, enemy.y - proj.y);
                        if (ed < proj.size + enemy.size) {
                            damageEnemy(enemy, proj.damage, proj.angle);
                            if (proj.aoeRadius > 0) {
                                applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.7, proj.color);
                            }
                            if (proj.pierceCount > 0) {
                                proj.pierceCount--;
                                spawnParticles(proj.x, proj.y, 3, proj.color, 50, 0.2);
                            } else {
                                proj.alive = false;
                                spawnParticles(proj.x, proj.y, 5, proj.color, 70, 0.25);
                                break;
                            }
                        }
                    }
                    if (proj.rangeRemaining <= 0 && proj.isRanged) {
                        if (proj.aoeRadius > 0 && proj.alive) {
                            applyAoE(proj.x, proj.y, proj.aoeRadius, proj.damage * 0.8, proj.color);
                        }
                        proj.alive = false;
                        spawnParticles(proj.x, proj.y, 4, proj.color, 40, 0.2);
                    }
                }
                projectiles = projectiles.filter(p => p.alive);
            }

            function applyAoE(x, y, radius, damage, color) {
                spawnParticles(x, y, 12, color, 100, 0.4);
                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const ed = Math.hypot(enemy.x - x, enemy.y - y);
                    if (ed < radius + enemy.size) {
                        damageEnemy(enemy, damage, Math.atan2(enemy.y - y, enemy.x - x));
                    }
                }
                const tileMinX = Math.floor((x - radius) / TILE);
                const tileMaxX = Math.floor((x + radius) / TILE);
                const tileMinY = Math.floor((y - radius) / TILE);
                const tileMaxY = Math.floor((y + radius) / TILE);
                for (let wy = tileMinY; wy <= tileMaxY; wy++) {
                    for (let wx = tileMinX; wx <= tileMaxX; wx++) {
                        if (wx < 0 || wx >= MAP_COLS || wy < 0 || wy >= MAP_ROWS) continue;
                        if (mapTiles[wy][wx] === 0) continue;
                        const wcx = wx * TILE + TILE / 2;
                        const wcy = wy * TILE + TILE / 2;
                        const wdist = Math.hypot(wcx - x, wcy - y);
                        if (wdist < radius + TILE * 0.5) {
                            damageWallTile(wx, wy, Math.atan2(wcy - y, wcx - x));
                        }
                    }
                }
                screenShake = Math.max(screenShake, 2);
            }

            function updateParticles(dt) {
                for (const p of particles) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                }
                particles = particles.filter(p => p.life > 0);
            }

            function updateDamageNumbers(dt) {
                for (const dn of damageNumbers) {
                    dn.y -= 40 * dt;
                    dn.life -= dt;
                }
                damageNumbers = damageNumbers.filter(dn => dn.life > 0);
            }

            function updateDroppedTokens(dt) {
                for (const token of droppedTokens) {
                    if (token.collected) continue;
                    if (token.flyingToPlayer && player && player.alive) {
                        token.flyProgress += dt * 2.2;
                        if (token.flyProgress >= 1) {
                            collectToken(token);
                        } else {
                            const t = token.flyProgress;
                            const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                            token.x = token.flyStartX + (player.x - token.flyStartX) * easeT;
                            token.y = token.flyStartY + (player.y - token.flyStartY) * easeT;
                            if (Math.random() < 0.4) {
                                particles.push({
                                    x: token.x,
                                    y: token.y,
                                    vx: (Math.random() - 0.5) * 15,
                                    vy: (Math.random() - 0.5) * 15,
                                    life: 0.2,
                                    maxLife: 0.2,
                                    color: '#ffcc44',
                                    size: 1.5 + Math.random() * 2,
                                });
                            }
                        }
                        continue;
                    }
                    token.life -= dt;
                    if (player && player.alive && !token.flyingToPlayer) {
                        const dx = player.x - token.x;
                        const dy = player.y - token.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < TOKEN_MAGNET_RANGE) {
                            const spd = 200;
                            token.x += (dx / (dist + 0.01)) * spd * dt;
                            token.y += (dy / (dist + 0.01)) * spd * dt;
                        }
                        if (dist < PLAYER_SIZE + 10) {
                            collectToken(token);
                        }
                    }
                }
                droppedTokens = droppedTokens.filter(t => t.life > 0 && !t.collected);
            }

            function updateBoneShards(dt) {
                for (const shard of boneShards) {
                    shard.x += shard.vx * dt;
                    shard.y += shard.vy * dt;
                    shard.life -= dt;
                    shard.vx *= 0.92;
                    shard.vy *= 0.92;
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        if (shard.hitEnemies.has(enemy)) continue;
                        const ed = Math.hypot(enemy.x - shard.x, enemy.y - shard.y);
                        if (ed < enemy.size + 5) {
                            damageEnemy(enemy, shard.damage, Math.atan2(shard.vy, shard.vx));
                            shard.hitEnemies.add(enemy);
                        }
                    }
                }
                boneShards = boneShards.filter(s => s.life > 0);
            }

            function updateBeamEffects(dt) {
                for (const b of beamEffects) {
                    b.life -= dt;
                }
                beamEffects = beamEffects.filter(b => b.life > 0);
            }

            // === RENDER ===
            function render() {
                ctx.clearRect(0, 0, W, H);
                if (gameState === 'CHARACTER_SELECT') {
                    renderCharacterSelect();
                    return;
                }
                const sx = shakeX;
                const sy = shakeY;
                ctx.save();
                ctx.translate(sx, sy);

                const startTX = Math.floor(camera.x / TILE);
                const startTY = Math.floor(camera.y / TILE);
                const endTX = Math.ceil((camera.x + W) / TILE);
                const endTY = Math.ceil((camera.y + H) / TILE);
                for (let ty = startTY; ty <= endTY; ty++) {
                    for (let tx = startTX; tx <= endTX; tx++) {
                        if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) {
                            ctx.fillStyle = '#0a0a10';
                            ctx.fillRect(tx * TILE - camera.x, ty * TILE - camera.y, TILE, TILE);
                            continue;
                        }
                        const shade = ((tx + ty) % 2 === 0) ? '#1a1a24' : '#161620';
                        ctx.fillStyle = shade;
                        const sx2 = tx * TILE - camera.x;
                        const sy2 = ty * TILE - camera.y;
                        ctx.fillRect(sx2, sy2, TILE, TILE);
                        ctx.strokeStyle = '#1f1f2c';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(sx2, sy2, TILE, TILE);
                        if (mapTiles[ty][tx] >= 1) {
                            drawWall(sx2, sy2, mapTiles[ty][tx]);
                        }
                    }
                }

                for (const beam of beamEffects) {
                    const alpha = Math.min(1, beam.life / beam.maxLife);
                    const bsx1 = screenX(beam.x1);
                    const bsy1 = screenY(beam.y1);
                    const bsx2 = screenX(beam.x2);
                    const bsy2 = screenY(beam.y2);
                    if (beam.color.startsWith('#')) {
                        const r = parseInt(beam.color.slice(1, 3), 16);
                        const g = parseInt(beam.color.slice(3, 5), 16);
                        const b = parseInt(beam.color.slice(5, 7), 16);
                        ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
                    } else {
                        ctx.strokeStyle = beam.color.replace(')', ', ' + alpha + ')').replace('rgb', 'rgba');
                    }
                    ctx.lineWidth = beam.thickness * alpha;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(bsx1, bsy1);
                    ctx.lineTo(bsx2, bsy2);
                    ctx.stroke();
                }

                for (const token of droppedTokens) {
                    if (token.collected) continue;
                    const tsx = screenX(token.x);
                    const tsy = screenY(token.y);
                    const pulse = 1 + Math.sin(token.life * 6) * 0.2;
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.arc(tsx, tsy, 5 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff8c0';
                    ctx.beginPath();
                    ctx.arc(tsx, tsy, 2.5 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,200,40,0.25)';
                    ctx.beginPath();
                    ctx.arc(tsx, tsy, 9 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (const proj of projectiles) {
                    if (!proj.alive) continue;
                    for (let i = 0; i < proj.trail.length; i++) {
                        const t = proj.trail[i];
                        const alpha = (i / proj.trail.length) * 0.5;
                        const tsx2 = screenX(t.x);
                        const tsy2 = screenY(t.y);
                        if (proj.color.startsWith('#')) {
                            const r = parseInt(proj.color.slice(1, 3), 16);
                            const g = parseInt(proj.color.slice(3, 5), 16);
                            const bval = parseInt(proj.color.slice(5, 7), 16);
                            ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + bval + ',' + alpha + ')';
                        } else {
                            ctx.fillStyle = proj.color.replace(')', ', ' + alpha + ')').replace('rgb', 'rgba');
                        }
                        ctx.beginPath();
                        ctx.arc(tsx2, tsy2, proj.size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const psx = screenX(proj.x);
                    const psy = screenY(proj.y);
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(psx, psy, proj.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(psx, psy, proj.size * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (const minion of minions) {
                    if (minion.health <= 0) continue;
                    const msx = screenX(minion.x);
                    const msy = screenY(minion.y);
                    if (msx < -30 || msx > W + 30 || msy < -30 || msy > H + 30) continue;
                    drawMinion(minion, msx, msy);
                }

                for (const enemy of enemies) {
                    if (enemy.health <= 0) continue;
                    const esx = screenX(enemy.x);
                    const esy = screenY(enemy.y);
                    if (esx < -30 || esx > W + 30 || esy < -30 || esy > H + 30) continue;
                    drawEnemy(enemy, esx, esy);
                }

                if (player && player.alive) {
                    const psx = screenX(player.x);
                    const psy = screenY(player.y);
                    drawPlayer(psx, psy);
                }

                for (const shard of boneShards) {
                    const ssx = screenX(shard.x);
                    const ssy = screenY(shard.y);
                    const alpha = Math.min(1, shard.life / shard.maxLife);
                    ctx.fillStyle = 'rgba(220,210,180,' + alpha + ')';
                    ctx.save();
                    ctx.translate(ssx, ssy);
                    ctx.rotate(Math.atan2(shard.vy, shard.vx));
                    ctx.fillRect(-4, -1.5, 8, 3);
                    ctx.fillStyle = 'rgba(255,245,225,' + (alpha * 0.7) + ')';
                    ctx.fillRect(-2, -1, 4, 2);
                    ctx.restore();
                }

                for (const dn of damageNumbers) {
                    const dnx = screenX(dn.x);
                    const dny = screenY(dn.y);
                    const alpha = Math.min(1, dn.life / dn.maxLife);
                    ctx.fillStyle = dn.color;
                    ctx.globalAlpha = alpha;
                    ctx.font = 'bold 13px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(dn.text, dnx, dny);
                    ctx.globalAlpha = 1;
                }

                for (const p of particles) {
                    const psx2 = screenX(p.x);
                    const psy2 = screenY(p.y);
                    const alpha = Math.min(1, p.life / p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(psx2 - p.size / 2, psy2 - p.size / 2, p.size, p.size);
                }
                ctx.globalAlpha = 1;

                ctx.restore();

                renderHUD();

                if (gameState === 'WAVE_CLEAR') renderWaveClear();
                if (gameState === 'SHOP') renderShop();
                if (gameState === 'GAME_OVER') renderGameOver();
            }

            function drawWall(sx, sy, tileState) {
                if (tileState === 2) {
                    ctx.fillStyle = '#2a2a36';
                    ctx.fillRect(sx, sy, TILE, TILE);
                    ctx.fillStyle = '#333340';
                    ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
                    ctx.strokeStyle = '#22222e';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
                    ctx.beginPath();
                    ctx.moveTo(sx, sy + TILE / 2);
                    ctx.lineTo(sx + TILE, sy + TILE / 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(sx + TILE / 2, sy);
                    ctx.lineTo(sx + TILE / 2, sy + TILE / 2);
                    ctx.stroke();
                    ctx.fillStyle = '#3d3d4d';
                    ctx.fillRect(sx + 3, sy + 3, TILE - 6, 3);
                    ctx.fillRect(sx + 3, sy + 3, 3, TILE - 6);
                } else {
                    ctx.fillStyle = '#1a1a24';
                    ctx.fillRect(sx, sy, TILE, TILE);
                    ctx.fillStyle = '#282833';
                    ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
                    ctx.strokeStyle = '#1a1a24';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
                    ctx.strokeStyle = '#3a3a44';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sx + 6, sy + 6);
                    ctx.lineTo(sx + TILE * 0.45, sy + TILE * 0.5);
                    ctx.lineTo(sx + TILE - 10, sy + TILE - 6);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(sx + TILE - 7, sy + 8);
                    ctx.lineTo(sx + TILE * 0.5, sy + TILE * 0.35);
                    ctx.lineTo(sx + 10, sy + TILE - 9);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(sx + TILE * 0.3, sy + 4);
                    ctx.lineTo(sx + TILE * 0.35, sy + TILE * 0.4);
                    ctx.stroke();
                    ctx.fillStyle = '#333340';
                    ctx.fillRect(sx + 9, sy + TILE - 8, 4, 4);
                    ctx.fillRect(sx + TILE - 13, sy + 12, 3, 3);
                    ctx.fillRect(sx + TILE - 16, sy + TILE - 10, 2, 3);
                    ctx.fillStyle = '#2a2a33';
                    ctx.fillRect(sx + 12, sy + 8, 3, 2);
                }
            }

            function drawPlayer(px, py) {
                const ch = characters[selectedCharacter];
                const size = PLAYER_SIZE;
                const swapGlow = player.swapFlash > 0;
                const isDashing = player.isDashing && player.dashTimer > 0;

                if (isDashing) {
                    const dashAlpha = 0.18;
                    const afterCount = 3;
                    for (let a = 1; a <= afterCount; a++) {
                        const backX = px - player.dashDx * a * 18;
                        const backY = py - player.dashDy * a * 18;
                        const backAlpha = dashAlpha * (1 - a / (afterCount + 1));
                        ctx.fillStyle = 'rgba(180,200,255,' + backAlpha + ')';
                        ctx.beginPath();
                        ctx.arc(backX, backY, size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.fillStyle = swapGlow ? 'rgba(255,255,255,0.25)' : 'rgba(180,160,220,0.15)';
                ctx.beginPath();
                ctx.arc(px, py, size + 8, 0, Math.PI * 2);
                ctx.fill();

                const bodyColor = player.attackFlash > 0 ? '#ffffff' :
                    player.secondaryFlash > 0 ? '#ffe8c0' : ch.robeColor;
                const invulnBlink = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 20) % 2 === 0;

                ctx.fillStyle = invulnBlink ? '#ffffff' : bodyColor;
                ctx.fillRect(px - size * 0.5, py - size * 0.3, size, size * 0.85);

                ctx.fillStyle = invulnBlink ? '#ffffff' : ch.skinColor;
                ctx.beginPath();
                ctx.arc(px, py - size * 0.5, size * 0.38, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = invulnBlink ? '#ffffff' : ch.color;
                if (selectedCharacter === 'knight') {
                    ctx.fillRect(px - size * 0.35, py - size * 0.95, size * 0.7, size * 0.4);
                    ctx.fillRect(px - size * 0.2, py - size * 1.15, size * 0.4, size * 0.25);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(px, py - size * 1.15);
                    ctx.lineTo(px - size * 0.4, py - size * 0.5);
                    ctx.lineTo(px + size * 0.4, py - size * 0.5);
                    ctx.closePath();
                    ctx.fill();
                }

                const showRailgun = selectedCharacter === 'sorcerer' && hasRailgun() && player.activeWeapon === 'railgun';
                const showMinigun = selectedCharacter === 'sorcerer' && hasMinigun() && player.activeWeapon === 'minigun';

                if (showRailgun) {
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(player.angle);

                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#3a3a4a';
                    ctx.fillRect(-6, -5, 38, 10);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#4a4a5a';
                    ctx.fillRect(-4, -4, 35, 8);

                    for (let c = 0; c < 4; c++) {
                        const coilX = 4 + c * 8;
                        const coilGlow = 0.5 + Math.sin(Date.now() / 150 + c) * 0.3;
                        const coilAlpha = 0.4 + coilGlow * 0.5;
                        let coilColor;
                        if (invulnBlink) {
                            coilColor = 'rgba(255,255,255,' + coilAlpha + ')';
                        } else {
                            coilColor = 'rgba(68,170,255,' + coilAlpha + ')';
                        }
                        ctx.fillStyle = coilColor;
                        ctx.fillRect(coilX, -6, 4, 12);
                        ctx.fillStyle = invulnBlink ? 'rgba(255,255,255,' + (coilAlpha * 0.7) + ')' : 'rgba(136,221,255,' + (coilAlpha * 0.7) + ')';
                        ctx.fillRect(coilX + 1, -5, 2, 10);
                    }

                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#2a2a38';
                    ctx.fillRect(36, -7, 10, 14);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#222233';
                    ctx.fillRect(44, -6, 6, 12);

                    const chargeGlow = player.railgunCharging ? player.railgunCharge : 0;
                    const tipGlowAlpha = 0.35 + chargeGlow * 0.65;
                    const tipGlowR = 5 + chargeGlow * 18;
                    if (invulnBlink) {
                        ctx.fillStyle = 'rgba(255,255,255,' + tipGlowAlpha + ')';
                    } else {
                        ctx.fillStyle = 'rgba(100,200,255,' + tipGlowAlpha + ')';
                    }
                    ctx.beginPath();
                    ctx.arc(50, 0, tipGlowR, 0, Math.PI * 2);
                    ctx.fill();
                    if (chargeGlow > 0.3) {
                        if (invulnBlink) {
                            ctx.fillStyle = 'rgba(255,255,255,' + (chargeGlow * 0.8) + ')';
                        } else {
                            ctx.fillStyle = 'rgba(200,240,255,' + (chargeGlow * 0.8) + ')';
                        }
                        ctx.beginPath();
                        ctx.arc(50, 0, tipGlowR * 0.55, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#5a4a3a';
                    ctx.fillRect(-2, 6, 8, 14);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#4a3a2a';
                    ctx.fillRect(-1, 7, 6, 12);

                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#333344';
                    ctx.fillRect(14, -12, 14, 6);
                    ctx.fillStyle = invulnBlink ? 'rgba(255,255,255,0.5)' : 'rgba(100,180,255,' + (0.3 + chargeGlow * 0.5) + ')';
                    ctx.fillRect(16, -11, 10, 4);

                    ctx.restore();

                    if (player.railgunCharging) {
                        const barW = 34;
                        const barH = 5;
                        const barX = px - barW / 2;
                        const barY = py - size - 20;
                        ctx.fillStyle = '#0a0a20';
                        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
                        const chargeRatio = player.railgunCharge;
                        let barColor;
                        if (chargeRatio >= 0.99) barColor = '#ffffff';
                        else if (chargeRatio > 0.5) barColor = '#88ddff';
                        else barColor = '#3388cc';
                        ctx.fillStyle = barColor;
                        ctx.fillRect(barX, barY, barW * chargeRatio, barH);
                        ctx.fillStyle = 'rgba(100,180,255,' + (0.2 + chargeRatio * 0.5) + ')';
                        ctx.fillRect(barX - 2, barY - 2, (barW + 4) * chargeRatio, barH + 4);
                        if (chargeRatio > 0.15) {
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 8px "Courier New", monospace';
                            ctx.textAlign = 'center';
                            const label = chargeRatio >= 0.99 ? 'MAX' : Math.round(chargeRatio * 100) + '%';
                            ctx.fillText(label, px, barY - 7);
                            ctx.textAlign = 'start';
                        }
                    }

                } else if (showMinigun) {
                    const spin = player.minigunSpin || 0;
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(player.angle);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#4a3020';
                    ctx.fillRect(-14, -4, 10, 8);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#cc8833';
                    ctx.fillRect(12, 5, 6, 4);
                    ctx.fillRect(10, 7, 4, 3);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#3a3a3a';
                    ctx.fillRect(2, -9, 30, 18);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#4a4a4a';
                    ctx.fillRect(4, -7, 26, 14);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#2a2a2a';
                    ctx.fillRect(28, -11, 9, 22);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#555';
                    ctx.fillRect(36, -10, 4, 20);
                    const barrelCount = 6;
                    const barrelR = 7;
                    for (let i = 0; i < barrelCount; i++) {
                        const angle = spin + (i / barrelCount) * Math.PI * 2;
                        const bx = 40 + Math.cos(angle) * barrelR;
                        const by = Math.sin(angle) * barrelR;
                        ctx.fillStyle = invulnBlink ? '#ffffff' : '#383838';
                        ctx.fillRect(bx, by - 2, 10, 4);
                        ctx.fillStyle = invulnBlink ? '#ffffff' : '#2a2a2a';
                        ctx.fillRect(bx + 1, by - 1, 8, 2);
                    }
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#444';
                    ctx.beginPath();
                    ctx.arc(45, 0, barrelR + 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#555';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#5a3a2a';
                    ctx.fillRect(0, 8, 7, 13);
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#4a2a1a';
                    ctx.fillRect(1, 9, 5, 11);
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#333';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(2, 7);
                    ctx.lineTo(6, 12);
                    ctx.lineTo(11, 9);
                    ctx.stroke();
                    if (player.minigunMuzzleFlash > 0) {
                        const flashAlpha = player.minigunMuzzleFlash / 0.06;
                        ctx.fillStyle = 'rgba(255,200,40,' + (flashAlpha * 0.9) + ')';
                        ctx.beginPath();
                        ctx.arc(48, 0, 9 + Math.random() * 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,200,' + (flashAlpha * 0.7) + ')';
                        ctx.beginPath();
                        ctx.arc(48, 0, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    if (player.minigunMuzzleFlash > 0 && Math.random() < 0.5) {
                        const ejectAngle = player.angle - Math.PI / 2 + (Math.random() - 0.5) * 0.4;
                        const ejectX = px + Math.cos(player.angle) * 5 + Math.cos(ejectAngle) * 10;
                        const ejectY = py + Math.sin(player.angle) * 5 + Math.sin(ejectAngle) * 10;
                        particles.push({
                            x: ejectX,
                            y: ejectY,
                            vx: Math.cos(ejectAngle) * (60 + Math.random() * 80),
                            vy: Math.sin(ejectAngle) * (40 + Math.random() * 60),
                            life: 0.4,
                            maxLife: 0.4,
                            color: '#cc9933',
                            size: 2 + Math.random() * 2,
                        });
                    }
                } else if (selectedCharacter === 'sorcerer') {
                    const tipX = px + Math.cos(player.angle) * size * 1.2;
                    const tipY = py + Math.sin(player.angle) * size * 1.2;
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#b57edc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();
                    const glowPulse = 1 + Math.sin(Date.now() / 200) * 0.25;
                    ctx.fillStyle = 'rgba(255,120,40,0.5)';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 4.5 * glowPulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff8844';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (player.attackSwingTimer > 0) {
                    const swingProgress = 1 - (player.attackSwingTimer / SWING_DURATION);
                    const halfArc = player.attackSwingArc / 2;
                    const swingStartAngle = player.angle - halfArc;
                    const swingEndAngle = player.angle + halfArc;
                    const swingAngle = swingStartAngle + swingProgress * player.attackSwingArc;
                    const arcAlpha = Math.max(0, (1 - swingProgress) * 0.55);
                    ctx.strokeStyle = 'rgba(255,245,200,' + arcAlpha + ')';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(px, py, size * 1.35, swingStartAngle, swingAngle);
                    ctx.stroke();
                    const glowAlpha = Math.max(0, (1 - swingProgress) * 0.25);
                    ctx.strokeStyle = 'rgba(255,255,220,' + glowAlpha + ')';
                    ctx.lineWidth = 9;
                    ctx.beginPath();
                    ctx.arc(px, py, size * 1.35, swingStartAngle, swingAngle);
                    ctx.stroke();
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#f0e8d0';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    const weaponLen = size * 1.5;
                    ctx.lineTo(px + Math.cos(swingAngle) * weaponLen, py + Math.sin(swingAngle) * weaponLen);
                    ctx.stroke();
                    const tipX = px + Math.cos(swingAngle) * weaponLen;
                    const tipY = py + Math.sin(swingAngle) * weaponLen;
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#fff8e0';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    const lineCount = 3;
                    for (let i = 0; i < lineCount; i++) {
                        const lx = tipX - Math.cos(swingAngle) * (4 + i * 5) +
                            Math.cos(swingAngle + Math.PI / 2) * (i - 1) * 3;
                        const ly = tipY - Math.sin(swingAngle) * (4 + i * 5) +
                            Math.sin(swingAngle + Math.PI / 2) * (i - 1) * 3;
                        const la = (1 - swingProgress) * 0.7 * (1 - i / lineCount);
                        ctx.strokeStyle = 'rgba(255,255,240,' + la + ')';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(lx - Math.cos(swingAngle) * 10, ly - Math.sin(swingAngle) * 10);
                        ctx.stroke();
                    }
                } else {
                    ctx.strokeStyle = invulnBlink ? '#ffffff' : '#d0c8b8';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + Math.cos(player.angle) * size * 1.3, py + Math.sin(player.angle) * size * 1.3);
                    ctx.stroke();
                    const tipX = px + Math.cos(player.angle) * size * 1.3;
                    const tipY = py + Math.sin(player.angle) * size * 1.3;
                    ctx.fillStyle = invulnBlink ? '#ffffff' : '#f0e8d0';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                const eyeX = Math.cos(player.angle) * 3;
                const eyeY = Math.sin(player.angle) * 3;
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(px + eyeX, py - size * 0.5, 2, 0, Math.PI * 2);
                ctx.fill();

                if (player.health < player.maxHealth) {
                    const barW = 28;
                    const barH = 4;
                    const barY = py - size - 10;
                    ctx.fillStyle = '#300000';
                    ctx.fillRect(px - barW / 2, barY, barW, barH);
                    ctx.fillStyle = '#cc2222';
                    ctx.fillRect(px - barW / 2, barY, barW * (player.health / player.maxHealth), barH);
                }
            }

            function drawMinion(minion, mx, my) {
                const s = minion.size;
                const flashColor = minion.hitFlash > 0 ? '#ffffff' : minion.color;
                const isMoving = minion.isMoving;
                const walkPhase = minion.walkTimer || 0;
                const isArcher = minion.minionType === 'archer';
                const isMinigun = minion.minionType === 'minigun';
                const isRailgun = minion.minionType === 'railgun';
                const bobY = isMoving ? Math.sin(walkPhase * 2) * 1.5 : 0;
                const bodyY = my - s * 0.08 + bobY;

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(mx, my + s * 0.65, s * 0.7, s * 0.22, 0, 0, Math.PI * 2);
                ctx.fill();

                const hipY = bodyY + s * 0.3;
                const legLen = s * 0.55;
                const kneeY = hipY + legLen * 0.5;
                const footY = hipY + legLen;
                const lPhase = walkPhase;
                const lKneeX = mx - s * 0.15 + Math.sin(lPhase) * s * 0.35;
                const lFootX = lKneeX + Math.sin(lPhase) * s * 0.25;
                ctx.strokeStyle = flashColor;
                ctx.lineWidth = 2.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(mx - s * 0.2, hipY);
                ctx.lineTo(lKneeX, kneeY);
                ctx.lineTo(lFootX, footY);
                ctx.stroke();
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(lFootX, footY, 2.2, 0, Math.PI * 2);
                ctx.fill();

                const rPhase = walkPhase + Math.PI;
                const rKneeX = mx + s * 0.15 + Math.sin(rPhase) * s * 0.35;
                const rFootX = rKneeX + Math.sin(rPhase) * s * 0.25;
                ctx.strokeStyle = flashColor;
                ctx.beginPath();
                ctx.moveTo(mx + s * 0.2, hipY);
                ctx.lineTo(rKneeX, kneeY);
                ctx.lineTo(rFootX, footY);
                ctx.stroke();
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(rFootX, footY, 2.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#d8ccb4';
                ctx.beginPath();
                ctx.ellipse(mx, hipY, s * 0.28, s * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();

                const spineTop = bodyY - s * 0.35;
                ctx.strokeStyle = '#ddd0c0';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(mx, hipY - s * 0.05);
                ctx.lineTo(mx, spineTop);
                ctx.stroke();
                for (let v = 0; v < 4; v++) {
                    const vy = hipY - s * 0.08 - v * s * 0.1;
                    ctx.fillStyle = '#ddd0c0';
                    ctx.beginPath();
                    ctx.arc(mx, vy, 1.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                const ribTop = spineTop + s * 0.08;
                const ribBottom = hipY - s * 0.2;
                ctx.strokeStyle = '#d4c8b0';
                ctx.lineWidth = 2;
                for (let r = 0; r < 4; r++) {
                    const ry = ribTop + r * (ribBottom - ribTop) / 3;
                    const ribWidth = s * 0.3 + r * s * 0.03;
                    ctx.beginPath();
                    ctx.moveTo(mx - ribWidth, ry);
                    ctx.quadraticCurveTo(mx, ry - s * 0.06, mx + ribWidth, ry);
                    ctx.stroke();
                }

                const shoulderY = spineTop + s * 0.02;
                const upperArmLen = s * 0.35;
                const forearmLen = s * 0.3;
                const laPhase = walkPhase + Math.PI;
                const lShoulderX = mx - s * 0.35;
                const lElbowX = lShoulderX + Math.sin(laPhase) * s * 0.22;
                const lElbowY = shoulderY + upperArmLen * 0.65;
                const lHandX = lElbowX + Math.sin(laPhase) * s * 0.18;
                const lHandY = lElbowY + forearmLen * 0.75;
                ctx.strokeStyle = flashColor;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(lShoulderX, shoulderY);
                ctx.lineTo(lElbowX, lElbowY);
                ctx.lineTo(lHandX, lHandY);
                ctx.stroke();
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(lHandX, lHandY, 1.8, 0, Math.PI * 2);
                ctx.fill();

                const raPhase = walkPhase;
                const rShoulderX = mx + s * 0.35;
                const rElbowX = rShoulderX + Math.sin(raPhase) * s * 0.22;
                const rElbowY = shoulderY + upperArmLen * 0.65;
                const rHandX = rElbowX + Math.sin(raPhase) * s * 0.18;
                const rHandY = rElbowY + forearmLen * 0.75;
                ctx.strokeStyle = flashColor;
                ctx.beginPath();
                ctx.moveTo(rShoulderX, shoulderY);
                ctx.lineTo(rElbowX, rElbowY);
                ctx.lineTo(rHandX, rHandY);
                ctx.stroke();
                ctx.fillStyle = flashColor;
                ctx.beginPath();
                ctx.arc(rHandX, rHandY, 1.8, 0, Math.PI * 2);
                ctx.fill();

                const headY = spineTop - s * 0.22;
                const skullR = s * 0.32;
                ctx.fillStyle = '#f5efe0';
                ctx.beginPath();
                ctx.arc(mx, headY, skullR, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ede4d4';
                ctx.beginPath();
                ctx.moveTo(mx - skullR * 0.65, headY + skullR * 0.25);
                ctx.lineTo(mx + skullR * 0.65, headY + skullR * 0.25);
                ctx.lineTo(mx + skullR * 0.45, headY + skullR * 0.75);
                ctx.lineTo(mx - skullR * 0.45, headY + skullR * 0.75);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#f0e8d8';
                ctx.beginPath();
                ctx.arc(mx - skullR * 0.5, headY + skullR * 0.15, skullR * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(mx + skullR * 0.5, headY + skullR * 0.15, skullR * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f5efe0';
                ctx.beginPath();
                ctx.arc(mx, headY, skullR, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0d0d0d';
                ctx.beginPath();
                ctx.ellipse(mx - skullR * 0.32, headY - skullR * 0.08, skullR * 0.25, skullR * 0.28, 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(mx + skullR * 0.32, headY - skullR * 0.08, skullR * 0.25, skullR * 0.28, -0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200,40,40,0.55)';
                ctx.beginPath();
                ctx.arc(mx - skullR * 0.32, headY - skullR * 0.08, skullR * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(mx + skullR * 0.32, headY - skullR * 0.08, skullR * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0d0d0d';
                ctx.beginPath();
                ctx.moveTo(mx, headY + skullR * 0.02);
                ctx.lineTo(mx - skullR * 0.16, headY + skullR * 0.28);
                ctx.lineTo(mx + skullR * 0.16, headY + skullR * 0.28);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#e8dcc8';
                for (let t = -2; t <= 2; t++) {
                    ctx.fillRect(mx + t * 3.2 - 1.5, headY + skullR * 0.38, 3, 3.5);
                }

                if (isRailgun) {
                    const rgAngle = minion.angle || 0;
                    const rgOriginX = mx + Math.cos(rgAngle) * s * 0.35;
                    const rgOriginY = my + Math.sin(rgAngle) * s * 0.2;
                    ctx.save();
                    ctx.translate(rgOriginX, rgOriginY);
                    ctx.rotate(rgAngle);
                    ctx.fillStyle = '#2a2a3a';
                    ctx.fillRect(-3, -3, 20, 6);
                    ctx.fillStyle = '#3a3a4a';
                    ctx.fillRect(-2, -2, 18, 4);
                    for (let c = 0; c < 3; c++) {
                        const coilX = 2 + c * 6;
                        const coilGlow = 0.5 + Math.sin(Date.now() / 200 + c) * 0.3;
                        const coilAlpha = 0.4 + coilGlow * (minion.railgunCharging ? 0.8 : 0.3);
                        ctx.fillStyle = 'rgba(68,140,220,' + coilAlpha + ')';
                        ctx.fillRect(coilX, -4, 3, 8);
                        ctx.fillStyle = 'rgba(120,180,240,' + (coilAlpha * 0.6) + ')';
                        ctx.fillRect(coilX + 0.5, -3, 2, 6);
                    }
                    ctx.fillStyle = '#1a1a28';
                    ctx.fillRect(18, -3, 5, 6);
                    ctx.fillStyle = '#111122';
                    ctx.fillRect(22, -2.5, 4, 5);

                    const chargeGlow = minion.railgunCharging ? minion.railgunCharge : 0;
                    const tipGlowAlpha = 0.3 + chargeGlow * 0.65;
                    const tipGlowR = 3 + chargeGlow * 9;
                    ctx.fillStyle = 'rgba(100,160,255,' + tipGlowAlpha + ')';
                    ctx.beginPath();
                    ctx.arc(26, 0, tipGlowR, 0, Math.PI * 2);
                    ctx.fill();
                    if (chargeGlow > 0.3) {
                        ctx.fillStyle = 'rgba(160,210,255,' + (chargeGlow * 0.6) + ')';
                        ctx.beginPath();
                        ctx.arc(26, 0, tipGlowR * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = '#4a3a2a';
                    ctx.fillRect(-1, 4, 5, 8);
                    ctx.fillStyle = '#3a2a1a';
                    ctx.fillRect(0, 5, 3, 6);
                    ctx.fillStyle = '#2a2a38';
                    ctx.fillRect(8, -8, 8, 3);
                    ctx.fillStyle = 'rgba(80,150,240,' + (0.2 + chargeGlow * 0.4) + ')';
                    ctx.fillRect(9, -7, 6, 1.5);
                    ctx.restore();
                    ctx.strokeStyle = '#556688';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(mx + Math.cos(rgAngle) * s * 0.2, my + Math.sin(rgAngle) * s * 0.1);
                    ctx.lineTo(rgOriginX, rgOriginY);
                    ctx.stroke();

                    // Charge bar for railgun minion
                    if (minion.railgunCharging) {
                        const barW = s * 1.6;
                        const barH = 3;
                        const barX = mx - barW / 2;
                        const barY = my - s * 1.15;
                        ctx.fillStyle = '#0a0a20';
                        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
                        const chargeRatio = minion.railgunCharge;
                        let barColor;
                        if (chargeRatio >= 0.99) barColor = '#ffffff';
                        else if (chargeRatio > 0.5) barColor = '#88ddff';
                        else barColor = '#4488cc';
                        ctx.fillStyle = barColor;
                        ctx.fillRect(barX, barY, barW * chargeRatio, barH);
                        ctx.fillStyle = 'rgba(80,150,240,' + (0.15 + chargeRatio * 0.4) + ')';
                        ctx.fillRect(barX - 1.5, barY - 1.5, (barW + 3) * chargeRatio, barH + 3);
                    }
                } else if (isMinigun) {
                    const mgAngle = minion.angle || 0;
                    const mgOriginX = mx + Math.cos(mgAngle) * s * 0.35;
                    const mgOriginY = my + Math.sin(mgAngle) * s * 0.2;
                    ctx.save();
                    ctx.translate(mgOriginX, mgOriginY);
                    ctx.rotate(mgAngle);
                    ctx.fillStyle = '#4a4a4a';
                    ctx.fillRect(-4, -5, 16, 10);
                    ctx.fillStyle = '#3a3a3a';
                    ctx.fillRect(-3, -4, 14, 8);
                    ctx.fillStyle = '#2a2a2a';
                    ctx.fillRect(10, -6, 6, 12);
                    const mgBarrelCount = 5;
                    const mgBarrelR = 3.8;
                    const mgSpin = minion.minigunSpin || 0;
                    for (let i = 0; i < mgBarrelCount; i++) {
                        const angle = mgSpin + (i / mgBarrelCount) * Math.PI * 2;
                        const bx = 14 + Math.cos(angle) * mgBarrelR;
                        const by = Math.sin(angle) * mgBarrelR;
                        ctx.fillStyle = '#383838';
                        ctx.fillRect(bx, by - 1.5, 7, 3);
                        ctx.fillStyle = '#2a2a2a';
                        ctx.fillRect(bx + 1, by - 1, 5, 2);
                    }
                    ctx.fillStyle = '#444';
                    ctx.beginPath();
                    ctx.arc(18, 0, mgBarrelR + 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                    ctx.fillStyle = '#5a3a2a';
                    ctx.fillRect(-2, 5, 5, 7);
                    if (minion.minigunMuzzleFlash > 0) {
                        const flashAlpha = minion.minigunMuzzleFlash / 0.06;
                        ctx.fillStyle = 'rgba(255,200,40,' + (flashAlpha * 0.85) + ')';
                        ctx.beginPath();
                        ctx.arc(20, 0, 6 + Math.random() * 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,200,' + (flashAlpha * 0.6) + ')';
                        ctx.beginPath();
                        ctx.arc(20, 0, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    ctx.strokeStyle = '#cc8833';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(mx + Math.cos(mgAngle) * s * 0.35 + Math.cos(mgAngle + Math.PI / 2) * 5,
                        my + Math.sin(mgAngle) * s * 0.2 + Math.sin(mgAngle + Math.PI / 2) * 5);
                    ctx.lineTo(mx + Math.cos(mgAngle) * s * 0.1 - Math.cos(mgAngle + Math.PI / 2) * 3,
                        my + Math.sin(mgAngle) * s * 0.1 - Math.sin(mgAngle + Math.PI / 2) * 3);
                    ctx.stroke();
                } else {
                    const weaponAngle = minion.angle || 0;
                    const weaponStartX = mx + Math.cos(weaponAngle) * s * 0.25;
                    const weaponStartY = bodyY + Math.sin(weaponAngle) * s * 0.25;
                    const weaponEndX = mx + Math.cos(weaponAngle) * s * 1.15;
                    const weaponEndY = bodyY + Math.sin(weaponAngle) * s * 1.15;
                    ctx.strokeStyle = '#c8c0b0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(weaponStartX, weaponStartY);
                    ctx.lineTo(weaponEndX, weaponEndY);
                    ctx.stroke();
                    ctx.fillStyle = '#ddd8d0';
                    ctx.beginPath();
                    ctx.arc(weaponEndX, weaponEndY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    const crossX = weaponStartX + Math.cos(weaponAngle) * s * 0.08;
                    const crossY = weaponStartY + Math.sin(weaponAngle) * s * 0.08;
                    ctx.strokeStyle = '#b0a890';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(crossX + Math.cos(weaponAngle + Math.PI / 2) * s * 0.15,
                        crossY + Math.sin(weaponAngle + Math.PI / 2) * s * 0.15);
                    ctx.lineTo(crossX - Math.cos(weaponAngle + Math.PI / 2) * s * 0.15,
                        crossY - Math.sin(weaponAngle + Math.PI / 2) * s * 0.15);
                    ctx.stroke();
                    if (isArcher) {
                        const bowAngle = minion.angle || 0;
                        const bowCenterX = mx + Math.cos(bowAngle) * s * 0.4;
                        const bowCenterY = my + Math.sin(bowAngle) * s * 0.3;
                        const bowRadius = s * 0.75;
                        ctx.strokeStyle = '#b89570';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(bowCenterX, bowCenterY, bowRadius, bowAngle - Math.PI * 0.55, bowAngle + Math.PI * 0.55);
                        ctx.stroke();
                        ctx.strokeStyle = '#d4c8a0';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(
                            bowCenterX + Math.cos(bowAngle - Math.PI * 0.55) * bowRadius,
                            bowCenterY + Math.sin(bowAngle - Math.PI * 0.55) * bowRadius
                        );
                        ctx.lineTo(
                            bowCenterX + Math.cos(bowAngle + Math.PI * 0.55) * bowRadius,
                            bowCenterY + Math.sin(bowAngle + Math.PI * 0.55) * bowRadius
                        );
                        ctx.stroke();
                        const nockX = bowCenterX + Math.cos(bowAngle) * bowRadius * 0.85;
                        const nockY = bowCenterY + Math.sin(bowAngle) * bowRadius * 0.85;
                        ctx.fillStyle = '#ffe8a0';
                        ctx.beginPath();
                        ctx.arc(nockX, nockY, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,220,140,0.3)';
                        ctx.beginPath();
                        ctx.arc(nockX, nockY, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.fillStyle = 'rgba(80,140,220,0.18)';
                ctx.beginPath();
                ctx.arc(mx, my, s * 0.85, 0, Math.PI * 2);
                ctx.fill();

                if (minion.health < minion.maxHealth) {
                    const barW = s * 1.9;
                    const barH = 2.5;
                    const barY = my - s * 0.95;
                    ctx.fillStyle = '#200000';
                    ctx.fillRect(mx - barW / 2, barY, barW, barH);
                    ctx.fillStyle = isRailgun ? '#6699ff' : (isMinigun ? '#ff8844' : '#7799cc');
                    ctx.fillRect(mx - barW / 2, barY, barW * (minion.health / minion.maxHealth), barH);
                }
                const timeRatio = minion.lifetime / minion.maxLifetime;
                const pieX = mx;
                const pieY = my - s * 1.05;
                const pieR = 5.5;
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(pieX, pieY, pieR, 0, Math.PI * 2);
                ctx.stroke();
                if (timeRatio > 0.001) {
                    let pieColor;
                    if (timeRatio > 0.5) {
                        pieColor = '#44cc44';
                    } else if (timeRatio > 0.25) {
                        pieColor = '#cccc44';
                    } else {
                        pieColor = '#cc4444';
                    }
                    ctx.fillStyle = pieColor;
                    ctx.beginPath();
                    ctx.moveTo(pieX, pieY);
                    ctx.arc(pieX, pieY, pieR - 1.2, -Math.PI / 2, -Math.PI / 2 + timeRatio * Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.beginPath();
                    ctx.arc(pieX, pieY, pieR - 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
