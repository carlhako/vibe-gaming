<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Maze Defense</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0b0e17; color: #c8d6e5;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex; justify-content: center; align-items: flex-start;
        min-height: 100vh; user-select: none; padding: 10px 0;
    }
    #game-container {
        display: flex; flex-direction: row; align-items: flex-start; gap: 8px;
        padding: 10px; background: #141b2b; border-radius: 14px;
        box-shadow: 0 0 40px rgba(0, 180, 255, 0.12);
        border: 1px solid #243447;
        max-width: 860px;
    }
    #main-area {
        display: flex; flex-direction: column; gap: 6px;
        flex-shrink: 0;
    }
    #canvas-wrap {
        position: relative; border-radius: 10px; overflow: hidden;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6); border: 2px solid #1e2d3d;
        flex-shrink: 0; line-height: 0;
    }
    canvas { display: block; background: #1a2332; cursor: crosshair; max-width: 100%; height: auto; }

    /* ── Bottom Dock ── */
    #bottom-dock {
        display: flex; gap: 6px; padding: 6px 8px;
        background: #0e1520; border-radius: 10px;
        border: 1px solid #1e2d3d;
        width: 616px; max-width: 100%;
        flex-wrap: wrap; align-items: flex-end;
    }
    .dock-group {
        display: flex; flex-direction: column; gap: 2px;
    }
    .dock-label {
        font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px;
        color: #5f7a9a; padding-left: 2px; white-space: nowrap;
    }
    .dock-row {
        display: flex; gap: 3px; flex-wrap: wrap;
    }
    .tower-btn {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #101826; border: 1px solid #1e2d3d; border-radius: 7px;
        padding: 3px 7px; color: #c8d6e5;
        cursor: pointer; transition: all 0.15s; text-align: center;
        min-width: 52px; height: 48px; gap: 0px; line-height: 1.15;
    }
    .tower-btn:hover { background: #1a2a40; border-color: #3a5a7a; }
    .tower-btn.selected { border-color: #5dade2; background: #0d2137; box-shadow: 0 0 10px rgba(93, 173, 226, 0.3); }
    .tower-btn .tname { font-size: 9px; font-weight: 600; white-space: nowrap; }
    .tower-btn .cost { font-size: 8px; color: #f1c40f; font-weight: 400; }
    .tower-btn .ticon { font-size: 15px; line-height: 1; }
    .tower-btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .tower-btn.buff-btn { border-left: 2px solid #8e44ad; }
    .tower-btn.econ-btn { border-left: 2px solid #f39c12; }

    /* ── Right Sidebar ── */
    #right-sidebar {
        display: flex; flex-direction: column; gap: 5px;
        width: 200px; flex-shrink: 0; min-width: 180px;
        font-size: 11px;
    }
    #action-bar {
        display: flex; gap: 4px; justify-content: center;
        padding: 4px;
        background: #0e1520; border-radius: 8px;
        border: 1px solid #1e2d3d;
    }
    #action-bar button {
        width: 34px; height: 34px; background: #101826; border: 1px solid #1e2d3d;
        border-radius: 7px; color: #c8d6e5; font-size: 15px;
        cursor: pointer; transition: all 0.15s; display: flex; align-items: center;
        justify-content: center; padding: 0; line-height: 1;
    }
    #action-bar button:hover { background: #1a2a40; border-color: #3a5a7a; }
    #action-bar button.primary { background: #1a5a3a; border-color: #2a8a5a; color: #a0f0c0; }
    #action-bar button.primary:hover { background: #206a44; }
    #action-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
    #speed-btn { width: 40px; font-size: 12px; font-weight: 700; }
    #speed-btn:hover { background: #1a2a40; border-color: #3a5a7a; }

    #difficulty-badge {
        padding: 3px 8px; background: #101826; border-radius: 6px;
        border: 1px solid #1e2d3d; font-weight: 600; font-size: 10px;
        display: none; text-align: center; white-space: nowrap;
    }
    #difficulty-badge.easy { color: #2ecc71; border-color: #1a5a3a; }
    #difficulty-badge.medium { color: #f1c40f; border-color: #5a4a1a; }
    #difficulty-badge.hard { color: #e74c3c; border-color: #5a1a1a; }

    #stats {
        background: #0e1520; border-radius: 6px; padding: 5px 8px;
        border: 1px solid #1e2d3d; display: grid;
        grid-template-columns: 1fr 1fr; gap: 2px 6px;
    }
    #stats span { font-weight: 600; font-size: 10px; white-space: nowrap; }
    .stat-val { color: #f0f4ff; }
    #money-val { color: #f1c40f; }
    #lives-val { color: #e74c3c; }
    #wave-val { color: #5dade2; }

    #seed-display-panel {
        background: #0e1520; border-radius: 6px; padding: 4px 6px;
        border: 1px solid #1e2d3d; display: none; align-items: center;
        gap: 4px; font-size: 10px;
    }
    #seed-display-panel .seed-label { color: #5f7a9a; font-weight: 600; white-space: nowrap; font-size: 9px; }
    #seed-display-panel .seed-value {
        color: #f0f4ff; font-family: 'Consolas', monospace;
        font-size: 11px; letter-spacing: 1px; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis;
    }
    #seed-copy-btn {
        background: #101826; border: 1px solid #2a3a4a; border-radius: 4px;
        padding: 2px 6px; color: #8aa0c0; font-size: 10px; cursor: pointer;
        transition: all 0.15s; font-family: inherit; white-space: nowrap; line-height: 1.2;
    }
    #seed-copy-btn:hover { background: #1a2a40; border-color: #3a5a7a; color: #c8d6e5; }
    #seed-copy-btn.copied { color: #2ecc71; border-color: #2a8a5a; background: #1a3a2a; }

    #info-box {
        background: #0e1520; border-radius: 8px; padding: 7px 9px;
        border: 1px solid #1e2d3d; min-height: 48px; font-size: 11px;
        line-height: 1.35; color: #9ab0cc; max-height: 130px; overflow-y: auto;
    }
    #info-box .highlight { color: #f0f4ff; font-weight: 600; }
    #info-box .enemy-highlight { color: #e74c3c; font-weight: 700; }
    #info-box .buff-highlight { color: #c39bdb; font-weight: 600; }
    #info-box .split-info { color: #f39c12; font-weight: 600; }

    #tower-controls { display: flex; flex-direction: column; gap: 3px; }
    #upgrade-btn {
        display: none; width: 100%;
        background: #1a3a2a; border: 1px solid #2a6a4a; border-radius: 6px;
        padding: 5px 6px; color: #a0f0c0; font-size: 11px; font-weight: 600;
        cursor: pointer; transition: all 0.15s; text-align: center;
    }
    #upgrade-btn:hover { background: #1f4a34; }
    #upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #target-btns { display: none; gap: 3px; flex-wrap: wrap; }
    #target-btns button {
        flex: 1; min-width: 36px; background: #101826; border: 1px solid #1e2d3d;
        border-radius: 5px; padding: 4px 2px; color: #c8d6e5; font-size: 10px;
        font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center;
    }
    #target-btns button:hover { background: #1a2a40; border-color: #3a5a7a; }
    #target-btns button.active { border-color: #5dade2; background: #0d2137; }

    #delete-btn {
        display: none; width: 100%;
        background: #3a1a1a; border: 1px solid #6a2a2a; border-radius: 6px;
        padding: 5px 6px; color: #f0a0a0; font-size: 11px; font-weight: 600;
        cursor: pointer; transition: all 0.15s; text-align: center;
    }
    #delete-btn:hover { background: #4a2020; }

    /* ── Overlays ── */
    #game-over-overlay {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75);
        display: none; flex-direction: column; justify-content: center;
        align-items: center; border-radius: 10px; z-index: 10;
    }
    #game-over-overlay.show { display: flex; }
    #game-over-overlay h1 { font-size: 38px; margin-bottom: 6px; text-shadow: 0 0 30px rgba(231, 76, 60, 0.5); }
    #game-over-overlay .sub { font-size: 17px; color: #9ab0cc; margin-bottom: 16px; }
    #game-over-overlay button {
        padding: 10px 34px; font-size: 16px; background: #1a5a3a;
        border: 2px solid #2a8a5a; border-radius: 10px; color: #f0f4ff;
        font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    #game-over-overlay button:hover { background: #206a44; transform: scale(1.05); }

    #difficulty-overlay {
        position: absolute; inset: 0; background: rgba(5, 8, 15, 0.93);
        display: none; flex-direction: column; justify-content: center;
        align-items: center; border-radius: 10px; z-index: 20; gap: 10px;
    }
    #difficulty-overlay.show { display: flex; }
    #difficulty-overlay h1 { font-size: 32px; color: #5dade2; text-shadow: 0 0 25px rgba(93, 173, 226, 0.4); margin-bottom: 2px; }
    #difficulty-overlay .subtitle { font-size: 14px; color: #9ab0cc; margin-bottom: 4px; }
    #difficulty-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .diff-btn {
        padding: 14px 18px; font-size: 14px; font-weight: 700; border-radius: 10px;
        cursor: pointer; transition: all 0.2s; border: 2px solid; color: #f0f4ff;
        min-width: 120px; background: transparent; text-align: center;
        line-height: 1.3; font-family: inherit;
    }
    .diff-btn:hover { transform: scale(1.06); box-shadow: 0 0 18px rgba(255,255,255,0.1); }
    .diff-btn.easy-btn { background: #1a3a2a; border-color: #2a8a5a; }
    .diff-btn.easy-btn:hover { background: #1f4a34; box-shadow: 0 0 20px rgba(46, 204, 113, 0.25); }
    .diff-btn.med-btn { background: #3a2e1a; border-color: #8a7a2a; }
    .diff-btn.med-btn:hover { background: #4a3a1f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.25); }
    .diff-btn.hard-btn { background: #3a1a1a; border-color: #8a2a2a; }
    .diff-btn.hard-btn:hover { background: #4a1f1f; box-shadow: 0 0 20px rgba(231, 76, 60, 0.25); }
    .diff-btn .detail { font-size: 10px; font-weight: 400; opacity: 0.85; margin-top: 2px; color: #c8d6e5; }

    #seed-section-overlay {
        display: flex; align-items: center; gap: 6px;
        background: rgba(16, 24, 38, 0.85); border: 1px solid #2a3a4a;
        border-radius: 8px; padding: 6px 12px; margin-bottom: 2px;
    }
    #seed-section-overlay label { font-size: 12px; font-weight: 600; color: #8aa0c0; white-space: nowrap; }
    #seed-input-overlay {
        background: #0b0e17; border: 1px solid #2a3a4a; border-radius: 5px;
        padding: 5px 8px; color: #f0f4ff; font-family: 'Consolas', monospace;
        font-size: 13px; width: 90px; text-align: center; letter-spacing: 1px;
        outline: none; transition: border-color 0.15s;
    }
    #seed-input-overlay:focus { border-color: #5dade2; box-shadow: 0 0 8px rgba(93, 173, 226, 0.2); }
    #seed-input-overlay.invalid { border-color: #e74c3c; box-shadow: 0 0 8px rgba(231, 76, 60, 0.3); }
    .seed-btn {
        padding: 5px 10px; font-size: 11px; font-weight: 600; border-radius: 5px;
        cursor: pointer; transition: all 0.15s; border: 1px solid #2a3a4a;
        color: #c8d6e5; background: #101826; font-family: inherit; white-space: nowrap;
    }
    .seed-btn:hover { background: #1a2a40; border-color: #3a5a7a; }
    .seed-btn.load-btn { background: #1a3a2a; border-color: #2a6a4a; color: #a0f0c0; }
    .seed-btn.load-btn:hover { background: #1f4a34; }
    .seed-btn.rand-btn { font-size: 14px; padding: 5px 8px; }
    #seed-error-overlay { font-size: 10px; color: #e74c3c; text-align: center; min-height: 14px; line-height: 14px; margin-top: -4px; margin-bottom: 2px; }

    /* ── Responsive ── */
    @media (max-width: 880px) {
        #game-container { flex-direction: column; align-items: center; max-width: 100%; padding: 8px; gap: 6px; }
        #right-sidebar { width: 100%; min-width: 0; max-width: 616px; flex-direction: row; flex-wrap: wrap; gap: 4px; }
        #right-sidebar > * { flex: 1 1 auto; min-width: 100px; }
        #action-bar { width: 100%; justify-content: center; }
        #stats { grid-template-columns: repeat(5, auto); justify-content: center; }
        #info-box { width: 100%; max-height: 90px; }
        #tower-controls { width: 100%; }
        #difficulty-overlay h1 { font-size: 24px; }
        #difficulty-buttons { gap: 6px; }
        .diff-btn { padding: 10px 14px; font-size: 12px; min-width: 90px; }
        #seed-section-overlay { flex-wrap: wrap; justify-content: center; gap: 4px; padding: 5px 8px; }
        #seed-input-overlay { width: 70px; font-size: 11px; }
    }
    @media (max-width: 500px) {
        #game-container { padding: 4px; gap: 4px; }
        #bottom-dock { gap: 3px; padding: 4px 5px; }
        .tower-btn { min-width: 44px; height: 42px; padding: 2px 4px; }
        .tower-btn .ticon { font-size: 13px; }
        .tower-btn .tname { font-size: 8px; }
        .tower-btn .cost { font-size: 7px; }
        .dock-label { font-size: 7px; }
        #right-sidebar { gap: 3px; }
        #stats { grid-template-columns: repeat(3, auto); gap: 1px 4px; }
        #stats span { font-size: 9px; }
        #action-bar button { width: 28px; height: 28px; font-size: 13px; }
        #speed-btn { width: 34px; font-size: 10px; }
        #difficulty-buttons { flex-direction: column; gap: 4px; }
        .diff-btn { min-width: auto; width: 100%; padding: 10px 12px; font-size: 12px; }
        #game-over-overlay h1 { font-size: 28px; }
        #game-over-overlay .sub { font-size: 14px; }
        #game-over-overlay button { padding: 8px 24px; font-size: 14px; }
    }
</style>
</head>
<body>
<div id="game-container">
    <div id="main-area">
        <div id="canvas-wrap">
            <canvas id="gameCanvas" width="616" height="616"></canvas>
            <div id="game-over-overlay">
                <h1 style="color:#e74c3c;">GAME OVER</h1>
                <div class="sub" id="final-wave">Wave 0</div>
                <button id="restart-btn">Play Again</button>
            </div>
            <div id="difficulty-overlay" class="show">
                <h1>🏰 Tower Maze Defense</h1>
                <div class="subtitle">Select Difficulty</div>
                <div id="seed-section-overlay">
                    <label for="seed-input-overlay">🗺 Seed:</label>
                    <input type="text" id="seed-input-overlay" maxlength="8" autocomplete="off" spellcheck="false">
                    <button class="seed-btn load-btn" id="seed-load-overlay">Load</button>
                    <button class="seed-btn rand-btn" id="seed-random-overlay" title="Random seed">🎲</button>
                </div>
                <div id="seed-error-overlay"></div>
                <div id="difficulty-buttons">
                    <button class="diff-btn easy-btn">🟢 Easy<div class="detail">Standard enemies</div></button>
                    <button class="diff-btn med-btn">🟡 Medium<div class="detail">Enemies 1.2× HP</div></button>
                    <button class="diff-btn hard-btn">🔴 Hard<div class="detail">Enemies 1.4× HP<br>20% less income</div></button>
                </div>
            </div>
        </div>
        <div id="bottom-dock">
            <div class="dock-group">
                <span class="dock-label">⚔ Attack</span>
                <div class="dock-row">
                    <button class="tower-btn" data-type="arrow" title="Arrow Tower — $65"><span class="ticon">🏹</span><span class="tname">Arrow</span><span class="cost">$65</span></button>
                    <button class="tower-btn" data-type="cannon" title="Cannon Tower — $130"><span class="ticon">💥</span><span class="tname">Cannon</span><span class="cost">$130</span></button>
                    <button class="tower-btn" data-type="ice" title="Ice Tower — $95"><span class="ticon">❄️</span><span class="tname">Ice</span><span class="cost">$95</span></button>
                    <button class="tower-btn" data-type="sniper" title="Laser Tower — $190"><span class="ticon">🔫</span><span class="tname">Laser</span><span class="cost">$190</span></button>
                    <button class="tower-btn" data-type="tesla" title="Tesla Tower — $260"><span class="ticon">⚡</span><span class="tname">Tesla</span><span class="cost">$260</span></button>
                </div>
            </div>
            <div class="dock-group">
                <span class="dock-label">✨ Buff</span>
                <div class="dock-row">
                    <button class="tower-btn buff-btn" data-type="rangeBuff" title="Range+ Buff — $100"><span class="ticon">📡</span><span class="tname">Range+</span><span class="cost">$100</span></button>
                    <button class="tower-btn buff-btn" data-type="speedBuff" title="Speed+ Buff — $110"><span class="ticon">⏫</span><span class="tname">Speed+</span><span class="cost">$110</span></button>
                    <button class="tower-btn buff-btn" data-type="attackBuff" title="Power+ Buff — $120"><span class="ticon">💪</span><span class="tname">Power+</span><span class="cost">$120</span></button>
                </div>
            </div>
            <div class="dock-group">
                <span class="dock-label">💰 Econ</span>
                <div class="dock-row">
                    <button class="tower-btn econ-btn" data-type="mint" title="Mint — $500"><span class="ticon">💰</span><span class="tname">Mint</span><span class="cost">$500</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="right-sidebar">
        <div id="action-bar">
            <button id="wave-btn" class="primary" title="Start Wave">▶</button>
            <button id="new-map-btn" title="New Map">🗺</button>
            <button id="pause-btn" title="Pause">⏸</button>
            <button id="speed-btn" title="Game Speed">1×</button>
        </div>
        <div id="difficulty-badge"><span id="difficulty-label">Easy</span></div>
        <div id="stats">
            <span>💰 <span class="stat-val" id="money-val">120</span></span>
            <span>❤️ <span class="stat-val" id="lives-val">10</span></span>
            <span>🌊 <span class="stat-val" id="wave-val">0</span></span>
            <span>⚔️ <span class="stat-val" id="kill-val">0</span></span>
            <span>🏗️ <span class="stat-val" id="tower-count-val">0</span></span>
        </div>
        <div id="seed-display-panel">
            <span class="seed-label">🗺 Seed</span>
            <span class="seed-value" id="seed-display-text"></span>
            <button id="seed-copy-btn" title="Copy seed to clipboard">📋</button>
        </div>
        <div id="info-box"><div>Select a tower to place it on the grid. Each tower has a unique attack style. Buff towers boost nearby attack towers.</div></div>
        <div id="tower-controls">
            <div id="upgrade-btn">⬆ Upgrade (??)</div>
            <div id="target-btns">
                <button data-mode="nearest">🎯 Nearest</button>
                <button data-mode="first">🚩 First</button>
                <button data-mode="last">🏁 Last</button>
                <button data-mode="random">🎲 Random</button>
            </div>
            <div id="delete-btn">🗑 Delete (50% refund)</div>
        </div>
    </div>
</div>
<script>
(function() {
    'use strict';

    const SIZE = 22;
    const CELL = 28;
    const CANVAS = CELL * SIZE;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS;
    canvas.height = CANVAS;

    const moneyEl = document.getElementById('money-val');
    const livesEl = document.getElementById('lives-val');
    const waveEl = document.getElementById('wave-val');
    const killEl = document.getElementById('kill-val');
    const towerCountEl = document.getElementById('tower-count-val');
    const infoBox = document.getElementById('info-box');
    const upgradeBtn = document.getElementById('upgrade-btn');
    const targetBtns = document.getElementById('target-btns');
    const deleteBtn = document.getElementById('delete-btn');
    const waveBtn = document.getElementById('wave-btn');
    const newMapBtn = document.getElementById('new-map-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const speedBtn = document.getElementById('speed-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const finalWaveEl = document.getElementById('final-wave');
    const difficultyOverlay = document.getElementById('difficulty-overlay');
    const difficultyBadge = document.getElementById('difficulty-badge');
    const difficultyLabel = document.getElementById('difficulty-label');
    const diffBtns = document.querySelectorAll('.diff-btn');

    const seedInputOverlay = document.getElementById('seed-input-overlay');
    const seedLoadOverlay = document.getElementById('seed-load-overlay');
    const seedRandomOverlay = document.getElementById('seed-random-overlay');
    const seedErrorOverlay = document.getElementById('seed-error-overlay');
    const seedDisplayPanel = document.getElementById('seed-display-panel');
    const seedDisplayText = document.getElementById('seed-display-text');
    const seedCopyBtn = document.getElementById('seed-copy-btn');

    function mulberry32(a) {
        return function() {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            var t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function generateRandomSeed() { return Math.floor(Math.random() * 4294967296); }
    function seedToHex(seed) { return (seed >>> 0).toString(16).padStart(8, '0'); }
    function hexToSeed(hex) { const p = parseInt(hex, 16); return isNaN(p) ? null : p >>> 0; }
    function isValidHexFormat(hex) { return /^[0-9a-fA-F]{1,8}$/.test(hex) && hex.trim().length > 0; }

    const TOWER_TYPES = {
        arrow: {
            name: 'Arrow', emoji: '🏹',
            levels: [
                { cost: 65, damage: 10, range: 3.0, fireRate: 1.8, color: '#5dade2' },
                { cost: 65, damage: 18, range: 3.2, fireRate: 2.0, color: '#2e86de' },
                { cost: 95, damage: 26, range: 3.8, fireRate: 2.2, color: '#1b4f72' }
            ]
        },
        cannon: {

    // ═══════════════════════════════════════════════════════════════
    // PATH GENERATION WITH LARGER LOOPS & SPLITS
    // ═══════════════════════════════════════════════════════════════

    function generateBasePathCells(rand) {
        const size = SIZE;
        const visited = new Set();
        const amplitude = Math.floor(size * (0.42 + rand() * 0.15));
        const centerY = size / 2;
        const freq1 = 0.6 + rand() * 0.9;
        const freq2 = 2.0 + rand() * 1.5;
        const phase1 = rand() * Math.PI * 2;
        const phase2 = rand() * Math.PI * 2;
        const rawTargets = new Array(size);
        for (let x = 0; x < size; x++) {
            const t = x / (size - 1);
            const wave1 = Math.sin(t * Math.PI * 2 * freq1 + phase1) * amplitude;
            const wave2 = Math.sin(t * Math.PI * 2 * freq2 + phase2) * (amplitude * 0.5);
            rawTargets[x] = centerY + wave1 + wave2 + (rand() - 0.5) * 2.2;
        }
        const smoothed = new Array(size);
        for (let x = 0; x < size; x++) {
            let sum = rawTargets[x], count = 1;
            if (x > 0) { sum += rawTargets[x - 1]; count++; }
            if (x < size - 1) { sum += rawTargets[x + 1]; count++; }
            smoothed[x] = sum / count;
        }
        for (let x = 0; x < size; x++) smoothed[x] = Math.max(1.5, Math.min(size - 2.5, smoothed[x]));
        let startY = Math.round(smoothed[0]);
        startY = Math.max(1, Math.min(size - 2, startY));
        const path = [];
        path.push([0, startY]);
        visited.add('0,' + startY);
        let prevY = startY;
        for (let x = 1; x < size; x++) {
            const targetY = Math.round(smoothed[x]);
            const clampedTarget = Math.max(1, Math.min(size - 2, targetY));
            let curY = prevY;
            while (curY !== clampedTarget) {
                curY += curY < clampedTarget ? 1 : -1;
                const key = (x - 1) + ',' + curY;
                if (!visited.has(key)) { path.push([x - 1, curY]); visited.add(key); }
                else break;
            }
            const rightKey = x + ',' + curY;
            if (!visited.has(rightKey)) { path.push([x, curY]); visited.add(rightKey); }
            else {
                let found = false;
                for (let offset = 1; offset <= 5; offset++) {
                    for (const sign of [1, -1]) {
                        const tryY = curY + offset * sign;
                        if (tryY >= 1 && tryY < size - 1) {
                            const tryKey = x + ',' + tryY;
                            if (!visited.has(tryKey)) { path.push([x, tryY]); visited.add(tryKey); found = true; break; }
                        }
                    }
                    if (found) break;
                }
                if (!found) {
                    const fy = Math.min(Math.max(1, curY), size - 2);
                    const fk = x + ',' + fy;
                    if (!visited.has(fk)) { path.push([x, fy]); visited.add(fk); }
                }
            }
            prevY = path[path.length - 1][1];
        }
        const end = path[path.length - 1];
        if (end[0] < size - 1) {
            let cx = end[0], cy = end[1];
            while (cx < size - 1) { cx++; const k = cx + ',' + cy; if (!visited.has(k)) { path.push([cx, cy]); visited.add(k); } }
        }
        return path;
    }

    function tryAddLoop(pathCells, allPathCells, rand) {
        for (let attempt = 0; attempt < 40; attempt++) {
            const idx = 2 + Math.floor(rand() * (pathCells.length - 9));
            const fromCell = pathCells[idx];
            const toCell = pathCells[idx + 1];
            const dx = toCell[0] - fromCell[0];
            const dy = toCell[1] - fromCell[1];
            if (Math.abs(dx) + Math.abs(dy) !== 1) continue;
            const sdx = Math.sign(dx);
            const sdy = Math.sign(dy);

            let perpDirs;
            if (sdx !== 0) {
                perpDirs = [[0, 1], [0, -1]];
            } else {
                perpDirs = [[1, 0], [-1, 0]];
            }
            if (rand() < 0.5) perpDirs.reverse();

            for (const [px, py] of perpDirs) {
                const loopWidth = 6 + Math.floor(rand() * 7);
                const loopHeight = 6 + Math.floor(rand() * 7);
                const loopCells = [];
                const tempSet = new Set(allPathCells);
                let valid = true;
                let cx = fromCell[0], cy = fromCell[1];

                for (let i = 0; i < loopHeight; i++) {
                    cx += px; cy += py;
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key)) { valid = false; break; }
                    loopCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;

                for (let i = 0; i < loopWidth; i++) {
                    cx += sdx; cy += sdy;
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key)) { valid = false; break; }
                    loopCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;

                for (let i = 0; i < loopHeight; i++) {
                    cx -= px; cy -= py;
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key)) { valid = false; break; }
                    loopCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;

                for (let i = 0; i < loopWidth - 1; i++) {
                    cx -= sdx; cy -= sdy;
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key) && !(cx === toCell[0] && cy === toCell[1])) { valid = false; break; }
                    loopCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;
                if (cx !== toCell[0] || cy !== toCell[1]) continue;

                loopCells.pop();
                pathCells.splice(idx + 1, 0, ...loopCells);
                for (const [lx, ly] of loopCells) {
                    allPathCells.add(lx + ',' + ly);
                }
                return true;
            }
        }
        return false;
    }

    function tryAddSplit(pathCells, allPathCells, rand) {
        for (let attempt = 0; attempt < 45; attempt++) {
            const startIdx = 3 + Math.floor(rand() * (pathCells.length - 20));
            const minGap = 12;
            const maxGap = Math.min(28, pathCells.length - startIdx - 5);
            if (maxGap < minGap) continue;
            const endIdx = startIdx + minGap + Math.floor(rand() * (maxGap - minGap));

            const startCell = pathCells[startIdx];
            const endCell = pathCells[endIdx];
            const mainDx = endCell[0] - startCell[0];
            const mainDy = endCell[1] - startCell[1];

            let px = 0, py = 0;
            if (Math.abs(mainDx) >= Math.abs(mainDy)) {
                py = rand() < 0.5 ? 1 : -1;
            } else {
                px = rand() < 0.5 ? 1 : -1;
            }
            const perpDirs = (px === 0) ? [[0, py], [0, -py]] : [[px, 0], [-px, 0]];

            for (const [ppx, ppy] of perpDirs) {
                const branchCells = [];
                const tempSet = new Set(allPathCells);
                let valid = true;
                let cx = startCell[0], cy = startCell[1];
                const perpDist = 4 + Math.floor(rand() * 6);

                for (let i = 0; i < perpDist; i++) {
                    cx += ppx; cy += ppy;
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key)) { valid = false; break; }
                    branchCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;

                const targetCX = endCell[0] + ppx * perpDist;
                const targetCY = endCell[1] + ppy * perpDist;
                const xSteps = targetCX - cx;
                const ySteps = targetCY - cy;
                const xs = Math.sign(xSteps);
                const ys = Math.sign(ySteps);

                const wiggleAmplitude = (ppx !== 0) ? 1 : 0;

                for (let i = 0; i < Math.abs(xSteps); i++) {
                    cx += xs;
                    if (wiggleAmplitude > 0 && i > 1 && i < Math.abs(xSteps) - 1 && rand() < 0.15) {
                        const nudge = (rand() < 0.5 ? -1 : 1);
                        const nudgeY = cy + nudge;
                        if (nudgeY >= 0 && nudgeY < SIZE) {
                            const nudgeKey = cx + ',' + nudgeY;
                            if (!tempSet.has(nudgeKey)) {
                                branchCells.push([cx, nudgeY]); tempSet.add(nudgeKey);
                                cy = nudgeY;
                                const backY = cy - nudge;
                                if (i + 1 < Math.abs(xSteps)) {
                                    cx += xs; i++;
                                    const backKey = cx + ',' + backY;
                                    if (backY >= 0 && backY < SIZE && !tempSet.has(backKey)) {
                                        branchCells.push([cx, backY]); tempSet.add(backKey);
                                        cy = backY;
                                    } else {
                                        cx -= xs; i--;
                                        cy -= nudge;
                                        branchCells.pop(); tempSet.delete(nudgeKey);
                                        const key = cx + ',' + cy;
                                        if (tempSet.has(key)) { valid = false; break; }
                                        branchCells.push([cx, cy]); tempSet.add(key);
                                    }
                                }
                            }
                        }
                    }
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key)) { valid = false; break; }
                    branchCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;

                const wiggleAmplitudeY = (ppy !== 0) ? 1 : 0;
                for (let i = 0; i < Math.abs(ySteps); i++) {
                    cy += ys;
                    if (wiggleAmplitudeY > 0 && i > 1 && i < Math.abs(ySteps) - 1 && rand() < 0.15) {
                        const nudge = (rand() < 0.5 ? -1 : 1);
                        const nudgeX = cx + nudge;
                        if (nudgeX >= 0 && nudgeX < SIZE) {
                            const nudgeKey = nudgeX + ',' + cy;
                            if (!tempSet.has(nudgeKey)) {
                                branchCells.push([nudgeX, cy]); tempSet.add(nudgeKey);
                                cx = nudgeX;
                                const backX = cx - nudge;
                                if (i + 1 < Math.abs(ySteps)) {
                                    cy += ys; i++;
                                    const backKey = backX + ',' + cy;
                                    if (backX >= 0 && backX < SIZE && !tempSet.has(backKey)) {
                                        branchCells.push([backX, cy]); tempSet.add(backKey);
                                        cx = backX;
                                    } else {
                                        cy -= ys; i--;
                                        cx -= nudge;
                                        branchCells.pop(); tempSet.delete(nudgeKey);
                                        const key = cx + ',' + cy;
                                        if (tempSet.has(key)) { valid = false; break; }
                                        branchCells.push([cx, cy]); tempSet.add(key);
                                    }
                                }
                            }
                        }
                    }
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key)) { valid = false; break; }
                    branchCells.push([cx, cy]); tempSet.add(key);
                }
                if (!valid) continue;

                for (let i = 0; i < perpDist; i++) {
                    cx -= ppx; cy -= ppy;
                    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) { valid = false; break; }
                    const key = cx + ',' + cy;
                    if (tempSet.has(key) && i < perpDist - 1) { valid = false; break; }
                    if (i < perpDist - 1) {
                        branchCells.push([cx, cy]); tempSet.add(key);
                    }
                }
                if (!valid) continue;
                if (cx !== endCell[0] || cy !== endCell[1]) continue;

                for (const [bx, by] of branchCells) {
                    allPathCells.add(bx + ',' + by);
                }

                return {
                    atMainIndex: startIdx,
                    branchPath: branchCells,
                    mergeMainIndex: endIdx
                };
            }
        }
        return null;
    }

    function generatePathWithFeatures(prng) {
        const rand = prng || Math.random;
        const pathCells = generateBasePathCells(rand);
        const allPathCells = new Set(pathCells.map(([x, y]) => x + ',' + y));

        const maxLoops = rand() < 0.25 ? 3 : (rand() < 0.55 ? 2 : (rand() < 0.80 ? 1 : 0));
        let loopsAdded = 0;
        for (let attempt = 0; attempt < 20 && loopsAdded < maxLoops; attempt++) {
            if (tryAddLoop(pathCells, allPathCells, rand)) loopsAdded++;
        }

        const maxSplits = 1 + Math.floor(rand() * 4);
        const splits = [];
        for (let attempt = 0; attempt < 25 && splits.length < maxSplits; attempt++) {
            const split = tryAddSplit(pathCells, allPathCells, rand);
            if (split) splits.push(split);
        }

        const splitMap = {};
        for (const split of splits) {
            splitMap[split.atMainIndex] = split;
        }

        const buildable = Array.from({ length: SIZE }, () => Array(SIZE).fill(true));
        for (const [x, y] of pathCells) {
            if (y >= 0 && y < SIZE && x >= 0 && x < SIZE) buildable[y][x] = false;
        }
        for (const split of splits) {
            for (const [x, y] of split.branchPath) {
                if (y >= 0 && y < SIZE && x >= 0 && x < SIZE) buildable[y][x] = false;
            }
        }

        const pathStart = pathCells[0];
        const pathEnd = pathCells[pathCells.length - 1];
        const buildableCount = buildable.flat().filter(Boolean).length;

        return {
            path: pathCells,
            start: pathStart,
            end: pathEnd,
            buildable,
            buildableCount,
            splits,
            splitMap,
            allPathCellSet: allPathCells,
            loopCount: loopsAdded,
            splitCount: splits.length
        };
    }

    function generatePath(prng) {
        const result = generatePathWithFeatures(prng);
        return {
            path: result.path,
            buildable: result.buildable,
            start: result.start,
            end: result.end,
            buildableCount: result.buildableCount,
            splits: result.splits,
            splitMap: result.splitMap,
            allPathCellSet: result.allPathCellSet,
            loopCount: result.loopCount,
            splitCount: result.splitCount
        };
    }

    function validatePathData(data) {
        if (!data || !data.path || data.path.length === 0) return { valid: false, reason: 'Generated path is empty.' };
        const p = data.path;
        if (p[0][0] !== 0) return { valid: false, reason: 'Path does not start at left edge.' };
        if (p[p.length - 1][0] !== SIZE - 1) return { valid: false, reason: 'Path does not reach right edge.' };
        for (let i = 1; i < p.length; i++) {
            const dx = Math.abs(p[i][0] - p[i - 1][0]), dy = Math.abs(p[i][1] - p[i - 1][1]);
            if (!((dx === 1 && dy === 0) || (dx === 0 && dy === 1))) return { valid: false, reason: 'Path not contiguous at step ' + i + '.' };
        }
        for (const cell of p) if (cell[0] < 0 || cell[0] >= SIZE || cell[1] < 0 || cell[1] >= SIZE) return { valid: false, reason: 'Path cell out of bounds.' };
        if (data.buildableCount < MIN_BUILDABLE_CELLS) return { valid: false, reason: 'Not enough buildable cells (' + data.buildableCount + '). Need ' + MIN_BUILDABLE_CELLS + '.' };
        if (data.splits) {
            for (const split of data.splits) {
                if (split.atMainIndex < 0 || split.atMainIndex >= p.length) return { valid: false, reason: 'Split start index out of bounds.' };
                if (split.mergeMainIndex < 0 || split.mergeMainIndex >= p.length) return { valid: false, reason: 'Split merge index out of bounds.' };
                if (split.mergeMainIndex <= split.atMainIndex + 5) return { valid: false, reason: 'Split too short (need at least 6 main-path steps between start and merge).' };
                for (const [bx, by] of split.branchPath) {
                    if (bx < 0 || bx >= SIZE || by < 0 || by >= SIZE) return { valid: false, reason: 'Branch cell out of bounds.' };
                }
            }
        }
        return { valid: true, reason: '' };
    }

    function tryLoadSeed(hexStr, isPreGame) {
        const trimmed = hexStr.trim().toLowerCase();
        if (!isValidHexFormat(trimmed)) { showSeedError('Invalid seed — use 1–8 hex digits.'); return false; }
        const seed = hexToSeed(trimmed);
        if (seed === null) { showSeedError('Could not parse seed.'); return false; }
        const prng = mulberry32(seed);
        const data = generatePath(prng);
        const validation = validatePathData(data);
        if (!validation.valid) { showSeedError('Bad seed: ' + validation.reason); return false; }
        clearSeedError();
        if (isPreGame || !game) { pendingSeed = seed; seedInputOverlay.value = seedToHex(seed); seedInputOverlay.classList.remove('invalid'); return true; }
        if (game.wave > 0 || game.waveActive) { showSeedError('Cannot change seed mid-wave.'); return false; }
        applyMapDataToGame(data, seed);
        return true;
    }

    function applyMapDataToGame(data, seed) {
        game.seed = seed;
        game.path = data.path;
        game.buildable = data.buildable;
        game.pathStart = data.start;
        game.pathEnd = data.end;
        game.splits = data.splits || [];
        game.splitMap = data.splitMap || {};
        game.allPathCellSet = data.allPathCellSet || new Set(data.path.map(([x, y]) => x + ',' + y));
        game.loopCount = data.loopCount || 0;
        game.splitCount = data.splitCount || 0;
        game.towers = []; game.enemies = []; game.projectiles = []; game.particles = [];
        game.stunEffects = []; game.beamEffects = []; game.lightningArcs = []; game.pulseEffects = [];
        game.moneyNotes = []; game.moneyNoteTotal = null;
        game.waveEnemyQueue = []; game.waveTimer = 0; game.waveCooldown = 0;
        game.selectedEnemy = null;
        deselectTowerType(); game.selectedTower = null;
        updateSeedDisplay(); updateUI(); showInfo(null); render();
    }

    function showSeedError(msg) { seedErrorOverlay.textContent = msg; seedInputOverlay.classList.add('invalid'); }
    function clearSeedError() { seedErrorOverlay.textContent = ''; seedInputOverlay.classList.remove('invalid'); }
    function updateSeedDisplay() {
        if (!game || !game.difficulty) { seedDisplayPanel.style.display = 'none'; return; }
        seedDisplayPanel.style.display = 'flex'; seedDisplayText.textContent = seedToHex(game.seed);
    }
    function refreshOverlaySeed() { seedInputOverlay.value = seedToHex(pendingSeed); clearSeedError(); seedInputOverlay.classList.remove('invalid'); }

    function generateWave(waveNum) {
        const enemies = [];
        const count = Math.min(7 + waveNum * 3, 55);
        let types = ['normal'];
        if (waveNum >= 3) types.push('fast');
        if (waveNum >= 5) types.push('heavy');
        const hasBoss = waveNum >= 6;
        const hpWaveMultiplier = Math.pow(1.04, waveNum);
        const diffSetting = game.difficulty ? DIFFICULTY_SETTINGS[game.difficulty] : DIFFICULTY_SETTINGS['easy'];
        const difficultyHpMult = diffSetting.hpMult;
        for (let i = 0; i < count; i++) {
            let type;
            const r = Math.random();
            if (hasBoss && i === count - 1) type = 'boss';
            else if (waveNum >= 5 && r < 0.18) type = 'heavy';
            else if (waveNum >= 3 && r < 0.35) type = 'fast';
            else type = 'normal';
            const baseHp = 22 + waveNum * 11;
            const def = ENEMY_TYPES[type];
            const hp = Math.round(baseHp * def.hpMult * hpWaveMultiplier * difficultyHpMult);
            const speedMult = 1.0 + waveNum * 0.01;
            const speed = def.speed * speedMult * (0.95 + Math.random() * 0.1);
            enemies.push({ type, hp, maxHp: hp, speed, reward: def.reward + Math.floor(waveNum / 3), color: def.color, size: def.size, name: def.name, slowTimer: 0, slowFactor: 1.0 });
        }
        if (hasBoss) { const boss = enemies.pop(); for (let i = enemies.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [enemies[i], enemies[j]] = [enemies[j], enemies[i]]; } enemies.push(boss); }
        else { for (let i = enemies.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [enemies[i], enemies[j]] = [enemies[j], enemies[i]]; } }
        const spawnInterval = Math.max(0.25, 1.15 - waveNum * 0.02);
        return enemies.map((e, i) => ({ enemy: e, spawnTime: i * spawnInterval }));
    }

    function createTower(type, col, row) {
        const defs = TOWER_TYPES[type]; if (!defs) return null;
        const l0 = defs.levels[0];
        const tower = {
            id: game.towerIdCounter++, type, col, row, level: 0,
            damage: l0.damage || 0, range: l0.range || 0, fireRate: l0.fireRate || 0,
            color: l0.color, splash: l0.splash || 0, slow: l0.slow || 0,
            chain: l0.chain || 1, income: l0.income || 0, cooldown: 0,
            angle: 0, target: null, fireTimer: 0, targetMode: 'first',
            totalCost: l0.cost, stunTimer: 0,
            damageFalloff: l0.damageFalloff || 0, pierceFalloff: l0.pierceFalloff || 0,
            buffValue: l0.buffValue || 0
        };
        if (isAttackTower(type)) {
            tower.baseDamage = l0.damage || 0;
            tower.baseRange = l0.range || 0;
            tower.baseFireRate = l0.fireRate || 0;
        }
        if (isBuffTower(type)) {
            tower.buffValue = l0.buffValue || 0;
            tower.baseDamage = 0; tower.baseRange = l0.range || 3.0; tower.baseFireRate = 0;
        }
        if (type === 'mint') {
            tower.baseDamage = 0; tower.baseRange = 0; tower.baseFireRate = 0;
        }
        tower.effRange = tower.range;
        tower.effDamage = tower.damage;
        tower.effFireRate = tower.fireRate;
        return tower;
    }

    function upgradeTower(tower) {
        const defs = TOWER_TYPES[tower.type]; if (!defs) return false;
        const nl = tower.level + 1; if (nl >= defs.levels.length) return false;
        const lvl = defs.levels[nl]; const cost = lvl.cost;
        if (game.money < cost) return false;
        game.money -= cost; tower.level = nl;
        if (isBuffTower(tower.type)) {
            tower.buffValue = lvl.buffValue || tower.buffValue;
            tower.range = lvl.range || tower.range;
            tower.color = lvl.color;
            tower.baseRange = tower.range;
        } else if (tower.type === 'mint') {
            tower.income = lvl.income || tower.income;
            tower.color = lvl.color;
        } else {
            tower.damage = lvl.damage || tower.damage;
            tower.range = lvl.range || tower.range;
            tower.fireRate = lvl.fireRate || tower.fireRate;
            tower.color = lvl.color;
            tower.splash = lvl.splash || 0;
            tower.slow = lvl.slow || 0;
            tower.chain = lvl.chain || 1;
            tower.damageFalloff = lvl.damageFalloff !== undefined ? lvl.damageFalloff : tower.damageFalloff;
            tower.pierceFalloff = lvl.pierceFalloff !== undefined ? lvl.pierceFalloff : tower.pierceFalloff;
            tower.baseDamage = tower.damage;
            tower.baseRange = tower.range;
            tower.baseFireRate = tower.fireRate;
        }
        tower.totalCost += cost;
        tower.effRange = tower.range;
        tower.effDamage = tower.damage;
        tower.effFireRate = tower.fireRate;
        updateUI(); showInfo(tower); return true;
    }

    function deleteTower(tower) {
        const refund = Math.floor(tower.totalCost * 0.5); game.money += refund;
        const idx = game.towers.indexOf(tower); if (idx !== -1) game.towers.splice(idx, 1);
        if (game.selectedTower === tower) { game.selectedTower = null; showInfo(null); }
        updateUI(); render();
    }

    function spawnEnemy(we) {
        const e = we.enemy; const start = game.pathStart;
        const enemy = {
            id: game.enemyIdCounter++, type: e.type, hp: e.hp, maxHp: e.maxHp,
            speed: e.speed, reward: e.reward, color: e.color, size: e.size, name: e.name,
            slowTimer: 0, slowFactor: 1.0, pathIndex: 0,
            x: start[0] * CELL + CELL / 2, y: start[1] * CELL + CELL / 2, alive: true, reachedEnd: false,
            onBranch: false, branchSplit: null, branchIndex: 0
        };
        if (enemy.type === 'boss') { enemy.stunCooldown = 10; enemy.stunCooldownMax = 10; enemy.spawnCooldown = 15; enemy.spawnCooldownMax = 15; }
        game.enemies.push(enemy);
    }

    function spawnMinionAt(bossEnemy) {
        const spawnTypes = ['normal', 'fast', 'heavy'];
        const randomType = spawnTypes[Math.floor(Math.random() * spawnTypes.length)];
        const def = ENEMY_TYPES[randomType]; const waveNum = game.wave;
        const hpWaveMultiplier = Math.pow(1.04, waveNum);
        const diffSetting = game.difficulty ? DIFFICULTY_SETTINGS[game.difficulty] : DIFFICULTY_SETTINGS['easy'];
        const baseHp = 22 + waveNum * 11;
        const hp = Math.round(baseHp * def.hpMult * hpWaveMultiplier * diffSetting.hpMult);
        const speedMult = 1.0 + waveNum * 0.01;
        game.enemies.push({
            id: game.enemyIdCounter++, type: randomType, hp, maxHp: hp,
            speed: def.speed * speedMult * (0.95 + Math.random() * 0.1),
            reward: def.reward + Math.floor(waveNum / 3), color: def.color, size: def.size,
            name: def.name, slowTimer: 0, slowFactor: 1.0,
            pathIndex: bossEnemy.pathIndex, x: bossEnemy.x, y: bossEnemy.y, alive: true, reachedEnd: false,
            onBranch: bossEnemy.onBranch, branchSplit: bossEnemy.branchSplit, branchIndex: bossEnemy.branchIndex
        });
    }

    function startWave() {
        if (game.gameOver || !game.difficulty || game.waveActive || game.waveCooldown > 0) return;
        game.wave++; game.waveEnemyQueue = generateWave(game.wave);
        game.waveTimer = 0; game.waveActive = true;
        waveBtn.textContent = '⚔'; waveBtn.style.opacity = '0.6'; waveBtn.disabled = true;
        newMapBtn.style.display = 'none'; updateUI();
    }

    function checkWaveComplete() {
        if (!game.waveActive || game.waveEnemyQueue.length > 0 || game.enemies.length > 0) return;
        game.waveActive = false; waveBtn.textContent = '▶'; waveBtn.style.opacity = '1'; waveBtn.disabled = false;
        game.waveCooldown = 0.5; addMoney(15 + game.wave * 2);
        let totalMintIncome = 0;
        for (const tower of game.towers) {
            if (tower.type === 'mint' && tower.income > 0) {
                addMoney(tower.income);
                totalMintIncome += tower.income;
            }
        }
        if (totalMintIncome > 0) {
            const noteValue = 50;
            const noteCount = Math.min(Math.ceil(totalMintIncome / noteValue), 80);
            const cx = CANVAS / 2;
            const cy = CANVAS / 2;
            for (let i = 0; i < noteCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 100 + Math.random() * 280;
                const size = 7 + Math.random() * 8;
                game.moneyNotes.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 120,
                    life: 1.6 + Math.random() * 1.0,
                    maxLife: 1.6 + Math.random() * 1.0,
                    size: size,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 8
                });
            }
            game.moneyNoteTotal = {
                text: '+$' + totalMintIncome + ' from Mints',
                life: 1.8,
                maxLife: 1.8,
                x: cx,
                y: cy - 10
            };
            spawnParticles(cx, cy, '#f1c40f', 25);
        }
        updateUI();
    }

    function checkEnemyDeaths() {
        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            if (e.alive && e.hp <= 0) {
                e.alive = false; e.reachedEnd = false;
                if (game.selectedEnemy === e) { game.selectedEnemy = null; showInfo(null); }
                spawnParticles(e.x, e.y, e.color, 8);
            }
        }
    }

    function computeTowerBuffs() {
        const buffs = new Array(game.towers.length);
        for (let i = 0; i < game.towers.length; i++) {
            buffs[i] = { rangeBuff: 0, speedBuff: 0, damageBuff: 0 };
            const tower = game.towers[i];
            if (!isAttackTower(tower.type)) continue;
            const cx = tower.col * CELL + CELL / 2;
            const cy = tower.row * CELL + CELL / 2;
            for (let j = 0; j < game.towers.length; j++) {
                const bt = game.towers[j];
                if (!isBuffTower(bt.type)) continue;
                const bx = bt.col * CELL + CELL / 2;
                const by = bt.row * CELL + CELL / 2;
                const dist = Math.hypot(cx - bx, cy - by);
                if (dist <= bt.range * CELL + 0.5) {
                    if (bt.type === 'rangeBuff') buffs[i].rangeBuff += bt.buffValue;
                    else if (bt.type === 'speedBuff') buffs[i].speedBuff += bt.buffValue;
                    else if (bt.type === 'attackBuff') buffs[i].damageBuff += bt.buffValue;
                }
            }
        }
        return buffs;
    }

    function applyEffectiveStats(towerBuffs) {
        for (let i = 0; i < game.towers.length; i++) {
            const tower = game.towers[i];
            const b = towerBuffs[i];
            if (isAttackTower(tower.type)) {
                tower.effRange = tower.baseRange * (1 + b.rangeBuff);
                tower.effDamage = tower.baseDamage * (1 + b.damageBuff);
                tower.effFireRate = tower.baseFireRate * (1 + b.speedBuff);
            } else {
                tower.effRange = tower.range || 0;
                tower.effDamage = tower.damage || 0;
                tower.effFireRate = tower.fireRate || 0;
            }
        }
    }

    function countAffectedTowers(buffTower) {
        let count = 0;
        const bx = buffTower.col * CELL + CELL / 2;
        const by = buffTower.row * CELL + CELL / 2;
        for (const tower of game.towers) {
            if (tower === buffTower) continue;
            if (!isAttackTower(tower.type)) continue;
            const cx = tower.col * CELL + CELL / 2;
            const cy = tower.row * CELL + CELL / 2;
            if (Math.hypot(cx - bx, cy - by) <= buffTower.range * CELL + 0.5) count++;
        }
        return count;
    }

    function updateStats(dt) {
        if (game.gameOver || game.paused || !game.difficulty) return;
        const dtScaled = dt * game.speed;
        game.animTime += dtScaled;

        if (game.waveActive && game.waveEnemyQueue.length > 0) {
            game.waveTimer += dtScaled;
            while (game.waveEnemyQueue.length > 0 && game.waveTimer >= game.waveEnemyQueue[0].spawnTime) spawnEnemy(game.waveEnemyQueue.shift());
        }

        const mainPath = game.path;

        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i]; if (!e.alive) continue;
            if (e.slowTimer > 0) { e.slowTimer -= dtScaled; if (e.slowTimer < 0) { e.slowTimer = 0; e.slowFactor = 1.0; } }
            const speed = e.speed * e.slowFactor * CELL * 1.2;

            let currentPath, targetIdx;
            if (e.onBranch) {
                currentPath = e.branchSplit.branchPath;
                targetIdx = e.branchIndex;
            } else {
                currentPath = mainPath;
                targetIdx = e.pathIndex + 1;
            }

            if (targetIdx >= currentPath.length) {
                if (e.onBranch) {
                    e.onBranch = false;
                    e.pathIndex = e.branchSplit.mergeMainIndex;
                    e.branchSplit = null;
                    currentPath = mainPath;
                    targetIdx = e.pathIndex + 1;
                    if (targetIdx >= mainPath.length) {
                        e.alive = false; e.reachedEnd = true;
                        if (game.selectedEnemy === e) { game.selectedEnemy = null; showInfo(null); }
                        game.lives--;
                        if (game.lives <= 0) { game.lives = 0; gameOver(); }
                        updateUI(); continue;
                    }
                } else {
                    e.alive = false; e.reachedEnd = true;
                    if (game.selectedEnemy === e) { game.selectedEnemy = null; showInfo(null); }
                    game.lives--;
                    if (game.lives <= 0) { game.lives = 0; gameOver(); }
                    updateUI(); continue;
                }
            }

            const target = currentPath[targetIdx];
            const tx = target[0] * CELL + CELL / 2, ty = target[1] * CELL + CELL / 2;
            const dx = tx - e.x, dy = ty - e.y, dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 1) {
                e.x = tx; e.y = ty;
                if (e.onBranch) {
                    e.branchIndex = targetIdx + 1;
                } else {
                    e.pathIndex = targetIdx;
                    if (game.splitMap && game.splitMap[e.pathIndex] !== undefined) {
                        const split = game.splitMap[e.pathIndex];
                        if (Math.random() < 0.5) {
                            e.onBranch = true;
                            e.branchSplit = split;
                            e.branchIndex = 0;
                        }
                    }
                }
            } else {
                const move = Math.min(speed * dtScaled, dist);
                e.x += (dx / dist) * move;
                e.y += (dy / dist) * move;
            }
        }

        for (let i = game.enemies.length - 1; i >= 0; i--) {
            if (!game.enemies[i].alive) {
                if (!game.enemies[i].reachedEnd) { addMoney(game.enemies[i].reward); game.kills++; spawnParticles(game.enemies[i].x, game.enemies[i].y, '#f1c40f', 5); }
                if (game.selectedEnemy === game.enemies[i]) { game.selectedEnemy = null; showInfo(null); }
                game.enemies.splice(i, 1);
            }
        }
        updateUI(); checkWaveComplete();
        if (game.waveCooldown > 0) { game.waveCooldown -= dtScaled; if (game.waveCooldown < 0) game.waveCooldown = 0; }

        for (let i = 0; i < game.enemies.length; i++) {
            const enemy = game.enemies[i]; if (!enemy.alive || enemy.type !== 'boss') continue;
            if (enemy.stunCooldown !== undefined) {
                enemy.stunCooldown -= dtScaled;
                if (enemy.stunCooldown <= 0) {
                    let ct = null, cd = Infinity;
                    for (const t of game.towers) {
                        if (!isAttackTower(t.type)) continue;
                        const tcx = t.col * CELL + CELL / 2, tcy = t.row * CELL + CELL / 2;
                        const d = Math.hypot(tcx - enemy.x, tcy - enemy.y);
                        if (d < cd) { cd = d; ct = t; }
                    }
                    if (ct) {
                        ct.stunTimer = 2.5;
                        const tcx = ct.col * CELL + CELL / 2, tcy = ct.row * CELL + CELL / 2;
                        game.stunEffects.push({ x1: enemy.x, y1: enemy.y, x2: tcx, y2: tcy, life: 0.4, maxLife: 0.4 });
                        spawnParticles(enemy.x, enemy.y, '#9b59b6', 12); spawnParticles(tcx, tcy, '#c39bdb', 15);
                    }
                    enemy.stunCooldown = enemy.stunCooldownMax;
                }
            }
            if (enemy.spawnCooldown !== undefined) {
                enemy.spawnCooldown -= dtScaled;
                if (enemy.spawnCooldown <= 0) { spawnMinionAt(enemy); spawnParticles(enemy.x, enemy.y, '#e74c3c', 20); enemy.spawnCooldown = enemy.spawnCooldownMax; }
            }
        }

        const towerBuffs = computeTowerBuffs();
        applyEffectiveStats(towerBuffs);

        for (let ti = 0; ti < game.towers.length; ti++) {
            const tower = game.towers[ti];
            if (tower.stunTimer > 0) tower.stunTimer -= dtScaled;
            if (tower.type === 'mint' || isBuffTower(tower.type)) continue;
            if (tower.stunTimer > 0) continue;
            tower.cooldown -= dtScaled;
            const cx = tower.col * CELL + CELL / 2, cy = tower.row * CELL + CELL / 2;

            if (tower.type === 'ice') {
                if (tower.cooldown <= 0) {
                    const range = tower.effRange * CELL; let hitAny = false;
                    for (const enemy of game.enemies) {
                        if (!enemy.alive) continue;
                        if (Math.hypot(enemy.x - cx, enemy.y - cy) <= range) {
                            enemy.hp -= tower.effDamage; enemy.slowFactor = 1.0 - tower.slow; enemy.slowTimer = 1.5;
                            hitAny = true; spawnParticles(enemy.x, enemy.y, '#85c1e9', 2);
                        }
                    }
                    if (hitAny) game.pulseEffects.push({ x: cx, y: cy, maxRadius: range, life: 0.65, maxLife: 0.65, color: tower.color });
                    tower.cooldown = 1.0 / tower.effFireRate;
                }
                continue;
            }

            const range = tower.effRange * CELL;
            const inRange = [];
            for (const enemy of game.enemies) {
                if (!enemy.alive) continue;
                const d = Math.hypot(enemy.x - cx, enemy.y - cy);
                if (d <= range) inRange.push({ enemy, dist: d });
            }

            let bestEnemy = null;
            if (inRange.length > 0) {
                switch (tower.targetMode) {
                    case 'nearest': inRange.sort((a, b) => a.dist - b.dist); bestEnemy = inRange[0].enemy; break;
                    case 'first': { let b = null, bp = -1; for (const it of inRange) { if (it.enemy.pathIndex > bp) { bp = it.enemy.pathIndex; b = it.enemy; } } bestEnemy = b; break; }
                    case 'last': { let b = null, bp = Infinity; for (const it of inRange) { if (it.enemy.pathIndex < bp) { bp = it.enemy.pathIndex; b = it.enemy; } } bestEnemy = b; break; }
                    case 'random': bestEnemy = inRange[Math.floor(Math.random() * inRange.length)].enemy; break;
                }
            }
            tower.target = bestEnemy;
            if (bestEnemy) { const dx = bestEnemy.x - cx, dy = bestEnemy.y - cy; tower.angle = Math.atan2(dy, dx); }
            if (!bestEnemy || tower.cooldown > 0) continue;

            if (tower.type === 'arrow' || tower.type === 'cannon') {
                game.projectiles.push({
                    x: cx, y: cy, target: bestEnemy, targetId: bestEnemy.id,
                    speed: 350 + Math.random() * 50, damage: tower.effDamage,
                    splash: tower.splash || 0, slow: 0, chain: 1,
                    towerType: tower.type, color: tower.color, alive: true,
                    radius: tower.type === 'cannon' ? 6 : 3
                });
                tower.cooldown = 1.0 / tower.effFireRate;
                spawnParticles(cx, cy, '#ffffff', 2);
                continue;
            }

            if (tower.type === 'sniper') {
                const dx = bestEnemy.x - cx, dy = bestEnemy.y - cy;
                const dist = Math.hypot(dx, dy);
                const dirX = dx / dist, dirY = dy / dist;

                let tMax = CANVAS * 1.5;
                if (dirX > 0.0001) tMax = Math.min(tMax, (CANVAS - cx) / dirX);
                else if (dirX < -0.0001) tMax = Math.min(tMax, -cx / dirX);
                if (dirY > 0.0001) tMax = Math.min(tMax, (CANVAS - cy) / dirY);
                else if (dirY < -0.0001) tMax = Math.min(tMax, -cy / dirY);
                const beamLength = tMax;
                const beamEndX = cx + dirX * beamLength, beamEndY = cy + dirY * beamLength;

                const hitEnemies = [];
                for (const enemy of game.enemies) {
                    if (!enemy.alive) continue;
                    const ex = enemy.x - cx, ey = enemy.y - cy;
                    const projDist = ex * dirX + ey * dirY;
                    if (projDist < 0 || projDist > beamLength) continue;
                    const perpDist = Math.abs(-dirY * ex + dirX * ey);
                    if (perpDist <= enemy.size + 5) {
                        hitEnemies.push({ enemy, dist: projDist });
                    }
                }
                hitEnemies.sort((a, b) => a.dist - b.dist);
                for (let j = 0; j < hitEnemies.length; j++) {
                    const dmg = tower.effDamage * Math.pow(tower.pierceFalloff, j);
                    hitEnemies[j].enemy.hp -= dmg;
                    spawnParticles(hitEnemies[j].enemy.x, hitEnemies[j].enemy.y, tower.color, 3);
                }

                game.beamEffects.push({ x1: cx, y1: cy, x2: beamEndX, y2: beamEndY, life: 0.18, maxLife: 0.18, color: tower.color });
                tower.cooldown = 1.0 / tower.effFireRate;
                continue;
            }

            if (tower.type === 'tesla') {
                let chainTargets = [bestEnemy], currentTarget = bestEnemy;
                for (let c = 0; c < tower.chain; c++) {
                    let nearest = null, nearestDist = Infinity;
                    for (const enemy of game.enemies) {
                        if (!enemy.alive || chainTargets.includes(enemy)) continue;
                        const d = Math.hypot(enemy.x - currentTarget.x, enemy.y - currentTarget.y);
                        if (d <= CELL * 2 && d < nearestDist) { nearestDist = d; nearest = enemy; }
                    }
                    if (!nearest) break;
                    chainTargets.push(nearest); currentTarget = nearest;
                }
                for (let j = 0; j < chainTargets.length; j++) {
                    const dmg = tower.effDamage * Math.pow(tower.damageFalloff, j);
                    chainTargets[j].hp -= dmg;
                    spawnParticles(chainTargets[j].x, chainTargets[j].y, '#a569bd', 6);
                }
                for (let j = 0; j < chainTargets.length; j++) {
                    const from = j === 0 ? { x: cx, y: cy } : chainTargets[j - 1];
                    game.lightningArcs.push({ x1: from.x, y1: from.y, x2: chainTargets[j].x, y2: chainTargets[j].y, life: 0.25, maxLife: 0.25 });
                }
                tower.cooldown = 1.0 / tower.effFireRate;
                continue;
            }
        }

        checkEnemyDeaths();

        for (let i = game.projectiles.length - 1; i >= 0; i--) {
            const p = game.projectiles[i];
            if (!p.alive) { game.projectiles.splice(i, 1); continue; }
            let target = (p.target && p.target.alive) ? p.target : game.enemies.find(e => e.id === p.targetId && e.alive);
            if (!target) { p.alive = false; game.projectiles.splice(i, 1); continue; }
            const dx = target.x - p.x, dy = target.y - p.y, dist = Math.hypot(dx, dy);
            if (dist < 8) { p.alive = false; applyDamage(p, target); game.projectiles.splice(i, 1); }
            else { const move = Math.min(p.speed * dtScaled, dist); p.x += (dx / dist) * move; p.y += (dy / dist) * move; }
        }

        for (let i = game.particles.length - 1; i >= 0; i--) {
            const p = game.particles[i]; p.life -= dtScaled;
            p.x += p.vx * dtScaled; p.y += p.vy * dtScaled; p.vy += 80 * dtScaled;
            p.size *= (1 - dtScaled * 2);
            if (p.life <= 0 || p.size < 0.5) game.particles.splice(i, 1);
        }
        for (let i = game.stunEffects.length - 1; i >= 0; i--) { game.stunEffects[i].life -= dtScaled; if (game.stunEffects[i].life <= 0) game.stunEffects.splice(i, 1); }
        for (let i = game.beamEffects.length - 1; i >= 0; i--) { game.beamEffects[i].life -= dtScaled; if (game.beamEffects[i].life <= 0) game.beamEffects.splice(i, 1); }
        for (let i = game.lightningArcs.length - 1; i >= 0; i--) { game.lightningArcs[i].life -= dtScaled; if (game.lightningArcs[i].life <= 0) game.lightningArcs.splice(i, 1); }
        for (let i = game.pulseEffects.length - 1; i >= 0; i--) { game.pulseEffects[i].life -= dtScaled; if (game.pulseEffects[i].life <= 0) game.pulseEffects.splice(i, 1); }

        for (let i = game.moneyNotes.length - 1; i >= 0; i--) {
            const n = game.moneyNotes[i];
            n.life -= dtScaled;
            n.x += n.vx * dtScaled;
            n.y += n.vy * dtScaled;
            n.vy += 160 * dtScaled;
            n.rotation += n.rotationSpeed * dtScaled;
            if (n.life <= 0) game.moneyNotes.splice(i, 1);
        }
        if (game.moneyNoteTotal) {
            game.moneyNoteTotal.life -= dtScaled;
            game.moneyNoteTotal.y -= 25 * dtScaled;
            if (game.moneyNoteTotal.life <= 0) game.moneyNoteTotal = null;
        }
    }

    function applyDamage(proj, target) {
        target.hp -= proj.damage;
        if (proj.slow > 0) { target.slowFactor = 1.0 - proj.slow; target.slowTimer = 1.5; }
        if (proj.splash > 0) {
            const sr = proj.splash * CELL;
            for (const enemy of game.enemies) {
                if (enemy === target || !enemy.alive) continue;
                const d = Math.hypot(enemy.x - target.x, enemy.y - target.y);
                if (d <= sr) enemy.hp -= proj.damage * (1 - d / sr * 0.5) * 0.6;
            }
            spawnParticles(target.x, target.y, '#e67e22', 12);
        }
        if (proj.chain > 1) {
            let chainTargets = [target], ct = target;
            for (let c = 1; c < proj.chain; c++) {
                let nearest = null, nd = Infinity;
                for (const enemy of game.enemies) {
                    if (!enemy.alive || chainTargets.includes(enemy)) continue;
                    const d = Math.hypot(enemy.x - ct.x, enemy.y - ct.y);
                    if (d <= CELL * 3 && d < nd) { nd = d; nearest = enemy; }
                }
                if (!nearest) break;
                nearest.hp -= proj.damage * (1 - c * 0.15); chainTargets.push(nearest); ct = nearest;
                spawnParticles(nearest.x, nearest.y, '#a569bd', 6);
            }
            spawnParticles(target.x, target.y, '#a569bd', 10);
        }
        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            if (e.alive && e.hp <= 0) { e.alive = false; e.reachedEnd = false; if (game.selectedEnemy === e) { game.selectedEnemy = null; showInfo(null); } spawnParticles(e.x, e.y, e.color, 8); }
        }
        spawnParticles(target.x, target.y, '#f39c12', 4);
    }

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2, speed = 30 + Math.random() * 80;
            game.particles.push({ x: x + (Math.random() - 0.5) * 4, y: y + (Math.random() - 0.5) * 4, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 20, size: 2 + Math.random() * 3, life: 0.4 + Math.random() * 0.6, color });
        }
    }

    function restartGame() {
        gameOverOverlay.classList.remove('show'); game = createGame();
        pendingSeed = generateRandomSeed(); game.seed = pendingSeed;
        const prng = mulberry32(game.seed); const mapData = generatePath(prng);
        game.path = mapData.path; game.buildable = mapData.buildable;

        game.allPathCellSet = mapData.allPathCellSet || new Set(game.path.map(([x, y]) => x + ',' + y));
        game.loopCount = mapData.loopCount || 0; game.splitCount = mapData.splitCount || 0;

    function applyDifficulty(diff) {
        if (!game) return; game.difficulty = diff;
        const s = DIFFICULTY_SETTINGS[diff];
        difficultyLabel.textContent = s.label; difficultyBadge.className = s.badgeClass;
        difficultyBadge.style.display = 'block'; difficultyOverlay.classList.remove('show');
        updateSeedDisplay(); updateUI(); render();

    function regenerateMap(newSeed) {
        if (!game || !game.difficulty) return;
        const diff = game.difficulty; const seed = newSeed !== undefined ? newSeed : generateRandomSeed();
        game.seed = seed; const prng = mulberry32(seed); const mapData = generatePath(prng);
        const validation = validatePathData(mapData);
        if (!validation.valid) {
            const fb = generatePath(null);
            game.path = fb.path; game.buildable = fb.buildable;
            game.pathStart = fb.start; game.pathEnd = fb.end;
            game.splits = fb.splits || []; game.splitMap = fb.splitMap || {};
            game.allPathCellSet = fb.allPathCellSet || new Set(game.path.map(([x, y]) => x + ',' + y));
            game.loopCount = fb.loopCount || 0; game.splitCount = fb.splitCount || 0;
            game.seed = generateRandomSeed();
        } else {
            game.path = mapData.path; game.buildable = mapData.buildable;
            game.pathStart = mapData.start; game.pathEnd = mapData.end;
            game.splits = mapData.splits || []; game.splitMap = mapData.splitMap || {};
            game.allPathCellSet = mapData.allPathCellSet || new Set(game.path.map(([x, y]) => x + ',' + y));
            game.loopCount = mapData.loopCount || 0; game.splitCount = mapData.splitCount || 0;
        }
        game.towers = []; game.enemies = []; game.projectiles = []; game.particles = [];
        game.stunEffects = []; game.beamEffects = []; game.lightningArcs = []; game.pulseEffects = [];
        game.moneyNotes = []; game.moneyNoteTotal = null;
        game.waveEnemyQueue = []; game.waveTimer = 0; game.waveCooldown = 0; game.difficulty = diff;
        game.selectedEnemy = null;
        deselectTowerType(); game.selectedTower = null;
        updateSeedDisplay(); updateUI(); showInfo(null); render();
    }
