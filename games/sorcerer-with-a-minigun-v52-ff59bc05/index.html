    <script>function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function generateMap() {
    mapTiles = [];
    for (let y = 0; y < MAP_ROWS; y++) { mapTiles[y] = []; for (let x = 0; x < MAP_COLS; x++) mapTiles[y][x] = 0; }
    for (let x = 0; x < MAP_COLS; x++) { mapTiles[0][x] = 2; mapTiles[MAP_ROWS - 1][x] = 2; }
    for (let y = 0; y < MAP_ROWS; y++) { mapTiles[y][0] = 2; mapTiles[y][MAP_COLS - 1] = 2; }
    const rng = mulberry32(wave * 137 + 42);
    const numClusters = 10 + Math.floor(rng() * 8);
    for (let c = 0; c < numClusters; c++) {
        const cx = 3 + Math.floor(rng() * (MAP_COLS - 6)), cy = 3 + Math.floor(rng() * (MAP_ROWS - 6)), size = 2 + Math.floor(rng() * 4);
        for (let dy = -size; dy <= size; dy++) for (let dx = -size; dx <= size; dx++) {
            if (Math.abs(dx) + Math.abs(dy) <= size + rng() * 1.5) {
                const tx = cx + dx, ty = cy + dy;
                if (tx > 0 && tx < MAP_COLS - 1 && ty > 0 && ty < MAP_ROWS - 1 && rng() < 0.65) mapTiles[ty][tx] = 2;
            }
        }
    }
    const pcx = Math.floor(MAP_COLS / 2), pcy = Math.floor(MAP_ROWS / 2);
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const tx = pcx + dx, ty = pcy + dy; if (tx >= 0 && tx < MAP_COLS && ty >= 0 && ty < MAP_ROWS) mapTiles[ty][tx] = 0; }
    ensureMapConnectivity();
}

function ensureMapConnectivity() {
    const startTX = Math.floor(MAP_COLS / 2), startTY = Math.floor(MAP_ROWS / 2);
    const visited = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(false));
    const queue = [{ x: startTX, y: startTY }]; visited[startTY][startTX] = true;
    while (queue.length > 0) {
        const { x, y } = queue.shift();
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS && !visited[ny][nx] && mapTiles[ny][nx] === 0) { visited[ny][nx] = true; queue.push({ x: nx, y: ny }); }
        }
    }
    const unreachable = [];
    for (let y = 0; y < MAP_ROWS; y++) for (let x = 0; x < MAP_COLS; x++) if (mapTiles[y][x] === 0 && !visited[y][x]) unreachable.push({ x, y });
    if (unreachable.length === 0) return;

    let nextRegion = 0;
    for (const tile of unreachable) {
        if (regionId[tile.y][tile.x] !== -1) continue;
        const region = nextRegion++, rQueue = [tile]; regionId[tile.y][tile.x] = region;
        while (rQueue.length > 0) {
            const { x, y } = rQueue.shift();
            for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                const nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS && mapTiles[ny][nx] === 0 && regionId[ny][nx] === -1) { regionId[ny][nx] = region; rQueue.push({ x: nx, y: ny }); }
            }
        }
    }
    for (let r = 0; r < nextRegion; r++) {
        let bestDist = Infinity, bestWallX = -1, bestWallY = -1;
        for (let y = 1; y < MAP_ROWS - 1; y++) for (let x = 1; x < MAP_COLS - 1; x++) {
            if (mapTiles[y][x] === 0) continue;
            let bordersReachable = false, bordersRegion = false;
            for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                const nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS) {
                    if (mapTiles[ny][nx] === 0 && visited[ny][nx]) bordersReachable = true;
                    if (regionId[ny][nx] === r) bordersRegion = true;

            }
            if (bordersReachable && bordersRegion) { const dist = Math.abs(x - startTX) + Math.abs(y - startTY); if (dist < bestDist) { bestDist = dist; bestWallX = x; bestWallY = y; } }
        }
        if (bestWallX >= 0) {
            mapTiles[bestWallY][bestWallX] = 0; visited[bestWallY][bestWallX] = true;
            const fq = [{ x: bestWallX, y: bestWallY }];
            while (fq.length > 0) {
                const { x, y } = fq.shift();
                for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < MAP_COLS && ny >= 0 && ny < MAP_ROWS && !visited[ny][nx] && mapTiles[ny][nx] === 0) { visited[ny][nx] = true; fq.push({ x: nx, y: ny }); }
                }
            }
        }
    }
}

function isWall(wx, wy) { const tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE); if (tx < 0 || tx >= MAP_COLS || ty < 0 || ty >= MAP_ROWS) return true; return mapTiles[ty][tx] >= 1; }

function damageWallTile(tx, ty, angle) {

function damageWallsInMeleeArc(px, py, angle, range, halfArc) {

function hasLineOfSight(x1, y1, x2, y2) {

    for (let i = 0; i <= steps; i++) { const t = i / steps; if (isWall(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false; }
    return true;
}

function getSteeringDirection(entX, entY, targetX, targetY, entSize, isStuck) {
    const dx = targetX - entX, dy = targetY - entY, dist = Math.hypot(dx, dy);
    if (dist < 0.5) return { dx: 0, dy: 0 };
    const baseAngle = Math.atan2(dy, dx);

function getEdgeSpawnPosition() {

function drawPurpleBlock() {
    const bsx = toScreenX(purpleBlock.x), bsy = toScreenY(purpleBlock.y);
    const s = purpleBlock.size;
    if (bsx < -s * 2 || bsx > W + s * 2 || bsy < -s * 2 || bsy > GAME_VIEW_H + s * 2) return;
    // Update glow phase continuously
    purpleBlock.glowPhase += 0.03;
    const glowPulse = 1 + Math.sin(purpleBlock.glowPhase) * 0.18;
    const hitFlashAlpha = purpleBlock.hitFlash > 0 ? purpleBlock.hitFlash / 0.12 : 0;
    
    // Outer glow aura — always visible, pulses
    const outerGlowR = s * 1.6 * glowPulse;
    const outerGrad = ctx.createRadialGradient(bsx, bsy, s * 0.35, bsx, bsy, outerGlowR);
    outerGrad.addColorStop(0, 'rgba(180,100,255,0.55)');
    outerGrad.addColorStop(0.5, 'rgba(140,60,220,0.25)');
    outerGrad.addColorStop(1, 'rgba(100,20,180,0)');
    ctx.fillStyle = outerGrad;
    ctx.beginPath(); ctx.arc(bsx, bsy, outerGlowR, 0, Math.PI * 2); ctx.fill();
    
    // Mid glow ring
    const midGlowR = s * 1.15 * glowPulse;
    const midGrad = ctx.createRadialGradient(bsx, bsy, s * 0.25, bsx, bsy, midGlowR);
    midGrad.addColorStop(0, 'rgba(200,130,255,0.6)');
    midGrad.addColorStop(0.7, 'rgba(150,80,240,0.2)');
    midGrad.addColorStop(1, 'rgba(120,40,200,0)');
    ctx.fillStyle = midGrad;
    ctx.beginPath(); ctx.arc(bsx, bsy, midGlowR, 0, Math.PI * 2); ctx.fill();
    
    // Shadow under crystal
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(bsx, bsy + s * 0.55, s * 0.85, s * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    
    // Main crystal body — faceted square with rotation illusion
    ctx.save();
    ctx.translate(bsx, bsy);
    const crystalRot = purpleBlock.glowPhase * 0.4;
    ctx.rotate(crystalRot);
    
    // Outer crystal shell
    const innerSize = s * 0.85;
    ctx.fillStyle = hitFlashAlpha > 0.5 ? '#ffffff' : '#3a2060';
    ctx.strokeStyle = hitFlashAlpha > 0 ? 'rgba(255,255,255,' + hitFlashAlpha + ')' : '#9966dd';
    ctx.lineWidth = 2.5 * glowPulse;
    ctx.beginPath();
    ctx.moveTo(0, -innerSize);
    ctx.lineTo(innerSize * 0.7, -innerSize * 0.3);
    ctx.lineTo(innerSize, innerSize * 0.3);
    ctx.lineTo(innerSize * 0.3, innerSize);
    ctx.lineTo(-innerSize * 0.3, innerSize);
    ctx.lineTo(-innerSize, innerSize * 0.3);
    ctx.lineTo(-innerSize * 0.7, -innerSize * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Inner faceted faces — create a gem-like look
    ctx.fillStyle = hitFlashAlpha > 0.5 ? '#ffffff' : '#5a30a0';
    ctx.beginPath();
    ctx.moveTo(0, -innerSize * 0.85);
    ctx.lineTo(innerSize * 0.55, -innerSize * 0.1);
    ctx.lineTo(0, innerSize * 0.15);
    ctx.lineTo(-innerSize * 0.55, -innerSize * 0.1);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = hitFlashAlpha > 0.5 ? '#ffffff' : '#7b4fc0';
    ctx.beginPath();
    ctx.moveTo(0, innerSize * 0.15);
    ctx.lineTo(innerSize * 0.55, -innerSize * 0.1);
    ctx.lineTo(innerSize * 0.15, innerSize * 0.6);
    ctx.lineTo(-innerSize * 0.15, innerSize * 0.6);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = hitFlashAlpha > 0.5 ? '#ffffff' : '#4a2590';
    ctx.beginPath();
    ctx.moveTo(0, innerSize * 0.15);
    ctx.lineTo(-innerSize * 0.55, -innerSize * 0.1);
    ctx.lineTo(-innerSize * 0.15, innerSize * 0.6);
    ctx.closePath();
    ctx.fill();
    
    // Bright core
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.4 * glowPulse);
    coreGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
    coreGrad.addColorStop(0.4, 'rgba(220,180,255,0.5)');
    coreGrad.addColorStop(1, 'rgba(180,100,255,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.4 * glowPulse, 0, Math.PI * 2); ctx.fill();
    
    // Tiny sparkles
    for (let i = 0; i < 4; i++) {
        const sparkAngle = purpleBlock.glowPhase * 1.7 + i * Math.PI / 2;
        const sparkDist = s * 0.6;
        const sparkX = Math.cos(sparkAngle) * sparkDist;
        const sparkY = Math.sin(sparkAngle) * sparkDist;
        const sparkAlpha = 0.4 + Math.sin(purpleBlock.glowPhase * 3 + i) * 0.4;
        ctx.fillStyle = 'rgba(255,255,255,' + sparkAlpha + ')';
        ctx.beginPath(); ctx.arc(sparkX, sparkY, 2, 0, Math.PI * 2); ctx.fill();
    }
    
    ctx.restore();
    
    // Health bar
    const barW = s * 2.2, barH = 4, barY = bsy - s * 1.5;
    ctx.fillStyle = '#150520';
    ctx.fillRect(bsx - barW / 2 - 1, barY - 1, barW + 2, barH + 2);
    const hpRatio = purpleBlock.health / purpleBlock.maxHealth;
    const barGrad = ctx.createLinearGradient(bsx - barW / 2, barY, bsx + barW / 2, barY);
    barGrad.addColorStop(0, '#7722cc');
    barGrad.addColorStop(0.5, '#bb66ff');
    barGrad.addColorStop(1, '#7722cc');
    ctx.fillStyle = barGrad;
    ctx.fillRect(bsx - barW / 2, barY, barW * hpRatio, barH);
    
    // Label
    ctx.fillStyle = '#cc99ff';
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('\u2726 CRYSTAL \u2726', bsx, barY - 5);
    ctx.textAlign = 'start';
}

    <script>// update.js - Main update loop, camera, game state management

let camera = { x: 0, y: 0 };

function updateCamera(dt) {
    if (!player) return;
    const targetX = player.x - W / 2, targetY = player.y - GAME_VIEW_H / 2, lerpFactor = 1 - Math.exp(-8 * dt);
    camera.x += (targetX - camera.x) * lerpFactor;
    camera.y += (targetY - camera.y) * lerpFactor;
    camera.x = Math.max(0, Math.min(WORLD_W - W, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - GAME_VIEW_H, camera.y));
    if (WORLD_W <= W) camera.x = (WORLD_W - W) / 2;
    if (WORLD_H <= GAME_VIEW_H) camera.y = (WORLD_H - GAME_VIEW_H) / 2;
}

function updateMouseWorld() {
    mouseWorldX = mouseX + camera.x;
    mouseWorldY = mouseY + camera.y;
}

function update(dt) {
    if (gameState === 'CHARACTER_SELECT' || gameState === 'SHOP') { updateMouseWorld(); return; }
    if (gameState === 'GAME_OVER') {
        gameOverTimer -= dt;
        if (gameOverTimer <= 0 && mouseClicked.left) restartGame();
        updateMouseWorld();
        updateParticles(dt);
        updateDamageNumbers(dt);
        updateDroppedTokens(dt);
        updateBoneShards(dt);
        updateBeamEffects(dt);
        updateShockwaves(dt);
        return;
    }
    if (gameState === 'WAVE_CLEAR') {
        waveClearTimer -= dt;
        updateParticles(dt);
        updateDamageNumbers(dt);
        updateDroppedTokens(dt);
        updateMinions(dt);
        updateBoneShards(dt);
        updateBeamEffects(dt);
        updateShockwaves(dt);
        if (waveClearTimer <= 0) gameState = 'SHOP';
        updateMouseWorld();
        return;
    }
    // Amulet pickup dialog – game is effectively paused while choosing
    if (amuletPickupState !== null) {
        updateMouseWorld();
        screenShake = 0; shakeX = 0; shakeY = 0;
        // Still update particles etc. so the world behind the dialog feels alive
        updateParticles(dt);
        updateDamageNumbers(dt);
        updateBoneShards(dt);
        updateBeamEffects(dt);
        updateShockwaves(dt);
        mouseClicked.left = false;
        mouseClicked.right = false;
        return;
    }
    if (unpauseCountdown > 0) {
        unpauseCountdown -= dt;
        if (unpauseCountdown <= 0) unpauseCountdown = 0;
        else { updateMouseWorld(); screenShake = 0; shakeX = 0; shakeY = 0; mouseClicked.left = false; mouseClicked.right = false; return; }
    }
    if (paused) {
        updateMouseWorld();
        screenShake = 0; shakeX = 0; shakeY = 0;
        mouseClicked.left = false; mouseClicked.right = false;
        return;
    }
    const dtClamped = Math.min(dt, 0.1);
    updateMouseWorld();
    updatePlayer(dtClamped);
    updateEnemies(dtClamped);
    updateMinions(dtClamped);
    updateProjectiles(dtClamped);
    updateParticles(dtClamped);
    updateDamageNumbers(dtClamped);
    updateDroppedTokens(dtClamped);
    updateDroppedAmulets(dtClamped);
    updateBoneShards(dtClamped);
    updateBeamEffects(dtClamped);
    updateShockwaves(dtClamped);

    // Purple block invulnerability timer
    if (purpleBlock && purpleBlock.invulnTimer > 0) {
        purpleBlock.invulnTimer -= dtClamped;
    }
    // Purple block hit flash decay
    if (purpleBlock && purpleBlock.hitFlash > 0) {
        purpleBlock.hitFlash -= dtClamped;
    }

    updateCamera(dtClamped);
    if (screenShake > 0) {
        screenShake = Math.max(0, screenShake - dt * 8);
        shakeX = (Math.random() - 0.5) * screenShake * 2;
        shakeY = (Math.random() - 0.5) * screenShake * 2;
    } else { shakeX = 0; shakeY = 0; }
    if (enemies.length > 0 && enemies.every(e => e.health <= 0)) {
        enemies = [];
        shockwaves = [];
        startTokenFlyToPlayer();
        gameState = 'WAVE_CLEAR';
        waveClearTimer = 0.8;
    }
    mouseClicked.left = false;
    mouseClicked.right = false;
}
</script>
    <script>let lastTime = performance.now();
function gameLoop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.2) dt = 0.2;
    if (dt <= 0) dt = 0.016;
    lastTime = timestamp;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

initUpgrades();
generateMap();
camera = { x: WORLD_W / 2 - W / 2, y: WORLD_H / 2 - GAME_VIEW_H / 2 };
updateMouseWorld();
updateCamera(0.016);
requestAnimationFrame(gameLoop);
console.log('Darkhold Arena v37 ready. Choose your champion! Press P to pause.');
