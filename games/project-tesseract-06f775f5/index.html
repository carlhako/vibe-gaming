// function to get multiplier
function getEffectiveness(attackElem, defenderElems){
  if(!defenderElems) return 1;
  let mul=1;
  for(let def of defenderElems){
    if(elementRelations[attackElem] && elementRelations[attackElem][def]!==undefined) mul*=elementRelations[attackElem][def];
    else mul*=1;
  }
  return mul;
}

// helper to get hakko object
function createHakko(speciesId,level=5){
  const sp=hakkoSpecies[speciesId];
  const hp=sp.stats.hp+level*2; // simplified stat formula
  const stats={hp:hp,maxHp:hp,atk:sp.stats.atk+level,def:sp.stats.def+level,spa:sp.stats.spa+level,spd:sp.stats.spd+level,spe:sp.stats.spe+level};
  const moves=[];
  if(sp.moves){
    for(let m of sp.moves) if(m.level<=level) moves.push({name:m.move});
  }
  if(moves.length===0) moves.push({name:'Tackle'});
  return {
    id:Date.now()+Math.random(),
    species:speciesId,
    name:sp.name,
    level,
    xp:0,
    stats,
    currentHp:hp,
    status:null,
    moves:moves.slice(0,6),
    shiny: Math.random()<0.003?true:false,
    gender: Math.random()<0.5?'m':'f',
  };
}

// Render helpers
function drawTile(x,y,tile){
  const tx=x*TILE_SIZE, ty=y*TILE_SIZE;
  if(tile===0){ctx.fillStyle='#6b8e23';ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);} // grass
  else if(tile===1){ctx.fillStyle='#c2a15e';ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);} // path
  else if(tile===2){ctx.fillStyle='#4a7ab5';ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);} // water
  else if(tile===3){ctx.fillStyle='#8b7355';ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);ctx.strokeRect(tx+1,ty+1,TILE_SIZE-2,TILE_SIZE-2);} // building
}

function drawSprite(x,y,colors,size=12,shape='human'){
  // simple pixel art drawing
  ctx.fillStyle=colors[0]; // body
  if(shape==='human'){
    ctx.fillRect(x-4,y-6,8,12);
    ctx.fillStyle=colors[1]; // head
    ctx.fillRect(x-3,y-8,6,6);
  } else if(shape==='hakko'){
    // draw hakko sprite based on species id via colors
    ctx.fillStyle=colors[0];
    ctx.beginPath();ctx.ellipse(x,y,6,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=colors[1];
    ctx.beginPath();ctx.ellipse(x-2,y-2,3,4,0,0,Math.PI*2);ctx.fill();
  }
}

// overworld entities (wild hakkos)
function updateOverworld(){
  if(!currentMapData) return;
  // spawn wilds if not already
  if(overworldEntities.length===0 && currentMapData.wildSpawns){
    for(let s of currentMapData.wildSpawns){
      const sp=hakkoSpecies[s.species];
      overworldEntities.push({
        x:s.x*TILE_SIZE+8,
        y:s.y*TILE_SIZE+8,
        targetX:null,targetY:null,
        species:s.species,
        temperament:sp.temperament||'idle',
        timer:0,
      });
    }
  }
  // move based on temperament
  for(let e of overworldEntities){
    // simple idle or wander
    if(Math.random()<0.01){
      e.targetX=e.x+rndint(-16,16);
      e.targetY=e.y+rndint(-16,16);
    }
    if(e.targetX!=null){
      const dx=e.targetX-e.x,dy=e.targetY-e.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<2){e.targetX=null;e.targetY=null;}
      else{ e.x+=dx/dist*1; e.y+=dy/dist*1; }
    }
  }
}

function renderOverworld(){
  if(!currentMapData) return;
  // draw map tiles
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      drawTile(x,y,currentMapData.bg[y][x]);
    }
  }
  // draw NPCs
  for(let n of currentMapData.npcs){
    const nx=n.x*TILE_SIZE+8, ny=n.y*TILE_SIZE+8;
    ctx.fillStyle='#aaa';ctx.fillRect(nx-4,ny-6,8,12);
    ctx.fillStyle='#ffc';ctx.fillRect(nx-3,ny-8,6,6);
  }
  // draw wild hakkos
  for(let e of overworldEntities){
    const sp=hakkoSpecies[e.species];
    const col=sp.color?sp.color:'#f0f';
    ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(e.x,e.y,5,6,0,0,Math.PI*2);ctx.fill();
  }
  drawPlayer();
}

// Battle system
function startWildBattle(speciesId,level){
  battleState={
    type:'wild',
    enemy:createHakko(speciesId,level),
    playerDeck:playerData.deck.slice(0,5), // copy
    activeIndex:0,
    enemyActive:createHakko(speciesId,level),
    turn:0,
    log:['A wild '+hakkoSpecies[speciesId].name+' appeared!'],
    cooldowns:{},
    playerWins:null,
    captureAttempt:false,
    usedItems:[],
  };
  // set active to first alive
  battleState.activeIndex=playerData.deck.findIndex(h=>h.currentHp>0);
  if(battleState.activeIndex<0) battleState.activeIndex=0; // fallback
  gameState='battle';
}

function startTrainerBattle(trainer){
  battleState={
    type:'trainer',
    enemyDeck:trainer.team.map(t=>createHakko(t.species,t.level)),
    activeEnemyIndex:0,
    playerDeck:playerData.deck.slice(0,5),
    activePlayerIndex:playerData.deck.findIndex(h=>h.currentHp>0),
    turn:0,
    log:[trainer.name+' challenges you!'],
    cooldowns:{},
    playerWins:null,
    trainer:trainer,
  };
  if(battleState.activePlayerIndex<0) battleState.activePlayerIndex=0;
  gameState='battle';
}

function applyMove(moveName,attacker,defender){
  const move=movesData[moveName];
  if(!move) return 0;
  let dmg=0;
  if(move.power){
    const atkStat=move.type==='Special'?attacker.stats.spa:attacker.stats.atk;
    const defStat=move.type==='Special'?defender.stats.spd:defender.stats.def;
    dmg=Math.floor(((2*attacker.level/5+2)*move.power*atkStat/defStat)/50+2);
    const mult=getEffectiveness(move.element, defender.species?hakkoSpecies[defender.species].elements:null);
    dmg=Math.floor(dmg*mult);
    if(Math.random()<0.0625) dmg=Math.floor(dmg*1.5); // crit
  } else if(move.damage) dmg=move.damage;
  if(move.effect){
    // apply status
    if(move.effect.includes('burn') && Math.random()<0.1) defender.status='burn';
    else if(move.effect.includes('poison') && Math.random()<0.3) defender.status='poison';
    else if(move.effect.includes('paralyze') && Math.random()<0.1) defender.status='paralysis';
    else if(move.effect.includes('freeze') && Math.random()<0.1) defender.status='freeze';
    else if(move.effect.includes('sleep') && Math.random()<0.1) defender.status='sleep';
    else if(move.effect.includes('confuse') && Math.random()<0.1) defender.status='confuse';
  }
  if(dmg) defender.currentHp-=dmg;
  return dmg;
}

function battlePlayerAction(move){
  if(!battleState) return;
  const playerHakko=battleState.playerDeck[battleState.activePlayerIndex];
  const enemyHakko=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  if(!playerHakko||playerHakko.currentHp<=0) return;
  // cooldown check
  const cdKey=playerHakko.id+'_'+move;
  if(battleState.cooldowns[cdKey]>0) return;
  // apply move
  const dmg=applyMove(move,playerHakko,enemyHakko);
  battleState.log.push(playerHakko.name+' used '+move+'!');
  if(dmg>0) battleState.log.push('Dealt '+dmg+' damage.');
  // set cooldown
  if(movesData[move]&&movesData[move].cooldown) battleState.cooldowns[cdKey]=movesData[move].cooldown;
  battleState.turn++;
  // check faint
  if(enemyHakko.currentHp<=0){
    enemyHakko.currentHp=0;
    battleState.log.push(enemyHakko.name+' fainted!');
    // remove enemy or switch
    if(battleState.type==='trainer'){
      battleState.activeEnemyIndex++;
      if(battleState.activeEnemyIndex>=battleState.enemyDeck.length) endBattle(true);
      else battleState.log.push('Enemy sends out '+battleState.enemyDeck[battleState.activeEnemyIndex].name+'!');
    } else if(battleState.type==='wild'){
      endBattle(true, enemyHakko.species, enemyHakko.level);
    }
    // clear cooldown track for fainted pokemon
  } else {
    // enemy turn
    enemyTurn();
  }
}

function enemyTurn(){
  if(!battleState) return;
  const enemyHakko=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  const playerHakko=battleState.playerDeck[battleState.activePlayerIndex];
  if(!enemyHakko||enemyHakko.currentHp<=0) return;
  const availMoves=enemyHakko.moves.map(m=>m.name).filter(m=>!battleState.cooldowns[enemyHakko.id+'_'+m]);
  if(availMoves.length===0) return;
  const move=availMoves[Math.floor(Math.random()*availMoves.length)];
  const dmg=applyMove(move,enemyHakko,playerHakko);
  battleState.log.push('Foe '+enemyHakko.name+' used '+move+'!');
  if(dmg>0) battleState.log.push('Dealt '+dmg+' damage.');
  if(movesData[move]&&movesData[move].cooldown) battleState.cooldowns[enemyHakko.id+'_'+move]=movesData[move].cooldown;
  if(playerHakko.currentHp<=0){
    playerHakko.currentHp=0;
    battleState.log.push(playerHakko.name+' fainted!');
    // switch or lose
    const nextIdx=playerData.deck.findIndex(h=>h.currentHp>0);
    if(nextIdx>=0){
      battleState.activePlayerIndex=nextIdx;
      battleState.log.push('Go! '+playerData.deck[nextIdx].name+'!');
    } else endBattle(false);
  }
  battleState.turn++;
  // reduce cooldowns
  for(let k in battleState.cooldowns) if(battleState.cooldowns[k]>0) battleState.cooldowns[k]--;
}

function attemptCapture(tesseractId){
  if(!battleState||battleState.type!=='wild') return;
  const enemy=battleState.enemy;
  const tData=itemsData[tesseractId];
  const tier=tData.tesseract||1;
  const hpRatio=1-enemy.currentHp/enemy.stats.maxHp;
  let chance=0.2+hpRatio*0.5+0.1*tier;
  if(enemy.status==='sleep') chance+=0.15;
  playerData.inventory=playerData.inventory.filter(i=>{if(i.id===tesseractId){i.count--;return i.count>0;}return true;});
  battleState.log.push('Threw a '+tData.name+'!');
  if(Math.random()<chance){
    // caught
    const newHakko=createHakko(enemy.species,enemy.level);
    newHakko.currentHp=enemy.currentHp;
    if(playerData.deck.length<5) playerData.deck.push(newHakko);
    else playerData.storage.push(newHakko);
    battleState.log.push('Caught '+enemy.name+'!');
    endBattle(true, enemy.species, enemy.level, true);
  } else {
    battleState.log.push('It broke free!');
    enemyTurn();
  }
}

function endBattle(win, caughtSpecies, caughtLevel, captured=false){
  if(win){
    if(caughtSpecies) {
      if(!playerData.codex[caughtSpecies]) playerData.codex[caughtSpecies]={seen:true,caught:true,shiny:false};
      else playerData.codex[caughtSpecies].caught=true;
    }
    // exp distribution omitted for brevity, just add some
    for(let h of playerData.deck) if(h.currentHp>0) h.xp+=50;
    playerData.money+=100;
  }
  battleState=null;
  gameState='playing';
}

// Rendering UI
function drawBattle(){
  if(!battleState) return;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='12px monospace';
  const enemy=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  const player=battleState.playerDeck[battleState.activePlayerIndex];
  ctx.fillText('Foe: '+enemy.name+' Lv'+enemy.level,250,60);
  ctx.fillText('HP: '+enemy.currentHp+'/'+enemy.stats.maxHp,250,80);
  ctx.fillText('You: '+player.name+' Lv'+player.level,50,200);
  ctx.fillText('HP: '+player.currentHp+'/'+player.stats.maxHp,50,220);
  // draw moves
  for(let i=0;i<player.moves.length;i++){
    ctx.fillText((i+1)+'. '+player.moves[i].name,20,260+i*15);
  }
  ctx.fillText('[I]tems [C]apture [R]un',20,330);
  // log
  const log=battleState.log.slice(-3);
  ctx.fillText(log.join(' '),20,310);
}

// main loop
function update(){
  if(gameState==='playing'){
    updateOverworld();
    playerData.time+=1/60;
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(gameState==='title'){
    ctx.fillStyle='#112';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffa';ctx.font='24px monospace';ctx.fillText('Project Tesseract',100,130);
    ctx.fillText('[N]ew Game  [L]oad  [I]mport',120,180);
  }
  else if(gameState==='playing'){
    renderOverworld();
    // HUD
    ctx.fillStyle='#000a';ctx.fillRect(0,0,W,20);
    ctx.fillStyle='#fff';ctx.font='12px monospace';
    ctx.fillText(currentMapData?currentMapData.name:'',10,15);
    ctx.fillText('Day:'+(playerData.time%15<10?'Day':'Night'),W-100,15);
  }
  else if(gameState==='battle'){
    drawBattle();
  }
  // dialogue
  if(dialogueLines.length>0){
    ctx.fillStyle='#000';ctx.fillRect(20,H-80,W-40,60);
    ctx.fillStyle='#fff';ctx.fillText(dialogueLines[dialogueIndex],30,H-60);
  }
}

// input handling for overworld
function handlePlayingInput(){
  const p=playerData.playerPos;
  let dx=0,dy=0;
  if(keys['ArrowUp']||keys['w']) dy=-1;
  if(keys['ArrowDown']||keys['s']) dy=1;
  if(keys['ArrowLeft']||keys['a']) dx=-1;
  if(keys['ArrowRight']||keys['d']) dx=1;
  if(dx||dy){
    const spd=PLAYER_SPEED;
    let newX=p.x+dx*spd, newY=p.y+dy*spd;
    // collision simple: check tile boundaries and building collision
    const tileX=Math.floor(newX/TILE_SIZE), tileY=Math.floor(newY/TILE_SIZE);
    if(tileX>=0&&tileX<MAP_W&&tileY>=0&&tileY<MAP_H&&!currentMapData.collision.has(tileX+','+tileY)){
      p.x=clamp(newX,0,MAP_W*TILE_SIZE-1); p.y=clamp(newY,0,MAP_H*TILE_SIZE-1);
      p.dir=dx>0?1:dx<0?3:dy>0?2:0;
    }
  }
  // interaction
  if(keys['Enter']||keys[' ']){
    keys['Enter']=false; keys[' ']=false;
    // check warp
    const tileX=Math.floor(p.x/TILE_SIZE), tileY=Math.floor(p.y/TILE_SIZE);
    for(let w of currentMapData.warps){
      if(w.x===tileX&&w.y===tileY){
        setPlayerMap(w.targetMap,w.targetX,w.targetY);
        return;
      }
    }
    // check NPC
    for(let n of currentMapData.npcs){
      const nx=n.x,ny=n.y;
      const dist=Math.sqrt((nx*TILE_SIZE+8-p.x)**2+(ny*TILE_SIZE+8-p.y)**2);
      if(dist<TILE_SIZE*1.5){
        triggerNPC(n);
        return;
      }
    }
    // check wild encounter
    for(let e of overworldEntities){
      if(Math.abs(e.x-p.x)<12&&Math.abs(e.y-p.y)<12){
        startWildBattle(e.species,rndint(2,5));
        return;
      }
    }
  }
}

function triggerNPC(npc){
  if(!npc.script) return;
  switch(npc.script){
    case 'mom_start':
      dialogueLines=['Mom: Good morning, Coal! Ready to become a Hakko handler?','Mom: Visit Prof. Elmwood at the lab.'];
      dialogueIndex=0;
      break;
    case 'elmwood_intro':
      dialogueLines=['Prof. Elmwood: Welcome! I have three Hakko for you. Choose one:'];
      // show starter selection
      gameState='starter_select';
      break;
    case 'shop':
      dialogueLines=['Clerk: Welcome to the shop! Items available for purchase.'];
      break;
    case 'vet':
      // heal
      for(let h of playerData.deck) h.currentHp=h.stats.maxHp;
      dialogueLines=['Nurse: Your Hakkos are fully healed!'];
      break;
    case 'trainer_battle':
      startTrainerBattle(npc);
      break;
    case 'arena_boss1':
      if(playerData.arenaTrophies[0]) dialogueLines=['Boss: You already won!'];
      else startTrainerBattle({name:'Boss Agrias',team:[{species:14,level:8},{species:28,level:8},{species:20,level:9}]});
      break;
    default: break;
  }
}

function handleGlobalInput(){
  if(dialogueLines.length>0){
    if(keys['Enter']||keys[' ']){ dialogueIndex++; if(dialogueIndex>=dialogueLines.length){dialogueLines=[];dialogueIndex=0;} keys['Enter']=false;keys[' ']=false; }
  }
  else if(gameState==='playing') handlePlayingInput();
}

function gameLoop(){
  update();
  render();
  handleGlobalInput();
  requestAnimationFrame(gameLoop);
}

// init everything
createMaps();
setPlayerMap('village',10,8);
gameState='title';
// title input
function titleInput(){
  if(keys['n']){ keys['n']=false; newGame(); }
  if(keys['l']){ keys['l']=false; /* show load menu */ }
  if(keys['i']){ keys['i']=false; importSave(); }
}
// integrate into global input
const origHandle=handleGlobalInput;
handleGlobalInput=function(){
  if(gameState==='title') titleInput();
  else origHandle();
};

// start
requestAnimationFrame(gameLoop);
})();
</script>
