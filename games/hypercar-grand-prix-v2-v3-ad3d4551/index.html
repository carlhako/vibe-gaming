<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypercar GP 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
        #gameContainer { position: relative; width: 1000px; height: 700px; background: #1a1a2e; border: 3px solid #e94560; border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(233,69,96,0.3); }
        canvas#gameCanvas { display: block; width: 100%; height: 100%; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #ui-overlay button { pointer-events: auto; }
        #hud { position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; color: #0ff; text-shadow: 0 0 8px rgba(0,255,255,0.5); font-size: 14px; }
        .gauge-panel { background: rgba(0,0,0,0.75); border: 1px solid #e94560; border-radius: 8px; padding: 6px 10px; min-width: 120px; backdrop-filter: blur(4px); }
        .gauge-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .gauge-item { display: flex; flex-direction: column; align-items: center; }
        .gauge-label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .gauge-value { font-size: 16px; font-weight: bold; color: #0ff; }
        .gauge-value.warn { color: #ff0; }
        .gauge-value.critical { color: #f00; animation: blink 0.5s infinite; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
        #left-gauges { display: flex; flex-direction: column; gap: 4px; max-width: 420px; }
        #right-controls { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
        .btn { background: #222; border: 1px solid #e94560; color: #0ff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
        .btn:hover { background: #e94560; color: #fff; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #speedometer { font-size: 28px; font-weight: bold; color: #0ff; text-shadow: 0 0 20px rgba(0,255,255,0.4); min-width: 70px; }
        #lap-info { position: absolute; top: 10px; right: 10px; color: #fff; font-size: 16px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; border: 1px solid #e94560; }
        #pickup-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 24px; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,0,0.8); pointer-events: none; opacity: 0; transition: opacity 0.3s; text-align: center; z-index: 5; }
        #game-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); color: #fff; pointer-events: auto; z-index: 10; }
        #game-overlay.hidden { display: none; }
        #game-overlay h1 { font-size: 48px; color: #e94560; text-shadow: 0 0 30px rgba(233,69,96,0.5); margin-bottom: 10px; }
        #game-overlay h2 { font-size: 24px; color: #0ff; margin-bottom: 20px; }
        #game-overlay .btn { font-size: 18px; padding: 12px 40px; margin-top: 20px; }
        #game-overlay .stats { font-size: 16px; color: #aaa; margin: 4px 0; }
        .hidden { display: none !important; }
        #minimap { position: absolute; top: 10px; left: 10px; border: 1px solid #e94560; border-radius: 4px; background: rgba(0,0,0,0.5); pointer-events: none; z-index: 2; }
        #vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%); z-index: 1; }
        .car-name { font-size: 11px; color: #aaa; margin-left: 10px; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
    <canvas id="minimap" width="160" height="120"></canvas>
    <div id="vignette"></div>
    <div id="ui-overlay">
        <div id="lap-info">LAP 1/5</div>
        <div id="pickup-msg"></div>
        <div id="hud">
            <div id="left-gauges">
                <div class="gauge-panel" style="display:flex;align-items:center;gap:10px;">
                    <div id="speedometer">0</div>
                    <div style="font-size:11px;color:#888;">km/h</div>
                    <span class="car-name" id="car-name-display">Bugatti Tourbillon</span>
                    <div style="margin-left:auto;display:flex;gap:10px;">
                        <div class="gauge-item">
                            <span class="gauge-label">RPM</span>
                            <span class="gauge-value" id="rpm-val">0</span>
                        </div>
                        <div class="gauge-item">
                            <span class="gauge-label">GEAR</span>
                            <span class="gauge-value" id="gear-val">N</span>
                        </div>
                    </div>
                </div>
                <div class="gauge-panel gauge-row">
                    <div class="gauge-item">
                        <span class="gauge-label">OIL PRESS</span>
                        <span class="gauge-value" id="oil-press">5.2</span>
                    </div>
                    <div class="gauge-item">
                        <span class="gauge-label">OIL TEMP</span>
                        <span class="gauge-value" id="oil-temp">90</span>
                    </div>
                    <div class="gauge-item">
                        <span class="gauge-label">RADIATOR</span>
                        <span class="gauge-value" id="rad-temp">85</span>
                    </div>
                    <div class="gauge-item">
                        <span class="gauge-label">FUEL</span>
                        <span class="gauge-value" id="fuel-val">100</span>
                    </div>
                </div>
                <div class="gauge-panel gauge-row">
                    <div class="gauge-item">
                        <span class="gauge-label">FL</span>
                        <span class="gauge-value" id="tire-fl">2.4</span>
                    </div>
                    <div class="gauge-item">
                        <span class="gauge-label">FR</span>
                        <span class="gauge-value" id="tire-fr">2.4</span>
                    </div>
                    <div class="gauge-item">
                        <span class="gauge-label">RL</span>
                        <span class="gauge-value" id="tire-rl">2.4</span>
                    </div>
                    <div class="gauge-item">
                        <span class="gauge-label">RR</span>
                        <span class="gauge-value" id="tire-rr">2.4</span>
                    </div>
                </div>
            </div>
            <div id="right-controls">
                <button class="btn" id="btn-reinflate">🔵 Reinflate Tires</button>
                <button class="btn" id="btn-water">💧 Spray Engine</button>
                <div style="margin-top:4px;font-size:10px;color:#888;text-align:right;">
                    WASD / Arrow keys | Pick up items on track
                </div>
            </div>
        </div>
    </div>
    <div id="game-overlay">
        <h1 id="result-title">HYPERCAR GP 3D</h1>
        <h2 id="result-sub">Select Your Hypercar</h2>
        <div style="display:flex;gap:20px;margin:20px 0;">
            <button class="btn" data-car="0" style="font-size:14px;padding:10px 20px;">🏎 Bugatti Tourbillon</button>
            <button class="btn" data-car="1" style="font-size:14px;padding:10px 20px;">🏎 Bugatti Chiron</button>
            <button class="btn" data-car="2" style="font-size:14px;padding:10px 20px;">🏎 Rimac Nevera</button>
        </div>
        <div class="stats" id="final-stats"></div>
        <button class="btn hidden" id="btn-restart" style="font-size:18px;padding:12px 40px;">🔄 RESTART</button>
    </div>
</div>
<script>
(function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimap = document.getElementById('minimap');
    const mctx = minimap.getContext('2d');
    const W = 1000, H = 700;
    canvas.width = W; canvas.height = H;

    // ---- CAR DEFINITIONS ----
    const CARS = [
        { name: 'Bugatti Tourbillon', topSpeed: 480, accel: 0.18, braking: 0.25, handling: 0.045, color: '#1a1a4e', stripe: '#c0a030', bodyColor: '#1a1a4e' },
        { name: 'Bugatti Chiron', topSpeed: 440, accel: 0.16, braking: 0.22, handling: 0.042, color: '#2d1b00', stripe: '#b8860b', bodyColor: '#2d1b00' },
        { name: 'Rimac Nevera', topSpeed: 412, accel: 0.20, braking: 0.24, handling: 0.050, color: '#1a1a2e', stripe: '#00ff88', bodyColor: '#1a1a2e' }
    ];

    // ---- TRACK (3D ready) ----
    const trackPoints = [];
    function buildTrack() {
        const cx = 500, cy = 350;
        const r1 = 280, r2 = 180;
        for (let i = 0; i < 40; i++) {
            const angle = (i / 40) * Math.PI * 2;
            const rx = r1 + Math.sin(angle * 3) * 60;
            const ry = r2 + Math.cos(angle * 2) * 50;
            const x = cx + Math.cos(angle) * rx;
            const y = cy + Math.sin(angle) * ry;
            trackPoints.push({ x, y });
        }
    }
    buildTrack();

    // Precompute detailed track segments for 3D rendering
    const TRACK_SEGMENTS = 300;
    const roadSegments = [];
    function buildRoadSegments() {
        roadSegments.length = 0;
        const n = trackPoints.length;
        for (let i = 0; i < TRACK_SEGMENTS; i++) {
            const t = i / TRACK_SEGMENTS;
            const idx = t * n;
            const i0 = Math.floor(idx) % n;
            const i1 = (i0 + 1) % n;
            const frac = idx - Math.floor(idx);
            const p0 = trackPoints[i0];
            const p1 = trackPoints[i1];
            const x = p0.x + (p1.x - p0.x) * frac;
            const y = p0.y + (p1.y - p0.y) * frac;

            // Compute direction and normal
            const pn0 = trackPoints[(i0 + 1) % n];
            const pn1 = trackPoints[(i0 + 2) % n];
            const dx = pn0.x - p0.x;
            const dy = pn0.y - p0.y;
            const len = Math.hypot(dx, dy) || 1;
            const nx = -dy / len;
            const ny = dx / len;

            const width = 80 + Math.sin(i * 0.3) * 15;
            roadSegments.push({
                x, y, nx, ny, width,
                leftX: x + nx * width,
                leftY: y + ny * width,
                rightX: x - nx * width,
                rightY: y - ny * width,
                index: i
            });
        }
    }
    buildRoadSegments();

    // ---- GAME STATE ----
    let gameState = 'menu';
    let selectedCar = 0;
    let car = null;
    let laps = 0;
    let maxLaps = 5;
    let bestLapTime = Infinity;
    let lapTimes = [];
    let lapStartTime = 0;
    let totalTime = 0;
    let pickups = [];
    let particles = [];
    let lastTime = 0;
    // Speed lines effect
    let speedLines = [];

    function createCar() {
        const start = roadSegments[0];
        const next = roadSegments[1];
        const angle = Math.atan2(next.y - start.y, next.x - start.x);
        const c = CARS[selectedCar];
        return {
            x: start.x, y: start.y,
            angle: angle,
            speed: 0,
            acceleration: 0,
            steering: 0,
            width: 18,
            height: 36,
            rpm: 0,
            gear: 0,
            oilPress: 5.2,
            oilTemp: 90,
            radTemp: 85,
            fuel: 100,
            tires: [2.4, 2.4, 2.4, 2.4],
            tirePunctured: [false, false, false, false],
            engineOverheat: false,
            waterSprayCooldown: 0,
            reinflateCooldown: 0,
            topSpeed: c.topSpeed,
            accel: c.accel,
            braking: c.braking,
            handling: c.handling,
            color: c.color,
            stripe: c.stripe,
            bodyColor: c.bodyColor,
            name: c.name,
            lapProgress: 0,
            lastLapPoint: 0,
            lapDone: false
        };
    }

    // ---- PICKUPS ----
    function spawnPickups() {
        pickups = [];
        for (let i = 0; i < 12; i++) {
            const idx = Math.floor(Math.random() * roadSegments.length);
            const seg = roadSegments[idx];
            const t = Math.random();
            const px = seg.x + (seg.nx) * (Math.random() - 0.5) * seg.width * 0.6;
            const py = seg.y + (seg.ny) * (Math.random() - 0.5) * seg.width * 0.6;
            const r = Math.random();
            let ptype;
            if (r < 0.25) ptype = 'puncture';
            else if (r < 0.45) ptype = 'nitro';
            else if (r < 0.65) ptype = 'water';
            else if (r < 0.85) ptype = 'repair';
            else ptype = 'fuel';
            pickups.push({ x: px, y: py, type: ptype, active: true, radius: 12, wobble: Math.random() * Math.PI * 2 });
        }
    }

    // ---- PARTICLES ----
    function addParticles(x, y, color, count, spread, life) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * spread;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: life || 30,
                maxLife: life || 30,
                color: color,
                size: 2 + Math.random() * 4,
                z: 0
            });
        }
    }

    // ---- INPUT ----
    const keys = {};
    document.addEventListener('keydown', e => { keys[e.key] = true; if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    // ---- UI ----
    const speedEl = document.getElementById('speedometer');
    const rpmEl = document.getElementById('rpm-val');
    const gearEl = document.getElementById('gear-val');
    const oilPressEl = document.getElementById('oil-press');
    const oilTempEl = document.getElementById('oil-temp');
    const radTempEl = document.getElementById('rad-temp');
    const fuelEl = document.getElementById('fuel-val');
    const tiresEl = [
        document.getElementById('tire-fl'),
        document.getElementById('tire-fr'),
        document.getElementById('tire-rl'),
        document.getElementById('tire-rr')
    ];
    const lapInfoEl = document.getElementById('lap-info');
    const pickupMsgEl = document.getElementById('pickup-msg');
    const overlay = document.getElementById('game-overlay');
    const resultTitle = document.getElementById('result-title');
    const resultSub = document.getElementById('result-sub');
    const finalStats = document.getElementById('final-stats');
    const restartBtn = document.getElementById('btn-restart');
    const carNameDisplay = document.getElementById('car-name-display');

    document.getElementById('btn-reinflate').addEventListener('click', () => {
        if (!car || gameState !== 'playing') return;
        if (car.reinflateCooldown > 0) return;
        car.reinflateCooldown = 120;
        let fixed = false;
        for (let i = 0; i < 4; i++) {
            if (car.tirePunctured[i]) {
                car.tirePunctured[i] = false;
                car.tires[i] = 2.4;
                fixed = true;
            }
        }
        if (fixed) {
            showPickupMsg('✅ Tires Reinflated!');
            addParticles(car.x, car.y, '#0ff', 10, 30, 20);
        } else {
            for (let i = 0; i < 4; i++) {
                car.tires[i] = Math.min(2.4, car.tires[i] + 0.3);
            }
            showPickupMsg('🔵 Tires Pressurized');
        }
    });

    document.getElementById('btn-water').addEventListener('click', () => {
        if (!car || gameState !== 'playing') return;
        if (car.waterSprayCooldown > 0) return;
        car.waterSprayCooldown = 180;
        if (car.engineOverheat || car.radTemp > 95) {
            car.radTemp = Math.max(80, car.radTemp - 25);
            car.engineOverheat = (car.radTemp > 105);
            showPickupMsg('💧 Engine Sprayed!');
            addParticles(car.x, car.y, '#aaddff', 15, 40, 25);
        } else {
            car.radTemp = Math.max(75, car.radTemp - 8);
            showPickupMsg('💧 Coolant Boost');
        }
    });

    document.querySelectorAll('[data-car]').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedCar = parseInt(btn.dataset.car);
            startGame();
        });
    });

    restartBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
        document.querySelectorAll('[data-car]').forEach(b => b.parentNode.style.display = '');
        restartBtn.classList.add('hidden');
        resultTitle.textContent = 'HYPERCAR GP 3D';
        resultSub.textContent = 'Select Your Hypercar';
        finalStats.textContent = '';
        gameState = 'menu';
        car = null;
        laps = 0;
        lapTimes = [];
        bestLapTime = Infinity;
        totalTime = 0;
        particles = [];
        speedLines = [];
    });

    function showPickupMsg(msg) {
        pickupMsgEl.textContent = msg;
        pickupMsgEl.style.opacity = 1;
        setTimeout(() => { pickupMsgEl.style.opacity = 0; }, 1200);
    }

    function startGame() {
        car = createCar();
        laps = 0;
        lapTimes = [];
        bestLapTime = Infinity;
        totalTime = 0;
        lapStartTime = performance.now();
        gameState = 'playing';
        spawnPickups();
        particles = [];
        speedLines = [];
        overlay.classList.add('hidden');
        document.querySelectorAll('[data-car]').forEach(b => b.parentNode.style.display = 'none');
        restartBtn.classList.add('hidden');
        carNameDisplay.textContent = car.name;
        lastTime = performance.now();
        updateGUI();
    }

    function finishGame(won) {
        gameState = 'gameover';
        overlay.classList.remove('hidden');
        document.querySelectorAll('[data-car]').forEach(b => b.parentNode.style.display = 'none');
        restartBtn.classList.remove('hidden');
        if (won) {
            resultTitle.textContent = '🏆 CHAMPION!';
            resultSub.textContent = 'You won the Hypercar Grand Prix!';
        } else {
            resultTitle.textContent = '💥 GAME OVER';
            resultSub.textContent = 'Your engine gave out...';
        }
        let stats = `Laps: ${laps}/${maxLaps} | Best Lap: ${bestLapTime < Infinity ? (bestLapTime/1000).toFixed(1) : '--'}s`;
        if (lapTimes.length > 0) {
            stats += ` | Avg: ${(lapTimes.reduce((a,b)=>a+b,0)/lapTimes.length/1000).toFixed(1)}s`;
        }
        finalStats.textContent = stats;
    }

    // ---- 3D PROJECTION ----
    const CAMERA_HEIGHT = 180;
    const CAMERA_DISTANCE = 140;
    const CAMERA_LOOK_AHEAD = 80;
    const FOV = 350;
    const VIEW_DISTANCE = 800;

    function projectWorldToScreen(wx, wy, wz, camX, camY, camAngle) {
        const dx = wx - camX;
        const dy = wy - camY;
        const cos = Math.cos(-camAngle);
        const sin = Math.sin(-camAngle);
        const rx = dx * cos - dy * sin;
        const rz = dx * sin + dy * cos;
        if (rz < 1) return null;
        const scale = FOV / rz;
        return {
            x: W/2 + rx * scale,
            y: H/2 - (wz - CAMERA_HEIGHT) * scale,
            depth: rz,
            scale: scale
        };
    }

    // ---- RENDER 3D ----
    function render3D() {
        ctx.clearRect(0, 0, W, H);

        if (!car && gameState !== 'menu') return;

        if (gameState === 'menu') {
            // Menu background
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a2e');
            grad.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#e94560';
            ctx.font = 'bold 48px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(233,69,96,0.5)';
            ctx.shadowBlur = 30;
            ctx.fillText('HYPERCAR GP 3D', W/2, H/2 - 80);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0ff';
            ctx.font = '20px "Courier New"';
            ctx.fillText('Select a car from the panel to start', W/2, H/2 - 20);
            return;
        }

        const c = car;
        if (!c) return;

        // Camera position: behind and above the car
        const camX = c.x - Math.cos(c.angle) * CAMERA_DISTANCE;
        const camY = c.y - Math.sin(c.angle) * CAMERA_DISTANCE;
        const camAngle = c.angle;

        // ---- Sky ----
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
        skyGrad.addColorStop(0, '#1a2a5e');
        skyGrad.addColorStop(0.5, '#3a5a8e');
        skyGrad.addColorStop(1, '#7ab8d8');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H * 0.6);

        // Sun
        ctx.fillStyle = '#ffdd88';
        ctx.shadowColor = '#ffdd88';
        ctx.shadowBlur = 60;
        ctx.beginPath();
        ctx.arc(800, 60, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let i = 0; i < 6; i++) {
            const cx = (i * 170 + 40) % W;
            const cy = 30 + Math.sin(i * 2.3) * 40;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 50 + Math.sin(i * 1.7) * 20, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx - 30, cy + 5, 30, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 25, cy + 3, 35, 10, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // ---- Ground ----
        ctx.fillStyle = '#2a5a2a';
        ctx.fillRect(0, H * 0.6, W, H * 0.4);
        // Grass texture hint
        ctx.fillStyle = '#3a6a3a';
        for (let i = 0; i < 200; i++) {
            const gx = Math.random() * W;
            const gy = H * 0.6 + Math.random() * H * 0.4;
            ctx.fillRect(gx, gy, 2, 4);
        }

        // ---- Road rendering (back to front) ----
        // Determine which road segments are visible
        const visibleSegments = [];
        const segCount = roadSegments.length;

        for (let i = 0; i < segCount; i++) {
            const seg = roadSegments[i];
            const dx = seg.x - camX;
            const dy = seg.y - camY;
            const cos = Math.cos(-camAngle);
            const sin = Math.sin(-camAngle);
            const rz = dx * sin + dy * cos;
            if (rz < 5 || rz > VIEW_DISTANCE) continue;
            const rx = dx * cos - dy * sin;
            // Cull behind camera more aggressively
            if (rz < 0) continue;
            const scale = FOV / rz;
            const sxL = W/2 + (seg.leftX - camX) * cos - (seg.leftY - camY) * sin * scale;
            const sxR = W/2 + (seg.rightX - camX) * cos - (seg.rightY - camY) * sin * scale;
            const sy = H/2 - (0 - CAMERA_HEIGHT) * scale;
            visibleSegments.push({
                seg: seg,
                depth: rz,
                sxL: W/2 + (seg.leftX - camX) * cos - (seg.leftY - camY) * sin,
                sxR: W/2 + (seg.rightX - camX) * cos - (seg.rightY - camY) * sin,
                sy: sy,
                scale: scale,
                rx: rx,
                rz: rz
            });
        }

        // Sort by depth (far to near)
        visibleSegments.sort((a, b) => b.depth - a.depth);

        // Draw road segments
        for (let i = 0; i < visibleSegments.length; i++) {
            const seg = visibleSegments[i];
            const next = i < visibleSegments.length - 1 ? visibleSegments[i + 1] : null;
            if (!next) continue;

            const scale1 = seg.scale;
            const scale2 = next.scale;
            const sy1 = seg.sy;
            const sy2 = next.sy;

            const leftX1 = seg.sxL * scale1 / FOV + W/2;
            const leftX2 = next.sxL * scale2 / FOV + W/2;
            const rightX1 = seg.sxR * scale1 / FOV + W/2;
            const rightX2 = next.sxR * scale2 / FOV + W/2;

            // More accurate projection using the actual world positions
            const p1 = projectWorldToScreen(seg.seg.leftX, seg.seg.leftY, 0, camX, camY, camAngle);
            const p2 = projectWorldToScreen(seg.seg.rightX, seg.seg.rightY, 0, camX, camY, camAngle);
            const p3 = projectWorldToScreen(next.seg.leftX, next.seg.leftY, 0, camX, camY, camAngle);
            const p4 = projectWorldToScreen(next.seg.rightX, next.seg.rightY, 0, camX, camY, camAngle);
            if (!p1 || !p2 || !p3 || !p4) continue;

            // Draw road surface
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.closePath();

            // Road color with slight variation
            const brightness = 0.5 + 0.5 * (1 - seg.depth / VIEW_DISTANCE);
            const gray = Math.floor(60 * brightness);
            ctx.fillStyle = `rgb(${gray}, ${gray + 10}, ${gray + 15})`;
            ctx.fill();

            // Road edge markings (dashed)
            if (seg.depth < 400 && seg.depth > 10) {
                const isDash = Math.floor(seg.seg.index * 0.3) % 2 === 0;
                if (isDash) {
                    ctx.strokeStyle = `rgba(255,255,255,${0.4 * brightness})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(p2.x, p2.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.stroke();
                }
            }
        }

        // Draw center line (dashed)
        for (let i = 0; i < visibleSegments.length; i++) {
            const seg = visibleSegments[i];
            const next = i < visibleSegments.length - 1 ? visibleSegments[i + 1] : null;
            if (!next) continue;
            const p1 = projectWorldToScreen(seg.seg.x, seg.seg.y, 0, camX, camY, camAngle);
            const p2 = projectWorldToScreen(next.seg.x, next.seg.y, 0, camX, camY, camAngle);
            if (!p1 || !p2 || seg.depth > 350) continue;
            const isDash = Math.floor(seg.seg.index * 0.5) % 2 === 0;
            if (isDash) {
                ctx.strokeStyle = `rgba(255,255,100,${0.5 * (1 - seg.depth / 400)})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }

        // ---- Curbs ----
        for (let i = 0; i < visibleSegments.length; i++) {
            const seg = visibleSegments[i];
            if (seg.depth > 250) continue;
            const next = i < visibleSegments.length - 1 ? visibleSegments[i + 1] : null;
            if (!next) continue;
            const p1 = projectWorldToScreen(seg.seg.leftX, seg.seg.leftY, 0, camX, camY, camAngle);
            const p2 = projectWorldToScreen(seg.seg.rightX, seg.seg.rightY, 0, camX, camY, camAngle);
            const p3 = projectWorldToScreen(next.seg.leftX, next.seg.leftY, 0, camX, camY, camAngle);
            const p4 = projectWorldToScreen(next.seg.rightX, next.seg.rightY, 0, camX, camY, camAngle);
            if (!p1 || !p2 || !p3 || !p4) continue;

            const isRed = Math.floor(seg.seg.index * 0.8) % 2 === 0;
            const curbColor = isRed ? `rgba(255,50,50,${0.7 * (1 - seg.depth / 300)})` : `rgba(255,255,255,${0.5 * (1 - seg.depth / 300)})`;

            // Left curb (thin strip beyond road edge)
            const curbWidth = 6;
            const p1c = projectWorldToScreen(seg.seg.leftX + seg.seg.nx * curbWidth, seg.seg.leftY + seg.seg.ny * curbWidth, 0, camX, camY, camAngle);
            const p3c = projectWorldToScreen(next.seg.leftX + next.seg.nx * curbWidth, next.seg.leftY + next.seg.ny * curbWidth, 0, camX, camY, camAngle);
            if (p1c && p3c) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.lineTo(p3c.x, p3c.y);
                ctx.lineTo(p1c.x, p1c.y);
                ctx.closePath();
                ctx.fillStyle = curbColor;
                ctx.fill();
            }

            // Right curb
            const p2c = projectWorldToScreen(seg.seg.rightX - seg.seg.nx * curbWidth, seg.seg.rightY - seg.seg.ny * curbWidth, 0, camX, camY, camAngle);
            const p4c = projectWorldToScreen(next.seg.rightX - next.seg.nx * curbWidth, next.seg.rightY - next.seg.ny * curbWidth, 0, camX, camY, camAngle);
            if (p2c && p4c) {
                ctx.beginPath();
                ctx.moveTo(p2.x, p2.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.lineTo(p4c.x, p4c.y);
                ctx.lineTo(p2c.x, p2c.y);
                ctx.closePath();
                ctx.fillStyle = curbColor;
                ctx.fill();
            }
        }

        // ---- Pickups in 3D ----
        for (const p of pickups) {
            if (!p.active) continue;
            const dx = p.x - camX;
            const dy = p.y - camY;
            const cos = Math.cos(-camAngle);
            const sin = Math.sin(-camAngle);
            const rz = dx * sin + dy * cos;
            if (rz < 5 || rz > VIEW_DISTANCE * 0.6) continue;
            const rx = dx * cos - dy * sin;
            const scale = FOV / rz;
            const sx = W/2 + rx * scale;
            const sy = H/2 - (10 - CAMERA_HEIGHT) * scale;
            const size = Math.max(3, 20 * FOV / rz / 20);
            if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;

            // Wobble animation
            p.wobble = (p.wobble || 0) + 0.04;
            const bobY = Math.sin(p.wobble) * 4;

            let color = '#0f0';
            let icon = '?';
            switch(p.type) {
                case 'puncture': color = '#f00'; icon = '⚠'; break;
                case 'nitro': color = '#ff0'; icon = '🔥'; break;
                case 'water': color = '#0af'; icon = '💧'; break;
                case 'repair': color = '#0f0'; icon = '🔧'; break;
                case 'fuel': color = '#f80'; icon = '⛽'; break;
            }

            // Glow
            const alpha = Math.min(1, 300 / rz);
            ctx.shadowColor = color;
            ctx.shadowBlur = 20 * alpha;

            // 3D box
            const boxSize = size;
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            ctx.fillRect(sx - boxSize/2, sy + bobY - boxSize/2, boxSize, boxSize);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(sx - boxSize/2, sy + bobY - boxSize/2, boxSize, boxSize);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.max(8, size * 0.6)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, sx, sy + bobY);
            ctx.globalAlpha = 1;
        }

        // ---- Car (3D model) ----
        const carPts = [
            { x: c.x + Math.cos(c.angle) * 18 - Math.sin(c.angle) * 9, y: c.y + Math.sin(c.angle) * 18 + Math.cos(c.angle) * 9, z: 0 },  // front-right
            { x: c.x + Math.cos(c.angle) * 18 + Math.sin(c.angle) * 9, y: c.y + Math.sin(c.angle) * 18 - Math.cos(c.angle) * 9, z: 0 },  // front-left
            { x: c.x - Math.cos(c.angle) * 18 + Math.sin(c.angle) * 9, y: c.y - Math.sin(c.angle) * 18 - Math.cos(c.angle) * 9, z: 0 },  // rear-left
            { x: c.x - Math.cos(c.angle) * 18 - Math.sin(c.angle) * 9, y: c.y - Math.sin(c.angle) * 18 + Math.cos(c.angle) * 9, z: 0 },  // rear-right
            // Top points (roof)
            { x: c.x + Math.cos(c.angle) * 14 - Math.sin(c.angle) * 8, y: c.y + Math.sin(c.angle) * 14 + Math.cos(c.angle) * 8, z: -16 },
            { x: c.x + Math.cos(c.angle) * 14 + Math.sin(c.angle) * 8, y: c.y + Math.sin(c.angle) * 14 - Math.cos(c.angle) * 8, z: -16 },
            { x: c.x - Math.cos(c.angle) * 14 + Math.sin(c.angle) * 8, y: c.y - Math.sin(c.angle) * 14 - Math.cos(c.angle) * 8, z: -16 },
            { x: c.x - Math.cos(c.angle) * 14 - Math.sin(c.angle) * 8, y: c.y - Math.sin(c.angle) * 14 + Math.cos(c.angle) * 8, z: -16 }
        ];

        const projectedPts = carPts.map(p => projectWorldToScreen(p.x, p.y, -p.z, camX, camY, camAngle)).filter(p => p !== null);
        if (projectedPts.length >= 4) {
            // Draw car body (simplified)
            // Sort points by depth for painter's algorithm
            const carDepth = projectedPts.reduce((sum, p) => sum + p.depth, 0) / projectedPts.length;

            // Car body shadow
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 20;

            // Main body (trapezoid)
            ctx.beginPath();
            ctx.moveTo(projectedPts[0].x, projectedPts[0].y);
            ctx.lineTo(projectedPts[1].x, projectedPts[1].y);
            ctx.lineTo(projectedPts[2].x, projectedPts[2].y);
            ctx.lineTo(projectedPts[3].x, projectedPts[3].y);
            ctx.closePath();
            ctx.fillStyle = c.bodyColor || '#1a1a4e';
            ctx.fill();

            ctx.shadowBlur = 0;

            // Roof
            if (projectedPts.length >= 8) {
                ctx.beginPath();
                ctx.moveTo(projectedPts[4].x, projectedPts[4].y);
                ctx.lineTo(projectedPts[5].x, projectedPts[5].y);
                ctx.lineTo(projectedPts[6].x, projectedPts[6].y);
                ctx.lineTo(projectedPts[7].x, projectedPts[7].y);
                ctx.closePath();
                ctx.fillStyle = '#2a2a3e';
                ctx.fill();
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Stripe
            const stripeColor = c.stripe || '#c0a030';
            ctx.strokeStyle = stripeColor;
            ctx.lineWidth = 3;
            const mid1 = { x: (projectedPts[0].x + projectedPts[1].x)/2, y: (projectedPts[0].y + projectedPts[1].y)/2 };
            const mid2 = { x: (projectedPts[2].x + projectedPts[3].x)/2, y: (projectedPts[2].y + projectedPts[3].y)/2 };
            ctx.beginPath();
            ctx.moveTo(mid1.x, mid1.y);
            ctx.lineTo(mid2.x, mid2.y);
            ctx.stroke();

            // Windshield
            if (projectedPts.length >= 8) {
                ctx.fillStyle = 'rgba(100,180,255,0.35)';
                ctx.beginPath();
                ctx.moveTo(projectedPts[0].x, projectedPts[0].y);
                ctx.lineTo(projectedPts[1].x, projectedPts[1].y);
                ctx.lineTo(projectedPts[5].x, projectedPts[5].y);
                ctx.lineTo(projectedPts[4].x, projectedPts[4].y);
                ctx.closePath();
                ctx.fill();
            }

            // Headlights
            ctx.fillStyle = '#ffdd88';
            ctx.shadowColor = '#ffdd88';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(projectedPts[0].x, projectedPts[0].y, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(projectedPts[1].x, projectedPts[1].y, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Taillights
            ctx.fillStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(projectedPts[2].x, projectedPts[2].y, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(projectedPts[3].x, projectedPts[3].y, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Wheels
            ctx.fillStyle = '#111';
            const wheelSize = 3;
            for (let i = 0; i < 4; i++) {
                if (projectedPts[i]) {
                    ctx.beginPath();
                    ctx.arc(projectedPts[i].x, projectedPts[i].y, wheelSize, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // ---- Speed lines ----
        if (c.speed > 30) {
            const intensity = (c.speed - 30) / 100;
            for (let i = 0; i < Math.floor(intensity * 8); i++) {
                const sx = Math.random() * W;
                const sy = Math.random() * H;
                const len = 20 + Math.random() * 40 * intensity;
                const alpha = Math.random() * 0.3 * intensity;
                ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + (Math.random() - 0.5) * 10, sy + len);
                ctx.stroke();
            }
        }

        // ---- Exhaust particles ----
        if (c.speed > 5) {
            const ex = c.x - Math.cos(c.angle) * 20;
            const ey = c.y - Math.sin(c.angle) * 20;
            addParticles(ex + (Math.random()-0.5)*4, ey + (Math.random()-0.5)*4, '#888', 1, 5, 15);
            if (c.speed > 30) {
                addParticles(ex + (Math.random()-0.5)*3, ey + (Math.random()-0.5)*3, '#ff6600', 1, 8, 10);
            }
        }

        // ---- Particles in 3D ----
        for (const p of particles) {
            const pp = projectWorldToScreen(p.x, p.y, -p.z, camX, camY, camAngle);
            if (!pp || pp.depth > VIEW_DISTANCE * 0.5) continue;
            const alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            const size = p.size * (p.life / p.maxLife) * (200 / pp.depth);
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10 * alpha;
            ctx.beginPath();
            ctx.arc(pp.x, pp.y, Math.max(1, size), 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;

        // ---- HUD car indicator arrow ----
        // Show direction to next lap point if far off track
        const nearest = roadSegments.reduce((best, seg, idx) => {
            const d = Math.hypot(seg.x - c.x, seg.y - c.y);
            return d < best.d ? { idx, d } : best;
        }, { idx: 0, d: Infinity });
        if (nearest.d > 100) {
            const seg = roadSegments[nearest.idx];
            const pp = projectWorldToScreen(seg.x, seg.y, 0, camX, camY, camAngle);
            if (pp && pp.depth > 0) {
                ctx.fillStyle = '#ff0';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⬆', Math.min(W-30, Math.max(30, pp.x)), Math.min(H-30, Math.max(30, pp.y)));
            }
        }

        // ---- Vignette (already CSS) ----
    }

    // ---- UPDATE ----
    function update(dt) {
        if (gameState !== 'playing' || !car) return;

        const c = car;
        if (c.waterSprayCooldown > 0) c.waterSprayCooldown--;
        if (c.reinflateCooldown > 0) c.reinflateCooldown--;

        let accelInput = 0, brakeInput = 0, steerInput = 0;
        if (keys['w'] || keys['ArrowUp']) accelInput = 1;
        if (keys['s'] || keys['ArrowDown']) brakeInput = 1;
        if (keys['a'] || keys['ArrowLeft']) steerInput = -1;
        if (keys['d'] || keys['ArrowRight']) steerInput = 1;

        const topSpeed = c.topSpeed / 3.6;
        if (accelInput) {
            c.speed += c.accel * dt * 60 * (1 - c.speed / topSpeed * 0.5);
        }
        if (brakeInput) {
            c.speed -= c.braking * dt * 60;
        }
        c.speed *= (1 - 0.003 * dt * 60);
        if (c.speed < 0) c.speed = 0;

        const punctCount = c.tirePunctured.filter(p=>p).length;
        if (punctCount > 0) {
            c.speed *= (1 - punctCount * 0.15);
            c.angle += (Math.random() - 0.5) * 0.05 * punctCount;
        }

        if (c.speed > 1) {
            const steerFactor = c.handling * (1 - c.speed / topSpeed * 0.3);
            c.angle += steerInput * steerFactor * dt * 60;
        }

        c.x += Math.cos(c.angle) * c.speed * dt * 60;
        c.y += Math.sin(c.angle) * c.speed * dt * 60;

        c.rpm = Math.min(10000, (c.speed / topSpeed) * 8000 + 800);
        c.gear = c.speed < 0.5 ? 0 : Math.min(7, Math.floor(c.speed / topSpeed * 7) + 1);

        const load = c.speed / topSpeed;
        c.oilPress = 4.0 + load * 2.0 + (Math.random() - 0.5) * 0.3;
        c.oilTemp = 85 + load * 20 + (punctCount > 0 ? 5 : 0);
        if (c.oilTemp > 115) c.oilTemp = 115 + (Math.random() - 0.5) * 2;
        c.radTemp = 80 + load * 25 + (punctCount > 0 ? 8 : 0) - (c.waterSprayCooldown > 150 ? 15 : 0);
        c.engineOverheat = c.radTemp > 110;

        c.fuel -= load * 0.004 * dt * 60;
        if (c.fuel < 0) c.fuel = 0;

        for (let i = 0; i < 4; i++) {
            if (c.tirePunctured[i]) {
                c.tires[i] = Math.max(0.2, c.tires[i] - 0.005 * dt * 60);
            }
        }

        if (c.engineOverheat && c.radTemp > 115 && c.waterSprayCooldown <= 0) {
            if (Math.random() < 0.002 * dt * 60) {
                finishGame(false);
                return;
            }
        }

        // ---- LAP TRACKING ----
        let minDist = Infinity;
        let nearestIdx = 0;
        for (let i = 0; i < roadSegments.length; i++) {
            const d = Math.hypot(c.x - roadSegments[i].x, c.y - roadSegments[i].y);
            if (d < minDist) { minDist = d; nearestIdx = i; }
        }
        const progress = nearestIdx / roadSegments.length;
        const delta = progress - c.lapProgress;
        if (delta > 0.5) {
            c.lapDone = true;
        } else if (delta < -0.5) {
            if (c.lapDone) {
                const lapTime = performance.now() - lapStartTime;
                lapTimes.push(lapTime);
                if (lapTime < bestLapTime) bestLapTime = lapTime;
                laps++;
                if (laps >= maxLaps) {
                    finishGame(true);
                    return;
                }
                lapStartTime = performance.now();
                c.lapDone = false;
                showPickupMsg(`🏁 Lap ${laps}/${maxLaps} completed!`);
            }
        }
        c.lapProgress = progress;

        // ---- PICKUPS ----
        for (let i = 0; i < pickups.length; i++) {
            const p = pickups[i];
            if (!p.active) continue;
            const dist = Math.hypot(c.x - p.x, c.y - p.y);
            if (dist < 24) {
                p.active = false;
                applyPickup(c, p.type);
            }
        }

        if (Math.random() < 0.002 * dt * 60) {
            const seg = roadSegments[Math.floor(Math.random() * roadSegments.length)];
            const px = seg.x + (Math.random() - 0.5) * seg.width * 0.5;
            const py = seg.y + (Math.random() - 0.5) * seg.width * 0.5;
            const types = ['puncture','nitro','water','repair','fuel'];
            pickups.push({ x: px, y: py, type: types[Math.floor(Math.random()*types.length)], active: true, radius: 12, wobble: Math.random() * Math.PI * 2 });
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt * 60;
            p.y += p.vy * dt * 60;
            p.vx *= 0.96;
            p.vy *= 0.96;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        updateGUI();
    }

    function applyPickup(c, type) {
        switch(type) {
            case 'puncture':
                const idx = Math.floor(Math.random() * 4);
                c.tirePunctured[idx] = true;
                c.tires[idx] = 0.5;
                showPickupMsg('⚠️ Tire Punctured!');
                addParticles(c.x, c.y, '#f00', 20, 50, 30);
                break;
            case 'nitro':
                c.speed = Math.min(c.topSpeed/3.6 * 1.3, c.speed + 40);
                showPickupMsg('🔥 NITRO BOOST!');
                addParticles(c.x, c.y, '#ff0', 25, 60, 20);
                break;
            case 'water':
                c.waterSprayCooldown = 0;
                c.radTemp = Math.max(75, c.radTemp - 20);
                showPickupMsg('💧 Water Pickup');
                addParticles(c.x, c.y, '#aaddff', 8, 20, 15);
                break;
            case 'repair':
                for (let i = 0; i < 4; i++) {
                    if (c.tirePunctured[i]) { c.tirePunctured[i] = false; c.tires[i] = 2.4; }
                }
                c.engineOverheat = false;
                c.radTemp = Math.min(90, c.radTemp + 5);
                c.oilTemp = Math.min(95, c.oilTemp + 3);
                showPickupMsg('🔧 Repairs Done!');
                addParticles(c.x, c.y, '#0f0', 15, 30, 20);
                break;
            case 'fuel':
                c.fuel = Math.min(100, c.fuel + 25);
                showPickupMsg('⛽ Fuel +25');
                addParticles(c.x, c.y, '#ffaa00', 10, 25, 18);
                break;
        }
    }

    function updateGUI() {
        if (!car) return;
        const c = car;
        const speedKmh = (c.speed * 3.6).toFixed(0);
        speedEl.textContent = speedKmh;
        rpmEl.textContent = c.rpm.toFixed(0);
        gearEl.textContent = c.gear === 0 ? 'N' : c.gear.toString();
        oilPressEl.textContent = c.oilPress.toFixed(1);
        oilTempEl.textContent = c.oilTemp.toFixed(0);
        radTempEl.textContent = c.radTemp.toFixed(0);
        fuelEl.textContent = c.fuel.toFixed(0);
        for (let i = 0; i < 4; i++) {
            tiresEl[i].textContent = c.tires[i].toFixed(1);
            tiresEl[i].className = 'gauge-value';
            if (c.tirePunctured[i]) tiresEl[i].className = 'gauge-value critical';
            else if (c.tires[i] < 1.5) tiresEl[i].className = 'gauge-value warn';
        }
        oilTempEl.className = 'gauge-value' + (c.oilTemp > 110 ? ' critical' : c.oilTemp > 100 ? ' warn' : '');
        radTempEl.className = 'gauge-value' + (c.radTemp > 105 ? ' critical' : c.radTemp > 95 ? ' warn' : '');
        fuelEl.className = 'gauge-value' + (c.fuel < 20 ? ' warn' : '');
        lapInfoEl.textContent = `LAP ${Math.min(laps+1, maxLaps)}/${maxLaps}`;
        document.getElementById('btn-reinflate').disabled = c.reinflateCooldown > 0;
        document.getElementById('btn-water').disabled = c.waterSprayCooldown > 0;
    }

    // ---- MINIMAP ----
    function renderMinimap() {
        mctx.clearRect(0, 0, 160, 120);
        mctx.save();
        mctx.scale(160/1000, 120/700);
        // Track
        mctx.strokeStyle = '#555';
        mctx.lineWidth = 3;
        mctx.beginPath();
        for (let i = 0; i < roadSegments.length; i++) {
            const p = roadSegments[i];
            if (i===0) mctx.moveTo(p.x, p.y);
            else mctx.lineTo(p.x, p.y);
        }
        mctx.closePath();
        mctx.stroke();
        // Car
        if (car) {
            mctx.fillStyle = '#e94560';
            mctx.shadowColor = '#e94560';
            mctx.shadowBlur = 8;
            mctx.beginPath();
            mctx.arc(car.x, car.y, 5, 0, Math.PI*2);
            mctx.fill();
            mctx.shadowBlur = 0;
            // Direction
            mctx.strokeStyle = '#ff0';
            mctx.lineWidth = 2;
            mctx.beginPath();
            mctx.moveTo(car.x, car.y);
            mctx.lineTo(car.x + Math.cos(car.angle) * 20, car.y + Math.sin(car.angle) * 20);
            mctx.stroke();
            // Pickups
            for (const p of pickups) {
                if (!p.active) continue;
                mctx.fillStyle = '#0f0';
                mctx.beginPath();
                mctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
                mctx.fill();
            }
        }
        mctx.restore();
    }

    // ---- GAME LOOP ----
    function gameLoop(timestamp) {
        const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.05) : 0.016;
        lastTime = timestamp;
        update(dt);
        render3D();
        renderMinimap();
        requestAnimationFrame(gameLoop);
    }

    // ---- POLYFILL roundRect ----
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
        };
    }

    // ---- START ----
    gameLoop(0);
})();
</script>
