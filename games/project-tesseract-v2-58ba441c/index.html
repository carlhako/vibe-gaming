function getEffectiveness(attackElem, defenderElems){
  if(!defenderElems) return 1;
  let mul=1;
  for(let def of defenderElems){
    if(elementRelations[attackElem] && elementRelations[attackElem][def]!==undefined) mul*=elementRelations[attackElem][def];
    else mul*=1;
  }
  return mul;
}

const PIXEL_SIZE = 6; // each sprite pixel = 6x6 screen pixels

function drawPixelSprite(x, y, sprite, palette, pixelW=PIXEL_SIZE, pixelH=PIXEL_SIZE){
  if(!sprite || !palette) return;
  const rows = sprite.length;
  const cols = sprite[0].length;
  const totalW = cols * pixelW;
  const totalH = rows * pixelH;
  const startX = x - totalW/2;
  const startY = y - totalH/2;
  for(let row=0; row<rows; row++){
    for(let col=0; col<cols; col++){
      const idx = sprite[row][col];
      if(idx === 0) continue; // transparent
      ctx.fillStyle = palette[idx-1]; // palette is 0-indexed array
      ctx.fillRect(startX + col*pixelW, startY + row*pixelH, pixelW, pixelH);
    }
  }
}

// ---------------------------------------------------------------------------
// TILE TEXTURES
// ---------------------------------------------------------------------------
function drawGrassTile(tx, ty, tileX, tileY){
  ctx.fillStyle = '#8bc34a';
  ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
  // pattern: lighter patches
  const seed = (tileX*31 + tileY*37) % 7;
  ctx.fillStyle = '#9ccc65';
  for(let i=0; i<5; i++){
    const sx = tx + ((tileX*13 + tileY*17 + i*7) % TILE_SIZE);
    const sy = ty + ((tileX*19 + tileY*23 + i*11) % TILE_SIZE);
    ctx.fillRect(sx, sy, 6, 6);
  }
}
function drawPathTile(tx, ty, tileX, tileY){
  ctx.fillStyle = '#c2a062';
  ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
  // stones
  ctx.fillStyle = '#b08d4a';
  const seed = (tileX*43 + tileY*53) % 5;
  for(let i=0; i<4; i++){
    const sx = tx + ((tileX*23 + tileY*31 + i*11) % (TILE_SIZE-8));
    const sy = ty + ((tileX*37 + tileY*41 + i*13) % (TILE_SIZE-8));
    ctx.fillRect(sx, sy, 8, 8);
  }
}
function drawWaterTile(tx, ty, tileX, tileY){
  ctx.fillStyle = '#4a7ab5';
  ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
  ctx.fillStyle = '#5a8ac5';
  for(let i=0; i<2; i++){
    ctx.fillRect(tx + 10*i + (tileX%8)*2, ty + 15, 8, 4);
  }
}
function drawBuildingTile(tx, ty, tileX, tileY){
  // brick wall
  ctx.fillStyle = '#8b7355';
  ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
  ctx.strokeStyle = '#6a4f3b';
  for(let y=0; y<TILE_SIZE; y+=8){
    const off = (y/8)%2 ? 0 : 12;
    for(let x=off; x<TILE_SIZE; x+=24){
      ctx.strokeRect(tx+x, ty+y, 12, 8);
    }
  }
}
function drawBuildingRoof(tx, ty){
  ctx.fillStyle = '#b73d3d';
  ctx.beginPath(); ctx.moveTo(tx, ty-8); ctx.lineTo(tx+24, ty-8-TILE_SIZE/2); ctx.lineTo(tx+TILE_SIZE-24, ty-8-TILE_SIZE/2); ctx.lineTo(tx+TILE_SIZE, ty-8); ctx.closePath(); ctx.fill();
}

// ---------------------------------------------------------------------------
// RENDER OVERWORLD
// ---------------------------------------------------------------------------
function renderOverworld(){
  if(!currentMapData) return;
  for(let y=0; y<MAP_H; y++){
    for(let x=0; x<MAP_W; x++){
      const tile = currentMapData.bg[y][x];
      const tx = x*TILE_SIZE, ty = y*TILE_SIZE;
      if(tile===0) drawGrassTile(tx, ty, x, y);
      else if(tile===1) drawPathTile(tx, ty, x, y);
      else if(tile===2) drawWaterTile(tx, ty, x, y);
      else if(tile===3) drawBuildingTile(tx, ty, x, y);
    }
  }
  // draw roofs on buildings? (optional)
  // draw NPCs
  for(let n of currentMapData.npcs){
    const nx = n.x*TILE_SIZE + TILE_SIZE/2;
    const ny = n.y*TILE_SIZE + TILE_SIZE/2;
    drawNPC(nx, ny);
  }
  // draw wild hakkos
  for(let e of overworldEntities){
    drawHakko(e.x, e.y, e.species);
  }
  drawPlayer();
}

// ---------------------------------------------------------------------------
// DAY / NIGHT OVERLAY
// ---------------------------------------------------------------------------
function getDayPhase(cycleTime){
  if(cycleTime < DAY_LENGTH){
    if(cycleTime < 360) return 'Dawn';
    if(cycleTime < 1080) return 'Morning';
    if(cycleTime < 1440) return 'Afternoon';
    return 'Evening';
  }
  return 'Night';
}

function applyDayNightOverlay(){
  const cycleTime = playerData.time % DAY_CYCLE_LENGTH;
  const phase = getDayPhase(cycleTime);
  let alpha = 0, color = '#000';
  if(phase === 'Night'){ alpha = 0.35; color = '#0a1030'; }
  else if(phase === 'Evening'){ alpha = 0.15; color = '#ffaa50'; }
  else if(phase === 'Dawn'){ alpha = 0.1; color = '#ffccaa'; }
  // else no overlay
  if(alpha > 0){
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
function drawHUD(){
  const cycleTime = playerData.time % DAY_CYCLE_LENGTH;
  const phase = getDayPhase(cycleTime);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,24);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace';
  ctx.fillText(currentMapData? currentMapData.name : '', 10, 18);
  ctx.fillText(phase, W-80, 18);
  ctx.fillText('⌂ '+playerData.name, W-200, 18);
}

// ---------------------------------------------------------------------------
// MOVEMENT & COLLISION (FIXED)
// ---------------------------------------------------------------------------
const MOVE_SPEED = 4; // pixels per frame, faster now

function handlePlayingInput(){
  const p = playerData.playerPos;
  let dx=0, dy=0;
  if(keys['ArrowUp']||keys['w']) dy=-1;
  if(keys['ArrowDown']||keys['s']) dy=1;
  if(keys['ArrowLeft']||keys['a']) dx=-1;
  if(keys['ArrowRight']||keys['d']) dx=1;
  if(dx||dy){
    let newX = p.x + dx*MOVE_SPEED;
    let newY = p.y + dy*MOVE_SPEED;
    // check tile passability at the corners of the player's bounding box (16x16 hitbox)
    const hw = 14, hh = 16; // half-width/height
    // check four corners
    const corners = [
      [newX-hw, newY-hh],
      [newX+hw, newY-hh],
      [newX-hw, newY+hh],
      [newX+hw, newY+hh]
    ];
    let blocked = false;
    for(let [cx, cy] of corners){
      const tileX = Math.floor(cx / TILE_SIZE);
      const tileY = Math.floor(cy / TILE_SIZE);
      if(tileX<0 || tileX>=MAP_W || tileY<0 || tileY>=MAP_H || !isPassable(currentMapData.bg[tileY][tileX])){
        blocked = true; break;
      }
    }
    if(!blocked){
      p.x = clamp(newX, 0, MAP_W*TILE_SIZE-1);
      p.y = clamp(newY, 0, MAP_H*TILE_SIZE-1);
      p.dir = dx>0?1:dx<0?3:dy>0?2:0;
    }
  }
  // interaction (Enter)
  if(keys['Enter'] || keys[' ']){
    keys['Enter']=false; keys[' ']=false;
    const tileX = Math.floor(p.x / TILE_SIZE);
    const tileY = Math.floor(p.y / TILE_SIZE);
    // check warps (only if walkable tile)
    for(let w of currentMapData.warps){
      if(w.x===tileX && w.y===tileY){
        setPlayerMap(w.targetMap, w.targetX, w.targetY);
        return;
      }
    }
    // check NPCs (proximity)
    for(let n of currentMapData.npcs){
      const nx = n.x*TILE_SIZE + TILE_SIZE/2;
      const ny = n.y*TILE_SIZE + TILE_SIZE/2;
      const dist = Math.hypot(nx-p.x, ny-p.y);
      if(dist < TILE_SIZE*1.2){
        triggerNPC(n);
        return;
      }
    }
    // check wild encounter
    for(let e of overworldEntities){
      if(Math.abs(e.x-p.x) < TILE_SIZE*0.8 && Math.abs(e.y-p.y) < TILE_SIZE*0.8){
        startWildBattle(e.species, rndint(2,5));
        return;
      }
    }
  }
}

    case 'trainer_battle':
      startTrainerBattle(npc);
      break;
    case 'arena_boss1':
      if(playerData.arenaTrophies[0]) dialogueLines=['Boss: You already won!'];
      else startTrainerBattle({name:'Boss Agrias',team:[{species:14,level:8},{species:28,level:8},{species:20,level:9}]});
      break;
    default: break;
  }
}

// ---------------------------------------------------------------------------
// BATTLE SYSTEM (keep original logic, just visual tweaks)
// ---------------------------------------------------------------------------
function createHakko(speciesId,level=5){
  const sp=hakkoSpecies[speciesId];
  const hp=sp.stats.hp+level*2;
  const stats={hp:hp,maxHp:hp,atk:sp.stats.atk+level,def:sp.stats.def+level,spa:sp.stats.spa+level,spd:sp.stats.spd+level,spe:sp.stats.spe+level};
  const moves=[];
  if(sp.moves) for(let m of sp.moves) if(m.level<=level) moves.push({name:m.move});
  if(moves.length===0) moves.push({name:'Tackle'});
  return {
    id:Date.now()+Math.random(),
    species:speciesId,
    name:sp.name,
    level,
    xp:0,
    stats,
    currentHp:hp,
    status:null,
    moves:moves.slice(0,6),
    shiny: Math.random()<0.003?true:false,
    gender: Math.random()<0.5?'m':'f',
  };
}
function startWildBattle(speciesId,level){
  battleState={
    type:'wild',
    enemy:createHakko(speciesId,level),
    playerDeck:playerData.deck.slice(0,5),
    activePlayerIndex:playerData.deck.findIndex(h=>h.currentHp>0),
    turn:0,
    log:['A wild '+hakkoSpecies[speciesId].name+' appeared!'],
    cooldowns:{},
    playerWins:null,
    captureAttempt:false,
  };
  if(battleState.activePlayerIndex<0) battleState.activePlayerIndex=0;
  gameState='battle';
}
function startTrainerBattle(trainer){
  battleState={
    type:'trainer',
    enemyDeck:trainer.team.map(t=>createHakko(t.species,t.level)),
    activeEnemyIndex:0,
    playerDeck:playerData.deck.slice(0,5),
    activePlayerIndex:playerData.deck.findIndex(h=>h.currentHp>0),
    turn:0,
    log:[trainer.name+' challenges you!'],
    cooldowns:{},
    playerWins:null,
    trainer:trainer,
  };
  if(battleState.activePlayerIndex<0) battleState.activePlayerIndex=0;
  gameState='battle';
}
function applyMove(moveName,attacker,defender){
  const move=movesData[moveName];
  if(!move) return 0;
  let dmg=0;
  if(move.power){
    const atkStat=move.type==='Special'?attacker.stats.spa:attacker.stats.atk;
    const defStat=move.type==='Special'?defender.stats.spd:defender.stats.def;
    dmg=Math.floor(((2*attacker.level/5+2)*move.power*atkStat/defStat)/50+2);
    const mult=getEffectiveness(move.element, defender.species?hakkoSpecies[defender.species].elements:null);
    dmg=Math.floor(dmg*mult);
    if(Math.random()<0.0625) dmg=Math.floor(dmg*1.5);
  } else if(move.damage) dmg=move.damage;
  if(move.effect){
    if(move.effect.includes('burn') && Math.random()<0.1) defender.status='burn';
    else if(move.effect.includes('poison') && Math.random()<0.3) defender.status='poison';
    else if(move.effect.includes('paralyze') && Math.random()<0.1) defender.status='paralysis';
    else if(move.effect.includes('freeze') && Math.random()<0.1) defender.status='freeze';
    else if(move.effect.includes('sleep') && Math.random()<0.1) defender.status='sleep';
    else if(move.effect.includes('confuse') && Math.random()<0.1) defender.status='confuse';
  }
  if(dmg) defender.currentHp-=dmg;
  return dmg;
}
function battlePlayerAction(move){
  if(!battleState) return;
  const playerHakko=battleState.playerDeck[battleState.activePlayerIndex];
  const enemyHakko=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  if(!playerHakko||playerHakko.currentHp<=0) return;
  const cdKey=playerHakko.id+'_'+move;
  if(battleState.cooldowns[cdKey]>0) return;
  const dmg=applyMove(move,playerHakko,enemyHakko);
  battleState.log.push(playerHakko.name+' used '+move+'!');
  if(dmg>0) battleState.log.push('Dealt '+dmg+' damage.');
  if(movesData[move]&&movesData[move].cooldown) battleState.cooldowns[cdKey]=movesData[move].cooldown;
  battleState.turn++;
  if(enemyHakko.currentHp<=0){
    enemyHakko.currentHp=0;
    battleState.log.push(enemyHakko.name+' fainted!');
    if(battleState.type==='trainer'){
      battleState.activeEnemyIndex++;
      if(battleState.activeEnemyIndex>=battleState.enemyDeck.length) endBattle(true);
      else battleState.log.push('Enemy sends out '+battleState.enemyDeck[battleState.activeEnemyIndex].name+'!');
    } else if(battleState.type==='wild'){
      endBattle(true, enemyHakko.species);
    }
  } else {
    enemyTurn();
  }
}
function enemyTurn(){
  if(!battleState) return;
  const enemyHakko=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  const playerHakko=battleState.playerDeck[battleState.activePlayerIndex];
  if(!enemyHakko||enemyHakko.currentHp<=0) return;
  const availMoves=enemyHakko.moves.map(m=>m.name).filter(m=>!battleState.cooldowns[enemyHakko.id+'_'+m]);
  if(availMoves.length===0) return;
  const move=availMoves[Math.floor(Math.random()*availMoves.length)];
  const dmg=applyMove(move,enemyHakko,playerHakko);
  battleState.log.push('Foe '+enemyHakko.name+' used '+move+'!');
  if(dmg>0) battleState.log.push('Dealt '+dmg+' damage.');
  if(movesData[move]&&movesData[move].cooldown) battleState.cooldowns[enemyHakko.id+'_'+move]=movesData[move].cooldown;
  if(playerHakko.currentHp<=0){
    playerHakko.currentHp=0;
    battleState.log.push(playerHakko.name+' fainted!');
    const nextIdx=playerData.deck.findIndex(h=>h.currentHp>0);
    if(nextIdx>=0){
      battleState.activePlayerIndex=nextIdx;
      battleState.log.push('Go! '+playerData.deck[nextIdx].name+'!');
    } else endBattle(false);
  }
  battleState.turn++;
  for(let k in battleState.cooldowns) if(battleState.cooldowns[k]>0) battleState.cooldowns[k]--;
}
function attemptCapture(tesseractId){ /* similar to original */ }
function endBattle(win, caughtSpecies){
  if(win){
    if(caughtSpecies) {
      if(!playerData.codex[caughtSpecies]) playerData.codex[caughtSpecies]={seen:true,caught:true,shiny:false};
      else playerData.codex[caughtSpecies].caught=true;
    }
    for(let h of playerData.deck) if(h.currentHp>0) h.xp+=50;
    playerData.money+=100;
  }
  battleState=null;
  gameState='playing';
}

// ---------------------------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------------------------
function update(){
  if(gameState==='playing'){
    // day/night time
    playerData.time += 1/60;
    // wild AI
    updateOverworld();
  }
}
function updateOverworld(){
  if(!currentMapData) return;
  if(overworldEntities.length===0 && currentMapData.wildSpawns){
    for(let s of currentMapData.wildSpawns){
      if(Math.random()<0.5) continue; // only show some
      overworldEntities.push({
        x: s.x*TILE_SIZE + TILE_SIZE/2,
        y: s.y*TILE_SIZE + TILE_SIZE/2,
        species: s.species,
        timer: 0,
      });
    }
  }
  // simple idle movement
  for(let e of overworldEntities){
    if(Math.random()<0.02){
      e.targetX = e.x + rndint(-32,32);
      e.targetY = e.y + rndint(-32,32);
    }
    if(e.targetX){
      const dx = e.targetX - e.x, dy = e.targetY - e.y;
      const dist = Math.hypot(dx, dy);
      if(dist < 2){ e.targetX=null; }
      else{ e.x += dx/dist * 1.5; e.y += dy/dist * 1.5; }
    }
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(gameState==='title'){
    ctx.fillStyle='#112'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffa'; ctx.font='28px monospace'; ctx.fillText('Project Tesseract', 200, 200);
    ctx.font='20px monospace';
    ctx.fillText('[N]ew Game  [L]oad  [I]mport', 220, 260);
  }
  else if(gameState==='playing'){
    renderOverworld();
    applyDayNightOverlay();
    drawHUD();
  }
  else if(gameState==='battle'){
    drawBattle();
  }
  // dialogue box
  if(dialogueLines.length>0){
    ctx.fillStyle='#000'; ctx.fillRect(40, H-80, W-80, 60);
    ctx.strokeStyle='#fff'; ctx.strokeRect(40, H-80, W-80, 60);
    ctx.fillStyle='#fff'; ctx.font='14px monospace';
    ctx.fillText(dialogueLines[dialogueIndex], 50, H-50);
  }
}

function drawBattle(){
  if(!battleState) return;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.font='16px monospace';
  const enemy=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  const player=battleState.playerDeck[battleState.activePlayerIndex];
  ctx.fillText('Foe: '+enemy.name+' Lv'+enemy.level, 400, 80);
  ctx.fillText('HP: '+enemy.currentHp+'/'+enemy.stats.maxHp, 400, 110);
  ctx.fillText('You: '+player.name+' Lv'+player.level, 30, 300);
  ctx.fillText('HP: '+player.currentHp+'/'+player.stats.maxHp, 30, 330);
  for(let i=0;i<player.moves.length;i++){
    ctx.fillText((i+1)+'. '+player.moves[i].name, 30, 360+i*25);
  }
  ctx.fillText('[I]tems [C]apture [R]un', 30, 500);
  const log=battleState.log.slice(-3).join(' ');
  ctx.fillText(log, 30, 530);
}

// ---------------------------------------------------------------------------
// INPUT ROUTING
// ---------------------------------------------------------------------------
function handleGlobalInput(){
  if(dialogueLines.length>0){
    if(keys['Enter']||keys[' ']){
      dialogueIndex++;
      if(dialogueIndex>=dialogueLines.length){ dialogueLines=[]; dialogueIndex=0; }
      keys['Enter']=false; keys[' ']=false;
    }
    return;
  }
  if(gameState==='title'){
    if(keys['n']){ keys['n']=false; newGame(); }
    if(keys['l']){ keys['l']=false; /* load menu stub */ }
    if(keys['i']){ keys['i']=false; importSave(); }
  }
  else if(gameState==='playing'){
    handlePlayingInput();
  }
  else if(gameState==='battle'){
    // battle input handling (keys 1-4 for moves)
    if(keys['1']){keys['1']=false;battlePlayerAction(battleState.playerDeck[battleState.activePlayerIndex].moves[0]?.name);}
    if(keys['2']){keys['2']=false;battlePlayerAction(battleState.playerDeck[battleState.activePlayerIndex].moves[1]?.name);}
    if(keys['3']){keys['3']=false;battlePlayerAction(battleState.playerDeck[battleState.activePlayerIndex].moves[2]?.name);}
    if(keys['4']){keys['4']=false;battlePlayerAction(battleState.playerDeck[battleState.activePlayerIndex].moves[3]?.name);}
    if(keys['c']){keys['c']=false;attemptCapture('tesseract_basic');}
    if(keys['r']){keys['r']=false;endBattle(false);}
  }
}

// ---------------------------------------------------------------------------
// SAVE / NEW GAME
// ---------------------------------------------------------------------------
function newGame(){
  playerData={
    name:'Coal',
    money:500,
    deck:[],
    storage:[],
    inventory:[{id:'potion',count:3},{id:'tesseract_basic',count:5}],
    codex:{},
    scholarRank:0,
    scholarXp:0,
    arenaTrophies:[false,false,false,false,false],
    questFlags:{},
    fastTravelPoints:[],
    defeatedTrainers:{},
    defeatedTwins:false,
    legendariesCaught:{},
    legendariesDefeated:{},
    legendaryRespawnTimers:{},
    time:0,
    currentMap:'village',
    playerPos:{x:0,y:0,dir:0},
    visitedMaps:{},
  };
  setPlayerMap('village', 15, 10); // start at crossroad
  gameState='playing';
}
function saveGame(slot){
  const data=JSON.parse(JSON.stringify(playerData));
  saves[slot].data=data;
}
function loadGame(slot){
  if(!saves[slot].data) return false;
  playerData=JSON.parse(JSON.stringify(saves[slot].data));
  const px = Math.floor(playerData.playerPos.x / TILE_SIZE);
  const py = Math.floor(playerData.playerPos.y / TILE_SIZE);
  setPlayerMap(playerData.currentMap, px, py, playerData.playerPos.dir);
  gameState='playing';
  return true;
}
function exportSave(){
  const data={name:playerData.name, data:playerData};
  downloadJSON(data,'project_tesseract_save.json');
}
function importSave(callback){
  uploadJSON(json=>{
    playerData=json.data;
    const px = Math.floor(playerData.playerPos.x / TILE_SIZE);
    const py = Math.floor(playerData.playerPos.y / TILE_SIZE);
    setPlayerMap(playerData.currentMap, px, py, playerData.playerPos.dir);
    gameState='playing';
    if(callback) callback();
  });
}

// ---------------------------------------------------------------------------
// STARTUP
// ---------------------------------------------------------------------------
createMaps();
setPlayerMap('village', 15, 10);
gameState='title';

function gameLoop(){
  update();
  render();
  handleGlobalInput();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
})();
