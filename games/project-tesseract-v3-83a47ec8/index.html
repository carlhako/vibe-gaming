function getEffectiveness(attackElem, defenderElems){
  if(!defenderElems) return 1;
  let mul=1;
  for(let def of defenderElems){
    if(elementRelations[attackElem] && elementRelations[attackElem][def]!==undefined) mul*=elementRelations[attackElem][def];
    else mul*=1;
  }
  return mul;
}

function drawSprite(sprite, x, y, direction, frame){
  const sp = playerSprites[direction][frame];
  const data = sp.data;
  const rows = data.length, cols = data[0].length;
  const startX = x - (cols*PIXEL_SIZE)/2;
  const startY = y - (rows*PIXEL_SIZE)/2;
  for(let row=0; row<rows; row++){
    for(let col=0; col<cols; col++){
      const idx = data[row][col];
      if(idx===0) continue;
      ctx.fillStyle = sp.palette[idx-1];
      ctx.fillRect(startX + col*PIXEL_SIZE, startY + row*PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
    }
  }
}

// ---- TILE TEXTURES ----
let timeTick=0;
function drawGrassTile(tx, ty, tileX, tileY){
  ctx.fillStyle='#8bc34a'; ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);
  ctx.fillStyle='#9ccc65';
  for(let i=0;i<4;i++){
    const sx=tx+((tileX*13+tileY*17+i*7)%TILE_SIZE);
    const sy=ty+((tileX*19+tileY*23+i*11)%TILE_SIZE);
    ctx.fillRect(sx,sy,6,6);
  }
}
function drawPathTile(tx, ty, tileX, tileY){
  ctx.fillStyle='#c2a062'; ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);
  ctx.fillStyle='#b08d4a';
  for(let i=0;i<4;i++){
    const sx=tx+((tileX*23+tileY*31+i*11)%(TILE_SIZE-8));
    const sy=ty+((tileX*37+tileY*41+i*13)%(TILE_SIZE-8));
    ctx.fillRect(sx,sy,8,8);
  }
}
function drawWaterTile(tx,ty,tileX,tileY){
  ctx.fillStyle='#4a7ab5'; ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);
  ctx.fillStyle='#5a8ac5';
  for(let i=0;i<2;i++) ctx.fillRect(tx+10*i+(tileX%8)*2, ty+15, 8,4);
}
function drawBuildingTile(tx,ty,tileX,tileY){
  ctx.fillStyle='#8b7355'; ctx.fillRect(tx,ty,TILE_SIZE,TILE_SIZE);
  ctx.strokeStyle='#6a4f3b';
  for(let y=0; y<TILE_SIZE; y+=8){
    const off=(y/8)%2?0:12;
    for(let x=off; x<TILE_SIZE; x+=24) ctx.strokeRect(tx+x,ty+y,12,8);
  }
}
function drawTallGrassTile(tx,ty,tileX,tileY){
  drawGrassTile(tx,ty,tileX,tileY);
  // swaying grass blades
  ctx.fillStyle='#558b2f';
  const sway = Math.sin(timeTick*0.1 + tileX*1.5) * 3;
  for(let i=0;i<8;i++){
    const bx = tx + (tileX*23 + i*19) % TILE_SIZE;
    const by = ty + 24;
    ctx.fillRect(bx + sway, by - 12, 3, 12);
  }
}
function drawTreeTile(tx,ty,tileX,tileY){
  // trunk
  ctx.fillStyle='#6d4c41'; ctx.fillRect(tx+18, ty+20, 12, 28);
  // leaves
  ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(tx+24, ty+12, 18, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#388e3c'; ctx.beginPath(); ctx.arc(tx+16, ty+8, 14, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(tx+32, ty+8, 14, 0, Math.PI*2); ctx.fill();
}

// ---- RENDER WORLD ----
function renderWorld(){
  if(!currentMapData) return;
  // apply camera transform
  ctx.save();
  const camX = Math.floor(camera.x);
  const camY = Math.floor(camera.y);
  ctx.translate(-camX, -camY);
  
  // only draw visible tiles
  const startCol = Math.floor(camX / TILE_SIZE);
  const startRow = Math.floor(camY / TILE_SIZE);
  const endCol = Math.min(startCol + VIEW_W + 1, MAP_W);
  const endRow = Math.min(startRow + VIEW_H + 1, MAP_H);
  
  for(let y=startRow; y<endRow; y++){
    for(let x=startCol; x<endCol; x++){
      if(y<0||y>=MAP_H||x<0||x>=MAP_W) continue;
      const tile = currentMapData.bg[y][x];
      const tx = x*TILE_SIZE, ty = y*TILE_SIZE;
      switch(tile){
        case 0: drawGrassTile(tx,ty,x,y); break;
        case 1: drawPathTile(tx,ty,x,y); break;
        case 2: drawWaterTile(tx,ty,x,y); break;
        case 3: drawBuildingTile(tx,ty,x,y); break;
        case 4: drawTallGrassTile(tx,ty,x,y); break;
        case 5: drawTreeTile(tx,ty,x,y); break;
      }
    }
  }
  
  // draw NPCs
  for(let n of currentMapData.npcs){
    const nx = n.x*TILE_SIZE + TILE_SIZE/2;
    const ny = n.y*TILE_SIZE + TILE_SIZE/2;
    drawNPCFigure(nx, ny);
  }
  
  // draw wild entities (overworld)
  for(let e of overworldEntities){
    drawHakko(e.x, e.y, e.species);
  }
  
  // draw player
  const p = playerData.playerPos;
  let dirKey = 'down';
  if(p.dir===0) dirKey='up';
  else if(p.dir===1) dirKey='right';
  else if(p.dir===2) dirKey='down';
  else if(p.dir===3) dirKey='left';
  const moving = keys['ArrowUp']||keys['w']||keys['ArrowDown']||keys['s']||keys['ArrowLeft']||keys['a']||keys['ArrowRight']||keys['d'];
  if(moving){
    walkTimer++;
    if(walkTimer>8){ walkFrame=1-walkFrame; walkTimer=0; }
  } else { walkFrame=0; }
  drawSprite(null, p.x, p.y, dirKey, walkFrame);
  
  ctx.restore();
}

// simple hakko drawing (colored blob)
function drawHakko(x, y, species){
  const sp = hakkoSpecies[species];
  const col = sp.color;
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(x-5, y-6, 4, 4); ctx.fillRect(x+1, y-6, 4, 4);
  ctx.fillStyle='#000'; ctx.fillRect(x-4, y-5, 2, 2); ctx.fillRect(x+2, y-5, 2, 2);
}

function startDialogue(lines, options=null){
  dialogueLines=lines;
  dialogueIndex=0;
  dialogueOptions=options;
  dialogueSelected=0;
}
function handleDialogueInput(){
  if(keys['Enter']||keys[' ']){
    if(dialogueOptions && dialogueIndex===dialogueLines.length-1){
      // choose option
      const result = dialogueOptions[dialogueSelected];
      dialogueOptions=null; dialogueLines=[]; dialogueIndex=0;
      if(result.action) result.action();
      keys['Enter']=false; keys[' ']=false;
      return;
    }
    dialogueIndex++;
    if(dialogueIndex>=dialogueLines.length){
      dialogueLines=[]; dialogueIndex=0;
      if(dialogueOptions) dialogueOptions=null; // cancel
    }
    keys['Enter']=false; keys[' ']=false;
  }
  if(dialogueOptions && dialogueIndex===dialogueLines.length-1){
    if(keys['ArrowUp']||keys['w']){ dialogueSelected = (dialogueSelected-1+dialogueOptions.length)%dialogueOptions.length; keys['ArrowUp']=false; keys['w']=false; }
    if(keys['ArrowDown']||keys['s']){ dialogueSelected = (dialogueSelected+1)%dialogueOptions.length; keys['ArrowDown']=false; keys['s']=false; }
  }
}
function drawDialogueBox(){
  if(dialogueLines.length===0) return;
  const boxY = H-80;
  ctx.fillStyle='#000'; ctx.fillRect(10, boxY, W-20, 70);
  ctx.strokeStyle='#fff'; ctx.strokeRect(10, boxY, W-20, 70);
  ctx.fillStyle='#fff'; ctx.font='14px monospace';
  const line = dialogueLines[dialogueIndex];
  ctx.fillText(line, 20, boxY+25);
  if(dialogueOptions && dialogueIndex===dialogueLines.length-1){
    for(let i=0;i<dialogueOptions.length;i++){
      const opt = dialogueOptions[i];
      ctx.fillStyle = i===dialogueSelected ? '#ff0' : '#aaa';
      ctx.fillText((i+1)+'. '+opt.label, 40, boxY+45+i*20);
    }
  }
}

    case 'elmwood_intro':
      if(playerData.deck.length===0){
        startDialogue(['Prof. Elmwood: Ah, you need a starter! Choose one:'],
          [{label:'Ignipup (Fire)', action:()=>{giveStarter(1);}},
           {label:'Aquabud (Water)', action:()=>{giveStarter(4);}},
           {label:'Terratoise (Earth)', action:()=>{giveStarter(7);}}]);
      } else {
        startDialogue(['Prof. Elmwood: How is your Hakko doing?']);

    case 'trainer_battle':
      if(playerData.defeatedTrainers[npc.name]){ startDialogue([npc.name+': You already beat me.']); return; }
      startTrainerBattle(npc);
      break;
    case 'arena_entrance':
      if(playerData.arenaTrophies[0]) startDialogue(['Clerk: You already have the trophy!']);

        [{label:'Yes', action:()=>{startTrainerBattle(maps['arena1'].npcs.find(n=>n.id==='arenaboss1'));}},

  }

// ---- BATTLE SYSTEM ----
function createHakko(speciesId, level=5){
  const sp=hakkoSpecies[speciesId];
  const hp=sp.stats.hp+level*2;
  const stats={hp:hp,maxHp:hp,atk:sp.stats.atk+level,def:sp.stats.def+level,spa:sp.stats.spa+level,spd:sp.stats.spd+level,spe:sp.stats.spe+level};
  let moves=[];
  if(sp.moves) for(let m of sp.moves) if(m.level<=level) moves.push({name:m.move});
  if(moves.length===0) moves.push({name:'Tackle'});
  return {
    id:Date.now()+Math.random(),
    species:speciesId,
    name:sp.name,
    level,
    xp:0,
    stats,
    currentHp:hp,
    status:null,
    moves:moves.slice(0,6),
    shiny: Math.random()<0.003,
    gender: Math.random()<0.5?'m':'f',
  };
}
function startWildBattle(speciesId, level){
  battleState={
    type:'wild',
    enemy:createHakko(speciesId, level),
    playerDeck:playerData.deck.slice(0,5),
    activePlayerIndex:playerData.deck.findIndex(h=>h.currentHp>0),
    turn:0,
    log:['A wild '+hakkoSpecies[speciesId].name+' appeared!'],
    cooldowns:{},
    captureAttempt:false,
    animating:false,
    animTimer:0,
    attackerIdx:-1,
    defenderIdx:-1,
  };
  if(battleState.activePlayerIndex<0) battleState.activePlayerIndex=0;
  gameState='battle';
}
function startTrainerBattle(trainer){
  battleState={
    type:'trainer',
    enemyDeck:trainer.team.map(t=>createHakko(t.species,t.level)),
    activeEnemyIndex:0,
    playerDeck:playerData.deck.slice(0,5),
    activePlayerIndex:playerData.deck.findIndex(h=>h.currentHp>0),
    turn:0,
    log:[trainer.name+' wants to battle!'],
    cooldowns:{},
    trainer:trainer,
    animating:false,
    animTimer:0,
    attackerIdx:-1,
    defenderIdx:-1,
  };
  if(battleState.activePlayerIndex<0) battleState.activePlayerIndex=0;
  gameState='battle';
}
function applyMove(moveName, attacker, defender){
  const move=movesData[moveName];
  if(!move) return 0;
  let dmg=0;
  if(move.power){
    const atkStat=move.type==='Special'?attacker.stats.spa:attacker.stats.atk;
    const defStat=move.type==='Special'?defender.stats.spd:defender.stats.def;
    dmg=Math.floor(((2*attacker.level/5+2)*move.power*atkStat/defStat)/50+2);
    const mult=getEffectiveness(move.element, hakkoSpecies[defender.species].elements);
    dmg=Math.floor(dmg*mult);
    if(Math.random()<0.0625) dmg=Math.floor(dmg*1.5);
  } else if(move.damage) dmg=move.damage;
  // status effects (simplified)
  if(move.effect && move.effect.includes('burn') && Math.random()<0.1) defender.status='burn';
  else if(move.effect.includes('poison') && Math.random()<0.3) defender.status='poison';
  else if(move.effect.includes('paralyze') && Math.random()<0.1) defender.status='paralysis';
  else if(move.effect.includes('freeze') && Math.random()<0.1) defender.status='freeze';
  else if(move.effect.includes('confuse') && Math.random()<0.1) defender.status='confuse';
  if(dmg) defender.currentHp-=dmg;
  return dmg;
}
function battlePlayerAction(move){
  if(battleState.animating) return;
  const playerHakko=battleState.playerDeck[battleState.activePlayerIndex];
  const enemyHakko=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  if(!playerHakko||playerHakko.currentHp<=0) return;
  const cdKey=playerHakko.id+'_'+move;
  if(battleState.cooldowns[cdKey]>0) return;
  battleState.log=[playerHakko.name+' used '+move+'!'];
  const dmg=applyMove(move, playerHakko, enemyHakko);
  if(dmg>0) battleState.log.push('Dealt '+dmg+' damage.');
  if(movesData[move]&&movesData[move].cooldown) battleState.cooldowns[cdKey]=movesData[move].cooldown;
  // animate attack
  battleState.animating=true; battleState.animTimer=15;
  battleState.attackerIdx=0; battleState.defenderIdx=1; // 0=player,1=enemy
  battleState.pendingDmg=dmg;
  // after animation, continue enemy turn
  setTimeout(()=>{
    if(!battleState) return;
    battleState.animating=false;
    if(enemyHakko.currentHp<=0){
      enemyHakko.currentHp=0;
      battleState.log.push(enemyHakko.name+' fainted!');
      if(battleState.type==='trainer'){
        battleState.activeEnemyIndex++;
        if(battleState.activeEnemyIndex>=battleState.enemyDeck.length) endBattle(true);
        else { battleState.log.push('Enemy sends out '+battleState.enemyDeck[battleState.activeEnemyIndex].name+'!'); drawBattle(); }
      } else if(battleState.type==='wild'){
        endBattle(true, enemyHakko.species);
      }
    } else {
      enemyTurn();
    }
    drawBattle();
  }, 400);
}
function enemyTurn(){
  if(!battleState) return;
  const enemyHakko=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  const playerHakko=battleState.playerDeck[battleState.activePlayerIndex];
  if(!enemyHakko||enemyHakko.currentHp<=0) return;
  const availMoves=enemyHakko.moves.map(m=>m.name).filter(m=>!battleState.cooldowns[enemyHakko.id+'_'+m]);
  if(availMoves.length===0) return;
  const move=availMoves[Math.floor(Math.random()*availMoves.length)];
  battleState.log=['Foe '+enemyHakko.name+' used '+move+'!'];
  const dmg=applyMove(move, enemyHakko, playerHakko);
  if(dmg>0) battleState.log.push('Dealt '+dmg+' damage.');
  if(movesData[move]&&movesData[move].cooldown) battleState.cooldowns[enemyHakko.id+'_'+move]=movesData[move].cooldown;
  // animate
  battleState.animating=true; battleState.animTimer=15;
  battleState.attackerIdx=1; battleState.defenderIdx=0;
  setTimeout(()=>{
    if(!battleState) return;
    battleState.animating=false;
    if(playerHakko.currentHp<=0){
      playerHakko.currentHp=0;
      battleState.log.push(playerHakko.name+' fainted!');
      const nextIdx=playerData.deck.findIndex(h=>h.currentHp>0);
      if(nextIdx>=0){
        battleState.activePlayerIndex=nextIdx;
        battleState.log.push('Go! '+playerData.deck[nextIdx].name+'!');
      } else endBattle(false);
    }
    for(let k in battleState.cooldowns) if(battleState.cooldowns[k]>0) battleState.cooldowns[k]--;
    drawBattle();
  }, 400);
}
function attemptCapture(tesseractId){
  if(battleState.type!=='wild'||battleState.animating) return;
  const enemy=battleState.enemy;
  const tesseract=itemsData[tesseractId];
  if(!tesseract||!tesseract.tesseract) return;
  const maxHp=enemy.stats.maxHp, curHp=enemy.currentHp;
  const chance = ((3*maxHp - 2*curHp) * tesseract.tesseract) / (3*maxHp);
  if(Math.random() < chance){
    captureEnemy(enemy);
  } else {
    battleState.log=['It broke free!'];
    drawBattle();
  }
}
function captureEnemy(enemy){
  if(playerData.deck.length<5){
    playerData.deck.push(enemy);
  } else {
    playerData.storage.push(enemy);
  }
  if(!playerData.codex[enemy.species]) playerData.codex[enemy.species]={seen:true,caught:true,shiny:enemy.shiny};
  else playerData.codex[enemy.species].caught=true;
  battleState.log=[enemy.name+' was caught!'];
  endBattle(true, enemy.species);
}
function endBattle(win, caughtSpecies){
  if(win){
    if(caughtSpecies){
      if(!playerData.codex[caughtSpecies]) playerData.codex[caughtSpecies]={seen:true,caught:true,shiny:false};
      else playerData.codex[caughtSpecies].caught=true;
    }
    for(let h of playerData.deck) if(h.currentHp>0) h.xp+=50;
    playerData.money+=100;
  }
  battleState=null;
  gameState='playing';
}
function drawBattle(){
  if(!battleState) return;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.font='16px monospace';
  const enemy=battleState.type==='wild'?battleState.enemy:battleState.enemyDeck[battleState.activeEnemyIndex];
  const player=battleState.playerDeck[battleState.activePlayerIndex];
  
  // enemy sprite (center top)
  const enemySpriteX=W/2, enemySpriteY=120;
  drawHakko(enemySpriteX, enemySpriteY, enemy.species);
  ctx.fillText(enemy.name+' Lv'+enemy.level, enemySpriteX-40, enemySpriteY-40);
  // HP bar
  const ehpPercent = enemy.currentHp/enemy.stats.maxHp;
  ctx.fillStyle='#555'; ctx.fillRect(enemySpriteX-50, enemySpriteY+20, 100, 10);
  ctx.fillStyle=ehpPercent>0.5?'#0f0':ehpPercent>0.2?'#ff0':'#f00';
  ctx.fillRect(enemySpriteX-50, enemySpriteY+20, 100*ehpPercent, 10);
  
  // player sprite (bottom left)
  const playerSpriteX=150, playerSpriteY=H-150;
  drawHakko(playerSpriteX, playerSpriteY, player.species);
  ctx.fillText(player.name+' Lv'+player.level, playerSpriteX-40, playerSpriteY-40);
  const phpPercent=player.currentHp/player.stats.maxHp;
  ctx.fillStyle='#555'; ctx.fillRect(playerSpriteX-50, playerSpriteY+20, 100, 10);
  ctx.fillStyle=phpPercent>0.5?'#0f0':phpPercent>0.2?'#ff0':'#f00';
  ctx.fillRect(playerSpriteX-50, playerSpriteY+20, 100*phpPercent, 10);
  
  // moves
  const moves=player.moves;
  for(let i=0;i<moves.length;i++){
    ctx.fillStyle='#333'; ctx.fillRect(10, H-150+i*40, 200, 35);
    ctx.fillStyle='#fff'; ctx.fillText((i+1)+'. '+moves[i].name, 20, H-125+i*40);
  }
  // options
  ctx.fillStyle='#aaa'; ctx.font='14px monospace';
  ctx.fillText('[C]apture [R]un', 250, H-20);
  // log
  if(battleState.log.length>0){
    ctx.fillStyle='#fff'; ctx.font='14px monospace';
    ctx.fillText(battleState.log.join(' '), 10, H-200);
  }
}

// ---- DAY/NIGHT ----
function getDayPhase(cycleTime){
  if(cycleTime < DAY_LENGTH){
    if(cycleTime<360) return 'Dawn';
    if(cycleTime<1080) return 'Morning';
    if(cycleTime<1440) return 'Afternoon';
    return 'Evening';
  }
  return 'Night';
}

// ---- INPUT HANDLING ----
let menuOptions=null, menuSelected=0;
function handlePlayingInput(){
  if(menuState) return; // block movement if in menu
  const p = playerData.playerPos;
  let dx=0, dy=0;
  if(keys['ArrowUp']||keys['w']) dy=-1;
  if(keys['ArrowDown']||keys['s']) dy=1;
  if(keys['ArrowLeft']||keys['a']) dx=-1;
  if(keys['ArrowRight']||keys['d']) dx=1;
  if(dx||dy){
    let newX = p.x + dx*4;
    let newY = p.y + dy*4;
    const hw=12, hh=14;
    const corners=[[newX-hw,newY-hh],[newX+hw,newY-hh],[newX-hw,newY+hh],[newX+hw,newY+hh]];
    let blocked=false;
    for(let [cx,cy] of corners){
      const tileX=Math.floor(cx/TILE_SIZE), tileY=Math.floor(cy/TILE_SIZE);
      if(tileX<0||tileX>=MAP_W||tileY<0||tileY>=MAP_H||!isPassable(currentMapData.bg[tileY][tileX])){ blocked=true; break; }
    }
    if(!blocked){
      p.x=clamp(newX,0,MAP_W*TILE_SIZE-1);
      p.y=clamp(newY,0,MAP_H*TILE_SIZE-1);
      p.dir = dx>0?1:dx<0?3:dy>0?2:0;
      // tall grass encounter
      const tileX=Math.floor(p.x/TILE_SIZE), tileY=Math.floor(p.y/TILE_SIZE);
      if(currentMapData.bg[tileY][tileX]===4 && Math.random()<0.05){
        const wildSp = currentMapData.wildSpawns?.[0]?.species || 14;
        startWildBattle(wildSp, rndint(3,6));
      }
    }
  }
  if(keys['Enter']||keys[' ']){
    keys['Enter']=false; keys[' ']=false;
    const tileX=Math.floor(p.x/TILE_SIZE), tileY=Math.floor(p.y/TILE_SIZE);
    // warps
    for(let w of currentMapData.warps){
      if(w.x===tileX && w.y===tileY){
        setPlayerMap(w.targetMap, w.targetX, w.targetY);
        return;
      }
    }
    // NPCs proximity
    for(let n of currentMapData.npcs){
      const nx=n.x*TILE_SIZE+TILE_SIZE/2, ny=n.y*TILE_SIZE+TILE_SIZE/2;
      if(Math.hypot(nx-p.x, ny-p.y)<TILE_SIZE*1.2){
        triggerNPC(n);
        return;
      }
    }
  }
}

// ---- CAMERA ----
function updateCamera(){
  camera.targetX = playerData.playerPos.x - W/2;
  camera.targetY = playerData.playerPos.y - H/2;
  camera.targetX = clamp(camera.targetX, 0, MAP_W*TILE_SIZE - W);
  camera.targetY = clamp(camera.targetY, 0, MAP_H*TILE_SIZE - H);
  camera.x = lerp(camera.x, camera.targetX, 0.2);
  camera.y = lerp(camera.y, camera.targetY, 0.2);
}

// ---- MAIN UPDATES ----
function update(){
  timeTick++;
  if(gameState==='playing'){
    playerData.time += 1/60;
    handlePlayingInput();
    updateCamera();
    // overworld entity movement (simple)
    for(let e of overworldEntities){
      if(Math.random()<0.01) e.x += rndint(-1,1)*4;
      if(Math.random()<0.01) e.y += rndint(-1,1)*4;
      e.x = clamp(e.x, 0, MAP_W*TILE_SIZE);
      e.y = clamp(e.y, 0, MAP_H*TILE_SIZE);
    }
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(gameState==='title'){
    ctx.fillStyle='#112'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffa'; ctx.font='28px monospace'; ctx.fillText('Project Tesseract', 400, 200);
    ctx.font='20px monospace';
    ctx.fillText('[N]ew Game  [L]oad (not yet)', 450, 260);
  }
  else if(gameState==='playing'){
    renderWorld();
    // day/night overlay
    const cycleTime = playerData.time % DAY_CYCLE_LENGTH;
    const phase = getDayPhase(cycleTime);
    let alpha=0, color='#000';
    if(phase==='Night'){alpha=0.35;color='#0a1030';}
    else if(phase==='Evening'){alpha=0.15;color='#ffaa50';}
    else if(phase==='Dawn'){alpha=0.1;color='#ffccaa';}
    if(alpha>0){ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    drawHUD();
    drawDialogueBox();
    if(menuState==='shop') drawShopUI();
  }
  else if(gameState==='battle'){
    drawBattle();
    drawDialogueBox();
  }
}

// ---- GLOBAL INPUT ----
function handleGlobalInput(){
  if(dialogueLines.length>0){ handleDialogueInput(); return; }
  if(menuState==='shop'){ handleShopInput(); return; }
  if(gameState==='battle'){
    const playerHakko = battleState.playerDeck[battleState.activePlayerIndex];
    if(keys['1']){keys['1']=false; if(playerHakko.moves[0]) battlePlayerAction(playerHakko.moves[0].name);}
    if(keys['2']){keys['2']=false; if(playerHakko.moves[1]) battlePlayerAction(playerHakko.moves[1].name);}
    if(keys['3']){keys['3']=false; if(playerHakko.moves[2]) battlePlayerAction(playerHakko.moves[2].name);}
    if(keys['4']){keys['4']=false; if(playerHakko.moves[3]) battlePlayerAction(playerHakko.moves[3].name);}
    if(keys['c']){keys['c']=false;attemptCapture('tesseract_basic');}
    if(keys['r']){keys['r']=false;endBattle(false);}
  }
}

// ---- SAVE / LOAD (unchanged, limited) ----
function newGame(){
  playerData={
    name:'Coal', money:500, deck:[], storage:[], inventory:[{id:'potion',count:3},{id:'tesseract_basic',count:5}],
    codex:{}, scholarRank:0, scholarXp:0, arenaTrophies:[false,false,false,false,false],
    questFlags:{}, fastTravelPoints:[], defeatedTrainers:{}, defeatedTwins:false,
    legendariesCaught:{}, legendariesDefeated:{}, legendaryRespawnTimers:{},
    time:0, currentMap:'village', playerPos:{x:0,y:0,dir:0}, visitedMaps:{},
  };
  setPlayerMap('village', 20, 10); // start at path
  gameState='playing';
}

// ---- STARTUP ----
createMaps();
setPlayerMap('village', 20, 10);
gameState='title';

function gameLoop(){
  update();
  render();
  handleGlobalInput();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
})();
</script>
