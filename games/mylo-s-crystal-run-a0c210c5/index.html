// ── AUDIO ──────────────────────────────────
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playBeep(freq,dur,type='square',vol=0.08,slide=0){
 if(!audioCtx)return;initAudio();
 const t=audioCtx.currentTime;
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);
 if(slide)o.frequency.linearRampToValueAtTime(freq+slide,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(audioCtx.destination);
 o.start(t);o.stop(t+dur);
}
function sfxJump(){playBeep(300,0.1,'square',0.07);playBeep(500,0.08,'square',0.05,0.05)}
function sfxShoot(){playBeep(800,0.06,'square',0.05);playBeep(200,0.04,'square',0.04,-0.05)}

// ── LEVEL GENERATION ───────────────────────
function generateLevel(lvl){
 const lvlWidth=[3200,4200,5200][lvl];
 const platforms=[];
 const enemies=[];
 const collectibles=[];
 const movingPlatforms=[];
 const lockedDoors=[];
 const bgElements=[];

 // Ground + platforms
 const groundY=440;
 const platMinY=180;
 const platMaxY=400;

 // Starting platform
 platforms.push({x:0,y:groundY,w:300,h:100});

 // Generate platforms
 let lastX=200;
 while(lastX<lvlWidth-400){
  const gap=[120,160,100][lvl]+Math.random()*[60,100,140][lvl];
  const px=lastX+gap;
  const py=groundY-Math.random()*[120,200,260][lvl];
  const pw=[100,160,200][lvl]+Math.random()*[40,80,100][lvl];
  const ph=16;
  platforms.push({x:px,y:py,w:pw,h:ph});
  lastX=px+pw;
 }

 // Exit platform
 platforms.push({x:lvlWidth-200,y:groundY,w:200,h:100});

 // Moving platforms for level 3
 if(lvl===2){
  for(let i=0;i<4;i++){
   const mx=800+i*1000+Math.random()*400;
   const my=250+Math.random()*130;
   movingPlatforms.push({x:mx,y:my,w:100,h:14,oy:my,dir:1,range:80,speed:0.8+Math.random()*0.6,axis:'y'});
  }
  for(let i=0;i<2;i++){
   const mx=1500+i*1500;
   const my=300+Math.random()*80;
   movingPlatforms.push({x:mx,y:my,w:100,h:14,ox:mx,dir:1,range:120,speed:0.6+Math.random()*0.4,axis:'x'});
  }
 }

 // Enemies
 const enemyCount=[5,9,14][lvl];
 for(let i=0;i<enemyCount;i++){
  const ep=platforms[2+Math.floor(Math.random()*(platforms.length-4))]||platforms[1];
  if(!ep)continue;
  const ex=ep.x+20+Math.random()*(ep.w-40);
  const ey=ep.y-20;
  let etype='crawler';
  if(lvl>=1&&Math.random()<0.35)etype='drone';
  if(lvl>=2&&Math.random()<0.3)etype='shooter';
  if(Math.random()<0.2)etype='slime';
  enemies.push({type:etype,x:ex,y:ey,dir:Math.random()>0.5?1:-1,timer:0,patrolY:ey});
 }

 // Collectibles - crystals
 const crystalCount=[40,50,55][lvl];
 for(let i=0;i<crystalCount;i++){
  const cp=platforms[1+Math.floor(Math.random()*(platforms.length-2))]||platforms[0];
  collectibles.push({type:'crystal',x:cp.x+10+Math.random()*(cp.w-20),y:cp.y-20-Math.random()*30});
 }

 // Gems
 const gemCount=[8,12,15][lvl];
 for(let i=0;i<gemCount;i++){
  const gp=platforms[2+Math.floor(Math.random()*(platforms.length-3))]||platforms[1];
  collectibles.push({type:'gem',x:gp.x+15+Math.random()*(gp.w-30),y:gp.y-25-Math.random()*20});
 }

 // Power gems (health)
 const healthCount=[2,3,3][lvl];
 for(let i=0;i<healthCount;i++){
  const hp=platforms[3+Math.floor(Math.random()*(platforms.length-4))]||platforms[2];
  collectibles.push({type:'health',x:hp.x+20+Math.random()*(hp.w-40),y:hp.y-25});
 }

 // Ammo
 const ammoCount=[4,5,6][lvl];
 for(let i=0;i<ammoCount;i++){
  const ap=platforms[1+Math.floor(Math.random()*(platforms.length-2))];
  collectibles.push({type:'ammo',x:ap.x+15+Math.random()*(ap.w-30),y:ap.y-25});
 }

 // Keys and locked doors
 const keyCount=[1,2,2][lvl];
 for(let i=0;i<keyCount;i++){
  const kp=platforms[2+i*Math.floor(platforms.length/3)]||platforms[2];
  collectibles.push({type:'key',x:kp.x+kp.w/2,y:kp.y-30});
  // Locked door further ahead
  const doorX=Math.min(kp.x+500+Math.random()*800,lvlWidth-600);
  lockedDoors.push({x:doorX,y:groundY-40,opened:false});
 }

 // Background stalactites
 for(let i=0;i<lvlWidth/80;i++){
  const bx=i*80+Math.random()*40;
  bgElements.push({type:'stalactite',x:bx,y:0,h:60+Math.random()*120});
  if(Math.random()<0.3)bgElements.push({type:'stalagmite',x:bx+20,y:groundY+16,h:30+Math.random()*40});
 }

 return {width:lvlWidth,platforms,enemies,collectibles,movingPlatforms,lockedDoors,bgElements,groundY,exitX:lvlWidth-160};
}

// ── UPDATE ────────────────────────────────
function updateGame(){
 if(gameState===STATE.LEVEL_INTRO){
  levelIntroTimer--;
  if(levelIntroTimer<=0)gameState=STATE.PLAYING;
  return;
 }
 if(gameState!==STATE.PLAYING)return;

 const dt=1;
 const ld=levelData;

 // Shake
 if(shakeTimer>0)shakeTimer--;

 // Camera
 camera.targetX=player.x-W/2;
 camera.targetY=player.y-H/2;
 camera.x+=(camera.targetX-camera.x)*0.15;
 camera.y+=(camera.targetY-camera.y)*0.15;
 camera.x=Math.max(0,Math.min(camera.x,ld.width-W));
 camera.y=Math.max(0,Math.min(camera.y,ld.groundY-H+100));

 // Player movement
 const moveSpeed=4.5;
 if(keys['ArrowLeft']||keys['KeyA']){player.vx=-moveSpeed;player.facingRight=false}
 else if(keys['ArrowRight']||keys['KeyD']){player.vx=moveSpeed;player.facingRight=true}
 else player.vx*=0.7;

 // Jump
 if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&player.onGround){
  player.vy=-11;player.onGround=false;player.stompBounce=false;sfxJump();
 }

 // Shoot
 if(keys['KeyZ']&&player.shootCooldown<=0&&player.ammo>0){
  player.shootCooldown=12;
  player.ammo--;
  const bx=player.facingRight?player.x+player.w:player.x-6;
  const by=player.y+player.h/2-2;
  projectiles.push({x:bx,y:by,vx:player.facingRight?8:-8,life:50});
  sfxShoot();
 }
 if(player.shootCooldown>0)player.shootCooldown--;

 // Gravity
 player.vy+=0.55;
 if(player.vy>14)player.vy=14;

 // Stomp bounce flag
 if(player.stompBounce&&player.vy>0){
  player.vy=-8;player.stompBounce=false;
 }

 // Move player
 player.x+=player.vx;
 player.y+=player.vy;

 // Collision with platforms
 player.onGround=false;
 const allPlats=[...ld.platforms,...ld.movingPlatforms];
 for(const p of allPlats){
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&
     player.y+player.h>p.y&&player.y<p.y+p.h){
   // From above (landing)
   if(player.vy>0&&player.y+player.h-player.vy<=p.y+8){
    player.y=p.y-player.h;
    player.vy=0;
    player.onGround=true;
   }
   // From below
   else if(player.vy<0&&player.y-player.vy>=p.y+p.h-8){
    player.y=p.y+p.h;
    player.vy=1;
   }
   // From left
   else if(player.vx>0&&player.x+player.w-player.vx<=p.x+6){
    player.x=p.x-player.w;
    player.vx=0;
   }
   // From right
   else if(player.vx<0&&player.x-player.vx>=p.x+p.w-6){
    player.x=p.x+p.w;
    player.vx=0;
   }
  }
 }

 // Clamp player in bounds
 if(player.x<0)player.x=0;
 if(player.x>ld.width-player.w)player.x=ld.width-player.w;

 // Fall into pit
 if(player.y>H+100){
  playerDie();
  return;
 }

 // Update invulnerability
 if(player.invulnTimer>0)player.invulnTimer--;

 // Update moving platforms
 for(const mp of ld.movingPlatforms){
  if(mp.axis==='y'){
   mp.y+=mp.dir*mp.speed;
   if(mp.y>mp.oy+mp.range){mp.y=mp.oy+mp.range;mp.dir=-1}
   if(mp.y<mp.oy-mp.range){mp.y=mp.oy-mp.range;mp.dir=1}
  }else{
   mp.x+=mp.dir*mp.speed;
   if(mp.x>mp.ox+mp.range){mp.x=mp.ox+mp.range;mp.dir=-1}
   if(mp.x<mp.ox-mp.range){mp.x=mp.ox-mp.range;mp.dir=1}
  }
 }

 // Update enemies
 for(const en of ld.enemies){
  if(en.dead)continue;
  en.timer++;

  if(en.type==='crawler'){
   en.x+=en.dir*1.2;
   // Check platform edges
   let onPlat=false;
   for(const p of allPlats){
    if(en.x+10>p.x&&en.x+10<p.x+p.w&&en.y+14>=p.y&&en.y+14<=p.y+8){onPlat=true;break}
   }
   if(!onPlat)en.dir*=-1;
   if(Math.random()<0.01)en.dir*=-1;
  }else if(en.type==='drone'){
   en.x+=en.dir*1.5;
   en.y=en.patrolY+Math.sin(en.timer*0.05)*25;
   if(en.x<ld.width*0.1||en.x>ld.width*0.95)en.dir*=-1;
   if(Math.random()<0.02)en.dir*=-1;
  }else if(en.type==='slime'){
   // Bounce in place
   en.y=en.patrolY+Math.abs(Math.sin(en.timer*0.06))*20;
   if(Math.random()<0.015)en.dir*=-1;
   en.x+=en.dir*0.6;
  }else if(en.type==='shooter'){
   en.x+=en.dir*1.0;
   en.y=en.patrolY+Math.sin(en.timer*0.04)*30;
   if(en.x<ld.width*0.1||en.x>ld.width*0.95)en.dir*=-1;
   // Shoot at player
   if(en.timer%90===0&&Math.abs(en.x-player.x)<500){
    const dx=player.x-en.x,dy=player.y-en.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    enemyProjectiles.push({x:en.x+8,y:en.y+8,vx:dx/dist*3,vy:dy/dist*3,life:120});
    playBeep(200,0.04,'sawtooth',0.03);
   }
  }
 }

 // Update projectiles
 for(const p of projectiles){p.x+=p.vx;p.life--}
 projectiles=projectiles.filter(p=>p.life>0&&p.x>camera.x-50&&p.x<camera.x+W+50);

 // Update enemy projectiles
 for(const ep of enemyProjectiles){ep.x+=ep.vx;ep.y+=ep.vy;ep.life--}
 enemyProjectiles=enemyProjectiles.filter(ep=>ep.life>0);

 // Player-enemy collision
 for(const en of ld.enemies){
  if(en.dead)continue;
  const ew=en.type==='crawler'?16:en.type==='slime'?16:14;
  const eh=en.type==='crawler'?12:en.type==='slime'?14:14;
  if(player.x+player.w>en.x&&player.x<en.x+ew&&
     player.y+player.h>en.y&&player.y<en.y+eh){
   if(player.vy>0&&player.y+player.h-player.vy<=en.y+6&&!player.invulnTimer){
    // Stomp!
    en.dead=true;
    player.stompBounce=true;
    player.vy=-6;
    score+=30;
    sfxStomp();
    spawnParticles(en.x+ew/2,en.y+eh/2,'#88ff88',10);
   }else if(!player.invulnTimer){
    // Player takes damage
    playerHurt();
   }
  }
 }

 // Projectile-enemy collision
 for(const p of projectiles){
  for(const en of ld.enemies){
   if(en.dead)continue;
   const ew=en.type==='crawler'?16:en.type==='slime'?16:14;
   const eh=en.type==='crawler'?12:en.type==='slime'?14:14;
   if(p.x>en.x&&p.x<en.x+ew&&p.y>en.y&&p.y<en.y+eh){
    en.dead=true;p.life=0;
    score+=25;
    sfxStomp();
    spawnParticles(en.x+ew/2,en.y+eh/2,'#ffaa44',8);
   }
  }
 }

 // Enemy projectile-player collision
 for(const ep of enemyProjectiles){
  if(ep.life<=0)continue;
  if(ep.x>player.x&&ep.x<player.x+player.w&&ep.y>player.y&&ep.y<player.y+player.h){
   if(!player.invulnTimer){playerHurt();ep.life=0}
  }
 }

 // Collectibles
 for(let i=ld.collectibles.length-1;i>=0;i--){
  const c=ld.collectibles[i];
  const cx=c.x,cy=c.y;
  if(player.x+player.w>cx-8&&player.x<cx+8&&player.y+player.h>cy-8&&player.y<cy+8){
   if(c.type==='crystal'){score+=10;totalCrystals++;sfxCollect();spawnParticles(cx,cy,'#4488ff',5);
    if(totalCrystals%100===0){player.lives++;sfxExtraLife()}
   }else if(c.type==='gem'){score+=50;sfxGem();spawnParticles(cx,cy,'#44ff44',8)}
   else if(c.type==='health'){player.health=Math.min(player.health+1,player.maxHealth);sfxCollect();spawnParticles(cx,cy,'#ff4444',6)}
   else if(c.type==='ammo'){player.ammo+=5;sfxCollect();spawnParticles(cx,cy,'#ffff44',4)}
   else if(c.type==='key'){player.keys++;sfxGem();spawnParticles(cx,cy,'#ffdd00',10)}
   ld.collectibles.splice(i,1);
  }
 }

 // Locked doors
 for(const door of ld.lockedDoors){
  if(door.opened)continue;
  if(player.keys>0&&player.x+player.w>door.x-10&&player.x<door.x+34&&
     player.y+player.h>door.y&&player.y<door.y+40){
   door.opened=true;player.keys--;sfxDoorOpen();
   spawnParticles(door.x+12,door.y+20,'#ffdd00',15);
   // Remove door collision
  }
 }

 // Check exit
 const exitX=ld.exitX,exitY=ld.groundY-40;
 if(player.x+player.w>exitX&&player.x<exitX+24&&player.y+player.h>exitY&&player.y<exitY+40){
  // Check if any locked doors remain unopened
  const allDoorsOpen=ld.lockedDoors.every(d=>d.opened);
  if(allDoorsOpen){
   levelComplete();
  }
 }

 // Update particles
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--}
 particles=particles.filter(p=>p.life>0);
}

function playerHurt(){
 if(player.invulnTimer>0)return;
 player.health--;
 player.invulnTimer=45;
 shakeTimer=12;shakeAmount=6;
 sfxHurt();
 spawnParticles(player.x+player.w/2,player.y+player.h/2,'#ff6666',12);
 if(player.health<=0)playerDie();
}

function playerDie(){
 player.lives--;
 player.health=player.maxHealth;
 shakeTimer=20;shakeAmount=8;
 sfxDie();
 spawnParticles(player.x+player.w/2,player.y+player.h/2,'#ff0000',20);
 if(player.lives<=0){
  gameState=STATE.GAMEOVER;
  stopMusic();
 }else{
  resetPlayer(levelData);
  camera.x=0;camera.y=0;
 }
}

function levelComplete(){
 sfxLevelWin();
 if(level>=2){
  gameState=STATE.VICTORY;
  stopMusic();
  score+=player.lives*200;
 }else{
  level++;
  score+=100;
  initLevel(level);
  gameState=STATE.LEVEL_INTRO;
  levelIntroTimer=60;
  player.health=Math.min(player.health+1,player.maxHealth);
  player.ammo+=5;
 }
}

// ── RENDER ────────────────────────────────
function drawPixelText(text,x,y,size,color='#ffffff',align='left'){
 ctx.fillStyle=color;
 ctx.font=size+'px "Press Start 2P",monospace';
 ctx.textAlign=align;
 ctx.fillText(text,x,y);
}

function drawSprite(spr,x,y,scaleX=1,scaleY=1,alpha=1){
 if(alpha<1)ctx.globalAlpha=alpha;
 ctx.drawImage(spr,x,y,spr.width*scaleX,spr.height*scaleY);
 if(alpha<1)ctx.globalAlpha=1;
}

function drawBlock(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function render(){
 ctx.clearRect(0,0,W,H);

 // Background
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,'#0a0a18');
 grad.addColorStop(0.6,'#111133');
 grad.addColorStop(1,'#1a1a2e');
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 if(gameState===STATE.TITLE){
  renderTitle();
  return;
 }
 if(gameState===STATE.GAMEOVER){
  renderGameOver();
  return;
 }
 if(gameState===STATE.VICTORY){
  renderVictory();
  return;
 }

 const ld=levelData;
 if(!ld)return;

 // Shake offset
 let sx=0,sy=0;
 if(shakeTimer>0){sx=(Math.random()-0.5)*shakeAmount;sy=(Math.random()-0.5)*shakeAmount}

 ctx.save();
 ctx.translate(-Math.floor(camera.x)+sx,-Math.floor(camera.y)+sy);

 // Background stalactites
 for(const bg of ld.bgElements){
  if(bg.x<camera.x-50||bg.x>camera.x+W+50)continue;
  if(bg.type==='stalactite'){
   ctx.fillStyle='#1a1a35';
   ctx.beginPath();ctx.moveTo(bg.x-15,bg.y);ctx.lineTo(bg.x+15,bg.y);ctx.lineTo(bg.x+5,bg.y-bg.h);ctx.fill();
   ctx.fillStyle='#222244';
   ctx.beginPath();ctx.moveTo(bg.x-10,bg.y);ctx.lineTo(bg.x+10,bg.y);ctx.lineTo(bg.x+3,bg.y-bg.h+5);ctx.fill();
  }else{
   ctx.fillStyle='#1a1a35';
   ctx.beginPath();ctx.moveTo(bg.x-10,bg.y);ctx.lineTo(bg.x+10,bg.y);ctx.lineTo(bg.x+3,bg.y+bg.h);ctx.fill();
  }
 }

 // Cave ceiling/floor edges
 drawBlock(0,ld.groundY,W,200,'#1a1a30');
 drawBlock(0,ld.groundY,W,4,'#334466');
 drawBlock(0,0,W,4,'#1a1a30');

 // Platforms
 for(const p of ld.platforms){
  drawBlock(p.x,p.y,p.w,p.h,'#445577');
  drawBlock(p.x,p.y,p.w,3,'#556688');
  drawBlock(p.x,p.y+p.h-3,p.w,3,'#334466');
  // Pixel texture
  for(let tx=p.x;tx<p.x+p.w;tx+=12){
   drawBlock(tx+2,p.y+4,3,3,'#5566aa');
  }
 }

 // Moving platforms
 for(const mp of ld.movingPlatforms){
  drawBlock(mp.x,mp.y,mp.w,mp.h,'#6677aa');
  drawBlock(mp.x,mp.y,mp.w,2,'#8899cc');
  drawBlock(mp.x,mp.y+mp.h-2,mp.w,2,'#445588');
  for(let tx=mp.x;tx<mp.x+mp.w;tx+=10){
   drawBlock(tx+2,mp.y+3,2,2,'#99aadd');
  }
 }

 // Collectibles
 for(const c of ld.collectibles){
  if(c.x<camera.x-30||c.x>camera.x+W+30)continue;
  const bob=Math.sin(Date.now()*0.004+c.x)*2;
  if(c.type==='crystal')drawSprite(sprCrystal,c.x-5,c.y-5+bob,1,1);
  else if(c.type==='gem')drawSprite(sprGem,c.x-6,c.y-7+bob,1,1);
  else if(c.type==='health')drawSprite(sprPowerGem,c.x-5,c.y-6+bob,1,1);
  else if(c.type==='ammo')drawSprite(sprAmmo,c.x-5,c.y-6+bob,1,1);
  else if(c.type==='key')drawSprite(sprKey,c.x-7,c.y-7+bob,1,1);
 }

 // Locked doors
 for(const door of ld.lockedDoors){
  if(door.opened)continue;
  if(door.x<camera.x-50||door.x>camera.x+W+50)continue;
  drawSprite(sprLockedDoor,door.x,door.y,1,1);
 }

 // Exit door
 if(ld.lockedDoors.every(d=>d.opened)){
  drawSprite(sprDoor,ld.exitX,ld.groundY-40,1,1);
 }else{
  const allOpen=ld.lockedDoors.every(d=>d.opened);
  drawSprite(allOpen?sprDoor:sprLockedDoor,ld.exitX,ld.groundY-40,1,1);
 }

 // Enemies
 for(const en of ld.enemies){
  if(en.dead)continue;
  if(en.x<camera.x-40||en.x>camera.x+W+40)continue;
  if(en.type==='crawler')drawSprite(sprCrawler,en.x,en.y,en.dir>0?1:-1,1);
  else if(en.type==='drone')drawSprite(sprDrone,en.x,en.y,1,1);
  else if(en.type==='slime')drawSprite(sprSlime,en.x,en.y,1,1);
  else if(en.type==='shooter')drawSprite(sprDrone,en.x,en.y,1,1);
 }

 // Enemy projectiles
 for(const ep of enemyProjectiles){
  if(ep.life<=0)continue;
  drawBlock(ep.x-2,ep.y-2,5,5,'#ff4444');
  drawBlock(ep.x-1,ep.y-1,3,3,'#ff8888');
 }

 // Projectiles
 for(const p of projectiles){
  if(p.life<=0)continue;
  drawSprite(sprProjectile,p.x-3,p.y-2,1,1);
 }

 // Player
 if(gameState===STATE.PLAYING||gameState===STATE.LEVEL_INTRO){
  if(player.invulnTimer>0&&Math.floor(player.invulnTimer/3)%2===0){
   // Blink
  }else{
   const spr=player.facingRight?sprPlayerRight:sprPlayerLeft;
   drawSprite(spr,Math.floor(player.x),Math.floor(player.y),1,1,player.invulnTimer>0?0.5:1);
  }
 }

 // Particles
 for(const p of particles){
  if(p.life<=0)continue;
  const alpha=p.life/35;
  ctx.globalAlpha=alpha;
  drawBlock(p.x-p.size/2,p.y-p.size/2,p.size,p.size,p.color);
 }
 ctx.globalAlpha=1;

 ctx.restore();

 // HUD
 const hudY=8;
 drawBlock(0,0,W,40,'#0a0a18cc');
 drawBlock(0,38,W,2,'#334466');
 drawPixelText('SCORE:'+String(score).padStart(6,'0'),10,hudY+16,11,'#ffcc44');
 drawPixelText('HP:',280,hudY+16,11,'#ff6666');
 for(let i=0;i<player.maxHealth;i++){
  drawBlock(315+i*16,hudY+5,10,10,i<player.health?'#ff4444':'#333');
  drawBlock(317+i*16,hudY+7,6,6,i<player.health?'#ff8888':'#222');
 }
 drawPixelText('LIVES:'+player.lives,410,hudY+16,11,'#44ff44');
 drawPixelText('💎'+totalCrystals,560,hudY+16,11,'#66aaff');
 drawPixelText('🔑'+player.keys,690,hudY+16,11,'#ffdd00');
 drawPixelText('⚡'+player.ammo,800,hudY+16,11,'#ffff44');
 drawPixelText('LVL'+(level+1),910,hudY+16,11,'#ffffff');

 // Level intro overlay
 if(gameState===STATE.LEVEL_INTRO){
  ctx.fillStyle='#000000aa';ctx.fillRect(0,0,W,H);
  drawPixelText('LEVEL '+(level+1),W/2,H/2-30,28,'#ffcc44','center');
  drawPixelText('GET READY!',W/2,H/2+20,16,'#ffffff','center');
 }
}

function renderTitle(){
 // Animated background
 ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,W,H);
 for(let i=0;i<20;i++){
  const bx=(i*55+Date.now()*0.02)%(W+100)-50;
  ctx.fillStyle='#1a1a35';
  ctx.beginPath();ctx.moveTo(bx-20,H);ctx.lineTo(bx+20,H);ctx.lineTo(bx+5,H-80-Math.sin(i+Date.now()*0.003)*20);ctx.fill();
 }

 // Title
 const titleY=150;
 drawPixelText("MYLO'S",W/2,titleY,36,'#ff8833','center');
 drawPixelText('CRYSTAL RUN',W/2,titleY+50,32,'#ffcc44','center');

 // Subtitle
 drawPixelText('A Space Prospector Adventure',W/2,titleY+100,9,'#aaaacc','center');

 // Decorative sprites
 const t=Date.now();
 drawSprite(sprPlayerRight,W/2-12,titleY-80,2,2);
 drawSprite(sprCrystal,W/2-80,titleY+130+Math.sin(t*0.003)*8,1.5,1.5);
 drawSprite(sprGem,W/2-20,titleY+140+Math.sin(t*0.004+1)*8,1.5,1.5);
 drawSprite(sprPowerGem,W/2+40,titleY+135+Math.sin(t*0.0035+2)*8,1.5,1.5);

 // Controls info
 drawPixelText('ARROWS = MOVE',W/2,300,9,'#8888aa','center');
 drawPixelText('SPACE = JUMP',W/2,320,9,'#8888aa','center');
 drawPixelText('Z = SHOOT LASER',W/2,340,9,'#8888aa','center');
 drawPixelText('JUMP ON ENEMIES TO STOMP!',W/2,370,9,'#ffaa66','center');

 // Blink prompt
 if(Math.floor(t/600)%2===0){
  drawPixelText('PRESS SPACE TO START',W/2,430,14,'#ffffff','center');
 }

 // High score tease
 drawPixelText('3 CAVES TO CONQUER',W/2,470,9,'#6666aa','center');
}

function renderGameOver(){
 ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);
 drawPixelText('GAME OVER',W/2,180,36,'#ff4444','center');
 drawPixelText('FINAL SCORE: '+score,W/2,250,14,'#ffcc44','center');
 drawPixelText('CRYSTALS: '+totalCrystals,W/2,290,11,'#66aaff','center');
 drawPixelText('LEVEL REACHED: '+(level+1),W/2,320,11,'#ffffff','center');
 if(Math.floor(Date.now()/600)%2===0){
  drawPixelText('PRESS SPACE TO RESTART',W/2,420,14,'#ffffff','center');
 }
}

function renderVictory(){
 ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);

 // Celebration particles
 const t=Date.now();
 for(let i=0;i<30;i++){
  const px=W/2+Math.cos(t*0.002+i*0.4)*200+Math.sin(t*0.003+i)*50;
  const py=200+Math.sin(t*0.003+i*0.7)*100;
  const colors=['#ffcc00','#ff8844','#44ff44','#4488ff','#ff44ff'];
  drawBlock(px,py,4,4,colors[i%colors.length]);
 }

 drawPixelText('CONGRATULATIONS!',W/2,140,30,'#ffcc44','center');
 drawPixelText('YOU ESCAPED THE CRYSTAL CAVES!',W/2,190,10,'#ffffff','center');
 drawPixelText('FINAL SCORE: '+score,W/2,250,16,'#ffcc44','center');
 drawPixelText('CRYSTALS: '+totalCrystals,W/2,290,11,'#66aaff','center');
 drawPixelText('LIVES LEFT: '+player.lives+' (BONUS: +'+player.lives*200+')',W/2,320,9,'#44ff44','center');
 drawPixelText('THANKS FOR PLAYING!',W/2,390,12,'#ffaa66','center');

 drawSprite(sprPlayerRight,W/2-12,410,3,3);

 if(Math.floor(t/600)%2===0){
  drawPixelText('PRESS SPACE TO PLAY AGAIN',W/2,500,11,'#ffffff','center');
 }
}

// ── MAIN LOOP ─────────────────────────────
function gameLoop(){
 updateGame();
 render();
 requestAnimationFrame(gameLoop);
}

// ── START / RESTART ───────────────────────
function startGame(){
 score=0;
 lives=3;
 totalCrystals=0;
 level=0;
 player.health=player.maxHealth;
 player.ammo=10;
 player.lives=3;
 player.keys=0;
 initLevel(0);
 gameState=STATE.LEVEL_INTRO;
 levelIntroTimer=50;
 shakeTimer=0;
 initAudio();
 startMusic();
}

// Key handler for screens
window.addEventListener('keydown',function handler(e){
 if(e.code==='Space'){
  if(gameState===STATE.TITLE){
   startGame();
   e.preventDefault();
  }else if(gameState===STATE.GAMEOVER||gameState===STATE.VICTORY){
   startGame();
   e.preventDefault();
  }
 }
});

// Initial setup
initLevel(0);
gameState=STATE.TITLE;

// Start loop
gameLoop();

})();
</script>
